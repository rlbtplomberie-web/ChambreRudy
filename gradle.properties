org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# L'outil qui assemble le code cherchait le fichier d'Android a l'interieur du
# dossier d'un module, et s'y perdait : « android.jar is located outside the
# root directory ». Avec ce reglage, il travaille sur le projet entier.
android.useFullClasspathForDexingTransform=true
