org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# L'outil qui assemble le code se perdait : « android.jar is located outside
# the root directory ». Le reglage precedent, cense le remettre sur la voie,
# n'a rien change — Mupen64Plus a ete ecarte de trois compilations d'affilee.
#
# On prend donc l'autre chemin : au lieu d'assembler chaque morceau dans son
# coin, il assemble le projet d'un seul tenant. Il ne cherche alors plus le
# fichier d'Android dans le dossier d'un module, et la question ne se pose
# plus. C'est un peu plus lent, mais cela concerne une seule compilation.
android.enableDexingArtifactTransform=false

# Plus de memoire : Mupen64Plus apporte beaucoup de classes d'un coup.
org.gradle.daemon=false
