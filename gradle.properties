org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# L'outil qui assemble le code se perdait : « android.jar is located outside
# the root directory ». Le reglage ci-dessous est celui qu'Android recommande
# lui-meme dans son message d'erreur.
#
# J'avais essaye l'autre chemin, « enableDexingArtifactTransform=false » :
# c'etait une erreur. Ce reglage a ete SUPPRIME d'Android depuis la version
# 8.3 du greffon, et il faisait echouer toute la compilation, N64 ou pas.
android.useFullClasspathForDexingTransform=true
