  }
}
function drawCrate(c){
  const sx = c.shake>0 ? Math.sin(c.shake*80)*4 : 0, d = depth(c.y);
  ctx.save(); ctx.translate(c.x + sx, c.y); ctx.scale(d, d);
  ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.beginPath(); ctx.ellipse(4, 2, 46, 10, 0, 0, Math.PI*2); ctx.fill();
  const w = 72, h = 60;
  ctx.fillStyle = '#9a6a36'; ctx.beginPath(); ctx.moveTo(-w/2, -h); ctx.lineTo(-w/2+12, -h-12); ctx.lineTo(w/2+12, -h-12); ctx.lineTo(w/2, -h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2e1a08'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#5e3a1a'; ctx.beginPath(); ctx.moveTo(w/2, -h); ctx.lineTo(w/2+12, -h-12); ctx.lineTo(w/2+12, -12); ctx.lineTo(w/2, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  const g = ctx.createLinearGradient(0, -h, 0, 0); g.addColorStop(0, '#8a5a2a'); g.addColorStop(1, '#5f3c1b');
  ctx.fillStyle = g; ctx.fillRect(-w/2, -h, w, h); ctx.strokeRect(-w/2, -h, w, h);
  ctx.strokeStyle = '#3b230c'; ctx.lineWidth = 1.5;
  for (let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(-w/2, -h + i*h/4); ctx.lineTo(w/2, -h + i*h/4); ctx.stroke(); }
  ctx.strokeStyle = '#4a2c10'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-w/2+6, -6); ctx.lineTo(w/2-6, -h+6); ctx.stroke();
  // un peu de mousse : la caisse est dans la forêt depuis longtemps
  ctx.fillStyle = 'rgba(90,140,60,0.75)'; ctx.beginPath(); ctx.ellipse(-w/2+10, -h-2, 14, 5, 0, 0, Math.PI*2); ctx.ellipse(w/2-4, -h-8, 10, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#7d848c'; for (const [px,py] of [[-w/2,-h],[w/2-8,-h],[-w/2,-8],[w/2-8,-8]]) ctx.fillRect(px, py, 8, 8);
  if (c.hp===1){ ctx.strokeStyle = '#1e0f02'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-10,-h); ctx.lineTo(-2,-h+20); ctx.lineTo(-12,-h+34); ctx.stroke(); }
  ctx.restore();
}
function drawChicken(ch){
  const bob = Math.sin(ch.t*5)*3, d = depth(ch.y);
  ctx.save(); ctx.translate(ch.x, ch.y); ctx.scale(d, d);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, 2, 34, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.translate(0, -16 + bob);
  const hg = ctx.createRadialGradient(0,-6,4,0,-6,52); hg.addColorStop(0,'rgba(255,240,170,0.45)'); hg.addColorStop(1,'rgba(255,240,170,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0,-6,52,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#e8e3da'; ctx.beginPath(); ctx.ellipse(0, 10, 40, 10, 0, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#a99f90'; ctx.lineWidth = 2; ctx.stroke();
  const g = ctx.createRadialGradient(-8,-14,4,0,-4,34); g.addColorStop(0,'#f7c46a'); g.addColorStop(0.6,'#c97a2a'); g.addColorStop(1,'#8a4a14');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -4, 30, 18, 0, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#6a3410'; ctx.stroke();
  for (const s of [-1,1]){
    ctx.fillStyle = '#b8682a'; ctx.beginPath(); ctx.ellipse(s*22, -12, 11, 8, s*0.6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#f4ecdc'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(s*28, -18); ctx.lineTo(s*36, -26); ctx.stroke();
    ctx.fillStyle = '#f4ecdc'; ctx.beginPath(); ctx.arc(s*37, -27, 3.5, 0, Math.PI*2); ctx.arc(s*35, -29, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#6a3410'; ctx.lineWidth = 2;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(-8, -12, 9, 4, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ------------------------------------------------------------- HUD
function bar(x, y, w, h, v, col, label, right){
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x-3, y-3, w+6, h+6);
  ctx.fillStyle = '#1d2a14'; ctx.fillRect(x, y, w, h);
  const g = ctx.createLinearGradient(0, y, 0, y+h); g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
  ctx.fillStyle = g;
  const ww = w*clamp(v, 0, 1);
  ctx.fillRect(right ? x+w-ww : x, y, ww, h);
  ctx.strokeStyle = '#b9cf8a'; ctx.lineWidth = 2; ctx.strokeRect(x-1, y-1, w+2, h+2);
  if (label){ ctx.font = '700 15px Georgia,serif'; ctx.fillStyle = '#eaf5d0'; ctx.textAlign = right ? 'right' : 'left'; ctx.fillText(label, right ? x+w : x, y-8); }
}
function drawHUD(){
  const m = MAPS[game.map];
  bar(20, 34, 280, 18, rudy.hp/RUDY_MAX, ['#7dff8a','#1f9a33'], PVX>1?'RUDY \u00d72':'RUDY', false);
  const full = rudy.en >= 100, full2 = rudy.en >= 200, fl = Math.floor(game.t*6)%2;
  bar(20, 66, 200, 10, Math.min(1, rudy.en/100), (full && !full2 && fl) ? ['#ffffff','#ffe14a'] : ['#fff27a','#e0a800'], '', false);
  if (rudy.en > 100){ // 2e niveau : la barre se remplit de rouge par-dessus
    const g = ctx.createLinearGradient(0, 66, 0, 76); g.addColorStop(0, full2 && fl ? '#ffffff' : '#ff7a6a'); g.addColorStop(1, '#c0101a');
    ctx.fillStyle = g; ctx.fillRect(20, 66, 200*Math.min(1, (rudy.en-100)/100), 10);
    if (full2){ ctx.save(); ctx.strokeStyle = 'rgba(255,80,60,0.9)'; ctx.lineWidth = 1.5; ctx.beginPath(); let px = 20;
      ctx.moveTo(px, 64); for (let i=0;i<14;i++){ px += 15; ctx.lineTo(px, 62 + Math.random()*16); } ctx.stroke(); ctx.restore(); }
  }
  ctx.font = '700 13px Georgia,serif'; ctx.textAlign = 'left'; ctx.fillStyle = full2 ? '#ff6a5a' : full ? '#ffe14a' : '#d9e6b8';
  ctx.fillText(full2 ? 'SUPER BOULE PRÊTE !' : full ? 'ÉNERGIE PRÊTE ! (continue pour la super boule)' : 'ÉNERGIE', 228, 76);
  if (m.boss && game.boss){
    const b = game.boss;
    const lbl = game.phase===1 ? 'LE CENTAURE' : 'LA ROUSSE';
    bar(W-320, 34, 300, 18, b.hp/b.K.hp, game.phase===1 ? ['#ffb36a','#a0501a'] : ['#ff5a6a','#9a0f20'], lbl, true);
    // pastilles : 2 barres de vie
    for (let i=0;i<2;i++){ ctx.fillStyle = (i < 2-game.phase+1) ? '#ff6a5a' : '#3a2a2a'; ctx.beginPath(); ctx.arc(W-330 - i*16, 43, 6, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#b9cf8a'; ctx.lineWidth = 1.5; ctx.stroke(); }
  } else {
    ctx.font = '700 18px Georgia,serif'; ctx.textAlign = 'right'; ctx.fillStyle = '#eaf5d0';
    ctx.fillText('Ennemies battues : ' + Math.min(game.kills, KILLS_PER_MAP[game.map]) + ' / ' + KILLS_PER_MAP[game.map], W-20, 50);
  }
  if (game.goShown && !m.boss && !atExit()){
    const p = (Math.sin(game.t*7)+1)/2;
    ctx.save(); ctx.translate(W-120 + p*18, 170);
    ctx.font = '62px serif'; ctx.textAlign = 'center'; ctx.fillText('👉', 0, 0);
    ctx.font = '900 46px Impact,Arial Black,sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = '#130'; ctx.strokeText('GO', -6, 52); ctx.fillStyle = '#ffd34a'; ctx.fillText('GO', -6, 52);
    ctx.restore();
  }
  if (rudy.st==='grabbed' || rudy.st==='tied'){
    const p = Math.floor(game.t*8)%2;
    const txt = rudy.st==='tied' ? 'TU ES ATTACHÉ ! APPUIE VITE !' : 'APPUIE VITE POUR T\'ÉCHAPPER !';
    ctx.font = '900 30px Impact,Arial Black,sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(txt, W/2, 130);
    ctx.fillStyle = p ? '#ff4b5c' : '#fff'; ctx.fillText(txt, W/2, 130);
    bar(W/2-120, 150, 240, 12, rudy.mash/rudy.need, ['#fff1a0','#e0a020'], '', false);
  }
  if (game.banner > 0){
    const a = Math.min(1, game.banner, (2.8-game.banner)*3);
    ctx.save(); ctx.globalAlpha = a;
    const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(5,15,8,0)'); g.addColorStop(0.5, 'rgba(5,15,8,0.75)'); g.addColorStop(1, 'rgba(5,15,8,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 206, W, 74);
    ctx.font = '700 34px Georgia,serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#d8f0a8';
    ctx.fillText(game.bannerText, W/2, 254);
    ctx.restore();
  }
  drawControls();
}
function drawControls(){
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = 'rgba(10,20,10,0.5)'; ctx.strokeStyle = '#b9cf8a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(STICK.cx, STICK.cy, STICK.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b9cf8a'; ctx.beginPath(); ctx.arc(STICK.cx+STICK.dx, STICK.cy+STICK.dy, 30, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.78;
  for (const k in BTN){
    const b = BTN[k];
    let label = b.label;
    const exit = k==='punch' && atExit();
    if (exit) label = 'ENTRER';
    if (k==='energy'){
      const en = rudy ? rudy.en : 0, full = en >= 100, full2 = en >= 200, bl = Math.floor(game.t*5)%2;
      ctx.fillStyle = full2 ? (bl ? '#e83020' : '#901010') : full ? (bl ? '#e8b800' : '#a87800') : 'rgba(40,40,10,0.7)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#b9cf8a'; ctx.stroke();
      if (!full2){ ctx.strokeStyle = full ? '#ff4a3a' : '#ffe14a'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(b.x, b.y, b.r-4, -Math.PI/2, -Math.PI/2 + Math.PI*2*((en%100)/100)); ctx.stroke(); ctx.lineWidth = 3; }
      ctx.fillStyle = '#f4f9e0'; ctx.font = '800 12px Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, b.x, b.y);
      continue;
    }
    if (k==='dash'){
      const cd = rudy && rudy.dashCD>0 ? rudy.dashCD/2 : 0, on = rudy && rudy.dashT>0;
      ctx.fillStyle = on ? '#2a7ab8' : (cd>0 ? 'rgba(20,30,45,0.7)' : 'rgba(20,55,90,0.85)');
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#b9cf8a'; ctx.stroke();
      if (cd>0){ ctx.strokeStyle = '#8fd0ff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(b.x, b.y, b.r-4, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1-cd)); ctx.stroke(); ctx.lineWidth = 3; }
      ctx.fillStyle = '#f4f9e0'; ctx.font = '800 14px Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('DASH', b.x, b.y);
      continue;
    }
    ctx.fillStyle = exit ? (Math.floor(game.t*4)%2 ? '#d48a00' : '#8a4e00') : (b.down ? '#2f6a1a' : 'rgba(20,45,20,0.8)');
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#b9cf8a'; ctx.stroke();
    ctx.fillStyle = '#f4f9e0'; ctx.font = `800 ${label.length>6?13:16}px Arial,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, b.x, b.y);
  }
  ctx.restore(); ctx.textBaseline = 'alphabetic';
}
function drawTitle(){
  BGR.draw('bg1', 300, game.t, 0, 0, 0);
  const g0 = ctx.createLinearGradient(0, 0, 0, H); g0.addColorStop(0, 'rgba(0,5,10,0.55)'); g0.addColorStop(1, 'rgba(0,5,0,0.75)');
  ctx.fillStyle = g0; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.font = '900 56px Georgia,serif'; ctx.lineWidth = 9; ctx.strokeStyle = '#1a0c03';
  ctx.strokeText('LA GROTTE DU DIAMANT CUIVRÉ', W/2, 150);
  const g = ctx.createLinearGradient(0,95,0,160); g.addColorStop(0,'#ffe2b8'); g.addColorStop(1,'#c86a1e');
  ctx.fillStyle = g; ctx.fillText('LA GROTTE DU DIAMANT CUIVRÉ', W/2, 150);
  ctx.font = 'italic 22px Georgia,serif'; ctx.fillStyle = '#d9ecbf';
  ctx.fillText('Rudy contre les gardiennes du diamant cuivré', W/2, 192);
  drawFrame('r_punch', 0, 220, 500, 1, 1, 1.05);
  drawFrame('elf_run', Math.floor(game.t*8)%8, 760, 500, -1, 1, 1);
  if (Math.floor(game.t*2)%2===0){ ctx.font = '700 28px Georgia,serif'; ctx.fillStyle = '#fff'; ctx.fillText('Touche l\'écran pour commencer', W/2, 300); }
  ctx.font = '15px Arial,sans-serif'; ctx.fillStyle = '#c3d6a3';
  ctx.fillText('Clavier : flèches = bouger · J = poing · K = pied · L = feu · I = énergie · Maj = dash', W/2, 528);
}
function drawEnd(win){
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.font = '900 70px Georgia,serif'; ctx.lineWidth = 8; ctx.strokeStyle = '#000';
  const t = win ? 'VICTOIRE !' : 'GAME OVER';
  ctx.strokeText(t, W/2, 220); ctx.fillStyle = win ? '#ffd34a' : '#ff3b4b'; ctx.fillText(t, W/2, 220);
  ctx.font = '24px Georgia,serif'; ctx.fillStyle = '#e6f2cf';
  if (win) ctx.fillText('Les gardiennes de la grotte sont vaincues !', W/2, 270);
  else if (game.vaviel) ctx.fillText('Rudy se réveille devant l\'hôpital de Vaviel…', W/2, 270);
  drawBtn(W/2-130, 340, 'REJOUER');
  if (!win) drawBtn(W/2+130, 340, 'RÉESSAYER LA CARTE');
}
function drawBtn(x, y, label){
  ctx.fillStyle = '#1f4a1a'; ctx.strokeStyle = '#b9cf8a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x-115, y-30, 230, 60, 14) : ctx.rect(x-115, y-30, 230, 60); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f4f9e0'; ctx.font = '800 17px Arial,sans-serif'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y); ctx.textBaseline = 'alphabetic';
}
function tapScreen(p){
  if (game.state==='title'){ if (loaded>=total) startMap(0); return; }
  if (game.state==='over' || game.state==='win'){
    if (p.key){ startMap(game.state==='over' ? game.map : 0); return; }
    if (Math.abs(p.y-340) < 40){
      if (p.x < W/2) startMap(0);
      else if (game.state==='over') startMap(game.map);
    }
  }
}

// =====================================================================
//  BOUCLE
// =====================================================================
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  // lancé depuis Vaviel (après la vidéo) : pas d'écran titre, le combat commence tout de suite
  if (game.state==='title' && DIRECT && loaded>=total){ audio(); startMap(0); }
  if (game.state==='title'){
    game.t += dt;
    game.gustT -= dt; if (game.gustT<=0){ game.gustT = 4+Math.random()*6; game.gustAim = 0.6+Math.random()*0.8; }
    game.gust = lerp(game.gust, game.gustT>2.5 ? (game.gustAim||0) : 0, dt*1.5);
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    if (loaded>=total) drawTitle();
    else { ctx.font='22px Georgia,serif'; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText('Chargement… '+Math.round(loaded/total*100)+' %', W/2, H/2); }
  } else {
    if (!window.PAUSE) update(dt);
    drawWorld(); drawHUD();
    if (game.state==='over') drawEnd(false);
    if (game.state==='win') drawEnd(true);
  }
  if (game.fade>0){ ctx.fillStyle = `rgba(0,0,0,${game.fade})`; ctx.fillRect(0,0,W,H); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
