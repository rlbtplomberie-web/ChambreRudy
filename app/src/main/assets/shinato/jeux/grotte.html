function resize(){

  scale = Math.min(innerWidth/W, innerHeight/H);
  cv.style.width = (W*scale)+'px'; cv.style.height = (H*scale)+'px';

function depth(y){ const m = MAPS[game.map]; return 0.9 + 0.1*Math.max(0, Math.min(1, (y-m.yMin)/(m.yMax-m.yMin))); }

// dessine l'image n de la feuille k ; (x,y) = point au sol ; face = 1 droite / -1 gauche
function drawFrame(k, n, x, y, face, alpha, sc, jig){
  const s = SPR[k]; if (!s) return;
  const fr = s.f[Math.max(0, Math.min(n|0, s.f.length-1))];
  const [sx, sy, sw, sh, ax, gy] = fr;
  sc = sc||1;
  ctx.save();
  if (alpha!=null && alpha<1) ctx.globalAlpha = Math.max(0, alpha);
  ctx.translate(Math.round(x), Math.round(y));
  if (s.dir !== face) ctx.scale(-1,1);
  const k2 = sc/Q;
  ctx.drawImage(IMG[k], sx, sy, sw, sh, -ax*k2, -(sh+gy)*k2, sw*k2, sh*k2);
  if (jig) drawChest(k, n, jig, k2, ax, sh, gy);
  ctx.restore();
}


// ---------- disparition en étoiles ----------
function spriteCanvas(k, n, face, d){
  const s = SPR[k], fr = s.f[Math.max(0, Math.min(n|0, s.f.length-1))], [sx, sy, sw, sh, ax, gy] = fr, k2 = d/Q;
  const w = Math.ceil(sw*k2)+2, h = Math.ceil(sh*k2)+2, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); const flip = s.dir !== face;
  x.save(); if (flip){ x.translate(w, 0); x.scale(-1, 1); } x.drawImage(IMG[k], sx, sy, sw, sh, 1, 1, sw*k2, sh*k2); x.restore();
  const ox = flip ? -(sw-ax)*k2 - 1 : -ax*k2 - 1, oy = -(sh+gy)*k2 - 1;   // coin haut-gauche par rapport au point au sol
  const t = document.createElement('canvas'); t.width = w; t.height = h; const tx = t.getContext('2d');
  tx.drawImage(c, 0, 0); tx.globalCompositeOperation = 'source-in'; tx.fillStyle = '#2f9dff'; tx.fillRect(0, 0, w, h);
  let pts = []; try { const D = x.getImageData(0, 0, w, h).data; for (let yy=0; yy<h; yy+=3) for (let xx=0; xx<w; xx+=3) if (D[(yy*w+xx)*4+3] > 140) pts.push([xx, yy]); } catch(err){}
  return {c, t, ox, oy, w, h, pts};
}
function startVanish(e){
  let sh = e.kind+'_atk', n = 0;
  if (e.st==='attack'){ sh = e.kind+(e.atkS||'_atk'); n = e.fr; } else if (e.st==='walk' && e.moving){ sh = e.kind+'_run'; n = e.fr; }
  e.st = 'vanish'; e.t = 0; e.hpShow = 0; e.vs = spriteCanvas(sh, n, e.face, depth(e.y)); e.vsp = 0;
  SFX.big(); game.shake = 0.12;
}
function updateVanish(e, dt){
  const V = e.vs, T = e.t;
  // les étoiles partent de la silhouette, du haut vers le bas, pendant qu'elle s'efface
  if (T > 0.35 && V.pts.length){
    const p = Math.min(1, (T-0.35)/0.75), want = Math.floor(p*110);
    while (e.vsp < want){ e.vsp++;
      const q = V.pts[Math.floor(Math.random()*V.pts.length)];
      game.parts.push({type:'star', x:e.x+V.ox+q[0], y:e.y+V.oy+q[1], vx:(Math.random()-0.5)*70, vy:-40-Math.random()*90, t:0, life:0.9+Math.random()*0.9, s:2.5+Math.random()*4.5, ph:Math.random()*6, rot:Math.random()*3});
    }
  }
  if (T > 1.15){ e.dead = true; e.alpha = 0; game.kills++; }
}
function drawVanish(e){
  const V = e.vs, T = e.t, x = e.x+V.ox, y = e.y+V.oy;
  const glow = Math.min(1, T/0.35), fade = T < 0.35 ? 1 : Math.max(0, 1-(T-0.35)/0.7);
  ctx.save(); ctx.globalAlpha = fade*(1-glow*0.6); ctx.drawImage(V.c, x, y); ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.9*glow*fade; ctx.shadowColor = '#3aa8ff'; ctx.shadowBlur = 24*glow; ctx.drawImage(V.t, x, y);
  ctx.globalCompositeOperation = 'lighter'; ctx.shadowBlur = 0; ctx.globalAlpha = 0.35*glow*fade; ctx.drawImage(V.t, x, y);
  ctx.restore();
}
function drawStar(p){
  const a = Math.min(1, (p.life-p.t)/0.5) * (0.6 + 0.4*Math.sin(p.t*18 + p.ph)), r = p.s*(1 - 0.3*p.t/p.life);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.t*1.5); ctx.globalAlpha = Math.max(0, a);
  ctx.fillStyle = '#bfe9ff'; ctx.shadowColor = '#4fb8ff'; ctx.shadowBlur = 10;
  ctx.beginPath(); for (let i=0;i<8;i++){ const rr = i%2 ? r*0.32 : r; const an = i*Math.PI/4; ctx.lineTo(Math.cos(an)*rr, Math.sin(an)*rr); } ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, r*0.25, 0, Math.PI*2); ctx.fill(); ctx.restore();
}
// ---------- poitrine animée : la zone de la poitrine est redessinée avec un léger rebond (ressort amorti) ----------
const JC = document.createElement('canvas'), JX = JC.getContext('2d');
function drawChest(k, n, jig, k2, ax, sh, gy){
  const s = SPR[k]; if (!s || !s.ch) return; const c = s.ch[Math.max(0, Math.min(n|0, s.ch.length-1))]; if (!c || !jig) return;
  const [sx, sy] = s.f[Math.max(0, Math.min(n|0, s.f.length-1))];
  const r = c[2], w = Math.ceil(r*2.6), h = Math.ceil(r*2.3), dy = jig.y*r*0.22, sq = 1 + jig.y*0.035;
  if (Math.abs(dy) < 0.15) return;
  if (JC.width !== w || JC.height !== h){ JC.width = w; JC.height = h; } else JX.clearRect(0, 0, w, h);
  JX.globalCompositeOperation = 'source-over';
  JX.drawImage(IMG[k], sx + c[0] - w/2, sy + c[1] - h/2 - dy, w, h, 0, 0, w, h);
  JX.globalCompositeOperation = 'destination-in';
  const g = JX.createRadialGradient(w/2, h/2, 0, w/2, h/2, r*1.15);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.62, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  JX.save(); JX.translate(w/2, h/2); JX.scale(1, 0.86); JX.translate(-w/2, -h/2); JX.fillStyle = g; JX.fillRect(0, 0, w, h); JX.restore();
  const X = (-ax + c[0] - w/2)*k2, Y = (-(sh+gy) + c[1] - h/2)*k2;
  ctx.save(); ctx.translate(X + w*k2/2, Y + h*k2/2); ctx.scale(1, sq); ctx.drawImage(JC, -w*k2/2, -h*k2/2, w*k2, h*k2); ctx.restore();
}
function jigUpdate(e, dt){
  const J = e.jig || (e.jig = {y:0, v:0, last:-1});
  const fi = Math.floor(e.fr||0);
  if (fi !== J.last){ J.last = fi; J.v += (e.st==='walk' ? 9 : 16) * (Math.random()<0.5 ? 1 : 0.7); }
  J.v += (-130*J.y - 5.2*J.v)*dt; J.y += J.v*dt; J.y = Math.max(-1.4, Math.min(1.4, J.y));
}
function nf(k){ return SPR[k] ? SPR[k].f.length : 1; }
function frameH(k, n){ const s = SPR[k]; const f = s.f[Math.min(n|0, s.f.length-1)]; return (f[3]+f[5])/Q; }

// =====================================================================
//  DÉCOR ANIMÉ (WebGL : feuillages et branches qui bougent au vent)
// =====================================================================
const BGR = (function(){
  const c = document.createElement('canvas');
  let gl = null, prog, tex = {}, ok = false, curMap = null, uni = {};
  try { gl = c.getContext('webgl', {premultipliedAlpha:false, preserveDrawingBuffer:true}); } catch(e){}
  const VS = 'attribute vec2 p; varying vec2 v; void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }';
  const FS = `precision mediump float; varying vec2 v; uniform sampler2D img, msk; uniform float t, cam, ww, gust;
    void main(){
      float gx = cam + v.x*960.0; float gy = (1.0-v.y)*540.0;
      vec2 uv = vec2(gx/ww, gy/540.0);
      float m = texture2D(msk, uv).r;
      float hgt = 1.0 - gy/540.0;
      float w = sin(t*1.25 + gy*0.018 + gx*0.0045)*0.55 + sin(t*2.3 + gx*0.013 + gy*0.03)*0.25 + gust*(0.6+0.4*sin(t*4.0+gx*0.02));
      float ox = m * w * (2.2 + 4.0*hgt);
      float oy = m * sin(t*1.9 + gx*0.02) * 0.9;
      gl_FragColor = texture2D(img, vec2((gx+ox)/ww, (gy+oy)/540.0));
    }`;
  function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  if (gl){
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) gl = null;
  }
  if (gl){
    gl.useProgram(prog);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    for (const n of ['img','msk','t','cam','ww','gust']) uni[n] = gl.getUniformLocation(prog, n);
    gl.uniform1i(uni.img, 0); gl.uniform1i(uni.msk, 1);
  }
  function mkTex(im){
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
    return t;
  }
  return {
    ready(){},
    resize(){ if (!gl) return; const d = Math.min(DPR, 1.5); c.width = Math.round(W*scale*d); c.height = Math.round(H*scale*d); },
    draw(key, cam, t, gust, sx, sy){
      const ww = BGS[key].w/BGS[key].h*H;
      if (gl && IMG[key].complete && IMG[key+'m'].complete){
        try {
          if (!tex[key]) tex[key] = [mkTex(IMG[key]), mkTex(IMG[key+'m'])];
          if (c.width < 2) this.resize();
          gl.viewport(0, 0, c.width, c.height);
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[key][0]);
          gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tex[key][1]);
          gl.uniform1f(uni.t, t); gl.uniform1f(uni.cam, cam); gl.uniform1f(uni.ww, ww); gl.uniform1f(uni.gust, gust);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          ctx.drawImage(c, sx-4, sy-2, W+8, H+4);
          return;
        } catch(e){ gl = null; }
      }
      ctx.drawImage(IMG[key], -cam+sx, sy, ww, H);
    }
  };
})();

let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); }
function noise(dur, freq, vol, type){
  if(!AC) return; const t = AC.currentTime;
  const len = Math.floor(AC.sampleRate*dur), b = AC.createBuffer(1,len,AC.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2);
  const src = AC.createBufferSource(); src.buffer = b;
  const f = AC.createBiquadFilter(); f.type = type||'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
}
function tone(f0, f1, dur, vol, wave, delay){
  if(!AC) return; const t = AC.currentTime + (delay||0);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = wave||'square';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}

  if (keys[e.code]) return; keys[e.code] = true; audio();
  if (game.state!=='play'){ if (['Enter','Space'].includes(e.code)) tapScreen({x:W/2-130, y:340, key:true}); return; }
  if (['KeyJ','KeyX','Space','Enter'].includes(e.code)) press('punch');
  if (['KeyK','KeyC'].includes(e.code)) press('kick');

});

const BTN = {
  punch:{x:842, y:430, r:52, label:'POING'},
  kick:{x:738, y:478, r:44, label:'PIED'},
  grab:{x:876, y:312, r:40, label:'FEU'},

const STICK = {cx:120, cy:425, r:70, id:null, dx:0, dy:0};
const touches = {};
function toGame(t){ return {x:(t.clientX-offX)/scale, y:(t.clientY-offY)/scale}; }
cv.addEventListener('touchstart', e=>{
  e.preventDefault(); audio();
  for (const t of e.changedTouches){
    const p = toGame(t);
    if (game.state!=='play'){ tapScreen(p); continue; }
    let hit = null;
    for (const k in BTN){ const b = BTN[k]; if (Math.hypot(p.x-b.x, p.y-b.y) < b.r+16) hit = k; }
    if (hit){ touches[t.identifier] = {btn:hit}; BTN[hit].down = true; press(hit); }
    else if (p.x < W*0.5){ STICK.id = t.identifier; STICK.cx = Math.max(80,Math.min(p.x,330)); STICK.cy = Math.max(300,Math.min(p.y,470)); STICK.dx=0; STICK.dy=0; touches[t.identifier] = {stick:true}; }
  }
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  for (const t of e.changedTouches){
    const o = touches[t.identifier]; if (!o || !o.stick) continue;
    const p = toGame(t); let dx = p.x-STICK.cx, dy = p.y-STICK.cy; const d = Math.hypot(dx,dy);
    if (d>STICK.r){ dx*=STICK.r/d; dy*=STICK.r/d; } STICK.dx=dx; STICK.dy=dy;
  }
}, {passive:false});
function endTouch(e){
  e.preventDefault();
  for (const t of e.changedTouches){
    const o = touches[t.identifier]; if (!o) continue;
    if (o.stick){ STICK.id=null; STICK.dx=0; STICK.dy=0; STICK.cx=120; STICK.cy=425; }
    if (o.btn) BTN[o.btn].down = false;
    delete touches[t.identifier];
  }
}

function readInput(){
  let x = 0, y = 0;
  if (keys.ArrowLeft||keys.KeyA||keys.KeyQ) x -= 1;
  if (keys.ArrowRight||keys.KeyD) x += 1;
  if (keys.ArrowUp||keys.KeyW||keys.KeyZ) y -= 1;
  if (keys.ArrowDown||keys.KeyS) y += 1;
  if (STICK.id!==null){ const d = STICK.r*0.28; if (Math.abs(STICK.dx)>d) x = Math.sign(STICK.dx); if (Math.abs(STICK.dy)>d) y = Math.sign(STICK.dy); }
  input.x = x; input.y = y;
}

// =====================================================================
//  ÉTAT DU JEU
// =====================================================================
const game = {state:'title', map:0, t:0, kills:0, cam:0, ents:[], fx:[], shots:[], banner:0, bannerText:'', fade:0, fadeDir:0, shake:0, goShown:false,
              crates:[], chickens:[], parts:[], drops:[], gust:0, gustT:3};
let rudy = null;
const lerp = (a,b,t)=>a+(b-a)*t, clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function worldW(){ const b = BGS[MAPS[game.map].bg]; return b.w/b.h*H; }
function living(){ return game.ents.filter(e=>!e.dead); }

function newRudy(hp, en){
  const m = MAPS[game.map];
  return {isRudy:true, en:en||0, x:150, y:(m.yMin+m.yMax)/2, vx:0, vy:0, face:1, hp, st:'idle', t:0, fr:0, combo:0, inv:0, hidden:false, kb:0};
}
function startMap(i, keepHp, keepEn){
  startMusic();
  game.map = i; game.kills = 0; game.ents = []; game.fx = []; game.shots = []; game.goShown = false; game.grabCD = 1.5;
  game.crates = []; game.chickens = []; game.parts = []; game.drops = []; game.phase = 0;
  const m = MAPS[i];
  if (!m.boss){
    const ww = worldW();
    for (const f of [0.34, 0.7]) game.crates.push({x: ww*f + (Math.random()-0.5)*90, y: m.yMin + 6 + Math.random()*14, hp:2, shake:0});
  }
  if (keepHp==null) RUDY_MAX = 100*pvDebut();
  rudy = newRudy(m.boss ? RUDY_MAX : (keepHp!=null ? keepHp : RUDY_MAX), keepEn);
  game.cam = 0; game.banner = 2.8; game.bannerText = m.name; game.spawnT = 0.8;
  game.boss = null;
  if (m.boss){
    const b = makeEnemy('cen', worldW()-260, (m.yMin+m.yMax)/2);
    b.st = 'intro'; b.t = 0; b.face = -1; game.ents.push(b); game.boss = b; game.phase = 1;
  }
  game.state = 'play'; game.fade = 1; game.fadeDir = -1;
  // en arrivant dans la Clairière Maudite (depuis la 3e carte) : la vidéo d'avant le combat contre les boss
  if (m.boss && keepHp!=null) videoAvantBoss();
}
function videoAvantBoss(src){
  window.PAUSE = true;                                   // le jeu attend la fin de la vidéo
  const prevenir = on=>{ try{ if (window.parent && window.parent !== window) window.parent.postMessage({type:'grotte:video', on:on}, '*'); }catch(e){} };
  prevenir(true);                                        // Vaviel coupe la musique de la forêt pendant la vidéo
  const vb = document.createElement('div');
  vb.style.cssText = 'position:fixed;inset:0;z-index:999;background:#000';
  vb.innerHTML = '<video playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></video>';
  document.body.appendChild(vb);
  const v = vb.querySelector('video');
  const fin = ()=>{ v.removeEventListener('ended',fin); v.removeEventListener('error',fin); vb.remove(); prevenir(false); window.PAUSE = false; };
  v.addEventListener('ended',fin); v.addEventListener('error',fin);
  v.src = src || '/assets/shinato/m/foret_boss_intro.mp4';
  const q = v.play(); if (q && q.catch) q.catch(()=>{});
}
function makeEnemy(kind, x, y){
  const K = KINDS[kind];
  return {kind, K, x, y, z:K.fly?70:0, face:-1, hp:K.hp, st:'walk', t:0, fr:0, cd:0.8+Math.random()*0.8, hpShow:0, dead:false, alpha:1,
          side:(Math.random()<0.5?-1:1), lane:(Math.random()-0.5)*40, bob:Math.random()*6, flash:0};
}
function spawnEnemy(){
  const m = MAPS[game.map];
  const here = living().map(e=>e.kind);
  let pool = POOL.filter(k=>!here.includes(k) && k!==game.lastKind);
  if (!pool.length) pool = POOL.filter(k=>!here.includes(k));
  const kind = pool[Math.floor(Math.random()*pool.length)];
  game.lastKind = kind;
  const fromLeft = rudy.x > game.cam+W*0.62 ? true : (rudy.x < game.cam+W*0.38 ? false : Math.random()<0.5);
  const x = clamp(fromLeft ? game.cam-90 : game.cam+W+90, -70, worldW()+70);
  const e = makeEnemy(kind, x, m.yMin + 10 + Math.random()*(m.yMax-m.yMin-20));
  e.face = fromLeft?1:-1;
  game.ents.push(e);
}

// =====================================================================
//  MISE À JOUR
// =====================================================================
function update(dt){
  game.t += dt;
  if (game.fadeDir){ game.fade += game.fadeDir*dt*2; if (game.fade<=0){ game.fade=0; game.fadeDir=0; } if (game.fade>=1 && game.fadeDir>0){ game.fade=1; game.fadeDir=0; game.onFade && game.onFade(); } }
  // vent : rafales de temps en temps
  game.gustT -= dt; if (game.gustT<=0){ game.gustT = 4+Math.random()*6; game.gustAim = 0.6+Math.random()*0.8; }
  game.gust = lerp(game.gust, game.gustT>2.5 ? (game.gustAim||0) : 0, dt*1.5);
  updateAmbient(dt);
  if (game.state!=='play') return;
  if (game.banner>0) game.banner -= dt;
  if (game.grabCD>0) game.grabCD -= dt;
  readInput();
  const m = MAPS[game.map];
  if (!m.boss){
    game.spawnT -= dt;
    if (living().length < MAX_ENEMIES && game.spawnT <= 0){ spawnEnemy(); game.spawnT = 0.7 + Math.random()*0.7; }
  }
  updateRudy(dt);
  for (const e of game.ents){ updateEnemy(e, dt); jigUpdate(e, dt); }
  game.ents = game.ents.filter(e=>!(e.dead && e.alpha<=0));
  updateShots(dt);
  for (const c of game.crates) if (c.shake>0) c.shake -= dt;
  game.crates = game.crates.filter(c=>c.hp>0);
  for (const ch of game.chickens){
    ch.t += dt;
    if (!ch.taken && rudy.st!=='dead' && !rudy.hidden && Math.abs(ch.x-rudy.x) < 48 && Math.abs(ch.y-rudy.y) < 30){
      ch.taken = true; rudy.hp = Math.min(RUDY_MAX, rudy.hp + 35); SFX.eat(); addFx('heal', ch.x, ch.y-70);
    }
  }
  game.chickens = game.chickens.filter(c=>!c.taken);
  for (const f of game.fx) f.t += dt;
  game.fx = game.fx.filter(f=>f.t < f.life);
  if (!m.boss && game.kills >= KILLS_PER_MAP[game.map] && !game.goShown){ game.goShown = true; SFX.go(); }
  // caméra
  let target = clamp(rudy.x - W*0.42, 0, worldW()-W);
  if (m.boss && game.boss && !game.boss.dead) target = clamp((rudy.x + game.boss.x)/2 - W/2, 0, worldW()-W);
  game.cam += (target-game.cam)*Math.min(1, dt*5);
  if (game.shake>0) game.shake -= dt;
  pressQueue = [];
}
function atExit(){ return !MAPS[game.map].boss && game.kills>=KILLS_PER_MAP[game.map] && rudy.x > worldW()-160 && !rudy.hidden && ['idle','walk'].includes(rudy.st); }

// ---------------------------------------------------------------- RUDY
function setR(st){ rudy.st = st; rudy.t = 0; rudy.fr = 0; }
function updateRudy(dt){
  const r = rudy;
  r.t += dt; if (r.inv>0) r.inv -= dt;
  if (r.dashT>0) r.dashT -= dt; if (r.dashCD>0) r.dashCD -= dt; if (r.gunCD>0) r.gunCD -= dt;
  const pressed = pressQueue.slice();
  if (r.st==='dead'){ r.fr = Math.min(5, r.t/0.1); return; }
  if (r.st==='grabbed'){ r.mash += pressed.length; return; }
  if (r.st==='tied'){ // attaché par les lianes, au sol
    r.mash += pressed.length; r.fr = 5;
    r.hp -= 3*dt; if (r.hp <= 0){ r.hp = 0; r.tied = 0; killRudy('rou_lianes'); return; }
    if (r.mash >= r.need){ r.tied = 0; addFx('vineBurst', r.x, r.y-30); SFX.vine(); setR('down'); r.t = 1.2; r.kb = 0; r.inv = 1.0; }
    return;
  }
  if (r.st==='grabbing') return;
  if (r.st==='gun'){   // tir : il se tourne, braque, tire ; on peut enchaîner les tirs
    if (r.t >= 0.05 && !r.shot){ r.shot = true; fireBullet(); }
    for (const b of pressed) if (b==='grab' && r.t > 0.22){ shoot(); return; }
    if (r.t > 0.42) setR('idle');
    return;
  }
  if (r.st==='hurt'){ r.fr = r.t<0.1?0:1; r.x -= r.kb*dt*110*(1-r.t/0.34); if (r.t>0.34) setR('idle'); clampR(); return; }
  if (r.st==='down'){
    const T = r.t;
    if (T < 0.55){ r.fr = Math.min(5, T/0.09); r.x -= r.kb*dt*170*(1-T/0.55); }
    else if (T < 1.25) r.fr = 5;
    else if (T < 1.7) r.fr = 5 - (T-1.25)/0.09;
    else { setR('idle'); r.inv = Math.max(r.inv, 0.7); }
    clampR(); return;
  }
  if (r.st==='beam'){ // charge la boule entre ses mains puis la lance
    const ct = r.big ? 0.45 : 0.28;
    r.fr = r.t < ct ? 1 : 3;
    if (r.t > ct && !r.cast){ r.cast = true; SFX.beam(); if (r.big){ SFX.thunder(); game.shake = 0.25; } game.shots.push({type:'energy', big:r.big, x:r.x+r.face*(r.big?90:70), y:r.y, z:118*depth(r.y), vx:r.face*(r.big?560:640), t:0, hit:[], trail:[]}); }
    if (r.t > ct + 0.32) setR('idle');
    return;
  }
  if (r.st==='punch'){ // 1er coup de poing : poses 1-2-3, puis retour en garde
    const sp = 0.055, n = r.t/sp;
    if (n>=2 && !r.hitDone){ r.hitDone = true; doHit(10, 112, false); }
    r.fr = n < 2 ? n : (n < 3.6 ? 2 : (n < 4.6 ? 1 : 0));
    if (pressed.length && n>=2){ const b = pressed[pressed.length-1];
      if (b==='punch'){ setR('punch2'); r.fr = 3; rudy.hitDone = false; rudy.combo++; SFX.whoosh(); return; }
      if (b==='kick'){ startAttack('kick'); return; } }
    if (n>=5.2){ setR('idle'); r.combo = 0; }
    return;
  }
  if (r.st==='punch2'){ // 2e coup de poing enchaîné : poses 4-5-6
    const sp = 0.06, n = r.t/sp;
    if (n>=0.4 && !r.hitDone){ r.hitDone = true; doHit(12, 118, r.combo>=3); }
    r.fr = 3 + Math.min(2, n < 1.6 ? 0 : (n-1.6)*1.2);
    if (pressed.length && n>=1){ const b = pressed[pressed.length-1];
      if (b==='punch'){ setR('punch3'); r.fr = 1; rudy.hitDone = false; rudy.combo++; SFX.whoosh(); return; }
      if (b==='kick'){ startAttack(b); return; } }
    if (n>=4){ setR('idle'); r.combo = 0; }
    return;
  }
  if (r.st==='punch3'){ // 3e coup de poing enchaîné : uppercut (se baisse, prend l'élan, frappe vers le haut)
    const sp = 0.065, n = r.t/sp;
    if (n>=2.6 && !r.hitDone){ r.hitDone = true; doHit(18, 120, true); game.shake = Math.max(game.shake||0, 0.12); }
    r.fr = n < 3 ? 1 + n : (n < 5.2 ? 4 : (n < 6.4 ? 5 : 0));
    if (pressed.length && n>=4.5){ const b = pressed[pressed.length-1]; if (b==='punch'||b==='kick'){ startAttack(b); return; } }
    if (n>=7){ setR('idle'); r.combo = 0; }
    return;
  }
  if (r.st==='kick'){
    const sp = 0.062;
    const n = r.t/sp;
    if (n>=3 && !r.hitDone){ r.hitDone = true; doHit(16, 138, r.combo>=2); }
    r.fr = Math.min(5, n);
    if (pressed.length && n>=3.2){ const b = pressed[pressed.length-1]; if (b==='punch'||b==='kick'){ startAttack(b); return; } }
    if (n>=6){ setR('idle'); r.combo = 0; }
    return;
  }
  // déplacement avec un peu d'inertie (plus fluide)
  const dashing = r.dashT > 0;
  const sp = dashing ? 470 : 235;
  if (dashing && Math.random()<0.5) game.parts.push({type:'dust', x:r.x - r.face*20, y:r.y, vx:-r.face*60, vy:-20-Math.random()*20, t:0, life:0.4});
  if (dashing){ r.ghosts = r.ghosts||[]; if (Math.floor(r.t*30)!==r.lastGhost){ r.lastGhost = Math.floor(r.t*30); r.ghosts.push({x:r.x, y:r.y, fr:r.fr, face:r.face, t:0}); } }
  r.vx = lerp(r.vx, (input.x || (dashing && !input.y ? r.face : 0))*sp, Math.min(1, dt*14));
  r.vy = lerp(r.vy, input.y*sp*0.55, Math.min(1, dt*14));
  r.x += r.vx*dt; r.y += r.vy*dt;
  if (input.x) r.face = input.x;
  clampR();
  const moving = Math.abs(r.vx) > 30 || Math.abs(r.vy) > 20;
  if (moving){ if (r.st!=='walk'){ r.st = 'walk'; } r.walkT = (r.walkT||0) + dt * (dashing ? 1.6 : 1) * (0.55 + 0.45*Math.min(1, Math.hypot(r.vx, r.vy*1.6)/sp)); r.fr = (r.walkT/0.078)%6; }
  else if (r.st!=='idle') setR('idle');
  for (const b of pressed){
    if (b==='punch' && atExit()){ nextMap(); return; }
    if (b==='punch' || b==='kick'){ startAttack(b); return; }
    if (b==='grab'){ if (!(r.gunCD>0)) shoot(); return; }
    if (b==='dash' && !(r.dashCD>0)){ r.dashT = 1.0; r.dashCD = 2.0; SFX.whoosh(); }
    if (b==='energy' && r.en >= 100){ r.big = r.en >= 200; r.en -= r.big ? 200 : 100; setR('beam'); r.cast = false; SFX.charge(); if (r.big) SFX.thunder(); return; }
  }
}
function clampR(){
  const m = MAPS[game.map];
  rudy.y = clamp(rudy.y, m.yMin, m.yMax);
  rudy.x = clamp(rudy.x, 40, worldW()-40);
}
function shoot(){
  const r = rudy; if (input.x) r.face = input.x;
  setR('gun'); r.shot = false; r.gunCD = 0.22; r.vx = 0; r.vy = 0;
}
function fireBullet(){
  const r = rudy, d = depth(r.y), G = SPR.r_gun, k2 = d/Q;
  const mx = r.x + r.face*(G.muz[0]-G.f[0][4])*k2, my = r.y - (G.f[0][3]-G.muz[1])*k2;
  let best = null, bd = 1e9;
  for (const e of living()){
    if (!targetable(e)) continue;
    const dx = (e.x - r.x)*r.face;
    if (dx > 10 && dx < 760 && Math.abs(e.y - r.y) < 34 && dx < bd){ best = e; bd = dx; }
  }
  const ex = best ? best.x - r.face*14 : mx + r.face*780;
  game.fx.push({type:'tracer', x:mx, y:my, x2:ex, t:0, life:0.09});
  game.fx.push({type:'muzzle', x:mx, y:my, f:r.face, t:0, life:0.07});
  noise(0.09, 2600, 0.55, 'highpass'); noise(0.18, 500, 0.6); tone(160, 60, 0.1, 0.18, 'square');
  game.shake = Math.max(game.shake||0, 0.05);
  if (best){ hurtEnemy(best, 16, false); addFx('spark', best.x, best.y - 120*depth(best.y)); r.en = Math.min(200, r.en + 4); }
}
function startAttack(b){
  rudy.combo = (['punch','punch2','punch3','kick'].includes(rudy.st)) ? rudy.combo+1 : 0;
  setR(b); rudy.hitDone = false; rudy.vx = 0; rudy.vy = 0; SFX.whoosh();
  if (input.x) rudy.face = input.x;
}
function targetable(e){ return !e.dead && !['vanish','down','intro','grabbedByR','grab','phase','rise','charge','bounce','gone','tpIn'].includes(e.st); }
function doHit(dmg, range, knock){
  let any = false;
  for (const e of living()){
    if (!targetable(e) && e.st!=='charge') continue;
    if (e.st==='down' || e.st==='grab') continue;
    const dx = (e.x - rudy.x)*rudy.face;
    const reachBonus = e.K.boss===1 ? 40 : 0;
    if (dx > -20 && dx < range+reachBonus && Math.abs(e.y-rudy.y) < 32){
      hurtEnemy(e, dmg, knock || rudy.combo>=3);
      rudy.en = Math.min(200, rudy.en + 8);
      any = true;
    }
  }
  for (const c of game.crates){
    if (c.hp<=0) continue;
    const dx = (c.x - rudy.x)*rudy.face;
    if (dx > -10 && dx < range+14 && Math.abs(c.y-rudy.y) < 36){
      c.hp--; c.shake = 0.25; any = true; addFx('spark', c.x, c.y-40);
      if (c.hp<=0){
        SFX.crate();
        for (let i=0;i<9;i++) game.fx.push({type:'plank', x:c.x, y:c.y-30, vx:(Math.random()-0.5)*320, vy:-160-Math.random()*200, rot:Math.random()*6, t:0, life:0.9});
        game.chickens.push({x:c.x, y:c.y+4, t:0});
      }
    }
  }
  if (any){ SFX.hit(); game.shake = 0.08; }
}
function tryGrab(){
  let best = null, bd = 1e9;
  for (const e of living()){
    if (!targetable(e)) continue;
    const d = Math.abs(e.x-rudy.x);
    const reach = e.K.boss===1 ? 140 : 98;
    if (d < reach && Math.abs(e.y-rudy.y) < 30 && d < bd){ best = e; bd = d; }
  }
  if (!best){ setR('punch'); rudy.hitDone = false; SFX.whoosh(); return; }
  rudy.face = Math.sign(best.x-rudy.x)||rudy.face;
  if (!SPR[best.kind+'_rg']){ setR('punch3'); rudy.fr = 1; rudy.hitDone = false; SFX.whoosh(); return; }   // grotte : un uppercut qui envoie au sol
  if (best.K.noGrab){ enemyGrab(best); return; }
  setR('grabbing'); rudy.hidden = true; SFX.grab();
  best.st = 'grabbedByR'; best.t = 0; best.fr = 0; best.z = 0;
  best.pairX = (rudy.x+best.x)/2; best.pairY = (rudy.y+best.y)/2;
  best.rSide = Math.sign(rudy.x-best.x)||1;
}

// ------------------------------------------------------------- ENNEMIES
function hurtEnemy(e, dmg, knock){
  if (e.jig) e.jig.v += 34;
  e.hp -= dmg; e.hpShow = 2.2; e.flash = 0.1;
  addFx('spark', e.x - rudy.face*10, e.y - (e.K.fly ? e.z : 0) - 110*depth(e.y));
  if (e.K.boss){
    if (e.hp <= 0){ e.hp = 0; bossDown(e); return; }
    if (e.st==='tpOut' && e.fr < 4){ e.st = 'hurt'; e.t = 0; e.cd = 1.0; addFx('tpBreak', e.x, e.y-120*depth(e.y)); SFX.crate(); return; }
    if (e.st==='walk' || e.st==='idle'){ e.st = 'hurt'; e.t = 0; }
    return;
  }
  if (e.hp <= 0){ e.hp = 0; knockDown(e, true); return; }
  if (knock){ knockDown(e, false); return; }
  e.st = 'hurt'; e.t = 0; e.face = Math.sign(rudy.x-e.x)||e.face;
}
function knockDown(e, dead){
  if (!e.K.boss){
    if (dead){ startVanish(e); return; }
    e.st = 'hurt'; e.t = 0; e.big = true; e.face = Math.sign(rudy.x-e.x)||e.face; SFX.hit(); game.shake = 0.1; return;   // coup fort : elle recule, sans tomber
  }
  e.st = 'down'; e.t = 0; e.willDie = dead; e.face = Math.sign(rudy.x-e.x)||e.face;
  SFX.fall(); game.shake = 0.12;
}
function enemyGrab(e){
  if (rudy.st==='grabbed') return;
  const fromTied = rudy.st==='tied';
  e.st = 'grab'; e.t = 0; e.fr = 0; e.z = 0; e.grab2 = false;
  e.face = Math.sign(rudy.x-e.x)||e.face;
  e.pairX = (rudy.x+e.x)/2; e.pairY = (rudy.y+e.y)/2;
  e.rSide = Math.sign(rudy.x-e.x)||1;
  e.deLiane = fromTied;   // pour la vidéo de K.O. : la Rousse l'a attrapé pendant qu'il était attaché
  setR('grabbed'); rudy.hidden = true; rudy.mash = fromTied ? Math.floor((rudy.mash||0)/2) : 0; rudy.grabber = e; rudy.tied = 0;
  rudy.need = e.K.boss ? 13 : (e.K.noGrab ? 10 : 8);
  SFX.grab();
  if (e.kind==='dog' || e.kind==='rab') playLaugh(LAUGH);
  if (e.kind==='pan' || e.kind==='leo') playLaugh(LAUGH2);
  if (e.kind==='cro' || e.kind==='cob') playLaugh(LAUGH3);
  if (e.kind==='lio' || e.kind==='tig' || e.kind==='bus') playLaugh(LAUGH4);
  if (e.kind==='cen' || e.kind==='rou') playLaugh(LAUGH5);
  if (e.kind==='cow' || e.kind==='gir') playLaugh(LAUGH6);
  if (e.kind==='hye') playLaugh(LAUGH7);
  ({elf:LAUGH2, cat:LAUGH, rob:LAUGH5, tre:LAUGH4, jau:LAUGH7, bla:LAUGH3, noi:LAUGH6})[e.kind] && playLaugh(({elf:LAUGH2, cat:LAUGH, rob:LAUGH5, tre:LAUGH4, jau:LAUGH7, bla:LAUGH3, noi:LAUGH6})[e.kind]);

// boucle des attrapes : les 3 dernières images, en aller-retour pour que ce soit fluide
function loopFrame(n, t, intro, step){
  if (t < intro) return Math.min(n-4, t/step);
  const seq = [n-3, n-2, n-1, n-2];
  return seq[Math.floor((t-intro)/0.19) % seq.length];
}

function updateEnemy(e, dt){
  const K = e.K, k = e.kind, m = MAPS[game.map], r = rudy;
  e.t += dt; e.bob += dt; if (e.flash>0) e.flash -= dt;
  if (e.hpShow>0) e.hpShow -= dt;
  if (e.dead){ e.alpha -= dt*1.1; return; }
  const dx = r.x - e.x, dy = r.y - e.y, adx = Math.abs(dx);
  if (K.boss===1) return updateCentaur(e, dt, dx, dy, adx);
  if (K.boss===2) { if (updateRousse(e, dt, dx, dy, adx)) return; }

  switch(e.st){
  case 'hurt': {
    const T = e.big ? 0.55 : 0.35, V = e.big ? 260 : 80;
    e.fr = 0; e.x -= Math.sign(dx||1)*dt*V*Math.max(0, 1-e.t/T);
    if (e.t > T){ e.st='walk'; e.t=0; e.big=false; e.cd = 0.5+Math.random()*0.6; }
    break; }
  case 'vanish': updateVanish(e, dt); return;
  case 'down': {
    const T = e.t, n = nf(k+'_fall');
    if (T < 0.6){ e.fr = Math.min(n-1, T/(0.6/n)); e.x -= Math.sign(dx||1)*dt*170*(1-T/0.6); if (K.fly) e.z = Math.max(0, e.z - dt*180); }
    else if (e.willDie){ e.fr = n-1; if (T > 1.15){ e.dead = true; if (!K.boss) game.kills++; } }
    else if (T < 1.5) e.fr = n-1;
    else if (T < 1.5+0.08*(n-1)) { e.fr = n-1-(T-1.5)/0.08; if (K.fly) e.z = Math.min(70, e.z+dt*150); }
    else { e.st='walk'; e.t=0; e.cd = 0.8; if (K.fly) e.z = 70; }
    break; }
  case 'grabbedByR': {
    const n = nf(k+'_rg'), st = 0.15;
    e.fr = Math.min(n-1, e.t/st);
    if (e.fr>=3 && !e.grabHit){ e.grabHit = true; e.hp -= 28; rudy.en = Math.min(200, rudy.en + 15); e.hpShow = 2.2; SFX.big(); game.shake = 0.18; addFx('spark', e.pairX, e.pairY-60); }
    if (e.t > n*st + 0.2){
      e.grabHit = false;
      rudy.hidden = false; setR('idle'); rudy.inv = 0.6;
      const s = e.rSide;
      rudy.x = e.pairX + s*40; rudy.y = e.pairY; rudy.face = -s;
      e.x = e.pairX - s*70; e.y = e.pairY; clampR();
      e.st = 'down'; e.t = 0.6; e.willDie = e.hp <= 0; if (e.hp<0) e.hp = 0;
      e.face = s;
    }
    return; }
  case 'grab': {
    const n = nf(k+'_eg');
    e.fr = loopFrame(n, e.t, (n-3)*0.16, 0.16);
    if (e.t >= (n-3)*0.16){
      r.hp -= K.pump*dt; e.pumpT = (e.pumpT||0)-dt;
      if (e.pumpT<=0){ e.pumpT = 0.45; SFX.pump(); addFx('drain', e.pairX, e.pairY-90); }
      if (r.hp <= 0){ r.hp = 0; releaseRudy(e, true); return; }
      if (r.mash >= r.need){ releaseRudy(e, false); return; }
    }
    return; }
  case 'attack': {
    const sp = K.atkSpd, n = nf(k+(e.atkS||'_atk')), HF = (e.atkS==='_atk2' && K.hitF2) ? K.hitF2 : K.hitF;
    e.fr = Math.min(n-1, e.t/sp);
    if (K.fly){ // la buse plonge en piqué
      const p = clamp(e.t/(n*sp), 0, 1);
      e.z = 70 - Math.sin(p*Math.PI)*52;
      e.x += e.face*dt*(p<0.6 ? 260 : -120);
    }
    const fi = Math.floor(e.fr);
    if (HF.includes(fi) && e.lastHitF!==fi){
      e.lastHitF = fi;
      const ddx = (r.x-e.x)*e.face;
      if (ddx > -14 && ddx < K.reach+12 && Math.abs(r.y-e.y) < 30) hurtRudy(K.dmg, k==='gir', e);
    }
    if (e.t > n*sp){ e.st='walk'; e.t=0; e.cd = 1.2+Math.random()*1.3; e.lastHitF=-1; }
    break; }
  case 'walk': default:
    walkAI(e, dt, dx, dy, adx);
    if (r.st==='grabbed'||r.st==='grabbing'||r.st==='dead'||r.st==='tied') break;
    if (e.cd<=0 && adx < K.reach+14 && Math.abs(dy) < 22 && r.st!=='down' && r.inv<=0){
      const grabChance = 0.5;
      if (game.grabCD<=0 && Math.random() < grabChance && !game.ents.some(o=>o.st==='grab')){ enemyGrab(e); break; }
      e.st='attack'; e.t=0; e.lastHitF=-1; e.face = Math.sign(dx)||e.face; SFX.whoosh(); e.atkS = (K.atk2 && Math.random()<0.5) ? '_atk2' : '_atk';
    }
    break;
  }
}
// déplacement : chaque ennemie prend sa place autour de Rudy
function walkAI(e, dt, dx, dy, adx){
  const K = e.K, r = rudy, m = MAPS[game.map];
  e.cd -= dt;
  const busy = ['grabbed','grabbing','dead','tied'].includes(r.st);
  if (Math.abs(dx) > 40) e.side = Math.sign(e.x - r.x);
  let tx = r.x + e.side*(K.reach*0.78), ty = r.y + e.lane*0.2;
  if (busy) tx = r.x + e.side*230;
  // ne pas s'empiler
  for (const o of living()) if (o!==e && !o.K.boss && Math.abs(o.x-tx)<60 && Math.abs(o.y-e.y)<22 && Math.abs(o.x-r.x) < Math.abs(e.x-r.x)){ tx += e.side*70; ty += e.lane>0?24:-24; }
  const mx = tx - e.x, my = ty - e.y;
  const spd = K.spd*62;
  let moved = false;
  if (Math.abs(mx) > 8){ e.x += Math.sign(mx)*Math.min(Math.abs(mx), spd*dt); moved = true; }
  if (Math.abs(my) > 5){ e.y += Math.sign(my)*Math.min(Math.abs(my), spd*0.55*dt); moved = true; }
  e.y = clamp(e.y, m.yMin, m.yMax);
  e.face = Math.sign(dx)||e.face;
  e.moving = moved;
  e.walkT = (e.walkT||0) + (moved ? dt : 0);
  e.fr = (e.walkT/0.085)%nf(e.kind+'_run');
}
function releaseRudy(e, dead){
  const r = rudy; game.grabCD = 2.2; const tp = e.grab2; e.grab2 = false;   // tp : la prise après la téléportation (pour la vidéo de K.O.)
  r.hidden = false; r.grabber = null;
  const s = e.rSide || 1;
  r.x = e.pairX + s*40; e.x = e.pairX - s*60; r.y = e.pairY; e.y = e.pairY; clampR();
  r.face = -s;
  if (dead){ killRudy(e.K.boss ? e.kind+(tp?'_prise_tp':e.deLiane?'_prise_liane':'_prise') : e.kind); e.st = 'walk'; e.t = 0; return; }
  e.st = e.K.boss ? 'walk' : 'hurt'; e.t = 0; e.cd = 1.6; e.hpShow = 1; e.face = s;
  if (e.K.boss===2) { e.st = 'walk'; e.x = clamp(e.x - s*60, 60, worldW()-60); }

}
function hurtRudy(dmg, heavy, src){
  const r = rudy;
  if (r.inv>0 || ['down','grabbed','grabbing','dead','tied'].includes(r.st)) return false;
  r.hp -= dmg; SFX.hit(); game.shake = 0.1; r.en = Math.min(200, r.en + 5);

  if (r.hp <= 0){ r.hp = 0; killRudy((src&&(src.ko||src.kind))||''); return true; }

}

// ------------------------------------------------- BOSS 1 : LE CENTAURE
function updateCentaur(e, dt, dx, dy, adx){
  const r = rudy, m = MAPS[game.map];
  switch(e.st){
  case 'intro':
    e.fr = (e.t/0.11)%6; e.x -= dt*60; e.face = -1;
    if (e.t > 1.8){ e.st = 'walk'; e.t = 0; e.cd = 1.2; SFX.neigh(); }
    return;
  case 'hurt':
    e.fr = 1; if (e.t > 0.22){ e.st = 'walk'; e.t = 0; }
    return;
  case 'grab': {
    const n = nf('cen_eg');
    e.fr = loopFrame(n, e.t, 2*0.16, 0.16);
    if (e.t >= 2*0.16){
      r.hp -= e.K.pump*dt; e.pumpT = (e.pumpT||0)-dt;
      if (e.pumpT<=0){ e.pumpT = 0.45; SFX.pump(); addFx('drain', e.pairX, e.pairY-130); }
      if (r.hp <= 0){ r.hp = 0; releaseRudy(e, true); return; }
      if (r.mash >= r.need){ releaseRudy(e, false); e.cd = 1.4; return; }
    }
    return; }
  case 'punch': { // coup de poing de la centaure
    e.fr = Math.min(4, e.t/0.11);
    const fi = Math.floor(e.fr);
    if ((fi===2 || fi===3) && e.hitF!==fi){ e.hitF = fi;
      const ddx = (r.x - e.x)*e.face;
      if (ddx > -20 && ddx < 150 && Math.abs(r.y - e.y) < 30) hurtRudy(12, fi===3, e); }
    if (e.t > 5*0.11 + 0.1){ e.st = 'walk'; e.t = 0; e.cd = 1.0 + Math.random()*0.8; e.plan = null; }
    return; }
  case 'beam': { // elle se tourne et sa maîtresse lance un rayon vert
    e.fr = e.t < 0.4 ? Math.min(1, e.t/0.2) : 1 + Math.floor((e.t-0.4)/0.09)%4;
    if (e.t > 0.4 && e.t < 1.05){
      if (!e.beamOn){ e.beamOn = true; SFX.laser(); game.shake = 0.12; }
      if (e.beamTx == null) e.beamTx = r.x;
      const ddx = (r.x - e.x)*e.face, reach = (e.beamTx - e.x)*e.face + 90;
      if (!e.beamHit && ddx > 0 && ddx < reach && Math.abs(r.y - e.y) < 30 && !r.hidden){ if (hurtRudy(16, true, {x:e.x, ko:'cen_rayon'})){ e.beamHit = true; addFx('burstG', r.x, r.y-110*depth(r.y)); } }
    } else e.beamOn = false;
    if (e.t > 1.25){ e.st = 'walk'; e.t = 0; e.cd = 1.3 + Math.random(); e.plan = null; e.beamOn = false; e.beamTx = null; }
    return; }
  case 'fire': { // elle se tourne et sa maîtresse lance des boules de feu vertes
    const T0 = 0.3, gap = 0.3;
    e.fr = e.t < T0 ? Math.min(1, e.t/0.15) : 1 + Math.floor((e.t-T0)/0.08)%4;
    const k = Math.floor((e.t - T0)/gap);
    if (e.t >= T0 && k < e.balls && k !== e.thrown){ e.thrown = k; throwFire(e, k === e.balls-1); }
    if (e.t > T0 + e.balls*gap + 0.2){ e.st = 'walk'; e.t = 0; e.cd = 0.7 + Math.random()*0.6; }
    return; }
  case 'prep': // elle gratte le sol avant de charger
    e.fr = 0; e.face = Math.sign(e.chargeTo - e.x)||e.face;
    if (e.t > 0.55){ e.st = 'charge'; e.t = 0; e.hitDone = false; SFX.neigh(); }
    return;
  case 'charge': { // fonce tête baissée sur Rudy
    e.fr = (e.t/0.07)%5;
    const dir = Math.sign(e.chargeTo - e.x)||e.face;
    e.face = dir;
    e.x += dir*dt*700;
    if (Math.floor(e.t/0.14) !== Math.floor((e.t-dt)/0.14)) SFX.gallop();
    if (Math.random()<0.6) game.parts.push({type:'mud', x:e.x - dir*60, y:e.y, vx:-dir*(40+Math.random()*80), vy:-60-Math.random()*90, t:0, life:0.6});
    if (!e.hitDone && Math.abs(r.x-e.x) < 80 && Math.abs(r.y-e.y) < 34){ e.hitDone = true; if (hurtRudy(e.K.dmg, true, {x:e.x-dir*100, ko:'cen_charge'})){ r.kb = -dir; game.shake = 0.25; addFx('burst', r.x, r.y-110); } }
    if ((dir>0 && e.x >= e.chargeTo) || (dir<0 && e.x <= e.chargeTo) || e.x < 70 || e.x > worldW()-70){ e.st = 'bounce'; e.t = 0; e.bounceFrom = e.x; }
    return; }
  case 'bounce': { // elle rebondit à sa place de départ
    const p = Math.min(1, e.t/0.75);
    e.x = lerp(e.bounceFrom, e.home, p*p*(3-2*p));
    e.z = Math.sin(p*Math.PI)*55;
    e.fr = 2 + (p<0.5 ? 0 : 1);
    if (p >= 1){ e.z = 0; e.st = 'walk'; e.t = 0; e.cd = 1.6 + Math.random(); e.plan = null; }
    return; }
  case 'down': { // le centaure tombe : passage à la rousse
    const n = nf('cen_fall');
    e.fr = Math.min(n-1, e.t/0.14);
    if (e.t > n*0.14 + 1.0 && !e.phased){ e.phased = true; startPhase2(e); }
    if (e.phased){ e.alpha -= dt*0.8; if (e.alpha<=0){ e.dead = true; } }
    return; }
  case 'walk': default: {
    e.cd -= dt;
    const busy = ['grabbed','grabbing','dead','tied'].includes(r.st);
    // elle réagit à ce que fait Rudy
    const away = Math.sign(r.x - e.x) || 1;                 // direction de Rudy vu d'elle
    const flee = r.vx*away > 60 || adx > 430;              // Rudy s'enfuit (ou est très loin)
    const come = r.vx*away < -60;                          // Rudy s'approche d'elle
    const want = clamp(r.x - away*(flee ? 300 : 112), 120, worldW()-120);
    let mx = want - e.x, my = r.y - e.y;
    const sp = e.K.spd*60;
    let moved = false;
    if (Math.abs(mx) > 10){ e.x += Math.sign(mx)*Math.min(Math.abs(mx), sp*dt); moved = true; }
    if (Math.abs(my) > 5){ e.y += Math.sign(my)*Math.min(Math.abs(my), sp*0.6*dt); moved = true; }
    e.y = clamp(e.y, m.yMin, m.yMax);
    e.face = Math.sign(dx)||e.face;
    e.walkT = (e.walkT||0) + (moved?dt:dt*0.3); e.fr = (e.walkT/0.12)%6;
    if (busy || e.cd > 0) return;
    // collé à elle : coups de poing et attrape
    if (adx < 150 && Math.abs(dy) < 28){
      if (game.grabCD<=0 && Math.random()<0.45){ enemyGrab(e); return; }
      e.st = 'punch'; e.t = 0; e.hitF = -1; e.face = Math.sign(dx)||e.face; SFX.whoosh(); return;
    }
    // Rudy s'approche : elle lui fonce dessus
    if (come && adx > 170 && adx < 560 && Math.abs(dy) < 26){
      e.home = e.x; e.chargeTo = clamp(r.x + Math.sign(dx)*170, 70, worldW()-70);
      e.st = 'prep'; e.t = 0; return;
    }
    // Rudy s'enfuit : boules de feu (et parfois le rayon)
    if (flee && adx > 180){
      if (Math.abs(dy) < 30 && Math.random() < 0.25){ e.st = 'beam'; e.t = 0; e.beamHit = false; e.beamTx = r.x + Math.sign(dx)*40; e.face = Math.sign(dx)||e.face; SFX.charge(); return; }
      startFire(e, dx); return;
    }
    // à mi-distance sans bouger : une boule de feu de temps en temps
    if (adx > 230 && Math.random() < 0.5){ startFire(e, dx); return; }
    e.cd = 0.25;
    return; }
  }
}
function startFire(e, dx){

function updateRousse(e, dt, dx, dy, adx){

  case 'down': {
    const n = nf('rou_fall');
    e.fr = Math.min(n-1, e.t/0.13);
    if (e.t > n*0.13 + 1.2 && !e.won){ e.won = true; pvGagne(); SFX.win(); setTimeout(()=>{ game.state = 'win';
      // dans l'appli (Vaviel) : la Rousse est vaincue → la vidéo de la victoire
      try{ if (window.parent && window.parent !== window) window.parent.postMessage({type:'grotte:victoire'}, '*'); }catch(err){}
    }, 900); }
    return true; }
  case 'grab': {
    const n = nf(e.grab2 ? 'rou_eg2' : 'rou_eg'), intro = (n-3)*0.16;
    e.fr = loopFrame(n, e.t, intro, 0.16);
    if (e.t >= intro){
      r.hp -= e.K.pump*dt; e.pumpT = (e.pumpT||0)-dt;
      if (e.pumpT<=0){ e.pumpT = 0.45; SFX.pump(); addFx('drain', e.pairX, e.pairY-80); }
      if (r.hp <= 0){ r.hp = 0; releaseRudy(e, true); return true; }
      if (r.mash >= r.need){ releaseRudy(e, false); e.cd = 1.4; return true; }
    }
    return true; }
  case 'cast': { // tornade verte ou lianes
    const n = nf('rou_cast');
    e.fr = Math.min(n-1, e.t/0.13);
    e.face = Math.sign(dx)||e.face;
    if (e.t < 0.52 && Math.random()<0.7) game.parts.push({type:'leaf', x:e.x + e.face*58*depth(e.y) + (Math.random()-0.5)*60, y:e.y - 120*depth(e.y) + (Math.random()-0.5)*60, tx:e.x + e.face*58*depth(e.y), ty:e.y - 120*depth(e.y), t:0, life:0.45});
    if (e.fr >= 3 && !e.cast){
      e.cast = true;
      if (e.spell==='tornado'){ SFX.tornado(); game.shots.push({type:'tornado', x:e.x + e.face*80, y:e.y, z:0, vx:e.face*400, t:0}); }
      else { SFX.vine(); game.shots.push({type:'vine', x:e.x + e.face*80, y:e.y, z:95, vx:e.face*470, t:0, ox:e.x + e.face*80}); }
    }
    if (e.t > n*0.13 + 0.3){ e.cast = false; e.st = 'walk'; e.t = 0; e.cd = 1.2 + Math.random()*0.8; }
    return true; }
  case 'tpOut': { // mains sur le pendentif, cristaux, elle disparaît
    const n = nf('rou_tp');
    e.fr = Math.min(n-1, e.t/0.17);
    if (e.fr >= 3) crystalBurst(e.x, e.y, 3);
    if (e.t > n*0.17 + 0.12){ e.st = 'gone'; e.t = 0; crystalBurst(e.x, e.y, 30); SFX.tp(); }
    return true; }
  case 'gone': {
    if (e.t > 0.55){
      if (['grabbed','grabbing','dead'].includes(r.st)){ e.st = 'tpIn'; e.t = 0; e.noGrabAfter = true; return true; }
      const side = Math.random()<0.5 ? -1 : 1;
      e.x = clamp(r.x + side*62, 60, worldW()-60); if (Math.abs(e.x - r.x) < 40) e.x = clamp(r.x - side*62, 60, worldW()-60);
      e.y = r.y; e.face = Math.sign(r.x - e.x)||1;
      e.st = 'tpIn'; e.t = 0; e.noGrabAfter = false; crystalBurst(e.x, e.y, 30); SFX.tp();
    }
    return true; }
  case 'tpIn': { // réapparaît à côté de Rudy (planche à l'envers) puis l'attrape
    const n = nf('rou_tp');
    e.fr = Math.max(0, n-1 - e.t/0.11);
    if (e.fr >= 2) crystalBurst(e.x, e.y, 2);
    if (e.t > n*0.11){
      e.face = Math.sign(r.x - e.x)||e.face;
      if (!e.noGrabAfter && !['grabbed','grabbing','dead'].includes(r.st) && Math.abs(r.x-e.x) < 130 && Math.abs(r.y-e.y) < 40){
        if (r.st==='tied') r.tied = 0;
        enemyGrab(e); e.grab2 = true; r.need = 13;
      } else { e.st = 'walk'; e.t = 0; e.cd = 1.0; }
    }
    return true; }
  case 'toTied': { // Rudy est attaché : elle marche vers lui
    e.face = Math.sign(dx)||e.face;
    const tx = r.x - e.face*70;
    e.x += Math.sign(tx - e.x)*Math.min(Math.abs(tx-e.x), 150*dt);
    e.y += Math.sign(dy)*Math.min(Math.abs(dy), 80*dt);
    e.walkT = (e.walkT||0)+dt; e.fr = (e.walkT/0.11)%6;
    if (r.st !== 'tied'){ e.st = 'walk'; e.t = 0; e.cd = 0.8; return true; }
    if (Math.abs(tx - e.x) < 8 && Math.abs(dy) < 6){ enemyGrab(e); }
    return true; }
  case 'walk': {
    if (r.st==='tied'){ e.st = 'toTied'; e.t = 0; return true; }
    walkAI(e, dt, dx, dy, adx);
    if (['grabbed','grabbing','dead'].includes(r.st)) return true;
    if (e.cd<=0 && adx > 230 && Math.abs(dy) < 34 && Math.random()<0.04){
      e.st = 'cast'; e.t = 0; e.cast = false; e.spell = Math.random()<0.5 ? 'tornado' : 'vine'; return true;
    }
    if (e.cd<=0 && adx < e.K.reach+14 && Math.abs(dy) < 22 && r.st!=='down' && r.inv<=0){
      if (game.grabCD<=0 && Math.random()<0.4){ enemyGrab(e); return true; }
      if (Math.random()<0.25){ e.st = 'cast'; e.t = 0; e.cast = false; e.spell = Math.random()<0.5?'tornado':'vine'; e.x -= Math.sign(dx)*40; return true; }
      e.st='attack'; e.t=0; e.lastHitF=-1; e.face = Math.sign(dx)||e.face; SFX.whoosh(); e.atkS = (K.atk2 && Math.random()<0.5) ? '_atk2' : '_atk';
    }
    // téléportation : quand elle veut, de près comme de loin
    if (e.cd<=0 && game.grabCD<=0 && r.st!=='down' && Math.random()<0.012){ e.st = 'tpOut'; e.t = 0; e.fr = 0; SFX.charge(); return true; }
    if (e.cd < -2.5 && Math.random()<0.03){ e.st = 'cast'; e.t = 0; e.cast = false; e.spell = Math.random()<0.5?'tornado':'vine'; }
    return true; }
  }
  return false;   // 'attack' : géré comme les autres
}

// ------------------------------------------------------- PROJECTILES
function updateShots(dt){
  const r = rudy;
  for (const s of game.shots){
    s.t += dt; s.x += s.vx*dt;
    if (s.type==='energy'){
      s.trail.push({x:s.x, y:s.y - s.z, t:0}); if (s.trail.length>14) s.trail.shift();
      for (const p of s.trail) p.t += dt;
      if (Math.random()<0.8) game.parts.push({type:'spark', x:s.x + (Math.random()-0.5)*30, y:s.y - s.z + (Math.random()-0.5)*30, vx:-Math.sign(s.vx)*(40+Math.random()*80), vy:(Math.random()-0.5)*80, t:0, life:0.35});
      for (const e of living()){
        if (s.hit.includes(e) || !targetable(e)) continue;
        if (Math.abs(e.x-s.x) < (s.big?80:55) && Math.abs(e.y-s.y) < (s.big?48:34)){
          s.hit.push(e); addFx(s.big?'burstR':'burstY', e.x, e.y-100*depth(e.y)); SFX.big(); game.shake = s.big ? 0.3 : 0.16;
          hurtEnemy(e, (s.big ? 130 : 60)*PVX, true);
        }
      }
      continue;
    }
    if (s.done) continue;
    if (s.type==='gfire'){
      if (s.t < s.T){ s.y += s.vy*dt; s.z += s.vz*dt; }
      s.trail.push({x:s.x, y:s.y - s.z, t:0}); if (s.trail.length>12) s.trail.shift();
      if (Math.random()<0.7) game.parts.push({type:'spark', x:s.x + (Math.random()-0.5)*20, y:s.y - s.z + (Math.random()-0.5)*20, vx:-Math.sign(s.vx)*(40+Math.random()*80), vy:(Math.random()-0.5)*70, t:0, life:0.3, green:true});
      if (!r.hidden && Math.abs(s.x-r.x) < 44 && Math.abs(s.y-r.y) < 28 && r.inv<=0 && !['down','dead','tied','grabbed','grabbing'].includes(r.st)){
        s.done = true; if (hurtRudy(10, s.last, {x:s.x - s.vx, ko:'cen_feu'})) addFx('burstG', r.x, r.y-100*depth(r.y));
      }
      if (s.t > 3) s.done = true;
      continue;
    }
    if (s.type==='tornado'){
      if (Math.random()<0.7) game.parts.push({type:'leaf', x:s.x+(Math.random()-0.5)*50, y:s.y-Math.random()*120, vx:(Math.random()-0.5)*120, vy:-40-Math.random()*60, t:0, life:0.6, free:true});
      if (!r.hidden && Math.abs(s.x-r.x) < 50 && Math.abs(s.y-r.y) < 30 && r.inv<=0 && !['down','dead','tied'].includes(r.st)){
        s.done = true; hurtRudy(15, true, {x:s.x - s.vx, ko:'rou_tornade'}); addFx('burstG', r.x, r.y-90);
      }
    }
    if (s.type==='vine'){
      if (!r.hidden && Math.abs(s.x-r.x) < 46 && Math.abs(s.y-r.y) < 30 && r.inv<=0 && !['down','dead','tied','grabbed','grabbing'].includes(r.st)){
        s.done = true; SFX.vine(); game.shake = 0.12;
        r.hp -= 6; if (r.hp <= 0){ r.hp = 0; killRudy('rou_lianes'); continue; }
        setR('tied'); r.tied = 1; r.mash = 0; r.need = 10; r.face = -Math.sign(s.vx)||r.face;
      }
    }
  }
  game.shots = game.shots.filter(s=>!s.done && s.x > game.cam-300 && s.x < game.cam+W+300);
}

// ------------------------------------------------------- CRISTAUX
function crystalBurst(x, y, n){
  const d = depth(y);
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, r0 = (20 + Math.random()*60)*d;
    game.parts.push({type:'crystal', x:x + Math.cos(a)*r0, y:y - 110*d + Math.sin(a)*r0*1.4, vx:Math.cos(a)*(30+Math.random()*90), vy:Math.sin(a)*(30+Math.random()*90) - 20, rot:Math.random()*6, spin:(Math.random()-0.5)*8, s:(5+Math.random()*9)*d, t:0, life:0.5+Math.random()*0.5});
  }
}
// ------------------------------------------------------- EFFETS
function drawGunFx(f){
  const p = f.t/f.life;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (f.type==='tracer'){ const g = ctx.createLinearGradient(f.x, f.y, f.x2, f.y); g.addColorStop(0, `rgba(255,240,180,${0.9*(1-p)})`); g.addColorStop(1, `rgba(255,170,60,${0.25*(1-p)})`);
    ctx.strokeStyle = g; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y); ctx.stroke(); }
  else { const r = 14*(1-p*0.4); const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r); g.addColorStop(0, 'rgba(255,255,220,1)'); g.addColorStop(0.4, 'rgba(255,200,80,0.9)'); g.addColorStop(1, 'rgba(255,120,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(f.x + f.f*6, f.y, r*1.5, r*0.8, 0, 0, Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function addFx(type, x, y){ game.fx.push({type, x, y, t:0, life: {tpBreak:1.0, drain:0.6, heal:1.0, heal2:1.6, burstY:0.45, burstR:0.6, burstG:0.45, vineBurst:0.6}[type] || 0.3}); }

// ambiance : pétales, lucioles, gouttes, brume
function updateAmbient(dt){
  if (game.state==='title') return;
  const m = MAPS[game.map], bg = BGS[m.bg];
  const wind = 30 + game.gust*90;
  if (m.petals && game.parts.filter(p=>p.type==='petal').length < (game.map===0 ? 26 : 14) && Math.random()<dt*8){
    game.parts.push({type:'petal', x:game.cam + Math.random()*W*1.2 - 60, y:-10 - Math.random()*40, vx:wind, vy:25+Math.random()*25, t:0, life:12, rot:Math.random()*6, spin:(Math.random()-0.5)*4, col:m.petals, s:3+Math.random()*3});
  }
  if (game.parts.filter(p=>p.type==='fly').length < 14 && Math.random()<dt*3){
    game.parts.push({type:'fly', x:game.cam + Math.random()*W, y:230 + Math.random()*200, t:0, life:5+Math.random()*4, ph:Math.random()*6});
  }
  // gouttes de liquide blanc sur la carte du boss
  if (bg.drips.length && Math.random() < dt*14){
    const d = bg.drips[Math.floor(Math.random()*bg.drips.length)];
    game.drops.push({x:d[0], y:d[2], y0:d[2], vy:0, t:0, fallTo:d[2] + 40 + Math.random()*120});
  }
  for (const d of game.drops){ d.t += dt; if (d.t > 0.35){ d.vy += 700*dt; d.y += d.vy*dt; } }
  for (const d of game.drops) if (d.y >= d.fallTo && !d.splash){ d.splash = 1; game.parts.push({type:'splash', x:d.x, y:d.fallTo, t:0, life:0.35}); }
  game.drops = game.drops.filter(d=>!d.splash);
  for (const p of game.parts){
    p.t += dt;
    if (p.type==='petal'){ p.vx = lerp(p.vx, wind + Math.sin(p.t*2+p.rot)*20, dt); p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.spin*dt; if (p.y > 470) p.t = p.life; }
    else if (p.type==='fly'){ p.x += Math.sin(p.t*0.9+p.ph)*18*dt + wind*0.1*dt; p.y += Math.cos(p.t*1.3+p.ph)*14*dt; }
    else if (p.type==='mud' || p.type==='spark'){ p.x += p.vx*dt; p.y += p.vy*dt; if (p.type==='mud') p.vy += 500*dt; }
    else if (p.type==='dust'){ p.x += p.vx*dt; p.y += p.vy*dt; }
    else if (p.type==='star'){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy -= 20*dt; p.vx *= 0.98; }
    else if (p.type==='crystal'){ p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.spin*dt; }
    else if (p.type==='leaf'){ if (p.free){ p.x += p.vx*dt; p.y += p.vy*dt; } else { const k = p.t/p.life; p.x = lerp(p.x, p.tx, k*0.25); p.y = lerp(p.y, p.ty, k*0.25); } }
  }
  game.parts = game.parts.filter(p=>p.t < p.life);
}

function drawWorld(){
  const m = MAPS[game.map];
  const shx = game.shake>0 ? (Math.random()-0.5)*8 : 0, shy = game.shake>0 ? (Math.random()-0.5)*4 : 0;
  BGR.draw(m.bg, game.cam, game.t, game.gust, shx, shy);
  ctx.save(); ctx.translate(-Math.round(game.cam)+shx, shy);
  drawAmbientBack();
  // ordre d'affichage par profondeur
  const list = [];
  for (const e of game.ents) list.push(e);
  list.push(rudy);
  for (const c of game.crates) list.push({crate:c, y:c.y});
  for (const c of game.chickens) list.push({chicken:c, y:c.y});
  const sy = e=>(!e.isRudy && !e.crate && !e.chicken && (e.st==='grab'||e.st==='grabbedByR')) ? e.pairY+1 : e.y;
  list.sort((a,b)=>sy(a)-sy(b));
  for (const e of list) if (!e.crate && !e.chicken) drawShadow(e);
  for (const e of list){ if (e.crate) drawCrate(e.crate); else if (e.chicken) drawChicken(e.chicken); else if (e.isRudy) drawRudy(); else drawEnemy(e); }
  for (const s of game.shots) drawShot(s);
  drawParticles();
  drawFx();
  if (atExit()){ ctx.fillStyle = 'rgba(200,255,160,0.14)'; ctx.fillRect(worldW()-160, m.yMin-40, 160, m.yMax-m.yMin+70); }
  drawAmbientFront();
  ctx.restore();
}
function drawShadow(e){
  if (e.isRudy){ if (rudy.hidden) return; }
  else if (e.st==='gone') return;
  else if (e.dead && e.alpha<0.3) return;
  else if (e.st==='vanish' && e.t > 0.6) return;
  let rx = e.isRudy ? 40 : e.K.shadow, x = e.x, y = e.y;
  if (!e.isRudy && (e.st==='grab'||e.st==='grabbedByR')){ x = e.pairX; y = e.pairY; rx = Math.max(rx, 60); }
  if (e.isRudy && rudy.st==='tied') rx = 70;
  const d = depth(y), z = (!e.isRudy && e.z) || 0;
  ctx.fillStyle = `rgba(0,0,0,${0.38*Math.max(0.35, 1 - z/120) * (e.alpha==null?1:e.alpha)})`;
  ctx.beginPath(); ctx.ellipse(x, y+2, rx*d*(1 - z/300), 9*d, 0, 0, Math.PI*2); ctx.fill();
}
function drawRudy(){
  const r = rudy; if (r.hidden) return;
  if (r.ghosts){ for (const g of r.ghosts) g.t += 1/60; r.ghosts = r.ghosts.filter(g=>g.t < 0.25);
    for (const g of r.ghosts) drawFrame('r_run', g.fr, g.x, g.y, g.face, 0.35*(1-g.t/0.25), depth(g.y)); }
  let k = 'r_punch', n = 0;
  switch(r.st){
    case 'walk': k = 'r_run'; n = r.fr; break;
    case 'punch': case 'punch2': k = 'r_punch'; n = r.fr; break;
    case 'punch3': k = 'r_upper'; n = r.fr; break;
    case 'beam': k = 'r_punch'; n = r.fr; break;
    case 'kick': k = 'r_kick'; n = r.fr; break;
    case 'gun': k = 'r_gun'; n = 0; break;
    case 'tied': k = 'r_tied'; n = Math.floor(game.t*3.2)%2; break;
    case 'hurt': case 'down': case 'dead': k = 'r_fall'; n = r.fr; break;
  }
  const blink = r.inv>0 && !['down','tied'].includes(r.st) && Math.floor(game.t*20)%2===0;
  const d = depth(r.y);
  // respiration au repos
  if (r.st==='idle'){
    const b = 1 + Math.sin(game.t*3.2)*0.012;
    ctx.save(); ctx.translate(r.x, r.y); ctx.scale(1, b); ctx.translate(-r.x, -r.y);
    drawFrame(k, n, r.x, r.y, r.face, blink?0.45:1, d); ctx.restore();
  } else if (r.st==='gun'){ const rc = r.t<0.12 ? (1-r.t/0.12)*5 : 0; drawFrame(k, n, r.x - r.face*rc, r.y, r.face, blink?0.45:1, d); }
  else drawFrame(k, n, r.x, r.y, r.face, blink?0.45:1, d);
  if (r.st==='beam' && !r.cast){ // boule qui se charge entre ses mains
    const p = r.t/(r.big?0.45:0.28), x = r.x + r.face*44*d, y = r.y - 132*d;
    drawEnergyOrb(x, y, 8 + p*(r.big?32:18), r.t, r.big);
  }
  if (r.st==='tied') drawVinesOnRudy(r);
}
function drawEnemy(e){
  const k = e.kind, K = e.K;
  let sheet = k+'_run', n = e.fr, x = e.x, y = e.y, face = e.face;
  let z = K.fly ? e.z + Math.sin(e.bob*3)*5 : (e.z||0);
  switch(e.st){
    case 'intro': case 'walk': case 'toTied': sheet = k+'_run';
      if (!K.fly && !K.boss && !e.moving){ sheet = k+'_atk'; n = 0; }   // garde au repos
      break;
    case 'attack': sheet = k+(e.atkS||'_atk'); break;
    case 'hurt': if (!K.boss){ sheet = k+'_atk'; n = 0; break; }
    case 'down': case 'rise': sheet = k+'_fall'; break;
    case 'vanish': drawVanish(e); return;
    case 'cast': sheet = 'rou_cast'; break;
    case 'tpOut': case 'tpIn': sheet = 'rou_tp'; break;
    case 'gone': return;
    case 'prep': sheet = 'cen_atk'; n = 0; break;
    case 'punch': sheet = 'cen_punch'; break;
    case 'beam': case 'fire': sheet = 'cen_beam'; break;
    case 'charge': case 'bounce': sheet = 'cen_atk'; break;
    case 'grabbedByR': case 'grab': {
      sheet = k + (e.st==='grab' ? (e.grab2 ? '_eg2' : '_eg') : '_rg');
      const s = SPR[sheet];
      face = (e.rSide === s.rs) ? s.dir : -s.dir;
      drawFrame(sheet, n, e.pairX, e.pairY, face, 1, depth(e.pairY), e.jig);
      return; }
  }
  if (K.fly && (e.st==='down' || e.st==='hurt')) z = e.z;
  const d = depth(y);
  let a = e.dead ? Math.max(0, e.alpha) * (Math.floor(game.t*16)%2 ? 1 : 0.35) : (e.alpha==null ? 1 : e.alpha);
  if (K.boss===1 && e.phased) a = Math.max(0, e.alpha);
  drawFrame(sheet, n, x, y - z, face, a, d, e.dead ? null : e.jig);
  if (e.flash>0){ ctx.save(); ctx.globalCompositeOperation = 'lighter'; drawFrame(sheet, n, x, y - z, face, e.flash*4, d); ctx.restore(); }
  if (e.st==='beam') drawLaser(e, n, d);
  if (e.st==='fire'){ // boule verte qui se forme dans la main
    const hp = handPos(e), hx = hp.x, hy = e.y - hp.z, rad = 10 + Math.sin(game.t*30)*2;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, rad*2.4);
    g.addColorStop(0, 'rgba(230,255,230,0.9)'); g.addColorStop(0.4, 'rgba(90,255,110,0.7)'); g.addColorStop(1, 'rgba(0,180,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, rad*2.4, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
  if (!K.boss && e.hpShow>0 && !e.dead){
    const h = Math.min(frameH(sheet, n)*d, 250);
    const by = y - z - h - 14;

function drawLaser(e, n, d){
  const s = SPR.cen_beam, h = s.hand[Math.min(Math.floor(n), s.hand.length-1)];
  const sg = (s.dir === e.face) ? 1 : -1;
  const hx = e.x + sg*h[0]*d, hy = e.y - h[1]*d, dir = e.face;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (e.t < 0.4){ // l'énergie verte se concentre dans sa main
    const p = e.t/0.4, rad = 6 + p*16;
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, rad*2.2);
    g.addColorStop(0, 'rgba(230,255,230,0.95)'); g.addColorStop(0.35, 'rgba(90,255,110,0.8)'); g.addColorStop(1, 'rgba(0,180,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, rad*2.2, 0, Math.PI*2); ctx.fill();
  } else if (e.t < 1.05){ // le rayon laser
    const len = 1300, k = Math.min(1, (e.t-0.4)/0.08), fade = Math.min(1, (1.05-e.t)/0.12);
    const w = (16 + Math.sin(game.t*60)*3)*d*fade;
    // rayon qui descend vers la ligne de Rudy
    // rayon droit qui part de sa main, passe à hauteur de poitrine sur Rudy et frappe le sol derrière lui
    const tx = (e.beamTx != null ? e.beamTx : hx + dir*400), ty = e.y - 105*d;
    let vx = tx - hx, vy = ty - hy; const gy = e.y + 4;
    const tEnd = (gy - hy) / Math.max(1, vy);           // jusqu'au sol
    const fx = hx + vx*tEnd, fyy = gy;
    const ex = hx + (fx - hx)*k, ey = hy + (fyy - hy)*k;
    ctx.lineCap = 'round';
    const path = ()=>{ ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ex, ey); };
    ctx.strokeStyle = `rgba(40,255,90,${0.35*fade})`; ctx.lineWidth = w*2.6; path(); ctx.stroke();
    ctx.strokeStyle = `rgba(110,255,130,${0.8*fade})`; ctx.lineWidth = w; path(); ctx.stroke();
    ctx.strokeStyle = `rgba(240,255,240,${0.95*fade})`; ctx.lineWidth = w*0.35; path(); ctx.stroke();
    if (k >= 1){ // impact au sol
      const g2 = ctx.createRadialGradient(fx, fyy, 0, fx, fyy, 60*d);
      g2.addColorStop(0, `rgba(220,255,220,${0.9*fade})`); g2.addColorStop(0.4, `rgba(80,255,110,${0.6*fade})`); g2.addColorStop(1, 'rgba(0,160,40,0)');
      ctx.fillStyle = g2; ctx.beginPath(); ctx.ellipse(fx, fyy, 60*d, 22*d, 0, 0, Math.PI*2); ctx.fill();
      if (Math.random()<0.6) game.parts.push({type:'mud', x:fx, y:fyy, vx:(Math.random()-0.5)*200, vy:-100-Math.random()*150, t:0, life:0.5});
    }
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 30*d);
    g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(60,255,90,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, 30*d, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

    for (let i=0;i<9;i++){
      const a0 = t*6 + i*0.7 + Math.random()*0.5; ctx.beginPath();

function drawShot(s){
  const d = depth(s.y);
  if (s.type==='energy'){
    const x = s.x, y = s.y - s.z;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x, s.y+2, 26*d, 7*d, 0, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    s.trail.forEach((p, i)=>{ const a = i/s.trail.length; const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 26*a+6);
      g.addColorStop(0, s.big ? `rgba(255,120,80,${0.45*a})` : `rgba(255,240,140,${0.35*a})`); g.addColorStop(1, 'rgba(255,170,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 26*a+6, 0, Math.PI*2); ctx.fill(); });
    ctx.restore();

    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    s.trail.forEach((p, i)=>{ const a = i/s.trail.length; const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, (22*a+5)*d);
      g.addColorStop(0, `rgba(140,255,120,${0.45*a})`); g.addColorStop(1, 'rgba(0,160,40,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, (22*a+5)*d, 0, Math.PI*2); ctx.fill(); });
    // flammes autour de la boule
    for (let i=0;i<7;i++){ const a = s.t*12 + i*0.9, fx = x - Math.sign(s.vx)*(8 + (i%3)*7)*d, fy = y + Math.sin(a)*rad*0.6;
      const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, rad*0.9); g.addColorStop(0, 'rgba(120,255,90,0.5)'); g.addColorStop(1, 'rgba(0,140,30,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, rad*0.9, 0, Math.PI*2); ctx.fill(); }
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad*1.8);
    g.addColorStop(0, 'rgba(245,255,240,1)'); g.addColorStop(0.3, 'rgba(120,255,110,0.95)'); g.addColorStop(0.7, 'rgba(30,200,60,0.5)'); g.addColorStop(1, 'rgba(0,120,30,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad*1.8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else if (s.type==='tornado'){
    const x = s.x, base = s.y, h = 150*d;
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(x, base+2, 40*d, 9*d, 0, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i=0;i<22;i++){
      const t = i/21, yy = base - t*h, w = (14 + t*46)*d;
      const a = s.t*14 + i*0.7;
      ctx.strokeStyle = `rgba(${90+t*80|0},${220+t*30|0},${110+t*40|0},${0.55 - t*0.2})`; ctx.lineWidth = 3 + (1-t)*2;
      ctx.beginPath(); ctx.ellipse(x + Math.sin(a*0.5)*6*t, yy, w, w*0.28, 0, a, a + 3.6); ctx.stroke();
    }
    const g = ctx.createRadialGradient(x, base - h*0.5, 4, x, base - h*0.5, h*0.6);
    g.addColorStop(0, 'rgba(160,255,160,0.35)'); g.addColorStop(1, 'rgba(40,160,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, base - h*0.5, h*0.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else if (s.type==='vine'){
    const x = s.x, y = s.y - s.z*d, dir = Math.sign(s.vx);
    ctx.save(); ctx.lineCap = 'round';
    for (let j=0;j<3;j++){
      ctx.strokeStyle = j===1 ? '#58b844' : '#2f7d2a'; ctx.lineWidth = (6 - j)*d;
      ctx.beginPath();
      const L = Math.min(Math.abs(s.x - s.ox), 260);
      for (let i=0;i<=24;i++){ const t = i/24; const px = x - dir*t*L; const py = y + Math.sin(t*10 + s.t*14 + j*2)*(6+j*3)*d + (j-1)*8*d; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
    }
    ctx.fillStyle = '#7fd35a';
    for (let i=0;i<6;i++){ const t = i/6, L = Math.min(Math.abs(s.x - s.ox), 260); ctx.beginPath(); ctx.ellipse(x - dir*t*L, y + Math.sin(t*10 + s.t*14)*8*d - 6*d, 7*d, 3.5*d, dir*0.6, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
}

// petites images pré-calculées (plus rapide sur téléphone)
function radialImg(size, stops){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'), g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  for (const [o, col] of stops) g.addColorStop(o, col);
  x.fillStyle = g; x.fillRect(0, 0, size, size); return c;
}

// ambiance derrière les persos : champignons qui brillent, gouttes qui coulent
function drawAmbientBack(){
  const m = MAPS[game.map], bg = BGS[m.bg];
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, s] of bg.glow){
    if (x < game.cam-40 || x > game.cam+W+40) continue;
    const a = (0.12 + 0.12*Math.sin(game.t*2 + x*0.07)) * (0.5 + s);
    const rr = 22 + s*14;
    ctx.globalAlpha = Math.min(1, a); ctx.drawImage(GLOW, x-rr, y-rr, rr*2, rr*2);
  }
  // filets blancs qui scintillent et gouttes qui tombent
  for (const [x, y0, y1] of bg.drips){
    if (x < game.cam-20 || x > game.cam+W+20) continue;
    const ph = (game.t*0.6 + x*0.013) % 1;
    const yy = lerp(y0, y1, ph);
    ctx.globalAlpha = 0.55; ctx.drawImage(DRIP, x-6, yy-6, 12, 12);
  }
  ctx.restore();
  for (const d of game.drops){
    if (d.x < game.cam-20 || d.x > game.cam+W+20) continue;
    const grow = Math.min(1, d.t/0.35);
    ctx.fillStyle = 'rgba(232,240,252,0.92)';
    ctx.beginPath(); ctx.ellipse(d.x, d.y + 2*grow, 1.6 + grow*0.8, 2 + grow*1.6 + Math.min(4, d.vy*0.01), 0, 0, Math.PI*2); ctx.fill();
  }
}
