<title>Taxi Turbo</title>

<style>
/* Arcade ensoleillée : jaune taxi, damier noir et blanc, ciel bleu */
:root{
  --ink:#fffaf0; --dark:#14161c; --panel:#1d2130; --taxi:#ffcf1a; --red:#ff3b30; --green:#2fd27a; --sky:#3fb6ff; --pink:#ff6fb5; --dim:#c3c8d8;
  --f-comic:"Bangers","Impact",system-ui,sans-serif; --f-ui:"Nunito","Segoe UI",system-ui,sans-serif; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#14161c;color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--f-ui);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--taxi);outline-offset:3px}
.screen{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(180deg,rgba(20,22,28,.25),rgba(20,22,28,.8))}
.wrap{min-height:100%;box-sizing:border-box;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.center{justify-content:center;align-items:center;text-align:center}
.logo{font-family:var(--f-comic);font-size:clamp(64px,13vw,150px);line-height:.85;margin:0;color:var(--taxi);transform:rotate(-4deg);
  -webkit-text-stroke:4px var(--dark);text-shadow:6px 6px 0 var(--red),11px 11px 0 var(--dark)}
.logo span{display:block;font-size:.55em;color:#fff;text-shadow:5px 5px 0 var(--sky),9px 9px 0 var(--dark)}
.checker{height:14px;background:repeating-linear-gradient(90deg,#111 0 14px,#fff 14px 28px);border:3px solid var(--dark);border-radius:4px;max-width:420px;width:100%}
.btn{border:4px solid var(--dark);border-radius:14px;padding:12px 28px;font-family:var(--f-comic);font-size:28px;letter-spacing:.06em;color:var(--dark);background:var(--taxi);box-shadow:5px 5px 0 var(--dark);transform:rotate(-1deg)}
.btn:active{transform:translate(3px,3px) rotate(-1deg);box-shadow:2px 2px 0 var(--dark)}
.btn.ghost{background:#fff;font-size:20px;padding:9px 18px}
.h1{font-family:var(--f-comic);font-size:clamp(30px,5.5vw,46px);margin:0;letter-spacing:.04em;color:#fff;text-shadow:3px 3px 0 var(--dark)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--taxi)}
.hint{color:var(--dim);font-size:14px;line-height:1.5;margin:0;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:rgba(29,33,48,.92);border:4px solid var(--dark);border-radius:16px;padding:14px;box-shadow:5px 5px 0 var(--dark);display:flex;flex-direction:column;gap:10px}
.drivers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.drv{border:4px solid var(--dark);border-radius:14px;padding:12px;background:linear-gradient(160deg,var(--c),#1d2130 85%);box-shadow:4px 4px 0 var(--dark);text-align:left;display:flex;flex-direction:column;gap:4px}
.drv b{font-family:var(--f-comic);font-size:26px;letter-spacing:.04em;text-shadow:2px 2px 0 var(--dark)}
.drv small{font-weight:900;color:var(--dark);background:rgba(255,255,255,.85);border-radius:6px;padding:1px 6px;align-self:flex-start;font-size:11px}
.drv span{font-size:12.5px;font-weight:700;color:var(--dim)}
.drv[aria-pressed="true"]{outline:4px solid #fff;transform:translateY(-3px) rotate(-1deg)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:3px solid var(--dark);background:#fff;color:var(--dark);border-radius:10px;padding:8px 12px;font-weight:900;font-size:14px;box-shadow:3px 3px 0 var(--dark)}
.seg button[aria-pressed="true"]{background:var(--taxi)}
.opt{display:flex;flex-direction:column;gap:6px}
.opt>span{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.moves{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13.5px;font-weight:700;text-align:left}
.moves b{color:var(--taxi);font-family:var(--f-comic);font-size:17px;letter-spacing:.04em}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
#time{font-family:var(--f-comic);font-size:54px;line-height:.9;color:var(--taxi);-webkit-text-stroke:2px var(--dark);text-shadow:3px 3px 0 var(--dark)}
#time.low{color:#ff5a4a;animation:blink .5s infinite}
@keyframes blink{50%{opacity:.4}}
#money{font-family:var(--f-comic);font-size:30px;color:#7dff9a;text-shadow:2px 2px 0 var(--dark)}
#fares{font-size:12px;font-weight:900;letter-spacing:.08em;text-shadow:1px 1px 0 var(--dark)}
.tc{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:240px}
#arrow{width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:54px solid var(--green);filter:drop-shadow(3px 3px 0 var(--dark));transition:transform .05s linear}
#dest{font-family:var(--f-comic);font-size:22px;letter-spacing:.04em;text-shadow:2px 2px 0 var(--dark);white-space:nowrap}
#fare{font-family:var(--f-comic);font-size:30px;color:#fff;text-shadow:2px 2px 0 var(--dark);line-height:1}
#fare.low{color:#ff5a4a}
.comfort{display:flex;align-items:center;gap:6px;font-weight:900;font-size:12px;text-shadow:1px 1px 0 var(--dark)}
.comfort i{display:block;width:110px;height:10px;border:2px solid var(--dark);border-radius:6px;background:#2a1b1b;overflow:hidden}
.comfort i b{display:block;height:100%;background:var(--green)}
#face{font-size:24px;filter:drop-shadow(1px 1px 0 var(--dark))}
#bubble{position:absolute;top:calc(166px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(60vw,420px);background:#fff;color:var(--dark);border:4px solid var(--dark);border-radius:20px;padding:8px 14px;font-weight:900;font-size:16px;box-shadow:4px 4px 0 var(--dark);opacity:0;transition:opacity .2s}
#bubble.on{opacity:1}
#bubble::after{content:"";position:absolute;left:24px;bottom:-16px;border-left:12px solid transparent;border-right:12px solid transparent;border-top:16px solid var(--dark)}
#announce{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--f-comic);font-size:clamp(34px,7vw,78px);color:var(--taxi);-webkit-text-stroke:3px var(--dark);text-shadow:5px 5px 0 var(--dark);opacity:0}
#announce small{display:block;font-size:.45em;color:#fff;-webkit-text-stroke:1.5px var(--dark)}
#announce.on{animation:ann 1.8s ease-out forwards}
@keyframes ann{0%{opacity:0;transform:scale(1.7) rotate(-4deg)}12%{opacity:1;transform:scale(1) rotate(-3deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.1) rotate(-3deg)}}
#near{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-family:var(--f-comic);font-size:30px;color:#7dff9a;text-shadow:3px 3px 0 var(--dark);opacity:0;transition:opacity .2s}
#map{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:132px;height:132px;border-radius:50%;border:4px solid var(--dark);box-shadow:3px 3px 0 var(--dark);background:#2b3a2a}
#speed{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-family:var(--f-comic);font-size:34px;text-shadow:3px 3px 0 var(--dark);text-align:center;line-height:.9}
#speed small{display:block;font-size:14px;letter-spacing:.1em}
#turboBar{width:90px;height:8px;border:2px solid var(--dark);border-radius:5px;margin:4px auto 0;background:#222;overflow:hidden}
#turboBar b{display:block;height:100%;background:linear-gradient(90deg,#ff8a00,#ffd23f)}
/* commandes */
.pad{position:fixed;inset:0;pointer-events:none}
.pb{position:absolute;border:4px solid var(--dark);font-family:var(--f-comic);font-size:20px;letter-spacing:.04em;display:grid;place-items:center;pointer-events:auto;touch-action:none;box-shadow:3px 3px 0 var(--dark);opacity:.92;line-height:1;color:var(--dark);padding:0}
.pb.on{transform:scale(.92);filter:brightness(1.25)}
#bL,#bR{bottom:calc(16px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:24px;background:#fff;font-size:44px}
#bL{left:max(14px,env(safe-area-inset-left,0px))}
#bR{left:calc(max(14px,env(safe-area-inset-left,0px)) + 108px)}
#bGas{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:104px;height:120px;border-radius:22px;background:linear-gradient(180deg,#9dffb8,var(--green));font-size:24px}
#bBrake{right:calc(max(14px,env(safe-area-inset-right,0px)) + 116px);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:20px;background:linear-gradient(180deg,#ffb0a8,var(--red));color:#fff;font-size:19px}
#bBoost{right:calc(max(14px,env(safe-area-inset-right,0px)) + 20px);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#ff8a00);font-size:18px}
#bHorn{right:calc(max(14px,env(safe-area-inset-right,0px)) + 124px);bottom:calc(118px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;background:#fff;font-size:26px}
.topbar{position:absolute;top:calc(148px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px;pointer-events:auto}
.topbar button{border:3px solid var(--dark);background:#fff;color:var(--dark);border-radius:10px;width:42px;height:38px;font-weight:900;font-size:15px;box-shadow:2px 2px 0 var(--dark)}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,18,.78);padding:16px;overflow:auto}
.panel .card{max-width:560px;width:100%;text-align:center;align-items:stretch;max-height:100%;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-weight:800;font-variant-numeric:tabular-nums}
.tbl td{padding:7px 6px;border-bottom:2px solid rgba(255,255,255,.08);text-align:right}
.tbl td:first-child{text-align:left;color:var(--dim)}
.grade{font-family:var(--f-comic);font-size:110px;line-height:1;color:var(--taxi);-webkit-text-stroke:4px var(--dark);text-shadow:6px 6px 0 var(--red)}
#rotate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#3a3f55,#14161c 70%)}
#rotate .phone{width:70px;height:120px;border:6px solid var(--taxi);border-radius:14px;margin:0 auto 22px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#14161c}
@media (prefers-reduced-motion:reduce){#time.low{animation:none}}
</style>

<script>
/* =====================================================================
   MOTEUR 3D (WebGL2) — rendu instancié de formes simples
   Tout est dessiné avec des cubes, sphères, cylindres, cônes et disques,
   empilés via une pile de matrices (comme un vieux OpenGL).
   ===================================================================== */
'use strict';
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  lerp: (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k],
  dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
  hdist: (a, b) => Math.hypot(a[0] - b[0], a[2] - b[2])
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);
function hex(h, k) { const n = parseInt(h.slice(1), 16); const c = [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; return k == null ? c : c.map(v => Math.min(1, v * k)); }
function mixC(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }

/* ---------- matrices 4x4 (colonne majeure) ---------- */
const M4 = {
  ident() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(o, a, b) {
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    }
    return o;
  },
  persp(fov, asp, n, f) { const m = new Float32Array(16), t = 1 / Math.tan(fov / 2); m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m; },
  lookAt(e, c, up) {
    const z = V3.norm(V3.sub(e, c)), x = V3.norm(V3.cross(up, z)), y = V3.cross(z, x), m = new Float32Array(16);
    m[0] = x[0]; m[4] = x[1]; m[8] = x[2]; m[1] = y[0]; m[5] = y[1]; m[9] = y[2]; m[2] = z[0]; m[6] = z[1]; m[10] = z[2];
    m[12] = -V3.dot(x, e); m[13] = -V3.dot(y, e); m[14] = -V3.dot(z, e); m[15] = 1; return m;
  }
};

/* ---------- pile de transformations ---------- */
const XF = {
  m: M4.ident(), stack: [], depth: 0, tmp: new Float32Array(16), tmp2: new Float32Array(16),
  reset() { this.identity(); this.depth = 0; },
  identity() { const m = this.m; m.fill(0); m[0] = m[5] = m[10] = m[15] = 1; },
  push() { if (!this.stack[this.depth]) this.stack[this.depth] = new Float32Array(16); this.stack[this.depth].set(this.m); this.depth++; },
  pop() { this.depth--; this.m.set(this.stack[this.depth]); },
  apply(b) { M4.mul(this.tmp2, this.m, b); this.m.set(this.tmp2); },
  t(x, y, z) { const m = this.m; m[12] += m[0] * x + m[4] * y + m[8] * z; m[13] += m[1] * x + m[5] * y + m[9] * z; m[14] += m[2] * x + m[6] * y + m[10] * z; },
  s(x, y, z) { const m = this.m; for (let i = 0; i < 3; i++) { m[i] *= x; m[4 + i] *= y; m[8 + i] *= z; } },
  rx(a) { if (!a) return; const c = Math.cos(a), s = Math.sin(a), m = this.m; for (let i = 0; i < 4; i++) { const y = m[4 + i], z = m[8 + i]; m[4 + i] = y * c + z * s; m[8 + i] = z * c - y * s; } },
  ry(a) { if (!a) return; const c = Math.cos(a), s = Math.sin(a), m = this.m; for (let i = 0; i < 4; i++) { const x = m[i], z = m[8 + i]; m[i] = x * c - z * s; m[8 + i] = x * s + z * c; } },
  rz(a) { if (!a) return; const c = Math.cos(a), s = Math.sin(a), m = this.m; for (let i = 0; i < 4; i++) { const x = m[i], y = m[4 + i]; m[i] = x * c + y * s; m[4 + i] = y * c - x * s; } },
  pos() { return [this.m[12], this.m[13], this.m[14]]; },
  // oriente l'axe Y local le long d'un vecteur (pour les rayons, cylindres…)
  alignY(d) {
    const l = V3.len(d) || 1, y = [d[0] / l, d[1] / l, d[2] / l];
    let x = Math.abs(y[1]) < 0.95 ? V3.norm(V3.cross(y, [0, 1, 0])) : V3.norm(V3.cross(y, [1, 0, 0]));
    const z = V3.cross(x, y), b = this.tmp;
    b[0] = x[0]; b[1] = x[1]; b[2] = x[2]; b[3] = 0; b[4] = y[0]; b[5] = y[1]; b[6] = y[2]; b[7] = 0; b[8] = z[0]; b[9] = z[1]; b[10] = z[2]; b[11] = 0; b[12] = 0; b[13] = 0; b[14] = 0; b[15] = 1;
    M4.mul(this.tmp2, this.m, b); this.m.set(this.tmp2);
  }
};

/* ---------- géométries ---------- */
function geoCube() {
  const P = [], N = [], I = [];
  const faces = [[[1, 0, 0], [0, 1, 0], [0, 0, 1]], [[-1, 0, 0], [0, 1, 0], [0, 0, -1]], [[0, 1, 0], [0, 0, 1], [1, 0, 0]], [[0, -1, 0], [0, 0, -1], [1, 0, 0]], [[0, 0, 1], [0, 1, 0], [-1, 0, 0]], [[0, 0, -1], [0, 1, 0], [1, 0, 0]]];
  for (const [n, u, v] of faces) {
    const b = P.length / 3;
    for (const [a, c] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      P.push(n[0] * 0.5 + u[0] * a * 0.5 + v[0] * c * 0.5, n[1] * 0.5 + u[1] * a * 0.5 + v[1] * c * 0.5, n[2] * 0.5 + u[2] * a * 0.5 + v[2] * c * 0.5); N.push(...n);
    }
    // ordre des sommets tel que la face regarde vers n
    const p0 = [P[b * 3], P[b * 3 + 1], P[b * 3 + 2]], p1 = [P[b * 3 + 3], P[b * 3 + 4], P[b * 3 + 5]], p2 = [P[b * 3 + 6], P[b * 3 + 7], P[b * 3 + 8]];
    const cr = V3.cross(V3.sub(p1, p0), V3.sub(p2, p0));
    if (V3.dot(cr, n) > 0) I.push(b, b + 1, b + 2, b, b + 2, b + 3); else I.push(b, b + 2, b + 1, b, b + 3, b + 2);
  }
  return { P, N, I };
}
function geoSphere(seg, ring) {
  const P = [], N = [], I = [];
  for (let r = 0; r <= ring; r++) {

function collideCity(C, p, r) {

    const hx = b.w / 2, hz = b.d / 2, dx = p[0] - b.x, dz = p[2] - b.z;

  if (p[0] > L - r) { p[0] = L - r; hit = [-1, 0, 0]; }
  if (p[2] < -L + r) { p[2] = -L + r; hit = [0, 0, 1]; }

  if (!T.over && !T.demo && T.intro <= 0) { T.time -= dt; if (T.time <= 0) { T.time = 0; endGame(); } }
  T.C.env.flash = Math.max(0, T.C.env.flash - dt * 2);
  driveTaxi(tx, dt);
  updateCars(dt);
  updatePeds(dt);
  updateFare(dt);
  T.spawnT -= dt; if (T.spawnT <= 0) { T.spawnT = 1.5; if (T.clients.length < 22) spawnClient(false); }
  for (let i = T.smoke.length - 1; i >= 0; i--) { const s = T.smoke[i]; s.life -= dt; s.p = V3.add(s.p, V3.mul(s.v, dt)); s.s += dt * s.g; if (s.life <= 0) T.smoke.splice(i, 1); }
}
function puff(p, v, s, life, col, g, add) { if (T.smoke.length > 300) T.smoke.shift(); T.smoke.push({ p: p.slice(), v, s, life, max: life, col, g: g || 1.5, add }); }

/* ---------------- le taxi ---------------- */
function driveTaxi(tx, dt) {
  const ty = tx.ty, inp = tx.inp;
  const f = [Math.sin(tx.yaw), 0, Math.cos(tx.yaw)], r = [-f[2], 0, f[0]];
  let vl = V3.dot(tx.v, f), vs = V3.dot(tx.v, r);
  const frozen = T.over || T.intro > 0 || (tx.pass && tx.pass.boardT > 0);
  const gas = frozen ? 0 : inp.gas, brake = frozen ? 0 : inp.brake, steer = frozen ? 0 : inp.steer;
  if (frozen) { vl *= Math.exp(-6 * dt); vs *= Math.exp(-6 * dt); }
  // turbo
  tx.boostCd -= dt;
  if (!frozen && inp.boost && tx.boostCd <= 0 && vl > 3) { tx.boost = 1.6; tx.boostCd = 5; tev('boost', {}); }
  tx.boost -= dt;
  const maxV = ty.max * (tx.boost > 0 ? 1.35 : 1);
  if (gas > 0) { const a = (tx.boost > 0 ? ty.acc * 1.9 : ty.acc) * (1 - Math.max(0, vl) / maxV * 0.75); vl += a * gas * dt; }
  if (brake > 0) { if (vl > 0.5) vl -= 34 * brake * dt; else vl = Math.max(-13, vl - 12 * brake * dt); }
  if (!gas && !brake) vl *= Math.exp(-0.35 * dt);
  vl *= Math.exp(-0.06 * dt);
  if (vl > maxV) vl += (maxV - vl) * Math.min(1, dt * 2);
  // direction
  const spdK = clamp(Math.abs(vl) / 7, 0, 1);
  tx.steerA += (steer - tx.steerA) * Math.min(1, dt * 10);
  const rate = ty.steer * (1 - Math.min(0.45, Math.abs(vl) / 90));
  tx.yaw -= tx.steerA * rate * spdK * Math.sign(vl || 1) * dt;
  // adhérence : on dérape en freinant fort dans un virage
  const drifting = brake > 0.5 && Math.abs(steer) > 0.4 && vl > 14;
  const grip = drifting ? 2.2 : ty.grip;
  vs *= Math.exp(-grip * dt);
  tx.drift = Math.abs(vs);
  const f2 = [Math.sin(tx.yaw), 0, Math.cos(tx.yaw)], r2 = [-f2[2], 0, f2[0]];
  tx.v = V3.add(V3.mul(f2, vl), V3.mul(r2, vs));
  tx.p = V3.add(tx.p, V3.mul(tx.v, dt));
  tx.speed = V3.len(tx.v);
  tx.wheel += vl * dt / 0.38;
  // fumée des pneus
  if (tx.drift > 4 || (brake > 0.5 && vl > 16)) { for (const sd of [-1, 1]) puff(V3.add(tx.p, V3.add(V3.mul(f2, -1.6), V3.mul(r2, sd * 0.9))), [0, 1, 0], 0.6, 0.8, [0.85, 0.85, 0.85], 2); if (Math.random() < 0.2) tev('skid', {}); }
  if (tx.boost > 0) puff(V3.add(tx.p, V3.add(V3.mul(f2, -2.4), [0, 0.5, 0])), V3.mul(f2, -4), 0.5, 0.3, [1, 0.6, 0.2], 1, true);
  // inclinaison de la caisse
  tx.roll += ((-tx.steerA * spdK * Math.min(1, Math.abs(vl) / 25) * 0.09) - tx.roll) * Math.min(1, dt * 6);
  tx.pitch += (((brake > 0 && vl > 2 ? -0.06 : gas > 0 ? 0.04 : 0)) - tx.pitch) * Math.min(1, dt * 5);
  tx.bounce *= Math.exp(-6 * dt);
  tx.hitCd -= dt;
  // murs et immeubles
  const R0 = 2.1 * ty.size;
  for (const off of [1.5, -1.5]) {
    const c = V3.add(tx.p, V3.mul(f2, off * ty.size));
    const before = c.slice();
    const n = collideCity(T.C, c, R0 * 0.62);
    if (n) {
      const push = V3.sub(c, before); tx.p = V3.add(tx.p, push);
      const vn = V3.dot(tx.v, n);
      if (vn < 0) {
        tx.v = V3.sub(tx.v, V3.mul(n, vn * 1.35));
        tx.v = V3.mul(tx.v, 0.8);
        if (-vn > 4) crash(tx, -vn, V3.add(c, V3.mul(n, -R0 * 0.6)), 'mur');
      }
    }
  }
  // voitures
  for (const c of T.cars) {
    const d = V3.hdist(c.p, tx.p), rr = 2.2 * ty.size + (c.van ? 2.4 : 2.1);
    if (d < rr && d > 0.01) {
      const n = V3.norm([tx.p[0] - c.p[0], 0, tx.p[2] - c.p[2]]);
      tx.p = V3.add(tx.p, V3.mul(n, (rr - d) * 0.6));
      const rel = V3.sub(tx.v, c.v), imp = -V3.dot(rel, n);
      if (imp > 0) {
        tx.v = V3.add(tx.v, V3.mul(n, imp * 0.7));
        bumpCar(c, V3.mul(n, -imp * 0.9));
        if (imp > 3) crash(tx, imp, V3.lerp(tx.p, c.p, 0.5), 'voiture');
      }
    } else if (tx.pass && d < rr + 1.4 && tx.speed > 16 && c.state === 'lane' && !c.near) { c.near = true; nearMiss(tx); }
    if (d > rr + 4) c.near = false;
  }
}
function crash(tx, imp, p, what) {
  for (let i = 0; i < 10; i++) puff(V3.add(p, [0, 0.8, 0]), [rnd(-6, 6), rnd(1, 6), rnd(-6, 6)], 0.18, 0.4, [1, 0.85, 0.4], 0.2, true);
  tx.bounce = Math.min(1, imp / 20);
  if (tx.hitCd > 0) return;
  tx.hitCd = 0.35;
  T.C.env.flash = Math.min(0.4, imp * 0.02);
  T.shake = Math.min(1.2, imp * 0.05);
  tev('crash', { imp, what });
  if (tx.pass) {
    const loss = Math.min(45, imp * 2.4) / tx.ty.tough;
    tx.pass.comfort = Math.max(0, tx.pass.comfort - loss);
    tx.pass.hits++;
    if (tx.pass.comfort <= 0) { clientLeaves(tx, 'angry'); return; }
    if (Math.random() < 0.8) say(pick(CLIENT_LINES.hurt), tx.pass);
  }
}
function nearMiss(tx) {
  T.combo++; tx.pass.tips += 1;
  tev('near', { n: T.combo });
}
function bumpCar(c, dv) {
  if (c.state === 'lane') { c.state = 'bumped'; c.t = 0; c.v = [0, 0, 0]; }
  c.v = V3.add(c.v, dv); c.spin = rnd(-3, 3); c.t = 0;
}

/* ---------------- circulation ---------------- */
function updateCars(dt) {
  const tx = T.taxi;
  for (const c of T.cars) {
    if (c.state === 'lane') {
      // freine s'il y a quelqu'un devant (une voiture ou le taxi)
      const f = [Math.sin(c.yaw), 0, Math.cos(c.yaw)];
      let block = false;
      const ahead = (q) => { const d = V3.sub(q, c.p), along = V3.dot(d, f), side = Math.abs(V3.dot(d, [-f[2], 0, f[0]])); return along > 0 && along < 11 && side < 2.6; };
      if (ahead(tx.p)) { block = true; if (Math.random() < 0.01) tev('honk', { p: c.p }); }
      if (!block) for (const o of T.cars) if (o !== c && o.state === 'lane' && o.axis === c.axis && o.line === c.line && o.dir === c.dir && ahead(o.p)) { block = true; break; }
      const want = block ? 0 : c.max;
      c.speed += clamp(want - c.speed, -18 * dt, 6 * dt);
      c.s += c.speed * c.dir * dt;
      if (c.s > HALF + 10) c.s = -HALF - 10; if (c.s < -HALF - 10) c.s = HALF + 10;
      placeCar(c); c.v = V3.mul(f, c.speed);
    } else { // bousculée : elle glisse puis repart ailleurs
      c.t += dt;
      c.p = V3.add(c.p, V3.mul(c.v, dt)); c.v = V3.mul(c.v, Math.exp(-2.2 * dt)); c.yaw += c.spin * dt; c.spin *= Math.exp(-2 * dt);
      collideCity(T.C, c.p, 2);
      if (c.t > 4 && V3.hdist(c.p, tx.p) > 70) { c.state = 'lane'; c.axis = Math.random() < 0.5 ? 'x' : 'z'; c.line = roadC(Math.floor(Math.random() * (NB + 1))); c.s = Math.random() < 0.5 ? -HALF - 8 : HALF + 8; c.speed = 0; c.v = [0, 0, 0]; placeCar(c); }
    }
  }
}
/* ---------------- piétons ---------------- */
function updatePeds(dt) {
  const tx = T.taxi, f = [Math.sin(tx.yaw), 0, Math.cos(tx.yaw)];
  const all = T.peds.concat(T.clients);
  for (const p of all) {
    if (p.boarded) continue;
    if (p.free) { const d = V3.sub(p.target, p.p), l = Math.hypot(d[0], d[2]); if (l > 0.5) { p.p = V3.add(p.p, V3.mul([d[0] / l, 0, d[2] / l], 1.8 * dt)); p.yaw = Math.atan2(d[0], d[2]); } p.ph += dt * 7; p.pos = p.p; continue; }
    const base = p.client ? p.p : pedPos(p);
    if (!p.client) { p.s += p.sp * p.dir * dt; if (p.s > HALF) p.s = -HALF; if (p.s < -HALF) p.s = HALF; p.ph += dt * p.sp * 4; p.yaw = p.axis === 'z' ? (p.dir > 0 ? 0 : Math.PI) : (p.dir > 0 ? Math.PI / 2 : -Math.PI / 2); }
    else p.ph += dt * 2;
    // le taxi fonce sur lui : il plonge sur le côté
    const pos = V3.add(base, p.jo);
    const rel = V3.sub(pos, tx.p), d = Math.hypot(rel[0], rel[2]);
    if (p.jump <= 0 && d < 9 && tx.speed > 6 && V3.dot(rel, f) > -1) {
      const side = [-f[2], 0, f[0]], s = V3.dot(rel, side) >= 0 ? 1 : -1;
      p.jump = 0.6; p.jv = V3.add(V3.mul(side, s * 9), V3.mul(f, 2)); p.jv[1] = 6;
      if (!p.client || !tx.pass) tev('scream', {});
    }
    if (p.jump > 0) {
      p.jump -= dt; p.jo = V3.add(p.jo, V3.mul(p.jv, dt)); p.jv[1] -= 20 * dt;
      if (p.jo[1] < 0) { p.jo[1] = 0; p.jv = [0, 0, 0]; }
    } else { p.jo[1] = 0; p.jo[0] *= Math.exp(-0.6 * dt); p.jo[2] *= Math.exp(-0.6 * dt); }
    p.pos = V3.add(base, p.jo);
  }
}

/* ---------------- les courses ---------------- */
function updateFare(dt) {
  const tx = T.taxi;
  if (T.demo) return;
  if (!tx.pass) {
    // un client au bord de la route et le taxi presque arrêté : il monte
    for (const c of T.clients) {
      if (c.jump > 0) continue;
      const d = V3.hdist(c.pos || c.p, tx.p);
      c.near = d < 26;
      if (d < 11 && tx.speed < 4 && T.intro <= 0 && !T.over) { pickUp(tx, c); break; }
    }
    return;
  }
  const P = tx.pass;
  if (P.boardT > 0) { P.boardT -= dt; return; }
  P.left -= dt;
  P.talkT -= dt;
  if (P.talkT <= 0) { P.talkT = rnd(5, 9); if (tx.speed > 30 && P.comfort > 60) say(pick(CLIENT_LINES.fast), P); else if (tx.speed < 8) say(pick(CLIENT_LINES.slow), P); }
  if (P.left <= 0) { clientLeaves(tx, 'late'); return; }
  const d = V3.hdist(tx.p, P.dest.drop);
  P.dist = d;
  if (d < 11 && tx.speed < 5) dropOff(tx);
}
function pickUp(tx, c) {
  T.clients.splice(T.clients.indexOf(c), 1);
  const limit = Math.round(c.dist / 15 + 9);
  tx.pass = { ped: c, dest: c.dest, comfort: 100, hits: 0, tips: 0, left: limit, limit, boardT: 0.7, talkT: 4, dist: c.dist, start: c.dist };
  T.combo = 0;
  const nm = c.dest.name, a = nm.startsWith('le ') ? 'au ' + nm.slice(3) : 'à ' + nm, cap = x => x[0].toUpperCase() + x.slice(1);
  say(pick(CLIENT_LINES.pickup).replace('{A}', cap(a)).replace('{a}', a).replace('{P}', cap(nm)).replace('{p}', nm), tx.pass);
  tev('pickup', { c });
}
function dropOff(tx) {
  const P = tx.pass;
  const k = P.left / P.limit;
  const rating = k > 0.5 ? 'ULTRA RAPIDE !' : k > 0.28 ? 'RAPIDE !' : 'NORMAL';
  const bonusT = k > 0.5 ? 5 : k > 0.28 ? 3 : 1;
  const base = Math.round(5 + P.start * 0.025);
  const speedBonus = Math.round(P.left * 0.35);
  const comfortTip = Math.round(base * 0.6 * P.comfort / 100);
  const total = base + speedBonus + comfortTip + P.tips;
  T.money += total; T.fares++; T.best = Math.max(T.best, total);
  if (T.mode === 'arcade') T.time += bonusT;
  say(pick(P.comfort > 70 ? CLIENT_LINES.happy : CLIENT_LINES.ok), P);
  tev('drop', { total, base, speedBonus, comfortTip, tips: P.tips, rating, bonusT: T.mode === 'arcade' ? bonusT : 0, comfort: P.comfort });
  // le client descend et part vers le bâtiment
  const ped = P.ped, side = [-Math.cos(tx.yaw), 0, Math.sin(tx.yaw)];
  ped.client = false; ped.free = true; ped.jump = 0; ped.jo = [0, 0, 0];
  ped.p = V3.add(tx.p, V3.mul(side, -2.6)); ped.p[1] = 0.1;
  ped.target = V3.add(P.dest.drop, V3.mul(P.dest.doorDir, -14)); ped.leaving = 4;
  T.peds.push(ped);
  tx.pass = null;
}
function clientLeaves(tx, why) {
  const P = tx.pass;
  say(pick(why === 'angry' ? CLIENT_LINES.angry : CLIENT_LINES.late), P);
  tev('lost', { why });
  tx.pass = null;
}
function say(txt, P) { tev('say', { txt }); }
function endGame() {
  if (T.over) return;
  T.over = true; tev('over', {});
}

/* ---------------- caméra ---------------- */
function tcamera(dt) {
  const tx = T.taxi, C = T.cam; if (!tx) return;
  const f = [Math.sin(tx.yaw), 0, Math.cos(tx.yaw)];
  let pos, look;
  if (T.demo) {
    C.ang = (C.ang || 0) + dt * 0.1;
    pos = [Math.sin(C.ang) * 140, 70, Math.cos(C.ang) * 140]; look = [0, 10, 0];
  } else {
    const sp = Math.min(1, tx.speed / 40);
    const back = 9 + sp * 3, up = 4.2 + sp * 0.8;
    // la caméra suit le mouvement (pas seulement l'avant de la voiture)
    const vd = tx.speed > 3 ? V3.norm(V3.lerp(f, V3.norm(tx.v), 0.4)) : f;
    pos = V3.add(tx.p, [-vd[0] * back, up, -vd[2] * back]);
    look = V3.add(tx.p, [vd[0] * 8, 1.4, vd[2] * 8]);
    // pas à travers les murs
    const from = V3.add(tx.p, [0, 2, 0]), k = camRay(T.C, from, pos);
    if (k < 1) { pos = V3.lerp(from, pos, Math.max(0.4, k - 0.05)); pos[1] += (1 - k) * 7; }
    C.fov = 1.05 + sp * 0.22 + (tx.boost > 0 ? 0.12 : 0);
  }
  const kk = 1 - Math.exp(-dt * (T.demo ? 2 : 8));
  C.pos = V3.lerp(C.pos, pos, kk); C.target = V3.lerp(C.target, look, 1 - Math.exp(-dt * 10));
  const sh = T.shake || 0; T.shake = Math.max(0, sh - dt * 2);
  C.view = { pos: V3.add(C.pos, [rnd(-1, 1) * sh * 0.4, rnd(-1, 1) * sh * 0.4, rnd(-1, 1) * sh * 0.4]), target: C.target, fov: C.fov || 1.1 };
}

    for (let k = 0; k < 8; k++) for (const sd of [-1, 1]) { XF.push(); XF.t(sd * 1.005, 0.95, -1.75 + k * 0.5); R.draw('cube', 0.02, 0.22, 0.25, k % 2 ? [0.08, 0.08, 0.08] : [0.97, 0.97, 0.97]); XF.pop(); }
    XF.push(); XF.t(0.45, 1.55, 0.25); R.draw('sphere', 0.42, 0.48, 0.42, hex(opt.driverSkin || '#e0ac69')); XF.pop();
    XF.push(); XF.t(0.45, 1.78, 0.25); R.draw('sphere', 0.44, 0.22, 0.44, hex(opt.driverHair || '#2b1d12')); XF.pop();

}
function drawPed(p) {

  XF.push(); XF.t(0, 1.95, -0.02); R.draw('sphere', 0.38, 0.2, 0.38, p.hair, 1, 0, 6); XF.pop();
  XF.pop();
  if (p.client && !p.boarded) {

    ${Object.keys(MODES).some(m => rec[m]) ? `<p class="hint">Records : ${Object.keys(MODES).filter(m => rec[m]).map(m => `${MODES[m]} ${rec[m]} €`).join(' · ')}</p>` : ''}
  </div>`);
  $('go').addEventListener('click', () => { AU.init(); goLandscape(); AU.play('beep', 880); select(); });
  $('help').addEventListener('click', () => { AU.init(); helpPanel(); });
}
function select() {
  state = 'select';
  show(`<div class="wrap">
    <div><span class="eyebrow">Taxi Turbo</span><h2 class="h1">Choisis ton taxi</h2></div>
    <div class="drivers">${TAXIS.map((t, i) => `<button class="drv" data-t="${i}" style="--c:${t.col}" aria-pressed="${setup.taxi === i}"><b>${esc(t.name)}</b><small>${esc(t.car)}</small><span>${esc(t.desc)}</span></button>`).join('')}</div>
    <div class="card">
      <div class="row" style="gap:22px;align-items:flex-start">
        <div class="opt"><span>Mode</span><div class="seg" id="md">${Object.entries(MODES).map(([k, n]) => `<button data-v="${k}" aria-pressed="${setup.mode === k}">${n}</button>`).join('')}</div></div>
        <div class="opt"><span>Moment</span><div class="seg" id="nt"><button data-v="0" aria-pressed="${!setup.night}">☀ Jour</button><button data-v="1" aria-pressed="${setup.night}">☾ Nuit</button></div></div>
      </div>
      <p class="hint">${setup.mode === 'arcade' ? 'Arcade : tu commences avec 60 secondes. Chaque client déposé vite te rajoute du temps.' : 'Tu as ' + (setup.mode === 't3' ? '3' : '5') + ' minutes pour gagner le plus d\'argent possible.'}</p>
      <div class="row" style="justify-content:space-between"><button class="btn ghost" id="back">Retour</button><button class="btn" id="play">GO !</button></div>
    </div>
  </div>`);
  scr.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => { setup.taxi = +b.dataset.t; save(); AU.play('beep', 660); select(); }));
  $('md').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { setup.mode = b.dataset.v; save(); AU.play('beep', 520); select(); }));
  $('nt').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { setup.night = b.dataset.v === '1'; save(); AU.play('beep', 520); demo(); select(); }));
  $('back').addEventListener('click', title);
  $('play').addEventListener('click', () => { goLandscape(); play(); });
}
function play() {
  AU.init();
  startGame({ night: setup.night, mode: setup.mode, taxi: setup.taxi });
  hideScreen(); $('pad').hidden = false; $('hud').hidden = false; $('tc').hidden = true;
  state = 'game'; paused = false;
  AU.music(true);
  announce('PRÊT ?', '', '#fff'); AU.play('beep', 660);
  setTimeout(() => { if (state === 'game') { announce('C\'EST PARTI !', 'les cercles colorés = des clients', '#ffcf1a'); AU.play('go'); } }, 1300);
}
function grade(m) {
  const k = setup.mode === 'arcade' ? 1 : setup.mode === 't3' ? 1.4 : 2.3;
  return m >= 600 * k ? 'S' : m >= 400 * k ? 'A' : m >= 250 * k ? 'B' : m >= 150 * k ? 'C' : m >= 70 * k ? 'D' : 'E';
}
function results() {
  if (state !== 'game') return;
  state = 'results'; $('pad').hidden = true; $('hud').hidden = true; AU.music(false); AU.stopAll();
  const rec = store.get('tt-rec', {}), was = rec[setup.mode] || 0, isRec = T.money > was;
  if (isRec) { rec[setup.mode] = T.money; store.set('tt-rec', rec); }
  show(`<div class="wrap center">
    <span class="eyebrow">Fin du service · ${MODES[setup.mode]}</span>
    <div class="grade">${grade(T.money)}</div>
    <div class="card" style="width:100%;max-width:520px">
      <table class="tbl"><tbody>
        <tr><td>Argent gagné</td><td style="font-size:22px;color:#7dff9a">${T.money} €</td></tr>
        <tr><td>Clients déposés</td><td>${T.fares}</td></tr>
        <tr><td>Meilleure course</td><td>${T.best} €</td></tr>
        <tr><td>Record</td><td>${isRec ? 'NOUVEAU RECORD !' : was + ' €'}</td></tr>
      </tbody></table>
    </div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="menu">Menu</button><button class="btn" id="again">ENCORE !</button></div>
  </div>`);
  $('again').addEventListener('click', () => { goLandscape(); play(); });
  $('menu').addEventListener('click', () => { demo(); title(); });
}
const HELP = `<div class="moves">
  <b>Clients</b><span>Les gens dans un cercle de couleur attendent un taxi. Vert = trajet court, jaune = moyen, rouge = long (mieux payé). Arrête-toi dans le cercle pour qu'il monte.</span>
  <b>Flèche verte</b><span>En haut de l'écran, elle montre où aller. Le lieu est aussi marqué par une colonne de lumière verte. Arrête-toi dedans pour le déposer.</span>
  <b>Vite !</b><span>Chaque client a un temps limite. Plus tu arrives vite, plus il paie (et en Arcade tu gagnes des secondes).</span>
  <b>Confort</b><span>Chaque choc contre une voiture ou un mur secoue le client. Plus il est content, plus le pourboire est gros. Si le confort tombe à zéro, il descend furieux !</span>
  <b>Frôler</b><span>Passer très près d'une voiture sans la toucher rapporte 1 € de pourboire.</span>
  <b>Commandes</b><span>◀ ▶ tourner · GAZ accélérer · FREIN freiner puis reculer · FREIN + virage à grande vitesse = dérapage · TURBO coup d'accélérateur · 📯 klaxon</span>
  <b>Clavier</b><span>Flèches ou ZQSD · Espace frein · Maj turbo · H klaxon · Échap pause</span>
</div>`;
function helpPanel(back) {
  $('panelBody').innerHTML = `<span class="h1">Comment jouer</span>${HELP}<button class="btn" id="hClose">${back ? 'Retour' : 'OK'}</button>`;
  $('panel').hidden = false;
  $('hClose').addEventListener('click', () => { $('panel').hidden = true; if (back) back(); });
}
function pauseGame() {
  if (state !== 'game' || paused || T.over) return;
  paused = true; AU.music(false); AU.stopAll();
  $('panelBody').innerHTML = `<span class="h1">PAUSE</span><button class="btn" id="pRes">Reprendre</button><button class="btn ghost" id="pHelp">Comment jouer</button><button class="btn ghost" id="pRe">Recommencer</button><button class="btn ghost" id="pQuit">Quitter</button>`;
  $('panel').hidden = false;
  $('pRes').addEventListener('click', () => { $('panel').hidden = true; paused = false; AU.music(true); });
  $('pHelp').addEventListener('click', () => helpPanel(() => { paused = false; pauseGame(); }));
  $('pRe').addEventListener('click', () => { $('panel').hidden = true; play(); });
  $('pQuit').addEventListener('click', () => { $('panel').hidden = true; paused = false; demo(); title(); });
}
$('pause').addEventListener('click', pauseGame);
const mb = $('mute'); mb.textContent = AU.muted ? '✕' : '♪';
mb.addEventListener('click', () => { AU.init(); AU.setMuted(!AU.muted); mb.textContent = AU.muted ? '✕' : '♪'; if (!AU.muted && state === 'game') AU.music(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* ---------------- boucle ---------------- */
let last = performance.now(), acc = 0, slow = 0, perfT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  perfT += dt; if (dt > 0.026) slow++;
  if (perfT > 3) { if (slow > 60 && scale > 1) { scale = Math.max(1, scale - 0.25); resize(); } perfT = 0; slow = 0; }
  if (state === 'game' && VW < VH && !paused && !T.over) pauseGame();
  if (T.C && !(state === 'game' && paused)) {
    if (state === 'game') readInput();
    else if (T.taxi) { // démo : le taxi roule tout seul
      const tx = T.taxi; tx.inp.gas = 0.6; tx.inp.brake = 0; tx.inp.steer = Math.sin(T.t * 0.3) * 0.15;
    }
    acc += dt; let n = 0;
    while (acc >= 1 / 60 && n < 4) { tstep(1 / 60); handleEvents(); acc -= 1 / 60; n++; }
    if (acc > 0.1) acc = 0;
    tcamera(dt);
    drawTaxiScene();
    R.render(T.cam.view, T.C.env, T.C.statics, cv.width, cv.height, T.t);
    if (state === 'game') { hud(dt); const tx = T.taxi; AU.engine(true, tx.speed, tx.inp.gas, tx.drift > 4, tx.boost > 0); }
    else AU.engine(false);
  }
  requestAnimationFrame(loop);
}
title();
window.__tt = { T, setup, get state() { return state; }, play,
  sim(n, inp) { for (let i = 0; i < n; i++) { if (inp) Object.assign(T.taxi.inp, typeof inp === 'function' ? inp(i) : inp); tstep(1 / 60); handleEvents(); } } };
requestAnimationFrame(loop);
})();
</script>
