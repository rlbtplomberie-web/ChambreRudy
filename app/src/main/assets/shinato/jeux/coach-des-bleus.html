<title>Coach Bleu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@500;600;700&family=Bangers&display=swap">
<style>
/* Soirée de match : vestiaire et tribune en bleu nuit, tricolore en touches, données en chiffres tabulaires */
:root{
  --night:#070c1a; --navy:#0e1c45; --panel:rgba(8,14,34,.88); --panel2:rgba(20,32,70,.9); --line:rgba(170,190,240,.2);
  --ink:#f3f5fb; --dim:#9ba7c9; --bleu:#2f5cf0; --bleu2:#1d3ca8; --rouge:#e5383b; --or:#f2c94c; --vert:#2fbf71;
  --f-disp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--f-body);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.flag{display:inline-block;width:26px;height:18px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}

/* ---------- Écrans ---------- */
#screen{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:radial-gradient(120% 70% at 50% -10%,rgba(47,92,240,.35),transparent 60%),linear-gradient(180deg,#0b1532,#070c1a 70%)}
#screen.over{background:rgba(5,9,22,.82);backdrop-filter:blur(3px)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.h2{font-family:var(--f-disp);font-weight:800;font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--dim)} p{margin:0;line-height:1.45}
.tri{display:flex;height:5px;width:96px;border-radius:3px;overflow:hidden}.tri i{flex:1}.tri i:nth-child(1){background:var(--bleu2)}.tri i:nth-child(2){background:#fff}.tri i:nth-child(3){background:var(--rouge)}
.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px;letter-spacing:.04em;background:var(--bleu);box-shadow:0 4px 0 #17318f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #17318f}
.btn.red{background:var(--rouge);box-shadow:0 4px 0 #8e1c1e}
.btn.ghost{background:var(--panel2);box-shadow:none;border:1px solid var(--line)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;min-height:130px}
.mode b{font-family:var(--f-disp);font-size:28px;text-transform:uppercase;line-height:1}
.mode span{color:var(--dim);font-size:14px;line-height:1.4}
.mode:active{background:var(--panel2)}
.hero{display:flex;flex-direction:column;gap:12px;padding-top:6vh}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.team{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;text-align:left}
.team .n{font-weight:700;font-size:15px}
.stars{color:var(--or);font-size:12px;letter-spacing:1px;white-space:nowrap}
.stars s{color:rgba(242,201,76,.25);text-decoration:none}
.vs{display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--f-disp);font-weight:800;font-size:26px;text-transform:uppercase;flex-wrap:wrap}
.vs .flag{width:40px;height:27px}

/* Composition */
.compo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.compo{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.board{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:68/80;border-radius:14px;overflow:hidden;touch-action:none;
  background:repeating-linear-gradient(0deg,#1d7a3e 0 8%,#1a7038 8% 16%);border:2px solid rgba(255,255,255,.5)}
.board .ln{position:absolute;border:2px solid rgba(255,255,255,.5)}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:70px;touch-action:none;cursor:grab}
.slot .dot{width:36px;height:36px;border-radius:50%;background:var(--bleu2);border:2px solid #fff;display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.slot.gk .dot{background:#1f9e57}
.slot .nm{font-size:11px;font-weight:700;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:5px;white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.slot .lb{font-size:10px;color:#dfe6ff;opacity:.85}
.slot.sel .dot{background:var(--or);color:#1a1300}
.slot.bad .dot{border-color:var(--rouge)}
.slot.tired .dot::after{content:"";position:absolute;margin:-26px 0 0 26px;width:9px;height:9px;border-radius:50%;background:var(--rouge)}
.bench{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:30px minmax(0,1fr) 44px 40px;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;text-align:left;font-size:14px}
.pl .num{font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.pl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .ps{font-size:12px;color:var(--dim)}
.pl .ov{font-family:var(--f-disp);font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.pl .fm{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.pl .fm i{display:block;height:100%;background:var(--vert)}
.pl.sel{border-color:var(--or);background:rgba(242,201,76,.12)}
.pl.dis{opacity:.4}
.hint{font-size:13px;color:var(--dim)}

/* ---------- Écran titre ---------- */
#screen.title{background:linear-gradient(90deg,rgba(4,8,22,.92) 0%,rgba(4,8,22,.72) 42%,rgba(4,8,22,.15) 75%,rgba(4,8,22,.45) 100%),linear-gradient(0deg,rgba(4,8,22,.9),transparent 30%);overflow:auto}
.tt{min-height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,560px) minmax(0,300px);justify-content:space-between;align-items:center;gap:24px;
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px))}
.tt-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.logo{display:flex;align-items:center;gap:16px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.crest{width:clamp(70px,13vw,104px);height:auto;flex:none;filter:drop-shadow(0 6px 18px rgba(47,92,240,.6))}
.wordmark{display:flex;flex-direction:column;line-height:.82;font-family:var(--f-disp);font-weight:800;transform:skewX(-8deg);position:relative;overflow:hidden;padding-right:8px}
.wordmark .w1{font-size:clamp(40px,9vw,78px);color:#fff;letter-spacing:.04em;text-shadow:0 4px 0 #0b1a52}
.wordmark .w2{font-size:clamp(64px,15vw,132px);letter-spacing:.02em;background:linear-gradient(180deg,#8fb0ff 0%,#2f5cf0 55%,#1a36a0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #0a1440)}
.wordmark::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s 1s ease-in-out infinite;mix-blend-mode:overlay}
.tagline{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:#c9d4f5;display:flex;align-items:center;gap:10px}
.tagline::before{content:"";width:54px;height:4px;flex:none;background:linear-gradient(90deg,#2f5cf0 33%,#fff 33% 66%,#e5383b 66%);border-radius:2px}
.mm{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.mi{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border:0;padding:0 18px 0 0;min-height:66px;background:rgba(10,18,44,.78);border:1px solid rgba(160,185,255,.18);
  clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);transition:transform .18s ease,background .18s ease;animation:slidein .5s calc(.25s + var(--i) * .08s) cubic-bezier(.2,1,.3,1) both;outline:none;max-width:520px}
.mi-bar{align-self:stretch;width:8px;flex:none;background:var(--bleu);transition:width .18s ease,background .18s ease}
.mi-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;padding:10px 0}
.mi b{font-family:var(--f-disp);font-weight:800;font-size:clamp(24px,4.6vw,32px);line-height:1;text-transform:uppercase;letter-spacing:.03em}
.mi small{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-arrow{font-family:var(--f-disp);font-size:34px;font-weight:800;color:var(--dim);transition:transform .18s ease,color .18s ease}
.mi.on{transform:translateX(10px);background:#f3f5fb}
.mi.on b{color:#0b1532}.mi.on small{color:#41507a}
.mi.on .mi-bar{width:14px;background:linear-gradient(180deg,#2f5cf0 33%,#ffffff 33% 66%,#e5383b 66%)}
.mi.on .mi-arrow{color:#e5383b;transform:translateX(4px)}
.mi:active{transform:translateX(10px) scale(.98)}
.mi.gold{border-color:rgba(242,201,76,.55)}.mi.gold .mi-bar{background:var(--or)}.mi.gold b{color:var(--or)}
.mi.gold.on b{color:#0b1532}
.tt-hint{max-width:520px}
.tt-side{display:flex;flex-direction:column;gap:12px;animation:fadeup .6s .5s both}
.palm,.star-card{background:rgba(8,14,34,.82);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(4px)}
.trophies{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trophies>div{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(242,201,76,.08);border:1px solid rgba(242,201,76,.25);border-radius:12px;padding:10px 6px}
.trophies .cup{font-size:30px;line-height:1}.trophies .cup.sm{font-size:22px}
.trophies b{font-family:var(--f-disp);font-size:30px;color:var(--or);line-height:1}.trophies small{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.palm .kpis{grid-template-columns:repeat(4,1fr)}.palm .kpis b{font-size:24px}
.wr{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}.wr b{color:var(--ink)}
.star-row{display:flex;align-items:center;gap:12px}.star-row b{display:block;font-size:16px}.star-row small{color:var(--dim);font-size:13px}
.jersey{width:46px;height:46px;flex:none;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:22px;background:var(--bleu2);border:2px solid #fff;border-radius:10px 10px 14px 14px}
.ticker{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:stretch;height:calc(34px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(4,8,22,.92);border-top:2px solid var(--bleu);font-size:13.5px;font-weight:600;z-index:1}
.tk-lbl{display:flex;align-items:center;padding:0 12px 0 max(12px,env(safe-area-inset-left,0px));background:var(--rouge);font-family:var(--f-disp);font-weight:800;letter-spacing:.1em;font-size:15px}
.tk-win{flex:1;overflow:hidden;display:flex;align-items:center}
.tk-in{display:flex;gap:56px;white-space:nowrap;animation:tick 70s linear infinite;padding-left:24px}
.tk-in span::before{content:"●";color:var(--bleu);margin-right:12px;font-size:9px;vertical-align:2px}
.press{position:fixed;inset:0;z-index:3;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(60% 50% at 50% 45%,rgba(24,46,125,.97),rgba(3,6,18,.99));transition:opacity .45s ease}
.press.gone{opacity:0;pointer-events:none}
.press-logo{font-family:var(--f-disp);font-weight:800;font-size:clamp(56px,15vw,140px);line-height:.9;transform:skewX(-8deg);letter-spacing:.02em;text-shadow:0 6px 0 #0b1a52}
.press-logo i{font-style:normal;color:#5d86ff}
.press-txt{color:#fff;font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:clamp(13px,2.6vw,17px);animation:pulse 1.6s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shine{0%,60%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (max-width:760px){
  .tt{grid-template-columns:1fr;align-content:start;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #screen.title{background:linear-gradient(180deg,rgba(4,8,22,.25) 0%,rgba(4,8,22,.75) 38%,rgba(4,8,22,.94) 70%)}
  .mi{min-height:60px}
}
@media (max-height:560px) and (min-width:761px){
  .tt{align-items:start;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(46px + env(safe-area-inset-bottom,0px));gap:10px 24px}
  .tt-main{gap:8px}.crest{width:52px}
  .wordmark{flex-direction:row;gap:12px;align-items:baseline}.wordmark .w1,.wordmark .w2{font-size:58px}
  .tagline{font-size:11px}.mm{gap:6px;margin-top:2px}.mi{min-height:46px}.mi b{font-size:22px}.mi small{font-size:12px}.mi-txt{padding:6px 0}
  .star-card{display:none}.palm{padding:12px;gap:8px}.trophies .cup{font-size:22px}.trophies b{font-size:24px}.palm .kpis b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){.logo,.mi,.tt-side{animation:none}.wordmark::after,.press-txt{animation:none}.tk-in{animation-duration:200s}}

/* ---------- Vestiaire ---------- */
#screen.room{background:linear-gradient(180deg,rgba(4,8,22,.7) 0%,transparent 18%,transparent 55%,rgba(4,8,22,.75) 100%);overflow:hidden;pointer-events:none}
#screen.room .rm>*{pointer-events:auto}
.rm{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.rm-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.rm-title{display:flex;flex-direction:column;gap:2px}.rm-title .h2{font-size:22px}
.rm-mor{flex:1;min-width:120px;max-width:260px;display:flex;flex-direction:column;gap:4px}
.rm-actions{display:flex;gap:8px}
.rm-tags{position:absolute;inset:0;pointer-events:none!important}
.rtag{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid rgba(255,255,255,.35);background:rgba(8,14,34,.78);border-radius:999px;padding:4px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:5px}
.rtag.ask{border-color:var(--or);background:rgba(60,45,5,.85)}
.rtag i{font-style:normal;font-family:"Bangers","Impact",sans-serif;font-size:18px;line-height:.8;color:#0b1532;background:var(--or);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.rm-dock{background:rgba(8,14,34,.9);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;max-height:46vh;width:min(100%,860px);margin:0 auto;box-sizing:border-box;backdrop-filter:blur(4px)}
.rm-tabs{flex-wrap:nowrap;overflow-x:auto}.rm-tabs button{white-space:nowrap;flex:none;min-width:0}
.rm-body{overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.rm-body .speeches{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.rm-body .speech{padding:10px;font-size:14px}
.qlist,.pchips{display:flex;flex-wrap:wrap;gap:8px}
.qitem{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid rgba(242,201,76,.45);background:rgba(242,201,76,.08);border-radius:12px;padding:8px 12px;flex:1 1 260px}
.qitem>span:last-child{display:flex;flex-direction:column;gap:2px;font-size:14px}
.pchip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.pchip .dot{width:9px;height:9px;border-radius:50%}
.jersey.sm{width:32px;height:32px;font-size:16px;border-radius:7px 7px 10px 10px}
.coachbub{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%) rotate(-1.5deg);z-index:7;pointer-events:none;max-width:min(86vw,520px);text-align:center;
  font-family:"Bangers","Impact",system-ui,sans-serif;font-size:clamp(19px,3.8vw,26px);letter-spacing:.04em;line-height:1.08;color:#0b1532;background:#fff;padding:10px 18px;border:4px solid #0b1532;border-radius:22px;box-shadow:6px 6px 0 #0b1532}
.coachbub::before{content:"COACH";position:absolute;top:-14px;left:16px;font-size:14px;letter-spacing:.12em;background:#e5383b;color:#fff;padding:2px 9px;border:3px solid #0b1532;border-radius:8px;transform:rotate(-4deg)}
.coachbub.pop{animation:popc .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes popc{from{transform:translateX(-50%) rotate(-1.5deg) scale(.4)}to{transform:translateX(-50%) rotate(-1.5deg) scale(1)}}
.talkdock{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.talk-card{width:min(100%,720px);background:rgba(8,14,34,.94);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow:auto;box-sizing:border-box}
.talk-head{display:flex;gap:12px;align-items:center}
.talk-id{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.talk-id small{color:var(--dim);font-size:12.5px}
.talk-trust{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}.talk-trust .mb{width:120px}
.talk-opts{display:flex;flex-direction:column;gap:6px}
.topt{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:14.5px;font-weight:600}
.topt:not([disabled]):hover,.topt:focus-visible{background:#f3f5fb;color:#0b1532}
.topt[disabled]{opacity:.4}
.talk-res{font-weight:700;font-size:14px}.talk-res.up{color:#7fe0aa}.talk-res.down{color:#ff9a9b}
.hud.talking .cmds,.hud.talking #joy,.hud.talking .tools,.hud.talking #radar,.hud.talking .feed,.hud.talking .cross{display:none}
@media (orientation:landscape) and (max-height:560px){.rm-dock{max-height:50vh}.talk-card{max-height:56vh}.coachbub{top:calc(56px + env(safe-area-inset-top,0px));font-size:19px;padding:7px 14px}.rm-title .h2{font-size:18px}}

  background:linear-gradient(90deg,#1d3ca8,#2f5cf0);border-left:6px solid #fff;border-right:6px solid #e5383b;padding:6px 26px 7px;box-shadow:0 6px 20px rgba(0,0,0,.45)}

let sel = null; // {type:'slot'|'bench', i|id}
function fit(p, slot) { return p.role === slot.role; }
function reformat(L, fname) {
  const slots = slotsOf(fname), players = L.xi.map(id => byId(FRA, id)), xi = new Array(11), used = new Set();
  slots.forEach((s, i) => { let best = -1, bs = -1e9; players.forEach((p, j) => { if (used.has(j)) return; const sc = (p.role === s.role ? 100 : 0) + (p.pos === s.label ? 10 : 0) - Math.abs(i - L.xi.indexOf(p.id)); if (sc > bs) { bs = sc; best = j; } }); used.add(best); xi[i] = players[best].id; });
  return { formation: fname, slots, xi, bench: L.bench.slice() };
}

    el.addEventListener('pointermove', e => {
      if (!st) return;
      if (!st.drag && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 8) st.drag = true;
      if (st.drag && L.slots[i].role !== 'GK') {
        const r = boardEl.getBoundingClientRect();
        const v = clamp(((e.clientX - r.left) / r.width) * 2 - 1, -0.95, 0.95), u = clamp((1 - (e.clientY - r.top) / r.height) * 0.76, 0.08, 0.7);

    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', () => { st = null; });
  });
}

const PRE = [
  { id: 'calme', t: 'Sérénité', s: '« Restez calmes et jouez votre football. On est prêts. »' },
  { id: 'rage', t: 'La rage', s: '« Je veux de la rage ! On ne lâche aucun ballon, on presse partout ! »' },
  { id: 'pression', t: 'Obligation', s: '« Ce match, on n\'a pas le droit de le perdre. Pas d\'excuse. »' },
  { id: 'plaisir', t: 'Plaisir', s: '« Faites-vous plaisir, le public est derrière vous. »' },
  { id: 'respect', t: 'Sans peur', s: '« Respectez-les, mais n\'ayez peur de personne. »' }
];
function preEffect(id) {
  const gap = CBY[G.opp].r - CBY.FRA.r, big = G.knockout;
  switch (id) {
    case 'calme': return { d: gap <= 0 ? 0.15 : 0.08 + (big ? 0.04 : 0), int: 1 };
    case 'rage': return { d: gap > 0 ? 0.24 : gap > -8 ? 0.12 : 0.06, int: 1.12 };
    case 'pression': return { d: gap < -8 ? 0.2 : gap > 0 ? -0.12 : 0.05 + (big ? -0.05 : 0), int: 1.03 };
    case 'plaisir': return { d: G.mode === 'amical' ? 0.18 : big ? 0.02 : 0.1, int: 1 };
    case 'respect': return { d: gap > 0 ? 0.2 : gap > -8 ? 0.1 : 0.03, int: 1 };
  }
  return { d: 0, int: 1 };
}
function reaction(d) {
  if (d >= 0.2) return 'Le vestiaire explose. Les joueurs sont gonflés à bloc !';
  if (d >= 0.12) return 'Les joueurs hochent la tête : ils sont concentrés et motivés.';
  if (d > 0) return 'Les joueurs écoutent, sans plus.';
  if (d === 0) return 'Le message ne change rien.';
  return 'Le message passe mal : les joueurs sont crispés.';
}

      ${chosen ? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Moral de l'équipe</span><div class="gauge"><i style="width:${Math.round(G.morale * 100)}%"></i></div><p class="react">${reaction(preEffect(chosen).d)}</p></div>` : `<div class="card" style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Moral avant la causerie</span><div class="gauge"><i style="width:${Math.round(G.teamMorale * 100)}%"></i></div><p class="hint">Choisis un seul discours. Son effet dépend de l'adversaire et de l'enjeu.</p></div>`}
      <div class="row" style="justify-content:flex-end"><button class="btn red" data-go="kick" ${chosen ? '' : 'disabled'}>Entrer sur le terrain</button></div>`);

function halfEffect(id, d) {

    case 'reveil': return d < 0 ? 0.2 : d === 0 ? 0.1 : -0.08;

    case 'confiance': return d < 0 ? 0.15 : d === 0 ? 0.1 : 0.03;
  }

}

/* ---- Fin du match ---- */
let lastResult = null, penId = 0;
function finishMatch() {
  const s = M.score.slice();

  endMatch(s, pens);
}
function penaltyScreen(s) {
  state = 'pens'; setHud(false);
  const T = M.teams, shooters = t => t.on.filter(x => x.role !== 'GK').sort((a, b) => b.p.sho - a.p.sho);
  const fs = shooters(T[0]), os = shooters(T[1]);
  const gkA = T[0].on.find(x => x.role === 'GK'), gkB = T[1].on.find(x => x.role === 'GK');
  const kicks = [[], []]; let i = 0;
  const tok = ++penId;
  const html = (msg, done) => `${header(null, G.roundName, 'Tirs au but')}
    <div class="vs">${flag('FRA')} France <span class="big" style="font-size:56px">${s[0]} - ${s[1]}</span> ${esc(CBY[G.opp].name)} ${flag(G.opp)}</div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="row"><span style="width:90px">${tn('FRA')}</span><div class="pens">${kicks[0].map(k => `<span class="pen ${k ? 'g' : 'm'}">${k ? '✓' : '✗'}</span>`).join('')}</div></div>
      <div class="row"><span style="width:90px">${tn(G.opp)}</span><div class="pens">${kicks[1].map(k => `<span class="pen ${k ? 'g' : 'm'}">${k ? '✓' : '✗'}</span>`).join('')}</div></div>
      <p class="react">${msg}</p>
    </div>
    ${done ? `<div class="row" style="justify-content:flex-end"><button class="btn" id="penOk">Continuer</button></div>` : ''}`;
  const sum = k => k.filter(Boolean).length;
  const decided = () => {
    const n0 = kicks[0].length, n1 = kicks[1].length, a = sum(kicks[0]), b = sum(kicks[1]);
    if (n0 <= 5 && n1 <= 5) { if (a > b + (5 - n1)) return 0; if (b > a + (5 - n0)) return 1; if (n0 === 5 && n1 === 5 && a !== b) return a > b ? 0 : 1; return -1; }
    if (n0 === n1 && a !== b) return a > b ? 0 : 1; return -1;
  };
  const stepPen = () => {
    if (tok !== penId || state !== 'pens') return;
    const side = i % 2, list = side ? os : fs, gk = side ? gkA : gkB, sh = list[Math.floor(i / 2) % list.length];
    const p = clamp(0.76 + (sh.p.sho - gk.p.gk) / 250 + (side === 0 ? (M.teams[0].morale - 0.55) * 0.2 : 0), 0.5, 0.93);
    const goal = Math.random() < p; kicks[side].push(goal); i++;
    if (goal) Snd.roar(); else Snd.ooh();
    const w = decided();
    const msg = `${esc(sh.p.short)} (${side ? esc(CBY[G.opp].name) : 'France'}) : ${goal ? 'but !' : (Math.random() < 0.5 ? 'arrêté par le gardien !' : 'à côté !')}`;
    if (w >= 0) {
      show(html(`${msg}<br>${w === 0 ? 'La France gagne aux tirs au but !' : esc(CBY[G.opp].name) + ' gagne aux tirs au but.'}`, true), true);
      $('penOk').addEventListener('click', () => endMatch(s, { w: w === 0 ? 'FRA' : G.opp, a: sum(kicks[0]), b: sum(kicks[1]) }));
      return;
    }
    show(html(msg, false), true);
    setTimeout(stepPen, 1300);
  };
  show(html('Les joueurs se rassemblent au rond central…', false), true);
  setTimeout(stepPen, 1500);
}
function endMatch(s, pens) {
  const T0 = M.teams[0], T1 = M.teams[1];
  const played = new Set(T0.on.map(x => x.p.id).concat(T0.out.map(p => p.id)));
  // les absents purgent leur blessure ou leur suspension
  FRA.forEach(p => {
    if (played.has(p.id)) return;
    if (p.inj && p.inj.matches > 0) { p.inj.matches--; if (!p.inj.matches) p.inj = null; }
    if (p.susp > 0) p.susp--;
  });
  FRA.forEach(p => { p.fat = played.has(p.id) ? clamp((100 - p.sta) * 0.5, 0, 35) : Math.round((p.fat || 0) * 0.3); });
  const win = pens ? pens.w === 'FRA' : s[0] > s[1], draw = !pens && s[0] === s[1];
  // notes et homme du match
  const rate = (sq, T) => sq.filter(p => p.m && p.m.t > 0).map(p => ({ p, r: playerRating(p, T, M), fr: T.idx === 0 })).filter(x => x.r != null);
  const frR = rate(FRA, T0), opR = rate(T1.squad, T1);
  const motm = frR.concat(opR).sort((a, b) => b.r - a.r || b.p.m.g - a.p.m.g)[0];
  const frSorted = frR.slice().sort((a, b) => b.r - a.r);
  // statistiques cumulées, forme, cartons, blessures
  const newInj = [], newSusp = [];
  FRA.filter(p => played.has(p.id)).forEach(p => {
    const m = p.m, st = p.st, x = frR.find(y => y.p === p);
    st.mj++; st.min += Math.round(m.t / HALF * 45); st.g += m.g; st.a += m.a; st.sh += m.sh; st.tk += m.tk; st.sv += m.sv; st.yc += m.yc; st.rc += m.rc;
    if (x) { st.rt += x.r; st.rn++; p.hist.push({ o: G.opp, r: x.r }); p.hist = p.hist.slice(-6); p.conf = clamp(p.conf * 0.6 + clamp((x.r - 5) / 4, 0, 1) * 0.4, 0.1, 0.95); }
    if (m.rc) { p.susp = 1; p.yel = 0; newSusp.push(`${p.short} : carton rouge, suspendu pour le prochain match.`); }
    else if (m.yc) { p.yel += m.yc; if (p.yel >= 2) { p.susp = 1; p.yel = 0; newSusp.push(`${p.short} : deuxième avertissement, suspendu pour le prochain match.`); } }
    if (m.inj) {
      if (m.inj.matches > 0) p.inj = { name: m.inj.name, matches: m.inj.matches };
      G.injLog.push({ id: p.id, name: p.short, inj: m.inj.name, m: m.inj.matches, opp: G.opp });
      newInj.push(`${p.short} : ${m.inj.name}. ${m.inj.matches > 0 ? `Absent ${m.inj.matches} match${m.inj.matches > 1 ? 's' : ''}.` : 'Rien de grave, il pourra jouer.'}`);
    }
  });
  FRA.filter(p => !played.has(p.id)).forEach(p => { p.conf = clamp((p.conf == null ? 0.5 : p.conf) - 0.02, 0.1, 0.95); });
  G.teamMorale = clamp(G.teamMorale * 0.8 + 0.11 + (win ? 0.07 : draw ? 0 : -0.07), 0.25, 0.9);
  G.train = null;
  lastResult = { s, pens, win, draw, opp: G.opp, bestFr: frSorted[0] ? frSorted[0].p : null, worstFr: frSorted.length > 1 ? frSorted[frSorted.length - 1].p : null };
  G.results.push({ opp: G.opp, s: s.slice(), pens: pens ? [pens.a, pens.b] : null, win, draw, round: G.roundName, motm: motm ? motm.p.short : '' });
  careerAdd(c => { c.j++; if (win) c.v++; else if (draw) c.n++; else c.d++; c.bp += s[0]; c.bc += s[1]; });
  if (G.tour) {
    recordTour(s, pens);
    if (G.tour.champ) { if (G.tour.champ === 'FRA') careerAdd(c => { c[G.tour.type]++; }); clearSave(); }
    else saveGame();
  }
  state = 'result'; setHud(false); Snd.crowd(win ? 0.4 : 0.1); Snd.music(true);
  const title = win ? 'Victoire !' : draw ? 'Match nul' : 'Défaite';
  const motmHtml = motm ? `<div class="card row" style="justify-content:space-between"><div style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">Homme du match</span><span class="h2">${motm.fr ? flag('FRA') : flag(G.opp)} ${esc(motm.p.name)}</span><span class="muted">${motm.p.m.g ? motm.p.m.g + ' but' + (motm.p.m.g > 1 ? 's' : '') + ' · ' : ''}${motm.p.m.a ? motm.p.m.a + ' passe' + (motm.p.m.a > 1 ? 's' : '') + ' déc. · ' : ''}${motm.p.role === 'GK' ? motm.p.m.sv + ' arrêts' : motm.p.m.pc + ' passes réussies'}</span></div><span class="big ${noteCls(motm.r)}" style="font-size:54px">${fmt1(motm.r)}</span></div>` : '';
  const medHtml = newInj.length || newSusp.length ? `<div class="card" style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Bulletin médical et discipline</span>${newInj.concat(newSusp).map(l => `<p>${esc(l)}</p>`).join('')}</div>` : '';
  show(`${header(null, G.roundName, title)}
    <div class="vs">${flag('FRA')} France <span class="big">${s[0]} - ${s[1]}</span> ${esc(CBY[G.opp].name)} ${flag(G.opp)}</div>
    ${pens ? `<p class="react" style="text-align:center">Tirs au but : ${pens.a} - ${pens.b}</p>` : ''}
    ${scorersHtml()}${motmHtml}${medHtml}
    <span class="h2">Notes des joueurs</span>${ratingsTable(T0, false)}
    ${statsBlock()}
    <div class="row" style="justify-content:flex-end"><button class="btn" data-go="press">Conférence de presse</button></div>`, true);
  bindPlayers(scr);

/* =====================================================================
   COMPÉTITIONS
   ===================================================================== */
function resetFatigue() { FRA.forEach(p => { p.fat = 0; }); G.lineup = autoLineup(FRA, G.lineup.formation || '4-3-3'); }
function nextFranceMatch() {
  const T = G.tour; if (!T || T.out || T.champ) return null;
  if (T.type === 'cdm' && T.stage === 'groups') return T.gm.A[T.md].find(m => (m.a === 'FRA' || m.b === 'FRA') && !m.res);
  return (T.rounds[T.ri] || []).find(m => (m.a === 'FRA' || m.b === 'FRA') && !m.res);
}
function simMatch(m, ko) {
  const s = simScore(m.a, m.b);
  m.res = { s, w: s[0] > s[1] ? m.a : s[1] > s[0] ? m.b : (ko ? simPens(m.a, m.b) : null), pens: ko && s[0] === s[1] };
}
function winnerOf(m) { return m.res.w; }
function advanceKO(T) {
  // joue tout ce qui reste du tour, puis construit le suivant
  for (;;) {
    const r = T.rounds[T.ri];
    r.forEach(m => { if (!m.res) simMatch(m, true); });
    if (T.ri === 2) { T.champ = winnerOf(r[0]); break; }
    const w = r.map(winnerOf), nr = [];
    for (let k = 0; k < w.length; k += 2) nr.push({ a: w[k], b: w[k + 1], res: null });
    T.rounds.push(nr); T.ri++;
    if (!T.out) break;
  }
}
function standings(T, k) {
  const tab = {}; T.groups[k].forEach(id => { tab[id] = { id, j: 0, g: 0, n: 0, p: 0, bp: 0, bc: 0, pts: 0 }; });
  T.gm[k].flat().forEach(m => {
    if (!m.res) return; const [a, b] = m.res.s, A = tab[m.a], B = tab[m.b];
    A.j++; B.j++; A.bp += a; A.bc += b; B.bp += b; B.bc += a;
    if (a > b) { A.g++; B.p++; A.pts += 3; } else if (b > a) { B.g++; A.p++; B.pts += 3; } else { A.n++; B.n++; A.pts++; B.pts++; }
  });
  return Object.values(tab).sort((x, y) => y.pts - x.pts || (y.bp - y.bc) - (x.bp - x.bc) || y.bp - x.bp || CBY[y.id].r - CBY[x.id].r);
}
function recordTour(s, pens) {
  const T = G.tour, m = nextFranceMatch(); if (!m) return;
  const frA = m.a === 'FRA';
  const ss = frA ? s : [s[1], s[0]];
  const w = pens ? pens.w : s[0] > s[1] ? 'FRA' : s[1] > s[0] ? G.opp : null;
  m.res = { s: ss, w, pens: !!pens };
  if (T.type === 'cdm' && T.stage === 'groups') {
    for (const k in T.gm) T.gm[k][T.md].forEach(x => { if (!x.res) simMatch(x, false); });
    T.md++;
    if (T.md === 3) {
      const st = {}; for (const k in T.groups) st[k] = standings(T, k);
      const q = (k, i) => st[k][i].id;
      T.rounds = [[{ a: q('A', 0), b: q('B', 1), res: null }, { a: q('C', 0), b: q('D', 1), res: null }, { a: q('B', 0), b: q('A', 1), res: null }, { a: q('D', 0), b: q('C', 1), res: null }]];
      T.ri = 0; T.stage = 'ko';
      if (!T.rounds[0].some(x => x.a === 'FRA' || x.b === 'FRA')) { T.out = true; T.outAt = 'en phase de groupes'; advanceKO(T); }
    }
  } else {
    if (w !== 'FRA') { T.out = true; T.outAt = 'en ' + T.names[T.ri].toLowerCase(); }
    advanceKO(T);
  }
}
function matchHtml(m) {
  if (!m.res) return `<div class="match"><span>${tn(m.a)}</span><span class="sc">–</span><span>${tn(m.b)}</span><span class="sc">–</span></div>`;
  const wa = m.res.w === m.a, wb = m.res.w === m.b;
  return `<div class="match"><span class="${wa ? 'w' : m.res.w ? 'l' : ''}">${tn(m.a)}</span><span class="sc">${m.res.s[0]}${m.res.pens && wa ? ' <small>tab</small>' : ''}</span><span class="${wb ? 'w' : m.res.w ? 'l' : ''}">${tn(m.b)}</span><span class="sc">${m.res.s[1]}${m.res.pens && wb ? ' <small>tab</small>' : ''}</span></div>`;
}
function tourView() {

      : `<div class="card"><p class="react">${T.out ? `La France est éliminée ${T.outAt}.` : ''} Vainqueur : ${tn(T.champ)}</p></div>`;
  } else if (nm) {

    top = `<div class="card row" style="justify-content:space-between"><div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Prochain match · ${T.type === 'cdm' && T.stage === 'groups' ? 'Groupe A, journée ' + (T.md + 1) : T.names[T.ri]}</span><div class="vs" style="justify-content:flex-start">${flag('FRA')} France <span class="muted">vs</span> ${esc(CBY[opp].name)} ${flag(opp)} ${starsOf(CBY[opp].r)}</div></div><button class="btn red" data-go="playTour">Préparer le match</button></div>`;
  }
  let body = '';
  if (T.type === 'cdm') {
    body += `<span class="h2">Groupes</span><div class="groups">${Object.keys(T.groups).map(k => {
      const st = standings(T, k);
      return `<div class="card"><table><thead><tr><th>Groupe ${k}</th><th>J</th><th>Diff</th><th>Pts</th></tr></thead><tbody>${st.map((r, i) => `<tr class="${r.id === 'FRA' ? 'me' : ''} ${T.md === 3 && i < 2 ? 'q' : ''}"><td>${tn(r.id)}</td><td>${r.j}</td><td>${r.bp - r.bc > 0 ? '+' : ''}${r.bp - r.bc}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>`;
    }).join('')}</div>`;
    if (T.stage === 'groups') body += `<span class="h2">Matchs du groupe A</span><div class="bracket">${T.gm.A.flat().map(matchHtml).join('')}</div>`;
  }
  if (T.rounds.length) body += `<span class="h2">Phase finale</span><div class="bracket">${T.rounds.map((r, i) => `<div class="card" style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">${T.names[i]}</span>${r.map(matchHtml).join('')}</div>`).join('')}</div>`;
  const back = T.champ ? `<div class="row" style="justify-content:flex-end"><button class="btn" data-go="${T.type === 'cdm' ? 'newCdm' : 'newTournoi'}">Nouvelle ${T.type === 'cdm' ? 'Coupe du monde' : 'édition'}</button><button class="btn ghost" data-go="title">Menu</button></div>` : '';
  const tabs = [['comp', T.type === 'cdm' ? 'Compétition' : 'Tableau'], ['squad', 'Effectif'], ['stats', 'Statistiques'], ['med', 'Infirmerie']];
  const nInj = FRA.filter(p => unavailable(p)).length;
  const content = hubTab === 'squad' ? squadTab() : hubTab === 'stats' ? statsTab() : hubTab === 'med' ? medTab() : body;
  show(`${header('title', 'Bureau du coach', title)}${top}
    <div class="card row" style="justify-content:space-between;gap:16px"><div style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px"><span class="eyebrow">Moral du groupe</span><div class="gauge"><i style="width:${Math.round(G.teamMorale * 100)}%"></i></div></div><span class="muted">${nInj ? nInj + ' joueur' + (nInj > 1 ? 's' : '') + ' indisponible' + (nInj > 1 ? 's' : '') : 'Tout le groupe est disponible'}</span></div>
    <div class="seg" id="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${hubTab === k}">${l}${k === 'med' && nInj ? ` (${nInj})` : ''}</button>`).join('')}</div>
    ${content}${back}`);
  scr.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { hubTab = b.dataset.tab; tourView(); }));
  bindPlayers(scr);
}

/* =====================================================================
   MÉTIER D'ENTRAÎNEUR : effectif, infirmerie, statistiques, entraînement,
   conférence de presse, sauvegarde
   ===================================================================== */
const SAVE_KEY = 'cdb-save-v1', CAREER_KEY = 'cdb-career-v1';
const blankSt = () => ({ mj: 0, min: 0, g: 0, a: 0, sh: 0, tk: 0, sv: 0, yc: 0, rc: 0, rt: 0, rn: 0 });
function resetSquad() {
  FRA.forEach(p => { p.fat = 0; p.inj = null; p.susp = 0; p.yel = 0; p.conf = 0.5; p.trust = 0.5; p.pref = null; p.st = blankSt(); p.hist = []; p.m = null; });
  G.fkTaker = null;
  G.teamMorale = 0.55; G.train = null; G.injLog = []; G.results = [];
  G.lineup = autoLineup(FRA, (G.lineup && G.lineup.formation) || '4-3-3');
}
resetSquad();
function saveGame() {
  if (!G.tour) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, mode: G.mode, tour: G.tour, teamMorale: G.teamMorale, style: G.style, formation: G.lineup.formation, injLog: G.injLog, results: G.results,
      fkTaker: G.fkTaker || null,
      players: FRA.map(p => ({ id: p.id, fat: p.fat, inj: p.inj, susp: p.susp, yel: p.yel, conf: p.conf, trust: p.trust, st: p.st, hist: p.hist }))
    }));
  } catch (_) {}
}
function loadSave() { try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return d && d.tour && !d.tour.champ ? d : null; } catch (_) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (_) {} }
function applySave(d) {
  resetSquad();
  G.mode = d.mode; G.tour = d.tour; G.fkTaker = d.fkTaker || null; G.teamMorale = d.teamMorale; G.style = d.style || 0; G.injLog = d.injLog || []; G.results = d.results || [];
  (d.players || []).forEach(s => { const p = byId(FRA, s.id); if (p) Object.assign(p, { trust: s.trust == null ? 0.5 : s.trust, fat: s.fat || 0, inj: s.inj || null, susp: s.susp || 0, yel: s.yel || 0, conf: s.conf == null ? 0.5 : s.conf, st: s.st || blankSt(), hist: s.hist || [] }); });
  G.lineup = autoLineup(FRA, d.formation || '4-3-3', true);
}
function career() { try { return JSON.parse(localStorage.getItem(CAREER_KEY) || 'null'); } catch (_) { return null; } }
function careerAdd(f) {
  const c = career() || { j: 0, v: 0, n: 0, d: 0, bp: 0, bc: 0, tournoi: 0, cdm: 0 };
  f(c); try { localStorage.setItem(CAREER_KEY, JSON.stringify(c)); } catch (_) {}
}
function saveLabel(d) {
  const T = d.tour, kind = T.type === 'cdm' ? 'Coupe du monde' : 'Tournoi';
  const stage = T.type === 'cdm' && T.stage === 'groups' ? `groupe A, journée ${T.md + 1}` : (T.names[T.ri] || '').toLowerCase();
  const r = d.results || [], v = r.filter(x => x.win).length, n = r.filter(x => x.draw).length;
  return `${kind} · ${stage} · ${r.length} match${r.length > 1 ? 's' : ''} joué${r.length > 1 ? 's' : ''} (${v} V, ${n} N, ${r.length - v - n} D)`;
}

/* ---- petits éléments d'affichage ---- */
const fmt1 = v => v == null ? '–' : v.toFixed(1).replace('.', ',');
const avgOf = p => p.st && p.st.rn ? p.st.rt / p.st.rn : null;
const noteCls = r => r == null ? '' : r >= 7.5 ? 'nhi' : r < 5.6 ? 'nlo' : '';
const energyCol = v => v < 45 ? 'var(--rouge)' : v < 70 ? 'var(--or)' : 'var(--vert)';
const mbar = (v, col) => `<span class="mb"><i style="width:${Math.round(clamp(v, 0, 100))}%;background:${col}"></i></span>`;
function statusHtml(p) {
  if (p.inj && p.inj.matches > 0) return `<span class="tagx red">Blessé ${p.inj.matches} m.</span>`;
  if (p.susp > 0) return `<span class="tagx red">Suspendu</span>`;
  if (p.yel > 0) return `<span class="tagx yel">Averti</span>`;
  if ((p.fat || 0) >= 22) return `<span class="tagx yel">Fatigué</span>`;
  return `<span class="tagx ok">Apte</span>`;
}
const ROLE_ORDER = { GK: 0, DEF: 1, MID: 2, ATT: 3 };
const formWord = c => c >= 0.72 ? 'Excellente' : c >= 0.58 ? 'Bonne' : c >= 0.42 ? 'Moyenne' : 'Mauvaise';

/* ---- Fiche joueur ---- */

  const body = $('panelBody');
  body.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">N° ${p.num} · ${esc(p.pos)} · ${ROLE_FR[p.role]}</span><span class="h2" style="font-size:30px">${esc(p.name)}</span></div>
      <span class="big" style="font-size:54px">${p.ovr}</span>
    </div>
    <div class="row">${statusHtml(p)}${p.inj && p.inj.matches > 0 ? `<span class="muted">${esc(p.inj.name)}</span>` : ''}${p.yel > 0 ? '<span class="muted">Un carton de plus et il est suspendu.</span>' : ''}</div>
    <div class="cols2">

        <span class="eyebrow">Qualités</span>
        ${attrs.map(([l, k]) => `<div class="stab"><span>${l}</span><b style="text-align:right">${p[k]}</b>${mbar(p[k], 'var(--bleu)')}<span></span></div>`).join('')}
      </div>
      <div class="card" style="display:flex;flex-direction:column;gap:8px">
        <span class="eyebrow">Condition</span>
        <div class="stab"><span>Énergie</span><b style="text-align:right">${Math.round(energy)}</b>${mbar(energy, energyCol(energy))}<span></span></div>
        <div class="stab"><span>Confiance en toi</span><b style="text-align:right">${Math.round(trustOf(p) * 100)}</b>${mbar(trustOf(p) * 100, trustOf(p) < 0.35 ? 'var(--rouge)' : trustOf(p) < 0.6 ? 'var(--or)' : 'var(--vert)')}<span></span></div>
        <div class="stab"><span>Forme · ${formWord(p.conf == null ? 0.5 : p.conf)}</span><b style="text-align:right">${Math.round((p.conf == null ? 0.5 : p.conf) * 100)}</b>${mbar((p.conf == null ? 0.5 : p.conf) * 100, 'var(--or)')}<span></span></div>
        <span class="eyebrow" style="margin-top:6px">Dernières notes</span>
        <div class="row">${(p.hist || []).length ? p.hist.map(h => `<span class="note ${noteCls(h.r)}" title="contre ${esc(CBY[h.o].name)}">${flag(h.o)} ${fmt1(h.r)}</span>`).join('') : '<span class="muted">Pas encore joué.</span>'}</div>
      </div>
    </div>
    <div class="card"><div class="kpis">
      <div><b>${st.mj}</b><span>Matchs</span></div><div><b>${st.min}'</b><span>Minutes</span></div>
      <div><b>${st.g}</b><span>Buts</span></div><div><b>${st.a}</b><span>Passes déc.</span></div>
      ${p.role === 'GK' ? `<div><b>${st.sv}</b><span>Arrêts</span></div>` : `<div><b>${st.tk}</b><span>Tacles</span></div>`}
      <div><b class="${noteCls(av)}">${fmt1(av)}</b><span>Note moy.</span></div>
      <div><b>${st.yc}/${st.rc}</b><span>Jaunes/rouges</span></div>
    </div></div>
    <button class="btn" id="psClose">Fermer</button>`;
  $('panel').hidden = false;
  $('psClose').addEventListener('click', () => { $('panel').hidden = true; if (onClose) onClose(); });
}
function bindPlayers(root, onClose) { root.querySelectorAll('[data-pl]').forEach(el => el.addEventListener('click', () => playerSheet(byId(FRA, el.dataset.pl), onClose))); }

/* ---- Onglets du bureau ---- */
let hubTab = 'comp';
function squadTab() {
  const list = FRA.slice().sort((a, b) => ROLE_ORDER[a.role] - ROLE_ORDER[b.role] || b.ovr - a.ovr);
  return `<p class="hint">Touche un joueur pour ouvrir sa fiche.</p><div class="tw"><table class="tbl">
    <thead><tr><th>Joueur</th><th>Poste</th><th>Note</th><th>Énergie</th><th>Forme</th><th>État</th><th>MJ</th><th>B</th><th>PD</th><th>Moy.</th></tr></thead>
    <tbody>${list.map(p => { const e = 100 - (p.fat || 0), av = avgOf(p); return `<tr data-pl="${p.id}" tabindex="0">
      <td><span class="num">${p.num}</span> <b>${esc(p.name)}</b></td><td>${p.pos}</td><td><b>${p.ovr}</b></td>
      <td>${mbar(e, energyCol(e))}</td><td>${mbar((p.conf == null ? 0.5 : p.conf) * 100, 'var(--or)')}</td><td>${statusHtml(p)}</td>

}
function topList(title, arr, val, fmt) {
  const rows = arr.filter(p => val(p) > 0).sort((a, b) => val(b) - val(a)).slice(0, 5);
  return `<div class="card" style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${title}</span>
    ${rows.length ? rows.map((p, i) => `<div class="lrow" data-pl="${p.id}"><span class="muted">${i + 1}</span><span>${esc(p.name)}</span><b>${fmt ? fmt(val(p)) : val(p)}</b></div>`).join('') : '<span class="muted">Rien pour l\'instant.</span>'}</div>`;
}
function statsTab() {
  const R = G.results || [], v = R.filter(r => r.win).length, n = R.filter(r => r.draw).length, d = R.length - v - n;
  const bp = R.reduce((s, r) => s + r.s[0], 0), bc = R.reduce((s, r) => s + r.s[1], 0);
  return `<div class="card"><div class="kpis">
      <div><b>${R.length}</b><span>Matchs</span></div><div><b>${v}</b><span>Victoires</span></div><div><b>${n}</b><span>Nuls</span></div><div><b>${d}</b><span>Défaites</span></div>
      <div><b>${bp}</b><span>Buts marqués</span></div><div><b>${bc}</b><span>Buts encaissés</span></div>

function medTab() {
  const inj = FRA.filter(p => p.inj && p.inj.matches > 0), sus = FRA.filter(p => p.susp > 0), warn = FRA.filter(p => p.yel > 0 && !p.susp);
  const tired = FRA.filter(p => (p.fat || 0) >= 12).sort((a, b) => b.fat - a.fat);
  const advice = inj.length >= 3 ? 'Le staff médical s\'inquiète : beaucoup de blessés. Une séance de récupération aiderait.'
    : tired.length >= 5 ? 'Plusieurs joueurs sont fatigués. Pense à faire tourner ou à choisir la récupération.'
    : 'Le groupe est en bonne santé.';
  const row = (p, right) => `<div class="lrow" data-pl="${p.id}"><span class="num">${p.num}</span><span>${esc(p.name)} <span class="muted">· ${p.pos}</span></span><span>${right}</span></div>`;
  return `<div class="card"><p class="react">Le médecin : « ${advice} »</p></div>
    <div class="groups">
      <div class="card" style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Blessés</span>${inj.length ? inj.map(p => row(p, `<span class="muted">${esc(p.inj.name)}</span> <b>${p.inj.matches} match${p.inj.matches > 1 ? 's' : ''}</b>`)).join('') : '<span class="muted">Aucun blessé.</span>'}</div>
      <div class="card" style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Suspendus et avertis</span>${sus.map(p => row(p, '<span class="tagx red">Suspendu</span>')).join('')}${warn.map(p => row(p, '<span class="tagx yel">1 jaune</span>')).join('')}${!sus.length && !warn.length ? '<span class="muted">Personne.</span>' : ''}</div>
      <div class="card" style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Fatigue</span>${tired.length ? tired.map(p => { const e = 100 - p.fat; return row(p, `${mbar(e, energyCol(e))} <b>${Math.round(e)}</b>`); }).join('') : '<span class="muted">Tout le monde est frais.</span>'}</div>
      <div class="card" style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Historique des blessures</span>${(G.injLog || []).length ? G.injLog.slice().reverse().map(l => `<div class="lrow"><span>${flag(l.opp)}</span><span>${esc(l.name)} · ${esc(l.inj)}</span><b>${l.m ? l.m + ' m.' : 'rien de grave'}</b></div>`).join('') : '<span class="muted">Aucune blessure.</span>'}</div>
    </div>`;
}

/* ---- Entraînement ---- */
const TRAININGS = [
  { id: 'recup', t: 'Récupération', d: 'Bains froids, massages et soins. Les joueurs récupèrent leur énergie et les blessés peuvent revenir plus tôt.' },
  { id: 'physique', t: 'Physique', d: 'Séance intense. Meilleure endurance pendant le match, mais un peu plus de fatigue et un risque de blessure.' },
  { id: 'tactique', t: 'Tactique', d: 'Placement et pressing. Les joueurs défendent mieux et font des passes plus propres.' },
  { id: 'finition', t: 'Finition', d: 'Ateliers devant le but. Les tirs sont plus précis.' },
  { id: 'cohesion', t: 'Cohésion', d: 'Sortie et activité de groupe. Le moral de l\'équipe monte.' }
];
function applyTraining(id) {
  const lines = []; let mods = {};
  const ok = FRA.filter(p => !unavailable(p));
  if (id === 'recup') {
    FRA.forEach(p => { p.fat = Math.max(0, (p.fat || 0) - 14); });
    FRA.filter(p => p.inj && p.inj.matches > 0).forEach(p => { if (Math.random() < 0.35) { p.inj.matches--; lines.push(`${p.short} récupère plus vite que prévu.`); if (!p.inj.matches) p.inj = null; } });
    lines.unshift('Les joueurs ont récupéré une bonne partie de leur énergie.');
  } else if (id === 'physique') {
    FRA.forEach(p => { if (!unavailable(p)) p.fat = Math.min(40, (p.fat || 0) + 5); });
    mods = { end: 10 };
    lines.push('Les joueurs tiendront mieux physiquement pendant le match.');
    ok.filter(p => p.role !== 'GK').forEach(p => { if (Math.random() < 0.035) { p.inj = { name: 'Contracture au mollet', matches: 1 }; G.injLog.push({ id: p.id, name: p.short, inj: 'Contracture à l\'entraînement', m: 1, opp: 'FRA' }); lines.push(`${p.short} s'est blessé à l'entraînement (1 match d'absence).`); } });
  } else if (id === 'tactique') { mods = { def: 4, tec: 2 }; lines.push('Le bloc est mieux organisé : défense et passes améliorées pour ce match.'); }
  else if (id === 'finition') { mods = { sho: 6 }; lines.push('Les attaquants ont trouvé le cadre : tirs plus précis pour ce match.'); }
  else if (id === 'cohesion') { G.teamMorale = clamp(G.teamMorale + 0.07, 0.2, 0.92); lines.push('L\'ambiance est excellente, le moral du groupe monte.'); }
  G.train = { id, mods };
  return lines;
}
function trainingScreen() {
  G.train = null;
  const render = (report) => {
    show(`${header('tourView', G.roundName, 'Entraînement')}
      <div class="card row" style="justify-content:space-between"><div class="vs" style="justify-content:flex-start">${flag('FRA')} France <span class="muted">vs</span> ${esc(CBY[G.opp].name)} ${flag(G.opp)} ${starsOf(CBY[G.opp].r)}</div>
        <div style="min-width:180px;display:flex;flex-direction:column;gap:4px"><span class="eyebrow">Moral du groupe</span><div class="gauge"><i style="width:${Math.round(G.teamMorale * 100)}%"></i></div></div></div>
      <p class="muted">Une seule séance avant le match. Choisis ce dont ton équipe a besoin.</p>
      <div class="speeches">${TRAININGS.map(t => `<button class="speech" data-tr="${t.id}" aria-pressed="${G.train && G.train.id === t.id}" ${G.train ? 'disabled' : ''}><b>${t.t}</b><span>${t.d}</span></button>`).join('')}</div>
      ${report ? `<div class="card" style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Rapport du staff</span>${report.map(l => `<p>${esc(l)}</p>`).join('')}</div>` : ''}
      <div class="row" style="justify-content:flex-end"><button class="btn" data-go="compo" ${G.train ? '' : 'disabled'}>Suivant : la composition</button></div>`);
    scr.querySelectorAll('[data-tr]').forEach(b => b.addEventListener('click', () => { if (G.train) return; const rep = applyTraining(b.dataset.tr); saveGame(); render(rep); }));
  };
  render(null);
}
function fixLineup() {
  const L = G.lineup;
  L.xi.forEach((id, i) => {
    const p = byId(FRA, id); if (!unavailable(p)) return;
    const slot = L.slots[i];
    const cand = L.bench.map(b => byId(FRA, b)).filter(q => !unavailable(q)).sort((a, b) => (b.role === slot.role) - (a.role === slot.role) || b.ovr - a.ovr)[0];
    if (cand) { L.xi[i] = cand.id; L.bench = L.bench.map(x => x === cand.id ? id : x); }
  });
}

/* ---- Tableau des notes ---- */
function ratingsTable(T, live) {
  const ps = FRA.filter(p => p.m && p.m.t > 0).sort((a, b) => ROLE_ORDER[a.role] - ROLE_ORDER[b.role]);

  return `<div class="tw"><table class="tbl">
    <thead><tr><th>Joueur</th><th>Min</th><th>Note</th><th>B</th><th>PD</th><th>Tirs</th><th>Passes</th><th>Tacl.</th>${live ? '<th>Énergie</th>' : ''}</tr></thead>
    <tbody>${ps.map(p => { const m = p.m, r = playerRating(p, T, M), e = p.sta;
      return `<tr data-pl="${p.id}"><td><span class="num">${p.num}</span> ${esc(p.short)}${m.inj ? ' <span class="tagx red">Blessé</span>' : ''}${m.rc ? ' <span class="tagx red">Rouge</span>' : m.yc ? ' <span class="tagx yel">Jaune</span>' : ''}${live && !onIds.has(p.id) ? ' <span class="muted">(sorti)</span>' : ''}</td>
      <td>${Math.round(m.t / HALF * 45)}'</td><td class="${noteCls(r)}"><b>${fmt1(r)}</b></td><td>${m.g}</td><td>${m.a}</td><td>${m.sot}/${m.sh}</td><td>${m.pc}/${m.pa}</td><td>${p.role === 'GK' ? m.sv + ' arr.' : m.tk}</td>
      ${live ? `<td>${onIds.has(p.id) ? mbar(e, energyCol(e)) : ''}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>`;
}

// Questions posées par les joueurs : 4 réponses possibles chacune
function playerQuestions(p, ctx) {
  const opp = CBY[G.opp].name, fatigue = (p.fat || 0) + (ctx.half && p.sta != null ? Math.max(0, 70 - p.sta) * 0.6 : 0);
  const r = ctx.half && p.m ? playerRating(p, M.teams[0], M) : null;
  const best = FRA.filter(q => q !== p && q.role !== 'GK').sort((a, b) => b.sho - a.sho)[0];
  const Q = [];
  if (!ctx.starters.has(p.id)) Q.push({ k: 'role', q: 'Pourquoi je suis remplaçant, coach ?', a: [
    ['Tu vas entrer en deuxième période, tiens-toi prêt.', () => ({ t: 0.08, c: 0.05, reply: 'Ok, je serai prêt !', mood: 'ok' })],
    ['Les autres sont meilleurs que toi en ce moment.', () => p.ovr >= 82 ? { t: -0.08, c: -0.08, reply: 'Meilleurs ? On verra bien…', mood: 'bad' } : { t: 0.01, c: -0.04, reply: 'Je vais bosser pour te faire changer d\'avis.', mood: 'ok' }],
    ['C\'est un choix tactique contre cette équipe.', () => ({ t: 0.04, reply: 'D\'accord, je respecte ton choix.', mood: 'ok' })],
    ['Pose pas de questions, c\'est moi qui décide.', () => ({ t: -0.13, m: -0.02, reply: 'Super l\'ambiance…', mood: 'bad' })]
  ] });
  if (fatigue >= 12) Q.push({ k: 'tired', q: 'Je suis cramé, coach… Je peux souffler un peu ?', a: [
    ['Je te fais sortir dès que tu fatigues trop.', () => ({ t: 0.08, reply: 'Merci, je vais tout donner jusque-là !', mood: 'ok' })],
    ['Serre les dents, on a besoin de toi.', () => confOf(p) > 0.55 ? { t: 0.03, c: 0.03, reply: 'Ok, je vais m\'arracher !', mood: 'hey' } : { t: -0.05, reply: 'Facile à dire pour toi…', mood: 'bad' }],
    ['Bois, mange et récupère, le staff s\'occupe de toi.', () => ({ t: 0.05, reply: 'Ça fait du bien, merci coach.', mood: 'ok' })],
    ['Arrête de te plaindre.', () => ({ t: -0.12, reply: 'Je me plains pas, je te préviens !', mood: 'bad' })]
  ] });
  Q.push({ k: 'plan', q: 'On joue comment ce soir, coach ?', a: [
    ['On attaque d\'entrée, on les étouffe.', () => ({ t: p.role === 'ATT' ? 0.07 : 0.02, style: 1, reply: p.role === 'ATT' ? 'Ça me plaît ! Je vais les rendre fous !' : 'Ok, on monte tous ensemble.', mood: p.role === 'ATT' ? 'hey' : 'ok' })],
    ['On reste compacts et on joue le contre.', () => ({ t: p.role === 'DEF' || p.role === 'GK' ? 0.07 : 0.01, style: -1, reply: p.role === 'ATT' ? 'Je vais être bien seul devant…' : 'Parfait, on ferme tout.', mood: p.role === 'ATT' ? 'bad' : 'ok' })],
    ['On s\'adapte, reste concentré sur ton poste.', () => ({ t: 0.04, style: 0, reply: 'Compris, je reste discipliné.', mood: 'ok' })],
    ['Fais ce que je te dis sur le terrain, c\'est tout.', () => ({ t: -0.07, reply: 'Ah… d\'accord.', mood: 'bad' })]
  ] });
  Q.push({ k: 'trust', q: 'Tu as confiance en moi, coach ?', a: [
    ['Bien sûr, tu es un pilier de cette équipe.', () => ({ t: 0.09, c: 0.08, reply: 'Je vais pas te décevoir !', mood: 'hey' })],
    ['Montre-moi ce soir ce que tu vaux.', () => confOf(p) > 0.5 ? { t: 0.04, c: 0.03, reply: 'Tu vas voir !', mood: 'hey' } : { t: -0.03, c: -0.05, reply: 'Ok… pas de pression alors.', mood: 'bad' }],
    ['Comme en tous mes joueurs.', () => ({ t: 0.02, reply: 'Hmm. D\'accord.', mood: 'ok' })],
    ['Pas vraiment, tu dois encore progresser.', () => ({ t: -0.11, c: -0.12, reply: 'Merci pour le soutien…', mood: 'bad' })]
  ] });
  if (p.role !== 'GK' && p.role !== 'DEF') Q.push({ k: 'fk', q: 'Je peux tirer les coups francs et les penaltys ce soir ?', a: [
    ['Oui, ils sont pour toi.', () => ({ t: 0.08, c: 0.06, fk: p.id, reply: 'Yes ! Je vais en mettre un !', mood: 'hey' })],
    ['On verra selon la position du ballon.', () => ({ t: 0.02, reply: 'Ok, je serai prêt.', mood: 'ok' })],
    [`Non, c'est ${best ? best.short : 'un autre'} qui tire.`, () => ({ t: confOf(p) > 0.55 ? -0.06 : -0.01, fk: best ? best.id : null, reply: confOf(p) > 0.55 ? 'Pff… il rate tout pourtant.' : 'D\'accord, pas de souci.', mood: confOf(p) > 0.55 ? 'bad' : 'ok' })],
    ['Concentre-toi déjà sur ton jeu.', () => ({ t: -0.06, reply: 'Je suis concentré, moi !', mood: 'bad' })]
  ] });
  if (ctx.half && r != null) Q.push({ k: 'perf', q: 'Je fais un bon match, coach ?', a: [
    ['Excellent, continue comme ça !', () => r >= 6.5 ? { t: 0.08, c: 0.06, reply: 'Merci ! Je lâche rien !', mood: 'hey' } : { t: 0.02, c: 0.03, reply: 'Ah bon ? Ok, tant mieux !', mood: 'ok' }],
    ['Tu peux faire mieux, réveille-toi.', () => r < 6.2 ? { t: 0.05, c: 0.02, reply: 'T\'as raison, je vais me reprendre.', mood: 'ok' } : { t: -0.07, reply: 'J\'ai tout donné, moi !', mood: 'bad' }],
    ['On en parlera après le match.', () => ({ t: -0.02, reply: 'Ok…', mood: 'ok' })],
    ['C\'est catastrophique.', () => r < 5.5 ? { t: -0.03, c: -0.05, reply: 'Je sais… désolé coach.', mood: 'bad' } : { t: -0.12, c: -0.08, reply: 'Catastrophique ?! T\'as regardé le match ?', mood: 'bad' }]
  ] });
  return Q;
}
// Questions du coach : la réponse dépend de l'état du joueur
function coachQuestions(p, ctx) {
  const opp = CBY[G.opp], fatigue = (p.fat || 0) + (ctx.half && p.sta != null ? Math.max(0, 70 - p.sta) : 0);
  const low = FRA.filter(q => q !== p).sort((a, b) => trustOf(a) - trustOf(b))[0];
  return [
    { k: 'feel', t: 'Comment tu te sens ?', res: () => fatigue >= 20 ? { reply: 'Les jambes sont lourdes, coach…', mood: 'bad', t: 0.03 }
      : confOf(p) >= 0.65 ? { reply: 'Je me sens invincible !', mood: 'hey', t: 0.03 }
      : confOf(p) < 0.4 ? { reply: 'Pas terrible… j\'ai pas la tête au match.', mood: 'bad', t: 0.04, c: 0.03 }
