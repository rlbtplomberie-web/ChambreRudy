// ================== CANVAS ==================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0;
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const vw = innerWidth, vh = innerHeight;
  scale = Math.min(vw/W, vh/H);
  cv.style.width = (W*scale)+'px'; cv.style.height = (H*scale)+'px';
  cv.width = Math.round(W*scale*dpr); cv.height = Math.round(H*scale*dpr);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.imageSmoothingQuality = 'high';
  const r = cv.getBoundingClientRect(); offX = r.left; offY = r.top;
}
addEventListener('resize', resize); resize();

// ================== IMAGES ==================
const IMG = {};
let loaded = 0, total = 0;
for (const k in ASSETS){ total++; const im = new Image(); im.onload = ()=>loaded++; im.src = ASSETS[k].src; IMG[k] = im; }

// dessine l'image n de la feuille k ; x,y = point au sol ; face = 1 droite / -1 gauche
function drawFrame(k, n, x, y, face, alpha, anchorOverride){
  const s = ASSETS[k]; const fr = s.f[Math.max(0, Math.min(n, s.f.length-1))];
  const [sx, sy, sw, sh, ax0] = fr;
  const ax = anchorOverride!=null ? anchorOverride*sw : ax0;
  const flip = (s.dir !== face);
  ctx.save();
  if (alpha!=null) ctx.globalAlpha = alpha;
  ctx.translate(Math.round(x), Math.round(y));
  if (flip) ctx.scale(-1,1);
  ctx.drawImage(IMG[k], sx, sy, sw, sh, -ax/Q, -sh/Q, sw/Q, sh/Q);
  ctx.restore();
}
function nf(k){ return ASSETS[k].f.length; }

// ================== SON ==================
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); }
function noise(dur, freq, vol, type){
  if(!AC) return; const t = AC.currentTime;
  const len = Math.floor(AC.sampleRate*dur), b = AC.createBuffer(1,len,AC.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2);
  const src = AC.createBufferSource(); src.buffer = b;
  const f = AC.createBiquadFilter(); f.type = type||'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
}
function tone(f0, f1, dur, vol, wave){
  if(!AC) return; const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = wave||'square';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
}
const SFX = {

  hit(){ noise(0.15, 900, 0.5); tone(160,60,0.12,0.25,'square'); },

  ball(){ tone(500,120,0.5,0.15,'sawtooth'); noise(0.4,1200,0.15,'bandpass'); },
  go(){ tone(523,523,0.12,0.15); setTimeout(()=>tone(784,784,0.2,0.15),120); },
  ko(){ tone(300,50,0.8,0.25,'sawtooth'); },
  beam(){ tone(300,900,0.35,0.18,'sawtooth'); noise(0.4,2500,0.2,'bandpass'); },

  eat(){ [660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,f,0.12,0.14,'triangle'),i*90)); },
  chargeR(){ tone(200, 900, 0.36, 0.08, 'sawtooth'); },
  laserR(){ tone(1600, 300, 0.35, 0.13, 'sawtooth'); tone(800, 150, 0.35, 0.08, 'square'); noise(0.25, 3000, 0.15, 'bandpass'); },
  tele(){ for (let i=0;i<7;i++) setTimeout(()=>noise(0.06, 2200+Math.random()*1500, 0.12, 'bandpass'), i*55); tone(700,250,0.45,0.06,'sine'); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,0.25,0.15,'triangle'),i*150)); },

addEventListener('keydown', e=>{

// boutons tactiles
const BTN = {

    else if (p.x < W*0.5){ STICK.id = t.identifier; STICK.cx = Math.max(80,Math.min(p.x,330)); STICK.cy = Math.max(300,Math.min(p.y,470)); STICK.dx=0; STICK.dy=0; touches[t.identifier] = {stick:true}; }

    if (o.stick){ const p = toGame(t); let dx = p.x-STICK.cx, dy = p.y-STICK.cy; const d = Math.hypot(dx,dy); if (d>STICK.r){ dx*=STICK.r/d; dy*=STICK.r/d; } STICK.dx=dx; STICK.dy=dy; }

function endTouch(e){
  e.preventDefault();
  for (const t of e.changedTouches){

function readInput(){

  if (keys.ArrowLeft||keys.KeyA||keys.KeyQ) x -= 1;
  if (keys.ArrowRight||keys.KeyD) x += 1;
  if (keys.ArrowUp||keys.KeyW||keys.KeyZ) y -= 1;
  if (keys.ArrowDown||keys.KeyS) y += 1;
  if (STICK.id!==null){ const d = STICK.r*0.3; if (Math.abs(STICK.dx)>d) x = Math.sign(STICK.dx); if (Math.abs(STICK.dy)>d) y = Math.sign(STICK.dy); }

// ================== JEU ==================
const game = {state:'title', map:0, t:0, kills:0, cam:0, ents:[], fx:[], balls:[], banner:0, fade:0, fadeDir:0, shake:0, goShown:false};
let rudy = null;

function worldW(){ const b = ASSETS[MAPS[game.map].bg]; return b.w/b.h*H; }

function newRudy(hp){
  return {isRudy:true, en:(rudy?rudy.en:0)||0, x:140, y:(MAPS[game.map].yMin+MAPS[game.map].yMax)/2, z:0, face:1, hp:hp, st:'idle', t:0, fr:0, combo:0, inv:0, hidden:false};

function startMap(i, keepHp){

  if (keepHp==null) RUDY_MAX = 100*pvDebut();
  const hp = keepHp!=null ? keepHp : RUDY_MAX;
  rudy = newRudy(hp); game.cam = 0; game.banner = 2.6; game.spawnT = 0.6;

  } else game.boss = null;

function videoAvantBoss(){
  game.state = 'video';                                  // le jeu attend la fin de la vidéo
  const prevenir = on=>{ try{ if (window.parent && window.parent !== window) window.parent.postMessage({type:'chateau:video', on:on}, '*'); }catch(e){} };
  prevenir(true);                                        // Rembourg coupe la musique du château pendant la vidéo
  const vb = document.createElement('div');
  vb.style.cssText = 'position:fixed;inset:0;z-index:999;background:#000';
  vb.innerHTML = '<video playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></video>';
  document.body.appendChild(vb);

  v.addEventListener('ended',fin); v.addEventListener('error',fin);
  v.src = '/assets/shinato/m/chateau_boss_intro.mp4';

function makeEnemy(kind, x, y){
  const K = KINDS[kind];
  return {kind, K, x, y, z:K.fly?55:0, face:-1, hp:K.hp, st:'walk', t:0, fr:0, cd:1+Math.random(), hpShow:0, dead:false, alpha:1, ox:(Math.random()<0.5?-1:1), bob:Math.random()*6};
}

function spawnEnemy(){
  const m = MAPS[game.map];
  const onScreen = game.ents.filter(e=>!e.dead).map(e=>e.kind);
  let pool = ['v','f','c','b','g','h','t'].filter(k=>!onScreen.includes(k));
  if (onScreen.includes('t')) pool = pool.filter(k=>k!=='t');
  if (!pool.length) pool = ['v','f','c','b','g','h'];
  // la grande vampire est un peu plus rare
  let kind = pool[Math.floor(Math.random()*pool.length)];
  if (kind==='t' && Math.random()<0.4 && pool.length>1) kind = pool.filter(k=>k!=='t')[Math.floor(Math.random()*(pool.length-1))];
  const fromLeft = rudy.x > game.cam+W*0.65 ? true : (rudy.x < game.cam+W*0.35 ? false : Math.random()<0.5);
  let x = fromLeft ? game.cam-80 : game.cam+W+80;
  x = Math.max(-60, Math.min(worldW()+60, x));
  const y = m.yMin + Math.random()*(m.yMax-m.yMin);
  const e = makeEnemy(kind, x, y); e.face = fromLeft?1:-1;
  game.ents.push(e);
}

function living(){ return game.ents.filter(e=>!e.dead); }

function update(dt){
  game.t += dt;
  if (game.fadeDir){ game.fade += game.fadeDir*dt*2; if (game.fade<=0){ game.fade=0; game.fadeDir=0; } if (game.fade>=1 && game.fadeDir>0){ game.fade=1; game.fadeDir=0; game.onFade && game.onFade(); } }
  if (game.state!=='play') return;
  if (game.banner>0) game.banner -= dt;
  if (game.grabCD>0) game.grabCD -= dt;
  readInput();
  const m = MAPS[game.map];

  // apparitions (4 max, un nouveau dès qu'un ennemi est battu)
  if (!m.boss){
    game.spawnT -= dt;
    if (living().length < MAX_ENEMIES && game.spawnT <= 0){ spawnEnemy(); game.spawnT = 0.9 + Math.random()*0.8; }
  }

  updateRudy(dt);
  for (const e of game.ents) updateEnemy(e, dt);
  game.ents = game.ents.filter(e=>!(e.dead && e.alpha<=0));
  updateBalls(dt);
  for (const c of game.crates) if (c.shake>0) c.shake -= dt;
  game.crates = game.crates.filter(c=>c.hp>0);
  for (const ch of game.chickens){ ch.t += dt; if (!ch.taken && rudy.st!=='dead' && !rudy.hidden && Math.abs(ch.x-rudy.x) < 45 && Math.abs(ch.y-rudy.y) < 26){ ch.taken = true; rudy.hp = Math.min(RUDY_MAX, rudy.hp + 35); SFX.eat(); addFx('heal', ch.x, ch.y-60); } }
  game.chickens = game.chickens.filter(c=>!c.taken);
  for (const f of game.fx) f.t += dt;
  game.fx = game.fx.filter(f=>f.t < f.life);

  // GO
  if (!m.boss && game.kills >= KILLS_TO_GO && !game.goShown){ game.goShown = true; SFX.go(); }

  // caméra
  const ww = worldW();
  let target = rudy.x - W*0.42;
  target = Math.max(0, Math.min(ww-W, target));
  game.cam += (target-game.cam)*Math.min(1, dt*6);
  if (game.shake>0) game.shake -= dt;
  pressQueue = [];
}

function atExit(){ return !MAPS[game.map].boss && game.kills>=KILLS_TO_GO && rudy.x > worldW()-150 && !rudy.hidden && rudy.st!=='down'; }

// ---------- RUDY ----------
function setR(st){ rudy.st = st; rudy.t = 0; rudy.fr = 0; }
function updateRudy(dt){
  const r = rudy, m = MAPS[game.map];
  r.t += dt; if (r.inv>0) r.inv -= dt;
  const pressed = pressQueue.slice();
  if (r.st==='dead'){ r.fr = Math.min(5, Math.floor(r.t/0.1)); return; }
  if (r.st==='grabbed'){ // attrapé : appuyer plusieurs fois pour s'échapper
    r.mash += pressed.length;
    return;
  }
  if (r.st==='grabbing' || r.st==='headbutted') return;

  if (r.st==='hurt'){ r.fr = r.t<0.12?0:1; r.x -= r.kb*dt*120; if (r.t>0.32) setR('idle'); clampR(); return; }
  if (r.st==='down'){ // tombe, reste au sol puis se relève
    const T = r.t;
    if (T < 0.6){ r.fr = Math.min(5, Math.floor(T/0.1)); r.x -= r.kb*dt*160*(1-T/0.6); }
    else if (T < 1.3) r.fr = 5;
    else if (T < 1.8) r.fr = 5 - Math.floor((T-1.3)/0.1);
    else { setR('idle'); r.inv = 0.8; }
    clampR(); return;
  }
  if (r.st==='beam'){
    r.fr = r.t < 0.1 ? 1 : 3;
    if (r.t > 0.12 && !r.cast){ r.cast = true; game.balls.push({yellow:true, x:r.x+r.face*80, y:r.y, z:130, vx:r.face*620, t:0, hitList:[]}); }
    if (r.t > 0.45) setR('idle');
    return;
  }
  if (r.st==='punch' || r.st==='kick'){
    const sp = r.st==='punch' ? 0.05 : 0.062;
    const n = Math.floor(r.t/sp);
    if (r.st==='punch' && n===3 && !r.hitDone){ r.hitDone = true; doHit(10, 110, false, 'r_punch', 3); }
    if (r.st==='kick' && n===3 && !r.hitDone){ r.hitDone = true; doHit(16, 135, r.combo>=2, 'r_kick', 3); }
    r.fr = Math.min(5, n);
    // enchaîner
    if (pressed.length && n>=3){ const b = pressed[pressed.length-1]; if (b==='punch'||b==='kick'){ startAttack(b); return; } }
    if (n>=6) { setR('idle'); r.combo = 0; }
    return;
  }

  // déplacement
  const sp = 230;
  let moving = false;
  if (input.x || input.y){
    r.x += input.x*sp*dt; r.y += input.y*sp*0.55*dt; moving = true;
    if (input.x) r.face = input.x;
  }
  clampR();
  if (moving){ if (r.st!=='walk') setR('walk'); r.fr = Math.floor(r.t/0.075)%6; }
  else if (r.st!=='idle') setR('idle');

  for (const b of pressed){
    if (b==='punch' && atExit()){ nextMap(); return; }
    if (b==='punch' || b==='kick'){ startAttack(b); return; }
    if (b==='grab'){ tryGrab(); return; }
    if (b==='energy' && r.en >= 100){ r.en = 0; setR('beam'); r.cast = false; SFX.beam(); return; }
  }
}
function clampR(){
  const m = MAPS[game.map];
  rudy.y = Math.max(m.yMin, Math.min(m.yMax, rudy.y));
  rudy.x = Math.max(40, Math.min(worldW()-40, rudy.x));
}
function startAttack(b){
  rudy.combo = (rudy.st==='punch'||rudy.st==='kick') ? rudy.combo+1 : 0;
  setR(b); rudy.hitDone = false; SFX.whoosh();
  if (input.x) rudy.face = input.x;
}
const FEUILLES = ASSETS, ECH = y => 1/Q;
// ---------- touche précise : le poing (ou le pied) de Rudy doit vraiment arriver sur le corps ----------
// largeur réelle du corps de chaque image (mesurée une fois dans l'image, à hauteur du ventre et des hanches)
const corpsCache = {}, corpsCv = document.createElement('canvas'), corpsCx = corpsCv.getContext('2d', { willReadFrequently: true });
function corpsImage(k, i){
  const cle = k + '|' + i; if (corpsCache[cle]) return corpsCache[cle];
  const s = FEUILLES[k], f = s && s.f[Math.max(0, Math.min(i|0, s.f.length-1))]; if (!f) return null;
  const [sx, sy, w, h, ax] = f; let res = { g: ax, d: w - ax };
  try {
    const im = IMG[k]; if (!im || !im.complete || !im.naturalWidth) return res;
    const y0 = Math.floor(h*0.38), y1 = Math.floor(h*0.68), n = y1 - y0;
    corpsCv.width = w; corpsCv.height = n; corpsCx.clearRect(0, 0, w, n);
    corpsCx.drawImage(im, sx, sy + y0, w, n, 0, 0, w, n);
    const d = corpsCx.getImageData(0, 0, w, n).data;
    let gx = -1, dx = -1;
    for (let x = 0; x < w; x++){ let c = 0; for (let y = 0; y < n; y++) if (d[(y*w + x)*4 + 3] > 100) c++; if (c >= n*0.3){ if (gx < 0) gx = x; dx = x; } }
    if (gx >= 0) res = { g: ax - gx, d: dx - ax };
  } catch(err){}
  return corpsCache[cle] = res;
}
// bords gauche et droit du corps de l'ennemi à l'écran (tel qu'il est dessiné)
function bordsCorps(e){
  const k = e._sheet; if (!k || !FEUILLES[k]) return null;
  const s = FEUILLES[k], i = Math.max(0, Math.min(e._n|0, s.f.length-1)), c = corpsImage(k, i); if (!c) return null;
  let g = c.g, d = c.d;
  if (e._ax != null){ const dec = e._ax - s.f[i][4]; g += dec; d -= dec; }
  const sc = ECH(e._y), flip = s.dir !== e._face;
  return flip ? [e._x - d*sc, e._x + g*sc] : [e._x - g*sc, e._x + d*sc];
}
// le bout du poing / du pied de Rudy (image k, pose i) arrive-t-il sur le corps de l'ennemi ?
function coupTouche(e, k, i){
  const r = rudy, b = bordsCorps(e); if (!b) return null;            // inconnu : on garde l'ancien test
  if ((e.x - r.x)*r.face < -20) return false;                         // derrière Rudy
  const f = FEUILLES[k].f[i], bout = r.x + r.face*(f[2] - f[4])*ECH(r.y);
  return r.face === 1 ? (bout >= b[0] - 6 && bout <= b[1] + 14) : (bout <= b[1] + 6 && bout >= b[0] - 14);
}
function doHit(dmg, range, knock, pk, pi){
  let any = false;
  for (const e of living()){
    if (e.st==='down' || e.st==='intro' || e.st==='grabbedByR' || e.st==='tele') continue;
    const dx = (e.x - rudy.x)*rudy.face;
    const touche = pk ? coupTouche(e, pk, pi) : null;
    if (touche === null ? (dx > -20 && dx < range) : touche) if (Math.abs(e.y-rudy.y) < 30){
      if (e.st==='grab') continue;
      hurtEnemy(e, dmg, knock || rudy.combo>=3);
      rudy.en = Math.min(100, rudy.en + 8);
      any = true;
    }
  }
  for (const c of game.crates){
    if (c.hp<=0) continue;
    const dx = (c.x - rudy.x)*rudy.face;
    if (dx > -10 && dx < range+10 && Math.abs(c.y-rudy.y) < 32){
      c.hp--; c.shake = 0.25; any = true; addFx('spark', c.x, c.y-40);
      if (c.hp<=0){ SFX.crate(); for (let i=0;i<8;i++) game.fx.push({type:'plank', x:c.x, y:c.y-30, vx:(Math.random()-0.5)*300, vy:-150-Math.random()*200, rot:Math.random()*6, t:0, life:0.9}); game.chickens.push({x:c.x, y:c.y, t:0}); }
    }
  }
  if (any){ SFX.hit(); game.shake = 0.08; }
}
function tryGrab(){
  let best = null, bd = 1e9;
  for (const e of living()){
    if (e.st==='down' || e.st==='intro' || e.st==='grab' || e.st==='tele') continue;
    const d = Math.abs(e.x-rudy.x);
    if (d < 95 && Math.abs(e.y-rudy.y) < 28 && d < bd){ best = e; bd = d; }
  }
  if (!best){ setR('punch'); rudy.hitDone = false; SFX.whoosh(); return; }
  rudy.face = Math.sign(best.x-rudy.x)||rudy.face;
  if (!best.K.grabbable){ // la grande vampire et la reine contrent et attrapent Rudy
    enemyGrab(best);
    return;
  }
  // Rudy attrape : coup plus puissant
  setR('grabbing'); rudy.hidden = true; SFX.grab();
  best.st = 'grabbedByR'; best.t = 0; best.fr = 0; best.face = -rudy.face;
  best.pairX = (rudy.x+best.x)/2; best.pairY = (rudy.y+best.y)/2;
  rudy.grabTarget = best;
}

// ---------- ENNEMIS ----------
function hurtEnemy(e, dmg, knock){
  if (e.st==='tele') return;
  e.hp -= dmg; e.hpShow = 2.2;
  addFx('spark', e.x - rudy.face*10, e.y - (e.K.fly?e.z:0) - 120);
  if (e.K.boss) knock = knock && Math.random()<0.2;
  if (e.hp <= 0){ e.hp = 0; knockDown(e, true); return; }
  if (knock){ knockDown(e, false); return; }
  e.st = 'hurt'; e.t = 0; e.face = Math.sign(rudy.x-e.x)||e.face;
}
function knockDown(e, dead){
  e.st = 'down'; e.t = 0; e.willDie = dead; e.face = Math.sign(rudy.x-e.x)||e.face;
  SFX.fall(); game.shake = 0.12;
}
function enemyGrab(e){
  if (rudy.st==='grabbed') return;
  e.st = 'grab'; e.t = 0; e.fr = 0; e.face = Math.sign(rudy.x-e.x)||e.face;
  e.pairX = (rudy.x+e.x)/2; e.pairY = (rudy.y+e.y)/2;
  setR('grabbed'); rudy.hidden = true; rudy.mash = 0; rudy.grabber = e;
  rudy.need = e.K.boss ? 18 : (e.kind==='t' ? 10 : 7);
  SFX.grab();
}

function updateEnemy(e, dt){
  const K = e.K, k = e.kind, m = MAPS[game.map];
  e.t += dt; e.bob += dt;
  if (e.hpShow>0) e.hpShow -= dt;
  if (e.dead){ e.alpha -= dt*1.2; return; }
  const r = rudy;
  const dx = r.x - e.x, dy = r.y - e.y, adx = Math.abs(dx);

  switch(e.st){
  case 'intro':
    e.face = -1; e.fr = Math.floor(e.t/0.12)%6;
    if (e.t > 1.6){ e.st='walk'; e.t=0; }
    return;
  case 'hurt':
    e.fr = e.t<0.12?0:1; e.x -= Math.sign(dx||1)*dt*90;
    if (e.t > 0.35){ e.st='walk'; e.t=0; e.cd = 0.5+Math.random()*0.6; }
    break;
  case 'down': {
    const T = e.t, n = nf(k+'_fall');
    if (T < 0.6){ e.fr = Math.min(n-1, Math.floor(T/(0.6/n))); e.x -= Math.sign(dx||1)*dt*180*(1-T/0.6); if (K.fly) e.z = Math.max(0, e.z - dt*140); }
    else if (e.willDie){ e.fr = n-1; if (T > 1.1){ e.dead = true; if (!K.boss) game.kills++; else bossDefeated(); } }
    else if (T < 1.4) e.fr = n-1;
    else if (T < 1.4+0.08*n) { e.fr = n-1-Math.floor((T-1.4)/0.08); if (K.fly) e.z = Math.min(55, e.z+dt*120); }
    else { e.st='walk'; e.t=0; e.cd = 0.8; if (K.fly) e.z = 55; }
    break; }
  case 'grabbedByR': { // Rudy l'attrape
    const n = nf(k+'_rg');
    e.fr = Math.min(n-1, Math.floor(e.t/0.16));
    if (e.fr===3 && !e.grabHit){ e.grabHit = true; e.hp -= 28; rudy.en = Math.min(100, rudy.en + 15); e.hpShow = 2.2; SFX.big(); game.shake = 0.18; addFx('spark', e.pairX, e.pairY-80); }
    if (e.t > n*0.16+0.15){
      e.grabHit = false;
      rudy.hidden = false; setR('idle'); rudy.inv = 0.6;
      rudy.x = e.pairX - rudy.face*45; e.x = e.pairX + rudy.face*80; e.y = e.pairY; rudy.y = e.pairY; clampR();
      if (e.hp <= 0){ e.hp = 0; e.st='down'; e.willDie = true; e.t = 0.6; }

    return; }
  case 'grab': { // l'ennemi attrape Rudy et pompe sa vie
    const n = nf(k+'_eg'), [l0,l1] = K.grabLoop;
    const intro = l0*0.16;
    if (e.t < intro) e.fr = Math.floor(e.t/0.16);
    else {
      const span = l1-l0+1; e.fr = l0 + Math.floor((e.t-intro)/0.2)%span;
      r.hp -= K.pump*dt; e.pumpT = (e.pumpT||0)-dt;
      if (e.pumpT<=0){ e.pumpT = 0.45; SFX.pump(); addFx('drain', e.pairX, e.pairY-110); }
      if (r.hp <= 0){ r.hp = 0; releaseRudy(e, true); return; }
      if (r.mash >= r.need){ releaseRudy(e, false); return; }
    }
    return; }
  case 'headbutt': { // la grande vampire : coup de tête
    e.fr = Math.min(3, Math.floor(e.t/0.16));
    if (e.fr>=2 && !e.hbHit){
      if (Math.abs(r.x-e.x) < 130 && Math.abs(r.y-e.y) < 30 && r.st!=='grabbed' && r.st!=='down' && r.st!=='grabbing' && r.inv<=0){
        e.hbHit = 'yes'; r.hidden = true; setR('headbutted'); r.hp -= K.dmg; SFX.big(); game.shake = 0.15; addFx('spark', e.x+e.face*90, e.y-170);
        r.x = e.x + e.face*85; r.y = e.y;
      } else e.hbHit = 'miss';
    }
    if (e.t > 0.7){
      if (e.hbHit==='yes'){ r.hidden = false; r.face = -e.face; r.kb = 1; if (r.hp<=0) killRudy('coups_t'); else { setR('hurt'); r.kb = 1.4; } }
      e.hbHit = false; e.st='walk'; e.t=0; e.cd = 1.4+Math.random();
    }
    return; }
  case 'attack': {
    const sp = K.atkSpd, n = nf(k+'_atk');
    e.fr = Math.min(n-1, Math.floor(e.t/sp));
    if (K.hitF.includes(e.fr) && e.lastHitF!==e.fr){
      e.lastHitF = e.fr;
      const ddx = (r.x-e.x)*e.face;
      if (ddx > -10 && ddx < K.reach+10 && Math.abs(r.y-e.y) < 28) hurtRudy(K.dmg, false, e);
    }
    if (e.t > n*sp){ e.st='walk'; e.t=0; e.cd = K.boss ? 0.55+Math.random()*0.7 : 1.3+Math.random()*1.4; e.lastHitF=-1; }
    break; }
  case 'tele': { // la reine se change en nuée de chauves-souris, disparaît et réapparaît près de Rudy
    const T = e.t;
    if (T >= 0.95 && !e.teleArrive){
      e.teleArrive = true;
      const ww = worldW(), cote = (r.face || 1);
      let nx = r.x - cote*110; if (nx < 60 || nx > ww-60) nx = r.x + cote*110;
      e.x = Math.max(60, Math.min(ww-60, nx)); e.y = Math.max(m.yMin, Math.min(m.yMax, r.y));
      e.face = Math.sign(r.x-e.x)||e.face; preparerChauves(e, false); SFX.tele && SFX.tele();
    }
    e.fr = 0;
    if (T > 1.6){ e.st='walk'; e.t=0; e.cd = 0.25; e.teleCd = 4.5+Math.random()*3.5; e.teleArrive=false; e.bats=null; }
    return; }
  case 'laser': { // la reine tend le bras : la lumière rouge se charge dans sa main, puis un laser rouge part très vite
    const T = e.t;
    e.fr = T < 0.12 ? Math.min(3, Math.floor(T/0.04)) : (T < 0.36 ? 3 : (T < 0.62 ? 3 + (Math.floor(T*30)%2) : 4));   // elle tend vite le bras, puis charge
    if (T >= 0.36 && !e.tir){
      e.tir = true; SFX.laserR();
      const hx = e.x + e.face*86, ry = e.y;
      e.laser = { x: hx, y: ry, h: 168, face: e.face, t: 0 };
      // le laser part en ligne droite devant elle : Rudy est touché s'il est sur la ligne
      if ((r.x - hx)*e.face > -20 && Math.abs(r.y - ry) < 26 && !r.hidden && r.inv<=0 && r.st!=='down' && r.st!=='dead'){
        hurtRudy(19, true, {x: e.x}); addFx('burst', r.x, r.y-168);
      }
    }
    if (e.laser) e.laser.t += dt;
    if (T > 0.82){ e.tir=false; e.laser=null; e.st='walk'; e.t=0; e.cd = 0.5+Math.random()*0.7; }
    break; }
  case 'cast': { // la reine envoie une boule rouge
    e.fr = Math.min(5, Math.floor(e.t/0.11));
    if (e.fr>=3 && !e.cast){ e.cast = true; game.balls.push({x:e.x+e.face*70, y:e.y, z:150, vx:e.face*470, t:0}); SFX.ball(); }
    if (e.t > 0.75){ e.cast=false; e.st='walk'; e.t=0; e.cd = 0.6+Math.random()*0.7; }
    break; }
  case 'walk': default: {
    e.cd -= dt;
    const busy = r.st==='grabbed' || r.st==='grabbing' || r.st==='headbutted' || r.st==='dead';
    // place visée : à côté de Rudy
    const side = Math.sign(e.x - r.x) || e.ox;
    let tx = r.x + side*(K.reach*0.75), ty = r.y;
    if (busy){ tx = r.x + side*220; }
    // ne pas tous s'empiler
    for (const o of living()) if (o!==e && Math.abs(o.x-e.x)<50 && Math.abs(o.y-e.y)<18){ ty += (e.y<o.y?-1:1)*25; }
    const mx = tx - e.x, my = ty - e.y;
    let moved = false;
    const spd = K.spd*60;
    if (Math.abs(mx) > 8){ e.x += Math.sign(mx)*Math.min(Math.abs(mx), spd*dt); moved = true; }
    if (Math.abs(my) > 4){ e.y += Math.sign(my)*Math.min(Math.abs(my), spd*0.55*dt); moved = true; }
    e.y = Math.max(m.yMin, Math.min(m.yMax, e.y));
    e.face = Math.sign(dx)||e.face;
    if (k==='t') e.fr = Math.floor(e.t/0.13)%6;
    else e.fr = moved ? Math.floor(e.t/0.09)%6 : 0;
    if (!moved && k!=='t' && !K.fly) e.fr = 0;
    if (busy) break;
    // la reine se téléporte (nuée de chauves-souris) pour réapparaître près de Rudy
    if (K.boss){ e.teleCd = (e.teleCd==null ? 5 : e.teleCd) - dt;
      if (e.teleCd<=0 && (adx > 250 || Math.random()<0.012)){ e.st='tele'; e.t=0; e.teleArrive=false; preparerChauves(e, true); SFX.tele && SFX.tele(); break; } }
    // la reine tire de loin
    if (K.boss && e.cd<=0 && adx > 170 && Math.abs(dy) < 40 && Math.random()<0.08){
      if (Math.random() < 0.5){ e.st='laser'; e.t=0; e.tir=false; e.laser=null; SFX.chargeR(); }
      else { e.st='cast'; e.t=0; e.cast=false; }
      break; }
    if (e.cd<=0 && adx < K.reach+15 && Math.abs(dy) < 20 && r.st!=='down' && r.inv<=0){
      const grabChance = K.boss ? 0.4 : (k==='t' ? 0.38 : 0.32);
      if (game.grabCD<=0 && Math.random() < grabChance && !game.ents.some(o=>o.st==='grab')){ enemyGrab(e); break; }
      if (k==='t'){ e.st='headbutt'; e.t=0; e.hbHit=false; break; }
      e.st='attack'; e.t=0; e.lastHitF=-1; SFX.whoosh();
    }
    if (K.boss && e.cd<=-1.0 && Math.random()<0.05){ if (Math.random()<0.5){ e.st='laser'; e.t=0; e.tir=false; e.laser=null; SFX.chargeR(); } else { e.st='cast'; e.t=0; e.cast=false; } }
    break; }
  }
}

function releaseRudy(e, dead){
  const r = rudy; game.grabCD = 2;
  r.hidden = false; r.grabber = null;
  const side = Math.sign(r.x - e.x) || 1;
  r.x = e.pairX + side*40; e.x = e.pairX - side*50; r.y = e.pairY; e.y = e.pairY; clampR();
  r.face = -side;
  if (dead){ killRudy('g_'+e.kind); }      // l'ennemie l'a attrapé et a pompé toute sa vie
  else {
    // Rudy se libère : l'ennemi recule
    e.st='hurt'; e.t=0; e.cd = 1.5; e.hpShow = 1;
    setR('down'); r.t = 1.3; r.kb = 0; r.inv = 1.2; SFX.hit();
  }
  e.st = dead ? 'walk' : 'hurt';
}
function hurtRudy(dmg, heavy, src){
  const r = rudy;
  if (r.inv>0 || r.st==='down' || r.st==='grabbed' || r.st==='grabbing' || r.st==='dead' || r.st==='headbutted') return;
  r.hp -= dmg; SFX.hit(); game.shake = 0.1; r.en = Math.min(100, r.en + 5);
  addFx('spark', r.x, r.y-170);
  r.face = src ? (Math.sign(src.x-r.x)||r.face) : r.face;
  r.kb = r.face; // recule
  if (r.hp <= 0){ r.hp = 0; killRudy('coups_'+((src&&src.kind)||'boule')); return; }
  if (heavy){ setR('down'); r.kb = r.face*1; }
  else setR('hurt');
}
function killRudy(prise){
  pvMort();
  setR('dead'); rudy.hidden = false; SFX.ko();
  setTimeout(()=>{ game.state = 'over';
    // dans l'appli (Rembourg) : on prévient Rembourg de qui a mis Rudy K.O. (sa vidéo, puis l'hôpital)
    try{ if (window.parent && window.parent !== window) window.parent.postMessage({type:'chateau:ko', prise: prise||''}, '*'); }catch(e){}
  }, 1500);
}
function bossDefeated(){
  pvGagne();
  SFX.win();
  setTimeout(()=>{ game.state = 'win';
    // dans l'appli (Rembourg) : la Reine est vaincue → la vidéo de la victoire
    try{ if (window.parent && window.parent !== window) window.parent.postMessage({type:'chateau:victoire'}, '*'); }catch(e){}
  }, 1200);
}
function nextMap(){
  if (game.fadeDir) return;
  game.fadeDir = 1;
  const hp = Math.min(RUDY_MAX, rudy.hp + 30);
  game.onFade = ()=>{ game.onFade = null; startMap(game.map+1, hp); };
}

// ---------- BOULE ROUGE ----------
function updateBalls(dt){
  for (const b of game.balls){
    b.t += dt; b.x += b.vx*dt;
    if (b.yellow){ // boule d'énergie de Rudy : traverse et touche tous les ennemis sur la ligne
      for (const e of living()){
        if (b.hitList.includes(e) || e.st==='down' || e.st==='intro' || e.st==='grab' || e.st==='grabbedByR' || e.st==='tele') continue;
        if (Math.abs(e.x-b.x) < 50 && Math.abs(e.y-b.y) < 32){ b.hitList.push(e); e.hp -= 60*PVX; e.hpShow = 2.2; addFx('burstY', e.x, e.y-120); SFX.big(); game.shake = 0.15; if (e.hp<=0){ e.hp=0; knockDown(e,true); } else knockDown(e,false); }
      }
      continue;
    }
    const r = rudy;
    if (!b.done && Math.abs(b.x - r.x) < 40 && Math.abs(b.y - r.y) < 26 && !r.hidden){
      if (r.inv<=0 && r.st!=='down' && r.st!=='dead'){ b.done = true; SFX.big(); hurtRudy(24, true, {x:b.x-b.vx}); addFx('burst', b.x, b.y-b.z); }
    }
  }
  game.balls = game.balls.filter(b=>!b.done && b.x > game.cam-250 && b.x < game.cam+W+250);
}

// ---------- EFFETS ----------
// ---------- la nuée de chauves-souris de la reine ----------
function preparerChauves(e, depart){
  const b = []; const N = 46;
  for (let i=0;i<N;i++){
    const px = e.x + (Math.random()-0.5)*90, py = e.y - 15 - Math.random()*195;          // un point du corps
    const a = -Math.PI/2 + (Math.random()-0.5)*2.6, v = 160 + Math.random()*260;          // vers le haut et les côtés
    b.push({px, py, dx: Math.cos(a)*v, dy: Math.sin(a)*v - 40, ph: Math.random()*6.3, s: 1.5+Math.random()*1.1, d: Math.random()*0.18});
  }
  b.x0 = e.x; b.y0 = e.y - 110;
  if (depart) e.bats = b; else e.batsIn = b;
}
function dessinerChauve(x, y, s, ph, a){
  const bat = Math.sin(ph);                       // battement des ailes
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
  ctx.fillStyle = '#16080f'; ctx.strokeStyle = 'rgba(150,20,45,0.6)'; ctx.lineWidth = 0.9 / s + 0.3;
  ctx.shadowColor = 'rgba(200,20,50,0.35)'; ctx.shadowBlur = 3;
  ctx.beginPath();
  ctx.moveTo(0, -3);
  ctx.quadraticCurveTo(-7, -6 - bat*7, -16, -2 - bat*10);
  ctx.quadraticCurveTo(-12, 1, -10, 4); ctx.quadraticCurveTo(-6, 2, -4, 5);
  ctx.quadraticCurveTo(-2, 3, 0, 6);
  ctx.quadraticCurveTo(2, 3, 4, 5); ctx.quadraticCurveTo(6, 2, 10, 4);
  ctx.quadraticCurveTo(12, 1, 16, -2 - bat*10);
  ctx.quadraticCurveTo(7, -6 - bat*7, 0, -3);
  ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.ellipse(0, 0, 3.2, 4.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-2.5,-3); ctx.lineTo(-1.5,-7); ctx.lineTo(-0.5,-3.5); ctx.moveTo(2.5,-3); ctx.lineTo(1.5,-7); ctx.lineTo(0.5,-3.5); ctx.fill();
  ctx.fillStyle = '#ff2a3a'; ctx.fillRect(-1.8,-1.5,1.2,1.2); ctx.fillRect(0.6,-1.5,1.2,1.2);
  ctx.restore();
}
function brumeVampire(x, y, a, rad){
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, 4, x, y, rad);
  g.addColorStop(0, 'rgba(120,10,40,0.75)'); g.addColorStop(0.5, 'rgba(50,5,30,0.45)'); g.addColorStop(1, 'rgba(20,0,20,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, rad*0.8, rad, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
}
function dessinerNuee(e){
  const T = e.t;
  if (e.bats && T < 0.7) brumeVampire(e.bats.x0, e.bats.y0, (1 - T/0.7)*0.9, 90 + T*120);
  if (T >= 1.0 && T < 1.6) brumeVampire(e.x, e.y - 110, T < 1.3 ? (T-1.0)/0.3*0.85 : (1.6-T)/0.3*0.85, 150 - (T-1.0)*80);
  if (e.bats && T < 0.95){                                    // départ : elles s'envolent du corps et se dispersent
    for (const c of e.bats){
      const u = Math.max(0, T - c.d); if (u <= 0) continue;
      const x = c.px + c.dx*u, y = c.py + c.dy*u - 30*u*u;
      dessinerChauve(x, y, c.s, c.ph + T*38, Math.max(0, 1 - Math.max(0, u-0.45)/0.4));
    }
  }
  if (e.batsIn && T >= 0.95){                                 // arrivée : elles arrivent de partout et se rassemblent
    for (const c of e.batsIn){
      const u = Math.min(1, Math.max(0, (T - 0.95 - c.d*0.5) / 0.5)), k = 1 - Math.pow(1-u, 3);
      const fx = c.px + c.dx*0.75, fy = c.py + c.dy*0.75 - 30;   // loin au-dessus, puis jusqu'au corps
      const x = fx + (c.px-fx)*k, y = fy + (c.py-fy)*k;
      const al = T < 1.38 ? Math.min(1, (T-0.95)/0.12) : Math.max(0, 1 - (T-1.38)/0.18);
      dessinerChauve(x, y, c.s, c.ph + T*38, al);
    }
  }
}
// le laser rouge de la reine : charge dans la main, puis rayon rapide qui traverse l'écran
function dessinerLaserReine(e){
  const T = e.t, hx = e.x + e.face*86, hy = e.y - 168;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (T < 0.12){ ctx.restore(); return; }
  if (T < 0.36){                                            // la lumière rouge se concentre dans sa main
    const u = (T-0.12)/0.24, rad = 6 + u*18;
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, rad*2);
    g.addColorStop(0, 'rgba(255,240,240,0.95)'); g.addColorStop(0.35, 'rgba(255,40,60,0.85)'); g.addColorStop(1, 'rgba(160,0,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, rad*2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,60,80,0.7)'; ctx.lineWidth = 2;
    for (let i=0;i<6;i++){ const a = i*1.05 + T*14, d0 = 40*(1-u) + rad; ctx.beginPath(); ctx.moveTo(hx + Math.cos(a)*d0, hy + Math.sin(a)*d0); ctx.lineTo(hx + Math.cos(a)*(d0+12), hy + Math.sin(a)*(d0+12)); ctx.stroke(); }
  } else if (e.laser){                                      // le rayon
    const L = e.laser, u = Math.min(1, L.t/0.05), fin = Math.max(0, 1 - Math.max(0, L.t-0.18)/0.28);
    const x1 = hx + e.face*W*1.6*u, ep = (16 + Math.sin(L.t*80)*3)*fin;
    if (ep > 0.5){
      const g = ctx.createLinearGradient(0, hy - ep, 0, hy + ep);
      g.addColorStop(0, 'rgba(255,0,30,0)'); g.addColorStop(0.3, 'rgba(255,30,50,0.75)'); g.addColorStop(0.5, 'rgba(255,235,235,1)'); g.addColorStop(0.7, 'rgba(255,30,50,0.75)'); g.addColorStop(1, 'rgba(255,0,30,0)');
      ctx.fillStyle = g; ctx.fillRect(Math.min(hx, x1), hy - ep, Math.abs(x1 - hx), ep*2);
      const gm = ctx.createRadialGradient(hx, hy, 0, hx, hy, 34*fin + 6);
      gm.addColorStop(0, 'rgba(255,255,255,1)'); gm.addColorStop(0.4, 'rgba(255,40,60,0.9)'); gm.addColorStop(1, 'rgba(200,0,20,0)');
      ctx.fillStyle = gm; ctx.beginPath(); ctx.arc(hx, hy, 34*fin + 6, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}
function alphaTele(e){ const T = e.t; if (T < 0.35) return 1 - T/0.35; if (T < 1.3) return 0; return Math.min(1, (T-1.3)/0.25); }

function addFx(type, x, y){ game.fx.push({type, x, y, t:0, life: type==='drain'?0.6:(type==='heal'?1.0:(type==='burstY'?0.4:0.3))}); }

// ================== DESSIN ==================
function drawWorld(){
  const m = MAPS[game.map], bg = ASSETS[m.bg];
  const sh = game.shake>0 ? (Math.random()-0.5)*8 : 0;
  ctx.save(); ctx.translate(-Math.round(game.cam)+sh, sh*0.5);
  ctx.drawImage(IMG[m.bg], 0, 0, bg.w/bg.h*H, H);

  // ordre d'affichage par profondeur
  const list = [];
  for (const e of game.ents) list.push(e);
  list.push(rudy);
  const sy = e=>(!e.isRudy && !e.crate && !e.chicken && (e.st==='grab'||e.st==='grabbedByR')) ? e.pairY+1 : e.y;
  list.sort((a,b)=>sy(a)-sy(b));
  // ombres
  for (const e of list){
    if (e.isRudy && rudy.hidden) continue;
    if (!e.isRudy && e.dead) continue;
    if (e.crate || e.chicken) continue;
    if (!e.isRudy && e.st==='tele' && alphaTele(e) < 0.5) continue;
    const big = e.isRudy || ['t','k','g'].includes(e.kind);
    const small = !e.isRudy && (e.kind==='b'||e.kind==='f');
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(e.x, e.y+2, small?28:(big?46:40), small?7:10, 0, 0, Math.PI*2); ctx.fill();
  }
  for (const c of game.crates) list.push({crate:c, y:c.y, x:c.x});
  for (const c of game.chickens) list.push({chicken:c, y:c.y, x:c.x});
  list.sort((a,b)=>sy(a)-sy(b));
  for (const e of list){ if (e.crate) drawCrate(e.crate); else if (e.chicken) drawChicken(e.chicken); else if (e.isRudy) drawRudy(); else drawEnemy(e); }
  // boules
  for (const b of game.balls){
    const x = b.x, y = b.y - b.z;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x, b.y+2, 22, 6, 0, 0, Math.PI*2); ctx.fill();
    const Y = b.yellow, rad = Y ? 38 : 30;
    for (let i=5;i>=1;i--){ ctx.fillStyle = Y ? `rgba(255,220,40,${0.09*i})` : `rgba(255,30,40,${0.08*i})`; ctx.beginPath(); ctx.arc(x - Math.sign(b.vx)*i*16, y, rad-6-i*2, 0, Math.PI*2); ctx.fill(); }
    const g = ctx.createRadialGradient(x, y, 2, x, y, rad);
    if (Y){ g.addColorStop(0,'#fff'); g.addColorStop(0.3,'#fff27a'); g.addColorStop(0.65,'rgba(255,200,0,0.85)'); g.addColorStop(1,'rgba(255,160,0,0)'); }
    else { g.addColorStop(0,'#fff'); g.addColorStop(0.25,'#ff6a6a'); g.addColorStop(0.6,'rgba(220,0,20,0.85)'); g.addColorStop(1,'rgba(160,0,0,0)'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad + Math.sin(b.t*30)*3, 0, Math.PI*2); ctx.fill();
    if (Y){ ctx.strokeStyle = 'rgba(255,255,200,0.8)'; ctx.lineWidth = 2; for (let i=0;i<4;i++){ const a = b.t*12 + i*Math.PI/2; ctx.beginPath(); ctx.arc(x, y, rad*0.75, a, a+0.8); ctx.stroke(); } }
  }
  // effets
  for (const f of game.fx){
    const p = f.t/f.life;
    if (f.type==='spark' || f.type==='burst'){
      ctx.save(); ctx.translate(f.x, f.y); ctx.globalAlpha = 1-p;
      ctx.strokeStyle = f.type==='burst' ? '#ff4040' : '#fff3b0'; ctx.lineWidth = 4;
      for (let i=0;i<8;i++){ const a = i*Math.PI/4 + 0.3; const r0 = 8+p*10, r1 = 22+p*30; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r0, Math.sin(a)*r0); ctx.lineTo(Math.cos(a)*r1, Math.sin(a)*r1); ctx.stroke(); }
      ctx.restore();
    } else if (f.type==='burstY'){
      ctx.save(); ctx.translate(f.x, f.y); ctx.globalAlpha = 1-p;
      const g = ctx.createRadialGradient(0,0,2,0,0,60+p*40); g.addColorStop(0,'rgba(255,255,220,0.9)'); g.addColorStop(0.5,'rgba(255,210,0,0.6)'); g.addColorStop(1,'rgba(255,160,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,60+p*40,0,Math.PI*2); ctx.fill(); ctx.restore();
    } else if (f.type==='plank'){
      const px = f.x + f.vx*f.t, py = f.y + f.vy*f.t + 500*f.t*f.t;
      ctx.save(); ctx.globalAlpha = 1-p; ctx.translate(px, py); ctx.rotate(f.rot + f.t*8);
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-14,-4,28,8); ctx.strokeStyle = '#4a2c10'; ctx.lineWidth = 1.5; ctx.strokeRect(-14,-4,28,8); ctx.restore();
    } else if (f.type==='heal'){
      ctx.save(); ctx.globalAlpha = 1-p; ctx.font = '900 28px Arial Black,Impact,sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.strokeStyle = '#063'; ctx.strokeText('+35', f.x, f.y - p*50); ctx.fillStyle = '#7dff8a'; ctx.fillText('+35', f.x, f.y - p*50); ctx.restore();
    } else if (f.type==='drain'){
      ctx.save(); ctx.globalAlpha = 1-p; ctx.fillStyle = '#ff2a3a';
      for (let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(f.x + Math.sin(i*2.1+f.t*6)*18, f.y - p*40 - i*6, 4, 0, Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
  }
  // main GO
  if (game.goShown && !MAPS[game.map].boss){
    const ww = worldW();
    if (atExit()){
      ctx.fillStyle = 'rgba(255,215,120,0.18)'; ctx.fillRect(ww-150, MAPS[game.map].yMin-40, 150, MAPS[game.map].yMax-MAPS[game.map].yMin+60);
    }
  }
  ctx.restore();
}

function drawCrate(c){
  const sx = c.shake>0 ? Math.sin(c.shake*80)*4 : 0;
  ctx.save(); ctx.translate(c.x + sx, c.y);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, 2, 44, 10, 0, 0, Math.PI*2); ctx.fill();
  const w = 74, h = 62;
  // dessus
  ctx.fillStyle = '#b07a3e'; ctx.beginPath(); ctx.moveTo(-w/2, -h); ctx.lineTo(-w/2+12, -h-12); ctx.lineTo(w/2+12, -h-12); ctx.lineTo(w/2, -h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3d220c'; ctx.lineWidth = 2; ctx.stroke();
  // côté
  ctx.fillStyle = '#6e4520'; ctx.beginPath(); ctx.moveTo(w/2, -h); ctx.lineTo(w/2+12, -h-12); ctx.lineTo(w/2+12, -12); ctx.lineTo(w/2, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  // face
  const g = ctx.createLinearGradient(0, -h, 0, 0); g.addColorStop(0, '#9c6630'); g.addColorStop(1, '#7a4c22');
  ctx.fillStyle = g; ctx.fillRect(-w/2, -h, w, h); ctx.strokeRect(-w/2, -h, w, h);
  ctx.strokeStyle = '#4a2a0e'; ctx.lineWidth = 1.5;
  for (let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(-w/2, -h + i*h/4); ctx.lineTo(w/2, -h + i*h/4); ctx.stroke(); }
  ctx.strokeStyle = '#5a3412'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-w/2+6, -6); ctx.lineTo(w/2-6, -h+6); ctx.stroke();
  ctx.fillStyle = '#9aa0a8'; for (const [px,py] of [[-w/2,-h],[w/2-8,-h],[-w/2,-8],[w/2-8,-8]]) ctx.fillRect(px, py, 8, 8);
  if (c.hp===1){ ctx.strokeStyle = '#2a1504'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-10,-h); ctx.lineTo(-2,-h+20); ctx.lineTo(-12,-h+34); ctx.stroke(); }
  ctx.restore();
}
function drawChicken(ch){
  const bob = Math.sin(ch.t*5)*3;
  ctx.save(); ctx.translate(ch.x, ch.y);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, 2, 34, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.translate(0, -16 + bob);
  // halo
  const hg = ctx.createRadialGradient(0,-6,4,0,-6,52); hg.addColorStop(0,'rgba(255,240,170,0.45)'); hg.addColorStop(1,'rgba(255,240,170,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0,-6,52,0,Math.PI*2); ctx.fill();
  // assiette
  ctx.fillStyle = '#e8e3da'; ctx.beginPath(); ctx.ellipse(0, 10, 40, 10, 0, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#a99f90'; ctx.lineWidth = 2; ctx.stroke();
  // poulet rôti
  const g = ctx.createRadialGradient(-8,-14,4,0,-4,34); g.addColorStop(0,'#f7c46a'); g.addColorStop(0.6,'#c97a2a'); g.addColorStop(1,'#8a4a14');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -4, 30, 18, 0, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#6a3410'; ctx.stroke();
  // cuisses
  for (const s of [-1,1]){
    ctx.fillStyle = '#b8682a'; ctx.beginPath(); ctx.ellipse(s*22, -12, 11, 8, s*0.6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#f4ecdc'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(s*28, -18); ctx.lineTo(s*36, -26); ctx.stroke();
    ctx.fillStyle = '#f4ecdc'; ctx.beginPath(); ctx.arc(s*37, -27, 3.5, 0, Math.PI*2); ctx.arc(s*35, -29, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#6a3410'; ctx.lineWidth = 2;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(-8, -12, 9, 4, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawRudy(){
  const r = rudy; if (r.hidden) return;
  let k='r_punch', n=0;
  switch(r.st){
    case 'walk': k='r_run'; n=r.fr; break;
    case 'punch': case 'beam': k='r_punch'; n=r.fr; break;
    case 'kick': k='r_kick'; n=r.fr; break;
    case 'hurt': case 'down': case 'dead': k='r_fall'; n=r.fr; break;
    default: k='r_punch'; n=0;
  }
  const blink = r.inv>0 && r.st!=='down' && Math.floor(game.t*20)%2===0;
  drawFrame(k, n, r.x, r.y, r.face, blink?0.45:1);
}

function drawEnemy(e){
  const k = e.kind;
  let sheet = k+'_run', n = e.fr, x = e.x, y = e.y, face = e.face, anchor = null;
  const z = e.K.fly ? e.z + Math.sin(e.bob*3)*5 : 0;
  switch(e.st){
    case 'intro': case 'walk': sheet = k+'_run'; break;
    case 'attack': sheet = k+'_atk'; break;
    case 'hurt': case 'down': sheet = k+'_fall'; break;
    case 'cast': sheet = 'k_cast'; break;
    case 'laser': {
      drawFrame('k_cast', n, x, y, face, 1);
      e._sheet = 'k_cast'; e._n = n; e._face = face; e._x = x; e._y = y; e._ax = null;
      dessinerLaserReine(e);
      return; }
    case 'tele': {
      const al = alphaTele(e);
      if (al > 0) drawFrame(k+'_run', 0, x, y, face, al);
      dessinerNuee(e);
      return; }
    case 'headbutt': sheet = 't_atk'; anchor = e.fr>=2 ? 0.33 : null; break;
    case 'grabbedByR': case 'grab': {
      sheet = k + (e.st==='grab' ? '_eg' : '_rg');
      const s = ASSETS[sheet];
      const rSide = Math.sign(rudy.x - e.x) || 1; // côté de Rudy dans le monde
      face = (rSide === s.rs) ? s.dir : -s.dir;
      x = e.pairX; y = e.pairY;
      drawFrame(sheet, n, x, y, face, e.K.ghost?0.95:1);
      return; }
  }
  if (e.st==='walk' && k==='t'){ sheet='t_run'; }
  const yy = y - ((e.st==='down' || e.st==='hurt') && e.K.fly ? e.z : z);
  e._sheet = sheet; e._n = n; e._face = face; e._x = x; e._y = y; e._ax = anchor!=null ? anchor*ASSETS[sheet].f[Math.max(0, Math.min(n, ASSETS[sheet].f.length-1))][2] : null;
  drawFrame(sheet, n, x, yy, face, (e.dead ? Math.max(0,e.alpha) * (Math.floor(game.t*16)%2?1:0.3) : 1) * (e.K.ghost?0.93:1), anchor);
  // petite barre de vie au-dessus de la tête
  if (!e.K.boss && e.hpShow>0 && !e.dead){
    const h = ASSETS[sheet].f[0][3]/Q;
    const by = yy - Math.min(h, 230) - 14;
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(x-31, by-1, 62, 8);
    ctx.fillStyle = '#e8243a'; ctx.fillRect(x-30, by, 60*Math.max(0,e.hp)/e.K.hp, 6);
  }
}

function bar(x, y, w, h, v, col, label, right){
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x-3, y-3, w+6, h+6);
  ctx.fillStyle = '#3a0d14'; ctx.fillRect(x, y, w, h);
  const g = ctx.createLinearGradient(0, y, 0, y+h); g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
  ctx.fillStyle = g;
  const ww = w*Math.max(0,Math.min(1,v));
  ctx.fillRect(right ? x+w-ww : x, y, ww, h);
  ctx.strokeStyle = '#d9b46a'; ctx.lineWidth = 2; ctx.strokeRect(x-1, y-1, w+2, h+2);
  ctx.font = '700 15px Georgia,serif'; ctx.fillStyle = '#f6e3b4'; ctx.textAlign = right ? 'right' : 'left';
  ctx.fillText(label, right ? x+w : x, y-8);
}

function drawHUD(){
  const m = MAPS[game.map];
  bar(20, 34, 280, 18, rudy.hp/RUDY_MAX, ['#7dff8a','#1f9a33'], PVX>1?'RUDY \u00d72':'RUDY', false);
  const full = rudy.en >= 100, fl = full && Math.floor(game.t*6)%2;
  bar(20, 66, 200, 10, rudy.en/100, fl ? ['#ffffff','#ffe14a'] : ['#fff27a','#e0a800'], '', false);
  ctx.font = '700 13px Georgia,serif'; ctx.textAlign = 'left'; ctx.fillStyle = full ? '#ffe14a' : '#e9d9a8';
  ctx.fillText(full ? 'ÉNERGIE PRÊTE !' : 'ÉNERGIE', 228, 76);
  if (m.boss && game.boss){
    bar(W-320, 34, 300, 18, game.boss.hp/game.boss.K.hp, ['#ff5a6a','#9a0f20'], 'LA REINE VAMPIRE', true);
  } else {
    ctx.font = '700 18px Georgia,serif'; ctx.textAlign = 'right'; ctx.fillStyle = '#f6e3b4';
    ctx.fillText('Ennemis battus : ' + Math.min(game.kills, KILLS_TO_GO) + ' / ' + KILLS_TO_GO, W-20, 50);
  }
  // main GO
  if (game.goShown && !m.boss && !atExit()){
    const p = (Math.sin(game.t*7)+1)/2;
    ctx.save(); ctx.translate(W-120 + p*18, 170);
    ctx.font = '62px serif'; ctx.textAlign = 'center'; ctx.fillText('👉', 0, 0);
    ctx.font = '900 46px Impact,Arial Black,sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = '#300'; ctx.strokeText('GO', -6, 52); ctx.fillStyle = '#ffd34a'; ctx.fillText('GO', -6, 52);
    ctx.restore();
  }
  // attrapé : appuyer plusieurs fois
  if (rudy.st==='grabbed'){
    const p = Math.floor(game.t*8)%2;
    ctx.font = '900 30px Impact,Arial Black,sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText('APPUIE VITE POUR T\'ÉCHAPPER !', W/2, 130);
    ctx.fillStyle = p ? '#ff4b5c' : '#fff'; ctx.fillText('APPUIE VITE POUR T\'ÉCHAPPER !', W/2, 130);
    bar(W/2-120, 150, 240, 12, rudy.mash/rudy.need, ['#fff1a0','#e0a020'], '', false);
  }
  // titre de la salle
  if (game.banner > 0){
    const a = Math.min(1, game.banner, (2.6-game.banner)*3);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10,0,8,0.6)'; ctx.fillRect(0, 210, W, 70);
    ctx.font = '700 32px Georgia,serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#f2d391';
    ctx.fillText(m.name, W/2, 256);
    ctx.restore();
  }
  drawControls();
}

function drawControls(){
  // joystick
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(20,10,25,0.5)'; ctx.strokeStyle = '#d9b46a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(STICK.cx, STICK.cy, STICK.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#d9b46a'; ctx.beginPath(); ctx.arc(STICK.cx+STICK.dx, STICK.cy+STICK.dy, 30, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.75;
  for (const k in BTN){
    const b = BTN[k];
    let label = b.label;
    const exit = k==='punch' && atExit();
    if (exit) label = 'ENTRER';
    if (k==='energy'){
      const full = rudy && rudy.en >= 100;
      ctx.fillStyle = full ? (Math.floor(game.t*5)%2 ? '#e8b800' : '#a87800') : 'rgba(50,40,10,0.7)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#d9b46a'; ctx.stroke();
      if (!full){ ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(b.x, b.y, b.r-4, -Math.PI/2, -Math.PI/2 + Math.PI*2*(rudy?rudy.en/100:0)); ctx.stroke(); ctx.lineWidth = 3; }
      ctx.fillStyle = '#fbe9bf'; ctx.font = '800 12px Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, b.x, b.y);
      continue;
    }
    ctx.fillStyle = exit ? (Math.floor(game.t*4)%2 ? '#d48a00' : '#8a4e00') : (b.down ? '#7a1020' : 'rgba(60,10,20,0.8)');
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#d9b46a'; ctx.stroke();
    ctx.fillStyle = '#fbe9bf'; ctx.font = `800 ${label.length>6?13:16}px Arial,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, b.x, b.y);
  }
  ctx.restore(); ctx.textBaseline = 'alphabetic';
}

function drawTitle(){
  const bg = ASSETS.bg3;
  ctx.drawImage(IMG.bg3, -((bg.w/bg.h*H)-W)/2, 0, bg.w/bg.h*H, H);
  ctx.fillStyle = 'rgba(5,0,10,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.font = '900 76px Georgia,serif'; ctx.lineWidth = 8; ctx.strokeStyle = '#1a0006';
  ctx.strokeText('NUIT AU CHÂTEAU', W/2, 170);
  const g = ctx.createLinearGradient(0,110,0,180); g.addColorStop(0,'#ffe6a0'); g.addColorStop(1,'#c2232f');
  ctx.fillStyle = g; ctx.fillText('NUIT AU CHÂTEAU', W/2, 170);
  ctx.font = 'italic 24px Georgia,serif'; ctx.fillStyle = '#f2d9a8';
  ctx.fillText('Rudy contre les créatures de la Reine Vampire', W/2, 215);
  drawFrame('r_punch', 0, W/2-150, 470, 1, 1);
  drawFrame('k_run', 0, W/2+150, 470, -1, 1);
  if (loaded < total){ ctx.font = '22px Georgia,serif'; ctx.fillStyle='#fff'; ctx.fillText('Chargement… ' + Math.round(loaded/total*100) + ' %', W/2, 300); }
  else if (Math.floor(game.t*2)%2===0){ ctx.font = '700 28px Georgia,serif'; ctx.fillStyle = '#fff'; ctx.fillText('Touche l\'écran pour commencer', W/2, 300); }
  ctx.font = '15px Arial,sans-serif'; ctx.fillStyle = '#cdb98f';
  ctx.fillText('Clavier : flèches = bouger · J = poing · K = pied · L = attraper · I = énergie', W/2, 525);
}
function drawEnd(win){
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.font = '900 70px Georgia,serif'; ctx.lineWidth = 8; ctx.strokeStyle = '#000';
  const t = win ? 'VICTOIRE !' : 'GAME OVER';
  ctx.strokeText(t, W/2, 220); ctx.fillStyle = win ? '#ffd34a' : '#ff3b4b'; ctx.fillText(t, W/2, 220);
  ctx.font = '24px Georgia,serif'; ctx.fillStyle = '#f2e2bd';
  if (win) ctx.fillText('La Reine Vampire est vaincue. Le château est libéré !', W/2, 270);
  // boutons
  drawBtn(W/2-130, 330, 'REJOUER');
  if (!win) drawBtn(W/2+130, 330, 'RÉESSAYER LA SALLE');
}
function drawBtn(x, y, label){
  ctx.fillStyle = '#5a0d18'; ctx.strokeStyle = '#d9b46a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x-115, y-30, 230, 60, 14) : ctx.rect(x-115, y-30, 230, 60); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fbe9bf'; ctx.font = '800 17px Arial,sans-serif'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y); ctx.textBaseline = 'alphabetic';
}
function tapScreen(p){
  if (game.state==='title'){ if (loaded>=total) startMap(0); return; }
  if (game.state==='over' || game.state==='win'){
    if (Math.abs(p.y-330) < 40){
      if (p.x < W/2) startMap(0);
      else if (game.state==='over') startMap(game.map);
    }
  }
}
addEventListener('keydown', e=>{
  if (game.state==='title' && (e.code==='Enter'||e.code==='Space') && loaded>=total) startMap(0);
  else if ((game.state==='over'||game.state==='win') && e.code==='Enter') startMap(game.state==='over'?game.map:0);
});

// ================== BOUCLE ==================
let last = performance.now();
const DIRECT = /[?&]direct=1/.test(location.search);
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  // lancé depuis la porte de Rembourg (après la vidéo) : pas d'écran titre, le combat commence tout de suite
  if (game.state==='title' && DIRECT && loaded>=total){ audio(); startMap(0); }
  if (game.state==='title'){ game.t += dt; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); if (loaded>=total) drawTitle(); else { ctx.font='22px Georgia,serif'; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText('Chargement… '+Math.round(loaded/total*100)+' %', W/2, H/2); } }
  else {
    update(dt);
    drawWorld(); drawHUD();
    if (game.state==='over') drawEnd(false);
    if (game.state==='win') drawEnd(true);
  }
  if (game.fade>0){ ctx.fillStyle = `rgba(0,0,0,${game.fade})`; ctx.fillRect(0,0,W,H); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
