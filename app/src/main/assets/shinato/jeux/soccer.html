<style>
:root{
  --night:#0a1433; --ink:#040817; --blue:#2fb8ff; --red:#ff3b5c; --gold:#ffc629; --white:#f4f7ff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#0a1433;}}
:root[data-theme="dark"]{--night:#0a1433;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;margin:0;background:#0b1433;overflow:hidden;color:var(--white);font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif}
#fg{position:fixed;left:0;right:0;bottom:0;width:100%;height:48px;pointer-events:none;display:none}
body{background:#0b1433}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;display:none}
.card{width:min(34vw,300px)}
.card.r{text-align:right}
.nm{font-family:'Bangers',Impact,sans-serif;font-size:clamp(17px,3.2vw,26px);letter-spacing:1px;line-height:1;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.6)}
.l .nm{color:#bfe9ff}.r .nm{color:#ffd0da}
.bar{height:11px;margin-top:4px;background:rgba(4,8,23,.75);border:2px solid rgba(255,255,255,.85);border-radius:3px;overflow:hidden;transform:skewX(-18deg)}
.bar i{display:block;height:100%;width:0%;transition:width .15s linear}
.l .bar i{background:linear-gradient(90deg,#0f6fb0,var(--blue))}
.r .bar i{background:linear-gradient(270deg,#a0122c,var(--red));margin-left:auto}
.bar.full{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
.bar.full i{background:linear-gradient(90deg,#ff8a00,var(--gold),#fff6c0)!important;animation:pulse .5s infinite alternate}
@keyframes pulse{to{filter:brightness(1.5)}}
.gkb{margin-top:5px;font-size:clamp(11px,1.9vw,14px);font-weight:600;opacity:.92;text-shadow:0 1px 0 #000}
.gkb .fb{height:5px;width:62%;background:rgba(4,8,23,.75);border:1px solid rgba(255,255,255,.6);margin-top:2px;display:inline-block}
.r .gkb .fb{}
.gkb .fb i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7cff6b,#ffd23a,#ff4d2d)}
.score{display:flex;align-items:center;gap:10px;background:rgba(4,8,23,.78);border:2px solid rgba(255,255,255,.8);padding:3px 12px;border-radius:6px;transform:skewX(-10deg)}
.score b{font-family:'Bangers',Impact,sans-serif;font-size:clamp(24px,4.2vw,36px);font-weight:400;line-height:1}
.score .s0{color:var(--blue)}.score .s1{color:var(--red)}
.clock{font-weight:800;font-size:clamp(15px,2.6vw,20px);min-width:3.2em;text-align:center}
/* banners */
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:'Bangers',Impact,sans-serif;font-size:clamp(46px,11vw,110px);letter-spacing:3px;color:var(--gold);-webkit-text-stroke:3px #1a0600;text-shadow:0 6px 0 #6b1500,0 0 30px rgba(255,160,0,.8);opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s}
#banner.on{opacity:1;transform:scale(1)}
#banner small{display:block;font-size:.34em;letter-spacing:1px;-webkit-text-stroke:1.5px #1a0600;color:#fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);padding:6px 16px;border-radius:4px;font-family:'Bangers',Impact,sans-serif;font-size:clamp(16px,3vw,24px);letter-spacing:1px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;text-shadow:0 2px 0 #000}
#toast.on{opacity:1}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
/* controls */
#controls{position:fixed;inset:0;display:none}
#joyZone{position:absolute;left:0;bottom:0;width:48%;height:70%}
#joy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,rgba(47,184,255,.12),rgba(4,8,23,.55));border:2px solid rgba(255,255,255,.55);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9fdcff 45%,#1b78c2);box-shadow:0 3px 10px rgba(0,0,0,.6)}
.btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bangers',Impact,sans-serif;letter-spacing:1px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.7);border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 -6px 12px rgba(0,0,0,.35);touch-action:none}
.btn.down{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#bShoot{right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:96px;height:96px;font-size:26px;background:radial-gradient(circle at 40% 30%,#ff7a8e,#d4173a 60%,#7d0a1f)}
#bShoot.sp{background:radial-gradient(circle at 40% 30%,#fff3b0,#ffb300 55%,#b35a00);border-color:#fff;box-shadow:0 0 22px var(--gold),0 4px 0 rgba(0,0,0,.45);font-size:20px;animation:pulse .45s infinite alternate}
#bPass{right:calc(env(safe-area-inset-right,0px) + 132px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:74px;height:74px;font-size:20px;background:radial-gradient(circle at 40% 30%,#7fd6ff,#1c8ad0 60%,#0b3d66)}
#bDodge{right:calc(env(safe-area-inset-right,0px) + 40px);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);width:70px;height:70px;font-size:17px;background:radial-gradient(circle at 40% 30%,#b6ff9b,#34a52a 60%,#135010)}
#bTackle{right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:104px;height:104px;font-size:26px;background:radial-gradient(circle at 40% 30%,#ffc57a,#e46a00 60%,#7a3200);display:none}
/* title */
#title{position:fixed;inset:0;background:#02040d;display:flex;align-items:center;justify-content:center}
#tw{position:relative;width:min(100vw,calc(100vh * 1672 / 940));aspect-ratio:1672/940}
#tw img{width:100%;height:100%;display:block}
#play{position:absolute;left:33%;top:78.5%;width:32%;height:14%;border:none;background:transparent;border-radius:14px;cursor:pointer;animation:glow 1.1s infinite alternate}
#play:focus-visible{outline:3px solid var(--gold)}
@keyframes glow{from{box-shadow:0 0 0 rgba(255,198,41,0)}to{box-shadow:0 0 34px 6px rgba(255,198,41,.55)}}
#loading{position:absolute;left:0;right:0;top:94%;text-align:center;font-weight:600;font-size:14px;opacity:.8}
/* menu */
#menu{position:fixed;inset:0;background:#02040d;display:none;align-items:center;justify-content:center;z-index:5}
#mw{position:relative;width:min(100vw,calc(100vh * 1774 / 887));aspect-ratio:1774/887}
#mw img{width:100%;height:100%;display:block}
.hot{position:absolute;border:none;background:transparent;border-radius:16px;cursor:pointer}
.hot:focus-visible{outline:3px solid var(--gold)}
#camSub{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,6,20,.45)}
.cpanel{display:flex;flex-direction:column;gap:9px;align-items:stretch;padding:12px 18px 14px;border-radius:16px;background:rgba(8,14,44,.9);border:2px solid var(--gold);min-width:min(40vw,300px)}
.ctitle{font-family:'Bangers',Impact,sans-serif;font-size:clamp(24px,4vw,34px);text-align:center;color:var(--gold);letter-spacing:1px}
.cbtn{font-family:'Bangers',Impact,sans-serif;font-size:clamp(20px,3.4vw,28px);letter-spacing:1px;padding:6px 14px;border-radius:999px;border:3px solid #fff3c0;color:#2a1300;background:linear-gradient(#ffe066,#e79a00);cursor:pointer}
.cback{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:17px;padding:4px;border:none;background:transparent;color:#cfe0ff;cursor:pointer;text-decoration:underline}
.cbtn:focus-visible,.cback:focus-visible{outline:3px solid #fff;outline-offset:2px}
.endb{display:flex;gap:14px}
#toMenu{margin-top:10px;font-family:'Bangers',Impact,sans-serif;font-size:30px;letter-spacing:2px;padding:10px 28px;border-radius:10px;border:3px solid #fff;color:#fff;background:linear-gradient(#6a3cff,#3a178f);cursor:pointer}
/* duel */
#duel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,6,20,.55);z-index:20}
.dbox{text-align:center;padding:10px 18px 12px;border-radius:14px;background:rgba(6,12,40,.88);border:2px solid var(--gold);box-shadow:0 0 30px rgba(255,198,41,.35);max-width:92vw}
#duelTitle{font-family:'Bangers',Impact,sans-serif;font-size:clamp(24px,4.5vw,40px);letter-spacing:1px;color:var(--gold)}
#duelSub{font-size:clamp(13px,2.2vw,17px);font-weight:600;opacity:.9;margin:2px 0 6px}
.dbar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin:0 auto 6px;width:70%}.dbar i{display:block;height:100%;background:var(--gold)}
.cross{display:grid;grid-template-columns:repeat(3,clamp(52px,10vw,74px));grid-template-rows:repeat(3,clamp(44px,8.5vh,64px));gap:6px;justify-content:center;grid-template-areas:". u ." "l . r" ". d ."}
#d_up{grid-area:u}#d_left{grid-area:l}#d_right{grid-area:r}#d_down{grid-area:d}
.dbtn{font-size:clamp(26px,5vw,40px);font-weight:800;color:#fff;background:linear-gradient(#2b4ea8,#16296a);border:3px solid rgba(255,255,255,.8);border-radius:12px;cursor:pointer;touch-action:none}
.dbtn:focus-visible{outline:3px solid var(--gold)}
.dbtn.mine{background:linear-gradient(#ffd23a,#e08a00);color:#2a1300}
.dbtn.cpu{box-shadow:0 0 0 4px var(--red),0 0 18px var(--red)}
#duelMsg{min-height:1.3em;margin-top:6px;font-family:'Bangers',Impact,sans-serif;font-size:clamp(18px,3.4vw,28px);letter-spacing:1px}

#end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(3,6,20,.82);gap:10px}
#end h2{margin:0;font-family:'Bangers',Impact,sans-serif;font-weight:400;font-size:clamp(44px,9vw,90px);letter-spacing:3px;color:var(--gold);-webkit-text-stroke:2px #1a0600}
#end .fs{font-family:'Bangers',Impact,sans-serif;font-size:clamp(36px,7vw,64px)}
#end .fs .a{color:var(--blue)}#end .fs .b{color:var(--red)}
#end p{margin:0;font-size:20px;font-weight:600}
#again{margin-top:10px;font-family:'Bangers',Impact,sans-serif;font-size:30px;letter-spacing:2px;padding:10px 34px;border-radius:10px;border:3px solid #fff;color:#fff;background:linear-gradient(#ff5a2a,#c2121f);cursor:pointer}
#again:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#02040d;z-index:50;text-align:center;padding:24px;font-size:22px;font-weight:600;gap:14px}
#rotate .ph{width:54px;height:90px;border:4px solid var(--gold);border-radius:10px;animation:rot 1.6s infinite ease-in-out}
@keyframes rot{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){#play,#bShoot.sp,.bar.full i,#rotate .ph{animation:none}}

    const order=slots.map((_,i)=>i); for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }

/* ---------- actions ---------- */
function shoot(p,special,aim){

  const dist=Math.hypot(gx-ball.pos.x,az-ball.pos.z);

function pass(p,q){

  ball.shot=null; ball.passTo=q; ball.passer=p; ball.lastTeam=p.team; ball.last=p; ball.special=false;
  p.pickCd=.35; if(Math.abs(n.x)>.2)p.face={x:Math.sign(n.x),z:0}; setState(p,'kick',.25); p.kickType='pass'; addGauge(p,7);

function segDist(o,a,b){ const vx=b.x-a.x,vz=b.z-a.z,l=vx*vx+vz*vz||1; const t=clamp(((o.x-a.x)*vx+(o.z-a.z)*vz)/l,0,1); return Math.hypot(o.x-(a.x+vx*t),o.z-(a.z+vz*t)); }

function dodge(p){ if(p.dodgeCd>0||p.st!=='normal')return; const sp=Math.hypot(p.vel.x,p.vel.z); p.dodgeDir=sp>.5?norm(p.vel.x,p.vel.z):{x:p.face.x,z:p.face.z}; setState(p,'dodge',.5); p.dodgeCd=1.1; p.dodged=false; tone(520,.18,'triangle',.08,1.8); }

/* ---------- IA ---------- */
function homeOf(p){
  const s=p.team===0?1:-1; const has=ball.owner?ball.owner.team===p.team:ball.lastTeam===p.team;
  let x=p.bx+clamp(ball.pos.x*.55,-15,15)+s*(has?7:-2); x=clamp(x,-HL+3,HL-3);

}
function steer(p,tx,tz,spd){ const n=norm(tx-p.pos.x,tz-p.pos.z); const v=n.d<.35?0:Math.min(spd,n.d*3); p.want={x:n.x*v,z:n.z*v}; }
let chasers=[[],[]];
function computeChasers(){ for(const t of [0,1]){ chasers[t]=players.filter(p=>p.team===t&&!p.gk&&p.st!=='fall'&&p!==ctrl).sort((a,b)=>d2(a.pos,ball.pos)-d2(b.pos,ball.pos)); } }
function aiCarrier(p,dt){
  const s=p.team===0?1:-1, gx=s*HL; const dG=Math.hypot(gx-p.pos.x,p.pos.z-GZ);
  let nd=99; for(const o of opponents(p)){ if(o.gk&&!o.out)continue; nd=Math.min(nd,d2(o.pos,p.pos)); }
  if(p.think<=0&&p.st==='normal'){
    p.think=rnd(.18,.32);
    const spReady=p.gauge>=100;
    if(spReady&&Math.random()<.45){ superShot(p); return; }
    if(dG<13||(dG<21&&Math.random()<.2)){ shoot(p,false); return; }
    if(nd<2.4){ const r=Math.random(); if(r<.3&&p.dodgeCd<=0){dodge(p);} else if(r<.72){ const q=bestPass(p,null,false); if(q){pass(p,q);return;} } }

function aiField(p,dt){

  if(ball.passTo===p&&!ball.owner){ steer(p,ball.pos.x+ball.vel.x*.25,ball.pos.z+ball.vel.z*.25,6.8); return; }
  if(!mine){
    const c=chasers[p.team]; const idx=c.indexOf(p); const dB=d2(p.pos,ball.pos);

    const press = gkSafe ? false : p.team===1 ? (idx===0 || (idx===1&&dB<8)) : (idx===0&&dB<7);

      const tg=ball.owner?{x:ball.owner.pos.x+ball.owner.vel.x*.3,z:ball.owner.pos.z+ball.owner.vel.z*.3}:{x:ball.pos.x+ball.vel.x*.2,z:ball.pos.z+ball.vel.z*.2};

}
function gkLogic(p,dt){

  if(p.out){ if(ball.owner===p){ if(p===ctrl){ p.holdT=(p.holdT||0)+dt; if(Math.hypot(input.jx,input.jz)>.2)p.holdT=0; if(p.holdT>4&&p.st==='normal'){ const q=bestPass(p,null,false); if(q){pass(p,q);return;} } return humanMove(p); } aiCarrier(p,dt); p.think-=dt; return; } p.out=false; }

    p.think-=dt; if(p.think<=0&&p.gauge>=100&&p.st==='normal'){ superShot(p); return; } if(p.think<=0){ if(Math.random()<.3){ p.out=true; } else { const q=bestPass(p,null,false); if(q)pass(p,q); } p.think=.4; }

function inOwnBox(p){ return Math.abs(p.pos.x-(p.team===0?-HL:HL))<BOXX&&p.pos.z>BZ0&&p.pos.z<BZ1; }

/* ---------- mise à jour ---------- */

<script>
/* ---------- Commandes tactiles refaites pour l'appli Android ----------
   Le stick et les boutons écoutent directement les doigts (événements « touch », chaque doigt suivi

   À la souris (ordinateur), rien ne change. */
(function(){

   .map(function(i){ return document.getElementById(i); }).filter(Boolean);
 // les anciens écouteurs « pointer » ne reçoivent plus les doigts (la souris, si)

  window.addEventListener(t,function(e){ if(e.pointerType!=="mouse"&&cibles.indexOf(e.target)>=0) e.stopPropagation(); },true);
 });

 [["bShoot","shoot"],["bPass","pass"],["bDodge","dodge"],["bTackle","tackle"]].forEach(function(a){
  var b=$(a[0]); if(!b) return;

  ["touchend","touchcancel"].forEach(function(t){ b.addEventListener(t,function(){ b.classList.remove("down"); }); });
 });
