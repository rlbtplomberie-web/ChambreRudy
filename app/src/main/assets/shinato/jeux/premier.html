<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6e9ef;--panel:#ffffff;--ink:#2a1428;--muted:#7a5a72;--rose:#c2385e;--line:#e2c7d3;--anger:#d6452b;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#140a14;--panel:#221321;--ink:#f7e8ef;--muted:#b596ab;--rose:#ff7d9c;--line:#3a2236;--anger:#ff6a4a;}}
:root[data-theme="dark"]{--bg:#140a14;--panel:#221321;--ink:#f7e8ef;--muted:#b596ab;--rose:#ff7d9c;--line:#3a2236;--anger:#ff6a4a;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:"Yeseva One",Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(26px,5vw,40px);margin:4px 0;color:var(--rose)}
.round{color:var(--muted);font-weight:700}
.hdrR{display:flex;align-items:center;gap:10px}
#muteBtn{font-size:20px;line-height:1;padding:6px 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 10px}
.gauge .lab{font-size:14px;font-weight:800;display:flex;justify-content:space-between;margin-bottom:4px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;transition:width .5s ease}
#charmFill{background:var(--rose)}#angerFill{background:var(--anger)}
.stage{position:relative;border-radius:16px;overflow:hidden;background:#1a0c1a}
.stage svg{display:block;width:100%;height:auto}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;min-height:80px;cursor:pointer}
.who{font-weight:800;font-size:14px;color:var(--rose)}
.who.me{color:var(--muted)}
.text{font-size:17px;line-height:1.45;margin-top:2px}
.choices{display:grid;gap:8px;margin-top:10px}
.choices button{font:inherit;font-size:16px;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;line-height:1.35}
.choices button:hover{border-color:var(--rose)}
button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,8,20,.74);text-align:center;padding:14px;color:#fff}
.overlay[hidden]{display:none}
.card{max-width:440px}
.card h2{font-family:"Yeseva One",Georgia,serif;font-weight:400;font-size:clamp(26px,6vw,44px);margin:0 0 6px;color:#ff9db4}
.card p{margin:0 0 12px;font-size:clamp(14px,2.6vw,17px);line-height:1.4}
.card button{font:inherit;font-weight:800;font-size:17px;padding:10px 24px;border-radius:999px;border:0;background:#ff7d9c;color:#2a0d18;cursor:pointer}
/* scène */
.part{transition:transform 1.1s ease-in-out,opacity 1s ease}
#wGlass{transform-box:fill-box;transform-origin:50% 100%;transition:transform .45s ease-in}
#wGlass.throw{transform:translate(-560px,-220px) rotate(-80deg)}
#splash{transition:opacity .2s}
.dots{transition:opacity .2s}
#flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.9,1.12)}70%{transform:scale(1.05,.94)}}
#steam{opacity:0;transition:opacity .3s}#steam.on{opacity:1}
.puff{animation:puff 1.1s ease-out infinite}.puff:nth-child(2){animation-delay:.5s}
@keyframes puff{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.heart{animation:rise 2.2s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-170px) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){#flame,.puff{animation:none}.part,#wGlass{transition-duration:.2s}}
/* écran de choix */
.select{margin-top:6px}
.selWrap{position:relative;border-radius:16px;overflow:hidden;background:#1a0c1a}
.selWrap img{display:block;width:100%;height:auto}
.hot{position:absolute;background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent}
.hot.card{transition:background .2s}
.hot.card:not(.sel){background:rgba(12,4,20,.32)}
.hot.card.sel{box-shadow:0 0 0 3px #fff,0 0 26px 8px var(--c);animation:selPulse 1.1s ease-in-out infinite alternate}
@keyframes selPulse{to{box-shadow:0 0 0 3px #fff,0 0 42px 14px var(--c)}}
.hot.ctl:active,.hot.arrow:active{background:rgba(255,255,255,.2)}
.hot:focus-visible{outline:3px solid #fff;outline-offset:2px}
.selHint{text-align:center;color:var(--muted);font-weight:700;margin:8px 0 0;min-height:1.4em}
.card .alt{display:block;margin:10px auto 0;background:none;color:#ffc6d4;font-weight:700;font-size:15px;padding:6px 10px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.hot.card.sel{animation:none}}
/* gestes fluides (fondu entre les poses + respiration) */
#wSpriteOld{transition:opacity .32s ease}
#wBreath.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3.6s ease-in-out infinite}
.csVeil{opacity:0;transition:opacity .35s ease}
.cs.on .csVeil{opacity:.82}
.cs.dark.on .csVeil{opacity:.97}
.cs.black.on .csVeil{opacity:1}
.vf{opacity:0;transform-box:fill-box;transform-origin:50% 55%}
.cs{transform-box:fill-box;transform-origin:50% 50%}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.012)}}
@media (prefers-reduced-motion:reduce){#wBreath.breath{animation:none}#wSpriteOld{transition:none}}
@media (max-width:520px){.gauges{gap:8px}.text{font-size:16px}}
</style>
<script>/* anti-touche bloquée */(()=>{let a={};addEventListener('pointerdown',e=>a[e.pointerId]=e.target,true);let f=e=>delete a[e.pointerId];addEventListener('pointerup',f,true);addEventListener('pointercancel',f,true);let r=()=>{Object.keys(a).forEach(i=>{try{a[i].dispatchEvent(new PointerEvent('pointercancel',{bubbles:true,pointerId:+i}))}catch(_){}});a={}};addEventListener('blur',r);document.addEventListener('visibilitychange',()=>document.hidden&&r())})();</script></head>

<script>

const AUDIO = { music: "/assets/shinato/m/d3fce6d044c7bf39.mp3", rire: "/assets/shinato/m/38bb4db44a1029df.mp3", gene: "/assets/shinato/m/deb15e1ced3b8461.mp3", colere: "/assets/shinato/m/c054716770d1f3e2.mp3" };
const Snd = (() => {
  let ctx = null, master = null, amb = null, muted = false, ducked = false, ambTimer = null;
  const music = new Audio(AUDIO.music); music.loop = true; music.preload = 'auto';
  const MUSIC_VOL = 0.32, DUCK_VOL = 0.12;
  music.volume = MUSIC_VOL;
  const voices = {}; ['rire', 'gene', 'colere'].forEach(k => { const a = new Audio(AUDIO[k]); a.preload = 'auto'; a.volume = 0.95; voices[k] = a; });
  function ac(){
    if (!ctx){
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, t0, dur, vol, type = 'sine', slideTo){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, filt, f0, f1, t0 = 0, q = 1){
    const c = ac(); if (!c) return;
    const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + t0;
    src.buffer = buf; f.type = filt; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(master); src.start(t); src.stop(t + dur + 0.05);
  }
  function clink(t0 = 0, vol = 0.12){ [2637, 3951, 5274].forEach((f, i) => tone(f * (0.98 + Math.random() * 0.04), t0 + i * 0.004, 0.9 - i * 0.2, vol / (i + 1))); }
  function startAmbience(){
    const c = ac(); if (!c || amb) return;
    const len = c.sampleRate * 4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++){ last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();

    const from = music.volume, t0 = performance.now();
    const step = () => { const k = Math.min(1, (performance.now() - t0) / ms); music.volume = from + (to - from) * k; if (k < 1) requestAnimationFrame(step); };
    step();

    unlock,
    startGame(){ unlock(); ducked = false; fadeMusic(MUSIC_VOL, 400); startAmbience(); clink(0.05, 0.14); clink(0.2, 0.1); },

async function playScene(id, holds, o){
  o = Object.assign({fade: 450, zoom: 0, drift: 0, push: 0, onLast: null}, o);
  const cs = $(id), frames = cs._frames || (cs._frames = [...cs.querySelectorAll('.vf')]);

  ['mSprite', 'wSprite', 'mBody', 'wBody', 'mArms', 'wArms'].forEach(id => $(id).style.opacity = '0');
  cs.style.display = ''; reflow(cs); cs.classList.add('on');
  $('who').textContent = ''; $('text').textContent = '';
  const H = i => Array.isArray(holds) ? (holds[i] ?? holds[holds.length - 1]) : holds;
  const total = frames.reduce((t, f, i) => t + H(i), 0);
  if (o.push && !reduce){ cs.style.transition = `transform ${total + 600}ms ease-in-out`; cs.style.transform = `scale(${1 + o.push})`; }
  await wait(380);
  let prev = null;
  for (let i = 0; i < frames.length; i++){
    const f = frames[i], hold = H(i), fade = reduce ? 150 : Math.min(o.fade, hold * 0.75);
    cs.appendChild(f); reflow(f);
    const move = o.zoom && !reduce;
    f.style.transition = `opacity ${fade}ms ${EASE}` + (move ? `, transform ${hold + fade + 200}ms ease-out` : '');

    if (i === frames.length - 1 && o.onLast) o.onLast();
    prev = f;
    await wait(hold);
  }
}
