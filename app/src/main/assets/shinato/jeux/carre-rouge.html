 const mg=AC.createGain();mg.gain.value=0.22;const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;mg.connect(comp);comp.connect(master);musicNodes={g:mg};

 function play(st,t){const s=st%16,bar=(st>>4)%8,loop=st>>7;const intro=loop===0&&bar<2;
  const r=s<8?ROOT[bar]:ROOT2[bar];
  if(s===0&&(bar===0||bar===4))crash(t);
  if(s===0||s===8||s===11||(s===6&&bar%2)||(s===14&&bar===7))kick(t);
  if(s===4||s===12)snare(t);if(bar===7&&s>=13)snare(t,0.5);

function depthSc(y){const m=MAPS[level?level.map:'map1'];return 0.86+0.2*(y-m.yMin)/(m.yMax-m.yMin);}

// planches dessinées tournées vers la gauche : on les retourne
const FLIPL=/^(wrun|watk|whurt|wgrab|tgoth|xrun|xatk|xhurt|xgr|qrun|qhurt|qatk|qsit|qwave|qblk|hwalk|hatk|hhurt|hgrab|crun|catk|cgr|yrun|yatk|yhurt|ygrab|brun|bkick|bhurt|bgr|drun|datk|dhurt|dgr|gwalk|gatk|ghurt|ggrab|ffly|fatk|fhurt|fgrab|fglow|lrun|latk|lhurt)\d/;
function drawSpr(key,x,y,z,face,sc,opt={}){const s=SPR[key],im=IMG[key];if(!s||!im)return;if(FLIPL.test(key))face=-face;const f=K*s.s*sc;ctx.save();ctx.translate(x,y-z);if(opt.rot)ctx.rotate(opt.rot);ctx.scale(face,1);if(opt.alpha!=null)ctx.globalAlpha=opt.alpha;if(opt.flash){const tc=tintCanvas(im,opt.flash);ctx.drawImage(tc,-s.ax*f,-s.ay*f,s.w*f,s.h*f);}else ctx.drawImage(im,-s.ax*f,-s.ay*f,s.w*f,s.h*f);
 ctx.restore();}
// teinte uniquement sur la silhouette (sans carré autour)
const TINT=document.createElement('canvas'),TX=TINT.getContext('2d');
function tintCanvas(im,col){const w=im.naturalWidth,h=im.naturalHeight;if(TINT.width<w)TINT.width=w;if(TINT.height<h)TINT.height=h;TX.globalCompositeOperation='source-over';TX.clearRect(0,0,TINT.width,TINT.height);TX.drawImage(im,0,0);TX.globalCompositeOperation='source-atop';TX.fillStyle=col;TX.fillRect(0,0,w,h);TX.globalCompositeOperation='source-over';
 const c=tintCanvas.c||(tintCanvas.c=document.createElement('canvas'));c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(TINT,0,0,w,h,0,0,w,h);return c;}
function sprPt(key,u,v,x,y,z,face,sc){const s=SPR[key],f=K*s.s*sc;return {x:x+face*(u*s.w-s.ax)*f,y:y-z+(v*s.h-s.ay)*f};}

// ---------- scenery ----------
function warpRegion(img,r,amp,type,ph){const [x0,y0,x1,y1]=r;if(x1<camX-50||x0>camX+viewW+50)return;const w=x1-x0,h=y1-y0;const cw=type==='tree'?30:26,ch=type==='tree'?8:6;
 const wind=0.65+0.35*Math.sin(T*0.6+ph)+0.25*Math.sin(T*1.7+ph*2);
 for(let yy=y0;yy<y1;yy+=ch){const v=(yy-y0+ch/2)/h;const fy=type==='tree'?Math.pow(1-v,1.4):v;if(fy<0.02)continue;
  for(let xx=x0;xx<x1;xx+=cw){const u=(xx-x0+cw/2)/w;const fx=Math.sin(Math.PI*clamp(u,0,1));const d=amp*fy*fx*(Math.sin(T*2.1+ph+u*2.2+v*1.5)*0.6+Math.sin(T*3.7+ph+u*4)*0.25+wind*0.6);
   const dy=type==='tree'?Math.abs(d)*0.15:Math.sin(T*2.6+ph+u*5)*amp*0.25*fy*fx;const cwi=Math.min(cw,x1-xx),chi=Math.min(ch,y1-yy);
   ctx.drawImage(img,xx,yy,cwi,chi,xx+d-0.5,yy+dy-0.5,cwi+1,chi+1);}}}
function bobRegion(img,r,ph){const [x0,y0,x1,y1]=r;if(x1<camX-50||x0>camX+viewW+50)return;const w=x1-x0,h=y1-y0;const cw=8,ch=8;const by=Math.sin(T*2+ph)*3,bx=Math.sin(T*1.3+ph)*2;
 for(let yy=y0;yy<y1;yy+=ch)for(let xx=x0;xx<x1;xx+=cw){const u=(xx-x0+4)/w,v=(yy-y0+4)/h;const f=Math.sin(Math.PI*u)*Math.sin(Math.PI*v);ctx.drawImage(img,xx,yy,cw,ch,xx+bx*f-0.5,yy+by*f-0.5,cw+1,ch+1);}}
function flapRegion(img,r,ph){const [x0,y0,x1,y1]=r;if(x1<camX-50||x0>camX+viewW+50)return;const w=x1-x0,h=y1-y0,cw=6,ch=6;const fl=Math.sin(T*14+ph);const by=Math.sin(T*2.3+ph)*5;
 for(let yy=y0;yy<y1;yy+=ch)for(let xx=x0;xx<x1;xx+=cw){const u=(xx-x0+3)/w,v=(yy-y0+3)/h;const edge=Math.sin(Math.PI*v);const wing=Math.abs(u-0.5)*2;const d=(fl*wing*6+by)*edge;ctx.drawImage(img,xx,yy,cw,ch,xx-0.5,yy+d-0.5,cw+1,ch+1);}}
function waterRegion(img,y0,y1,amp){const x0=Math.max(0,Math.floor(camX)-10),x1=Math.min(MAPW,camX+viewW+10);for(let yy=y0;yy<y1;yy+=3){const v=(yy-y0)/(y1-y0);const d=Math.sin(yy*0.25+T*3)*amp*(0.4+v)+Math.sin(yy*0.07-T*1.3)*amp*0.6;ctx.globalAlpha=0.55;ctx.drawImage(img,x0,yy,x1-x0,3,x0+d,yy,x1-x0,3);}ctx.globalAlpha=1;}
function drawScene(mapKey,ground){const m=MAPS[mapKey],img=IMG[mapKey];if(!img||!img.complete)return;
 ctx.drawImage(img,0,0);
 if(m.moon){const g=GLOW.y;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.35+0.1*Math.sin(T*0.8);ctx.drawImage(g,m.moon[0]-70,m.moon[1]-70,140,140);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
 for(const w of m.warps)warpRegion(img,w.r,w.a,w.t,w.ph);
 (m.ghosts||[]).forEach((g,i)=>bobRegion(img,g,i*1.3));
 (m.bats||[]).forEach((b,i)=>flapRegion(img,b,i*2.1));
 if(ground)waterRegion(img,m.road[0],m.road[1],mapKey==='map3'?1.4:2.2);
 // lumières qui scintillent
 ctx.globalCompositeOperation='lighter';
 for(const l of LTS[mapKey]){if(l.x<camX-20||l.x>camX+viewW+20)continue;const a=0.25+0.75*Math.max(0,Math.sin(T*l.sp+l.ph));if(a<0.3)continue;ctx.globalAlpha=a*0.8;const r=l.r;ctx.drawImage(GLOW[l.k],l.x-r,l.y-r,r*2,r*2);}
 if(m.chand){const f=0.75+0.15*Math.sin(T*9)+0.1*Math.sin(T*23);ctx.globalAlpha=0.45*f;ctx.drawImage(GLOW.o,m.chand[0]-170,m.chand[1]-140,340,280);}
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}

// particules d'ambiance (feuilles, poussières)
function ambient(dt,mapKey){const m=MAPS[mapKey];const wind=40+30*Math.sin(T*0.6);
 for(const L of m.leaves||[])if(Math.random()<dt*L[2]/60){parts.push({k:'leaf',x:L[0]+rnd(-80,80),y:L[1]+rnd(-60,60),vx:wind+rnd(-20,30),vy:rnd(15,40),r:rnd(0,6.28),vr:rnd(-4,4),life:rnd(5,9),c:['#ff8c1a','#e8590c','#ffb703','#c2410c','#9d4edd'][Math.random()*5|0],s:rnd(4,7)});}
 if(Math.random()<dt*4)parts.push({k:'dust',x:camX+rnd(0,viewW),y:rnd(TOP,724),vx:rnd(5,25),vy:rnd(-8,8),life:rnd(3,6),s:rnd(1,2.5)});
 if(mapKey!=='map3'&&Math.random()<dt*6)parts.push({k:'rain',x:camX+rnd(-100,viewW),y:TOP-20,vx:60,vy:rnd(650,800),life:1.2,s:1});}

function newPlayer(){return {x:300,y:600,z:0,vz:0,face:1,hp:100,en:60,st:'idle',t:0,fr:0,combo:0,kcombo:0,comboT:0,queue:null,inv:0,lvl:0,ct:0,atk:null,hitDone:null,hurtT:0,vx:0};}
const PUNCH=[{f:'punch0',d:0.12,hit:0.025,r:[10,128],dmg:7,kb:20},{f:'punch1',d:0.12,hit:0.025,r:[10,140],dmg:8,kb:22},{f:'punch2',d:0.14,hit:0.035,r:[10,135],dmg:9,kb:26},{f:'punch4',d:0.14,hit:0.035,r:[10,130],dmg:10,kb:28},{f:'punch3',d:0.26,hit:0.05,r:[0,120],dmg:16,kb:120,knock:true,up:true},{f:'punch5',d:0.26,hit:0.05,r:[0,135],dmg:16,kb:140,knock:true}];
const KICK=[{f:'kick1',d:0.15,hit:0.03,r:[30,175],dmg:11,kb:40},{f:'kick2',d:0.16,hit:0.035,r:[30,195],dmg:12,kb:45},{f:'kick0',d:0.18,hit:0.04,r:[10,150],dmg:12,kb:60,knock:true,low:true},{f:'kick3',d:0.24,hit:0.05,r:[20,170],dmg:18,kb:140,knock:true,up:true}];
const FLY={f:'kick4',d:0.4,hit:0.05,r:[0,185],dmg:16,kb:150,knock:true,multi:true};
const LVL_T=[0.45,1.25,2.3],LVL_COST=[10,25,50];

function startAtk(p,a){p.st='atk';p.t=0;p.atk=a;p.hitDone=new Set();sfx('whoosh',0.8);}
function updatePlayer(p,dt){const m=MAPS[level.map];p.t+=dt;if(p.st==='dog'){updDog(dt);return;}if(p.st==='fem'){updFem(dt);return;}p.inv=Math.max(0,p.inv-dt);p.comboT-=dt;if(p.comboT<0){p.combo=0;p.kcombo=0;}
 p.en=Math.min(100,p.en+dt*3);
 let jx=inp.jx,jy=inp.jy;if(keys.ArrowLeft||keys.KeyA)jx=-1;if(keys.ArrowRight||keys.KeyD)jx=1;if(keys.ArrowUp||keys.KeyW)jy=-1;if(keys.ArrowDown||keys.KeyS)jy=1;
 const run=Math.hypot(jx,jy)>0.82||keys.ShiftLeft;const guardHeld=inp.guardT||keys.KeyG||keys.KeyH;const waveHeld=inp.wave||inp.waveT;
 const wantP=take('punch'),wantK=take('kick');
 if(p.st==='grabbed'){if(wantP||wantK||take('enter'))p.mash++;if(waveHeld&&!p.wl){p.mash++;}p.wl=waveHeld;if(p.mash>=p.needMash)releaseGrab();return;}
 if(p.st==='dead'){p.z=Math.max(0,p.z+p.vz*dt);p.vz-=1400*dt;p.x+=p.vx*dt;p.vx*=0.9;return;}
 if(p.st==='down'){p.x+=p.vx*dt;p.vx*=Math.pow(0.02,dt);p.z=Math.max(0,p.z+p.vz*dt);p.vz-=1500*dt;if(p.t>0.9){p.st='idle';p.t=0;p.inv=1.0;}return;}
 if(p.st==='hurt'){p.x+=p.vx*dt;p.vx*=Math.pow(0.01,dt);if(p.t>0.32){p.st='idle';p.t=0;}return;}
 if(p.st==='atk'){const a=p.atk;
  if(a===FLY){p.x+=p.face*520*dt*(p.t<0.33?1:0.3);p.z=Math.max(0,Math.sin(Math.min(p.t/0.36,1)*Math.PI)*70);}
  if(p.t>=a.hit&&(!a.once||!p.hitDone.size))doHit(p,a);
  if(wantP)p.queue='p';if(wantK)p.queue='k';
  if(p.t>=a.d){p.z=0;if(p.queue==='p'&&a!==FLY){nextPunch(p);}else if(p.queue==='k'&&a!==FLY){nextKick(p);}else{p.st='idle';p.t=0;}p.queue=null;}
  p.x=clamp(p.x,60,MAPW-60);return;}
 if(p.st==='charge'){
  const prev=p.lvl;p.ct+=dt;let lv=0;for(let i=0;i<3;i++)if(p.ct>=LVL_T[i]&&p.en>=LVL_COST[i])lv=i+1;p.lvl=lv;
  if(lv>prev){sfx('level',lv);texts.push({t:'NIVEAU '+lv,x:p.x,y:p.y-RUDY_H*1.15,life:0.9,c:lv===3?'#ff3b3b':'#ffe14d',s:lv===3?44:34});shake=Math.max(shake,lv*2);}
  chargeSound(true,lv);
  if(Math.random()<dt*(20+lv*20)){const hp=handPt(p);parts.push({k:'spark',x:hp.x+rnd(-60,60),y:hp.y+rnd(-60,60),tx:hp.x,ty:hp.y,life:0.35,c:lv>=2&&Math.random()<0.4?'#ff3b30':'#ffe14d'});}
  if(!waveHeld){chargeSound(false);if(lv===0){p.st='idle';p.t=0;}else{p.st='fire';p.t=0;p.fired=false;p.en-=LVL_COST[lv-1];}}
  return;}
 if(p.st==='fire'){const lv=p.lvl;if(!p.fired&&p.t>0.1){p.fired=true;fire(p,lv);}const dur=lv===3?1.35:0.45;if(p.t>dur){p.st='idle';p.t=0;beamSound(false);}return;}
 if(p.st==='throw'){updThrow(p,dt);return;}
 // libre
 if(p.st==='guard'){if(!guardHeld){p.st='idle';p.t=0;}else{p.x+=p.vx*dt;p.vx*=Math.pow(0.01,dt);p.x=clamp(p.x,60,MAPW-60);return;}}
 if(take('throw')&&tryThrow(p))return;
 if(guardHeld&&!wantP&&!wantK){p.st='guard';p.t=0;p.vx=0;return;}
 if(waveHeld&&p.en>=LVL_COST[0]){p.st='charge';p.t=0;p.ct=0;p.lvl=0;return;}
 if(waveHeld&&p.en<LVL_COST[0]&&!p.noEnMsg){p.noEnMsg=1;texts.push({t:'PAS ASSEZ D\'ÉNERGIE',x:p.x,y:p.y-RUDY_H*1.1,life:1,c:'#ffd23f',s:24});}
 if(!waveHeld)p.noEnMsg=0;
 if(wantK&&p.st==='run'){p.face=jx<0?-1:jx>0?1:p.face;startAtk(p,FLY);return;}
 if(wantP){nextPunch(p);return;}
 if(wantK){nextKick(p);return;}
 const mag=Math.hypot(jx,jy);
 if(mag>0.15){const sp=run?300:150;p.x+=jx/Math.max(mag,1)*sp*dt*(Math.abs(jx)>0.1?1:0);p.y+=jy/Math.max(mag,1)*sp*0.55*dt;if(jx>0.1)p.face=1;else if(jx<-0.1)p.face=-1;const ns=run?'run':'walk';if(p.st!==ns){p.st=ns;p.t=0;}}
 else if(p.st!=='idle'){p.st='idle';p.t=0;}
 p.x=clamp(p.x,60,MAPW-60);p.y=clamp(p.y,m.yMin,m.yMax);}
const THROWABLE=['goth','fouet','reine','rouge','jaune','demone','mamie','blanche','pom','latex'];
const THR_T=[0.12,0.16,0.17,0.17,0.2,0.34];
function tryThrow(p){const sc=depthSc(p.y);let best=null,bd=1e9;
 for(const e of enemies){if(e.dead||e.hp<=0||!THROWABLE.includes(e.type))continue;if(!['walk','idle','hurt','atk','block'].includes(e.st))continue;if(e.z>20)continue;
  const dx=Math.abs(e.x-p.x),dy=Math.abs(e.y-p.y);if(dx<175*sc&&dy<40&&dx<bd){bd=dx;best=e;}}
 if(!best)return false;const e=best;p.face=e.x>=p.x?1:-1;p.st='throw';p.t=0;p.tt=e;p.tfr=-1;p.vx=0;p.y=e.y;
 e.st='thrown';e.t=0;e.vx=0;e.vz=0;e.z=0;e.atk=null;e.blocks=0;if(grabber===e)grabber=null;sfx('whoosh',0.8);return true;}
function updThrow(p,dt){const e=p.tt;p.inv=Math.max(p.inv,0.3);let acc=0,fr=5;for(let i=0;i<6;i++){acc+=THR_T[i];if(p.t<acc){fr=i;break;}}
 if(fr!==p.tfr){p.tfr=fr;if(fr===1)sfx2('punch',0.6);if(fr===3){sfx('whoosh',1);sfx2('femhurt',0.8);}
  if(fr===5){sfx2('heavy',1.3);shake=Math.max(shake,10);const sc=depthSc(p.y);const sp=SPR['t'+e.type+'5'];const off=(sp?(sp.w*0.66-sp.ax)*sp.s*K*sc:200*sc)*(FLIPL.test('t'+e.type+'5')?-1:1);
   fx.push({k:'hit',x:p.x+p.face*off,y:p.y-20,t:0});for(let i=0;i<14;i++)parts.push({k:'dust',x:p.x+p.face*off+rnd(-70,70),y:p.y-rnd(0,20),vx:rnd(-80,80),vy:rnd(-60,-10),life:rnd(0.5,1),s:rnd(3,7)});}}
 if(p.t>=THR_T.reduce((a,b)=>a+b,0)){const sc=depthSc(p.y);const sp=SPR['t'+e.type+'5'];const off=(sp?(sp.w*0.66-sp.ax)*sp.s*K*sc:200*sc)*(FLIPL.test('t'+e.type+'5')?-1:1);
  e.x=clamp(p.x+p.face*off,40,MAPW-40);e.y=p.y;e.face=-p.face;e.hp-=22;e.flash=0.12;e.st='down';e.t=0.25;e.z=0;e.vz=0;e.vx=0;e.landT=-1;
  p.st='idle';p.t=0;p.tt=null;p.inv=0.35;}}
function nextPunch(p){const i=p.combo%5;let a=PUNCH[i];if(i===4)a=PUNCH[4+((p.fin=(p.fin||0)+1)%2)];p.combo++;p.comboT=0.45;startAtk(p,a);}
function nextKick(p){const i=p.kcombo%4;p.kcombo++;p.comboT=0.45;startAtk(p,KICK[i]);}
const HANDS={charge1:[0.47,0.43],charge2:[0.307,0.455],charge3:[0.309,0.41],charge4:[0.9,0.3],charge5:[0.91,0.265]};
function chargeKey(p){if(p.st==='charge')return p.t<0.12?'charge0':p.t<0.26?'charge1':(Math.floor(p.t*8)%2?'charge3':'charge2');return p.t<0.1?'charge4':'charge5';}
function handPt(p,key){const sc=depthSc(p.y);key=key||chargeKey(p);if(!HANDS[key])key='charge2';const uv=HANDS[key];return sprPt(key,uv[0],uv[1],p.x,p.y,0,p.face,sc);}
function fire(p,lv){const sc=depthSc(p.y);const h=sprPt('charge5',0.91,0.265,p.x,p.y,0,p.face,sc);sfx('blast',lv===3?1.2:0.8);shake=lv*4;
 if(lv===3){projs.push({k:'beam',x:h.x,y:h.y,gy:p.y,face:p.face,t:0,life:1.2,hit:new Map()});beamSound(true);}
 else projs.push({k:'ball',lv,x:h.x,y:h.y,gy:p.y,vx:p.face*(lv===1?620:520),r:lv===1?20:36,t:0,dmg:lv===1?20:40,life:2.5});}
function doHit(p,a){const sc=depthSc(p.y);for(const e of enemies){if(e.dead||e.st==='down'&&!a.low||p.hitDone.has(e))continue;if(e.st==='spawn'||e.st==='tp'||e.st==='thrown')continue;
 const dx=(e.x-p.x)*p.face;if(dx<a.r[0]*sc-20||dx>a.r[1]*sc+e.w*0.4)continue;if(Math.abs(e.y-p.y)>34)continue;
 p.hitDone.add(e);if(hitEnemy(e,a.dmg,p.face,a.kb,a.knock,a.up)===false){blockFx(e);hitStop=0.03;continue;}const hx=e.x-p.face*e.w*0.25,hy=e.y-(a.low?40:a.up?e.h*0.8:e.h*0.62)*e.sc;fx.push({k:'hit',x:hx,y:hy,t:0,big:a.knock});hitStop=a.knock?0.08:0.045;sfx2(a.knock?'heavy':(a.f.startsWith('kick')?'kickhit':'punch'));if(e.d.spr)sfx2('femhurt',0.8);if(a.knock)shake=Math.max(shake,5);}}
function hitEnemy(e,dmg,face,kb,knock,up){if(e.dead||e.st==='thrown')return false;
 if(e.type==='clone'){if(e.st==='tp')return false;dmg=1;if(e.hp<=1)knock=true;}
 if(e.type==='reine'){if(e.st==='tp'||e.st==='wave'&&e.t<0.1)return false;if(T-(e.lastBlock||0)>2.5)e.blocks=0;
  if(['walk','idle','block'].includes(e.st)&&(e.blocks||0)<5&&(e.st==='block'||Math.random()<0.6)){e.blocks=(e.blocks||0)+1;e.lastBlock=T;e.st='block';e.t=0;e.face=-face;e.vx=0;return false;}
  e.blocks=0;}e.hp-=dmg;e.flash=0.12;e.face=-face;
 if(e.hp<=0||knock){e.st='down';e.t=0;e.vx=face*(kb*2.2+120);e.vz=up?520:300;e.z=Math.max(e.z,1);}
 else{e.st='hurt';e.t=0;e.vx=face*kb*3;e.atkT=0;}}

// ---------- ennemis (provisoires : en attendant les planches) ----------
const ETYPES={

function spawnEnemy(type,x,y){const d=ETYPES[type];const e={type,d,x,y,z:0,vz:0,vx:0,face:-1,hp:d.hp,max:d.hp,st:'spawn',t:0,w:d.w,h:d.h,sc:1,ph:Math.random()*6,atkT:rnd(0.8,1.8),flash:0,dead:false,alpha:0,id:Math.random()};enemies.push(e);return e;}
function updateEnemy(e,dt){if(e.d.spr)return updateRouge(e,dt);const p=player,m=MAPS[level.map];e.t+=dt;e.flash=Math.max(0,e.flash-dt);e.sc=depthSc(e.y)*(e.d.boss?1:1);
 if(e.st==='spawn'){e.alpha=Math.min(1,e.t/0.4);if(e.t>0.4){e.st='walk';e.alpha=1;}}else if(e.st!=='dying')e.alpha=1;
 if(e.st==='dying'){e.alpha=1-e.t/0.9;if(Math.random()<dt*40)parts.push({k:'smoke',x:e.x+rnd(-40,40),y:e.y-rnd(0,40),vx:rnd(-20,20),vy:rnd(-60,-20),life:rnd(0.6,1.1),s:rnd(14,28)});if(e.t>0.9){e.dead=true;}return;}
 if(e.st==='down'){e.x+=e.vx*dt;e.vx*=Math.pow(0.08,dt);e.z+=e.vz*dt;e.vz-=1500*dt;if(e.z<=0){e.z=0;if(e.vz<-200){e.vz=-e.vz*0.3;shake=Math.max(shake,2);}else e.vz=0;}
  e.x=clamp(e.x,40,MAPW-40);if(e.t>0.6&&e.hp<=0&&e.z===0){e.st='dying';e.t=0;sfx('die');onEnemyDead(e);}
  else if(e.t>1.3&&e.hp>0){e.st='walk';e.t=0;e.atkT=rnd(0.6,1.4);}return;}
 if(e.st==='hurt'){e.x+=e.vx*dt;e.vx*=Math.pow(0.02,dt);if(e.t>0.35){e.st='walk';e.t=0;}return;}
 if(p.st==='dead'){e.st='walk';e.x+=e.face*20*dt;return;}
 const dx=p.x-e.x,dy=p.y-e.y;
 if(e.st==='atk'){const A=e.atk;if(!A.done&&e.t>=A.hitAt){A.done=true;doEnemyHit(e,A);}if(A.k==='slam'&&e.t<A.hitAt){e.z=Math.sin(e.t/A.hitAt*Math.PI)*120;e.x+=e.face*120*dt;}else e.z=0;if(e.t>A.dur){e.st='walk';e.t=0;e.atkT=e.d.boss?rnd(0.5,1.1):rnd(0.9,2.0);}return;}
 e.face=dx>0?1:-1;e.atkT-=dt;
 const want=e.d.boss?115:95;const tx=p.x-e.face*want,ty=p.y+(Math.sin(e.ph+T*0.5)*8);
 // évite de s'empiler
 let sep=0;for(const o of enemies)if(o!==e&&!o.dead&&Math.abs(o.x-e.x)<60&&Math.abs(o.y-e.y)<30)sep+=(e.y>o.y?1:-1);
 const ex=tx-e.x,ey=ty-e.y+sep*14;const dist=Math.hypot(ex,ey);
 if(e.d.boss&&e.atkT<=0&&Math.abs(dx)>320&&Math.random()<0.6){startEAtk(e,'fireball');return;}
 if(e.d.boss&&e.atkT<=0&&Math.abs(dx)<330&&Math.abs(dx)>150&&Math.random()<0.4){startEAtk(e,'slam');return;}
 if(dist>12){const sp=e.d.sp*(e.st==='walk'?1:1);e.x+=ex/dist*sp*dt;e.y+=ey/dist*sp*0.6*dt;e.moving=true;}else e.moving=false;
 e.y=clamp(e.y,m.yMin,m.yMax);e.x=clamp(e.x,40,MAPW-40);
 if(e.atkT<=0&&Math.abs(dx)<want+40&&Math.abs(dy)<28)startEAtk(e,'punch');}
function startEAtk(e,k){e.st='atk';e.t=0;e.atk=k==='punch'?{k,dur:0.75,hitAt:0.42,r:e.d.boss?170:135}:k==='fireball'?{k,dur:0.9,hitAt:0.5}:{k,dur:1.1,hitAt:0.55};}
function doEnemyHit(e,A){const p=player;if(A.k==='fireball'){const sc=e.sc;eprojs.push({x:e.x+e.face*60*sc,y:e.y-e.h*0.62*sc,gy:e.y,vx:e.face*380,t:0,life:3,dmg:12});sfx('whoosh',1);return;}
 if(A.k==='slam'){shake=9;sfx('hit2',1.2);fx.push({k:'ring',x:e.x,y:e.y,t:0});if(Math.abs(p.y-e.y)<45&&Math.abs(p.x-e.x)<240)hurtPlayer(15,p.x>e.x?1:-1,true);return;}
 sfx('whoosh',0.7);const dx=(p.x-e.x)*e.face;if(dx>-10&&dx<A.r*e.sc&&Math.abs(p.y-e.y)<30)hurtPlayer(e.d.dmg,e.face,e.d.boss&&Math.random()<0.35);}
function hurtPlayer(dmg,dir,knock){const p=player;
 if(p.inv<=0&&!['dead','down','grabbed'].includes(p.st)){ try{ if(lastAtk) quiKO=lastAtk.type; else { let best=null,bd=1e9; for(const e of enemies){ if(e.dead||e.st==='dying')continue; const d=Math.abs(e.x-p.x)+Math.abs(e.y-p.y)*0.5; if(d<bd){bd=d;best=e;} } if(best) quiKO=best.type; } }catch(_){} }   // celle qui vient de le toucher
 if(p.st==='guard'&&dir===-p.face&&p.inv<=0){p.hp-=Math.min(2,dmg*0.1);p.blockT=0.18;p.vx=dir*170;sfx2('block');fx.push({k:'block',x:p.x+p.face*40,y:p.y-RUDY_H*0.62,t:0});texts.push({t:'PARÉ !',x:p.x,y:p.y-RUDY_H*1.1,life:0.5,c:'#bfe7ff',s:24});shake=Math.max(shake,2);if(p.hp<=0)p.hp=1;return;}
 if(p.inv>0||p.st==='dead'||p.st==='down'||p.st==='grabbed')return;p.hp-=dmg;chargeSound(false);if(p.st==='fire'){beamSound(false);projs=projs.filter(q=>q.k!=='beam');}
 sfx2('rudyhurt',1);if(knock)sfx2('heavy',0.8);shake=Math.max(shake,4);fx.push({k:'hit',x:p.x,y:p.y-RUDY_H*0.6,t:0,big:knock,red:true});p.flashT=0.12;
 if(p.hp<=0&&lastAtk&&lastAtk.type==='goth'){p.hp=0;startFem(lastAtk);return;}
 if(p.hp<=0&&bossAlive()){p.hp=0;startDog();return;}
 if(p.hp<=0){p.hp=0;p.st='dead';p.t=0;p.vx=dir*200;p.vz=250;p.z=1;setTimeout(()=>{if(scene==='play')scene='over';},1600);return;}
 p.face=dir>0?-1:1;if(knock){p.st='down';p.t=0;p.vx=dir*260;p.vz=250;p.z=1;}else{p.st='hurt';p.t=0;p.vx=dir*180;}p.inv=0.45;}
function onEnemyDead(e){if(e.type==='clone'){cloneBurst(e);e.dead=true;return;}level.killed++;
 // un cœur apparaît une fois sur deux
 level.dropN=(level.dropN||0)+1;if(!e.d.boss&&level.dropN%2===0)hearts.push({x:e.x,y:e.y,z:40,vz:260,k:Math.random()<0.5?'red':'yellow',t:0});
 if(e.d.boss){setTimeout(()=>{scene='win';},1400);}}

 ctx.font="900 46px Impact,'Arial Black',sans-serif";ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#3a0a00';const ty=rot?-78:-62,tx=rot?0:0;ctx.strokeText('GO',tx,ty);ctx.fillStyle=`rgb(255,${200+55*pulse|0},40)`;ctx.fillText('GO',tx,ty);ctx.restore();}
function bar(x,y,w,h,v,c1,c2,label){ctx.fillStyle='rgba(10,0,20,0.75)';ctx.fillRect(x-3,y-3,w+6,h+6);ctx.fillStyle='#2b1438';ctx.fillRect(x,y,w,h);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(x,y,w*clamp(v,0,1),h);ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(x,y,w*clamp(v,0,1),h*0.35);}
function drawHUD(){const u=Math.min(cv.width/900,cv.height/420);const p=player;ctx.save();const x=14*u,y=12*u;
 ctx.font=`900 ${22*u}px Impact,'Arial Black',sans-serif`;ctx.textAlign='left';ctx.lineWidth=5*u;ctx.strokeStyle='#14051f';ctx.strokeText('RUDY',x,y+20*u);ctx.fillStyle='#8fd36a';ctx.fillText('RUDY',x,y+20*u);
 bar(x+70*u,y+4*u,220*u,14*u,p.hp/100,'#ff6b81','#c9184a');ctx.font=`700 ${10*u}px sans-serif`;ctx.fillStyle='#fff';ctx.fillText('VIE',x+74*u,y+15*u);
 bar(x+70*u,y+24*u,220*u,10*u,p.en/100,'#fff3a0','#f4b400');for(let i=0;i<3;i++){const tx=x+70*u+220*u*LVL_COST[i]/100;ctx.fillStyle=p.en>=LVL_COST[i]?'#ff3b30':'#555';ctx.fillRect(tx-1.5*u,y+21*u,3*u,16*u);}
 ctx.fillStyle='#fff';ctx.fillText('ÉNERGIE',x+74*u,y+33*u);
 // ennemis
 ctx.textAlign='center';ctx.font=`900 ${18*u}px Impact,'Arial Black',sans-serif`;const cx=cv.width/2;
 if(level.map!=='map3'){const txt=level.phase==='go'?'ZONE NETTOYÉE !':`ENNEMIS  ${level.killed} / ${level.total}`;ctx.strokeText(txt,cx,y+20*u);ctx.fillStyle=level.phase==='go'?'#ffd60a':'#ffb347';ctx.fillText(txt,cx,y+20*u);}
 const boss=enemies.find(e=>e.d.boss);if(boss){const bw=340*u;bar(cx-bw/2+60*u,y+46*u,bw,14*u,boss.hp/boss.max,'#c77dff','#7b2cbf');ctx.font=`900 ${14*u}px Impact,sans-serif`;ctx.lineWidth=4*u;ctx.strokeText('LA BOSS',cx+60*u,y+40*u);ctx.fillStyle='#e0aaff';ctx.fillText('LA BOSS',cx+60*u,y+40*u);}
 if(banner){const a=Math.min(1,banner.life*2,(2.6-banner.life)*4);ctx.globalAlpha=Math.max(0,a);ctx.font=`900 ${34*u}px Impact,'Arial Black',sans-serif`;ctx.lineWidth=8*u;ctx.strokeStyle='#14051f';ctx.strokeText(banner.t,cx,cv.height*0.3);ctx.fillStyle=banner.red?'#ff5d5d':'#ffb347';ctx.fillText(banner.t,cx,cv.height*0.3);ctx.globalAlpha=1;}
 ctx.restore();}
function bigText(t,y,size,c){const u=Math.min(cv.width/900,cv.height/420);ctx.font=`900 ${size*u}px Impact,'Arial Black',sans-serif`;ctx.textAlign='center';ctx.lineWidth=size*u*0.2;ctx.strokeStyle='#14051f';ctx.strokeText(t,cv.width/2,y);ctx.fillStyle=c;ctx.fillText(t,cv.width/2,y);}
function drawTitle(){ctx.fillStyle='rgba(10,0,25,0.45)';ctx.fillRect(0,0,cv.width,cv.height);const u=Math.min(cv.width/900,cv.height/420);
 ctx.save();ctx.shadowColor='#ff7b00';ctx.shadowBlur=30*u*(0.7+0.3*Math.sin(T*3));bigText("CARRÉ ROUGE",cv.height*0.36,64,'#ffa94d');ctx.restore();
 bigText('Rudy contre les citrouilles',cv.height*0.5,22,'#c77dff');
 if(Math.floor(T*2)%2)bigText('Touche l\'écran pour jouer',cv.height*0.72,26,'#fff3a0');
 const sm=`${12*u}px sans-serif`;ctx.font=sm;ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillText('Clavier : flèches / ZQSD • J poing • K pied • L (maintenir) vague • G (maintenir) garde • Entrée',cv.width/2,cv.height*0.92);}
function drawOver(){ctx.fillStyle='rgba(30,0,0,0.6)';ctx.fillRect(0,0,cv.width,cv.height);if(player&&player.femmed){bigText('TRANSFORMÉ EN FEMME !',cv.height*0.42,54,'#ffb3f0');}else if(player&&player.dogged){bigText('TRANSFORMÉ EN CHIEN !',cv.height*0.42,54,'#ffd23f');}else bigText('K.O. !',cv.height*0.42,72,'#ff4d4d');if(Math.floor(T*2)%2)bigText('Touche l\'écran pour réessayer',cv.height*0.62,24,'#fff');}
function drawWin(){ctx.fillStyle='rgba(20,0,40,0.55)';ctx.fillRect(0,0,cv.width,cv.height);ctx.save();ctx.shadowColor='#ffd60a';ctx.shadowBlur=30;bigText('VICTOIRE !',cv.height*0.42,72,'#ffd60a');ctx.restore();bigText('La boss est battue',cv.height*0.56,24,'#e0aaff');if(Math.floor(T*2)%2)bigText('Touche l\'écran pour rejouer',cv.height*0.7,22,'#fff');}

cv.addEventListener('pointerdown',()=>{initAudio(); if(DANS_APPLI&&scene!=='play') return;
 if(scene==='title'){scene='play';startLevel('map1');try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{});}catch(e){}}
 else if(scene==='over'){scene='play';const mk=level.map;player=null;startLevel(mk);}
 else if(scene==='win'){scene='title';}});
addEventListener('keydown',e=>{if(e.code==='Enter'||e.code==='Space'){if(scene==='title'){scene='play';startLevel('map1');}else if(scene==='over'){scene='play';const mk=level.map;player=null;startLevel(mk);}else if(scene==='win')scene='title';}});
if(DANS_APPLI){ scene='play'; startLevel('map1'); }
requestAnimationFrame(loop);

</script></body></html>
