<style>
/* Style manga énergique : orange flamme, bleu nuit, contours épais */
:root{

}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--f-ui);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.screen{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(180deg,rgba(11,16,38,.35),rgba(11,16,38,.82))}
.wrap{min-height:100%;box-sizing:border-box;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px;

.center{justify-content:center;align-items:center;text-align:center}
.logo{font-family:var(--f-comic);font-size:clamp(58px,13vw,140px);line-height:.86;margin:0;color:var(--gold);transform:rotate(-3deg);letter-spacing:.02em;
  -webkit-text-stroke:4px var(--line);text-shadow:0 0 30px rgba(255,138,0,.8),6px 6px 0 var(--fire),11px 11px 0 var(--line)}
.logo span{display:block;color:#fff;font-size:.5em;text-shadow:0 0 24px rgba(63,182,255,.9),5px 5px 0 var(--sky),9px 9px 0 var(--line)}
.btn{border:4px solid var(--line);border-radius:14px;padding:12px 28px;font-family:var(--f-comic);font-size:28px;letter-spacing:.06em;color:var(--line);background:linear-gradient(180deg,#ffe066,var(--fire));box-shadow:5px 5px 0 var(--line),0 0 24px rgba(255,138,0,.45);transform:rotate(-1deg)}
.btn:active{transform:translate(3px,3px) rotate(-1deg);box-shadow:2px 2px 0 var(--line)}
.btn.ghost{background:#fff;font-size:20px;padding:9px 18px;box-shadow:4px 4px 0 var(--line)}
.btn.blue{background:linear-gradient(180deg,#9be3ff,var(--sky))}
.h1{font-family:var(--f-comic);font-size:clamp(30px,5.5vw,48px);margin:0;letter-spacing:.04em;color:#fff;text-shadow:3px 3px 0 var(--line),0 0 18px rgba(255,138,0,.5)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.hint{color:var(--dim);font-size:14px;line-height:1.5;margin:0;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:rgba(20,27,61,.9);border:4px solid var(--line);border-radius:16px;padding:14px;box-shadow:5px 5px 0 var(--line);display:flex;flex-direction:column;gap:10px}
.chars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:700px){.chars{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ch{position:relative;border:4px solid var(--line);background:linear-gradient(160deg,var(--c),var(--c2));border-radius:14px;padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:4px 4px 0 var(--line);overflow:hidden;min-height:108px;justify-content:flex-end}
.ch .big{position:absolute;top:-8px;right:4px;font-family:var(--f-comic);font-size:78px;line-height:1;color:rgba(255,255,255,.22)}
.ch b{font-family:var(--f-comic);font-size:26px;letter-spacing:.04em;color:#fff;text-shadow:2px 2px 0 var(--line);position:relative}
.ch small{font-size:11px;font-weight:900;color:var(--line);background:rgba(255,255,255,.82);border-radius:6px;padding:1px 6px;position:relative;text-align:center}
.ch[aria-pressed="true"]{outline:4px solid #fff;transform:translateY(-3px) rotate(-1.5deg)}
.ch .tag{position:absolute;top:6px;left:6px;font-family:var(--f-comic);font-size:16px;background:var(--line);color:var(--gold);border-radius:6px;padding:1px 7px}
.info{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.info{grid-template-columns:1fr}}
.stat{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:center;font-weight:800;font-size:13px}
.stat span:last-child{background:rgba(255,255,255,.08);border-radius:6px}
.stat i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--fire));border:2px solid var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:3px solid var(--line);background:#fff;color:var(--line);border-radius:10px;padding:8px 12px;font-weight:900;font-size:14px;box-shadow:3px 3px 0 var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold)}
.opt{display:flex;flex-direction:column;gap:6px}
.opt>span{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.stages{grid-template-columns:1fr}}
.stg{border:4px solid var(--line);border-radius:14px;padding:0;overflow:hidden;background:var(--panel);box-shadow:4px 4px 0 var(--line);text-align:left;display:flex;flex-direction:column}
.stg .pic{height:96px;position:relative}
.stg b{font-family:var(--f-comic);font-size:24px;letter-spacing:.04em;padding:8px 10px 0}
.stg p{margin:0;padding:2px 10px 10px;font-size:12.5px;color:var(--dim);font-weight:700}
.stg[aria-pressed="true"]{outline:4px solid var(--gold);transform:translateY(-3px)}
.moves{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13.5px;font-weight:700;text-align:left}
.moves b{color:var(--gold);font-family:var(--f-comic);font-size:17px;letter-spacing:.04em}

.pl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;max-width:380px}
.pl.r{grid-template-columns:minmax(0,1fr) 44px;justify-self:end;width:100%}
.pl.r .face{order:2}
.face{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-comic);font-size:26px;color:#fff;text-shadow:2px 2px 0 var(--line);box-shadow:2px 2px 0 var(--line)}

.hp{position:relative;height:16px;background:#2a0f14;border:3px solid var(--line);border-radius:6px;overflow:hidden;margin-top:2px}

.hp u{background:#ff5a5a}

.pl.r .hp i,.pl.r .hp u{left:auto;right:0}
.kib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-top:4px}
.kib span{height:9px;border:2px solid var(--line);border-radius:4px;background:#101a3a;position:relative;overflow:hidden}
.kib span i{position:absolute;inset:0;right:auto;background:linear-gradient(180deg,#bfefff,var(--sky));display:block}
.kib span.full i{background:linear-gradient(180deg,#fff2a8,var(--gold))}
#timer{font-family:var(--f-comic);font-size:34px;min-width:56px;text-align:center;text-shadow:3px 3px 0 var(--line);line-height:1}
#combo{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:34%;font-family:var(--f-comic);font-size:40px;color:var(--gold);text-shadow:3px 3px 0 var(--line);transform:rotate(-6deg);opacity:0;transition:opacity .2s}
#combo small{display:block;font-size:20px;color:#fff}
#announce{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-comic);font-size:clamp(40px,9vw,92px);color:#fff;-webkit-text-stroke:3px var(--line);text-shadow:5px 5px 0 var(--line),0 0 30px var(--ac,rgba(255,138,0,.9));letter-spacing:.04em;opacity:0;transform:scale(.6)}
#announce.on{animation:ann 1.4s ease-out forwards}
@keyframes ann{0%{opacity:0;transform:scale(1.8) rotate(-4deg)}12%{opacity:1;transform:scale(1) rotate(-3deg)}80%{opacity:1;transform:scale(1.05) rotate(-3deg)}100%{opacity:0;transform:scale(1.15) rotate(-3deg)}}
#mash{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-family:var(--f-comic);font-size:40px;color:var(--gold);text-shadow:3px 3px 0 var(--line);text-align:center;animation:shk .15s infinite}
#mash i{display:block;width:220px;height:14px;border:3px solid var(--line);border-radius:8px;background:#222;margin:6px auto 0;overflow:hidden}
#mash i b{display:block;height:100%;background:var(--gold)}
@keyframes shk{0%{transform:translate(-50%,0) rotate(-2deg)}50%{transform:translate(calc(-50% + 3px),-2px) rotate(2deg)}100%{transform:translate(-50%,0) rotate(-2deg)}}
#lock{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border:3px solid rgba(255,90,60,.9);border-radius:50%;box-shadow:0 0 10px rgba(255,90,60,.8)}
#lock::before,#lock::after{content:"";position:absolute;left:50%;top:-9px;width:3px;height:62px;margin-left:-1.5px;background:linear-gradient(180deg,rgba(255,90,60,.9) 14px,transparent 14px,transparent 48px,rgba(255,90,60,.9) 48px)}
#lock::after{transform:rotate(90deg)}
#lock b{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-family:var(--f-comic);font-size:15px;white-space:nowrap;text-shadow:2px 2px 0 var(--line)}
#arrow{position:absolute;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:26px solid #ff5a3c;margin:-13px 0 0 -14px;filter:drop-shadow(2px 2px 0 var(--line))}
/* commandes tactiles */
.pad{position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:rgba(5,8,26,.45);border:3px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,247,234,.9);border:3px solid var(--line)}
.pb{position:absolute;border-radius:50%;border:4px solid var(--line);font-family:var(--f-comic);font-size:17px;letter-spacing:.03em;display:grid;place-items:center;pointer-events:auto;touch-action:none;box-shadow:3px 3px 0 var(--line);opacity:.93;line-height:1;color:var(--line);padding:0}
.pb.on{transform:scale(.9);filter:brightness(1.3)}
.pb small{display:block;font-family:var(--f-ui);font-size:8.5px;font-weight:900;letter-spacing:0;margin-top:2px}
.rc{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:270px;height:250px;pointer-events:none}
.lc{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:240px;height:250px;pointer-events:none}
#bCoup{right:4px;bottom:26px;width:96px;height:96px;background:radial-gradient(circle at 35% 30%,#ff8a7a,var(--red));color:#fff;font-size:26px}
#bKi{right:110px;bottom:8px;width:72px;height:72px;background:radial-gradient(circle at 35% 30%,#fff2a0,var(--gold))}
#bGarde{right:194px;bottom:90px;width:64px;height:64px;background:radial-gradient(circle at 35% 30%,#c3ecff,var(--sky))}
#bGrab{right:12px;bottom:134px;width:68px;height:68px;background:radial-gradient(circle at 35% 30%,#a8ffd0,var(--green));font-size:13px}
#bCharge{right:194px;bottom:12px;width:64px;height:64px;background:radial-gradient(circle at 35% 30%,#ffd29a,var(--fire));font-size:15px}
#bPow{right:106px;bottom:170px;width:68px;height:68px;background:radial-gradient(circle at 35% 30%,#e3c4ff,var(--violet));color:#fff;font-size:15px;box-shadow:3px 3px 0 var(--line),0 0 16px rgba(163,92,255,.7)}
#bUp{left:166px;bottom:92px;width:62px;height:62px;background:#fff;font-size:22px}
#bDown{left:166px;bottom:18px;width:62px;height:62px;background:#fff;font-size:22px}
#bDash{right:110px;bottom:90px;width:72px;height:72px;background:radial-gradient(circle at 35% 30%,#ffffff,#9aa4d6);font-size:15px}
#spMenu{position:absolute;right:284px;bottom:70px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#spMenu button{border:4px solid var(--line);border-radius:14px;padding:8px 14px;min-width:178px;text-align:left;font-family:var(--f-comic);font-size:21px;letter-spacing:.04em;color:#fff;box-shadow:3px 3px 0 var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
#spMenu button small{font-family:var(--f-ui);font-size:11px;font-weight:900;background:rgba(0,0,0,.35);border-radius:6px;padding:2px 6px}
#spMenu button[disabled]{filter:grayscale(.85) brightness(.6)}
#sp1{background:linear-gradient(90deg,#2b6cff,#59c8ff)}
#sp2{background:linear-gradient(90deg,#ff5a1f,#ffb21f)}
#sp3{background:linear-gradient(90deg,#1aa3ff,#7af0ff);color:var(--line)!important}
.topbar{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px;pointer-events:auto}
.topbar button{border:3px solid var(--line);background:#fff;color:var(--line);border-radius:10px;width:42px;height:38px;font-weight:900;font-size:15px;box-shadow:2px 2px 0 var(--line)}

.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,26,.78);padding:16px;overflow:auto}
.panel .card{max-width:560px;width:100%;text-align:center;align-items:stretch;max-height:100%;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-weight:800;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;text-align:center;border-bottom:2px solid rgba(255,255,255,.08)}
.tbl th{font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.tbl td:first-child,.tbl th:first-child{text-align:left}
#rotate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#22306a,#0b1026 70%)}
#rotate .phone{width:70px;height:120px;border:6px solid var(--gold);border-radius:14px;margin:0 auto 22px;animation:rot 1.8s ease-in-out infinite;box-shadow:0 0 24px rgba(255,138,0,.6)}
@keyframes rot{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--night)}
@media (prefers-reduced-motion:reduce){#announce.on{animation-duration:1.4s}#mash{animation:none}}
</style>

<script>
/* =====================================================================
   MOTEUR 3D (WebGL2) — rendu instancié de formes simples
   Tout est dessiné avec des cubes, sphères, cylindres, cônes et disques,
   empilés via une pile de matrices (comme un vieux OpenGL).
   ===================================================================== */
'use strict';
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  lerp: (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k],
  dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
  hdist: (a, b) => Math.hypot(a[0] - b[0], a[2] - b[2])
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);
function hex(h, k) { const n = parseInt(h.slice(1), 16); const c = [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; return k == null ? c : c.map(v => Math.min(1, v * k)); }
function mixC(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }

/* ---------- matrices 4x4 (colonne majeure) ---------- */
const M4 = {
  ident() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(o, a, b) {
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    }
    return o;
  },
  persp(fov, asp, n, f) { const m = new Float32Array(16), t = 1 / Math.tan(fov / 2); m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m; },

      case 'blood': R.draw('ball', s * (0.6 + k * 0.4), s * (0.6 + k * 0.4) * 1.3, s * (0.6 + k * 0.4), P.col, 1, 0.15); break;
      case 'spark': case 'ki': case 'aura': R.draw('ball', s * k, s * k, s * k, P.col, k, 1, 0, 0, 0, 'add'); break;
      case 'fire': R.draw('ball', s, s, s, mixC([0.6, 0.15, 0.05], P.col, k), k, 1, 0, 0, 0, 'add'); break;
      case 'firefly': R.draw('ball', 0.35, 0.35, 0.35, P.col, 0.6 + 0.4 * Math.sin(P.ph * 4), 1, 0, 0, 0, 'add'); break;
      case 'ring': XF.rx(P.rx || 0); R.draw('cyl', s * (2 - k), 0.12, s * (2 - k), P.col, k * 0.8, 1, 0, 0, 0, 'add'); break;
      case 'dust': case 'smoke': R.draw('ball', s, s, s, P.col, Math.min(1, k * 1.4) * (P.kind === 'smoke' ? 0.5 : 0.38), 0.2, 0, 0, 0, 'alpha'); break;
      case 'debris': case 'rock': XF.ry(P.rot); XF.rx(P.rot * 0.7); R.draw('cube', s, s * 0.8, s, P.col); break;
      case 'leaf': XF.ry(P.rot); R.draw('cube', s, 0.05, s * 0.6, P.col, 1, 0.1); break;
    }
    XF.pop();
  }
  for (const b of W.booms) {
    const k = b.t / b.life, e = 1 - Math.pow(1 - Math.min(1, k * 1.6), 3), r = b.r * e;
    XF.push(); XF.t(b.p[0], b.p[1], b.p[2]);
    R.draw('sphere', r * 2, r * 2, r * 2, mixC(b.col, [0.3, 0.08, 0.02], k), (1 - k) * 0.9, 1, 0, 0, 0, 'add');
    R.draw('sphere', r * 1.2, r * 1.2, r * 1.2, [1, 0.95, 0.8], Math.max(0, 1 - k * 1.8), 1, 0, 0, 0, 'add');
    R.draw('cyl', r * 3.2, 0.3, r * 3.2, [1, 0.85, 0.6], Math.max(0, 0.7 - k), 1, 0, 0, 0, 'add');
    XF.pop();
  }
}
function drawDecals(W) {
  for (const d of W.decals) {
    XF.push(); XF.t(d.p[0], d.p[1], d.p[2]); XF.alignY(d.n);
    R.draw('disc', d.r * 2, 1, d.r * 2, d.col, d.a, 0.05, 5, d.kind, d.seed, 'alpha');
    XF.pop();
  }
  for (const r of W.rocks) { XF.push(); XF.t(r.p[0], r.p[1], r.p[2]); XF.ry(r.rot); XF.rz(0.4); R.draw('cube', r.s * 2, r.s, r.s * 1.6, r.col); XF.pop(); }
}

/* ---------------- mise à jour et dessin du monde ---------------- */
function updateWorld(W, dt) {
  W.t += dt;
  W.env.flash = Math.max(0, (W.env.flash || 0) - dt * 2.5);
  W.env.cheer = Math.max(0, (W.env.cheer || 0) - dt * 0.35);
  updateVehicles(W, dt);
  updateBuildings(W, dt);
  for (const tr of W.trees) if (tr.state === 'falling') { tr.t += dt; if (tr.t > 1.1) { tr.state = 'down'; W.treesDirty = true; addPart(W, [tr.x + tr.fall[0] * tr.h * 0.6, 1, tr.z + tr.fall[1] * tr.h * 0.6], [0, 2, 0], 'dust', { s: 4, life: 1.5 }); } }
  updateParts(W, dt);
}
function drawWorld(W, cam, focus) {
  // immeubles entre la caméra et le joueur : transparents
  for (const b of W.buildings) b.ghost = b.state === 'ok' && segHitsBox(cam.pos, focus, b);
  for (const b of W.buildings) {
    // on ne dessine pas ce qui est très loin derrière le brouillard
    if (Math.hypot(b.x - cam.pos[0], b.z - cam.pos[2]) > W.env.fogF + 60) continue;
    drawBuilding(b, W.night);
  }
  if (W.trees.length) { if (W.treesDirty) rebuildTrees(W); for (const tr of W.trees) if (tr.state === 'falling') drawTree(tr, W.night); }
  for (const c of W.cars) drawCar(c, W.night);
  for (const o of W.logs) drawLog(o, W.night);
  for (const p of W.planes) drawPlane(p, W.night, W.t);
  drawDecals(W);
  drawParts(W);
  // soleil ou lune, étoiles
  XF.reset();
  const sun = V3.norm(W.env.sun), sp = V3.add(cam.pos, V3.mul(sun, 1500));
  XF.push(); XF.t(sp[0], sp[1], sp[2]);
  if (W.night) { R.draw('sphere', 60, 60, 60, [0.9, 0.92, 1], 1, 1, 8, 0, 0, 'skyadd'); R.draw('sphere', 160, 160, 160, [0.12, 0.14, 0.22], 1, 1, 8, 0, 0, 'skyadd'); }
  else { R.draw('sphere', 90, 90, 90, [1, 0.95, 0.8], 1, 1, 8, 0, 0, 'skyadd'); R.draw('sphere', 260, 260, 260, [0.35, 0.3, 0.2], 1, 1, 8, 0, 0, 'skyadd'); }
  XF.pop();
  for (const s of W.stars) { XF.push(); XF.t(cam.pos[0] + s[0] * 1500, cam.pos[1] + s[1] * 1500, cam.pos[2] + s[2] * 1500); R.draw('ball', s[3] * 3, s[3] * 3, s[3] * 3, [0.9, 0.92, 1], 0.6 + 0.4 * Math.sin(W.t * 2 + s[3] * 9), 1, 8, 0, 0, 'skyadd'); XF.pop(); }
}
function treeStatics(W) { return W.treeStatic || []; }

function hudUpdate() {
  for (const f of G.F) {
    const h = f._hud; if (!h) continue;
    h.hp.style.width = Math.max(0, f.hp) + '%'; h.lag.style.width = Math.max(0, f.hpLag) + '%';
    h.hp.style.background = f.hp > 50 ? '' : f.hp > 25 ? 'linear-gradient(180deg,#ffe27a,#f2a900)' : 'linear-gradient(180deg,#ff8a8a,#e0232f)';
    for (let i = 0; i < 3; i++) { const v = clamp((f.ki - i * 100) / 100, 0, 1); h.ki[i].firstChild.style.width = v * 100 + '%'; h.ki[i].classList.toggle('full', v >= 1); }
    h.badge.hidden = !(f.trans > 0); if (f.trans > 0) h.badge.textContent = 'ÉVEIL ' + Math.ceil(f.trans);
  }
  $('timer').textContent = isFinite(G.timer) ? Math.ceil(G.timer) : '∞';
  const me = G.F[0], foeF = G.F[1];
  const cb = $('combo');
  if (me.chain >= 2) { if (cb._n !== me.chain) { cb._n = me.chain; cb.innerHTML = `${me.chain} COUPS !<small>${me.chain >= 10 ? 'INCROYABLE !' : ''}</small>`; } cb.style.opacity = 1; } else cb.style.opacity = 0;
  const mash = $('mash');

  // viseur sur l'adversaire
  const p = R.project(chest(foeF), VW, VH), lk = $('lock'), ar = $('arrow');
  const show = p && !p.behind && p.x > 10 && p.x < VW - 10 && p.y > 10 && p.y < VH - 10 && G.mode === 'fight' && !G.over;
  lk.hidden = !show;
  if (show) { lk.style.left = p.x + 'px'; lk.style.top = p.y + 'px'; $('lockd').textContent = Math.round(V3.dist(me.p, foeF.p)) + ' m'; }

  if (!ar.hidden) {

    const a = Math.atan2(dy, dx), r = Math.min(VW, VH) * 0.42;
    ar.style.left = VW / 2 + Math.cos(a) * r + 'px'; ar.style.top = VH / 2 + Math.sin(a) * r + 'px'; ar.style.transform = `rotate(${a + Math.PI / 2}rad)`;
  }
  // menu des coups puissants
  if (spOpen) { $('sp1').disabled = me.ki < 100; $('sp2').disabled = me.ki < 100; $('sp3').disabled = me.ki < 200; }
  $('bPow').style.opacity = me.ki >= 100 ? 1 : 0.55;
}

/* ---------------- boucle ---------------- */
let last = performance.now(), acc = 0, slowFrames = 0, perfT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // qualité adaptative : si le téléphone rame, on baisse la résolution
  perfT += dt; if (dt > 0.026) slowFrames++;
  if (perfT > 3) { if (slowFrames > 60 && scale > 1) { scale = Math.max(1, scale - 0.25); resize(); } perfT = 0; slowFrames = 0; }
  if (state === 'fight' && VW < VH && !paused && !G.over) pauseGame();
  if (G.W && !(state === 'fight' && paused)) {
    if (state === 'fight') {
      readInput();
      const me = G.F[0];
      if (G.intro > 0 || G.over) { for (const k in me.inp) me.inp[k] = k === 'mx' || k === 'my' || k === 'sp' ? 0 : false; }
      else Object.assign(me.inp, PIN);
      PIN.sp = 0;
    }
    acc += dt; let n = 0;
    while (acc >= 1 / 60 && n < 4) {
      if (G.intro > 0) { G.intro -= 1 / 60; G.F.forEach(f => { if (f.cpu) { for (const k in f.inp) f.inp[k] = k === 'mx' || k === 'my' || k === 'sp' ? 0 : false; } }); const c = G.F.map(f => f.cpu); G.F.forEach(f => f.cpu = false); step(1 / 60); G.F.forEach((f, i) => f.cpu = c[i]); }
      else step(1 / 60);
      handleEvents(); acc -= 1 / 60; n++;
    }
    if (acc > 0.1) acc = 0;
    // son de charge
    if (state === 'fight') { const me = G.F[0], other = G.F[1]; AU.charge(me.state === 'charge' || me.state === 'transform' || other.state === 'charge', me.trans > 0); }
    updateCamera(dt, VW < VH);
    drawScene();
    R.render(G.cam.view, G.W.env, G.W.statics.concat(treeStatics(G.W)), cv.width, cv.height, G.t);
    if (state === 'fight') {
      hudUpdate();
      if (G.over && G.over.t > 4.2 && !resultsShown) { resultsShown = true; results(); }
    }
  }
  requestAnimationFrame(loop);
