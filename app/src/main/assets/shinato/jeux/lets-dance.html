<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Boîte de nuit au néon : scène 3D en haut, piste de notes en bas, interface en verre fumé */
:root{
  --night:#07040f; --panel:rgba(16,8,32,.82); --line:rgba(255,255,255,.14);
  --ink:#fbf7ff; --dim:#b7a8d6;
  --l0:#ff3d9a; --l1:#2de2e6; --l2:#ffd23f; --l3:#9b5cff;
  --good:#7dffb0; --bad:#ff5a6e;
  --f-neon:"Monoton","Impact",system-ui,sans-serif;
  --f-ui:"Rubik","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#view,#lanes{position:fixed;inset:0;width:100%;height:100%;display:block}
#lanes{pointer-events:none}
button{font-family:var(--f-ui);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--l2);outline-offset:3px}
.neon{font-family:var(--f-neon);font-weight:400;letter-spacing:.04em;line-height:1;color:#fff;
  text-shadow:0 0 6px #fff,0 0 14px var(--l0),0 0 30px var(--l0),0 0 60px var(--l3)}

/* Écrans */
.screen{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:linear-gradient(180deg,rgba(7,4,15,.15),rgba(7,4,15,.55) 45%,rgba(7,4,15,.92));}
.wrap{min-height:100%;box-sizing:border-box;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px;justify-content:flex-end;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.title-wrap{justify-content:center;align-items:center;text-align:center;gap:22px}
.logo{font-size:clamp(46px,13vw,120px);animation:flick 5s infinite}
.logo small{display:block;font-size:.34em;margin-top:.25em;color:#fff;text-shadow:0 0 6px #fff,0 0 16px var(--l1),0 0 34px var(--l1)}
@keyframes flick{0%,91%,95%,100%{opacity:1}93%{opacity:.55}}
.press{border:2px solid rgba(255,255,255,.6);background:rgba(255,61,154,.15);border-radius:999px;padding:14px 30px;font-size:16px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;animation:pulse 1.6s ease-in-out infinite;box-shadow:0 0 24px rgba(255,61,154,.45)}
@keyframes pulse{50%{opacity:.55}}
.hint{color:var(--dim);font-size:13px;line-height:1.5;margin:0}
.h1{font-size:clamp(26px,6vw,40px);font-weight:800;margin:0;letter-spacing:.01em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.songs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.song{position:relative;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;overflow:hidden;backdrop-filter:blur(6px)}
.song::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.song b{font-size:22px;font-weight:800}
.song .art{color:var(--dim);font-size:14px}
.song .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.song .best{font-size:13px;font-weight:700;color:var(--c)}
.song[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 26px color-mix(in srgb,var(--c) 45%,transparent)}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:11px 12px;font-weight:800;font-size:14px;color:var(--dim);min-width:84px;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:#fff;color:#170a2e}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.opt label{font-size:13px;font-weight:700;color:var(--dim);display:flex;justify-content:space-between}
.opt input[type=range]{width:100%;accent-color:var(--l0)}
.go{border:0;border-radius:16px;padding:16px 34px;font-size:20px;font-weight:800;letter-spacing:.06em;color:#170a2e;background:linear-gradient(90deg,var(--l2),var(--l0));box-shadow:0 0 28px rgba(255,61,154,.55)}
.go:active{transform:scale(.97)}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px}

.hud-r{display:flex;align-items:center;gap:10px;pointer-events:auto}
.pausebtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:800}
.prog{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.08)}

.groove{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(74px + env(safe-area-inset-top,0px));width:min(38vw,220px);display:flex;flex-direction:column;gap:4px}

.groove .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.groove .bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--l3),var(--l0),var(--l2));transition:width .15s}
.groove.fever span{color:var(--l2);text-shadow:0 0 10px var(--l2)}
.count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(90px,26vw,200px)}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,4,15,.72);backdrop-filter:blur(4px);padding:16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stats div{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px}
.stats b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.rec{color:var(--l2);font-weight:800;letter-spacing:.1em;text-shadow:0 0 12px var(--l2)}
@media (prefers-reduced-motion:reduce){.logo,.press{animation:none}}
</style>
