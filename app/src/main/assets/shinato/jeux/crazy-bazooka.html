<style>
/* Arène de baston façon BD : jaune explosif, contours épais, ombres portées */
:root{
  --ink:#fff8ec; --dark:#120c1c; --panel:#1f1530; --line:#120c1c;
  --boom:#ffd23f; --hot:#ff4d2e; --pink:#ff3d9a; --cyan:#2de2e6; --green:#2fbf71;
  --dim:#c9bfe0;
  --f-comic:"Bangers","Impact",system-ui,sans-serif;
  --f-ui:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#120c1c;color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--f-ui);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--boom);outline-offset:3px}
.comic{font-family:var(--f-comic);letter-spacing:.03em;font-weight:400}
.screen{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:
  repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,210,63,.07) 0 6deg,transparent 6deg 12deg),
  radial-gradient(80% 70% at 50% 35%,#3a1d5a,#120c1c 75%)}
.screen.ingame{background:rgba(18,12,28,.55);backdrop-filter:blur(3px)}
.wrap{min-height:100%;box-sizing:border-box;max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.center{justify-content:center;align-items:center;text-align:center}
.logo{font-family:var(--f-comic);font-size:clamp(64px,15vw,150px);line-height:.85;margin:0;color:var(--boom);transform:rotate(-4deg);
  -webkit-text-stroke:4px var(--dark);text-shadow:6px 6px 0 var(--hot),12px 12px 0 var(--dark);letter-spacing:.02em}
.logo span{display:block;color:#fff;font-size:.62em;text-shadow:5px 5px 0 var(--pink),10px 10px 0 var(--dark)}
.btn{border:4px solid var(--dark);border-radius:14px;padding:12px 26px;font-family:var(--f-comic);font-size:26px;letter-spacing:.06em;color:var(--dark);background:var(--boom);box-shadow:5px 5px 0 var(--dark);transform:rotate(-1deg)}
.btn:active{transform:translate(3px,3px) rotate(-1deg);box-shadow:2px 2px 0 var(--dark)}
.btn.red{background:var(--hot);color:#fff}
.btn.ghost{background:#fff;font-size:20px;padding:9px 18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.h1{font-family:var(--f-comic);font-size:clamp(30px,6vw,46px);margin:0;letter-spacing:.04em;color:#fff;text-shadow:3px 3px 0 var(--dark)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--boom)}
.hint{color:var(--dim);font-size:13.5px;line-height:1.5;margin:0;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:820px){.chars{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ch{position:relative;border:4px solid var(--dark);background:var(--c);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:4px 4px 0 var(--dark);overflow:hidden}
.ch canvas{width:100%;aspect-ratio:1/1;max-width:120px}
.ch b{font-family:var(--f-comic);font-size:22px;letter-spacing:.04em;color:#fff;text-shadow:2px 2px 0 var(--dark)}
.ch small{font-size:11px;font-weight:900;color:var(--dark);background:rgba(255,255,255,.75);border-radius:6px;padding:1px 6px}
.ch[aria-pressed="true"]{outline:4px solid #fff;transform:translateY(-3px) rotate(-1.5deg)}
.ch .tag{position:absolute;top:4px;left:4px;font-family:var(--f-comic);font-size:16px;background:var(--dark);color:var(--boom);border-radius:6px;padding:1px 7px}
.info{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.info{grid-template-columns:1fr}}
.card{background:var(--panel);border:4px solid var(--dark);border-radius:16px;padding:14px;box-shadow:5px 5px 0 var(--dark);display:flex;flex-direction:column;gap:10px}
.stat{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:center;font-weight:800;font-size:13px}
.stat i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--boom),var(--hot));border:2px solid var(--dark)}
.stat span:last-child{background:rgba(255,255,255,.08);border-radius:6px}
.moves{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;font-weight:700}
.moves b{color:var(--boom);font-family:var(--f-comic);font-size:16px;letter-spacing:.04em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:3px solid var(--dark);background:#fff;color:var(--dark);border-radius:10px;padding:8px 12px;font-weight:900;font-size:14px;box-shadow:3px 3px 0 var(--dark)}
.seg button[aria-pressed="true"]{background:var(--boom)}
.opt{display:flex;flex-direction:column;gap:6px}
.opt>span{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
/* Commandes tactiles */
.pad{position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(18,12,28,.45);border:3px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,248,236,.9);border:3px solid var(--dark)}
.btns{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:220px;height:200px;pointer-events:none}
.pb{position:absolute;border-radius:50%;border:4px solid var(--dark);font-family:var(--f-comic);font-size:24px;display:grid;place-items:center;pointer-events:auto;touch-action:none;box-shadow:3px 3px 0 var(--dark);opacity:.92;line-height:1}
.pb small{display:block;font-family:var(--f-ui);font-size:9px;font-weight:900;letter-spacing:.05em}
.pb.on{transform:scale(.92);filter:brightness(1.25)}
#bA{right:0;bottom:46px;width:84px;height:84px;background:var(--hot);color:#fff;font-size:34px}
#bB{right:96px;bottom:4px;width:70px;height:70px;background:var(--cyan);color:var(--dark)}
#bJ{right:88px;bottom:100px;width:68px;height:68px;background:var(--green);color:var(--dark);font-size:20px}
#bI{right:8px;bottom:142px;width:56px;height:56px;background:var(--boom);color:var(--dark);font-size:13px}
#bS{right:162px;bottom:146px;width:66px;height:66px;background:#fff;color:var(--dark);font-size:18px}
#bS small{font-size:8.5px;letter-spacing:0}
.topbar{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px;pointer-events:auto}
.topbar button{border:3px solid var(--dark);background:#fff;color:var(--dark);border-radius:10px;width:44px;height:40px;font-weight:900;font-size:16px;box-shadow:2px 2px 0 var(--dark)}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,12,28,.75);padding:16px}
.panel .card{max-width:420px;width:100%;text-align:center;align-items:stretch}
.winner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:620px){.winner{grid-template-columns:1fr;text-align:center;justify-items:center}}
.tbl{width:100%;border-collapse:collapse;font-weight:800;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;text-align:center;border-bottom:2px solid rgba(255,255,255,.08)}
.tbl th{font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.tbl td:first-child,.tbl th:first-child{text-align:left}
@media (prefers-reduced-motion:reduce){.ch[aria-pressed="true"]{transform:none}}
</style>

function schedMusic() {

    const s = mStep % 16, bar = Math.floor(mStep / 16) % 4, root = [40, 40, 43, 38][bar];

    if (s % 2 === 0) tone('sawtooth', 440 * Math.pow(2, (root + MP[(s / 2) % 8] - 69) / 12), 440 * Math.pow(2, (root + MP[(s / 2) % 8] - 69) / 12), sp * 1.6, 0.25, musicG, mNext);

}

{

        <div class="opt"><span>Arène</span><div class="seg" id="stg">${STAGES.map((s, i) => `<button data-v="${i}" aria-pressed="${setup.stage === i}">${esc(s.name)}</button>`).join('')}</div></div>
        <div class="opt"><span>Vies</span><div class="seg" id="stk">${[1, 2, 3, 4, 5].map(n => `<button data-v="${n}" aria-pressed="${setup.stocks === n}">${n}</button>`).join('')}</div></div>
        <div class="opt"><span>Objets</span><div class="seg" id="itm">${['Aucun', 'Normal', 'Beaucoup'].map((n, i) => `<button data-v="${i}" aria-pressed="${setup.items === i}">${n}</button>`).join('')}</div></div>
        <div class="row" style="justify-content:space-between"><button class="btn ghost" id="back">Retour</button><button class="btn red" id="fight">COMBAT !</button></div>
      </div>
    </div>
    <p class="hint">Commandes : joystick pour bouger, A attaque (direction + A = autre coup), B spécial, SAUT (deux fois en l'air), OBJET pour ramasser ou lancer, BOUCLIER (maintenu) pour bloquer — attention, il s'use et peut casser ! Clavier : flèches ou ZQSD, Espace saut, J attaque, K spécial, L objet, U ou Maj bouclier.</p>
  </div>`);
  scr.querySelectorAll('[data-pc]').forEach(c => portrait(c, CHARS[+c.dataset.pc], 0.3));
  scr.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { setup[selFor] = +b.dataset.c; SFX.beep(660); if (selFor === 'p1') selFor = 'cpu'; save(); selectScreen(); }));
  scr.querySelectorAll('[data-for]').forEach(b => b.addEventListener('click', () => { selFor = b.dataset.for; selectScreen(); }));
  const segBind = (id, key) => $(id).querySelectorAll('button').forEach(b => b.addEventListener('click', () => { setup[key] = +b.dataset.v; save(); SFX.beep(520); selectScreen(); }));
  segBind('lvl', 'lvl'); segBind('stg', 'stage'); segBind('stk', 'stocks'); segBind('itm', 'items');
  $('back').addEventListener('click', titleScreen);
  $('fight').addEventListener('click', () => { SFX.beep(990); startFight(); });
}
function save() { store.set('cb-setup', setup); }
function startFight() {
  initAudio();
  W = newWorld(STAGES[setup.stage], [{ ch: CHARS[setup.p1], cpu: false }, { ch: CHARS[setup.cpu], cpu: true, lvl: setup.lvl }], { stocks: setup.stocks, items: setup.items });
  W.f[0].inp = P1;
  updateCam(W, 0, true);
  hideScreen(); $('pad').hidden = false;
  state = 'count'; countT = 3.2; paused = false; lastCount = 4;
  music(true);
}
let lastCount = 4;
function results() {
  state = 'results'; $('pad').hidden = true; music(false);
  const win = W.f[W.over.winner], lose = W.f[1 - W.over.winner], youWin = win.slot === 0;
  show(`<div class="wrap center">
    <h2 class="logo" style="font-size:clamp(54px,12vw,110px)">${youWin ? 'VICTOIRE !' : 'DÉFAITE…'}</h2>
    <div class="card" style="width:100%;max-width:640px">
      <div class="winner"><canvas id="winPc" style="width:120px;height:120px;background:${win.ch.color};border:4px solid #120c1c;border-radius:14px"></canvas>
        <div style="text-align:left"><span class="eyebrow">Gagnant</span><div class="h1">${esc(win.ch.name)} ${win.cpu ? '(CPU)' : '(Toi)'}</div><p class="hint">${esc(win.ch.title)} · ${win.stocks} vie${win.stocks > 1 ? 's' : ''} restante${win.stocks > 1 ? 's' : ''}</p></div></div>
      <table class="tbl"><thead><tr><th>Combattant</th><th>KO</th><th>Chutes</th><th>Dégâts infligés</th></tr></thead>
        <tbody>${W.f.map(f => `<tr><td>${esc(f.ch.name)}${f.cpu ? ' (CPU)' : ''}</td><td>${f.stats.kos}</td><td>${f.stats.falls}</td><td>${Math.round(f.stats.dealt)} %</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="change">Changer de perso</button><button class="btn red" id="again">REVANCHE !</button></div>
  </div>`);
  portrait($('winPc'), win.ch, 0.5);
  $('again').addEventListener('click', () => { SFX.beep(990); startFight(); });
  $('change').addEventListener('click', () => { selFor = 'p1'; selectScreen(); });
  if (youWin) { const r = store.get('cb-wins', 0) + 1; store.set('cb-wins', r); }
}
function pauseGame() {
  if (state !== 'fight' || paused) return;
  paused = true; music(false);
  $('panelBody').innerHTML = `<span class="h1">PAUSE</span><button class="btn" id="pRes">Reprendre</button><button class="btn ghost" id="pRe">Recommencer</button><button class="btn ghost" id="pQuit">Quitter le combat</button>`;
  $('panel').hidden = false;
  $('pRes').addEventListener('click', () => { $('panel').hidden = true; paused = false; music(true); });
  $('pRe').addEventListener('click', () => { $('panel').hidden = true; startFight(); });
  $('pQuit').addEventListener('click', () => { $('panel').hidden = true; paused = false; W = null; selectScreen(); });
}
$('pause').addEventListener('click', pauseGame);
$('mute').addEventListener('click', () => { initAudio(); setMuted(!muted); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* =====================================================================
   BOUCLE
   ===================================================================== */
let last = performance.now(), acc = 0, menuW = null;
function menuWorld() {
  if (!menuW) { menuW = newWorld(STAGES[0], [{ ch: CHARS[0], cpu: true, lvl: 1 }, { ch: CHARS[1], cpu: true, lvl: 1 }], { stocks: 99, items: 1 }); menuW.f.forEach(f => { f.inv = 0; }); }
  return menuW;
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (W && (state === 'fight' || state === 'count' || state === 'over')) {
    readInput();
    if (state === 'count') {
      countT -= dt;
      const n = Math.ceil(countT - 0.2);
      if (n !== lastCount) { lastCount = n; if (n > 0) SFX.beep(520); else SFX.beep(1040); }
      W.f.forEach(f => { f.inp = f.cpu ? f.inp : P1; });
      if (countT <= 0.2) state = 'fight';
    }
    if (state !== 'count' && !paused) {
      acc += dt; let n = 0;
      while (acc >= 1 / 60 && n < 5) { step(W, 1 / 60); handleEvents(W); acc -= 1 / 60; n++; }
      if (W.over && W.overT <= 0 && state !== 'over') { state = 'over'; setTimeout(results, 400); }
    }
    updateCam(W, dt);
    render(W, t, dt);
    if (state === 'count') {
      const n = Math.ceil(countT - 0.2);
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      g.font = `${Math.min(VW, VH) * 0.3}px Bangers, Impact, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 14; g.strokeStyle = '#120c1c'; const txt = n > 0 ? n : 'GO !';
      g.strokeText(txt, VW / 2, VH / 2); g.fillStyle = '#ffd23f'; g.fillText(txt, VW / 2, VH / 2);
    }
    if (W.over && state === 'fight' || state === 'over') {
      g.setTransform(DPR, 0, 0, DPR, 0, 0); g.font = `${Math.min(VW, VH) * 0.22}px Bangers, Impact, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 12; g.strokeStyle = '#120c1c'; g.strokeText('JEU !', VW / 2, VH / 2); g.fillStyle = '#ff4d2e'; g.fillText('JEU !', VW / 2, VH / 2);
    }
  } else {
    // démo en fond des menus
    const D = menuWorld();
    acc += dt; let n = 0; while (acc >= 1 / 60 && n < 3) { step(D, 1 / 60); acc -= 1 / 60; n++; }
    D.events.length = 0;
    updateCam(D, dt);
    render(D, t, dt);
  }
  requestAnimationFrame(loop);
}
titleScreen();
window.__cb = { get W() { return W; }, get state() { return state; }, setup };
requestAnimationFrame(loop);
})();
</script>
