  m.innerHTML = `<span class="h1" style="font-size:32px">Menu</span>
    <div class="opt"><span>Scènes de combat</span><div class="seg" id="anm"><button data-v="1" aria-pressed="${setup.anim}">Oui</button><button data-v="0" aria-pressed="${!setup.anim}">Non</button></div></div>
    <div class="opt"><span>Vitesse de l'ennemi</span><div class="seg" id="spd"><button data-v="0" aria-pressed="${!setup.fast}">Normale</button><button data-v="1" aria-pressed="${setup.fast}">Rapide</button></div></div>
    <div class="opt"><span>Son</span><div class="seg" id="snd"><button data-v="1" aria-pressed="${!AU.muted}">Oui</button><button data-v="0" aria-pressed="${AU.muted}">Non</button></div></div>
    <div class="row"><button class="btn" id="mRes">Reprendre</button><button class="btn ghost" id="mHelp">Comment jouer</button><button class="btn ghost" id="mQuit">Quitter (sauvegardé)</button></div>`;
  const seg = (id, f) => $(id).querySelectorAll('button').forEach(b => b.addEventListener('click', () => { f(b.dataset.v); save(); pauseMenu(); }));
  seg('anm', v => setup.anim = v === '1'); seg('spd', v => setup.fast = v === '1'); seg('snd', v => { AU.setMuted(v === '0'); AU.music(v === '1'); });
  $('modal').hidden = false;
  $('mRes').addEventListener('click', () => { $('modal').hidden = true; });
  $('mHelp').addEventListener('click', () => helpPanel(pauseMenu));
  $('mQuit').addEventListener('click', () => { $('modal').hidden = true; if (G.turn === 0) saveGame(); anims = []; ai = null; title(); });
}

/* =====================================================================
   BOUCLE
   ===================================================================== */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.map && mode !== 'title' && mode !== 'setup' && mode !== 'results') {
    const pausedMenu = !$('modal').hidden && mode === 'ai';
    if (!pausedMenu) { const busyA = runAnims(dt); if (!busyA && mode === 'ai' && ai) aiNext(); }
    const inBattle = anims[0] && anims[0].type === 'battle';
    $('hud').style.visibility = inBattle ? 'hidden' : '';
    if (inBattle) { g.setTransform(DPR, 0, 0, DPR, 0, 0); drawBattle(g, anims[0].B, VW, VH); }
    else drawMap(dt, t);
    if (Math.random() < 0.05) hudUpdate();
  } else {
    // fond animé des menus
    g.fillStyle = '#1b2016'; g.fillRect(0, 0, VW, VH);
  }
  requestAnimationFrame(loop);
}
resize(); title();
window.__ot = { G, setup, get mode() { return mode; }, get sel() { return sel; }, onTap, startBattle, get anims() { return anims; }, endPlayerTurn, confirmEnd, get TS() { return TS; }, cam };
requestAnimationFrame(loop);
})();
</script>
