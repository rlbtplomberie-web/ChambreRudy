<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Combat sur les toits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--nuit:#141a30;--zinc:#9aa3b2;--sodium:#ffb347;--rouge:#d8433a;--canard:#2aa39a;--blanc:#f4efe6}
html,body{margin:0;height:100%;overflow:hidden;background:var(--nuit);touch-action:none;user-select:none;-webkit-user-select:none;font-family:Anton,"Arial Narrow",Impact,sans-serif;color:var(--blanc)}
canvas{display:block;position:absolute;inset:0}
#hud{position:absolute;top:10px;left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;pointer-events:none}
.bar{height:16px;background:#0008;border:2px solid #ffffff40;border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;top:0;bottom:0;transition:width .15s}
.bar b{position:absolute;top:0;bottom:0;background:#fff6;transition:width .6s .25s}
#p1 .bar i,#p1 .bar b{right:0}#p2 .bar i,#p2 .bar b{left:0}
#p1 .bar i{background:linear-gradient(90deg,#ff7a4f,var(--rouge))}
#p2 .bar i{background:linear-gradient(90deg,var(--canard),#6fe0d4)}
.name{font-size:17px;letter-spacing:.03em;margin-top:3px;display:flex;gap:6px;align-items:center;text-shadow:0 2px 0 #000}
#p1 .name{justify-content:flex-end}
.pip{width:9px;height:9px;border-radius:50%;border:2px solid #fff8}
.pip.on{background:var(--sodium);border-color:var(--sodium)}
#clock{font-size:34px;line-height:1;min-width:52px;text-align:center;text-shadow:0 3px 0 #000}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
#msg .big{font-size:clamp(48px,12vw,110px);line-height:.95;color:var(--blanc);text-shadow:0 5px 0 var(--rouge),0 10px 24px #000}
#msg .small{font-size:clamp(16px,3.4vw,24px);margin-top:8px;color:var(--sodium);text-shadow:0 2px 0 #000;font-family:system-ui,sans-serif;font-weight:700}
#again{pointer-events:auto;margin-top:16px;padding:10px 26px;border:0;border-radius:24px;background:var(--sodium);color:#231400;font:20px Anton,Impact,sans-serif;box-shadow:0 5px 0 #8a5410;display:none}
#joy{position:absolute;left:18px;bottom:18px;width:118px;height:118px;border-radius:50%;background:#0a0e1c99;border:2px solid #ffffff30;touch-action:none;z-index:3}
#jzone{position:absolute;left:0;bottom:0;width:42%;height:62%;touch-action:none;z-index:2}
#pad{z-index:4}
*{-webkit-touch-callout:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--blanc);box-shadow:0 3px 8px #000a}
#pad{position:absolute;right:16px;bottom:16px;display:grid;grid-template-columns:repeat(2,64px);grid-template-rows:repeat(2,64px);gap:10px}
#pad button{border:0;border-radius:50%;font:15px Anton,Impact,sans-serif;color:#fff;box-shadow:0 4px 0 #0009;touch-action:none;letter-spacing:.02em}
#pad button.on{transform:translateY(3px);box-shadow:0 1px 0 #0009}
#bPoing{background:var(--rouge)}#bPied{background:#e0762e}#bGarde{background:#3e5b8f}#bSaut{background:#5d6778}
#help{position:absolute;bottom:6px;left:0;right:0;text-align:center;font:12px system-ui,sans-serif;opacity:.55;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bar i,.bar b{transition:none}}

/* ---- borne d'arcade du Pixel Bar autour de l'écran ---- */
body{background:radial-gradient(ellipse at 50% 40%,#231a2e,#07050b 75%)}
#cab{position:fixed;inset:0;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:0 clamp(8px,1.6vw,18px);box-sizing:border-box;
  background:linear-gradient(90deg,#0c0a12,#1b1726 8%,#141120 50%,#1b1726 92%,#0c0a12);
  box-shadow:inset 3px 0 0 #3d5cff,inset -3px 0 0 #3d5cff,inset 0 0 40px #3d5cff33}
#marquee{height:clamp(30px,8vh,54px);margin:0 -2px;display:flex;align-items:center;justify-content:center;gap:.35em;
  font:clamp(20px,5.2vh,38px)/1 Anton,Impact,sans-serif;letter-spacing:.04em;
  background:linear-gradient(#1a1030,#0f0a1c);border-bottom:3px solid #000;box-shadow:inset 0 -6px 18px #7a4dff40,0 0 18px #7a4dff55}
#marquee .r{color:#ff3b2f;text-shadow:0 0 8px #ff3b2f,0 2px 0 #000}#marquee .g{color:#3ce04a;text-shadow:0 0 8px #3ce04a,0 2px 0 #000}
#bezel{position:relative;min-height:0;min-width:0;margin:clamp(6px,1.4vh,12px) 0;border-radius:18px;padding:clamp(6px,1.2vh,10px);background:#050508;
  box-shadow:0 0 0 2px #2a2f45,0 0 22px #3d6bff99,inset 0 0 12px #000}
#screen{position:absolute;inset:clamp(6px,1.2vh,10px);overflow:hidden;border-radius:10px;background:#0b0e1c;box-shadow:0 0 30px #3d6bff66}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:10px;
  background:repeating-linear-gradient(transparent 0 2px,#0000000f 2px 3px),radial-gradient(ellipse at center,transparent 65%,#00000059);z-index:5}
#panel{height:clamp(22px,6vh,42px);display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,18px);
  background:linear-gradient(#221c33,#120f1c);border-top:2px solid #3d5cff;margin:0 -2px;clip-path:polygon(2% 0,98% 0,100% 100%,0 100%)}
#panel span{width:clamp(9px,2.4vh,16px);height:clamp(9px,2.4vh,16px);border-radius:50%;box-shadow:inset 0 -3px 0 #0006,0 0 8px currentColor;background:currentColor}
#panel .stick{width:clamp(6px,1.4vh,9px);height:clamp(14px,3.8vh,26px);border-radius:4px;background:#222;box-shadow:0 -6px 0 2px #d8322a;margin-right:clamp(10px,4vw,40px)}
/* ---- écran titre ---- */
#title{position:absolute;inset:0;z-index:6;background:#2b2b31;display:flex;align-items:flex-end;justify-content:center}
#title img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#title::before{content:"";position:absolute;inset:0;background:var(--img) center/cover;filter:blur(18px) brightness(.55)}
#start{position:relative;margin-bottom:6%;padding:.35em 1.4em;border:4px solid #000;border-radius:14px;background:#ffd23f;color:#141414;
  font:clamp(24px,7vh,46px)/1 Anton,Impact,sans-serif;letter-spacing:.05em;box-shadow:0 6px 0 #000,0 0 24px #ffd23faa;cursor:pointer;animation:blink 1.1s steps(2,end) infinite}
#start:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
#start:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes blink{50%{background:#fff3b0}}
@media (prefers-reduced-motion:reduce){#start{animation:none}}
.hide{display:none!important}

/* ---- mode horizontal forcé : la borne est tournée quand le téléphone est tenu en vertical ---- */
body.rot #cab{inset:auto;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
body.rot #marquee{height:clamp(30px,8vw,54px);font-size:clamp(20px,5.2vw,38px)}
body.rot #panel{height:clamp(22px,6vw,42px)}
body.rot #bezel{margin:clamp(6px,1.4vw,12px) 0}
body.rot #screen{inset:clamp(6px,1.2vw,10px)}
body.rot #start{font-size:clamp(24px,7vw,46px)}
#rotBtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:2px solid #7a4dff;background:#120c22;color:#fff;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 0 10px #7a4dff66}
#rotBtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
#marquee{position:relative}
</style>
</head>
<body>
<div id="cab">
<div id="marquee"><span class="r">FIVE</span><span class="g">FIGHT</span><button id="rotBtn" aria-label="Tourner l'écran" title="Tourner l'écran">⟳</button></div>
<div id="bezel"><div id="screen">
<div id="hud">
  <div id="p1"><div class="bar"><b></b><i></i></div><div class="name"><span class="pips"></span>Toi</div></div>
  <div id="clock">60</div>
  <div id="p2"><div class="bar"><b></b><i></i></div><div class="name">Le rival<span class="pips"></span></div></div>
</div>
<div id="msg"><div class="big"></div><div class="small"></div><button id="again">Rejouer</button></div>
<div id="joy"><div id="knob"></div></div>
<div id="pad"><button id="bGarde">Garde</button><button id="bSaut">Saut</button><button id="bPoing">Poing</button><button id="bPied">Pied</button></div>
<div id="help">Clavier : flèches pour bouger et sauter, A poing, Z pied, E garde</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================== SCÈNE : un toit de zinc la nuit ==================
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(1.25,devicePixelRatio||1));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
const SCREEN=document.getElementById('screen');SCREEN.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x141a30);scene.fog=new THREE.Fog(0x141a30,14,48);
const camera=new THREE.PerspectiveCamera(42,1,0.1,200);
function resize(){const w=SCREEN.clientWidth,hh=SCREEN.clientHeight;renderer.setSize(w,hh);camera.aspect=w/hh;camera.fov=camera.aspect<1?60:42;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();if(window.ResizeObserver)new ResizeObserver(resize).observe(SCREEN);

scene.add(new THREE.HemisphereLight(0x5a6fa8,0x1a1410,0.55));
const moon=new THREE.DirectionalLight(0xaec4ff,0.55);moon.position.set(-8,14,6);scene.add(moon);
const lamp=new THREE.PointLight(0xffb347,2.2,16,1.6);lamp.position.set(0,4.2,-2.6);lamp.castShadow=true;lamp.shadow.mapSize.set(1024,1024);scene.add(lamp);
const rim=new THREE.PointLight(0xff6a3d,0.9,12);rim.position.set(0,2,5);scene.add(rim);

const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,metalness:.05,...o});
// toit
const roof=new THREE.Mesh(new THREE.BoxGeometry(8,0.4,6),M(0x7d8696,{metalness:.35,roughness:.55}));roof.position.y=-0.2;roof.receiveShadow=true;scene.add(roof);
for(let i=-3.9;i<=3.9;i+=0.6){const s=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.03,6),M(0x9aa3b2,{metalness:.5}));s.position.set(i,0.015,0);scene.add(s)}
// muret de bord
const wallM=M(0x5b4a44);
[[0,0.25,3.1,8,0.5,0.2],[0,0.25,-3.1,8,0.5,0.2]].forEach(([x,y,z,w,h,d])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallM);m.position.set(x,y,z);m.receiveShadow=true;scene.add(m)});
// cheminées
function chimney(x,z,h){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(0.9,h,0.6),M(0x8c4a36));b.position.y=h/2;b.castShadow=true;g.add(b);
  for(let k=-1;k<=1;k++){const p=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,0.35,10),M(0xb0603f));p.position.set(k*0.26,h+0.17,0);g.add(p)}
  g.position.set(x,0,z);scene.add(g)}
chimney(-3.1,-2.4,1.6);chimney(2.7,-2.5,2.1);
// réverbère derrière
const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,4.2,8),M(0x222831));pole.position.set(0,2.1,-2.9);scene.add(pole);
const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,12),new THREE.MeshBasicMaterial({color:0xffd08a}));bulb.position.set(0,4.2,-2.6);scene.add(bulb);
// ville au loin : immeubles avec fenêtres allumées
function winTex(){const c=document.createElement('canvas');c.width=64;c.height=128;const x=c.getContext('2d');x.fillStyle='#1c2238';x.fillRect(0,0,64,128);
  for(let yy=6;yy<124;yy+=10)for(let xx=5;xx<60;xx+=10){if(Math.random()<.42){x.fillStyle=Math.random()<.7?'#ffc46b':'#fff1c4';x.fillRect(xx,yy,5,6)}}
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;return t}
// façade de l'immeuble sous le toit : on peut tomber dans le vide de chaque côté
const facade=new THREE.Mesh(new THREE.BoxGeometry(8,30,6),new THREE.MeshStandardMaterial({color:0x2c3350,emissive:0xffffff,emissiveMap:winTex(),emissiveIntensity:.5,roughness:1}));facade.position.y=-15.4;scene.add(facade);
const EDGE=4.0;
for(let i=0;i<46;i++){const w=1.5+Math.random()*2.5,h=3+Math.random()*9,d=1.5+Math.random()*2;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:0x2a3150,emissive:0xffffff,emissiveMap:winTex(),emissiveIntensity:.9,roughness:1}));
  const ang=Math.random()*Math.PI*1.1+Math.PI*0.95,r=16+Math.random()*16;b.position.set(Math.cos(ang)*r*1.4,h/2-6,Math.sin(ang)*r-4);scene.add(b)}
const moonDisc=new THREE.Mesh(new THREE.CircleGeometry(1.6,32),new THREE.MeshBasicMaterial({color:0xf3ecd8,fog:false}));moonDisc.position.set(-14,13,-34);scene.add(moonDisc);
const stars=new THREE.BufferGeometry();const sp=[];for(let i=0;i<400;i++){sp.push((Math.random()-.5)*120,8+Math.random()*40,-40-Math.random()*20)}
stars.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xffffff,size:.12,fog:false})));

// ================== COMBATTANTS ==================
function limb(len,r,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,len,10),mat);m.position.y=-len/2;m.castShadow=true;return m}
function makeFighter(o){
  const skin=M(o.skin),top=M(o.top),pants=M(o.pants),shoe=M(0x1b1b1f),hair=M(o.hair);
  const root=new THREE.Group(),body=new THREE.Group();root.add(body);
  const pelvis=new THREE.Group();pelvis.position.y=0.98;body.add(pelvis);
  const hipM=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.2,0.26),pants);hipM.castShadow=true;pelvis.add(hipM);
  const torso=new THREE.Group();torso.position.y=0.08;pelvis.add(torso);
  const chest=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.6,0.3),top);chest.position.y=0.34;chest.castShadow=true;torso.add(chest);
  const headG=new THREE.Group();headG.position.y=0.72;torso.add(headG);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.07,.08,.12,8),skin);neck.position.y=0.02;headG.add(neck);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.17,16,14),skin);head.scale.set(1,1.12,1.02);head.position.y=0.2;head.castShadow=true;headG.add(head);
  if(o.hair!==null&&!o.bald){const h=new THREE.Mesh(new THREE.SphereGeometry(0.18,14,10,0,Math.PI*2,0,Math.PI*0.55),hair);h.position.y=0.23;h.scale.set(1.02,1.05,1.05);headG.add(h)}
  if(o.beard){const bd=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.1,0.06),hair);bd.position.set(0,0.1,0.14);headG.add(bd)}

  if(phase==='fin'&&phaseT>2.6){if(P1.wins>=2||P2.wins>=2){phase='match';say(P1.wins>=2?'Victoire':'Défaite',P1.wins>=2?'Tu as gagné le combat':'Le rival a gagné le combat');again.style.display='inline-block'}else{round++;startRound()}}
  // étincelles
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.userData.l-=dt;s.userData.v.y-=9*dt;s.position.addScaledVector(s.userData.v,dt);s.scale.setScalar(Math.max(.01,s.userData.l*3));if(s.userData.l<=0){scene.remove(s);sparks.splice(i,1)}}
  // caméra qui suit les deux combattants
  const mid=(P1.x+P2.x)/2,dist=Math.abs(P1.x-P2.x),por=camera.aspect<1;
  const tz=(por?8.5:5.6)+dist*(por?1.1:.45),tx=mid*.85;shake=Math.max(0,shake-dt);
  camera.position.x+=(tx-camera.position.x)*.08;camera.position.z+=(tz-camera.position.z)*.06;camera.position.y=2.1+(por?.8:0);
  camera.lookAt(mid*.9+(Math.random()-.5)*shake,1.15+(Math.random()-.5)*shake,0);
  lamp.intensity=2.1+Math.sin(now*.02)*.05;
  hud();renderer.render(scene,camera);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
