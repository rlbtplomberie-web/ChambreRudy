<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<meta name="mobile-web-app-capable" content="yes">
<title>Kingspeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffcf3f;--red:#e63946;--f:"Lilita One","Arial Black",Impact,system-ui,sans-serif}
html,body{margin:0;height:100%;background:#0d0814;color:#fff;overflow:hidden;font-family:var(--f);user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;z-index:5;overflow:hidden;background:#0d0814}
.scr.on{display:block}
.art{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.blur{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(14px) brightness(.55)}
.art>img{width:100%;height:100%;display:block;pointer-events:none}
.hot{position:absolute;cursor:pointer;border-radius:2.2vw}
.hot:active{background:#ffffff40}
.pulse{animation:pulse 1.2s ease-in-out infinite;box-shadow:0 0 0 0 #ffd54a00}
@keyframes pulse{0%,100%{box-shadow:0 0 18px 4px #ffd54a55}50%{box-shadow:0 0 40px 14px #ffd54acc}}
.tap{position:absolute;left:0;right:0;bottom:3%;text-align:center;font-size:clamp(14px,2.6vw,22px);text-shadow:0 2px 6px #000;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.btn{font-family:var(--f);cursor:pointer;border:0;border-radius:14px;padding:.45em 1.1em;font-size:clamp(15px,2.6vw,24px);color:#3a1800;background:linear-gradient(#ffe680,#ffb300);box-shadow:0 5px 0 #a35b00,0 8px 16px #0009;letter-spacing:.5px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a35b00}
.btn.red{background:linear-gradient(#ff8a8a,#e63946);color:#fff;box-shadow:0 5px 0 #8a1520,0 8px 16px #0009}
.btn.blue{background:linear-gradient(#8ecbff,#2f7be0);color:#fff;box-shadow:0 5px 0 #17428a,0 8px 16px #0009}
.btn:disabled{filter:grayscale(1) brightness(.6);transform:none}
.back{position:absolute;left:12px;top:10px;z-index:3;font-size:clamp(13px,2vw,18px);padding:.35em .9em}
/* choix */
#choose{background:radial-gradient(ellipse at 50% 40%,#2a1650 0%,#120a26 55%,#07040f 100%)}
#choose:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff06 0 2px,transparent 2px 60px);pointer-events:none}
#banner{position:absolute;left:50%;transform:translateX(-50%);top:6px;display:block}
#grid{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap)}
.card{position:relative;width:var(--cw);height:var(--ch);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s,filter .12s;box-shadow:0 4px 10px #0008}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card.sel{transform:scale(1.06);outline:4px solid #4dff7a;box-shadow:0 0 22px 6px #4dff7a99;z-index:2}
.card.dim{filter:brightness(.55) saturate(.7)}
.card .bd{position:absolute;right:4px;top:4px;width:1.6em;height:1.6em;border-radius:50%;background:#20c050;color:#fff;display:none;align-items:center;justify-content:center;font-size:clamp(12px,1.6vw,18px);box-shadow:0 2px 6px #000a}
.card.sel .bd{display:flex}
#cbar{position:absolute;left:0;right:0;bottom:8px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;padding:0 12px}
#need{font-size:clamp(14px,2.3vw,24px);text-shadow:0 2px 6px #000;min-width:0;white-space:nowrap}
#need b{color:#4dff7a}
/* jeu */
#gui{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
#gui.on{display:block}
#bite{pointer-events:auto;position:absolute;right:max(14px,2vw);bottom:max(14px,3vh);width:clamp(72px,11vw,124px);height:clamp(72px,11vw,124px);border-radius:50%;border:0;font-family:var(--f);font-size:clamp(12px,1.8vw,20px);white-space:nowrap;color:#3a1800;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb300 60%,#d97a00);box-shadow:0 6px 0 #9a4f00,0 10px 24px #000a;opacity:.85}
#bite:active{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 #9a4f00}
#bite span{display:block;font-size:1.5em;line-height:1}
.ic{pointer-events:auto;position:absolute;top:8px;width:42px;height:42px;border-radius:50%;border:2px solid #ffffff55;background:#0008;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#pauseB{left:10px}
#muteB{right:10px;z-index:6;position:fixed;display:none}
#muteB.on{display:flex}
/* résultats / pause */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#0d0814cc;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.panel{background:linear-gradient(#3a1a14,#1c0d0a);border:3px solid #ffcf3f;border-radius:20px;padding:14px 22px;box-shadow:0 10px 40px #000c;text-align:center;max-height:94vh;overflow:auto;min-width:min(520px,80vw)}
.panel h1{margin:0 0 8px;font-size:clamp(28px,6vw,60px);color:var(--gold);text-shadow:0 4px 0 #b3361b,0 6px 14px #000;font-weight:400}
.rows{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;background:#0006;border-radius:12px;padding:4px 12px;font-size:clamp(14px,2.4vw,22px)}
.row img{width:clamp(30px,5vh,44px);height:clamp(30px,5vh,44px);border-radius:50%;object-fit:cover;border:2px solid #fff6}
.row .n{flex:1;text-align:left}
.row.win{background:linear-gradient(90deg,#ffcf3f66,#0006);outline:2px solid var(--gold)}
.row.me .n{color:#7dff9a}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* rotation */
#rot{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#120a1c;text-align:center;padding:20px;font-size:22px}
#rot .ph{width:70px;height:120px;border:6px solid #ffcf3f;border-radius:14px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>

<canvas id="c"></canvas>

<!-- Écran titre -->
<div class="scr on" id="title">
  <div class="art" data-ar="1.7766"><img id="imgTitle" alt=""><div class="hot pulse" style="left:38.2%;top:69.6%;width:23.7%;height:14.9%"></div></div>
</div>

<!-- Choix du mode -->
<div class="scr" id="modes">
  <img class="blur" id="imgModesB" alt="">
  <div class="art contain" data-ar="1.7766"><img id="imgModes" alt="">
    <div class="hot" data-n="2" style="left:18.2%;top:24.7%;width:63.7%;height:21.5%"></div>
    <div class="hot" data-n="3" style="left:18.2%;top:48.4%;width:63.7%;height:20.7%"></div>

  </div>
  <button class="btn red back" id="modesBack">◀ Retour</button>
</div>

<!-- Choix des adversaires -->
<div class="scr" id="choose">
  <img id="banner" alt="Choix du personnage">
  <div id="grid"></div>
  <div id="cbar">
    <button class="btn red" id="chBack">◀ Retour</button>
    <span id="need"></span>
    <button class="btn blue" id="chRand">🎲 Hasard</button>
    <button class="btn" id="chGo" disabled>COMBATTRE !</button>
  </div>
</div>

<!-- Interface en jeu -->
<div id="gui">
  <button class="ic" id="pauseB" title="Pause">❚❚</button>
  <button id="bite"><span>🌭</span>CROQUE !</button>
</div>
<button class="ic" id="muteB" title="Son">🔊</button>

<div class="ov" id="pause"><div class="panel"><h1>PAUSE</h1><div class="btns"><button class="btn" id="pResume">Reprendre</button><button class="btn red" id="pQuit">Quitter</button></div></div></div>

<div class="ov" id="res"><div class="panel">
  <h1 id="resT">VICTOIRE !</h1>
  <div class="rows" id="rows"></div>
  <div class="btns">
    <button class="btn" id="again">Rejouer</button>
    <button class="btn blue" id="reChoose">Autres adversaires</button>
    <button class="btn red" id="toMenu">Menu</button>
  </div>
</div></div>

<div id="rot"><div class="ph"></div><div>Tourne ton téléphone<br>en mode paysage 📱↻</div></div>

let AC=null,MASTER=null,muted=false;
function ac(){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=1;MASTER.connect(AC.destination)}catch(e){}}
 if(AC&&AC.state==='suspended')AC.resume();return AC}
function out(){return MASTER}
function noise(dur,freq,vol,q=1){const a=ac();if(!a||muted)return;const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(out());s.start()}
function tone(fr,dur,vol=.15,type='square',slide=0,when=0){const a=ac();if(!a||muted)return;const t=when||a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(fr,t);if(slide)o.frequency.exponentialRampToValueAtTime(fr*slide,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(out());o.start(t);o.stop(t+dur+.02)}
const SFX={

 choke(){tone(180,.25,.12,'sawtooth',.6);setTimeout(()=>tone(160,.25,.1,'sawtooth',.6),220)},

};

const MUS={next:0,step:0};
const CHORDS=[[48,52,55,60],[45,48,52,57],[41,45,48,53],[43,47,50,55]];
const MEL=[0,2,1,3,2,1,0,1, 3,2,1,2,3,1,2,0];
const midi=m=>440*Math.pow(2,(m-69)/12);
function musicTick(){
 const a=AC;if(!a||muted)return;
 const fast=state==='play';const st=fast?.115:.14;
 if(MUS.next<a.currentTime)MUS.next=a.currentTime+.05;
 while(MUS.next<a.currentTime+.25){
  const s=MUS.step,ch=CHORDS[Math.floor(s/16)%4],t=MUS.next;
  if(s%4===0)tone(midi(ch[0]-12),st*3.2,.06,'triangle',0,t);
  if(s%4===2)tone(midi(ch[2]-12),st*1.6,.035,'triangle',0,t);
  if(s%2===0)tone(midi(ch[MEL[s%16]]+12),st*.9,.018,'square',0,t);
  if(s%8===4){/* claquement */}
  MUS.step++;MUS.next+=st;
 }
}

function computeLayout(){
 const n=players.length;
 const plateH=Math.max(34,Math.min(58,H*.085));
 const T=plateH+12;
 L={n,plateH,T,panel:null,floorY:H*.62};
 const ord=players.order||players;
 if(n<=3){
  const cxs=n===2?[.28,.72]:[1/6,.5,5/6];
  const mw=n===2?W*.44:W/3*.98;
  ord.forEach((p,i)=>{p.box={cx:W*cxs[i],maxW:mw,top:T,bottom:H,row:0}});
 }else{
  // estrade : la rangée du fond est assise plus loin, derrière une longue table,
  // le bord de l'estrade (rideau) cache le dessous des nappes
  L.T=H*.04;
  const yS=H*.47,skirt=H*.075;
  L.stage={deck:yS-H*.075,y:yS,h:skirt};L.floorY=yS+skirt;
  const cxs=[1/6,.5,5/6];
  ord.forEach((p,i)=>{
   if(i<3)p.box={cx:W*cxs[i],maxW:W/3*.86,row:1};
   else p.box={cx:W*[.165,.47,.775][i-3],maxW:W*.3,top:yS-H*.035,bottom:H,row:0};
  });
 }
 // taille et position de chaque sprite
 ord.forEach(p=>{
  const m=META[p.key],b=p.box,nf=NOFEET.has(p.key);
  let s,bottom;
  if(b.row===1){ // rangée du fond : plus petite (plus loin), le bas de la nappe posé sur le bord de l'estrade
   const t=TABLES[p.key][0],tp=(t[0]+t[1])/2,cb=tp+Math.max(t[1]-tp,.14)+.02;
   // même hauteur visible pour toute la rangée, la tête reste sous l'enseigne
   const vis=L.stage.y-H*.16;
   s=Math.min(b.maxW/m.fw,vis/(cb*m.fh));bottom=L.stage.y+(1-cb)*m.fh*s;
  }else if(nf){ // pas de pieds : plus gros, plus en avant, coupé par le bas de l'écran
   s=Math.min(b.maxW/m.fw,(b.bottom-b.top)*1.06/m.fh);bottom=b.bottom+m.fh*s*.07;
   if(bottom-m.fh*s<b.top-plateH*.2)s=(bottom-(b.top-plateH*.2))/m.fh;
  }else{
   s=Math.min(b.maxW/m.fw,(b.bottom-b.top-4)/m.fh);bottom=b.bottom-Math.max(4,H*.012);
  }
  const dw=m.fw*s,dh=m.fh*s;
  p.rect={x:b.cx-dw/2,y:bottom-dh,w:dw,h:dh,s};
 });
 bgCache=null;
}

function update(dt,now){
 if(state==='count'){
  const prev=Math.ceil(cdown);cdown-=dt;const c=Math.ceil(cdown);
  if(c!==prev){c>0?SFX.beep():SFX.go()}
  if(cdown<=0)state='play';
 }
 shakeT=Math.max(0,shakeT-dt);
 for(const p of players){
  const b=p.bounce;b.v+=(-60*b.p-7*b.v)*dt;b.p+=b.v*dt*8;if(Math.abs(b.p)>9)b.p=Math.sign(b.p)*9;
  p.shake=Math.max(0,p.shake-dt);
  p.pops.forEach(o=>o.t+=dt);p.pops=p.pops.filter(o=>o.t<.8);
  if(state!=='play')continue;
  p.choke=Math.max(0,p.choke-(p.stun>0?38:22)*dt);
  if(p.stun>0){p.stun-=dt;p.pose=9;if(Math.random()<dt*6)p.bounce.v+=3;if(p.stun<=0){p.choke=40;p.pose=8;p.poseT=.4}continue}
  p.poseT-=dt;
  if(p.poseT<=0){
   const since=now-p.lastBite;
   if(p.choke>72)p.pose=8;
   else if(since<.6)p.pose=[3,6,1][(p.dogs+p.bites)%3];
   else p.pose=p.dogs===0&&p.bites===0?0:3;
   p.poseT=.25;
  }
  if(!p.human){p.cpuT-=dt;if(p.cpuT<=0){const ai=p.ai;const r=ai.rate*(p.choke>ai.thr?ai.slow:1)*(.88+Math.random()*.24);p.cpuT=1/r;bite(p,now)}}
 }
 parts.forEach(q=>{q.t+=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt});parts=parts.filter(q=>q.t<q.life);
 confetti.forEach(c=>{c.x+=c.vx*dt+Math.sin(now*3+c.r)*20*dt;c.y+=c.vy*dt;c.r+=c.vr*dt});confetti=confetti.filter(c=>c.y<H+20);
}

  const r=Math.min(26,H*.04);ctx.fillStyle='#c62828';ctx.beginPath();ctx.moveTo(x-r*.35,y-r*.3);ctx.lineTo(x+r*.35,y-r*.3);ctx.lineTo(x+r,y+r*.5);ctx.lineTo(x-r,y+r*.5);ctx.fill();ctx.fillStyle='#fff6c8';ctx.beginPath();ctx.ellipse(x,y+r*.5,r*.8,r*.22,0,0,7);ctx.fill()});
}

function wallpaper(g,wy){
 const st=Math.max(34,Math.min(W,H)/11);
 g.save();g.globalAlpha=.16;g.strokeStyle='#ffd9a0';g.lineWidth=1.2;
 for(let y=-st;y<wy;y+=st)for(let x=-st,j=0;x<W+st;x+=st,j++){const ox=((y/st|0)%2)*st/2,cx=x+ox,cy=y;
  g.beginPath();g.moveTo(cx,cy-st*.42);g.quadraticCurveTo(cx+st*.32,cy,cx,cy+st*.42);g.quadraticCurveTo(cx-st*.32,cy,cx,cy-st*.42);g.stroke();
  g.beginPath();g.arc(cx,cy,st*.07,0,7);g.fillStyle='#ffd9a0';g.fill();
  g.beginPath();g.arc(cx+st/2,cy+st/2,st*.04,0,7);g.fill()}
 g.restore();
 // frise dorée sous le plafond et cimaise
 g.fillStyle='#3a1208';g.fillRect(0,0,W,Math.max(6,H*.012));g.fillStyle='#d4a24c';g.fillRect(0,Math.max(6,H*.012),W,3);
}
function decoLive(now){
 // guirlande lumineuse + fanions
 const yA=Math.max(L.T*.15,4),sag=H*.09,segs=[[0,.5],[.5,1]];
 segs.forEach(([a,b],si)=>{
  const xa=W*a,xb=W*b,sw=Math.sin(now*1.1+si)*H*.006;
  const yAt=t=>yA+Math.sin(Math.PI*t)*(sag+sw);
  ctx.strokeStyle='#2b1a10';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=24;i++){const t=i/24,x=xa+(xb-xa)*t;i?ctx.lineTo(x,yAt(t)):ctx.moveTo(x,yAt(t))}ctx.stroke();
  const nf=11;for(let i=0;i<nf;i++){const t=(i+.5)/nf,x=xa+(xb-xa)*t,y=yAt(t),fw=(xb-xa)/nf*.7,fh=fw*1.1;
   ctx.fillStyle=['#e63946','#ffffff','#ffcf3f','#2f6fd6'][(i+si)%4];ctx.beginPath();ctx.moveTo(x-fw/2,y);ctx.lineTo(x+fw/2,y);ctx.lineTo(x,y+fh);ctx.fill();
   ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.stroke()}
  const nb=16;for(let i=0;i<nb;i++){const t=(i+.25)/nb,x=xa+(xb-xa)*t,y=yAt(t)+2,on=.55+.45*Math.sin(now*3+i*1.7+si*3);
   const c=['255,220,120','255,120,120','140,220,255','170,255,150'][i%4];
   ctx.save();ctx.globalCompositeOperation='lighter';const gl=ctx.createRadialGradient(x,y,0,x,y,10);gl.addColorStop(0,`rgba(${c},${.75*on})`);gl.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=gl;ctx.fillRect(x-10,y-10,20,20);ctx.restore();
   ctx.fillStyle=`rgba(${c},${.6+.4*on})`;ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill()}
 });
}
/* ================= Personnages ================= */
let off=document.createElement('canvas'),octx=off.getContext('2d');
function drawSprite(p,now){
 const im=IMG[p.key],m=META[p.key],r=p.rect;if(!im||!im.complete||!r)return;
 const fw=m.fw,fh=m.fh,sx=(p.pose%4)*fw,sy=(p.pose/4|0)*fh,sc=r.s;
 let dx=r.x,dy=r.y;
 if(p.shake>0)dx+=Math.sin(now*90)*p.shake*14*sc;
 if(p.stun>0)dx+=Math.sin(now*55)*3*sc;
 // ombre au sol / halo de Rudy
 if(p.box.row===0){ctx.save();ctx.fillStyle=p.human?'rgba(80,255,120,.20)':'rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(r.x+r.w/2,Math.min(H-6,r.y+r.h-6),r.w*.42,Math.max(8,r.h*.04),0,0,7);ctx.fill();ctx.restore()}
 ctx.drawImage(im,sx,sy,fw,fh,dx,dy,r.w,r.h);
 const band=CHEST[p.key];
 if(band&&p.pose!==10){
  const amp=p.bounce.p+Math.sin(now*2.6+p.slot)*.8;
  if(Math.abs(amp)>.15){
   const bx=band[0]*fw,by=band[1]*fh,bw=(band[2]-band[0])*fw,bh=(band[3]-band[1])*fh;
   const ow=Math.ceil(bw),oh=Math.ceil(bh);if(off.width!==ow||off.height!==oh){off.width=ow;off.height=oh}
   octx.globalCompositeOperation='source-over';octx.clearRect(0,0,ow,oh);
   octx.drawImage(im,sx+bx,sy+by,bw,bh,0,0,bw,bh);
   octx.globalCompositeOperation='destination-in';
   const gm=octx.createRadialGradient(bw/2,bh/2,0,bw/2,bh/2,Math.max(bw,bh)/2);
   gm.addColorStop(0,'rgba(0,0,0,1)');gm.addColorStop(.55,'rgba(0,0,0,1)');gm.addColorStop(1,'rgba(0,0,0,0)');
   octx.save();octx.translate(bw/2,bh/2);octx.scale(1,bh/Math.max(bw,bh));octx.translate(-bw/2,-bh/2);octx.fillStyle=gm;octx.fillRect(-bw,-bh,bw*3,bh*3);octx.restore();
   const st=1+amp*.012;
   ctx.drawImage(off,0,0,bw,bh,dx+bx*sc,dy+(by+amp*1.1)*sc-(bh*(st-1)*sc)/2,bw*sc,bh*st*sc);
  }
 }
 drawCloth(p,dx,dy,r);
 // étoiles quand il s'étouffe
 if(p.stun>0){const cx=r.x+r.w/2,cy=r.y+r.h*.08;ctx.save();ctx.font=`${Math.max(14,r.w*.06)}px sans-serif`;ctx.textAlign='center';
  for(let i=0;i<3;i++){const a=now*5+i*2.1;ctx.fillText('💫',cx+Math.cos(a)*r.w*.12,cy+Math.sin(a)*r.h*.03)}ctx.restore()}
 // bulles
 p.pops.forEach(o=>{ctx.save();ctx.globalAlpha=1-o.t/.8;const fs=Math.max(14,r.w*.055);ctx.font=`${fs}px ${FONT}`;ctx.textAlign='center';
  const tx=r.x+r.w*(.5+o.x),ty=r.y+r.h*.22-o.t*50;const tw=ctx.measureText(o.txt).width+16;ctx.fillStyle='#fff';rr(ctx,tx-tw/2,ty-fs*.95,tw,fs*1.35,fs*.6);ctx.fill();ctx.fillStyle='#c62828';ctx.fillText(o.txt,tx,ty);ctx.restore()});
}
function drawPlate(p,now){
 const r=p.rect;if(!r)return;
 const ph=L.plateH,w=Math.min(Math.max(r.w*.78,ph*4.6),Math.min(300,W/players.length*1.6));
 let x=r.x+r.w/2-w/2,y=r.y-ph*.35;
 if(p.box.row===0&&L.n<=3)y=Math.max(6,Math.min(y,L.T-ph-4));
 y=Math.max(6,y);const mg=y<56?58:4;x=Math.max(mg,Math.min(W-w-mg,x));
 if(p.box.row===0&&L.n===6&&L.stage)y=Math.max(y,L.stage.y-ph*.6);
 ctx.save();
 ctx.fillStyle=p===winner?'rgba(90,60,0,.92)':p.human?'rgba(16,70,34,.92)':'rgba(20,12,28,.88)';rr(ctx,x,y,w,ph,ph*.3);ctx.fill();
 ctx.lineWidth=p===winner?3:2;ctx.strokeStyle=p===winner?'#ffcf3f':p.human?'#5bff7a':'#ffffff44';ctx.stroke();
 const av=AV[p.key],ar=ph*.82,ax=x+ph*.09,ay=y+ph*.09;
 ctx.save();ctx.beginPath();ctx.arc(ax+ar/2,ay+ar/2,ar/2,0,7);ctx.clip();if(av&&av.complete)ctx.drawImage(av,ax,ay,ar,ar);ctx.restore();
 ctx.beginPath();ctx.arc(ax+ar/2,ay+ar/2,ar/2,0,7);ctx.strokeStyle=p.human?'#5bff7a':'#fff8';ctx.lineWidth=2;ctx.stroke();
 const tx=ax+ar+6,tw=x+w-8-tx,fs=ph*.34;
 ctx.font=`${fs}px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle=p.human?'#a6ffbb':'#fff';ctx.fillText(p.name+(p.human?' (toi)':''),tx,y+ph*.27,tw*.66);
 ctx.textAlign='right';ctx.fillStyle='#ffcf3f';ctx.fillText(`🌭 ${p.dogs}/${goal}`,x+w-8,y+ph*.27);
 const by=y+ph*.55,bh=ph*.16;
 ctx.fillStyle='#ffffff22';rr(ctx,tx,by,tw,bh,bh/2);ctx.fill();
 ctx.fillStyle='#ffcf3f';rr(ctx,tx,by,Math.max(bh,tw*Math.min(1,(p.dogs+p.bites/BITES_PER_DOG)/goal)),bh,bh/2);ctx.fill();
 const cy=by+bh+ph*.06,ch=ph*.11;ctx.fillStyle='#ffffff18';rr(ctx,tx,cy,tw,ch,ch/2);ctx.fill();
 ctx.fillStyle=p.choke>72?'#ff3b3b':p.choke>45?'#ff9b2f':'#5bd16a';if(p.choke>1){rr(ctx,tx,cy,Math.max(ch,tw*p.choke/100),ch,ch/2);ctx.fill()}
 if(p.human&&state!=='res'){const bob=Math.sin(now*4)*3;ctx.fillStyle='#5bff7a';ctx.font=`${ph*.32}px ${FONT}`;ctx.textAlign='center';ctx.fillText('▼ TOI',x+w/2,y+ph+ph*.28+bob)}
 if(p.stun>0){ctx.fillStyle='#ff4d4d';ctx.font=`${ph*.4}px ${FONT}`;ctx.textAlign='center';ctx.fillText('ÉTOUFFÉ !',x+w/2,y+ph+ph*.35)}
 ctx.restore();
}

/* ================= Nappes ================= */
const CLOTH=[['#d62839','#fff'],['#2f6fd6','#fff'],['#2e9e5b','#fff'],['#8e44ad','#fff'],['#f08a24','#fff'],['#e0457b','#fff']];
const patCache={};
function clothPat(i){
 if(patCache[i])return patCache[i];
 const [c1,c2]=CLOTH[i%CLOTH.length],t=document.createElement('canvas');t.width=t.height=32;const g=t.getContext('2d');
 g.fillStyle=c2;g.fillRect(0,0,32,32);g.globalAlpha=.55;g.fillStyle=c1;g.fillRect(0,0,16,32);g.fillRect(0,0,32,16);g.globalAlpha=1;g.fillStyle=c1;g.fillRect(0,0,16,16);
 g.globalAlpha=.25;g.fillStyle='#fff';for(let y=0;y<32;y+=4)g.fillRect(0,y,32,1);g.globalAlpha=1;
 return patCache[i]=ctx.createPattern(t,'repeat');
}
function drawCloth(p,dx,dy,r){
 const tb=TABLES[p.key];if(!tb)return;const t=tb[p.pose],s=r.s,m=META[p.key];
 const x0=dx+(t[2]-.012)*m.fw*s,x1=dx+(t[3]+.012)*m.fw*s,top=dy+((t[0]+t[1])/2)*m.fh*s,bot=dy+t[1]*m.fh*s;
 const drop=Math.max(bot-top,m.fh*s*.14),w=x1-x0,y2=top+drop;
 const sc=Math.max(8,w/18),n=Math.max(6,Math.round(w/sc));
 const col=CLOTH[p.slot%CLOTH.length][0];
 p.cloth={x:x0,w,top,drop};
 ctx.save();
 ctx.beginPath();ctx.moveTo(x0,top);ctx.lineTo(x1,top);ctx.lineTo(x1+w*.01,y2);
 for(let i=n;i>0;i--){const xa=x0-w*.01+(w*1.02)*i/n,xb=x0-w*.01+(w*1.02)*(i-1)/n;ctx.quadraticCurveTo((xa+xb)/2,y2+sc*.9,xb,y2)}
 ctx.closePath();
 const pat=clothPat(p.slot);const k=Math.max(.35,w/420);pat.setTransform&&pat.setTransform(new DOMMatrix([k,0,0,k,x0,top]));
 ctx.fillStyle=pat;ctx.fill();
 // plis
 const g=ctx.createLinearGradient(x0,0,x1,0);for(let i=0;i<=8;i++)g.addColorStop(i/8,i%2?'rgba(0,0,0,.16)':'rgba(255,255,255,.06)');ctx.fillStyle=g;ctx.fill();
 const g2=ctx.createLinearGradient(0,top,0,y2+sc);g2.addColorStop(0,'rgba(0,0,0,.05)');g2.addColorStop(1,'rgba(0,0,0,.28)');ctx.fillStyle=g2;ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.stroke();
 // ourlet en haut
 ctx.fillStyle=col;ctx.fillRect(x0,top-1,w,Math.max(3,drop*.09));ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x0,top-1,w,1.2);
 ctx.restore();
}

function drawStage(){
 const st=L.stage,g=ctx,y=st.y,h=st.h;
 // rebord en bois
 g.fillStyle='#6b3a1a';g.fillRect(0,y-3,W,6);g.fillStyle='#c08850';g.fillRect(0,y-3,W,2);
 // jupe d'estrade en velours rouge plissé
 let gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#b3122a');gr.addColorStop(1,'#5e0716');g.fillStyle=gr;g.fillRect(0,y+3,W,h);
 const pl=Math.max(14,W/60);for(let x=0;x<W;x+=pl){const gg=g.createLinearGradient(x,0,x+pl,0);gg.addColorStop(0,'rgba(0,0,0,.28)');gg.addColorStop(.5,'rgba(255,255,255,.10)');gg.addColorStop(1,'rgba(0,0,0,.28)');g.fillStyle=gg;g.fillRect(x,y+3,pl,h)}
 // franges dorées
 g.fillStyle='#e0b040';g.fillRect(0,y+3,W,Math.max(3,h*.08));
 const fr=Math.max(5,h*.12);for(let x=0;x<W;x+=6){g.fillStyle=(x/6|0)%2?'#f2c94c':'#b8862b';g.fillRect(x,y+3+h*.08,3,fr)}
 g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,y+3+h,W,4);
}
function drawNameCard(p,now){
 const c=p.cloth;if(!c)return;
 const col=CLOTH[p.slot%CLOTH.length][0];
 const ch=Math.max(30,Math.min(50,H*.07)),cw=Math.max(Math.min(c.w*.62,230),Math.min(W*.17,190),ch*3.6);
 const x=Math.max(4,Math.min(W-cw-4,c.x+c.w/2-cw/2)),y=c.top+Math.max(2,(c.drop-ch)*.45);
 const stun=p.stun>0;
 ctx.save();
 ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
 ctx.fillStyle=stun?'#ffe1e1':p===winner?'#fff4c2':'#fffaf0';rr(ctx,x,y,cw,ch,ch*.22);ctx.fill();
 ctx.shadowColor='transparent';
 ctx.lineWidth=p.human||p===winner?3:2;ctx.strokeStyle=p===winner?'#e0a800':p.human?'#1fa54a':col;ctx.stroke();
 // punaise
 ctx.fillStyle=p.human?'#1fa54a':col;ctx.beginPath();ctx.arc(x+cw/2,y+2,Math.max(2.5,ch*.07),0,7);ctx.fill();
 const fs=ch*.36,pad=ch*.2;
 ctx.font=`${fs}px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle=p.human?'#0f7a35':'#2a1a10';
 ctx.fillText(p.name,x+pad,y+ch*.33,cw*.58);
 ctx.textAlign='right';ctx.fillStyle=stun?'#d61f1f':'#b35a00';ctx.fillText(stun?'😵':`🌭${p.dogs}/${goal}`,x+cw-pad,y+ch*.33);
 const bx=x+pad,bw=cw-pad*2,by=y+ch*.6,bh=Math.max(3,ch*.13);
 ctx.fillStyle='#00000018';rr(ctx,bx,by,bw,bh,bh/2);ctx.fill();
 ctx.fillStyle='#ffb300';rr(ctx,bx,by,Math.max(bh,bw*Math.min(1,(p.dogs+p.bites/BITES_PER_DOG)/goal)),bh,bh/2);ctx.fill();
 const cy=by+bh+Math.max(2,ch*.05),c2=Math.max(2,ch*.09);
 ctx.fillStyle='#00000012';rr(ctx,bx,cy,bw,c2,c2/2);ctx.fill();
 if(p.choke>1){ctx.fillStyle=p.choke>72?'#ff3b3b':p.choke>45?'#ff9b2f':'#3fbf5a';rr(ctx,bx,cy,Math.max(c2,bw*p.choke/100),c2,c2/2);ctx.fill()}
 ctx.restore();
}

/* ================= Boucle ================= */
function frame(){
 const nowMs=performance.now(),now=nowMs/1000,dt=Math.min(.05,(nowMs-t0)/1000);t0=nowMs;
 musicTick();
 if(screenId==='game'){
  if(!paused&&!portrait())update(dt,now);
  if(!bgCache)bgCache=buildBg();
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);
  ctx.drawImage(bgCache,0,0,W,H);
  drawLive(now);
  decoLive(now);
  const ord=players.order||players;
  if(L.stage){ctx.save();ctx.beginPath();ctx.rect(0,0,W,L.stage.y+2);ctx.clip()}
  ord.filter(p=>p.box.row===1).forEach(p=>drawSprite(p,now));
  if(L.stage)ctx.restore();
  if(L.stage)drawStage();
  ord.filter(p=>p.box.row===0).forEach(p=>drawSprite(p,now));
  // miettes & textes
  parts.forEach(q=>{const a=1-q.t/q.life;ctx.globalAlpha=Math.max(0,a);
   if(q.type==='txt'){ctx.font=`${q.small?Math.max(13,H*.03):Math.max(18,H*.045)}px ${FONT}`;ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(q.txt,q.x,q.y);ctx.fillStyle='#ffcf3f';ctx.fillText(q.txt,q.x,q.y)}
   else{ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,7);ctx.fill()}});ctx.globalAlpha=1;
  if(L.n===6)ord.forEach(p=>drawNameCard(p,now));else ord.forEach(p=>drawPlate(p,now));
  // alerte étouffement de Rudy
  const me=players[0];
  if(me&&state==='play'&&me.choke>72){const a=(.18+.12*Math.sin(now*12))*((me.choke-72)/28+.4);const gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.7);gr.addColorStop(0,'rgba(255,0,0,0)');gr.addColorStop(1,`rgba(255,0,0,${Math.min(.55,a)})`);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
  // compte à rebours
  if(state==='count'){
   const n=Math.ceil(cdown),txt=n>0?String(n):'MANGEZ !',k=cdown-Math.floor(cdown);
   const six=L.n===6;ctx.save();ctx.translate(W/2,six?L.stage.y+L.stage.h*.5:H*.48);ctx.scale(1+k*.45,1+k*.45);ctx.font=`${Math.min(W,H)*(six?.13:.2)}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=12;ctx.strokeStyle='#3a0d00';ctx.strokeText(txt,0,0);ctx.fillStyle='#ffcf3f';ctx.fillText(txt,0,0);ctx.restore();
   ctx.save();ctx.font=`${Math.max(15,H*.04)}px ${FONT}`;ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=8;if(L.n===6){const ty=H-Math.max(16,H*.035);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,ty-H*.035,W,H*.06);ctx.fillStyle='#fff'}ctx.fillText("Tape vite sur l'écran pour croquer… mais attention à ne pas t'étouffer !",W/2,L.n===6?H-Math.max(16,H*.035)+2:H*.68);ctx.restore();
  }
  if(state==='end'||state==='res'){
   confetti.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore()});
   if(state==='end'){const txt=winner.human?'RUDY GAGNE !':winner.name.toUpperCase()+' GAGNE !';
    const six=L.n===6,ty=six?H*.085:H*.5;ctx.save();ctx.font=`${six?Math.min(W*.06,H*.09):Math.min(W*.09,H*.13)}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=six?9:12;ctx.strokeStyle='#3a0d00';ctx.strokeText(txt,W/2,ty);ctx.fillStyle='#ffcf3f';ctx.fillText(txt,W/2,ty);ctx.restore()}
  }
  ctx.restore();
 }
 requestAnimationFrame(frame);
}
