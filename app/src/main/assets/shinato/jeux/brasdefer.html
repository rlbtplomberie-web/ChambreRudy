<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bras de fer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15131f; --wall:#241e2e; --amber:#f2a33a; --amber-deep:#b86b12;
  --blue:#1f4fd1; --red:#d7262b; --chalk:#efe9dc; --muted:#a59bb4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#15131f; --chalk:#efe9dc; } }
:root[data-theme="dark"]{ --ink:#15131f; --chalk:#efe9dc; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--chalk);font-family:'Barlow Condensed',system-ui,sans-serif;overflow:hidden;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.disp{font-family:'Bungee','Impact',system-ui,sans-serif;font-weight:400;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* ---------- title ---------- */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);
  background:radial-gradient(ellipse at 50% 0%,rgba(242,163,58,.22),transparent 60%),rgba(21,19,31,.78);padding:16px;z-index:10;overflow:auto}
#title h1{margin:0;font-size:clamp(40px,9vw,92px);line-height:.9;color:var(--amber);
  text-shadow:0 0 18px rgba(242,163,58,.55),0 0 2px #fff4;transform:rotate(-2deg)}
#title .sub{margin:0;font-size:clamp(17px,2.4vw,22px);color:var(--muted);font-weight:600}
.picks{display:flex;gap:clamp(10px,2.5vw,26px)}
.card{width:clamp(130px,22vw,200px);aspect-ratio:383/500;border:3px solid #3a3346;border-radius:14px 14px 4px 4px;
  background:#2b2436 no-repeat;background-size:600% 100%;background-position:0 0;position:relative;padding:0;transition:transform .15s,border-color .15s}
.card span{position:absolute;left:0;right:0;bottom:0;padding:6px 0 8px;background:linear-gradient(transparent,rgba(21,19,31,.95) 45%);
  font-family:'Bungee',system-ui;font-size:clamp(16px,2.4vw,22px)}
.card[aria-pressed="true"]{border-color:var(--amber);transform:translateY(-4px);box-shadow:0 10px 30px -10px rgba(242,163,58,.7)}
.diff{display:flex;gap:6px;background:#2b2436;border-radius:999px;padding:4px}
.diff button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:700;font-size:18px;color:var(--muted)}
.diff button[aria-pressed="true"]{background:var(--chalk);color:var(--ink)}
.go{border:0;background:var(--amber);color:var(--ink);font-family:'Bungee',system-ui;font-size:clamp(22px,3vw,30px);
  padding:12px 42px;border-radius:12px;box-shadow:0 6px 0 var(--amber-deep)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--amber-deep)}
.help{max-width:36em;text-align:center;margin:0;font-size:17px;color:var(--muted);line-height:1.3}
.help b{color:var(--chalk)}

/* ---------- menu screens (images) ---------- */
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#07060a;z-index:10}
.scr.on{display:flex}
.frame{position:relative;width:min(100vw, calc(100vh * 1.5));aspect-ratio:1536/1024;max-height:100vh;background:no-repeat center/100% 100%}
#home .frame{width:min(100vw, calc(100vh * 1264 / 843))}
.hot{position:absolute;border:0;background:transparent;border-radius:10px;padding:0;transition:box-shadow .12s, background .12s}
.hot:hover,.hot:focus-visible{background:rgba(255,190,80,.14);box-shadow:0 0 0 3px #ffb84d,0 0 26px 4px rgba(255,120,30,.8);outline:none}
.hot.big:hover,.hot.big:focus-visible{background:rgba(255,255,255,.12)}
.hot.pick{border-radius:4px}
.hot.sel{box-shadow:0 0 0 4px #fff,0 0 30px 6px rgba(255,160,40,.95)}
.hot .badge{position:absolute;top:6%;right:6%;width:2em;height:2em;border-radius:50%;background:#fff;color:#c21a12;display:grid;place-items:center;font-family:'Bungee',system-ui;font-size:clamp(12px,1.6vw,20px)}
.hot.dim{filter:none}
.hot.dim::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35);border-radius:inherit}
.frame .diff{position:absolute;left:1.2%;top:1.6%;transform-origin:left top;font-size:0;z-index:2;box-shadow:0 0 0 2px #000,0 4px 14px rgba(0,0,0,.6)}
.frame .diff button{font-size:clamp(14px,1.8vw,20px);padding:6px 14px}
.hint{position:absolute;left:0;right:0;bottom:1.2%;margin:0;text-align:center;pointer-events:none;
  font-family:'Bungee',system-ui;font-size:clamp(13px,1.8vw,24px);color:#fff;text-shadow:0 2px 0 #000,0 0 12px #000}
#sel .hint{left:40%;right:40%;bottom:3%}
#bet .hint{bottom:auto;top:0.6%;left:30%;right:30%;display:none}
#vs{flex-direction:column;gap:18px;background:radial-gradient(ellipse at center,#5a1206 0%,#150405 70%)}
.vsbox{display:flex;align-items:center;gap:clamp(12px,4vw,48px)}
.por{position:relative;overflow:hidden;width:clamp(120px,28vw,300px);aspect-ratio:240/166;border:4px solid #ffb84d;background:#000;box-shadow:0 0 40px rgba(255,90,20,.7)}
.por i{position:absolute;inset:0;background-repeat:no-repeat}
.por span{display:none}   /* no name on the VS screen: the face is fully visible */
.por span{position:absolute;left:0;right:0;bottom:0;padding:4px 0 6px;text-align:center;background:#000c;font-family:'Bungee',system-ui;font-size:clamp(16px,2.6vw,30px)}
#vsA{animation:inL .45s cubic-bezier(.2,1.4,.4,1)} #vsB{animation:inR .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes inL{from{transform:translateX(-60vw)}} @keyframes inR{from{transform:translateX(60vw)}}
.vsword{font-size:clamp(44px,9vw,110px);color:#ffcf5a;text-shadow:0 0 20px #ff5a14,0 5px 0 #7a1206}
.miss{display:none;flex-direction:column;align-items:center;gap:14px;max-width:34em;text-align:center;padding:0 16px}
.miss p{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:600;line-height:1.3}
.miss.on{display:flex}

/* ---------- Rudy spectator (bet mode) ---------- */
#fan{position:fixed;left:50%;top:calc(78px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:4;display:none;pointer-events:none}

#fanTag{display:block;white-space:nowrap;background:#0009;border-radius:8px;padding:2px 10px;
  font-weight:700;font-size:clamp(13px,1.7vw,16px);color:var(--amber)}
#betPick{position:fixed;inset:0;display:none;z-index:8;pointer-events:none}
#betPick p{position:absolute;left:0;right:0;top:46%;margin:0;text-align:center;font-family:'Bungee',system-ui;font-size:clamp(20px,3.4vw,34px);color:#fff;text-shadow:0 3px 0 #000,0 0 14px #000}
#betPick button{pointer-events:auto;position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));border:0;border-radius:12px;padding:12px 20px;
  background:var(--amber);color:var(--ink);font-family:'Bungee',system-ui;font-size:clamp(15px,2.2vw,22px);box-shadow:0 5px 0 var(--amber-deep)}
#betPick #betL{left:16px} #betPick #betR{right:16px}


#bubble{position:fixed;display:none;z-index:6;transform:translate(-50%,-100%);margin-top:-18px;pointer-events:none;
  background:#fff;color:#111;border:3px solid #111;border-radius:18px;padding:8px 14px;white-space:nowrap;
  font-family:'Bungee',system-ui;font-size:clamp(13px,1.9vw,19px);box-shadow:3px 4px 0 rgba(0,0,0,.35)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-16px;margin-left:-10px;border:10px solid transparent;border-top:14px solid #111;border-bottom:0}
#bubble::before{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top:11px solid #fff;border-bottom:0;z-index:1}

.talk{position:fixed;display:none;z-index:6;pointer-events:none;max-width:min(36vw,260px);white-space:normal;text-align:center;
  background:#fff;color:#111;border:3px solid #111;border-radius:16px;padding:6px 12px;line-height:1.15;
  font-family:'Bungee',system-ui;font-size:clamp(11px,1.5vw,15px);box-shadow:3px 4px 0 rgba(0,0,0,.35);
  opacity:0;transition:opacity .2s, transform .2s}
.talk.on{opacity:1}
.talk.l{transform:translate(-100%,-100%) scale(.85)} .talk.l.on{transform:translate(-100%,-100%) scale(1)}
.talk.r{transform:translate(0,-100%) scale(.85)} .talk.r.on{transform:translate(0,-100%) scale(1)}
.talk::after{content:"";position:absolute;bottom:-14px;border:9px solid transparent;border-top:13px solid #111;border-bottom:0}
.talk.l::after{right:14px} .talk.r::after{left:14px}
@media (prefers-reduced-motion:reduce){.talk{transition:none}}
#amtPick{position:fixed;inset:0;display:none;z-index:8;pointer-events:none}
#amtPick p{position:absolute;left:0;right:0;top:40%;margin:0;text-align:center;font-family:'Bungee',system-ui;font-size:clamp(20px,3.4vw,34px);color:#fff;text-shadow:0 3px 0 #000,0 0 14px #000}
#amtPick p small{display:block;font-family:'Barlow Condensed',system-ui;font-weight:700;font-size:clamp(16px,2.2vw,22px);color:var(--amber);margin-top:4px}
#amtPick .amts{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:12px}
#amtPick button{pointer-events:auto;border:0;border-radius:12px;padding:12px 18px;background:var(--amber);color:var(--ink);font-family:'Bungee',system-ui;font-size:clamp(15px,2.2vw,22px);box-shadow:0 5px 0 var(--amber-deep)}
#amtPick button:disabled{opacity:.35;box-shadow:none}
#soutien{position:fixed;right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:7;display:none;border:0;border-radius:10px;
  width:46px;height:46px;padding:0;background:rgba(224,48,106,.85);color:#fff;font-size:22px;line-height:46px;box-shadow:0 3px 0 #8a1238}
#soutien:disabled{background:#3a3346;color:#8f86a0;box-shadow:none}
#wallet{position:fixed;right:12px;top:calc(114px + env(safe-area-inset-top,0px));z-index:5;display:none;pointer-events:none;
  background:#0009;border-radius:10px;padding:3px 10px;font-weight:700;font-size:clamp(14px,1.8vw,18px);color:#ffd36b}

/* ---------- hud ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;display:none;z-index:5;pointer-events:none}
.plates{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;max-width:900px;margin:0 auto}
.plate{font-family:'Bungee',system-ui;font-size:clamp(16px,2.6vw,26px);line-height:1}
.plate.r{text-align:right}
.plate small{display:block;font-family:'Barlow Condensed',system-ui;font-weight:700;font-size:14px;color:var(--amber);margin-bottom:2px}
.pips{display:inline-flex;gap:5px;margin-top:5px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--chalk);opacity:.6}
.pips i.on{background:var(--amber);border-color:var(--amber);opacity:1}
.roundlbl{font-weight:700;font-size:16px;color:var(--muted);text-align:center;padding-bottom:2px}
.breath{display:flex;justify-content:space-between;gap:12px;max-width:900px;margin:5px auto 0}
.breath div{flex:0 0 38%;height:7px;border-radius:4px;background:#0b1630;border:1px solid #000a;overflow:hidden}
.breath div:last-child{direction:rtl}
.breath i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2f7dff,#7cc4ff);transition:width .2s linear}
.breath.out i{background:#ff4d4d;animation:brflash .3s infinite alternate}
@keyframes brflash{to{opacity:.35}}
.gauge{position:relative;height:16px;max-width:900px;margin:8px auto 0;border-radius:8px;overflow:hidden;
  background:linear-gradient(90deg,var(--red) 0 8%,#2b2436 8% 92%,var(--red) 92%);border:2px solid #0008}
.gauge .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff5}
.gauge .knob{position:absolute;top:-2px;bottom:-2px;width:10px;margin-left:-5px;background:var(--chalk);border-radius:3px;box-shadow:0 0 10px #fff}

#ctrl{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none;
  padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:6}
#push{pointer-events:auto;width:clamp(84px,14vw,130px);height:clamp(84px,14vw,130px);border-radius:50%;border:0;background:var(--blue);
  font-family:'Bungee',system-ui;font-size:clamp(15px,2.2vw,22px);color:#fff;box-shadow:0 8px 0 #10266b,0 0 0 6px #fff1;touch-action:none}
#push.hit{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 #10266b,0 0 0 10px #fff2}
#spec{pointer-events:auto;--p:0;width:clamp(64px,10vw,90px);height:clamp(64px,10vw,90px);border-radius:50%;border:0;padding:6px;
  background:conic-gradient(var(--amber) calc(var(--p)*1turn),#3a3346 0);touch-action:none}
#spec span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#1d1927;font-weight:700;font-size:clamp(14px,2vw,18px);line-height:1;color:var(--muted)}
#spec.ready span{background:var(--red);color:#fff;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}

#banner{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;z-index:7;
  font-family:'Bungee',system-ui;font-size:clamp(34px,8vw,84px);color:var(--chalk);text-shadow:0 4px 0 #000a,0 0 24px rgba(242,163,58,.6);opacity:0}
#banner small{display:block;font-family:'Barlow Condensed',system-ui;font-weight:700;font-size:clamp(18px,3vw,28px);color:var(--amber);text-shadow:0 2px 0 #000a}
#banner.show{animation:pop .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}

#end{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;background:rgba(21,19,31,.6)}
#end h2{margin:0;font-family:'Bungee',system-ui;font-size:clamp(30px,6vw,64px);color:var(--amber);text-align:center;text-shadow:0 0 20px rgba(242,163,58,.5)}
#end p{margin:0;font-size:22px;font-weight:600;color:var(--muted)}
/* victory picture of the match winner */
#end.win{justify-content:flex-end;gap:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:#07060a var(--winimg) center/contain no-repeat}
#end.win::before{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(7,6,10,.92));pointer-events:none}
#end.win > *{position:relative}
#end.win h2, #end.win p{display:none}   /* victory picture: nothing written, just the buttons */
#end.win h2{font-size:clamp(22px,4vw,40px)}
#end.win p{color:#f2e6d8;text-shadow:0 2px 4px #000}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ghost{border:2px solid var(--chalk);background:none;border-radius:12px;padding:10px 22px;font-weight:700;font-size:20px}

#mute{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:11;border:0;background:#0006;border-radius:50%;width:40px;height:40px;font-size:18px}
#rot{display:none;position:fixed;left:0;right:0;top:calc(96px + env(safe-area-inset-top,0px));text-align:center;font-weight:600;color:var(--muted);font-size:15px;z-index:5;pointer-events:none}
@media (orientation:portrait) and (max-width:700px){ #rot.on{display:block} }
@media (max-height:560px){
  #title{justify-content:flex-start;gap:8px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  #title h1{font-size:34px}
  #title .sub{display:none}
  .card{width:auto;height:min(38vh,170px)}
  .help{font-size:14px}
  .go{padding:8px 34px;font-size:20px}
}
#err{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:50;background:#7a1216;color:#fff;padding:10px 12px;border-radius:8px;font-size:15px}
@media (prefers-reduced-motion:reduce){ #spec.ready span{animation:none} #banner.show{animation:none;opacity:1} }
</style>
<script>/* anti-touche bloquée */(()=>{let a={};addEventListener('pointerdown',e=>a[e.pointerId]=e.target,true);let f=e=>delete a[e.pointerId];addEventListener('pointerup',f,true);addEventListener('pointercancel',f,true);let r=()=>{Object.keys(a).forEach(i=>{try{a[i].dispatchEvent(new PointerEvent('pointercancel',{bubbles:true,pointerId:+i}))}catch(_){}});a={}};addEventListener('blur',r);document.addEventListener('visibilitychange',()=>document.hidden&&r())})();</script></head>
<body>
<canvas id="c"></canvas>

<section class="scr" id="home">
  <div class="frame" style="aspect-ratio:1264/843" data-bg="home">
    <button class="hot big" id="goFight" style="left:20.3%;top:28.5%;width:17.7%;height:8.5%" aria-label="Participer"></button>
    <button class="hot big" id="goBet" style="left:61.7%;top:28.5%;width:17.7%;height:8.5%" aria-label="Parier"></button>
  </div>
</section>
<section class="scr" id="sel">
  <div class="frame" data-bg="sel">
    <div class="diff" role="group" aria-label="Difficulté">
      <button data-d="0" aria-pressed="false">Facile</button>
      <button data-d="1" aria-pressed="true">Normal</button>
      <button data-d="2" aria-pressed="false">Difficile</button>
    </div>
    <p class="hint" id="selHint">Choisis l'adversaire de Rudy</p>
    <button class="hot back" data-back style="left:88.8%;top:91.4%;width:9.8%;height:5.8%" aria-label="Retour"></button>
  </div>
</section>
<section class="scr" id="bet">
  <div class="frame" data-bg="bet">
    <div class="diff" role="group" aria-label="Difficulté">
      <button data-d="0" aria-pressed="false">Facile</button>
      <button data-d="1" aria-pressed="true">Normal</button>
      <button data-d="2" aria-pressed="false">Difficile</button>
    </div>
    <p class="hint" id="betHint">Choisis le premier combattant</p>
    <button class="hot back" data-back style="left:88.8%;top:93%;width:9%;height:5.4%" aria-label="Retour"></button>
  </div>
</section>
<section class="scr" id="vs">
  <div class="vsbox">
    <div class="por" id="vsA"><i></i><span></span></div>
    <div class="vsword disp">VS</div>
    <div class="por" id="vsB"><i></i><span></span></div>
  </div>
  <div class="miss" id="miss">
    <p id="missTxt"></p>
    <button class="go" id="missBack">Choisir un autre</button>
  </div>
</section>

<div id="hud">
  <div class="plates">
    <div class="plate l"><small id="tagL"></small><span id="nameL"></span><div class="pips" id="pipsL"><i></i><i></i></div></div>
    <div class="roundlbl" id="roundLbl">Manche 1</div>
    <div class="plate r"><small id="tagR"></small><span id="nameR"></span><div class="pips" id="pipsR"><i></i><i></i></div></div>
  </div>
  <div class="gauge"><div class="mid"></div><div class="knob" id="knob"></div></div>
  <div class="breath"><div><i id="brL"></i></div><div><i id="brR"></i></div></div>
</div>
<div id="rot">Plus confortable avec le téléphone à l'horizontale</div>

<div id="ctrl">
  <button id="spec" aria-label="Coup de force"><span>Coup de<br>force</span></button>
  <button id="push">Pousser</button>
</div>

<div id="banner"></div>
<div id="fan"><span id="fanTag">Rudy</span></div>
<div id="bubble"></div>
<div class="talk" id="talk"></div>
<div id="betPick"><p>Sur qui tu paries ?</p><button id="betL"></button><button id="betR"></button></div>
<div id="amtPick"><p>Combien tu mises ?<small id="walletTxt"></small></p><div class="amts"><button data-a="100">100 €</button><button data-a="200">200 €</button><button data-a="500">500 €</button></div></div>
<div id="wallet"></div>
<button id="soutien" aria-label="Soutien">📣</button>

<section id="end">
  <h2 id="endTitle"></h2>
  <p id="endSub"></p>
  <div class="row">
    <button class="go" id="again">Rejouer</button>
    <button class="ghost" id="menu">Sortir</button>
  </div>
</section>

<div id="err"></div>
<button id="mute" aria-label="Couper le son">🔊</button>

<!-- correctif : le moteur 3D est pris dans l'appli (plus d'écran noir sans Internet) ; Internet seulement en secours -->

    const meshH = FAN_STAND * fanData.ch / idleH;
    fanMesh.scale.set(meshH*fanData.cw/fanData.ch, meshH, 1); fanMesh.position.set(cxF*.5, meshH/2, FAN_Z);
    // comic bubble over the CPU spectator's head until the fight starts
    const bub = $('bubble');
    if(!S.cpu && S.bet && S.round===1 && (S.state==='intro' || S.state==='count')){
      const v = new THREE.Vector3(fanMesh.position.x, FAN_STAND*1.04, FAN_Z).project(camera);
      bub.style.left = ((v.x*.5+.5)*innerWidth) + 'px'; bub.style.top = ((-v.y*.5+.5)*innerHeight) + 'px';
      bub.textContent = `Je parie sur ${FIGHTERS[S.bet].name} !`; bub.style.display='block';
    } else bub.style.display='none';
  } else $('bubble').style.display='none';
  // hud
  { if(S.state==='fight') S.breathF = Math.max(0, 1 - S.t/60);
    else if(S.state==='intro' || S.state==='count' || S.state==='betpick') S.breathF = 1;
    const pct = (S.breathF ?? 1)*100 + '%';
    $('brL').style.width = pct; $('brR').style.width = pct;
    document.querySelector('.breath').classList.toggle('out', !!S.breathOut && S.state==='fight'); }
  $('knob').style.left = (50 + S.shown*42) + '%';
  const sp = $('spec'); sp.style.setProperty('--p', S.chP); sp.classList.toggle('ready', S.chP>=1);

  updateSparks(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
// title backdrop: show both fighters
placeSprite(spriteL,'carlos','L'); placeSprite(spriteR,'rudy','R');
layoutPair(true); view = {minX:spriteL.base.x - spriteL.w/2, maxX:spriteR.base.x + spriteR.w/2};
S.side = {carlos:'L', rudy:'R'};
show('home');
resize(); loop();
</script>

<script>/* commandes tactiles de secours : seulement si PointerEvent manque réellement */
(function(){
 if(window.PointerEvent||window.__rudyTouchBridge)return; window.__rudyTouchBridge=true;   /* WebView récente : les vrais appuis suffisent, ne rien doubler */

 var last=new WeakMap(), active={};
 document.addEventListener('pointerdown',function(e){last.set(e.target,performance.now());},true);
 function send(type,t,id,el){try{el.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:t.clientX,clientY:t.clientY}));}catch(_){}}

 function end(e,type){Array.prototype.forEach.call(e.changedTouches,function(t){var id=80000+t.identifier,r=active[id];if(!r)return;if(r.synthetic)send(type,t,id,r.el);delete active[id];});}
 document.addEventListener('touchend',function(e){end(e,'pointerup');},{capture:true,passive:true});document.addEventListener('touchcancel',function(e){end(e,'pointercancel');},{capture:true,passive:true});
 function release(){Object.keys(active).forEach(function(id){var r=active[id];if(r&&r.synthetic)send('pointercancel',r.t,+id,r.el);});active={};document.querySelectorAll('.dn,.on').forEach(function(el){if(el.matches('.pad,[id*="joy" i],[id*="stick" i]'))el.classList.remove('dn');});}
 addEventListener('blur',release);document.addEventListener('visibilitychange',function(){if(document.hidden)release();});
})();</script>
