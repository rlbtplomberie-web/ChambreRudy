<script>
/* ---------- toucher fiable dans l'appli (version 142) ----------
   Dans l'appli Android, ce jeu tourne dans un cadre dans un cadre, rechargé à chaque trajet. À cette profondeur,
   les événements « pointer » du doigt arrivent mal (joystick mort, boutons une fois sur dix), alors que les
   événements tactiles arrivent toujours. Ici on fabrique donc TOUS les appuis du doigt à partir des événements
   tactiles, d'une seule source : jamais d'appui en double, jamais d'appui perdu. La souris n'est pas touchée. */
(function(){
 if(window.__toucherFiable||!window.PointerEvent||!('ontouchstart' in window))return; window.__toucherFiable=true;
 var suivi={}, BASE=500, capt={}, premier=null;
 ['pointerdown','pointermove','pointerup','pointercancel','pointerover','pointerout','pointerenter','pointerleave','gotpointercapture','lostpointercapture'].forEach(function(t){
  window.addEventListener(t,function(e){ if(e.isTrusted&&e.pointerType==='touch') e.stopImmediatePropagation(); },true);
 });
 function envoie(type,t,cible,id){
  try{ cible.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,composed:true,pointerId:id,pointerType:'touch',isPrimary:id===premier,
   clientX:t.clientX,clientY:t.clientY,screenX:t.screenX,screenY:t.screenY,pageX:t.pageX,pageY:t.pageY,
   width:(t.radiusX||12)*2,height:(t.radiusY||12)*2,pressure:type==='pointerup'||type==='pointercancel'?0:.5,button:type==='pointermove'?-1:0,buttons:type==='pointerup'||type==='pointercancel'?0:1})); }catch(_){}
 }
 function cibleDe(id,t){ var c=capt[id]||suivi[id]; return (c&&c.isConnected)?c:(t.target&&t.target.isConnected?t.target:document.elementFromPoint(t.clientX,t.clientY)||document.body); }
 window.addEventListener('touchstart',function(e){ for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i], id=BASE+t.identifier;
  var c=t.target&&t.target.nodeType===1?t.target:(t.target&&t.target.parentElement)||document.body; suivi[id]=c; delete capt[id];
  if(premier===null) premier=id; envoie('pointerdown',t,c,id); } },{capture:true,passive:true});
 window.addEventListener('touchmove',function(e){ for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i], id=BASE+t.identifier;
  if(suivi[id]) envoie('pointermove',t,cibleDe(id,t),id); } },{capture:true,passive:true});
 function fin(type){ return function(e){ for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i], id=BASE+t.identifier;
  if(!suivi[id]) continue; var c=cibleDe(id,t); delete suivi[id]; delete capt[id]; envoie(type,t,c,id); }
  if(!e.touches||!e.touches.length) premier=null; }; }
 window.addEventListener('touchend',fin('pointerup'),{capture:true,passive:true});
 window.addEventListener('touchcancel',fin('pointercancel'),{capture:true,passive:true});
 /* les jeux « capturent » le doigt : pour nos appuis fabriqués, on le fait nous-mêmes, sans erreur */
 var sp=Element.prototype.setPointerCapture, rp=Element.prototype.releasePointerCapture, hp=Element.prototype.hasPointerCapture;
 Element.prototype.setPointerCapture=function(id){ if(id>=BASE&&id<BASE+1000){ capt[id]=this; return; } try{ return sp.call(this,id); }catch(_){} };
 Element.prototype.releasePointerCapture=function(id){ if(id>=BASE&&id<BASE+1000){ if(capt[id]===this) delete capt[id]; return; } try{ return rp.call(this,id); }catch(_){} };
 Element.prototype.hasPointerCapture=function(id){ if(id>=BASE&&id<BASE+1000) return capt[id]===this; try{ return hp.call(this,id); }catch(_){ return false; } };
})();
</script>

<script>
(() => {
"use strict";
const H = 540;
let W = 960;
const $ = s => document.querySelector(s);
const cvs = $('#c'), ctx = cvs.getContext('2d');
let K = 1;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const DT = 1 / 60, G = 9.8, PSPD = 7;

/* ---------- Court (mètres) ---------- */
const CT = { hw: 5.485, sw: 4.115, hl: 11.885, svc: 6.4, post: 6.4 };
const netH = x => 0.914 + 0.156 * Math.pow(Math.min(1, Math.abs(x) / CT.post), 2);

/* ---------- Caméra ---------- */
const ZC = 55, HC = 30, XS = 1.5;
let f = 815, hy = -284, cx = 480;
function setupCam(){
  cx = W / 2;
  const dF = ZC + 14, dN = ZC - 14;
  f = (530 - 70) / (HC / dN - HC / dF);
  hy = 70 - f * HC / dF;
}
function P3(x, y, z){ const d = Math.max(0.5, ZC - z); return { x: cx + f * x * XS / d, y: hy + f * (HC - y) / d, s: f / d }; }

/* ---------- Sons ---------- */
const sfx = (() => {
  let ac = null, nb = null, master = null, muted = false, quiet = true;
  function init(){
    if (ac){ if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      nb = ac.createBuffer(1, ac.sampleRate * 2.5, ac.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  const off = () => !ac || muted || quiet;
  function env(g, t, peak, dur){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function tone(type, f0, f1, dur, vol, delay = 0){
    if (off()) return; const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, vol, dur); o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, type, fr, q = 1){
    if (off()) return; const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = nb;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = fr; fl.Q.value = q;
    const g = ac.createGain(); env(g, t, vol, dur);
    s.connect(fl).connect(g).connect(master); s.start(t); s.stop(t + dur + 0.05);
  }
  return {
    init,
    setQuiet(q){ quiet = q; },
    toggleMute(){ muted = !muted; return muted; },
    hit(type){
      if (type === 'fort'){ noise(0.09, 0.5, 'highpass', 1800); tone('triangle', 900, 180, 0.12, 0.3); }
      else if (type === 'leger'){ noise(0.05, 0.2, 'bandpass', 2500, 2); tone('triangle', 700, 300, 0.08, 0.15); }
      else { noise(0.07, 0.3, 'bandpass', 2000, 1.5); tone('triangle', 600, 900, 0.14, 0.18); }
    },
    bounce(v){ tone('sine', 190, 80, 0.08, clamp(v / 12, 0.05, 0.3)); noise(0.03, 0.08, 'lowpass', 900); },
    net(){ noise(0.18, 0.35, 'lowpass', 500); tone('sine', 110, 60, 0.15, 0.25); },
    whistle(){ tone('square', 2100, 2000, 0.12, 0.05); tone('square', 2100, 2000, 0.2, 0.05, 0.16); },
    crowd(){ if (off()) return; for (let i = 0; i < 6; i++) setTimeout(() => noise(0.35, 0.12, 'bandpass', rand(1500, 3000), 0.8), i * 90); },
    swish(){ noise(0.1, 0.06, 'bandpass', 1200, 0.7); }
  };
})();

/* ---------- Décor pré-rendu ---------- */
const bg = document.createElement('canvas'); bg.height = H;
let crowdPts = [];
function quad(g, pts, col){ g.beginPath(); pts.forEach((p, i) => { const q = P3(p[0], p[1], p[2]); i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y); }); g.closePath(); g.fillStyle = col; g.fill(); }
function lineQ(g, x1, z1, x2, z2, w){
  const dx = x2 - x1, dz = z2 - z1, l = Math.hypot(dx, dz), nx = -dz / l * w / 2, nz = dx / l * w / 2;
  quad(g, [[x1 + nx, 0, z1 + nz], [x2 + nx, 0, z2 + nz], [x2 - nx, 0, z2 - nz], [x1 - nx, 0, z1 - nz]], '#f4f7ff');
}
const CROWD = ['#ffd23f','#ff5a1f','#e8232a','#3fb6ff','#ffffff','#57d163','#b35cff','#f3c48e','#8a5a3c','#2a2a2a'];
function drawBG(){
  bg.width = W; setupCam(); crowdPts = [];
  const g = bg.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#0b1236'); sky.addColorStop(1, '#16255a');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const wallY = P3(0, 0, -19).y, wallTop = P3(0, 1.1, -19).y;
  // tribune du fond
  for (let y = wallTop - 6, row = 0; y > -8; y -= 8, row++){
    for (let x = (row % 2) * 4; x < W + 8; x += 8){
      const c = CROWD[(Math.random() * CROWD.length) | 0];
      g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x - 3, y + 1, 6, 5);
      g.fillStyle = c; g.beginPath(); g.arc(x + rand(-1, 1), y, 2.6, 0, 7); g.fill();
      if (Math.random() < 0.5) crowdPts.push([x, y]);
    }
  }
  // sol
  g.fillStyle = '#2f8a57'; g.fillRect(0, wallY, W, H - wallY);
  // panneau du fond
  g.fillStyle = '#15307a'; g.fillRect(0, wallTop, W, wallY - wallTop);
  g.font = `${Math.round((wallY - wallTop) * 0.8)}px Bangers, Impact, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let x = W / 2 - 360; x <= W / 2 + 360; x += 240){ g.fillStyle = x === W / 2 ? '#ffd23f' : '#ffffff'; g.fillText(x === W / 2 ? 'SMASH COURT' : 'ARCADE OPEN', x, (wallY + wallTop) / 2 + 1); }
  // tribunes latérales et panneaux
  for (const s of [-1, 1]){
    quad(g, [[s * 12, 1, -19], [s * 12, 1, 22], [s * 32, 15, 22], [s * 32, 15, -19]], '#1b2152');
    for (let z = -18.5; z < 18; z += 0.8) for (let i = 0; i < 9; i++){
      const x = s * (12.7 + i * 1.4), y = 1.3 + (i * 1.4 + 0.7) * 0.72;
      const p = P3(x, y + 0.3, z + rand(-0.2, 0.2));
      if (p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) continue;
      g.fillStyle = CROWD[(Math.random() * CROWD.length) | 0];
      g.beginPath(); g.arc(p.x, p.y, Math.max(1.2, 0.24 * p.s), 0, 7); g.fill();
      if (Math.random() < 0.3) crowdPts.push([p.x, p.y]);
    }
    for (let z = -19, k = 0; z < 22; z += 4, k++) quad(g, [[s * 12, 0, z], [s * 12, 0, z + 4], [s * 12, 1, z + 4], [s * 12, 1, z]], k % 2 ? '#ff7a1f' : '#1f5fd6');
  }
  // terrain
  quad(g, [[-CT.hw - 3, 0, -CT.hl - 5], [CT.hw + 3, 0, -CT.hl - 5], [CT.hw + 3, 0, CT.hl + 5], [-CT.hw - 3, 0, CT.hl + 5]], '#36995f');
  quad(g, [[-CT.hw, 0, -CT.hl], [CT.hw, 0, -CT.hl], [CT.hw, 0, CT.hl], [-CT.hw, 0, CT.hl]], '#2b62c4');
  const lw = 0.08;
  for (const z of [-CT.hl, CT.hl]) lineQ(g, -CT.hw, z, CT.hw, z, lw);
  for (const x of [-CT.hw, CT.hw, -CT.sw, CT.sw]) lineQ(g, x, -CT.hl, x, CT.hl, lw);
  for (const z of [-CT.svc, CT.svc]) lineQ(g, -CT.sw, z, CT.sw, z, lw);
  lineQ(g, 0, -CT.svc, 0, CT.svc, lw);
  lineQ(g, 0, -CT.hl, 0, -CT.hl + 0.3, lw); lineQ(g, 0, CT.hl, 0, CT.hl - 0.3, lw);
}

/* ---------- Joueurs ---------- */
function mkPlayer(side){
  return { side, hand: side > 0 ? 1 : -1, x: 0, z: side * 12.4, mx: 0, mz: 0, anim: 0,
    swingT: 0, swingDur: 0.3, swingType: 'fort', swingSide: 1, hitDone: false, req: null, aim: 0,
    serveT: 0, serveType: 'fort', aiWait: 1, reactT: 0, pred: null, letGo: false, ai: false, q: 0.7,
    shirt: side > 0 ? '#e8232a' : '#ffd23f', shorts: side > 0 ? '#f4f4f4' : '#1a1a2e', skin: side > 0 ? '#f1c27d' : '#c68642',
    name: side > 0 ? 'Toi' : 'CPU' };
}
let P = mkPlayer(1), C = mkPlayer(-1);
const other = h => h === P ? C : P;

/* ---------- Balle & règles ---------- */
const ball = { x: 0, y: 1, z: 12, vx: 0, vy: 0, vz: 0, held: true, lastHitter: null, bounces: 0, serve: false, net: false, trail: [], fast: false, hitT: 0 };
let phase = 'serve', mode = 'demo', server = P, serveFaults = 0, deadT = 0, pts = [0, 0], games = [0, 0];
const GAMES = 3;
let parts = [], msgs = [], msgT = 0, shakeAmt = 0, cheerT = 0, frame = 0, paused = false;
let diff = 'normal';
const LV = {
  facile:    { spd: 5.0, react: .35, miss: .12, acc: .45, smart: .3,  fort: .35 },
  normal:    { spd: 6.3, react: .2,  miss: .05, acc: .7,  smart: .7,  fort: .55 },
  difficile: { spd: 7.4, react: .1,  miss: .015, acc: .9, smart: .95, fort: .7 }
};
const lvOf = h => h === C ? LV[diff] : LV.normal;

function showMsgs(list){ msgs = list.slice(); msgT = 0; }
function launch(tx, tz, vh){
  const x0 = ball.x, z0 = ball.z, y0 = Math.max(0.35, ball.y);
  const dx = tx - x0, dz = tz - z0, dist = Math.hypot(dx, dz);
  let T = Math.max(0.3, dist / vh);
  for (let k = 0; k < 14; k++){
    const vy = (0.5 * G * T * T - y0) / T, tn = -z0 / (dz / T);
    if (tn > 0 && tn < T){ const yn = y0 + vy * tn - 0.5 * G * tn * tn; if (yn < netH(x0 + dx * tn / T) + 0.14){ T *= 1.08; continue; } }
    break;
  }
  ball.vx = dx / T; ball.vz = dz / T; ball.vy = (0.5 * G * T * T - y0) / T;
}
function predict(){
  let { x, y, z, vx, vy, vz } = ball, b = 0, fb = null;
  for (let i = 0; i < 360; i++){
    const pz = z; vy -= G * DT; x += vx * DT; y += vy * DT; z += vz * DT;
    if ((pz > 0) !== (z > 0) && Math.abs(x) < CT.post && y < netH(x)) return { x, z, fb: null, net: true };
    if (y <= 0.035 && vy < 0){ y = 0.035; if (!b) fb = { x, z }; b++; vy = -vy * 0.72; vx *= 0.88; vz *= 0.88; if (b >= 2) return { x, z, fb }; }
    if (b === 1 && vy < 0 && y < 1.15) return { x, z, fb };
    if (b === 1 && Math.abs(z) > 15.5) return { x, z, fb };
  }
  return { x, z, fb };
}
function isOut(fb, serve){ return !fb || Math.abs(fb.x) > (serve ? CT.sw : CT.hw) || Math.abs(fb.z) > (serve ? CT.svc : CT.hl); }

function afterShot(h, type){
  ball.lastHitter = h; ball.bounces = 0; ball.net = false; ball.fast = type === 'fort'; ball.hitT = 0;
  sfx.hit(type); if (type === 'fort') shakeAmt = Math.max(shakeAmt, 3);
  for (let i = 0; i < 8; i++) parts.push({ k: 1, x: ball.x, y: ball.y, z: ball.z, vx: rand(-2, 2), vy: rand(-1, 3), vz: rand(-2, 2), life: 14, max: 14 });
  const o = other(h), pr = predict();
  o.pred = pr; o.reactT = lvOf(o).react; o.letGo = false;
  if (o.ai && (pr.net || isOut(pr.fb, ball.serve)) && Math.random() < lvOf(o).smart) o.letGo = true;
}
function hitBall(h, type, q, aim){
  const dir = -h.side, e = 1 - q;
  let tx, tz, vh;
  if (type === 'fort'){ tz = dir * (9.6 + rand(-1, 1) * (0.6 + e * 1.6)); tx = aim * 4.4 + rand(-1, 1) * (0.3 + e * 1.4); vh = 26; }
  else if (type === 'leger'){ tz = dir * (3.2 + rand(-1, 1) * (0.5 + e * 0.8)); tx = aim * 3.6 + rand(-1, 1) * (0.3 + e * 0.8); vh = 11; }
  else { tz = dir * (9.8 + rand(-1, 1) * (0.5 + e * 1.2)); tx = aim * 3.8 + rand(-1, 1) * (0.3 + e * 1.0); vh = 9.5; }
  ball.serve = false;
  launch(tx, tz, vh);
  afterShot(h, type);
}
function serveBall(h, type, q, aim){
  const dir = -h.side, e = 1 - q, sg = Math.sign(h.x) || 1;
  const base = -sg * 2.1 + aim * 1.6;
  let tx, tz, vh;
  if (type === 'fort'){ tz = dir * (5.3 + rand(-1, 1) * (0.5 + e * 0.9)); tx = base + rand(-1, 1) * (0.3 + e); vh = 30; }
  else if (type === 'leger'){ tz = dir * (4.3 + rand(-1, 1) * 0.5); tx = base * 0.8 + rand(-1, 1) * 0.3; vh = 16; }
  else { tz = dir * (4.8 + rand(-1, 1) * 0.6); tx = base * 0.8 + rand(-1, 1) * 0.4; vh = 10; }
  ball.x = h.x + h.hand * 0.15; ball.y = 2.7; ball.z = h.z - h.side * 0.2;
  ball.held = false; ball.serve = true;

}
function ptLabels(){
  const [a, b] = pts;
  if (a >= 3 && b >= 3){ if (a === b) return ['40', '40']; return a > b ? ['AV', '40'] : ['40', 'AV']; }
  const L = ['0', '15', '30', '40']; return [L[Math.min(a, 3)], L[Math.min(b, 3)]];
}
function endPoint(winner, why){
  if (phase !== 'rally') return;
  phase = 'dead'; deadT = 2.2;
  const wi = winner === P ? 0 : 1, li = 1 - wi;
  pts[wi]++;
  const list = [[why, winner === P ? '#57d163' : '#ff5a4a', 0.95]];
  if (pts[wi] >= 4 && pts[wi] - pts[li] >= 2){
    games[wi]++; pts = [0, 0]; server = other(server); serveFaults = 0;
    if (games[wi] >= GAMES){ list.push([winner === P ? 'Jeu, set et match !' : 'Match perdu', '#ffd23f', 1.4]); deadT = 2.6; }
    else list.push([`Jeu ${winner === P ? 'Toi' : 'CPU'} — ${games[0]}-${games[1]}`, '#ffd23f', 1.2]);
  } else {
    const [a, b] = pts;
    if (a >= 3 && b >= 3) list.push([a === b ? 'Égalité' : `Avantage ${a > b ? 'Toi' : 'CPU'}`, '#fff', 1.1]);
    else { const L = ptLabels(); list.push([`${L[0]} - ${L[1]}`, '#fff', 1.1]); }
  }
  serveFaults = 0;
  showMsgs(list);
  sfx.crowd(); cheerT = 1.4;
}
function fault(){
  serveFaults++;
  if (serveFaults >= 2){ endPoint(other(server), 'Double faute !'); return; }
  phase = 'dead'; deadT = 1.3; showMsgs([['Faute !', '#ff9a3a', 1.1]]); sfx.whistle();
  ball.retry = true;
}
function onBounce(v){
  sfx.bounce(v);
  for (let i = 0; i < 5; i++) parts.push({ k: 0, x: ball.x, y: 0.05, z: ball.z, vx: rand(-1, 1), vy: rand(0.5, 1.5), vz: rand(-1, 1), life: 20, max: 20 });
  if (phase !== 'rally') return;
  const hitter = ball.lastHitter, recv = other(hitter);
  const onSide = ball.z > 0 ? P : C;
  if (ball.bounces === 0){
    if (onSide === hitter){ if (ball.serve) fault(); else endPoint(recv, ball.net ? 'Filet !' : 'Faute !'); return; }
    if (isOut({ x: ball.x, z: ball.z }, ball.serve)){ if (ball.serve) fault(); else endPoint(recv, 'Out !'); sfx.whistle(); return; }
    ball.bounces = 1;
  } else {
    endPoint(hitter, ball.serve ? 'Ace !' : 'Point !');
  }
}

function setupPoint(keepFault){
  if (!keepFault) serveFaults = 0;
  const sg = (pts[0] + pts[1]) % 2 === 0 ? 1 : -1;
  const rc = other(server);
  server.x = sg * 1.2 * server.hand; server.z = server.side * 12.3;
  rc.x = -sg * 2.6 * server.hand; rc.z = rc.side * 11.6;
  for (const h of [P, C]){ h.swingT = 0; h.serveT = 0; h.pred = null; h.letGo = false; h.req = null; h.mx = h.mz = 0; }
  server.aiWait = rand(0.8, 1.4);
  Object.assign(ball, { held: true, lastHitter: null, bounces: 0, serve: false, net: false, trail: [], vx: 0, vy: 0, vz: 0, retry: false, hitT: 0 });
  phase = 'serve';
}
function newMatch(demo){
  mode = demo ? 'demo' : 'play';
  pts = [0, 0]; games = [0, 0]; server = P; parts = []; msgs = [];
  P.ai = demo; C.ai = true;
  setupPoint(false);
  document.body.classList.toggle('playing', !demo);
  sfx.setQuiet(demo);
  if (!demo) showMsgs([['À toi de servir !', '#ffd23f', 1.4]]);
}

/* ---------- Entrées ---------- */
const keys = {}, stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
let reqShot = null;
const KEYSHOT = { KeyJ: 'fort', Space: 'fort', KeyK: 'leger', KeyL: 'haut' };
addEventListener('keydown', e => {
  sfx.init();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat){ togglePause(); return; }
  if (!e.repeat && KEYSHOT[e.code]) reqShot = KEYSHOT[e.code];
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function playerInput(h){
  let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let dz = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (dx && dz){ dx *= .72; dz *= .72; }
  if (stick.active){ dx = stick.x; dz = stick.y; }
  h.mx = dx; h.mz = dz;
  if (reqShot){ h.req = reqShot; h.aim = dx ? clamp(dx, -1, 1) : rand(-0.45, 0.45); reqShot = null; }
}

const touchEl = $('#touch'), zone = $('#stickZone'), base = $('#stickBase'), knob = $('#stickKnob');
function placeBase(x, y, a){ base.style.left = x + 'px'; base.style.top = y + 'px'; base.style.opacity = a; }
function idleBase(){ if (stick.active) return; const r = touchEl.getBoundingClientRect(); placeBase(Math.max(90, r.width * 0.1), r.height - 104, .45); knob.style.transform = 'translate(0,0)'; }
zone.addEventListener('pointerdown', e => {
  sfx.init(); document.body.classList.add('touch');
  if (stick.active) return; e.preventDefault();
  stick.active = true; stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY;
  try { zone.setPointerCapture(e.pointerId); } catch (_) {}
  const r = touchEl.getBoundingClientRect(); placeBase(e.clientX - r.left, e.clientY - r.top, 1);
});
zone.addEventListener('pointermove', e => {
  if (!stick.active || e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy;
  const l = Math.hypot(dx, dy), m = 52;
  if (l > m){ dx *= m / l; dy *= m / l; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  let sx = dx / m, sy = dy / m;
  if (Math.hypot(sx, sy) < 0.18){ sx = 0; sy = 0; }
  stick.x = sx; stick.y = sy;
});
const stickUp = e => { if (e.pointerId !== stick.id) return; stick.active = false; stick.id = null; stick.x = stick.y = 0; idleBase(); };
zone.addEventListener('pointerup', stickUp); zone.addEventListener('pointercancel', stickUp);
document.querySelectorAll('.b').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); sfx.init(); document.body.classList.add('touch');
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
    b.classList.add('held'); reqShot = k;
  });
  const up = () => b.classList.remove('held');
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------- IA ---------- */
function aiUpdate(h){
  const L = lvOf(h), o = other(h);
  let tx = h.x, tz = h.z;
  if (phase === 'serve'){
    if (server === h && ball.held && h.serveT <= 0){
      h.aiWait -= DT;
      if (h.aiWait <= 0){ const r = Math.random(); h.aim = rand(-0.7, 0.7); h.req = r < L.fort ? 'fort' : r < 0.88 ? 'leger' : 'haut'; }
    }
  } else if (phase === 'rally'){
    if (ball.lastHitter !== h){
      h.reactT -= DT;
      const pr = h.pred;
      if (pr && h.reactT <= 0 && !h.letGo){ tx = pr.x - h.hand * 0.45; tz = pr.z + h.side * 0.3; }
      if (!h.letGo && h.swingT <= 0){
        const d = Math.hypot(ball.x - h.x, ball.z - h.z);
        if (d < 1.3 && ball.y < 2.5 && ball.z * h.side > 0 && (ball.bounces === 1 || (ball.y < 1.7 && !ball.serve))){
          const near = Math.abs(o.z) < 7, r = Math.random();
          const type = near ? (r < 0.6 ? 'haut' : 'fort') : (r < 0.16 ? 'leger' : r < 0.26 ? 'haut' : 'fort');
          const txAim = -(Math.sign(o.x) || (Math.random() < .5 ? 1 : -1)) * rand(1.6, 4.3);
          h.aim = txAim / 4.4; h.q = L.acc;
          startSwing(h, type);
          if (Math.random() < L.miss) h.hitDone = true;
        }
      }
    } else { tx = clamp(-ball.x * 0.2, -2, 2); tz = h.side * 11.8; }
  }
  const dx = tx - h.x, dz = tz - h.z, dl = Math.hypot(dx, dz), sp = L.spd / PSPD;
  if (dl > 0.12){ const m = Math.min(1, dl * 2) * sp; h.mx = dx / dl * m; h.mz = dz / dl * m; } else h.mx = h.mz = 0;
}

/* ---------- Mise à jour ---------- */
function startSwing(h, type){
  h.swingType = type; h.swingDur = type === 'fort' ? 0.28 : 0.34; h.swingT = h.swingDur; h.hitDone = false;
  h.swingSide = Math.sign(ball.x - h.x) || h.hand;
  sfx.swish();
}
function updatePlayer(h){
  if (h.req){
    if (phase === 'serve' && server === h && ball.held && h.serveT <= 0){ h.serveT = 0.6; h.serveType = h.req; if (!h.ai) h.q = 0.75; }
    else if (phase === 'rally' && h.swingT <= 0){ if (!h.ai) h.q = -1; startSwing(h, h.req); }
    h.req = null;
  }
  // service : lancer de balle puis frappe
  if (h.serveT > 0){
    h.serveT -= DT; const u = 1 - h.serveT / 0.6;
    if (ball.held){ ball.x = h.x - h.hand * 0.1; ball.z = h.z; ball.y = 1.1 + 1.8 * Math.sin(Math.PI * Math.min(u, 0.75) * 0.667); }
    if (u >= 0.75 && ball.held){ serveBall(h, h.serveType, h.q, h.aim); h.swingType = 'serve'; h.swingDur = 0.3; h.swingT = 0.3; h.hitDone = true; h.swingSide = h.hand; }
  }
  if (h.swingT > 0){
    h.swingT -= DT;
    const u = 1 - h.swingT / h.swingDur;
    if (!h.hitDone && phase === 'rally' && !ball.held && ball.lastHitter !== h && u < 0.9){
      const d = Math.hypot(ball.x - h.x, ball.z - h.z);
      if (d < 1.6 && ball.y < 2.7 && ball.y > 0.03 && ball.z * h.side > -0.3 && ball.vz * h.side > -1){
        h.hitDone = true;
        const q = h.q >= 0 ? h.q : clamp(1 - d / 1.6, 0, 1) * 0.55 + 0.4;
        hitBall(h, h.swingType, q, h.aim);
      }
    }
  }
  // déplacement
  const serving = phase === 'serve' && server === h;
  let spd = PSPD * (h.swingT > 0 ? 0.45 : 1);
  if (h.serveT > 0) spd = 0;
  h.x += h.mx * spd * DT;
  if (!serving) h.z += h.mz * spd * DT;
  h.x = clamp(h.x, serving ? -5 : -8.5, serving ? 5 : 8.5);
  h.z = h.side > 0 ? clamp(h.z, 1.2, 14.2) : clamp(h.z, -14.5, -1.2);
  h.anim += Math.hypot(h.mx, h.mz) * spd * DT * 1.6;
}
function updateBall(){
  if (ball.held){
    if (!server.serveT){ ball.x = server.x - server.hand * 0.3; ball.z = server.z; ball.y = 1.05 + Math.abs(Math.sin(frame * 0.09)) * 0.35; }
    return;
  }
  ball.hitT += DT;
  const pz = ball.z;
  ball.vy -= G * DT; ball.x += ball.vx * DT; ball.y += ball.vy * DT; ball.z += ball.vz * DT;
  if ((pz > 0) !== (ball.z > 0) && Math.abs(ball.x) < CT.post && ball.y < netH(ball.x) + 0.03){
    ball.z = pz > 0 ? 0.06 : -0.06; ball.vz *= -0.12; ball.vx *= 0.4; if (ball.vy > 0) ball.vy *= 0.3;
    ball.net = true; sfx.net();
  }
  if (ball.y <= 0.035 && ball.vy < 0){
    ball.y = 0.035;
    if (ball.vy < -1){ const v = -ball.vy; ball.vy = v * 0.72; ball.vx *= 0.88; ball.vz *= 0.88; onBounce(v); }
    else { ball.vy = 0; ball.vx *= 0.96; ball.vz *= 0.96; }
  }
  ball.trail.push([ball.x, ball.y, ball.z]); if (ball.trail.length > 8) ball.trail.shift();
  if (phase === 'rally' && ball.hitT > 9){ endPoint(ball.lastHitter, 'Point !'); }
}
function step(){
  frame++;
  if (paused) return;

/* ---------- Rendu ---------- */
function drawPlayer(h){

  rr(-0.23, 1.52, 0.46, 0.56, 0.1, h.shirt);
  ctx.fillStyle = back ? 'rgba(255,255,255,.85)' : 'rgba(20,16,36,.8)';

function drawNet(){

function drawBall(){

function drawMarker(){

let wantW = 960;

  const pn = compact ? 0 : clamp(r.height * .1, 22, 72);

  const aw = r.width - 2 * side - 2 * bez - (compact ? 10 : 30), ah = r.height - m - pn - 2 * bez - (compact ? 6 : 14);

  const s = Math.max(0.1, Math.min(aw / W, ah / H));

  cvs.style.width = (W * s) + 'px'; cvs.style.height = (H * s) + 'px';

}
let last = 0, acc = 0;
function tick(ts){

}
