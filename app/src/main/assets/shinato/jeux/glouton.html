<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Le Glouton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{--laque:#b3261e;--or:#f2b640;--bois:#3a1f14;--creme:#fbead0;--vert:#45c46a}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0906;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Luckiest Guy",Impact,sans-serif;color:var(--creme)}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;gap:12px;align-items:center;pointer-events:none}
#belly{flex:1;height:22px;border:3px solid #000;border-radius:14px;background:#2b1410;overflow:hidden;position:relative;box-shadow:0 3px 0 #000}
#belly i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#7be38f,var(--vert));border-radius:10px;transition:width .2s}
#belly span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.04em;color:#fff;text-shadow:0 2px 0 #000}
#time{min-width:64px;text-align:center;font-size:28px;text-shadow:0 3px 0 #000}
#time.low{color:#ff5a4a}
#combo{position:fixed;top:44px;left:0;right:0;text-align:center;font-size:20px;color:var(--or);text-shadow:0 2px 0 #000;pointer-events:none;opacity:0;transition:opacity .2s}
#bite{position:fixed;left:18px;bottom:18px;width:96px;height:96px;border-radius:50%;border:4px solid #000;background:var(--or);color:#2a1300;font:22px "Luckiest Guy",Impact,sans-serif;box-shadow:0 6px 0 #000;touch-action:none}
#bite.on{transform:translateY(4px);box-shadow:0 2px 0 #000}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#1a0906cc;padding:20px;box-sizing:border-box}
.screen h1{margin:0;font-size:clamp(46px,12vw,96px);line-height:.95;color:var(--or);text-shadow:0 5px 0 var(--laque),0 9px 0 #000;font-weight:400}
.screen p{max-width:34em;font:600 clamp(15px,3.6vw,19px)/1.45 system-ui,sans-serif;margin:14px 0 4px}
.screen button{margin-top:16px;padding:12px 34px;border:4px solid #000;border-radius:16px;background:var(--or);color:#2a1300;font:26px "Luckiest Guy",Impact,sans-serif;box-shadow:0 6px 0 #000;cursor:pointer}
.screen button:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.screen button:focus-visible{outline:3px solid #fff;outline-offset:4px}
.hide{display:none!important}
</style>
<script>/* anti-touche bloquée */(()=>{let a={};addEventListener('pointerdown',e=>a[e.pointerId]=e.target,true);let f=e=>delete a[e.pointerId];addEventListener('pointerup',f,true);addEventListener('pointercancel',f,true);let r=()=>{Object.keys(a).forEach(i=>{try{a[i].dispatchEvent(new PointerEvent('pointercancel',{bubbles:true,pointerId:+i}))}catch(_){}});a={}};addEventListener('blur',r);document.addEventListener('visibilitychange',()=>document.hidden&&r())})();</script></head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide"><div id="belly"><i></i><span>Ventre</span></div><div id="time">30</div></div>
<div id="combo"></div>
<button id="bite" class="hide" aria-label="Croquer">Miam</button>
<div id="start" class="screen"><h1>Le Glouton</h1><p>Les plats défilent sur le comptoir. Touche l'écran quand un plat passe devant la bouche pour le croquer. Un plat raté ne remplit pas le ventre. Évite les arêtes et les piments !</p><p>Remplis la barre avant la fin des 30 secondes.</p><button id="go">Jouer</button></div>
<div id="end" class="screen hide"><h1 id="endT"></h1><p id="endP"></p><button id="again">Rejouer</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,U;function resize(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);U=Math.min(W/64,(H*.78-46)/42)}
addEventListener('resize',resize);resize();

// ---------- sons ----------
let AC=null;function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume()}
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});addEventListener('pagehide',()=>{if(AC){AC.close();AC=null}});
function tone(f0,f1,d,v,type='square'){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}
function crunch(){if(!AC)return;const t=AC.currentTime,b=AC.createBuffer(1,AC.sampleRate*.12,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;const g=AC.createGain();g.gain.value=.5;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
const sfx={eat:c=>{crunch();tone(420+c*40,700+c*50,.12,.08)},air:()=>tone(300,180,.1,.05,'triangle'),miss:()=>tone(220,140,.25,.07,'sawtooth'),bad:()=>{tone(160,90,.35,.12,'sawtooth')},
  tick:()=>tone(1200,1200,.04,.05),win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,.18,.1),i*110)),lose:()=>[392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,f*.97,.25,.1,'triangle'),i*160))};

// ---------- plats ----------
const GOOD=['burger','poulet'],BAD=['arete','piment'];
function drawFood(type,x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineWidth=2.2;ctx.strokeStyle='#1b0d08';
  const P=(f)=>{ctx.beginPath();f();ctx.fill();ctx.stroke()};
  if(type==='burger'){ctx.fillStyle='#e0a14a';P(()=>{ctx.ellipse(0,-5,17,10,0,Math.PI,0);ctx.closePath()});ctx.fillStyle='#fff5d6';for(const sx of[-8,-2,5,10])ctx.fillRect(sx,-11,1.6,1.2);
    ctx.fillStyle='#4fb04a';P(()=>{ctx.moveTo(-18,-4);for(let i=-18;i<=18;i+=6)ctx.lineTo(i+3,-1+((i/6)%2?2:0));ctx.lineTo(18,-4);ctx.closePath()});
    ctx.fillStyle='#f5c53a';ctx.fillRect(-16,-3,32,3);ctx.fillStyle='#6b3a1f';P(()=>{ctx.roundRect?ctx.roundRect(-17,0,34,6,3):ctx.rect(-17,0,34,6)});
    ctx.fillStyle='#d9913e';P(()=>{ctx.moveTo(-16,6);ctx.lineTo(16,6);ctx.quadraticCurveTo(15,12,0,12);ctx.quadraticCurveTo(-15,12,-16,6)})}
  else if(type==='poulet'){ctx.rotate(-.3);ctx.fillStyle='#f4ead8';P(()=>{ctx.rect(4,-3,14,6)});P(()=>{ctx.arc(19,-4,3.5,0,7)});P(()=>{ctx.arc(19,4,3.5,0,7)});
    ctx.fillStyle='#c8691f';P(()=>{ctx.ellipse(-6,0,14,10,0,0,7)});ctx.fillStyle='#e58a35';ctx.beginPath();ctx.ellipse(-9,-3,6,3.5,-.3,0,7);ctx.fill()}
  else if(type==='ravioli'){ctx.fillStyle='#f3dcb0';P(()=>{ctx.moveTo(-16,4);ctx.quadraticCurveTo(0,-20,16,4);ctx.quadraticCurveTo(0,10,-16,4)});ctx.strokeStyle='#c9a46a';for(let i=-8;i<=8;i+=4){ctx.beginPath();ctx.moveTo(i,-6+Math.abs(i)*.4);ctx.lineTo(i*1.1,-1);ctx.stroke()}}
  else if(type==='bao'){ctx.fillStyle='#fbf6ec';P(()=>{ctx.ellipse(0,0,15,12,0,Math.PI,0);ctx.lineTo(15,4);ctx.quadraticCurveTo(0,9,-15,4);ctx.closePath()});ctx.fillStyle='#e8a05a';ctx.beginPath();ctx.arc(0,-11,2.4,0,7);ctx.fill()}
  else if(type==='nem'){ctx.rotate(-.25);ctx.fillStyle='#e0a040';P(()=>{ctx.roundRect?ctx.roundRect(-18,-6,36,12,6):ctx.rect(-18,-6,36,12)});ctx.strokeStyle='#a8661e';for(let i=-12;i<=12;i+=6){ctx.beginPath();ctx.moveTo(i,-5);ctx.lineTo(i+3,5);ctx.stroke()}}
  else if(type==='riz'){ctx.fillStyle='#fff';P(()=>{ctx.arc(0,-2,13,Math.PI,0)});ctx.fillStyle='#c62f24';P(()=>{ctx.moveTo(-16,-2);ctx.lineTo(16,-2);ctx.quadraticCurveTo(14,12,0,12);ctx.quadraticCurveTo(-14,12,-16,-2)});ctx.fillStyle='#f2b640';ctx.fillRect(-9,3,18,2)}
  else if(type==='crevette'){ctx.fillStyle='#ff8a5b';P(()=>{ctx.arc(0,0,11,Math.PI*.2,Math.PI*1.6);ctx.arc(-2,0,5,Math.PI*1.6,Math.PI*.2,true)});ctx.fillStyle='#ff6a3d';P(()=>{ctx.moveTo(6,8);ctx.lineTo(14,12);ctx.lineTo(9,4)})}
  else if(type==='arete'){ctx.strokeStyle='#d9d6cf';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(12,0);ctx.stroke();for(let i=-10;i<=8;i+=5){ctx.beginPath();ctx.moveTo(i,-7);ctx.lineTo(i+2,0);ctx.lineTo(i,7);ctx.stroke()}
    ctx.fillStyle='#d9d6cf';ctx.strokeStyle='#1b0d08';ctx.lineWidth=2;P(()=>{ctx.moveTo(12,0);ctx.lineTo(19,-7);ctx.lineTo(19,7);ctx.closePath()});P(()=>{ctx.arc(-17,0,4,0,7)})}
  else if(type==='piment'){ctx.fillStyle='#e0231b';P(()=>{ctx.moveTo(-14,-4);ctx.quadraticCurveTo(4,-10,14,4);ctx.quadraticCurveTo(0,4,-14,4);ctx.closePath()});ctx.fillStyle='#3aa447';P(()=>{ctx.ellipse(-15,0,4,5,0,0,7)})}
  ctx.restore()}

// ---------- état du jeu ----------
const DUR=30,GOAL=100;
let grabs=[],nextSide=1;const G=.95;let state='menu',t=0,left=DUR,fill=0,shown=0,combo=0,foods=[],spawnIn=0,chomp=0,chew=0,sick=0,sad=0,pops=[],crumbs=[],lastTick=0,blink=0;
function reset(){grabs=[];heart=0;t=0;left=DUR;fill=0;shown=0;combo=0;foods=[];spawnIn=.6;chomp=0;chew=0;sick=0;sad=0;pops=[];crumbs=[];lastTick=0}
function layout(){const cy=H*.78;return{cx:W/2,counterY:cy,beltY:cy+U*1.6,head:{x:W/2,y:cy-U*28},scale:U/3.1}}
function speed(){return W*(0.16+0.16*Math.min(1,t/DUR))}
function spawn(){const bad=Math.random()<.2&&t>2;foods.push({type:bad?BAD[Math.random()*2|0]:GOOD[Math.random()*GOOD.length|0],x:W+40,bad,eaten:false,passed:false,bob:Math.random()*6})}
function pop(txt,col){const L=layout();pops.push({txt,col,x:W/2+U*20,y:L.head.y-U*6,l:.9})}
function bite(){if(state!=='play'||sick>0)return;
  // une seule main à la fois va chercher ; l'autre peut partir quand la première est déjà à la bouche
  if(grabs.some(g=>g.t/G<.55))return;const side=grabs.length&&grabs[0].side===nextSide?-nextSide:nextSide;
  const L=layout(),zone=U*7.5;let best=null;for(const f of foods){if(f.eaten)continue;const d=Math.abs(f.x-L.cx);if(d<zone&&(!best||d<Math.abs(best.x-L.cx)))best=f}
  grabs.push({t:0,side,food:best,done:false,perfect:best&&Math.abs(best.x-L.cx)<U*2.4});nextSide=-side;
  if(best)best.eaten=true;else sfx.air()}
// le plat arrive dans la bouche : effet de la bouchée
function swallow(g){const f=g.food,L=layout();if(!f)return;
  if(f.bad){lastBad=f.type==='piment'?'piment':'arete';fill=Math.max(0,fill-12);combo=0;sick=.9;sfx.bad();pop(f.type==='piment'?'Ça pique !':'Une arête !','#ff5a4a')}
  else{combo++;const gain=7.2+Math.min(4,(combo-1));fill=Math.min(GOAL,fill+gain);chew=.5;if(f.type==='poulet'){heart=.35;chew=.85}sfx.eat(Math.min(combo,8));
    pop(g.perfect?'Parfait !':'Miam !',g.perfect?'#f2b640':'#fbead0');
    for(let i=0;i<9;i++)crumbs.push({x:L.cx+(Math.random()-.5)*U*6,y:L.head.y+U*7,vx:(Math.random()-.5)*U*30,vy:-Math.random()*U*25,l:.6})}}
const ease=k=>k*k*(3-2*k);
// position de la main qui attrape (repos -> plat -> bouche -> repos)
function handPos(side){const L=layout(),rest={x:L.cx+side*U*17,y:L.counterY-U*1.5};const g=grabs.find(q=>q.side===side);
  if(!g)return{...rest,hold:false,open:false,bite:0};
  const k=g.t/G,mouth={x:L.cx+side*U*1.5,y:L.head.y+U*8.2},f=g.food;
  const tgt=f?{x:f.x,y:L.beltY-U*1.8}:{x:L.cx+side*U*3,y:L.beltY-U*1.2};
  if(k<.25){const e=ease(k/.25);return{x:rest.x+(tgt.x-rest.x)*e,y:rest.y+(tgt.y-rest.y)*e-Math.sin(e*Math.PI)*U*3,hold:false,open:true,bite:0}}   // il tend la main
  if(k<.35)return{...tgt,hold:!!f,open:false,bite:0}                                                                                           // il referme les doigts
  if(k<.6){const e=ease((k-.35)/.25);return{x:tgt.x+(mouth.x-tgt.x)*e,y:tgt.y+(mouth.y-tgt.y)*e-Math.sin(e*Math.PI)*U*5,hold:!!f,open:false,bite:0}} // il monte le plat
  if(k<.84)return{x:mouth.x,y:mouth.y+Math.sin((k-.6)*40)*U*.3,hold:!!f,open:false,bite:(k-.6)/.24}                                          // il croque dans sa main
  const e=ease((k-.84)/.16);return{x:mouth.x+(rest.x-mouth.x)*e,y:mouth.y+(rest.y-mouth.y)*e,hold:false,open:false,bite:0}}                   // il repose la main
// les deux bras, dessinés par-dessus le comptoir pour que la main puisse attraper sur le tapis
function arms(){const L=layout(),hx=L.cx;
  for(const sd of[-1,1]){const hp=handPos(sd),sh={x:hx+sd*U*15,y:L.head.y+U*13};
    const el={x:(sh.x+hp.x)/2+sd*U*7,y:Math.max(sh.y,hp.y)+U*4};
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle='#1b0d08';ctx.lineWidth=U*6.4;ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(el.x,el.y);ctx.lineTo(hp.x,hp.y);ctx.stroke();
    ctx.strokeStyle='#2f5d8c';ctx.lineWidth=U*5.4;ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(el.x,el.y);ctx.lineTo(hp.x-(hp.x-el.x)*.25,hp.y-(hp.y-el.y)*.25);ctx.stroke();
    // main : ouverte en approchant, fermée quand elle tient le plat
    const open=hp.open;
    ctx.fillStyle='#e6b08a';ctx.strokeStyle='#1b0d08';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(hp.x,hp.y,U*(open?4:3.4),U*(open?3.2:2.8),0,0,7);ctx.fill();ctx.stroke();
    if(hp.hold){const g=grabs.find(q=>q.side===sd);const left=1-Math.min(1,hp.bite)*.85;if(left>.18)drawFood(g.food.type,hp.x-sd*U*1,hp.y-U*2.6,L.scale*left)} // le plat tenu dans la main, il diminue à chaque bouchée
    if(open||hp.hold){ctx.beginPath();ctx.moveTo(hp.x-sd*U*2.6,hp.y-U*1);ctx.quadraticCurveTo(hp.x-sd*U*4.4,hp.y-U*2.6,hp.x-sd*U*3.2,hp.y-U*3.6);ctx.stroke()}}}
// commandes : toucher l'écran, le bouton ou la barre d'espace
cv.addEventListener('pointerdown',e=>{e.preventDefault();bite()});
const bb=document.getElementById('bite');bb.addEventListener('pointerdown',e=>{e.preventDefault();bb.classList.add('on');bite()});['pointerup','pointercancel','pointerleave'].forEach(ev=>bb.addEventListener(ev,()=>bb.classList.remove('on')));
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='Enter'){e.preventDefault();if(state==='play')bite()}});
const $=id=>document.getElementById(id);
function begin(){initAudio();reset();state='play';$('start').classList.add('hide');$('end').classList.add('hide');$('hud').classList.remove('hide');bb.classList.remove('hide')}
$('go').onclick=begin;$('again').onclick=begin;
function finish(win){endWin=win;state='end';try{window.parent.postMessage({type:'glouton:fin',gagne:!!win},'*')}catch(e){}$('hud').classList.add('hide');bb.classList.add('hide');$('combo').style.opacity=0;
  $('endT').textContent=win?'Rassasié !':'Encore faim…';
  $('endP').textContent=win?`Ventre plein en ${t.toFixed(1)} secondes. Bravo !`:`Ventre rempli à ${Math.round(fill)} %. Il faut le remplir avant la fin du temps.`;
  $('end').classList.remove('hide');win?sfx.win():sfx.lose()}

// ---------- dessin du décor ----------
function lantern(x,y,r,tt){ctx.save();ctx.translate(x,y+Math.sin(tt*1.3+x)*2);const g=ctx.createRadialGradient(0,0,0,0,0,r*3);g.addColorStop(0,'#ff9a3c55');g.addColorStop(1,'#ff9a3c00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*3,0,7);ctx.fill();
  ctx.fillStyle='#d8261c';ctx.strokeStyle='#1b0d08';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,r,r*1.15,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#f2b640';ctx.fillRect(-r*.45,-r*1.25,r*.9,r*.22);ctx.fillRect(-r*.45,r*1.05,r*.9,r*.22);
  ctx.strokeStyle='#8f1510';for(const k of[-.5,0,.5]){ctx.beginPath();ctx.ellipse(0,0,r*Math.abs(k)+.1,r*1.12,0,0,7);ctx.stroke()}ctx.restore()}
// ---------- décor : le restaurant de ramen (image fournie) ----------
const BGI=new Image();BGI.src='/assets/shinato/m/13afe48959d0a374.webp';const BGW=1672,BGH=941,BG_COMPTOIR=745; // hauteur du plateau du comptoir dans l'image
function background(tt){const L=layout();ctx.fillStyle='#1a0906';ctx.fillRect(0,0,W,H);if(!BGI.complete)return;
  const s=Math.max(W/BGW,H/BGH)*1.02,iw=BGW*s,ih=BGH*s;
  let oy=L.beltY-BG_COMPTOIR*s;oy=Math.min(0,Math.max(H-ih,oy));      // le tapis tombe sur le comptoir de l'image
  const ox=(W-iw)/2;ctx.imageSmoothingQuality='high';ctx.drawImage(BGI,ox,oy,iw,ih)}
function counter(tt){const L=layout();
  // tapis roulant
  ctx.fillStyle='#2b2b30';ctx.fillRect(0,L.beltY-U*1.2,W,U*3.6);ctx.strokeStyle='#44444b';ctx.lineWidth=2;
  const off=(tt*speed())%(U*5);for(let x=-off;x<W;x+=U*5){ctx.beginPath();ctx.moveTo(x,L.beltY-U*1.2);ctx.lineTo(x,L.beltY+U*2.4);ctx.stroke()}
  // zone devant la bouche
  ctx.save();ctx.globalAlpha=.55+.2*Math.sin(tt*6);ctx.strokeStyle='#f2b640';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.strokeRect(L.cx-U*7.5,L.beltY-U*6,U*15,U*8.4);ctx.restore()}
