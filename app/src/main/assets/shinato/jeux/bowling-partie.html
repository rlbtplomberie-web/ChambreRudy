<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bowling de Rudy</title>
<style>
:root{--neon:#ff3fb4;--cyan:#38e8ff;--gold:#ffd23f;--bg:#0c0716;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#score{position:fixed;left:0;right:0;top:0;padding:4px 4px 2px;padding-top:max(4px,env(safe-area-inset-top));background:linear-gradient(#000d,#0007);z-index:5;display:none}
#score table{border-collapse:collapse;margin:0 auto;font-size:clamp(9px,2.6vw,14px)}
#score td{border:1px solid #ffffff30;text-align:center;padding:0;min-width:clamp(20px,6.3vw,40px);height:1.15em}
#score td.nm{min-width:clamp(40px,11vw,80px);text-align:left;padding:0 3px;font-weight:bold}
#score tr.cur td.nm{color:var(--gold)}
#score tr.cur{background:#ff3fb422}
#score .mk{display:flex;justify-content:flex-end;gap:1px;font-size:.85em;color:#cfe}
#score .mk span{min-width:.95em;border-left:1px solid #ffffff25}
#score .tot{font-weight:bold}
#score td.fr.now{background:#ffd23f30}
/* le tableau des scores en petit panneau à droite (noms + totaux) : il ne cache plus la piste */
#score{left:auto!important;right:max(8px,env(safe-area-inset-right))!important;top:calc(9vmin + 16px)!important;padding:4px!important;background:#000b!important;border-radius:10px;border:1px solid #ffffff30}
#score td.fr{display:none}
#score table{font-size:13px!important;margin:0!important}
#score td{height:1.25em}
#banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(4px,env(safe-area-inset-top)) + 4.6em);z-index:4;font-size:clamp(13px,3.6vw,20px);font-weight:bold;text-shadow:0 0 8px var(--neon),0 2px 2px #000;white-space:nowrap;display:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:4;font-size:clamp(12px,3.4vw,17px);background:#000a;padding:4px 12px;border-radius:14px;border:1px solid #ffffff30;display:none;white-space:nowrap}
#ctl{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:none;justify-content:center;align-items:center;gap:14px;z-index:6}
.btn{border:2px solid #ffffff55;background:radial-gradient(circle at 50% 30%,#6a3a98,#2a1040 70%);color:#fff;font:bold clamp(15px,4.2vw,20px) inherit;border-radius:16px;padding:12px 18px;min-width:64px;box-shadow:0 6px 0 #12061f,0 8px 14px #000a,inset 0 2px 0 #ffffff40;text-shadow:0 2px 0 #0008;transition:transform .05s,box-shadow .05s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #12061f,0 2px 6px #000a,inset 0 2px 0 #ffffff30}
#bl,#br{width:clamp(58px,15vw,74px);height:clamp(58px,15vw,74px);min-width:0;padding:0;border-radius:50%;font-size:clamp(20px,6vw,28px);background:radial-gradient(circle at 40% 30%,#7ee9ff,#1b8fc2 45%,#0b4a70 80%);border:3px solid #cfefff;box-shadow:0 7px 0 #062c44,0 10px 16px #000b,inset 0 3px 0 #ffffffa0}
#bl:active,#br:active{box-shadow:0 1px 0 #062c44,0 3px 6px #000b,inset 0 3px 0 #ffffff80}
#go{min-width:clamp(140px,40vw,190px);height:clamp(58px,15vw,74px);border-radius:40px;background:radial-gradient(ellipse at 50% 25%,#ff9ad8,#ff2a9a 45%,#a0106a 85%);border:3px solid #ffe0f3;box-shadow:0 7px 0 #5a0638,0 10px 18px #000b,0 0 22px #ff3fb488,inset 0 3px 0 #ffffffa0;letter-spacing:1px}
#go:active{box-shadow:0 1px 0 #5a0638,0 3px 6px #000b,0 0 22px #ff3fb488,inset 0 3px 0 #ffffff80}
#go.armed{animation:pulse .6s infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}
#big{position:fixed;left:0;right:0;top:27%;display:none;flex-direction:column;align-items:center;z-index:7;pointer-events:none;text-align:center}
#big .lbl{font-size:clamp(34px,11vw,64px);font-weight:900;letter-spacing:2px;color:var(--gold);text-shadow:0 0 16px var(--neon),0 0 30px var(--neon),0 4px 0 #000;animation:pop .45s ease-out}
#big .lbl.gold{font-size:clamp(42px,14vw,84px);color:#fff6c2;text-shadow:0 0 10px #ffd23f,0 0 26px #ff8a00,0 0 46px #ff3fb4,0 5px 0 #000}
#big .lbl.bad{color:#ff6b6b;text-shadow:0 0 14px #ff0033,0 4px 0 #000}
#big .sub{margin-top:4px;font-size:clamp(14px,4.2vw,22px);color:#fff;text-shadow:0 2px 3px #000}
#card{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:8;background:#0008}
#card .frame{background:#fff;border-radius:18px;padding:6px;box-shadow:0 0 0 4px var(--neon),0 0 40px var(--neon);animation:pop .35s ease-out}
#card img{display:block;height:min(52vh,90vw*1.48);max-width:86vw;object-fit:contain;border-radius:12px}
#card .lbl{margin-top:16px;font-size:clamp(28px,9vw,54px);font-weight:900;letter-spacing:2px;color:var(--gold);text-shadow:0 0 14px var(--neon),0 3px 0 #000;animation:pop .45s ease-out}
#card .sub{margin-top:4px;font-size:clamp(14px,4vw,20px);color:#ddd}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#menu,#end{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:max(18px,env(safe-area-inset-top)) 12px 18px;background:radial-gradient(ellipse at 50% 30%,#3a1050 0%,#0c0716 70%);overflow-y:auto;touch-action:pan-y}
h1{margin:6px 0 2px;font-size:clamp(34px,11vw,72px);letter-spacing:4px;color:#fff;text-shadow:0 0 6px #fff,0 0 18px var(--neon),0 0 40px var(--neon);font-style:italic}
.sub1{color:var(--cyan);text-shadow:0 0 10px var(--cyan);font-size:clamp(13px,3.8vw,20px);margin-bottom:10px}
#cast{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;max-width:760px;margin:6px 0}
.who{flex:0 0 calc(20% - 6px);min-width:0;max-width:150px;border:2px solid #ffffff25;border-radius:14px;padding:5px 2px 7px;text-align:center;background:#ffffff08;cursor:pointer;position:relative;transition:.2s}
.who canvas{position:static;display:block;margin:0 auto;height:min(17vh,30vw);width:auto;max-width:100%;aspect-ratio:3/5}
.who .n{font-weight:bold;font-size:clamp(11px,3.3vw,20px)}
.who .t{font-size:clamp(10px,2.8vw,13px);color:#bbb}
.who.on{border-color:var(--neon);box-shadow:0 0 16px #ff3fb488;background:#ff3fb415}
.who.off{opacity:.35}
.who.me{border-color:var(--cyan);box-shadow:0 0 14px #38e8ff77}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.opt{border:1px solid #ffffff40;border-radius:12px;padding:6px 12px;background:#ffffff10;font-size:clamp(12px,3.4vw,16px)}
.opt.sel{background:var(--neon);border-color:#fff}
.small{font-size:clamp(11px,3vw,14px);color:#aaa;text-align:center;max-width:560px;line-height:1.4}
.tscr{position:fixed;inset:0;z-index:11;background:#060312;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(22px) brightness(.45)}
.stage{position:relative;width:min(100vw,177.7vh);aspect-ratio:1672/941}
.timg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hz{position:absolute;left:4.6%;width:35.8%;height:14.6%;border:0;border-radius:2vw;background:transparent;cursor:pointer;transition:transform .08s,box-shadow .15s,background .15s}
.hz:hover{background:#ffffff14;box-shadow:0 0 24px #ffd23f99}
.hz:active,.hz.press{transform:scale(.96);background:#ffffff30;box-shadow:0 0 34px #ffd23f}
.back{position:absolute;right:2%;bottom:3%;font:bold clamp(12px,2vw,18px) "Trebuchet MS",sans-serif;color:#fff;background:#0009;border:2px solid #ffffff70;border-radius:20px;padding:6px 14px;cursor:pointer}
@media (orientation:portrait){.tscr{justify-content:flex-start}.stage{width:min(185vw,177.7vh)}.back{right:auto;left:calc(100vw - 110px);bottom:4%;font-size:15px}}
@media (orientation:landscape){
 #ctl{justify-content:flex-start;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));gap:10px}
 #bl{order:0}#br{order:1}#go{order:2;margin-left:auto}
 #topbtns{right:auto!important;left:max(6px,env(safe-area-inset-left))!important;top:6px!important;bottom:auto!important}
 #banner{font-size:clamp(12px,2.2vw,16px)!important}
 #end{display:grid!important;grid-template-columns:auto auto;grid-template-rows:auto 1fr auto;justify-content:center;align-content:center;column-gap:5vw;padding:10px}
 #end[style*='none']{display:none!important}
 #endt{grid-column:1/3;margin:4px 0 8px!important;text-align:center}
 #endimg{grid-row:2/4;height:66vh!important}
 #rank{margin:0!important;align-self:center;font-size:clamp(13px,2.4vw,20px)!important;line-height:1.45!important}
 #end .row{grid-column:2;margin:6px 0 0}
 #hint{bottom:auto!important;top:calc(var(--sh,60px) + 34px)!important}
}
.tv{position:fixed;top:24%;width:27vw;aspect-ratio:1344/768;z-index:5;display:none;perspective:600px;pointer-events:none}
.tv.l{left:2vw}.tv.r{right:2vw}
.tv video{width:100%;height:100%;object-fit:cover;display:block;border-radius:8px;border:4px solid #1a1026;outline:3px solid #ffd23f;box-shadow:0 0 22px #ffd23f,0 0 50px #ff3fb4aa,0 10px 30px #000c;background:#000}
.tv.l video{transform:rotateY(16deg)}.tv.r video{transform:rotateY(-16deg)}
.tv.spare video{outline-color:#38e8ff;box-shadow:0 0 22px #38e8ff,0 0 50px #2a6ad8aa,0 10px 30px #000c}
.tv.spare .tvlbl{color:#d8fbff;text-shadow:0 0 8px #38e8ff,0 0 16px #2a6ad8}
.tv.miss video{outline-color:#ff3f5a;box-shadow:0 0 22px #ff3f5a,0 0 50px #ff0033aa,0 10px 30px #000c}
.tv.miss .tvlbl{color:#ffd0d6;text-shadow:0 0 8px #ff3f5a,0 0 16px #ff0033}
.tv.on{display:block;animation:tvin .35s ease-out}
@keyframes tvin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.tvlbl{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font:900 clamp(11px,1.6vw,18px) "Trebuchet MS",sans-serif;color:#fff6c2;text-shadow:0 0 8px #ffd23f,0 0 16px #ff3fb4;animation:pulse .5s infinite alternate}
@media (orientation:portrait){.tv{top:auto;bottom:12%;width:44vw}.tv.l{left:3vw}.tv.r{right:3vw}}
#rot{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#3a1050,#0c0716 75%);color:#fff;text-align:center;padding:20px}
#rot .ph{font-size:80px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rot .rt{margin-top:24px;font:900 26px "Trebuchet MS",sans-serif;color:#ffd23f;text-shadow:0 0 14px #ff3fb4}
#rot .rs{margin-top:8px;font-size:15px;color:#ccc}
@media (orientation:portrait){#rot{display:flex}}
#play:disabled{filter:grayscale(1) brightness(.6)}
.who.full{opacity:.35}
.card{position:absolute;border:0;padding:0;background:transparent;border-radius:1vw;cursor:pointer;transition:transform .1s,box-shadow .15s,filter .15s}
.card:hover{box-shadow:0 0 18px #ffd23faa}
.card.on{box-shadow:0 0 0 .35vw #ff3fb4,0 0 2.2vw #ff3fb4,inset 0 0 3vw #ff3fb466;transform:scale(1.03)}
.card.on::after{content:'✔';position:absolute;top:3%;right:5%;width:3.2vw;height:3.2vw;min-width:22px;min-height:22px;border-radius:50%;background:#ff3fb4;color:#fff;font:bold clamp(12px,1.8vw,22px)/1 sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px #ff3fb4}
.card.dim{background:#0009}
.card.pop{animation:cpop .25s}
@keyframes cpop{50%{transform:scale(1.08)}}
.ctl3{position:absolute;bottom:3%;display:flex;flex-direction:column;gap:.8vw;align-items:stretch;width:12.5%}
.ctl3.l{left:.6%}.ctl3.r{right:.6%}
#cnt3{background:#000b;border:2px solid #ffd23f;border-radius:1vw;color:#ffd23f;font:900 clamp(12px,1.9vw,26px) "Trebuchet MS",sans-serif;text-align:center;padding:.5vw .3vw;text-shadow:0 0 8px #ff8a00}
#cnt3 small{display:block;color:#fff;font-size:.55em;font-weight:bold;text-shadow:none}
.b3{font:bold clamp(11px,1.5vw,20px) "Trebuchet MS",sans-serif;color:#fff;background:radial-gradient(circle at 50% 30%,#5a3a98,#22104a);border:2px solid #ffffff66;border-radius:1vw;padding:.7vw .4vw;cursor:pointer;box-shadow:0 .4vw 0 #0c0420}
.b3:active{transform:translateY(.3vw);box-shadow:0 .1vw 0 #0c0420}
.b3.go{background:radial-gradient(ellipse at 50% 25%,#ff9ad8,#ff2a9a 45%,#a0106a 85%);border-color:#ffe0f3;font-size:clamp(14px,2.1vw,28px);padding:1.4vw .4vw;box-shadow:0 .5vw 0 #5a0638,0 0 2vw #ff3fb488}
.b3.go:disabled{filter:grayscale(1) brightness(.55);box-shadow:none}
.b3.go:not(:disabled){animation:pulse .6s infinite alternate}
@media (orientation:portrait){#t3{flex-direction:column;justify-content:center}#t3 .stage{width:100vw}
 #t3 .ctl3{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));width:44vw;flex-direction:row;flex-wrap:wrap}
 #t3 .ctl3.l{left:3vw}#t3 .ctl3.r{right:3vw}#cnt3{width:100%;font-size:16px;border-radius:10px}.b3{flex:1;font-size:14px;padding:10px 4px;border-radius:10px}.b3.go{font-size:20px;padding:22px 4px}}
#end h2{margin:10px 0;font-size:clamp(26px,8vw,48px);color:var(--gold);text-shadow:0 0 14px var(--neon)}
#endimg{height:min(46vh,70vw);filter:drop-shadow(0 0 18px #ff3fb4)}
#rank{margin:12px 0;font-size:clamp(15px,4.4vw,22px);text-align:center;line-height:1.6}
#topbtns{position:fixed;right:6px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:7;display:none;flex-direction:column;gap:6px}
#topbtns button{font-size:16px;padding:6px 8px;min-width:0;border-radius:10px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="score"><table id="tbl"></table></div>
<div id="banner"></div>
<div id="hint"></div>
<div id="ctl">
  <button class="btn" id="bl">◀</button>
  <button class="btn" id="go">VISER</button>
  <button class="btn" id="br">▶</button>
</div>
<div id="topbtns"><button class="btn" id="snd">🔊</button><button class="btn" id="quit">☰</button></div>
<div id="big"><div class="lbl" id="biglbl"></div><div class="sub" id="bigsub"></div></div>
<div id="card"><div class="frame"><img id="cardimg" alt=""></div><div class="lbl" id="cardlbl"></div><div class="sub" id="cardsub"></div></div>

<div class="tv l" id="tvL"><video id="vidL" playsinline muted preload="auto"></video><div class="tvlbl">★ STRIKE ★</div></div>
<div class="tv r" id="tvR"><video id="vidR" playsinline preload="auto"></video><div class="tvlbl">★ STRIKE ★</div></div>
<audio id="bgm" loop preload="auto"></audio>
<div id="rot"><div class="ph">📱</div><div class="rt">Tourne ton téléphone</div><div class="rs">Le jeu se joue uniquement en horizontal</div></div>
<div class="tscr" id="t1"><div class="tbg"></div><div class="stage"><img class="timg" alt="Miminia Bowling">
  <button class="hz" data-v="2" style="top:42.3%"></button><button class="hz" data-v="5" style="top:59.4%"></button><button class="hz" data-v="8" style="top:76.6%"></button></div></div>
<div class="tscr" id="t2" style="display:none"><div class="tbg"></div><div class="stage"><img class="timg" alt="Choix des frames">
  <button class="hz" data-f="3" style="top:42.3%"></button><button class="hz" data-f="5" style="top:59.4%"></button><button class="hz" data-f="10" style="top:76.6%"></button>
  <button class="back" id="t2back">◀ Retour</button></div></div>
<div class="tscr" id="t3" style="display:none"><div class="tbg"></div><div class="stage" id="st3"><img class="timg" alt="Choix des joueuses">
  <div class="ctl3 l"><div id="cnt3"></div><button class="b3" id="back3">◀ Retour</button><button class="b3" id="rand3">🎲 Hasard</button></div>
  <div class="ctl3 r"><button class="b3 go" id="play3" disabled>JOUER ▶</button></div></div></div>
<div id="menu" style="display:none">
  <h1 style="font-size:clamp(26px,8vw,52px)">CHOIX DES JOUEURS</h1>
  <div class="sub1" id="selinfo"></div>
  <div id="cast"></div>
  <div class="row"><button class="btn" id="selback">◀ Retour</button><button class="btn" id="selrand">🎲 Au hasard</button>
  <button class="btn" id="play" style="background:linear-gradient(#ff3fb4,#a0167a);font-size:22px;padding:14px 34px">JOUER</button></div>
  <div class="small" style="margin-top:14px">◀ ▶ placer Rudy · 1ᵉʳ appui : viser · 2ᵉ : puissance · 3ᵉ : effet<br>(clavier : flèches + espace)</div>
</div>

<div id="end" style="display:none">
  <h2 id="endt"></h2>
  <img id="endimg" alt="">
  <div id="rank"></div>
  <div class="row"><button class="btn" id="again" style="background:linear-gradient(#ff3fb4,#a0167a)">REJOUER</button><button class="btn" id="tomenu">MENU</button></div>
</div>

  else{const xs=standing.map(q=>q.x);tx=xs.reduce((a,b)=>a+b,0)/xs.length;if(standing.length===0)tx=0;}

let last=performance.now(),acc=0;
function loop(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;stepFX(dt);
  if(G&&st.phase!=='menu'&&st.phase!=='end')update(dt);
  if(G)draw();
  requestAnimationFrame(loop);
}
function update(dt){
  st.t+=dt;const c=curC();
  switch(st.phase){
    case 'walk': if(st.t>st.walkDur&&st.pickAfter&&c.pick){st.phase='pick';st.t=0;break;}
      if(st.t>st.walkDur){st.phase='aim';st.t=0;st.aimStep=0;st.osc=0;if(!c.human){cpuAim();}updateUI();} break;
    case 'pick':{const tot=c.pick.reduce((a,b)=>a+b[1],0);if(st.t>tot){st.phase='aim';st.t=0;st.aimStep=0;st.osc=0;if(!c.human){cpuAim();}updateUI();}break;}
    case 'aim':
      if(c.human){
        if(st.aimStep===0&&hold){st.posX=Math.max(-0.42,Math.min(0.42,st.posX+hold*dt*0.45));}
        const spd=[0,2.6,3.2,3.4][st.aimStep];st.osc+=dt*spd;
        if(st.aimStep===1)st.dir=Math.sin(st.osc)*0.075;
        if(st.aimStep===2)st.pow=(1-Math.cos(st.osc))/2;
        if(st.aimStep===3)st.spin=Math.sin(st.osc);
      } else if(st.t>0.9){doThrow();}
      break;
    case 'throw':{
      if(st.t>=TREL&&!ball){ball=makeBall(st.posX,st.dir,st.pow,st.spin);
        if(st.relScreen){const sb=(st.relScreen.y-cam.hy)/cam.camH;const dB=cam.s0*D0/sb-D0+cam.c;ball.d=Math.min(0.05,dB);ball.x=Math.max(-LANE+0.12,Math.min(LANE-0.12,(st.relScreen.x-cam.cxs)/sb));}
        thud();startRoll();st.phase='roll';st.t=0;st.relT=0;}
      break;}
    case 'roll':{
      st.relT=(st.relT||0)+dt;
      if(!ball.slowDone&&!ball.gutter&&ball.d>PIN_D-0.9&&Math.abs(ball.x)<0.24){ball.slowDone=true;SLOW=0.75;}
      if(SLOW>0){SLOW-=dt;dt*=0.35;}
      const n=4;for(let i=0;i<n;i++){stepBall(ball,dt/n,true);stepPins(dt/n);}
      const target=st.relT<0.35?0:Math.max(0,Math.min(11.5,ball.d-4.2));cam.c+=(target-cam.c)*Math.min(1,dt*3);
      setRoll(ball.inPit?0:ball.gutter?0.7:0.55);
      if(ball.inPit||ball.d>PIT){stopRoll();st.phase='settle';st.t=0;}
      break;}
    case 'settle':{
      const n=4;for(let i=0;i<n;i++){stepBall(ball,dt/n,true);stepPins(dt/n);}
      if((st.t>0.9&&!pinsMoving())||st.t>3.4){st.t=0;finishRoll();}
      break;}
  }
  if(st.phase==='back'){const n=4;for(let i=0;i<n;i++){stepPins(dt/n);}
    const k=Math.min(1,st.t/1.1);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cam.c=st.camFrom*(1-e);
    if(k>=1){cam.c=0;st.phase='react';st.t=0;showBig();}}
  else if(st.phase==='react'){if(st.t>(st.reactDur||2.6))advance();}
  else if(st.phase==='leave'){if(st.t>1.3)finishLeave();}
  if(st.phase==='walk'){cam.c+=(0-cam.c)*Math.min(1,dt*4);}
}

document.getElementById('selrand').onclick=()=>{GIRLS.forEach(g=>sel[g]=false);const pool=GIRLS.slice().sort(()=>Math.random()-0.5);pool.slice(0,nvs).forEach(g=>sel[g]=true);buildMenu();};
function nSel(){return GIRLS.filter(g=>sel[g]).length;}
const CARDS={ameline:[115,85,360,505],faty:[362,85,600,505],rose:[603,85,834,505],karine:[838,85,1070,505],mifa:[1073,85,1308,505],sophie:[1310,85,1555,505],
 katila:[232,515,471,930],gisele:[474,515,712,930],aline:[718,515,950,930],miminia:[955,515,1192,930],colica:[1197,515,1440,930]};
(function(){const st3=document.getElementById('st3');document.querySelector('#t3 .timg').src=SPR.title3[0].src;document.querySelector('#t3 .tbg').style.backgroundImage=`url(${SPR.title3[0].src})`;
 for(const id in CARDS){const [x0,y0,x1,y1]=CARDS[id];const b=document.createElement('button');b.className='card';b.dataset.id=id;
  b.style.cssText=`left:${x0/16.72}%;top:${y0/9.41}%;width:${(x1-x0)/16.72}%;height:${(y1-y0)/9.41}%`;
  b.onclick=()=>{if(!sel[id]&&nSel()>=nvs)return;sel[id]=!sel[id];tapFx(b);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');render3();};st3.appendChild(b);}})();
function render3(){const n=nSel();document.getElementById('cnt3').innerHTML=`${n} / ${nvs}<small>Rudy · ${nf} frames</small>`;
  document.getElementById('play3').disabled=n!==nvs;
  document.querySelectorAll('#t3 .card').forEach(b=>{const id=b.dataset.id;b.classList.toggle('on',!!sel[id]);b.classList.toggle('dim',!sel[id]&&n>=nvs);});}
document.getElementById('back3').onclick=()=>showScr('t2');
document.getElementById('rand3').onclick=()=>{GIRLS.forEach(g=>sel[g]=false);GIRLS.slice().sort(()=>Math.random()-0.5).slice(0,nvs).forEach(g=>sel[g]=true);render3();};
document.getElementById('play3').onclick=()=>{ac();if(nSel()!==nvs)return;const list=['rudy'];GIRLS.forEach(id=>{if(sel[id])list.push(id);});document.getElementById('t3').style.display='none';lastList=list;newGame(list,nf);};
function buildMenu(){
  const cast=document.getElementById('cast');cast.innerHTML='';const n=nSel();
  document.getElementById('selinfo').textContent=`Rudy contre ${nvs} adversaires · ${nf} frames — choisis-en ${nvs} (${n}/${nvs})`;
  document.getElementById('play').disabled=n!==nvs;
  ['rudy',...GIRLS].forEach(id=>{const d=document.createElement('div');d.className='who '+(id==='rudy'?'me':(sel[id]?'on':(n>=nvs?'off full':'off')));
    d.innerHTML=`<canvas width="300" height="500"></canvas><div class="n" style="color:${CHAR[id].col}">${CHAR[id].name}</div><div class="t">${id==='rudy'?'C’est toi':sel[id]?'✔ Choisie':'Touche pour choisir'}</div>`;
    if(id!=='rudy')d.onclick=()=>{if(!sel[id]&&nSel()>=nvs)return;sel[id]=!sel[id];buildMenu();};
    d.dataset.id=id;cast.appendChild(d);});
}
let menuT=0;
function menuAnim(now){
  if(document.getElementById('menu').style.display!=='none'){
    menuT=now/1000;
    document.querySelectorAll('.who').forEach((d,i)=>{const c=d.querySelector('canvas'),g=c.getContext('2d');g.clearRect(0,0,300,500);const id=d.dataset.id;
      const fr=Math.floor(menuT*5+i*2)%4;const m=S(id,'front',fr);if(!m.img.complete)return;const k=440/430*(CHAR[id].size||1);const h0_=S(id,'throw',0);const kk=k*1.1;g.drawImage(m.img,150-(h0_.hip||0)*kk+m.ox*kk,480-(h0_.foot||0)*kk+m.oy*kk,m.w*kk,m.h*kk);});
  }
  requestAnimationFrame(menuAnim);
}
function toMenu(){hideTV();G=null;stopRoll();st.phase='menu';showScr('t1');document.getElementById('end').style.display='none';['score','banner','hint','ctl','topbtns','card','big'].forEach(i=>document.getElementById(i).style.display='none');buildMenu();}
document.getElementById('play').onclick=()=>{ac();if(nSel()!==nvs)return;const list=['rudy'];GIRLS.forEach(id=>{if(sel[id])list.push(id);});document.getElementById('menu').style.display='none';lastList=list;newGame(list,nf);};
let lastList=['rudy','ameline','faty','karine','rose','sophie','mifa','katila','gisele','colica','aline','miminia'];
document.getElementById('again').onclick=()=>newGame(lastList,nf);
document.getElementById('tomenu').onclick=toMenu;

resize();buildMenu();requestAnimationFrame(loop);requestAnimationFrame(menuAnim);
</script>
</body>
</html>
