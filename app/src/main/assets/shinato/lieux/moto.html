  if(d.t==='lamp'){const h=S*1500,arm=S*260;ctx.strokeStyle='#2b2e36';ctx.lineWidth=Math.max(1,S*36);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-h);ctx.lineTo(x+arm,y-h-S*60);ctx.stroke();

      if(R(9)>0.5){ctx.fillStyle='#ff3b3b';ctx.fillRect(x-S*20,y-h-S*200,S*40,S*120)}}

      ctx.fillStyle='#1a1a20';ctx.beginPath();ctx.moveTo(x0-S*200,y-h);ctx.quadraticCurveTo(x0,y-h-S*60,x0+w*0.15,y-h-S*420);ctx.lineTo(x0+w*0.85,y-h-S*420);ctx.quadraticCurveTo(x0+w,y-h-S*60,x0+w+S*200,y-h);ctx.fill();

    ctx.fillStyle=d.v===0?'#f1e9e9':'#e27bc3';ctx.font=`900 ${Math.max(4,S*150)}px "Trebuchet MS",sans-serif`;ctx.textAlign='center';['RUDY','RIDE','NIGHT'].forEach((t,k)=>ctx.fillText(d.v===1?['RIDE','THE','NIGHT'][k]:d.v===2?['限','界','道'][k]:t,x,yy+h*(0.3+k*0.28)))}

function drawWorld(){

    if(top>0){ctx.fillStyle='#0b1433';ctx.fillRect(0,0,W,top+1)}}

   ctx.fillStyle='#ffc46b';for(let k=0;k<6;k++){ctx.globalAlpha=0.7;ctx.fillRect((k*97%(W*0.3))+o+W*0.02,H*(0.12+k*0.05),2,2)}ctx.globalAlpha=1}
