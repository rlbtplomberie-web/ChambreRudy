<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><style>*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{touch-action:none;overscroll-behavior:none}</style>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rudy Moto – test des sprites</title>
<style>
:root{--bg:#0b1433;--ink:#f3efe6;--accent:#e2372b;--pad:#0f1219cc}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#speed{font-size:44px;font-weight:900;font-style:italic;line-height:1;text-shadow:0 3px 0 #000}
#speed small{font-size:15px;font-style:normal;opacity:.8;margin-left:4px}
#state{font-size:13px;opacity:.85;margin-top:4px}
#lap{font-size:13px;margin-top:3px;color:#ffc46b;text-shadow:0 1px 0 #000}
#side{display:flex;gap:8px}
#side canvas{width:78px;height:78px;border-radius:50%;background:var(--pad);border:2px solid #ffffff30}
#joy{position:fixed;left:20px;bottom:20px;width:104px;height:104px;border-radius:50%;background:var(--pad);border:2px solid #ffffff35}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#e9e4da;box-shadow:0 4px 0 #0008 inset,0 3px 8px #000a}
#gas{position:fixed;right:22px;bottom:26px;width:86px;height:86px;border-radius:50%;border:none;background:var(--accent);color:#fff;font:900 12px "Trebuchet MS",sans-serif;box-shadow:0 5px 0 #7c140d,0 10px 18px #000a;touch-action:none}
#gas.on{transform:translateY(5px);box-shadow:0 2px 0 #7c140d,0 4px 10px #000a}
#snd{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;border:2px solid #ffffff35;background:var(--pad);color:#fff;font-size:18px}
#timer{position:fixed;top:62px;left:50%;transform:translateX(-50%);font:900 22px "Trebuchet MS",sans-serif;color:#fff;text-shadow:0 2px 0 #000;pointer-events:none;white-space:nowrap}
#timer.low{color:#ff4a3d;font-size:30px}
#end{position:fixed;inset:0;background:#05081a99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:5;pointer-events:none}
#end[hidden]{display:none}
#end .arr{font:900 clamp(48px,14vw,120px) "Trebuchet MS",sans-serif;font-style:italic;color:#fff;letter-spacing:.04em;text-shadow:0 5px 0 #b3202a,0 10px 24px #000;animation:pop .5s ease-out}
#end .flag{width:min(80vw,620px);height:26px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/26px 26px;box-shadow:0 4px 12px #000a}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#end .arr{animation:none}}
#help{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;opacity:.6;pointer-events:none}
</style></head><body>

const IMG={};let loaded=0,total=0;

let W,H,DPR;function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();

const inp={x:0,y:0,gas:false};const keys={};
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=0);
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null,jx=0,jy=0;
function jmove(e){const r=joy.getBoundingClientRect(),R=r.width/2;let dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;const d=Math.hypot(dx,dy),m=R-15;if(d>m){dx*=m/d;dy*=m/d}jx=dx/m;jy=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jmove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform=''}};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);

const SEG=200,RW=2000,CAM=1000,DRAW=170;const segs=[];

const N=segs.length;

segs.forEach((s,i)=>{s.deco=[];

  if(i%8===4&&(i>>6)%3!==1)s.deco.push({t:'tree',x:-1.75-((i*7)%5)*0.12,v:(i*13)%3});
  if(i%2===0)s.deco.push({t:'wall',x:-1.55});

  if(i%24===12&&(i>>7)%2===0)s.deco.push({t:'banner',x:-1.6,v:(i>>5)%3});
  s.land=((i+40)>>6)%3!==0; // côté droit : terre (village) ou mer
  if(i%10===6)s.deco.push({t:(i>>4)%3===0?'apart':'house',x:-2.35-((i*3)%4)*0.18,v:i});
  if(i%14===2&&(i>>5)%2)s.deco.push({t:'apart',x:-3.3,v:i+5});
  if(s.land&&i%9===3)s.deco.push({t:(i>>3)%3===1?'apart':'house',x:2.1+((i*5)%4)*0.2,v:i});
  if(s.land&&i%16===8)s.deco.push({t:'apart',x:3.2,v:i+9});
});
