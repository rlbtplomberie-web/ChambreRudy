.perso{position:absolute;inset:0;pointer-events:none}
.f{position:absolute;opacity:0;transition:opacity .26s ease-in-out;transform-origin:50% 100%;user-select:none}
.f.on{opacity:1}
.f.respire{animation:resp 2.6s ease-in-out infinite}
@keyframes resp{50%{transform:scaleY(1.008) translateY(-.15%)}}
.ombre{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,0));pointer-events:none}

.fum{transition:opacity .3s ease-in-out}
.flamme{position:absolute;width:1.1%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
background:radial-gradient(circle,rgba(255,230,150,.95) 0,rgba(255,150,40,.6) 35%,rgba(255,120,0,0) 70%);opacity:0;transition:opacity .2s;mix-blend-mode:screen}
.flamme.on{opacity:1;animation:flk .12s infinite alternate}
@keyframes flk{from{transform:translate(-50%,-50%) scale(.85)}to{transform:translate(-50%,-55%) scale(1.15)}}
.braise{position:absolute;width:.32%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#ff7a1a;box-shadow:0 0 4px 2px rgba(255,110,20,.7);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.bouff{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);
background:radial-gradient(circle,rgba(225,225,235,.55) 0,rgba(210,210,225,.25) 45%,rgba(200,200,215,0) 70%);filter:blur(1px);
animation:monte var(--d) linear forwards}
@keyframes monte{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:var(--o)}
100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - var(--dy))) scale(var(--s))}}

.cai{transition:opacity .3s ease-in-out;transform-origin:50% 100%}
.cai.on{animation:resp 2.8s ease-in-out infinite}
.laser{position:absolute;width:2.2%;height:.9%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
background:radial-gradient(closest-side,rgba(255,40,40,.95),rgba(255,0,0,.35) 55%,rgba(255,0,0,0));opacity:0;mix-blend-mode:screen}
.laser.bip{animation:bip .5s ease-out}
@keyframes bip{0%{opacity:0}15%{opacity:1}35%{opacity:.3}50%{opacity:1}100%{opacity:0}}
.wrap{touch-action:none}
#toile{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5}
.flecheSortie{position:absolute;z-index:8;pointer-events:none;display:none;width:3.8%;aspect-ratio:100/120;transform-origin:50% 50%;
 filter:drop-shadow(0 0 6px rgba(255,225,40,1)) drop-shadow(0 0 16px rgba(255,200,0,.8));animation:clign .7s ease-in-out infinite alternate}
@keyframes clign{from{opacity:1}to{opacity:.55}}
#joy{position:fixed;left:4.5vmin;bottom:5vmin;width:30vmin;height:30vmin;border-radius:50%;z-index:20;touch-action:none;
 background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.10),rgba(0,0,0,.34));border:2px solid rgba(255,226,122,.45);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#stick{position:absolute;left:50%;top:50%;width:13vmin;height:13vmin;margin:-6.5vmin 0 0 -6.5vmin;border-radius:50%;
 background:radial-gradient(circle at 42% 36%,#fbf0c6,#c9a33c 60%,#7d6118);box-shadow:0 4px 12px rgba(0,0,0,.6)}
#zoneJoy{position:fixed;left:0;bottom:0;width:44vw;height:62vh;z-index:19;touch-action:none}
#actions{position:fixed;right:4.5vmin;bottom:6vmin;display:flex;flex-direction:column;gap:2.6vmin;z-index:20}
.btn{display:none;min-width:26vmin;padding:2.4vmin 3vmin;border-radius:3vmin;text-align:center;font:900 clamp(13px,3.1vmin,26px)/1 Arial,sans-serif;letter-spacing:2px;color:#ffe27a;
 background:linear-gradient(rgba(12,12,14,.9),rgba(30,30,34,.9));border:2px solid rgba(255,226,122,.95);box-shadow:0 5px 16px rgba(0,0,0,.55),0 0 14px rgba(255,214,60,.4);user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.94)}

#choixRose{position:fixed;z-index:25;right:4.5vmin;bottom:6vmin;display:none;flex-direction:column;gap:2vmin;min-width:44vmin}
#choixRose .btn{display:block}

// Enchaînement : regarde le rayon, attrape en haut, lit le produit, se redresse, se penche en bas, lit l'autre produit
const seq=[[0,1600],[1,1200],[2,1900],[0,700],[3,1300],[4,1900]];
const respire=new Set([0,2,4]);
function anime(id,delai,vitesse){
  const imgs=[...document.querySelectorAll('#'+id+' .f')];
  imgs.forEach(i=>{if(respire.has(+i.dataset.p))i.classList.add('respire')});
  let k=0,cur=null;
  const etape=()=>{
    const [p,d]=seq[k];
    const el=imgs[p];
    el.classList.add('on');
    if(cur&&cur!==el){const old=cur;setTimeout(()=>old.classList.remove('on'),120);}
    cur=el;k=(k+1)%seq.length;
    setTimeout(etape,d*vitesse);
  };
  setTimeout(etape,delai);
}
anime('c0',0,1.0);
anime('c1',700,1.08);

(function(){
  const z=document.getElementById('zoneJoy'), joy=document.getElementById('joy'), stick=document.getElementById('stick');
  let actif=null, ox=0, oy=0, R=0;
  const touche=e=>[].slice.call(e.changedTouches).filter(t=>t.identifier===actif)[0];
  function bouge(cx,cy){ const dx=cx-ox, dy=cy-oy, d=Math.min(Math.hypot(dx,dy),R*0.62), a=Math.atan2(dy,dx);
    stick.style.transform='translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px)';
    const m=Math.hypot(dx,dy); if(m<R*0.18){ jx=jy=0; return; } jx=dx/m; jy=dy/m; }
  function lache(){ actif=null; jx=jy=0; stick.style.transform='translate(0,0)'; }
  [z,joy].forEach(el=>{
    el.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; actif=t.identifier; const r=joy.getBoundingClientRect(); R=r.width/2;
      if(el===joy){ ox=r.left+R; oy=r.top+R; } else { ox=t.clientX; oy=t.clientY; } bouge(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
    el.addEventListener('touchmove',e=>{ const t=touche(e); if(t){ bouge(t.clientX,t.clientY); e.preventDefault(); } },{passive:false});
    el.addEventListener('touchend',e=>{ if(touche(e)) lache(); }); el.addEventListener('touchcancel',lache);
    el.addEventListener('mousedown',e=>{ const r=joy.getBoundingClientRect(); R=r.width/2; ox=r.left+R; oy=r.top+R; actif='souris'; bouge(e.clientX,e.clientY);
      const m=ev=>bouge(ev.clientX,ev.clientY), u=()=>{ lache(); removeEventListener('mousemove',m); removeEventListener('mouseup',u); };
      addEventListener('mousemove',m); addEventListener('mouseup',u); });
  });
  const K={}; const majK=()=>{ jx=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0); jy=(K.ArrowDown?1:0)-(K.ArrowUp?1:0); };
  addEventListener('keydown',e=>{ if(e.key.startsWith('Arrow')){ K[e.key]=true; majK(); } });
  addEventListener('keyup',e=>{ if(e.key.startsWith('Arrow')){ K[e.key]=false; majK(); } });
  addEventListener('blur',lache); document.addEventListener('visibilitychange',lache);
})();

// ---- La fumeuse contre le pilier ----
(function(){
  const imgs=[...document.querySelectorAll('#fumeuse .fum')];
  const fum=document.getElementById('fumee');
  const flamme=document.getElementById('flamme');
  const tips={0: [17.5028, 43.1614], 1: [17.5345, 41.546], 2: [18.1594, 42.1816], 3: [18.3606, 42.7377], 4: [18.5618, 43.3997]};
  const bouche=[17.1004, 41.8108];
  let braise=document.createElement('div');braise.className='braise';document.getElementById('fumeuse').appendChild(braise);
  let pose=0;
  function place(el,p){el.style.left=p[0]+'%';el.style.top=p[1]+'%';}
  function bouffee(p,gros,n){
    for(let i=0;i<n;i++){
      const b=document.createElement('div');b.className='bouff';
      const sz=(gros?1.4:0.55)+Math.random()*(gros?1.2:0.5);
      b.style.width=sz+'%';b.style.aspectRatio='1';
      place(b,[p[0]+(Math.random()-.5)*.3,p[1]]);
      b.style.setProperty('--d',(gros?2.6:3.2)+Math.random()*1.4+'s');
      b.style.setProperty('--dx',((gros?18:6)+Math.random()*14)*(Math.random()<.7?1:-.6)+'px');
      b.style.setProperty('--dy',(gros?40:55)+Math.random()*35+'px');
      b.style.setProperty('--s',(gros?3.2:2.6)+Math.random());
      b.style.setProperty('--o',gros?.85:.6);
      b.style.animationDelay=(i*(gros?0.09:0.25))+'s';
      fum.appendChild(b);
      setTimeout(()=>b.remove(),6500);
    }
  }
  // filet de fumée continu au bout de la cigarette
  setInterval(()=>{ if(pose!==0) bouffee(tips[pose],false,1); },380);
  function montre(p){
    const el=imgs[p];el.classList.add('on');
    imgs.forEach(o=>{if(o!==el)setTimeout(()=>o.classList.remove('on'),140)});
    pose=p;
    place(braise,tips[p]); braise.style.display=p===0?'none':'block';
    flamme.classList.toggle('on',p===0); if(p===0) place(flamme,tips[0]);
    if(p===2) bouffee(bouche,true,9);
  }
  // allume la cigarette, puis boucle : tire, souffle, regarde, sourit
  const debut=[[0,2200]];
  const boucle=[[1,1500],[2,2400],[3,1800],[4,2600],[3,1300]];
  let k=0,seq=debut;
  function etape(){
    const [p,d]=seq[k];montre(p);k++;
    if(k>=seq.length){seq=boucle;k=0;}
    setTimeout(etape,d);
  }
  etape();
})();

/* ================= La fille aux cheveux roses (rayon épicerie) : PARLER → donner 50, 100 ou 150 € ================= */
(function(){
  const ROSE_X=1188;
  const CHOIX=[
    {nom:'💶 Donner 50 €',  prix:50,  video:'/assets/shinato/m/super_rose_50.mp4',  dit:"50 € ? Oh, merci ! 😊"},
    {nom:'💶 Donner 100 €', prix:100, video:'/assets/shinato/m/super_rose_100.mp4', dit:"100 € ?! T'es trop gentil 🥰"},
    {nom:'💶 Donner 150 €', prix:150, video:'/assets/shinato/m/super_rose_150.mp4', dit:"150 € ?! Tu me gâtes… 😍"}
  ];
  const bP=document.getElementById('bParlerRose'), bulle=document.getElementById('bulleRose'), actions=document.getElementById('actions');
  const choix=document.createElement('div'); choix.id='choixRose'; document.body.appendChild(choix);
  function pont(){ for(const w of [window,parent,top]){ try{ if(w.Chambre&&w.Chambre.argent) return w.Chambre; }catch(e){} } return null; }
  function argent(){ const p=pont(); try{ return p?p.argent():null; }catch(e){ return null; } }
  function payer(n){ const p=pont(); try{ if(p&&p.ajouterArgent) p.ajouterArgent(-n); }catch(e){} }
  function dit(t,ms){ bulle.textContent=t; bulle.style.display='block'; clearTimeout(bulle._t); if(ms) bulle._t=setTimeout(()=>{ bulle.style.display='none'; },ms); }
  function appui(el,fn){ let t=0; const go=e=>{ if(e&&e.cancelable) e.preventDefault(); const n=performance.now(); if(n-t<350) return; t=n; fn(); };
    el.addEventListener('touchstart',go,{passive:false}); el.addEventListener('click',go); }
  let parle=false;
  setInterval(()=>{ const R=window.RUDY; if(!R) return;
    bP.style.display=(!parle&&Math.abs(R.x-ROSE_X)<170)?'block':'none'; },150);
  function fin(){ parle=false; choix.style.display='none'; actions.style.visibility=''; }
  appui(bP,()=>{
    parle=true; dit("Oh, salut… tu veux quelque chose ? 😳");
    choix.innerHTML='';
    CHOIX.forEach(C=>{ const b=document.createElement('div'); b.className='btn'; b.textContent=C.nom; choix.appendChild(b);
      appui(b,()=>{ fin();
        const a=argent(); if(a!==null&&a<C.prix){ dit("T'as pas "+C.prix+" €… 😕",2400); return; }
        payer(C.prix); dit(C.dit,1900);
        setTimeout(()=>{ bulle.style.display='none'; window.joueVideoLieu&&window.joueVideoLieu(C.video); },1500); }); });
    const non=document.createElement('div'); non.className='btn'; non.textContent='Rien'; non.style.opacity='.75'; choix.appendChild(non);
    appui(non,()=>{ fin(); dit("D'accord… 😶",1800); });
    choix.style.display='flex'; actions.style.visibility='hidden';
  });
})();
</script>
