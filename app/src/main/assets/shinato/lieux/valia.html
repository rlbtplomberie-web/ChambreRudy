<div id="bulleD" style="position:fixed;z-index:30;display:none;max-width:62%;padding:8px 13px 10px;border-radius:14px 14px 14px 4px;background:rgba(255,255,255,.96);color:#2a0b22;font-weight:800;font-size:15px;line-height:1.3;box-shadow:0 6px 16px rgba(0,0,0,.4);pointer-events:none"><span style="display:block;font-size:11px;color:#c2317a">La danseuse</span><span id="bulleDt"></span></div>
<div id="videoV"><video id="vidV" playsinline preload="auto"></video><button id="fermerVid">✕ Fermer</button></div>
<script>
/* ---------- Rudy : la même planche que dans le Pixel Bar ---------- */
let videoOuverte=false;
const RB={"droite": {"img": ["/assets/shinato/m/ef1f0b8c2cc9473b.webp", "/assets/shinato/m/8f16b04582ccd18f.webp", "/assets/shinato/m/b76af52210dcf554.webp", "/assets/shinato/m/335b72042ef27bbc.webp", "/assets/shinato/m/50c8697489c2c907.webp", "/assets/shinato/m/cbd0a1ad22fab3ba.webp", "/assets/shinato/m/680d616f4c29d575.webp", "/assets/shinato/m/3316119779970e96.webp", "/assets/shinato/m/47efa18c2f9698a9.webp"], "w": 134, "h": 206, "ax": 63.612575574365174, "ay": 203.0}, "gauche": {"img": ["/assets/shinato/m/6f1bf8da705a8911.webp", "/assets/shinato/m/f02a3a5feed4f7c4.webp", "/assets/shinato/m/ede9f664436f25f2.webp", "/assets/shinato/m/51aa1ca8a5dd4922.webp", "/assets/shinato/m/9600fe3909581e0b.webp", "/assets/shinato/m/037ddbda857ff35b.webp", "/assets/shinato/m/946210da6e0395a1.webp", "/assets/shinato/m/ba4398dc080de701.webp", "/assets/shinato/m/70e4515f71136159.webp"], "w": 130, "h": 197, "ax": 63.97493036211699, "ay": 195.0}, "haut": {"img": ["/assets/shinato/m/8a8dcc61508e73cc.webp", "/assets/shinato/m/0625bc5499c17775.webp", "/assets/shinato/m/d130e78bd96cbf58.webp", "/assets/shinato/m/85e77196dae0a364.webp", "/assets/shinato/m/f112a083b3eac8ab.webp", "/assets/shinato/m/fe5eff60eeb2ac4d.webp", "/assets/shinato/m/6be13897791b903d.webp", "/assets/shinato/m/dd80719f53df96e6.webp", "/assets/shinato/m/38e6d2bce0ca6363.webp"], "w": 89, "h": 218, "ax": 44.04040242733951, "ay": 215.0}, "bas": {"img": ["/assets/shinato/m/d67456269af20e2b.webp", "/assets/shinato/m/d227cf6f358b0526.webp", "/assets/shinato/m/0f7f9a1e518986f4.webp", "/assets/shinato/m/0a266f69d86aa01d.webp", "/assets/shinato/m/d513893fbe84847c.webp", "/assets/shinato/m/6f705304ece6820d.webp", "/assets/shinato/m/ff9a36731da1dafd.webp", "/assets/shinato/m/4d7a4f90f39f828c.webp", "/assets/shinato/m/3e7f67122e98fbfb.webp"], "w": 100, "h": 241, "ax": 50.24630667345899, "ay": 238.0}};
const chargeImg=s=>{const i=new Image();i.src=s;return i};
for(const k in RB) RB[k].fr=RB[k].img.map(chargeImg);
const SOL_V={x0:420,x1:1380,y0:712,y1:835};           // le sol devant la scène, entre les tables
const RUDY={x:900,y:790,dir:'haut',pas:0,bouge:false};   // il entre un peu au-dessus de la sortie
let joyX=0,joyY=0;
function tailleRudy(y){return (250+(y-SOL_V.y0)*0.55)*1.25}
function dessineRudy(){
  const set=RUDY.dir, R=RB[set], i=RUDY.bouge?Math.floor(RUDY.pas/(tailleRudy(RUDY.y)*0.13)):0, im=R.fr[i%R.fr.length];
  if(!im.complete) return;
  const h=tailleRudy(RUDY.y), k=h/R.h, x=RUDY.x, y=RUDY.y;
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x,y,h*0.17,h*0.035,0,0,7); ctx.fill();
  const X=x-R.ax*k, Y=y-R.ay*k, phase=RUDY.bouge?RUDY.pas/(h*0.34):null;
  if((set==='droite'||set==='gauche')&&phase!=null){       // le pas de profil, comme au Pixel Bar
    const ouv=0.30+0.70*Math.abs(Math.cos(phase*Math.PI)), bob=-Math.abs(Math.sin(phase*Math.PI))*h*0.018;
    const hanche=Math.round(R.h*0.50), N=14, bas=R.h-hanche;
    ctx.drawImage(im,0,0,R.w,hanche,X,Y+bob,R.w*k,hanche*k);
    for(let n=0;n<N;n++){ const s0=hanche+bas*n/N, s1=hanche+bas*(n+1)/N, f=(n+0.5)/N, sx=1-(1-ouv)*f, cx=X+R.ax*k, w=R.w*k*sx;
      ctx.drawImage(im,0,s0,R.w,s1-s0+0.6,cx-R.ax*k*sx,Y+s0*k+bob*(1-f),w,(s1-s0)*k+0.6); }
  }else ctx.drawImage(im,X,Y,R.w*k,R.h*k);
  ctx.restore();
}
let avantV=performance.now()/1000;
function avanceRudy(){
  const now=performance.now()/1000, dt=Math.min(0.05,now-avantV); avantV=now;
  const m=Math.hypot(joyX,joyY);
  if(m>0.18&&!videoOuverte){
    const v=250*Math.min(1,m);
    const nx=Math.max(SOL_V.x0,Math.min(SOL_V.x1,RUDY.x+joyX/m*v*dt)), ny=Math.max(SOL_V.y0,Math.min(SOL_V.y1,RUDY.y+joyY/m*v*dt));
    RUDY.pas+=Math.hypot(nx-RUDY.x,ny-RUDY.y); RUDY.x=nx; RUDY.y=ny;
    RUDY.dir=Math.abs(joyX)>Math.abs(joyY)?(joyX>0?'droite':'gauche'):(joyY>0?'bas':'haut'); RUDY.bouge=true;
  }else RUDY.bouge=false;
  // près de la danseuse : « Regarder »
  const fx=F[cur]&&F[cur].pole?POLEX:x;
  const devant=!videoOuverte&&!window.ARRET&&Math.abs(RUDY.x-fx)<260&&RUDY.y<790;
  document.getElementById('regarderV').style.display=devant?'block':'none';
  document.getElementById('reserverV').style.display=devant?'block':'none';
  document.getElementById('chambreV').style.display=devant?'block':'none';
  document.getElementById('pauseV').style.display=devant?'block':'none';
  document.getElementById('combatV').style.display=devant?'block':'none';
  if(!devant) cacheChoixCombat();
  // tout en bas de la salle : la sortie
  document.getElementById('sortirV').style.display=(!videoOuverte&&!window.ARRET&&RUDY.y>=SOL_V.y1-18)?'block':'none';
}
/* ---------- stick ---------- */
(function(){
  const joy=document.getElementById('joyV'), knob=document.getElementById('knobV'); let doigt=null;
  function bouge(cx,cy){ const r=joy.getBoundingClientRect(); let dx=cx-(r.left+r.width/2), dy=cy-(r.top+r.height/2); const R=r.width/2, d=Math.hypot(dx,dy);
    if(d>R){ dx*=R/d; dy*=R/d; } knob.style.transform=`translate(${dx}px,${dy}px)`; joyX=dx/R; joyY=dy/R; }
  function lache(){ doigt=null; joyX=joyY=0; knob.style.transform=''; }
  joy.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; doigt=t.identifier; bouge(t.clientX,t.clientY); },{passive:false});
  joy.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===doigt) bouge(t.clientX,t.clientY); },{passive:false});
  joy.addEventListener('touchend',e=>{ for(const t of e.changedTouches) if(t.identifier===doigt) lache(); });
  joy.addEventListener('touchcancel',lache);
  joy.addEventListener('mousedown',e=>{ doigt='souris'; bouge(e.clientX,e.clientY); });
  addEventListener('mousemove',e=>{ if(doigt==='souris') bouge(e.clientX,e.clientY); });
  addEventListener('mouseup',()=>{ if(doigt==='souris') lache(); });
  const t={}; addEventListener('keydown',e=>{ t[e.key]=true; maj(); }); addEventListener('keyup',e=>{ t[e.key]=false; maj(); });
  function maj(){ if(doigt) return; joyX=(t.ArrowRight?1:0)-(t.ArrowLeft?1:0); joyY=(t.ArrowDown?1:0)-(t.ArrowUp?1:0); }
})();
/* ---------- la musique du club ---------- */
const musV=document.getElementById('musiqueV'); musV.volume=.55;
function joueV(){ if(videoOuverte) return; const q=musV.play(); if(q&&q.catch) q.catch(()=>{}); }
joueV(); ['pointerdown','touchstart','keydown'].forEach(t=>addEventListener(t,()=>{ if(musV.paused) joueV(); },{passive:true}));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) musV.pause(); else joueV(); });
/* ---------- regarder la danseuse : la vidéo ---------- */
const vid=document.getElementById('vidV'), boiteVid=document.getElementById('videoV');

/* ---------- chaque vidéo vue s'ajoute au téléphone (Galerie > Vidéos, dans le bon album) ---------- */
function noteVideoTel(src,titre,v){
  try{ const L=JSON.parse(localStorage.getItem('rudy_videos')||'[]')||[]; if(L.some(o=>o.src===src)) return; }catch(e){ return; }
  const enregistre=()=>{ let poster='';
    try{ const w=220,h=Math.round(w*(v.videoHeight||9)/(v.videoWidth||16)); const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(v,0,0,w,h); poster=c.toDataURL('image/jpeg',0.7); }catch(e){}
    const s=Math.round(v.duration||0), dur=(isFinite(s)&&s>0)?(Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)):'';
    try{ const L=JSON.parse(localStorage.getItem('rudy_videos')||'[]')||[]; if(L.some(o=>o.src===src)) return; L.push({src,titre,poster,dur,t:Date.now()}); localStorage.setItem('rudy_videos',JSON.stringify(L)); }catch(e){} };
  setTimeout(enregistre,1200);
}
function ouvreVideo(fichier){ videoOuverte=true; musV.pause(); boiteVid.style.display='flex'; vid.src='/assets/shinato/m/'+fichier; try{ vid.currentTime=0; }catch(e){} const q=vid.play(); if(q&&q.catch) q.catch(()=>{});
  noteVideoTel('/assets/shinato/m/'+fichier,'Valia Club — '+({'valia_danse.mp4':'la danse','valia_reserve.mp4':'la réservation','valia_chambre.mp4':'la chambre','valia_pause.mp4':'la pause','valia_combat.mp4':'le petit combat','valia_gros_combat.mp4':'le gros combat','valia_grand_combat.mp4':'le grand combat','valia_combat_final.mp4':'le combat final'}[fichier]||'vidéo'),vid); }
function fermeVideo(){ window.ARRET=null; videoOuverte=false; try{ vid.pause(); }catch(e){} boiteVid.style.display='none'; joueV(); }
document.getElementById('regarderV').addEventListener('click',()=>{ toastV(txtCoeur(2),1400); setTimeout(()=>ouvreVideo('valia_danse.mp4'),700); });
document.getElementById('pauseV').addEventListener('click',()=>{ toastV(txtCoeur(5),1400); setTimeout(()=>ouvreVideo('valia_pause.mp4'),700); });   // « C'est la pause » : gratuit
// ---------- l'argent de Rudy : « Réserver » coûte 50 €, « Réserver une chambre » 100 € ----------
function pont(){ for(const w of [window,parent,top]){ try{ if(w.Chambre&&w.Chambre.argent) return w.Chambre; }catch(e){} } return null; }
function argent(){ const p=pont(); try{ return p?p.argent():null; }catch(e){ return null; } }
function payer(n){ const p=pont(); try{ if(p&&p.ajouterArgent) p.ajouterArgent(-n); }catch(e){} majArgent(); }
function majArgent(){ const a=argent(); document.getElementById('argentV').textContent='💶 '+(a===null?'—':a.toLocaleString('fr-FR')+' €'); }
function toastV(t,ms){ const e=document.getElementById('toastV'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',ms||2400); }
/* ---------- le cœur de Valia (le même que dans le téléphone) ---------- */
function coeurValia(d){
  try{ const S=JSON.parse(localStorage.getItem('rudyphone')||'{}')||{}; S.love=S.love||{};
    const v=Math.min(100,Math.round(((S.love.valia||0)+d)*10)/10); S.love.valia=v;
    localStorage.setItem('rudyphone',JSON.stringify(S)); return v; }catch(e){ return null; }
}
function txtCoeur(d){ const v=coeurValia(d); return '❤️ Valia +'+d+' %'+(v===null?'':' ('+String(v).replace('.',',')+' %)'); }
function reserver(prix,fichier){
  const a=argent();
  if(a!==null&&a<prix){ toastV("Il te faut "+prix+" € pour ça. Tu n'as que "+a+" €."); return; }
  payer(prix); toastV("−"+prix+" €   "+txtCoeur(5),1400); setTimeout(()=>ouvreVideo(fichier),700);
}
majArgent(); setInterval(majArgent,3000);
/* ---------- « Combat » → « Petit combat » : elle propose, on accepte ou pas ----------
   Oui : la vidéo du combat, et Rudy gagne 20 € (qu'il perde ou qu'il gagne). */
function gagner(n){ const p=pont(); try{ if(p&&p.ajouterArgent) p.ajouterArgent(n); }catch(e){} majArgent(); }
function bulleV(t){ document.getElementById('bulleDt').textContent=t; document.getElementById('bulleD').style.display='block'; }
function cacheBulleV(){ document.getElementById('bulleD').style.display='none'; }
// « Combat » montre (ou cache) les deux choix : petit et gros combat
const CHOIX_COMBAT=['petitV','grosV','grandV','finalV'];
function cacheChoixCombat(){ CHOIX_COMBAT.forEach(i=>{ const e=document.getElementById(i); if(e) e.style.display='none'; }); }
document.getElementById('combatV').addEventListener('click',()=>{
  const montre=document.getElementById('petitV').style.display!=='block';
  CHOIX_COMBAT.forEach(i=>{ document.getElementById(i).style.display=montre?'block':'none'; }); });
// ses phrases une par une, chacune dans sa bulle, puis on continue
function bulles(P,apres){ let i=0; const suite=()=>{ if(i<P.length){ bulleV(P[i++]); setTimeout(suite,2800); } else apres(); }; suite(); }
let modeCombat='petit';
document.getElementById('petitV').addEventListener('click',()=>{
  modeCombat='petit';
  cacheChoixCombat();
  dir=RUDY.x<x?-1:1; window.ARRET=cur;                               // elle s'arrête de danser pour lui parler
  const P=["Tu sais ce que c'est, une fille ?",
           "Si tu veux gagner un peu d'argent, va falloir te battre contre moi… et ça va pas être facile !",
           "Mais tu sais quoi ? Que tu perdes ou que tu gagnes, tu gagneras de l'argent."];
  let i=0; const suite=()=>{ if(i<P.length){ bulleV(P[i++]); setTimeout(suite,3000); } else document.getElementById('ouiNonV').style.display='flex'; };
  try{ vid.src='/assets/shinato/m/valia_combat.mp4'; vid.load(); }catch(e){}
  suite();
});
/* ---------- « Gros combat » : elle prévient, on accepte ou pas ---------- */
document.getElementById('grosV').addEventListener('click',()=>{
  modeCombat='gros';
  cacheChoixCombat();
  dir=RUDY.x<x?-1:1; window.ARRET=cur;
  try{ vid.src='/assets/shinato/m/valia_gros_combat.mp4'; vid.load(); }catch(e){}
  bulles(["Tu en es sûr ?",
          "Tu sais, je suis bien plus forte que toi…",
          "… même si tu crois le contraire 😏"],
         ()=>{ document.getElementById('ouiNonV').style.display='flex'; });
});
/* ---------- « Grand combat » et « Combat final » : une vidéo chacun ---------- */
const COMBATS={
  grand:{video:'valia_grand_combat.mp4', gain:200,
    avant:["Le grand combat ?","Là, je vais pas retenir mes coups…","T'es vraiment prêt ? 😈"],
    oui:["Très bien…","Prépare-toi à souffrir 😈","Mais la paie sera à la hauteur 💶"],
    non:"Sage décision…"},
  final:{video:'valia_combat_final.mp4', gain:500,
    avant:["Le combat final…","Personne ne m'a jamais battue à ce niveau.","Tu veux vraiment tenter ta chance ?"],
    oui:["Alors c'est l'heure de vérité.","Donne tout ce que t'as, Rudy ! 🔥","Gagnant ou perdant, tu repars les poches pleines 💰"],
    non:"Reviens quand tu seras prêt… 😏"}
};
['grand','final'].forEach(k=>{
  document.getElementById(k+'V').addEventListener('click',()=>{
    modeCombat=k; cacheChoixCombat();
    dir=RUDY.x<x?-1:1; window.ARRET=cur;
    try{ vid.src='/assets/shinato/m/'+COMBATS[k].video; vid.load(); }catch(e){}
    bulles(COMBATS[k].avant,()=>{ document.getElementById('ouiNonV').style.display='flex'; });
  });
});
document.getElementById('ouiV').addEventListener('click',()=>{
  const C=COMBATS[modeCombat];
  if(C){
    document.getElementById('ouiNonV').style.display='none';
    bulles(C.oui,()=>{ gagner(C.gain); toastV("+"+C.gain+" € 💶",1800); setTimeout(()=>{ cacheBulleV(); ouvreVideo(C.video); },900); });
    return;
  }
  if(modeCombat==='gros'){
    document.getElementById('ouiNonV').style.display='none';
    bulles(["Tu l'auras voulu…",
            "Mais t'inquiète pas.",
            "Tu seras bien payé, quoi qu'il arrive 💶"],
      ()=>{ gagner(100); toastV("+100 € 💶",1800); setTimeout(()=>{ cacheBulleV(); ouvreVideo('valia_gros_combat.mp4'); },900); });
    return;
  }
  document.getElementById('ouiNonV').style.display='none'; bulleV("Alors en garde, Rudy ! 🥊");
  gagner(20); toastV("+20 € 💶",1800);
  setTimeout(()=>{ cacheBulleV(); ouvreVideo('valia_combat.mp4'); },1300);
});
document.getElementById('nonV').addEventListener('click',()=>{
  document.getElementById('ouiNonV').style.display='none';
  bulleV(COMBATS[modeCombat]?COMBATS[modeCombat].non:modeCombat==='gros'?"C'est une bonne décision.":"Trouillard… reviens quand tu seras prêt 😏");
  setTimeout(()=>{ cacheBulleV(); window.ARRET=null; },2200);
});
document.getElementById('reserverV').addEventListener('click',()=>reserver(50,'valia_reserve.mp4'));
document.getElementById('chambreV').addEventListener('click',()=>{
  const a=argent(); if(a!==null&&a<100){ toastV("Il te faut 100 € pour ça. Tu n'as que "+a+" €."); return; }
  payer(100); toastV("−100 €   "+txtCoeur(10),2000);
  // elle s'arrête, se met à genoux face à Rudy, et lui parle… puis la vidéo
  dir=RUDY.x<x?-1:1; window.ARRET='belly_20'; setFrame('belly_20');
  try{ vid.src='/assets/shinato/m/valia_chambre.mp4'; vid.load(); }catch(e){}
  document.getElementById('bulleDt').textContent='Prépare-toi à prendre du plaisir…';
  document.getElementById('bulleD').style.display='block';
  setTimeout(()=>{ document.getElementById('bulleD').style.display='none'; ouvreVideo('valia_chambre.mp4'); },3000);
});
document.getElementById('fermerVid').addEventListener('click',fermeVideo);
vid.addEventListener('ended',fermeVideo);
vid.addEventListener('error',()=>{ if(!videoOuverte) return; fermeVideo(); toastV("La vidéo n'a pas pu se lire (fichier manquant ?)",3200); });
/* ---------- sortir : retour sur le boulevard, devant le club ---------- */
document.getElementById('sortirV').addEventListener('click',()=>{ try{ musV.pause(); vid.pause(); }catch(e){} try{ parent.postMessage({type:'valia:sortie'},'*'); }catch(e){} });
</script>
<script>
/* ---------- contacts du téléphone : la première fois que Rudy parle à une des filles, elle arrive dans ses contacts ---------- */
(function(){
  const QUI={"regarderV": ["valia"], "reserverV": ["valia"], "petitV": ["valia"], "grandV": ["valia"], "grosV": ["valia"]};
  function marque(ids){ try{ const D=JSON.parse(localStorage.getItem('rudy_contacts')||'{}')||{}; let n=false;
    ids.forEach(id=>{ if(!D[id]){ D[id]=Date.now(); n=true; } }); if(n) localStorage.setItem('rudy_contacts',JSON.stringify(D)); }catch(e){} }
  
  const sel=Object.keys(QUI).map(k=>'#'+k).join(',');
  if(!sel) return;
  const f=e=>{ const b=e.target&&e.target.closest&&e.target.closest(sel); if(b) marque(QUI[b.id]); };
  document.addEventListener('touchstart',f,{capture:true,passive:true}); document.addEventListener('click',f,true);
})();
</script>
