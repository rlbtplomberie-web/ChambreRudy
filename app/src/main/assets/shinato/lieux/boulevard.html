<title>Boulevard de nuit</title>
<style>
html,body{margin:0;height:100%;background:#0a0b24;overflow:hidden}
#vue{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;cursor:grab}
#vue::-webkit-scrollbar{display:none}
#vue.tire{cursor:grabbing}
#scene{position:relative;height:100%;aspect-ratio:2172/528}
@media (min-aspect-ratio:2172/528){#scene{height:auto;width:100%;top:50%;transform:translateY(-50%)}}
#fondimg,#fond,#fumee{position:absolute;inset:0;width:100%;height:100%;display:block}
#fumee{z-index:5;pointer-events:none}
.perso{position:absolute;pointer-events:none;z-index:2}
.corps,.tour,.rythme{position:absolute;inset:0;transform-origin:50% 100%;will-change:transform}
.perso img{position:absolute;inset:0;width:100%;height:100%;opacity:0;will-change:opacity;
  filter:brightness(.9) saturate(1.05) drop-shadow(0 0 5px rgba(255,190,120,.28))}
.perso img.on{opacity:1}
.ombre{position:absolute;left:12%;right:12%;bottom:-1.5%;height:5%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent)}
/* respiration et transferts d'appui */
.boss .corps{animation:souffle 4.2s ease-in-out infinite}
.dame .corps{animation:appui 5.6s ease-in-out infinite}
.chauffeur .corps{animation:souffle 4.6s ease-in-out infinite}
.reveur .corps{animation:appui2 6.4s ease-in-out infinite}
@keyframes souffle{0%,100%{transform:scale(1,1)}45%{transform:scale(1.007,1.013)}}
@keyframes appui{0%,100%{transform:rotate(0) translateX(0)}30%{transform:rotate(-.7deg) translateX(-1%) scaleY(1.008)}70%{transform:rotate(.6deg) translateX(1%)}}
@keyframes appui2{0%,100%{transform:rotate(0)}35%{transform:rotate(.5deg) scaleY(1.006)}75%{transform:rotate(-.4deg)}}
/* danseurs : déplacement sur la piste, montée-descente de la valse, demi-tours */
.danse .corps{animation:piste 11s ease-in-out infinite}
.danse .rythme{animation:valse 1.3s ease-in-out infinite}
.danse .tour{transition:transform 1.1s cubic-bezier(.45,0,.55,1)}
.danse .tour.retourne{transform:scaleX(-1)}
@keyframes piste{0%,100%{transform:translateX(0)}25%{transform:translateX(-14%) rotate(-1deg)}50%{transform:translateX(3%)}75%{transform:translateX(16%) rotate(1deg)}}
@keyframes valse{0%,100%{transform:translateY(0) scaleY(1)}33%{transform:translateY(-1.6%) scaleY(1.01)}66%{transform:translateY(-.6%)}}
@media (prefers-reduced-motion:reduce){.corps,.rythme{animation:none!important}}

const TIPS=[[0.0316, 0.5756], [0.3218, 0.0864], [0.3391, 0.0864], [0.069, 0.2109], [0.0747, 0.5693]],BOUCHE=[0.47, 0.075];

/* ---------- Décor vivant : palmiers au vent, haies, eau qui ondule (WebGL) ---------- */
(()=>{
  const cv=document.getElementById('fond');
  const gl=cv.getContext('webgl',{premultipliedAlpha:false});
  if(!gl){cv.remove();return}
  const vs=`attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
  const fs=`precision mediump float;varying vec2 uv;uniform sampler2D img,msk;uniform float t;
  const vec2 R=vec2(2172.,528.);
  void main(){
    vec2 p=uv*R; vec3 m=texture2D(msk,uv).rgb;
    float rafale=.55+.45*sin(t*.33+p.x*.0015)*sin(t*.21+1.3);
    float bruit=sin(t*1.25+p.x*.011+p.y*.018)*1.5+sin(t*2.9+p.y*.06+p.x*.004)*.55+sin(t*5.3+p.x*.05)*.18;
    vec2 d=vec2(m.r*bruit*(.8+rafale*1.4), m.r*sin(t*1.7+p.x*.02)*.55);
    d.x+=m.b*(sin(t*2.2+p.x*.07)*.45+sin(t*3.7+p.x*.13)*.2);
    d+=m.g*vec2(sin(p.y*1.05-t*2.4+p.x*.012)*1.3+sin(p.y*.42+t*1.4+p.x*.03)*.9, sin(p.x*.06+t*1.6)*.35);
    vec4 c=texture2D(img,(p+d)/R);
    float l=dot(c.rgb,vec3(.3,.59,.11));
    float scint=m.g*smoothstep(.35,.85,l)*pow(.5+.5*sin(p.x*.41+p.y*2.3+t*4.2)*sin(p.x*.13-t*2.1),3.)*.35;
    c.rgb+=scint*vec3(1.,.95,.9);
    gl_FragColor=vec4(c.rgb,1.);
  }`;
  const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){cv.remove();return}
  gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const tex=(u,src)=>new Promise(r=>{const im=new Image();im.onload=()=>{const tx=gl.createTexture();gl.activeTexture(gl.TEXTURE0+u);
    gl.bindTexture(gl.TEXTURE_2D,tx);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);r()};im.src=src});
  const lt=gl.getUniformLocation(pr,'t');
  Promise.all([tex(0,document.getElementById('fondimg').src),tex(1,'/assets/shinato/m/img_0a9113317377.png')]).then(()=>{
    gl.uniform1i(gl.getUniformLocation(pr,'img'),0);gl.uniform1i(gl.getUniformLocation(pr,'msk'),1);
    const calme=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const f=ms=>{gl.uniform1f(lt,calme?0:ms/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(f)};
    requestAnimationFrame(f);
  });
})();

/* ---------- Poses : fondu enchaîné sans creux de transparence ---------- */
const etat={};
const anim=(n,ordre,tenue,fondu,alea,surPose)=>{
  const imgs=[...document.querySelectorAll('.'+n+' img')];let k=0,z=1;etat[n]=ordre[0];
  const pas=()=>{
    const avant=imgs[ordre[k]];k=(k+1)%ordre.length;const apres=imgs[ordre[k]];
    etat[n]=ordre[k];if(surPose)surPose(ordre[k],k,fondu);
    if(apres!==avant){
      apres.style.zIndex=++z;
      apres.animate([{opacity:0},{opacity:1}],{duration:fondu,easing:'cubic-bezier(.45,0,.55,1)',fill:'forwards'})
        .onfinish=()=>{imgs.forEach(i=>{if(i!==apres){i.getAnimations().forEach(a=>a.cancel());i.classList.remove('on')}});apres.classList.add('on')};
    }
    setTimeout(pas,tenue+fondu+Math.random()*alea);
  };
  setTimeout(pas,tenue);
};

/* ---------- Fumée de cigarette ---------- */
(()=>{
  const cv=document.getElementById('fumee'),c=cv.getContext('2d'),S=2;
  const [gx,gy,gw,gh]=GEO.boss;const parts=[];let dernier=0,t0=performance.now();
  const pt=(u)=>[(gx+u[0]*gw)*S,(gy+u[1]*gh)*S];
  const ajoute=(x,y,vx,vy,taille,vie,a)=>parts.push({x,y,vx,vy,r:taille,vie,age:0,a,ph:Math.random()*6});
  const boucle=now=>{
    const dt=Math.min(50,now-t0)/1000;t0=now;
    c.clearRect(0,0,cv.width,cv.height);
    const f=etat.boss??0,tip=pt(TIPS[f]);
    // filet de fumée continu depuis la braise
    if(now-dernier>70){dernier=now;ajoute(tip[0],tip[1],(Math.random()-.5)*3,-14-Math.random()*6,1.2,2.6+Math.random(),.32)}
    // bouffée expirée après la bouffée
    if(expire&&now-expire<1300){const m=pt(BOUCHE);for(let i=0;i<2;i++)ajoute(m[0],m[1],-22-Math.random()*18,-6-Math.random()*8,2,2.2+Math.random(),.28)}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.age+=dt;if(p.age>p.vie){parts.splice(i,1);continue}
      const k=p.age/p.vie;p.vx*=.985;p.vy*=.992;p.x+=(p.vx+Math.sin(p.ph+p.age*2.3)*6+4)*dt;p.y+=p.vy*dt;
      const r=p.r+k*9,al=p.a*(1-k)*Math.min(1,p.age*5);
      const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,`rgba(225,225,235,${al})`);g.addColorStop(1,'rgba(225,225,235,0)');
      c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,r,0,7);c.fill()}
    // braise qui rougeoit (plus fort pendant la bouffée)
    const fort=(f===2?1:.55)+.25*Math.sin(now/180);
    const g=c.createRadialGradient(tip[0],tip[1],0,tip[0],tip[1],4);g.addColorStop(0,`rgba(255,150,60,${fort})`);g.addColorStop(1,'rgba(255,90,20,0)');
    c.fillStyle=g;c.beginPath();c.arc(tip[0],tip[1],4,0,7);c.fill();
    requestAnimationFrame(boucle)};
  requestAnimationFrame(boucle);
})();

joy.addEventListener('mousedown',e=>{ doigt='souris'; bouge(e.clientX,e.clientY); });
addEventListener('mousemove',e=>{ if(doigt==='souris') bouge(e.clientX,e.clientY); });
addEventListener('mouseup',()=>{ if(doigt==='souris') lache(); });
const touches={};
addEventListener('keydown',e=>{ touches[e.key]=true; if(e.key==='f'||e.key==='F') fumer(); if(e.key==='j'||e.key==='J') jeter(); });
addEventListener('keyup',e=>{ touches[e.key]=false; });

// ---------- fumer / jeter, comme dans la rue ----------
const bF=document.getElementById('fumerS'), bJ=document.getElementById('jeterS');
function majBoutons(){ bF.classList.toggle('off',clope||etat==='fumer'||etat==='jeter'); bJ.classList.toggle('off',!clope||etat==='fumer'||etat==='jeter'); }
function fumer(){ if(clope||etat==='fumer'||etat==='jeter') return; etat='fumer'; f=0; phase=0; majBoutons(); }
function jeter(){ if(!clope||etat==='fumer'||etat==='jeter') return; etat='jeter'; f=0; phase=0; majBoutons(); }
bF.addEventListener('click',fumer); bJ.addEventListener('click',jeter);

// ---------- la boucle ----------
let avant=performance.now(), camera=null;
function boucle(now){
  requestAnimationFrame(boucle);
  const dt=Math.min(.05,(now-avant)/1000); avant=now;
  let vx=dirX, vy=dirY;
  if(touches.ArrowRight) vx=1; if(touches.ArrowLeft) vx=-1; if(touches.ArrowUp) vy=-1; if(touches.ArrowDown) vy=1;
  if(questionRentrer||window.RUDY_BLOQUE){ vx=0; vy=0; }
  const hp=hPerso(), libre=(etat==='repos'||etat==='marche');
  if(libre&&(vx||vy)){
    if(etat!=='marche'){ etat='marche'; parcours=0; }
    const ax=x, ay=y;
    x=Math.max(X_MIN,Math.min(X_MAX,x+vx*1.25*hp*dt)); y=Math.max(Y_HAUT,Math.min(Y_BAS,y+vy*52*dt));
    if(vx>0.05) sens=1; else if(vx<-0.05) sens=-1;
    parcours+=Math.hypot(x-ax,(y-ay)*.6);
    montre(images()[Math.floor(parcours/(0.17*hp))%images().length]);
  }else{
    if(etat==='marche'){ etat='repos'; phase=0; f=0; }
    if(etat==='jeter') x=Math.max(X_MIN,Math.min(X_MAX,x+sens*1.25*.55*hp*dt));
    phase+=dt*1000/duree();
    let L=images();
    if(phase>=1){ phase-=1; f++;
      if(f>=L.length){ if(etat==='fumer'){ clope=true; etat='repos'; } else if(etat==='jeter'){ clope=false; etat='repos'; } f=0; majBoutons(); L=images(); } }
    montre(L[Math.min(f,L.length-1)]);
  }
  place();
  // devant l'entrée de Chez Valia : la flèche jaune et le bouton « ENTRER »
  const fv=document.getElementById('flecheV'), be=document.getElementById('entrerS');
  if(x>1850&&x<2030&&!dansClub){ fv.style.display='block'; fv.style.left=(x/2172*100)+'%'; fv.style.top=((y-hp*1.08)/528*100)+'%'; be.style.display='block'; }
  else{ fv.style.display='none'; be.style.display='none'; }
  // tout à gauche du boulevard : on propose de rentrer
  if(x<=X_MIN+4&&!dansClub&&!questionRentrer&&!refusRentrer){ questionRentrer=true; dirX=dirY=0; for(const k in touches) touches[k]=false; document.getElementById('rentrerQ').style.display='flex'; }
  if(x>X_MIN+80) refusRentrer=false;
  const sc=scene.getBoundingClientRect(); const cible=x/2172*sc.width-vue.clientWidth/2;
  camera=camera===null?cible:camera+(cible-camera)*Math.min(1,dt*4); vue.scrollLeft=camera;
}
requestAnimationFrame(boucle);

// ---------- Chez Valia : on entre, on ressort, autant de fois qu'on veut ----------
let dansClub=false; const club=document.getElementById('clubV');
document.getElementById('entrerS').addEventListener('click',()=>{

  club.style.display='none'; club.onload=null; club.src='about:blank'; dansClub=false; document.getElementById('clubCharge').style.display='none';
  x=1940; y=Math.max(y,360); sens=1; etat='repos'; f=0; joue();
});
// ---------- la musique du boulevard (celle de la ville se tait le temps d'être ici) ----------
const mus=document.getElementById('musiqueS'); mus.volume=.45; window.BLVD_MUS=mus;
function joue(){ const q=mus.play(); if(q&&q.catch) q.catch(()=>{}); }
try{ if(parent&&parent.RUDY_AUDIO&&!parent.RUDY_AUDIO.paused) parent.RUDY_AUDIO.pause(); }catch(e){}
joue(); ['pointerdown','touchstart','keydown'].forEach(t=>addEventListener(t,()=>{ if(mus.paused&&!dansClub) joue(); },{passive:true}));

addEventListener('pagehide',()=>{ try{ mus.pause(); }catch(e){} });
})();

/* ---------- la dame en blanc (devant le restaurant) : PARLER → donner 100, 200 ou 300 € ----------
   Seulement quand Rudy est seul (ici, sur le boulevard, il se promène toujours seul). */
(function(){
  const DAME_X=1110, PRES=70;
  const CHOIX=[ {prix:100,video:'/assets/shinato/m/blvd_dame_100.mp4'}, {prix:200,video:'/assets/shinato/m/blvd_dame_200.mp4'}, {prix:300,video:'/assets/shinato/m/blvd_dame_300.mp4'} ];
  const bP=document.getElementById('parlerDame'), ch=document.getElementById('choixDame'), bu=document.getElementById('bulleDame'),
        vb=document.getElementById('videoDame'), v=vb.querySelector('video'), bF=document.getElementById('fumerS'), bJ=document.getElementById('jeterS');
  function pont(){ for(const w of [window,parent,top]){ try{ if(w.Chambre&&w.Chambre.argent) return w.Chambre; }catch(e){} } return null; }
  function argent(){ const p=pont(); try{ return p?p.argent():null; }catch(e){ return null; } }
  function payer(n){ const p=pont(); try{ if(p&&p.ajouterArgent) p.ajouterArgent(-n); }catch(e){} }
  function dit(t,ms){ bu.textContent=t; bu.style.display='block'; clearTimeout(bu._t); if(ms) bu._t=setTimeout(()=>{ bu.style.display='none'; },ms); }
  let occupe=false;
  function seul(){ return !window.FILLE_AVEC_RUDY; }          // jamais quand une fille accompagne Rudy
  setInterval(()=>{ const X=window.RUDY_BX?window.RUDY_BX():-9999;
    bP.style.display=(!occupe&&seul()&&Math.abs(X-DAME_X)<PRES&&Math.abs(X-1124)<Math.abs(X-1078))?'block':'none'; },120);
  function cacheBoutons(c){ [bF,bJ].forEach(b=>b.style.visibility=c?'hidden':''); }
  function fin(){ ch.style.display='none'; cacheBoutons(false); }
  function ferme(){ try{ v.pause(); }catch(e){} vb.style.display='none'; occupe=false; }
  v.addEventListener('ended',ferme); v.addEventListener('error',ferme);
  function app(el,fn){ let t=0; const go=e=>{ if(e&&e.cancelable) e.preventDefault(); const n=performance.now(); if(n-t<350) return; t=n; fn(); };
    el.addEventListener('touchstart',go,{passive:false}); el.addEventListener('click',go); }
  app(bP,()=>{
    occupe=true; bP.style.display='none'; ch.innerHTML='';
    CHOIX.forEach(C=>{ const b=document.createElement('button'); b.textContent='💶 Donner '+C.prix+' €'; ch.appendChild(b);
      app(b,()=>{ fin();
        const a=argent(); if(a!==null&&a<C.prix){ dit("Il te faut "+C.prix+" €, mon chéri… 😏",2400); occupe=false; return; }
        payer(C.prix);
        dit("Je suis peut-être vieille… mais je peux te donner beaucoup de plaisir 😏",2800);
        setTimeout(()=>{ bu.style.display='none'; v.src=C.video; vb.style.display='block'; const q=v.play(); if(q&&q.catch) q.catch(()=>{}); },2900); }); });
    const non=document.createElement('button'); non.className='non'; non.textContent='Rien'; ch.appendChild(non);
    app(non,()=>{ fin(); occupe=false; });
    ch.style.display='flex'; cacheBoutons(true);
  });
})();

/* ---------- la petite blonde qui fume, sur le trottoir devant la baie : gestes enchaînés en douceur ---------- */
(function(){
  const el=document.getElementById('blondeB'), N=25, NB=4;
  el.style.backgroundImage='url(/assets/shinato/m/img_f3fcb15651d6.webp)';
  const sc=document.getElementById('scene'); if(sc&&el.parentNode!==sc){ sc.appendChild(el); sc.appendChild(document.getElementById('blondeOmbre')); }
  function pose(i){ el.style.backgroundPosition=(N>1?(i/(N-1)*100):0)+'% 0'; }
  // regarde en l'air → porte la cigarette → tire les yeux fermés → souffle la fumée → sourit, cigarette en bas
  const HOLD=[2200,1300,1600,1700,2100], PAS=75; let k=0;
  function joue(){ pose(k*(NB+1)); setTimeout(()=>{ let j=1; const t=setInterval(()=>{ pose(k*(NB+1)+j); j++; if(j>NB){ clearInterval(t); k=(k+1)%5; joue(); } },PAS); },HOLD[k]); }
  joue();
})();

/* ---------- Fred, le voiturier (devant Chez Valia) : PARLER → la conversation en bulles manga → la vidéo de la voiture → Route de nuit → Miria City
   Au retour de Miria City (on rend la voiture), Rudy réapparaît devant Fred qui le remercie. ---------- */
(function(){
  const FRED_X=2070, FRED_TETE=232, PRES=55;
  const bP=document.getElementById('parlerFred'), bu=document.getElementById('bulleM'), bt=document.getElementById('bulleMTxt'),
        vb=document.getElementById('videoDame'), v=vb.querySelector('video'), ch=document.getElementById('choixDame'), sc=document.getElementById('scene');
  let lignes=[], i=0, minuteur=null, apres=null, actif=false;
  function placeBulle(){
    if(!actif) return;
    const qui=lignes[i][0], r=sc.getBoundingClientRect(), P=window.RUDY_BPOS?window.RUDY_BPOS():{x:FRED_X-40,y:345,h:100};
    const wx=qui==='r'?P.x:FRED_X, wy=qui==='r'?P.y-P.h*1.06:FRED_TETE;
    const sx=r.left+wx/2172*r.width, sy=r.top+wy/528*r.height-12;
    const w=bu.offsetWidth||200, mx=Math.max(w/2+8,Math.min(innerWidth-w/2-8,sx));
    bu.style.left=mx+'px'; bu.style.top=Math.max(bu.offsetHeight+8,sy)+'px';
    bu.style.setProperty('--queue',Math.max(18,Math.min(w-18,w/2+(sx-mx)))+'px');
    bu.style.setProperty('--penche',qui==='r'?'18deg':'-18deg');
  }
  function montre(){
    clearTimeout(minuteur);
    if(i>=lignes.length){ fin(); return; }
    const t=lignes[i][1]; bt.textContent=t; bu.style.display='block';
    bu.style.animation='none'; void bu.offsetWidth; bu.style.animation=''; placeBulle();
    minuteur=setTimeout(suite,1800+t.length*55);
  }
  function suite(){ if(!actif) return; i++; montre(); }
  function fin(){ clearTimeout(minuteur); actif=false; bu.style.display='none'; window.RUDY_BLOQUE=false; const a=apres; apres=null; if(a) a(); }
  function dialogue(L,ensuite){ lignes=L; i=0; actif=true; apres=ensuite; window.RUDY_BLOQUE=true; montre(); }
  setInterval(placeBulle,60);
  document.addEventListener('pointerdown',e=>{ if(!actif) return; e.preventDefault(); suite(); },true);
  window.addEventListener('resize',placeBulle);
  // le bouton PARLER près de Fred
  setInterval(()=>{ const X=window.RUDY_BX?window.RUDY_BX():-9999;
    bP.style.display=(!actif&&vb.style.display!=='block'&&ch.style.display!=='flex'&&Math.abs(X-FRED_X)<PRES)?'block':'none'; },120);
  let t0=0;
  const go=e=>{ if(e&&e.cancelable) e.preventDefault(); const n=performance.now(); if(n-t0<400) return; t0=n;
    if(actif) return; bP.style.display='none';
    const P=window.RUDY_BPOS?window.RUDY_BPOS():null; if(P&&window.RUDY_BSET) window.RUDY_BSET(P.x,P.y,P.x<FRED_X?1:-1);   // Rudy se tourne vers Fred
    dialogue([
      ['r',"Salut Fred, j'ai besoin que tu me dépannes une voiture."],
      ['b',"Qu'est-ce que tu veux faire avec ?"],
      ['r',"Je dois partir à Miria City."]
    ],()=>{
      // la vidéo de la voiture, puis la route de nuit jusqu'à Miria City
      window.RUDY_BLOQUE=true;
      try{ window.BLVD_MUS.pause(); }catch(err){}
      let fini=false;
      const part=()=>{ if(fini) return; fini=true; v.removeEventListener('ended',part); v.removeEventListener('error',part);
        try{ window.BLVD_MUS.pause(); }catch(err){}
        try{ parent.postMessage({type:'boulevard:miria'},'*'); }catch(err){} };
      v.addEventListener('ended',part); v.addEventListener('error',part);
      v.src='/assets/shinato/m/blvd_voiture.mp4'; vb.style.display='block'; const q=v.play(); if(q&&q.catch) q.catch(()=>{});
    });
  };
  bP.addEventListener('touchstart',go,{passive:false}); bP.addEventListener('click',go);
  // retour de Miria City : Rudy rend la voiture, il apparaît devant Fred qui le remercie
  let retour=false; try{ retour=localStorage.getItem('blvd_retour_fred')==='1'; localStorage.removeItem('blvd_retour_fred'); }catch(e){}
  if(retour){
    if(window.RUDY_BSET) window.RUDY_BSET(FRED_X-48,348,1);
    setTimeout(()=>dialogue([['b',"Merci de me l'avoir ramenée."]],null),700);
  }
