/* ---------- personnages assis ---------- */
const PERSOS=[];
function persoAssis(o){
  /* o: pre, x (centre du tabouret), seat (y du dessus de l'assise), s (échelle), seatFrac,
     flip, buttX (abscisse des fesses dans l'image), smoke:{tips:[[x,y]x3], mouth:[x,y]}, kind */
  const el=document.createElement('img'); scene.insertBefore(el,cv);
  const imgs=(o.nb?[...Array(o.nb).keys()]:[0,1,2]).map(i=>FR[o.pre+i]);
  const p=Object.assign({el,imgs,frame:-1,t:0,seq:[],timer:rnd(1,5),breath:rnd(0,6),puffT:rnd(0,1)},o);
  if(o.poitrine){ const box=document.createElement('div'); box.style.cssText='position:absolute;transform-origin:50% 100%;pointer-events:none';
    const im=document.createElement('img'); im.style.cssText='left:0;top:0;width:100%;height:100%;transform-origin:50% 30%';
    box.appendChild(im); scene.insertBefore(box,cv); p.jig=Object.assign({box,img:im,y:0,v:0},o.poitrine); }
  setFrame(p,o.repos||0); PERSOS.push(p); return p;
}
function geo(p,i){ /* position de l'image i dans la scène */
  const f=p.imgs[i],f0=p.imgs[0],s=p.s;
  const h=f.h*s,w=f.w*s;
  const bottom=p.seat+(1-p.seatFrac)*f0.h*s;
  let left;
  if(p.buttX!==undefined){ /* profil : on aligne les jambes, fesses sur le tabouret */
    const legsX = p.x + (p.flip?-1:1)*(f0.ax-p.buttX)*s;
    left = p.flip ? legsX-(f.w-f.ax)*s : legsX-f.ax*s;
  } else left=p.x-f.ax*s;
  return {left,top:bottom-h,w,h};
}
function setFrame(p,i){
  if(p.frame===i) return; p.frame=i;
  const f=p.imgs[i],g=geo(p,i);
  p.el.src=f.src; p.el.style.left=g.left+'px'; p.el.style.top=g.top+'px';
  p.el.style.width=g.w+'px'; p.el.style.height=g.h+'px';
  p.el.style.transformOrigin='50% 100%';
  p.g=g;
  if(p.jig){ const J=p.jig,c=J.c[i],s=p.s;
    J.box.style.left=g.left+'px'; J.box.style.top=g.top+'px'; J.box.style.width=g.w+'px'; J.box.style.height=g.h+'px';
    J.img.src=f.src;
    const m=`radial-gradient(ellipse ${J.rx*s}px ${J.ry*s}px at ${c[0]*s}px ${c[1]*s}px, #000 45%, transparent 100%)`;
    J.box.style.webkitMaskImage=m; J.box.style.maskImage=m;

}

  const f=p.imgs[p.frame],g=p.g;
  const x = p.flip ? g.left+(f.w-pt[0])*p.s : g.left+pt[0]*p.s;
  return [x,g.top+pt[1]*p.s];
}

    return [[1,rnd(1.2,2.4)],[0,rnd(0.6,1.2)],[1,rnd(1,2)],[0,0]];

  setTimeout(()=>{try{window.parent.postMessage({type:'baril:sortie'},'*');}catch(_){}},60);});
bS.addEventListener('pointercancel',()=>{arme=false;});
// ===== PARLER à Barry, le barman : sa bulle, puis les choix =====
const bP=document.getElementById('parlerR'), bulle=document.getElementById('bulleBarry'), choix=document.getElementById('choixR');
const vbox=document.getElementById('vidR'), vid=vbox.querySelector('video');
function appuiR(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn();});}
const balai=PERSOS.find(p=>p.kind==='balai');
function plaquetteVue(){ try{ return localStorage.getItem('baril_plaquette_vu')==='1'; }catch(e){ return false; } }
function quiParle(){
  const dB=Math.abs(R.x-bm.x), dF=balai?Math.abs(R.x-balai.x-40):1e9;
  if(plaquetteVue()&&dF<120&&dF<=dB) return 'balai';
  return dB<120?'barry':null;
}
function rectRudy(){ const r=rcv.getBoundingClientRect(), k=r.width/1983, h=taille(R.y);
  return {left:r.left+(R.x-h*0.2)*k, top:r.top+(R.y-h)*k, width:h*0.4*k, height:h*k}; }
function montreBulle(txt,qui){
  bulle.textContent=txt;bulle.style.display='block';bulle.style.animation='none';void bulle.offsetWidth;bulle.style.animation='';
  const r=qui==='rudy'?rectRudy():qui==='balai'?balai.el.getBoundingClientRect():bm.el.getBoundingClientRect(), bw=bulle.offsetWidth, cx=r.left+r.width/2, x=Math.max(bw/2+8,Math.min(innerWidth-bw/2-8,cx));
  bulle.style.left=x+'px'; bulle.style.top=Math.max(bulle.offsetHeight+12,r.top+r.height*0.02)+'px';
  bulle.style.setProperty('--q',Math.max(12,Math.min(88,50+(cx-x)/bw*100))+'%');
}
let musiqueAvant=false;
function finDialogue(){choix.style.display='none';bulle.style.display='none';occupe=false;js();for(const k in clav)clav[k]=0;}
appuiR(bP,()=>{ if(occupe)return; if(quiParle()==='balai'){ dialogueBalai(); return; } occupe=true; js(); for(const k in clav)clav[k]=0; bP.style.display='none';
  R.dir='haut'; montreBulle("Salut, je m'appelle Barry. Si tu veux des informations… tu payes.");
  setTimeout(()=>{ if(occupe) choix.style.display='flex'; },2000); });
appuiR(document.getElementById('chFermerR'),finDialogue);
// chaque information coûte 100 € (le porte-monnaie de Rudy, comme au Barding)
const PRIX=100;
function pont(){ for(const w of [window,parent,top]){ try{ if(w.Chambre&&w.Chambre.argent) return w.Chambre; }catch(e){} } return null; }
function argent(){ const p=pont(); try{ return p?p.argent():null; }catch(e){ return null; } }
function payer(n){ const p=pont(); try{ if(p&&p.ajouterArgent) p.ajouterArgent(-n); }catch(e){} }
// chaque choix lance sa vidéo
['chDiamant','chMort','chPlantes','chEtoiles','chCoeur','chPlume','chPlaquette'].forEach(id=>{ const el=document.getElementById(id); appuiR(el,()=>{
  const a=argent(); if(a!==null&&a<PRIX){ montreBulle("Il te faut "+PRIX+" € 😏"); return; }
  payer(PRIX);
  if(id==='chPlaquette'){ try{ localStorage.setItem('baril_plaquette_vu','1'); }catch(_){} }   // la balayeuse aura quelque chose à dire
  choix.style.display='none'; bulle.style.display='none';
  musiqueAvant=!musique.paused; try{musique.pause();}catch(_){}
  vid.src=el.dataset.v; vbox.style.display='block'; vid.currentTime=0;
  const fin=()=>{ vid.onended=null; vid.pause(); vbox.style.display='none'; if(musiqueAvant) musique.play().catch(()=>{}); finDialogue(); };
  vid.onended=fin; vid.play().catch(fin); }); });
// ===== le dialogue secret de la balayeuse (après avoir payé Barry pour la plaquette métallique) =====
const SECRET=[['balai',"Si tu es venu me voir… c'est que tu as compris de quoi je voulais parler."],['rudy',"Ça m'intéresse."],
  ['balai',"Tu ne vas pas être déçu. Viens, on va derrière… il y a un lit de paille."],['rudy',"Je te suis."],['balai',"T'as intérêt."]];
let etapeS=-1, minuteS=null;
function dialogueBalai(){ occupe=true; js(); for(const k in clav)clav[k]=0; bP.style.display='none';
  R.dir=balai.x+40<R.x?'gauche':'droite'; etapeS=-1; suiteBalai(); }
function suiteBalai(){
  clearTimeout(minuteS); etapeS++;
  if(etapeS>=SECRET.length){ etapeS=-1; bulle.style.display='none';
    musiqueAvant=!musique.paused; try{musique.pause();}catch(_){}
    vid.src='/assets/shinato/m/baril_balayeuse.mp4'; vbox.style.display='block'; vid.currentTime=0;
    const fin=()=>{ vid.onended=null; vid.pause(); vbox.style.display='none'; if(musiqueAvant) musique.play().catch(()=>{}); finDialogue(); };
    vid.onended=fin; vid.play().catch(fin); return; }
  const [qui,txt]=SECRET[etapeS]; montreBulle(txt,qui); minuteS=setTimeout(suiteBalai,2000);   // chaque bulle dure 2 secondes
}
// un appui sur l'écran fait passer à la bulle suivante
addEventListener('pointerdown',()=>{ if(etapeS>=0) suiteBalai(); });
// joystick
const joy=document.getElementById('joyR'),knob=document.getElementById('knobR');let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),Rr=r.width/2;let dx=e.clientX-r.left-Rr,dy=e.clientY-r.top-Rr;const dd=Math.hypot(dx,dy),mm=Rr*0.62;if(dd>mm){dx*=mm/dd;dy*=mm/dd;}knob.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/mm;jy=dy/mm;}
function js(){jid=null;jx=jy=0;knob.style.transform='';}
joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();jid=e.pointerId;try{joy.setPointerCapture(jid)}catch(_){}jm(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e);});
joy.addEventListener('pointerup',e=>{if(e.pointerId===jid)js();});joy.addEventListener('pointercancel',e=>{if(e.pointerId===jid)js();});
const clav={};const T={ArrowLeft:'l',KeyA:'l',KeyQ:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',KeyZ:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{if(T[e.code])clav[T[e.code]]=1;});addEventListener('keyup',e=>{if(T[e.code])clav[T[e.code]]=0;});
addEventListener('blur',()=>{js();for(const k in clav)clav[k]=0;});
addEventListener('resize',()=>camera(true));
// la musique du Baril démarre dès l'entrée
initSon();
requestAnimationFrame(()=>{camera(true);requestAnimationFrame(avance);});
})();
</script>
