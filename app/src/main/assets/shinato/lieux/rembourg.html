<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rembourg</title>
<style>
:root{--nuit:#0b0b1e;--texte:#f3e6c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){--nuit:#0b0b1e}
:root[data-theme="dark"]{--nuit:#0b0b1e}
html{height:100%}
html,body{margin:0;background:var(--nuit);overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:var(--texte)}
body{height:100%}
#vue{position:fixed;inset:0;overflow:hidden;touch-action:none;display:flex;align-items:flex-start}
#pano{position:relative;flex:none;user-select:none;-webkit-user-select:none}
#pano>img.fond,#pano>canvas.fond{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#petales{position:fixed;inset:0;width:100%;height:100%;z-index:35;pointer-events:none}
#rudyM{position:absolute;z-index:30;transform-origin:50% 100%;pointer-events:none;will-change:left,top}
#ombreM{position:absolute;z-index:29;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));transform:translate(-50%,-50%);pointer-events:none}
#joy{position:fixed;left:4.5vmin;bottom:5vmin;width:30vmin;height:30vmin;border-radius:50%;z-index:40;touch-action:none;
 background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.10),rgba(0,0,0,.34));border:2px solid rgba(255,226,122,.45);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#stick{position:absolute;left:50%;top:50%;width:13vmin;height:13vmin;margin:-6.5vmin 0 0 -6.5vmin;border-radius:50%;
 background:radial-gradient(circle at 42% 36%,#fbf0c6,#c9a33c 60%,#7d6118);box-shadow:0 4px 12px rgba(0,0,0,.6)}
#zoneJoy{position:fixed;left:0;bottom:0;width:44vw;height:62vh;z-index:39;touch-action:none}
#actions{position:fixed;right:4.5vmin;bottom:6vmin;display:flex;flex-direction:column;gap:2.6vmin;z-index:40}
.btn{min-width:26vmin;padding:2.4vmin 3vmin;border-radius:3vmin;text-align:center;font:900 clamp(13px,3.1vmin,26px)/1 Arial,sans-serif;letter-spacing:2px;color:#ffe27a;
 background:linear-gradient(rgba(12,12,14,.9),rgba(30,30,34,.9));border:2px solid rgba(255,226,122,.95);box-shadow:0 5px 16px rgba(0,0,0,.55);user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.94)} .btn.off{opacity:.32}
#btnEntrer{display:none;border-color:rgba(255,226,122,.95);box-shadow:0 5px 16px rgba(0,0,0,.55),0 0 16px rgba(255,214,60,.55)}
#flechePorte{position:absolute;z-index:31;display:none;width:2.4%;aspect-ratio:100/120;transform:translate(-50%,0);pointer-events:none;
 filter:drop-shadow(0 0 6px rgba(255,225,40,1)) drop-shadow(0 0 16px rgba(255,200,0,.8));animation:clignP .7s ease-in-out infinite alternate}
@keyframes clignP{from{opacity:1}to{opacity:.55}}
#chateauJeu{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:85;background:#000;display:none}
#chateauQuitter{position:fixed;z-index:86;top:calc(10px + env(safe-area-inset-top,0px));left:10px;display:none;padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.6);color:#ffe27a;border:2px solid rgba(255,226,122,.8);font:900 13px Arial,sans-serif;letter-spacing:1px}
#depart{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font-family:Arial,Helvetica,sans-serif}
#depart .carte{position:relative;min-width:62vmin;max-height:92vh;overflow:auto;padding:5vmin 6vmin 5.5vmin;border-radius:3vmin;text-align:center;
 background:linear-gradient(rgba(14,14,18,.96),rgba(30,30,36,.96));border:2px solid rgba(255,226,122,.6);box-shadow:0 10px 40px rgba(0,0,0,.7)}
#depart h2{margin:0 0 4vmin;color:#fff;font:900 clamp(16px,4.2vmin,34px)/1.2 Arial,sans-serif;letter-spacing:2px;text-shadow:0 3px 0 #000}
#depart .choix{display:block;width:100%;margin-top:2.4vmin;padding:3vmin 4vmin;border-radius:2.4vmin;cursor:pointer;
 font:900 clamp(15px,3.8vmin,30px)/1 Arial,sans-serif;letter-spacing:2px;color:#ffe27a;
 background:linear-gradient(rgba(12,12,14,.9),rgba(40,40,46,.9));border:2px solid rgba(255,226,122,.7)}
#depart .choix:active{transform:scale(.95)}
#depart .fermer{position:absolute;top:1.6vmin;right:2.2vmin;color:#ffe27a;font:900 clamp(16px,4vmin,30px)/1 Arial;cursor:pointer;opacity:.7}
#zoom{position:fixed;right:calc(4vmin + env(safe-area-inset-right,0px));top:14vh;height:36vh;width:7vmin;z-index:45;touch-action:none;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none}
#zoom b{position:relative;display:block;width:100%;height:5vmin;cursor:pointer}
#zoom b::before,#zoom b.zp::after{content:'';position:absolute;left:50%;top:50%;width:3vmin;height:.6vmin;margin:-.3vmin 0 0 -1.5vmin;background:#f3dfa0;border-radius:1vmin;box-shadow:0 0 3px #000}
#zoom b.zp::after{width:.6vmin;height:3vmin;margin:-1.5vmin 0 0 -.3vmin}
#zoomRail{position:relative;flex:1;width:.7vmin;border-radius:1vmin;background:rgba(243,223,160,.45);box-shadow:0 0 3px rgba(0,0,0,.8);margin:2.5vmin 0}
#zoomBout{position:absolute;left:50%;width:4vmin;height:4vmin;margin:-2vmin 0 0 -2vmin;border-radius:50%;background:radial-gradient(circle at 45% 38%,#f6e3a1,#a07a24);border:1px solid #3b2a08;box-shadow:0 1px 4px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="zoom"><b class="zp" data-z="1"></b><div id="zoomRail"><div id="zoomBout"></div></div><b class="zm" data-z="-1"></b></div>
<div id="vue"><div id="pano"><img class="fond" id="fondimg" alt="Rembourg : le château gothique sous la lune" src="/assets/shinato/m/img_f76d5b1cdd48.webp"><canvas class="fond" id="fond" width="2172" height="724"></canvas></div></div>
<canvas id="petales"></canvas>

<div id="zoneJoy"></div><div id="joy"><div id="stick"></div></div>
<div id="actions"><div class="btn" id="btnEntrer">ENTRER</div><div class="btn" id="btnFumer">FUMER</div><div class="btn off" id="btnJeter">JETER</div></div>
<div id="chateauQuitter">&#10005; REMBOURG</div>
<div id="depart"><div class="carte">
 <div class="fermer" id="departFermer">&#10005;</div>
 <h2>OÙ VOULEZ-VOUS ALLER&nbsp;?</h2>
 <div class="choix" data-d="shinato">SHINATO</div>
 <div class="choix" data-d="plage">À LA PLAGE</div>
 <div class="choix" data-d="vaviel">VAVIEL</div>
 <div class="choix" data-d="delabree">VILLE DÉLABRÉE</div>
 <div class="choix" data-d="boulevard">BOULEVARD</div>
 <div class="choix" data-d="mitsuda">MITSUDA</div>
 <div class="choix" id="versPontLades" data-d="pontlades" style="display:none">PONT-L'ADES</div>
 <div class="choix" data-d="aeroport">L'AÉROPORT</div>
 <div class="choix" data-d="chaliaville">CHALIAVILLE</div>
 <div class="choix" data-d="garrett">GARRETT PARC</div>
</div></div>
<script>/* PONT-L'ADES : le choix n'apparaît qu'après « INFORMATION SUR MIDA » (le costaud du Barding) */
setInterval(function(){ var b=document.getElementById('versPontLades'); if(!b) return; var ok=false; try{ ok=localStorage.getItem('pontlades_debloque')==='1'; }catch(e){} b.style.display=ok?'':'none'; },400);</script>
<script>
const PW=2172,PH=724;
const vue=document.getElementById('vue'), pano=document.getElementById('pano');
// zoom de la caméra (1 = toute la hauteur de l'écran, plus = plus près) : réglé avec la barre de zoom, comme à Chaliaville
const ZMIN=1, ZMAX=1.9; let ZOOM=1.45;
try{ const v=parseFloat(localStorage.getItem('rembourg_zoom')); if(v>=ZMIN&&v<=ZMAX) ZOOM=v; }catch(e){}
function taille(){
 // le décor remplit tout l'écran (plus de bande vide en bas) ; le bas de l'image (le sol) reste collé au bas de l'écran
 const vw=innerWidth,vh=innerHeight;let h=vh*ZOOM,w=h*PW/PH;
 if(w<vw){w=vw;h=w*PH/PW}
 pano.style.width=w+'px';pano.style.height=h+'px';pano.style.marginTop=(vh-h)+'px';
}
taille();addEventListener('resize',taille);

/* ---------- les arbres dans le vent (WebGL) : le pied reste fixe, le haut des arbres se balance ---------- */
(()=>{
  const cv=document.getElementById('fond');
  const gl=cv.getContext('webgl',{premultipliedAlpha:false});
  if(!gl){cv.remove();return}
  const vs=`attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
  const fs=`precision mediump float;varying vec2 uv;uniform sampler2D img,msk;uniform float t;
  const vec2 R=vec2(2172.,724.);
  void main(){
    vec2 p=uv*R; vec3 m=texture2D(msk,uv).rgb;
    float rafale=.55+.45*sin(t*.31+p.x*.0013)*sin(t*.19+1.7);
    float bruit=sin(t*1.15+p.x*.009+p.y*.016)*1.7+sin(t*2.7+p.y*.05+p.x*.004)*.6+sin(t*5.1+p.x*.045+p.y*.03)*.22;
    vec2 d=vec2(m.r*bruit*(.9+rafale*1.6), m.r*sin(t*1.6+p.x*.02)*.5);
    d.x+=m.g*(sin(t*2.1+p.x*.07)*.5+sin(t*3.6+p.x*.13)*.22);
    vec4 c=texture2D(img,(p+d)/R);
    gl_FragColor=vec4(c.rgb,1.);
  }`;
  const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){cv.remove();return}
  gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const tex=(u,src)=>new Promise(r=>{const im=new Image();im.onload=()=>{const tx=gl.createTexture();gl.activeTexture(gl.TEXTURE0+u);
    gl.bindTexture(gl.TEXTURE_2D,tx);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);r()};im.src=src});
  const lt=gl.getUniformLocation(pr,'t');
  Promise.all([tex(0,document.getElementById('fondimg').src),tex(1,'/assets/shinato/m/img_b181c061fced.png')]).then(()=>{
    gl.uniform1i(gl.getUniformLocation(pr,'img'),0);gl.uniform1i(gl.getUniformLocation(pr,'msk'),1);
    const calme=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const f=ms=>{gl.uniform1f(lt,calme?0:ms/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(f)};
    requestAnimationFrame(f);
  });
})();

/* ---------- pétales rouges portés par le vent ---------- */
(()=>{
  const cv=document.getElementById('petales'), c=cv.getContext('2d');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ cv.remove(); return; }
  let W=0,H=0,dpr=1; const P=[];
  function dim(){ dpr=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; c.setTransform(dpr,0,0,dpr,0,0); }
  dim(); addEventListener('resize',dim);
  const TEINTES=['#b3122e','#d61f3c','#8e0b22','#e8455a','#a5102a'];
  function nouveau(partout){ const s=(3+Math.random()*5)*Math.max(.8,Math.min(1.6,H/420));
    return { x:partout?Math.random()*W:W+20+Math.random()*W*.3, y:partout?Math.random()*H:-20+Math.random()*H*.7,
      s, vx:-(18+Math.random()*30), vy:12+Math.random()*22, a:Math.random()*6.28, va:(Math.random()-.5)*3, fl:Math.random()*6.28,
      col:TEINTES[Math.floor(Math.random()*TEINTES.length)], o:.55+Math.random()*.4 }; }
  const N=()=>Math.round(Math.min(70,Math.max(30,W*H/14000)));
  for(let i=0;i<N();i++) P.push(nouveau(true));
  let tp=0;
  function boucle(t){
    requestAnimationFrame(boucle);
    const dt=Math.min(.05,(t-(tp||t))/1000); tp=t;
    const vent=1+.8*Math.max(0,Math.sin(t/1000*.45))*Math.sin(t/1000*.21+1);   // rafales
    c.clearRect(0,0,W,H);
    while(P.length<N()) P.push(nouveau(false));
    for(let i=P.length-1;i>=0;i--){ const p=P[i];
      p.fl+=dt*3; p.a+=p.va*dt;
      p.x+=(p.vx*vent+Math.sin(p.fl)*14)*dt*(H/420); p.y+=(p.vy+Math.cos(p.fl*.8)*8)*dt*(H/420);
      if(p.x<-30||p.y>H+30){ P[i]=nouveau(false); continue; }
      const k=Math.abs(Math.cos(p.fl));                      // il tourne sur lui-même : il s'aplatit et revient
      c.save(); c.translate(p.x,p.y); c.rotate(p.a); c.scale(1,.35+.65*k); c.globalAlpha=p.o;
      c.fillStyle=p.col; c.beginPath(); c.moveTo(0,-p.s); c.quadraticCurveTo(p.s*.9,-p.s*.2,0,p.s); c.quadraticCurveTo(-p.s*.9,-p.s*.2,0,-p.s); c.fill();
      c.globalAlpha=p.o*.35; c.fillStyle='#ffb3bf'; c.beginPath(); c.ellipse(-p.s*.15,-p.s*.25,p.s*.18,p.s*.45,0,0,6.28); c.fill();
      c.restore(); }
  }
  requestAnimationFrame(boucle);
})();

/* ================= Rudy à Rembourg : la planche du fumeur (marcher, fumer, jeter), sur le chemin pavé ================= */
const IMG=(function(){ try{ if(parent&&parent.RUDY_IMAGES) return parent.RUDY_IMAGES; }catch(e){} return null; })()||{marche:[],marchecig:[],fumer:[],jeter:[]};
Object.keys(IMG).forEach(k=>IMG[k].forEach(src=>{ const i=new Image(); i.src=src; }));
const YMIN=566, YMAX=592;          // le chemin pavé devant le château
const HMIN=142, HMAX=154;          // à peu près la moitié de la hauteur de la grande porte
const rudy=new Image(); rudy.id='rudyM'; rudy.alt=''; pano.appendChild(rudy);
const ombre=document.createElement('div'); ombre.id='ombreM'; pano.appendChild(ombre);
const btnF=document.getElementById('btnFumer'), btnJ=document.getElementById('btnJeter');
let dedans=false, etat='repos', clope=false, sens=1, x=70, y=580, f=0, phase=0, dir=0, dirY=0, tPrec=0, parcours=0, cam=0, menu=false, arme=false;
const DUREE={fumer:300,jeter:190,repos:520,reposcig:600}, VITESSE=1.25, PAS_M=0.17;
const hRudy=()=>HMIN+(HMAX-HMIN)*(y-YMIN)/(YMAX-YMIN);
function planche(){ if(etat==='fumer'||etat==='jeter') return etat; if(etat==='marche') return clope?'marchecig':'marche'; return 'repos'; }
function images(){ const p=planche(); if(p==='repos') return clope?IMG.fumer.slice(4):[IMG.fumer[0]]; return IMG[p]; }
function duree(){ const p=planche(); if(p==='repos') return clope?DUREE.reposcig:DUREE.repos; return DUREE[p]; }
function pose(src){
  if(src&&rudy.getAttribute('src')!==src) rudy.src=src;
  const h=hRudy(), hi=h*800/660, bas=y+h*30/660;
  rudy.style.height=(hi/PH*100)+'%'; rudy.style.top=((bas-hi)/PH*100)+'%';
  rudy.style.left=(x/PW*100)+'%'; rudy.style.transform='translateX(-50%) scaleX('+sens+')';
  ombre.style.left=(x/PW*100)+'%'; ombre.style.top=(y/PH*100)+'%';
  ombre.style.width=(h*0.55/PW*100)+'%'; ombre.style.height=(h*0.10/PH*100)+'%';
}
function cadrer(direct){
  const W=pano.offsetWidth, vw=vue.clientWidth, px=x/PW*W;
  const cible=Math.max(0,Math.min(W-vw,px-vw/2));
  cam=direct?cible:cam+(cible-cam)*0.16; vue.scrollLeft=cam;
}
function majBoutons(){
  btnF.classList.toggle('off',clope||etat==='fumer'||etat==='jeter');
  btnJ.classList.toggle('off',!clope||etat==='fumer'||etat==='jeter');
}
function rudyFume(){ if(clope||etat==='fumer'||etat==='jeter') return; etat='fumer'; f=0; phase=0; dir=dirY=0; majBoutons(); }
function rudyJette(){ if(!clope||etat==='fumer'||etat==='jeter') return; etat='jeter'; f=0; phase=0; dir=dirY=0; majBoutons(); }
function boucleRudy(t){
  requestAnimationFrame(boucleRudy);
  if(!tPrec) tPrec=t; const dt=Math.min((t-tPrec)/1000,0.05); tPrec=t;
  if(dedans) return;
  const h=hRudy(), libre=(etat==='repos'||etat==='marche')&&!menu;
  if(libre){
    if(dir!==0||dirY!==0){
      if(dir!==0) sens=dir>0?1:-1;
      if(etat!=='marche'){ etat='marche'; parcours=0; }
      const ax=x, ay=y;
      x=Math.max(45,Math.min(PW-45,x+dir*VITESSE*h*dt));
      y=Math.max(YMIN,Math.min(YMAX,y+dirY*VITESSE*0.45*h*dt));        // il reste sur la route
      parcours+=Math.hypot(x-ax,(y-ay)*1.6);
    } else if(etat==='marche'){ etat='repos'; phase=0; f=0; }
  } else if(etat==='jeter'){ x=Math.max(45,Math.min(PW-45,x+sens*VITESSE*0.55*h*dt)); }
  let jeu=images();
  if(etat==='marche'){ pose(jeu[Math.floor(parcours/(PAS_M*h))%jeu.length]); }
  else{
    phase+=dt*1000/duree();
    if(phase>=1){ phase-=1; f++;
      if(f>=jeu.length){ if(etat==='fumer'){ clope=true; etat='repos'; f=0; majBoutons(); } else if(etat==='jeter'){ clope=false; etat='repos'; f=0; majBoutons(); } else f=0; jeu=images(); } }
    pose(jeu[Math.min(f,jeu.length-1)]);
  }
  // tout à gauche : « Où voulez-vous aller ? » (seulement après être reparti un peu vers la droite)
  if(x>230) arme=true;
  if(arme&&!menu&&x<=50) montreMenu();
  cadrer(false);
}
/* joystick : toutes les directions */
(function(){
  const z=document.getElementById('zoneJoy'), joy=document.getElementById('joy'), stick=document.getElementById('stick');
  let actif=null, ox=0, oy=0, R=0;
  const touche=e=>[].slice.call(e.changedTouches).filter(t=>t.identifier===actif)[0];
  function bouge(cx,cy){ const dx=cx-ox, dy=cy-oy, d=Math.min(Math.hypot(dx,dy),R*0.62), a=Math.atan2(dy,dx);
    stick.style.transform='translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px)';
    const m=Math.hypot(dx,dy); if(m<R*0.18){ dir=dirY=0; return; } dir=dx/m; dirY=dy/m;
    if(Math.abs(dir)<0.2) dir=0; if(Math.abs(dirY)<0.2) dirY=0; }
  function lache(){ actif=null; dir=dirY=0; stick.style.transform='translate(0,0)'; }
  [z,joy].forEach(el=>{
    el.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; actif=t.identifier; const r=joy.getBoundingClientRect(); R=r.width/2;
      if(el===joy){ ox=r.left+R; oy=r.top+R; } else { ox=t.clientX; oy=t.clientY; } bouge(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
    el.addEventListener('touchmove',e=>{ const t=touche(e); if(t){ bouge(t.clientX,t.clientY); e.preventDefault(); } },{passive:false});
    el.addEventListener('touchend',e=>{ if(touche(e)) lache(); }); el.addEventListener('touchcancel',lache);
    el.addEventListener('mousedown',e=>{ const r=joy.getBoundingClientRect(); R=r.width/2; ox=r.left+R; oy=r.top+R; actif='souris'; bouge(e.clientX,e.clientY);
      const m=ev=>bouge(ev.clientX,ev.clientY), u=()=>{ lache(); removeEventListener('mousemove',m); removeEventListener('mouseup',u); };
      addEventListener('mousemove',m); addEventListener('mouseup',u); });
  });
  const K={}; const majK=()=>{ dir=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0); dirY=(K.ArrowDown?1:0)-(K.ArrowUp?1:0); };
  addEventListener('keydown',e=>{ if(e.key.startsWith('Arrow')){ K[e.key]=true; majK(); } else if(e.key==='f'||e.key==='F') rudyFume(); else if(e.key==='j'||e.key==='J') rudyJette(); });
  addEventListener('keyup',e=>{ if(e.key.startsWith('Arrow')){ K[e.key]=false; majK(); } });
  addEventListener('blur',lache); document.addEventListener('visibilitychange',lache);
})();
function appui(el,fn){ let t=0; const go=e=>{ if(e&&e.cancelable) e.preventDefault(); const n=performance.now(); if(n-t<350) return; t=n; fn(); };
  el.addEventListener('touchstart',go,{passive:false}); el.addEventListener('click',go); }
appui(btnF,rudyFume); appui(btnJ,rudyJette);

/* ---------- l'ambiance de Rembourg : pas de musique, mais le vent, les chauves-souris et des cris au loin ----------
   La musique de la ville est coupée en arrivant et revient dès qu'on part vers une autre map. */
// la musique de la ville est relue à chaque fois : si elle a été (re)créée après l'arrivée à Rembourg, on la coupe quand même
function musiqueVille(){ try{ return parent.RUDY_AUDIO||null; }catch(e){ return null; } }
function coupeMusique(){ try{ const m=musiqueVille(); if(m&&!m.paused) m.pause(); }catch(e){} }
function remetMusique(){ try{ const m=musiqueVille(); if(m&&m.paused){ const q=m.play(); if(q&&q.catch) q.catch(()=>{}); } }catch(e){} }
let iciRembourg=true;
coupeMusique(); const gardeMusique=setInterval(()=>{ if(iciRembourg) coupeMusique(); },300);   // si quelque chose la relance, on la recoupe
addEventListener('pagehide',()=>{ iciRembourg=false; clearInterval(gardeMusique); remetMusique(); });
const ambiance=(()=>{
  let a=null, maitre=null;
  function bruitBlanc(sec){ const n=a.sampleRate*sec, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b; }
  function vent(){                                   // un souffle continu qui monte et descend par rafales
    const src=a.createBufferSource(); src.buffer=bruitBlanc(4); src.loop=true;
    const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=420; f.Q.value=.7;
    const g=a.createGain(); g.gain.value=.16;
    const lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=.09; lg.gain.value=.11; lfo.connect(lg).connect(g.gain);
    const lfo2=a.createOscillator(), lg2=a.createGain(); lfo2.frequency.value=.05; lg2.gain.value=260; lfo2.connect(lg2).connect(f.frequency);
    src.connect(f).connect(g).connect(maitre); src.start(); lfo.start(); lfo2.start();
    // un sifflement aigu, plus discret
    const s2=a.createBufferSource(); s2.buffer=bruitBlanc(3); s2.loop=true;
    const f2=a.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=1500; f2.Q.value=6;
    const g2=a.createGain(); g2.gain.value=.025; const l3=a.createOscillator(), lg3=a.createGain(); l3.frequency.value=.13; lg3.gain.value=500; l3.connect(lg3).connect(f2.frequency);
    s2.connect(f2).connect(g2).connect(maitre); s2.start(); l3.start();
  }
  function chauveSouris(){                           // une petite rafale de cris aigus, d'un côté ou de l'autre
    const t=a.currentTime, n=3+Math.floor(Math.random()*5), pan=a.createStereoPanner?a.createStereoPanner():null;
    if(pan){ pan.pan.setValueAtTime(Math.random()*2-1,t); pan.pan.linearRampToValueAtTime(Math.random()*2-1,t+n*.09); pan.connect(maitre); }
    for(let i=0;i<n;i++){ const t0=t+i*(.06+Math.random()*.05);
      const o=a.createOscillator(), g=a.createGain(); o.type='sine';
      const f0=5200+Math.random()*2600; o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f0*.55,t0+.035);
      g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.06,t0+.006); g.gain.exponentialRampToValueAtTime(.0001,t0+.045);
      o.connect(g).connect(pan||maitre); o.start(t0); o.stop(t0+.06); }
    // le battement d'ailes
    for(let i=0;i<6;i++){ const t0=t+i*.07, s=a.createBufferSource(); s.buffer=bruitBlanc(.05);
      const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; const g=a.createGain();
      g.gain.setValueAtTime(.05,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.05); s.connect(f).connect(g).connect(pan||maitre); s.start(t0); }
  }
  function cri(){                                    // un cri lointain et plaintif, avec de l'écho
    const t=a.currentTime, d=1.6+Math.random()*1.4;
    const o=a.createOscillator(), o2=a.createOscillator(); o.type='sawtooth'; o2.type='sawtooth';
    const f0=420+Math.random()*260;
    o.frequency.setValueAtTime(f0*.8,t); o.frequency.linearRampToValueAtTime(f0*1.35,t+d*.25); o.frequency.linearRampToValueAtTime(f0*.6,t+d);
    o2.frequency.setValueAtTime(f0*.81,t); o2.frequency.linearRampToValueAtTime(f0*1.37,t+d*.25); o2.frequency.linearRampToValueAtTime(f0*.62,t+d);
    const vib=a.createOscillator(), vg=a.createGain(); vib.frequency.value=6; vg.gain.value=f0*.035; vib.connect(vg); vg.connect(o.frequency); vg.connect(o2.frequency);
    const fo=a.createBiquadFilter(); fo.type='bandpass'; fo.frequency.value=1100; fo.Q.value=4;          // la « voix »
    const g=a.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.18); g.gain.setValueAtTime(.05,t+d*.6); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    const echo=a.createDelay(1); echo.delayTime.value=.32; const eg=a.createGain(); eg.gain.value=.38;
    const pan=a.createStereoPanner?a.createStereoPanner():null; if(pan){ pan.pan.value=Math.random()*1.6-.8; pan.connect(maitre); }
    const sortie=pan||maitre;
    o.connect(fo); o2.connect(fo); fo.connect(g); g.connect(sortie); g.connect(echo); echo.connect(eg); eg.connect(echo); eg.connect(sortie);
    [o,o2,vib].forEach(x=>{ x.start(t); x.stop(t+d+.05); });
  }
  function boucle(){
    if(!a) return;
    if(Math.random()<.55) chauveSouris();
    if(Math.random()<.18) setTimeout(cri,800+Math.random()*1500);
    setTimeout(boucle,3500+Math.random()*5000);
  }
  function demarre(){
    if(a){ if(a.state==='suspended') a.resume(); return; }
    try{ a=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    maitre=a.createGain(); maitre.gain.value=.9; maitre.connect(a.destination);
    vent(); setTimeout(boucle,1500);
  }
  return { demarre, coupe(){ try{ if(a) a.suspend(); }catch(e){} } };
})();
ambiance.demarre();
['touchstart','pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{ if(!dedans) ambiance.demarre(); },{passive:true}));

const KO_CHATEAU={

  coups_f:'/assets/shinato/m/chateau_ko_fee_coups.mp4',       // la Fée : elle le met K.O. avec ses coups, sans l'attraper

  g_h:'/assets/shinato/m/chateau_ko_fantome.mp4',             // le Fantôme : elle l'attrape et pompe toute son énergie

function videoPleinEcran(src,fin,z){

  const v=vb.querySelector('video'); const f=()=>{ v.removeEventListener('ended',f); v.removeEventListener('error',f); fin(vb); };
  v.addEventListener('ended',f); v.addEventListener('error',f); v.src=src; const q=v.play(); if(q&&q.catch) q.catch(()=>{});
}

// ---------- barre de zoom (haut = zoomer, bas = dézoomer) ----------
(function(){
  const zr=document.getElementById('zoomRail'), zb=document.getElementById('zoomBout'), zz=document.getElementById('zoom');
  function placeZoom(){ zb.style.top=((ZMAX-ZOOM)/(ZMAX-ZMIN)*100)+'%'; }
  function regleZoom(v){ ZOOM=Math.max(ZMIN,Math.min(ZMAX,v)); taille(); try{ cadrer(true); }catch(e){} placeZoom(); try{ localStorage.setItem('rembourg_zoom',ZOOM.toFixed(3)); }catch(e){} }
  let zid=null;
  function zmove(e){ const r=zr.getBoundingClientRect(); regleZoom(ZMAX-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))*(ZMAX-ZMIN)); }
  zz.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); if(e.target.tagName==='B'){ regleZoom(ZOOM+0.1*parseFloat(e.target.dataset.z)); return; } zid=e.pointerId; try{ zz.setPointerCapture(zid); }catch(_){} zmove(e); });
  zz.addEventListener('pointermove',e=>{ if(e.pointerId===zid) zmove(e); });
  ['pointerup','pointercancel'].forEach(n=>zz.addEventListener(n,e=>{ if(e.pointerId===zid) zid=null; }));
  addEventListener('wheel',e=>{ regleZoom(ZOOM*(e.deltaY>0?1/1.06:1.06)); },{passive:true});
  addEventListener('resize',placeZoom);
  placeZoom();
})();
