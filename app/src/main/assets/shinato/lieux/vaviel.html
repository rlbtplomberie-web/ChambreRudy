<script>
var IMG=window.RUDY_IMAGES, DECORS=window.RUDY_DECORS;
Object.keys(IMG).forEach(function(k){ IMG[k].forEach(function(s){ var i=new Image(); i.src=s; }); });

/* ---------- le décor : cinq panneaux bout à bout ---------- */
var monde=document.getElementById("monde"), vue=document.getElementById("vue");
var carte=document.getElementById("carte");
carte.src=DECORS;

// les cerisiers : un fond flou fixe, et le feuillage découpé qui oscille au vent
(function(){
 var ARBRES=window.RUDY_ARBRES;
 ARBRES.forEach(function(A,i){
  function place(el,src){
   el.src=src;
   el.style.left=A.x+"%"; el.style.top=A.y+"%";
   el.style.width=A.w+"%"; el.style.height=A.h+"%";
   monde.appendChild(el);
  }
  var fond=new Image(); fond.className="fondArbre"; place(fond,A.fond);
  var f=new Image(); f.className="feuillage"; place(f,A.feuillage);
  f.style.animation="vent"+(1+i%2)+" "+(4.2+(i%5)*0.9)+"s ease-in-out infinite";
  f.style.animationDelay=(-i*0.7)+"s";
 });

 // les banderoles et les toiles claquent au vent
 (window.RUDY_DRAPEAUX||[]).forEach(function(D,i){
  function place(el,src,cl){
   el.src=src; el.className=cl;
   el.style.left=D.x+"%"; el.style.top=D.y+"%";
   el.style.width=D.w+"%"; el.style.height=D.h+"%";
   monde.appendChild(el);
  }
  var fond=new Image(); place(fond,D.fond,"fondToile");
  var t=new Image(); place(t,D.toile,"toile");
  t.style.animation="flotte"+(1+i%2)+" "+(2.4+(i%4)*0.55)+"s ease-in-out infinite";
  t.style.animationDelay=(-i*0.45)+"s";
 });
})();
var SOL=0.712;      // il marche sur le chemin, devant l'hôpital, le stade et le karting
var TAILLE=0.30;    // hauteur du perso (plus petit à Vaviel)nnage par rapport à l'image
var RAPPORT=window.RUDY_RAPPORT;
var largeurMonde=0, hauteurScene=0, largeurVue=0;

function mesureMonde(){
 hauteurScene=vue.clientHeight; largeurVue=vue.clientWidth;
 largeurMonde=hauteurScene*RAPPORT;
 monde.style.width=Math.ceil(largeurMonde)+"px";
 var hp=hauteurScene*TAILLE*800/660;          // la toile fait 800 de haut pour 660 de personnage
 rudy.style.height=hp+"px";
 rudy.style.bottom=(hauteurScene*(1-SOL)-hp*30/800)+"px";
 ombre.style.width=(hauteurScene*TAILLE*0.55)+"px";
 ombre.style.height=(hauteurScene*TAILLE*0.10)+"px";
 ombre.style.bottom=(hauteurScene*(1-SOL)-hauteurScene*TAILLE*0.045)+"px";
}
window.addEventListener("resize",function(){ mesureMonde(); cadre(true); });

/* ---------- le personnage ---------- */
var rudy=document.getElementById("rudy"), ombre=document.getElementById("ombre");
var btnF=document.getElementById("btnFumer"), btnJ=document.getElementById("btnJeter");

var etat="repos", clope=false, sens=1;
var x=0;                       // position dans le monde, en pixels
var f=0, phase=0, dir=0, tPrec=0, parcours=0, cam=0;

var DUREE={fumer:300, jeter:190, repos:520, reposcig:600};
var VITESSE=1.25;              // hauteurs de personnage par seconde
var PAS=0.17;                  // avance au sol entre deux images de marche

function hautPerso(){ return hauteurScene*TAILLE; }
function planche(){
 if(etat==="fumer") return "fumer";
 if(etat==="jeter") return "jeter";
 if(etat==="marche") return clope?"marchecig":"marche";
 return "repos";
}
function images(){
 var p=planche();
 if(p==="repos") return clope ? IMG.fumer.slice(4) : [IMG.fumer[0]];
 return IMG[p];
}
function duree(){
 var p=planche();
 if(p==="repos") return clope?DUREE.reposcig:DUREE.repos;
 return DUREE[p];
}
function pose(src){
 if(rudy.getAttribute("src")!==src) rudy.src=src;
 rudy.style.left=x+"px";
 rudy.style.transform="translateX(-50%) scaleX("+sens+")";
 ombre.style.left=x+"px";
}
function cadre(direct){
 var moitie=largeurVue/2;
 var cible=Math.max(0,Math.min(largeurMonde-largeurVue, x-moitie));
 cam = direct ? cible : cam+(cible-cam)*0.16;     // la caméra suit en douceur
 monde.style.transform="translate3d("+(-cam)+"px,0,0)";
}

function boucle(t){
 requestAnimationFrame(boucle);
 if(!tPrec) tPrec=t;
 var dt=Math.min((t-tPrec)/1000,0.05);
 tPrec=t;
 var hp=hautPerso();

 var libre=(etat==="repos"||etat==="marche");
 if(libre){
  if(dir!==0){
   sens=dir;
   if(etat!=="marche"){ etat="marche"; parcours=0; }
   var avant=x;
   x=Math.max(hp*0.5, Math.min(largeurMonde-hp*0.5, x+dir*VITESSE*hp*dt));
   parcours+=Math.abs(x-avant);
  }else if(etat==="marche"){
   etat="repos"; phase=0; f=0;
  }
 }else if(etat==="jeter"){
  x=Math.max(hp*0.5, Math.min(largeurMonde-hp*0.5, x+sens*VITESSE*0.55*hp*dt));
 }

 var jeuImgs=images();
 if(etat==="marche"){
  pose(jeuImgs[Math.floor(parcours/(PAS*hp))%jeuImgs.length]);
  cadre(false);
  return;
 }
 phase+=dt*1000/duree();
 if(phase>=1){
  phase-=1; f++;
  if(f>=jeuImgs.length){
   if(etat==="fumer"){ clope=true; etat="repos"; f=0; majBoutons(); }
   else if(etat==="jeter"){ clope=false; etat="repos"; f=0; majBoutons(); }
   else f=0;
   jeuImgs=images();
  }
 }
 pose(jeuImgs[Math.min(f,jeuImgs.length-1)]);
 cadre(false);
}

/* ---------- joystick ---------- */
(function(){
 var joy=document.getElementById("joy"), stick=document.getElementById("stick");
 var actif=null, cx=0, cy=0, R=0;
 function prend(e){
  var t=e.changedTouches?e.changedTouches[0]:e;
  var r=joy.getBoundingClientRect();
  cx=r.left+r.width/2; cy=r.top+r.height/2; R=r.width/2;
  actif=e.changedTouches?t.identifier:"souris";
  bouge(e);
 }
 function bouge(e){
  if(actif===null) return;
  var t=e.changedTouches?[].slice.call(e.changedTouches).filter(function(u){return u.identifier===actif})[0]:e;
  if(!t) return;
  var dx=t.clientX-cx, dy=t.clientY-cy;
  var d=Math.min(Math.hypot(dx,dy),R*0.62), a=Math.atan2(dy,dx);
  stick.style.transform="translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px)";
  dir = (dx>R*0.18) ? 1 : (dx<-R*0.18) ? -1 : 0;
  e.preventDefault();
 }
 function lache(){ actif=null; dir=0; stick.style.transform="translate(0,0)"; }
 joy.addEventListener("touchstart",prend,{passive:false});
 joy.addEventListener("touchmove",bouge,{passive:false});
 joy.addEventListener("touchend",lache);
 joy.addEventListener("touchcancel",lache);
 joy.addEventListener("mousedown",function(e){prend(e);
  document.addEventListener("mousemove",bouge);
  document.addEventListener("mouseup",function h(){lache();document.removeEventListener("mousemove",bouge);document.removeEventListener("mouseup",h)});
 });
 document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight") dir=1;
  else if(e.key==="ArrowLeft") dir=-1;
  else if(e.key==="f"||e.key==="F") fumer();
  else if(e.key==="j"||e.key==="J") jeter();
 });
 document.addEventListener("keyup",function(e){
  if(e.key==="ArrowRight"||e.key==="ArrowLeft") dir=0;
 });
})();

(function(){var st=document.getElementById("stick");function r(){dir=0;if(st)st.style.transform="translate(0,0)"}
 document.addEventListener("touchend",function(e){if(!e.touches.length)r()},{capture:true});document.addEventListener("touchcancel",r,{capture:true});
 window.addEventListener("blur",r);document.addEventListener("visibilitychange",r)})();
/* ---------- zone du stick élargie : toute la partie gauche du bas de l'écran ---------- */
(function(){
 var joy=document.getElementById("joy"), stick=document.getElementById("stick"); if(!joy) return;
 var z=document.createElement("div"); z.id="zoneJoy";
 z.style.cssText="position:fixed;left:0;bottom:0;width:44vw;height:62vh;touch-action:none";
 joy.parentNode.insertBefore(z,joy);          // sous le rond du stick, au-dessus du décor
 var actif=null, ox=0, oy=0, R=0;
 function pos(e){ return [].slice.call(e.changedTouches).filter(function(t){return t.identifier===actif})[0]; }
 z.addEventListener("touchstart",function(e){
  var t=e.changedTouches[0]; actif=t.identifier; var r=joy.getBoundingClientRect(); R=r.width/2;
  ox=t.clientX; oy=t.clientY;                 // le centre du stick se met sous le doigt
  if(e.cancelable) e.preventDefault();
 },{passive:false});
 z.addEventListener("touchmove",function(e){
  var t=pos(e); if(!t) return; var dx=t.clientX-ox, dy=t.clientY-oy;
  var d=Math.min(Math.hypot(dx,dy),R*0.62), a=Math.atan2(dy,dx);
  stick.style.transform="translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px)";
  dir=(dx>R*0.18)?1:(dx<-R*0.18)?-1:0;
  if(e.cancelable) e.preventDefault();
 },{passive:false});
 function fin(e){ if(pos(e)){ actif=null; dir=0; stick.style.transform="translate(0,0)"; } }
 z.addEventListener("touchend",fin); z.addEventListener("touchcancel",fin);
})();

/* ---------- vent : pétales et poussière ---------- */
(function(){
 var scene=document.getElementById("vue");
 var grains=[];
 function cree(classe,type,n){
  for(var i=0;i<n;i++){
   var e=document.createElement("div");
   e.className=classe; scene.appendChild(e);
   var p={el:e,type:type}; relance(p); grains.push(p);
  }
 }
 function relance(p){
  var h=scene.clientHeight, w=scene.clientWidth;
  if(p.type==="petale"){
   p.x=-40+Math.random()*(w+80);
   p.y=h*(0.10+Math.random()*0.28);
   p.vx=-(h*0.05)-Math.random()*h*0.05;
   p.vy=h*0.025+Math.random()*h*0.03;
   p.taille=h*(0.008+Math.random()*0.007);
   p.duree=5+Math.random()*4;
  }else{
   p.x=w+Math.random()*w*0.4;
   p.y=h*(0.80+Math.random()*0.14);
   p.vx=-(h*0.28)-Math.random()*h*0.25;
   p.vy=-h*0.012*Math.random();
   p.taille=h*(0.003+Math.random()*0.004);
   p.duree=1.6+Math.random()*1.8;
  }
  p.vie=0;
  p.el.style.width=p.taille+"px";
  p.el.style.height=(p.type==="petale"?p.taille*0.72:p.taille)+"px";
 }
 // pas de pétales de cerisier à la plage
 cree("poussiere","poussiere",22);

 var hScene=scene.clientHeight; window.addEventListener("resize",function(){ hScene=scene.clientHeight; });
 var t0=0;
 function anime(t){
  requestAnimationFrame(anime);
  if(!t0) t0=t;
  var dt=Math.min((t-t0)/1000,0.05); t0=t;
  var h=hScene;
  for(var i=0;i<grains.length;i++){
   var p=grains[i];
   p.vie+=dt;
   if(p.vie>p.duree || p.x<-60 || p.y>h*1.03){ relance(p); continue; }
   p.x+=p.vx*dt;
   p.y+=p.vy*dt + (p.type==="petale" ? Math.sin(p.vie*3)*h*0.05*dt : 0);
   var o=Math.min(1,p.vie*2)*Math.max(0,1-p.vie/p.duree);
   p.el.style.transform="translate3d("+p.x+"px,"+p.y+"px,0) rotate("+(p.vie*(p.type==="petale"?160:50))+"deg)";
   p.el.style.opacity=o*(p.type==="petale"?0.9:0.5);
  }
 }
 requestAnimationFrame(anime);
})();

/* ---------- musique : c'est celle de la rue qui continue (la page de la rue joue en dessous) ---------- */

/* ---------- boutons ---------- */
function majBoutons(){
 btnF.classList.toggle("off", clope || etat==="fumer" || etat==="jeter");
 btnJ.classList.toggle("off", !clope || etat==="fumer" || etat==="jeter");

  pose(F,true); pose(G,avance<=0||G===fuyard); if(avance>0) pose(chasseur,false); }
 requestAnimationFrame(boucle);
})();
</script>

<script>
/* ---------- l'argent : en haut à droite, dans la chambre et dans toutes les rues ----------
   (il ne s'affiche pas dans les mini-jeux ni dans les émulateurs) */
(function(){
 if(window.__argentPose) return; window.__argentPose=true;
 var css=document.createElement("style");
 css.textContent="#argentHUD{position:fixed;top:max(6px,env(safe-area-inset-top,0px));right:8px;z-index:25;display:flex;align-items:center;gap:5px;"+
  "padding:3px 8px 3px 4px;border-radius:999px;background:rgba(10,10,14,.62);border:1px solid rgba(255,226,122,.55);"+
  "pointer-events:none;font:800 13px/1 Arial,Helvetica,sans-serif;color:#ffe27a;text-shadow:0 1px 2px #000}"+
  "#argentHUD img{width:22px;height:21px;display:block}";
 document.head.appendChild(css);
 var d=document.createElement("div"); d.id="argentHUD";
 d.innerHTML='<img alt="" src="/assets/shinato/m/f4b8c806f85db77a.webp"><span>0 €</span>';
 var txt=d.querySelector("span");
 function pose(){ if(document.body){ document.body.appendChild(d); } else setTimeout(pose,50); }
 pose();
 function lire(){
  try{ if(window.Chambre&&window.Chambre.argent) return parseInt(window.Chambre.argent(),10)||0; }catch(e){}
  try{ var v=localStorage.getItem("rudy_argent"); return v===null?1000:(parseInt(v,10)||0); }catch(e){}
  return 1000;
 }
 function maj(){ var n=lire(); txt.textContent=n.toLocaleString("fr-FR")+" €"; }
 maj(); setInterval(maj,1000);
 window.addEventListener("pageshow",maj);
 document.addEventListener("visibilitychange",function(){ if(!document.hidden) maj(); });

 function toast(txt){
  var t=document.getElementById("argentMsg");
  if(!t){ t=document.createElement("div"); t.id="argentMsg";
   t.style.cssText="position:fixed;top:44px;right:8px;z-index:26;padding:7px 12px;border-radius:12px;background:rgba(10,10,14,.9);"+
    "border:2px solid rgba(255,226,122,.8);color:#ffe27a;font:800 13px Arial,sans-serif;pointer-events:none;opacity:0;transition:opacity .25s";
   document.body.appendChild(t); }
  t.textContent=txt; t.style.opacity="1"; clearTimeout(t.__t); t.__t=setTimeout(function(){ t.style.opacity="0"; },1700);
 }

 /** La vie de Rudy (0 à 100). Elle ne se remplit plus toute seule : il faut l'infirmerie. */
 window.vieLire=function(){ try{ var v=localStorage.getItem("rudy_vie"); var n=v===null?100:parseInt(v,10); return Math.max(0,Math.min(100,isNaN(n)?100:n)); }catch(e){ return 100; } };
 window.vieEcrire=function(n){ try{ localStorage.setItem("rudy_vie",String(Math.max(0,Math.min(100,Math.round(n))))); }catch(e){} };
 window.argentLire=lire;
 window.argentMessage=toast;
 /** Payer un jeu : renvoie false et prévient s'il n'y a pas assez d'argent. */
 window.argentPayer=function(n,quoi){
  if(lire()<n){ toast("Pas assez d'argent ("+n+" €)"); return false; }
  window.argentAjouter(-n); toast("-"+n+" €"+(quoi?" · "+quoi:"")); return true;
 };
 /** Gagner ou perdre à la fin d'un jeu. */
 window.argentGain=function(n){ if(!n) return; window.argentAjouter(n); toast((n>0?"+":"")+n+" €"); };
 // pour plus tard : gagner ou dépenser depuis le jeu
 window.argentAjouter=function(n){
  try{ if(window.Chambre&&window.Chambre.ajouterArgent){ window.Chambre.ajouterArgent(n); maj(); return; } }catch(e){}
  try{ localStorage.setItem("rudy_argent",String(Math.max(0,lire()+n))); }catch(e){}
  maj();
 };
})();
