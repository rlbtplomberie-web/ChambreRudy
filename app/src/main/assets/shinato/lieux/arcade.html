<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garrett Parc · Salle d'arcade</title>
<style>
:root{--bg:#0b0618}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:pan-x}
#vue{position:fixed;inset:0;overflow-x:hidden;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex;align-items:center}
#vue::-webkit-scrollbar{display:none}
#cadre{position:relative;flex:0 0 auto;margin:0 auto}
#scene{position:absolute;left:0;top:0;width:2172px;height:724px;transform-origin:0 0;
  --bgimg:url(/assets/shinato/m/arcade_fond.webp);background:var(--bgimg) 0 0/2172px 724px no-repeat;user-select:none;-webkit-user-select:none}
.perso{position:absolute;pointer-events:none}
.perso img{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;-webkit-user-drag:none}
.perso img.on{opacity:1}
.miroir{transform:scaleX(-1)}
/* ---------- Néons du plafond ---------- */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.neon{position:absolute;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%}
.neon.lum{mix-blend-mode:screen;animation:pulse 3.2s ease-in-out infinite}
.neon.tour{mix-blend-mode:screen;opacity:1;
  -webkit-mask-image:conic-gradient(from var(--ang),transparent 0deg,#000 25deg,#000 45deg,transparent 75deg,transparent 180deg,#000 205deg,#000 225deg,transparent 255deg);
  mask-image:conic-gradient(from var(--ang),transparent 0deg,#000 25deg,#000 45deg,transparent 75deg,transparent 180deg,#000 205deg,#000 225deg,transparent 255deg);
  filter:brightness(1.6) saturate(1.3);animation:tourne 4s linear infinite}
.neon.eteint{filter:brightness(.25) saturate(.6);opacity:0}
.neon.eteint.clic{animation:clignote .9s steps(1) 1}
.neon.chenille{mix-blend-mode:screen;filter:brightness(1.5);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,transparent 12%,transparent 50%,#000 56%,transparent 62%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 6%,transparent 12%,transparent 50%,#000 56%,transparent 62%,transparent 100%);
  -webkit-mask-size:200% 100%;mask-size:200% 100%;animation:chenille 5s linear infinite}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.85}}
@keyframes tourne{to{--ang:360deg}}
@keyframes chenille{from{-webkit-mask-position:200% 0;mask-position:200% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes clignote{0%{opacity:.9}12%{opacity:0}22%{opacity:.85}30%{opacity:.2}45%{opacity:.9}60%{opacity:0}100%{opacity:0}}
/* ---------- Écrans des bornes ---------- */
.ecran{background-image:var(--bgimg);position:absolute;overflow:hidden;pointer-events:none;border-radius:3px;
  background-repeat:no-repeat;background-size:2172px 724px}
.ecran.jeu{animation:jeuFx 6s ease-in-out infinite}
.ecran.course{animation:courseFx 2.4s ease-in-out infinite}
.ecran.danse{animation:danseFx .5s ease-out infinite}
.ecran::before{content:"";position:absolute;inset:0;mix-blend-mode:screen;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px);animation:scan 1.2s linear infinite}
.ecran::after{content:"";position:absolute;left:0;right:0;height:35%;top:-40%;mix-blend-mode:screen;
  background:linear-gradient(180deg,transparent,rgba(180,240,255,.35),transparent);animation:balaye 3.5s linear infinite}
.ecran.flash{filter:brightness(1.9) saturate(1.4)!important}
.blip{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(circle,#fff 0,rgba(255,255,255,.9) 20%,var(--c,#ff4fd8) 45%,transparent 70%);transition:left .35s linear,top .35s linear}
.boum{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(circle,#fff 0,#ffe46b 30%,#ff5a2a 55%,transparent 72%);animation:boum .45s ease-out forwards}
@keyframes boum{from{transform:scale(.2);opacity:1}to{transform:scale(1.8);opacity:0}}
@keyframes jeuFx{0%,100%{filter:hue-rotate(0) brightness(1)}25%{filter:hue-rotate(35deg) brightness(1.15)}50%{filter:hue-rotate(-25deg) brightness(.95)}75%{filter:hue-rotate(15deg) brightness(1.2)}}
@keyframes courseFx{0%,100%{filter:brightness(1) hue-rotate(0)}50%{filter:brightness(1.18) hue-rotate(-12deg)}}
@keyframes danseFx{0%{filter:brightness(1.45) saturate(1.3)}100%{filter:brightness(1) saturate(1)}}
@keyframes scan{from{background-position:0 0}to{background-position:0 6px}}
@keyframes balaye{from{top:-40%}to{top:110%}}
.route{position:absolute;left:30%;right:30%;bottom:-10%;height:70%;transform:perspective(40px) rotateX(38deg);transform-origin:50% 100%;mix-blend-mode:screen}
.route i{position:absolute;top:0;bottom:0;width:6%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.85) 0 7px,transparent 7px 20px);animation:defile .35s linear infinite}
.route i:nth-child(1){left:20%}.route i:nth-child(2){left:47%}.route i:nth-child(3){left:74%}
@keyframes defile{from{background-position:0 0}to{background-position:0 20px}}
.vitesse{position:absolute;inset:0;mix-blend-mode:screen;opacity:.55;
  background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(140,220,255,.25) 14px 15px);animation:vit .25s linear infinite}
@keyframes vit{from{background-position:0 0}to{background-position:15px 0}}
.note{position:absolute;width:12%;height:5px;margin-left:-6%;border-radius:3px;mix-blend-mode:screen;
  background:linear-gradient(90deg,#4ff3ff,#fff,#ff5cf0);box-shadow:0 0 6px #6ff;animation:tombe 1.4s linear forwards}
@keyframes tombe{from{top:35%;transform:scaleX(.4);opacity:0}15%{opacity:1}to{top:100%;transform:scaleX(1.3);opacity:1}}
.rayons{position:absolute;inset:0;mix-blend-mode:screen;
  background:conic-gradient(from 0deg at 50% 30%,transparent 0 20deg,rgba(255,120,255,.25) 25deg,transparent 30deg 80deg,rgba(120,240,255,.25) 85deg,transparent 90deg 140deg,rgba(255,255,255,.2) 145deg,transparent 150deg 210deg,rgba(255,120,255,.25) 215deg,transparent 220deg 280deg,rgba(120,240,255,.25) 285deg,transparent 290deg);
  animation:rayons 6s linear infinite}
@keyframes rayons{to{transform:rotate(360deg)}}
.egal{position:absolute;display:flex;align-items:flex-end;gap:2px;padding:2px 3px;box-sizing:border-box;
  background:linear-gradient(180deg,#1b0d3e,#0e0726);border-radius:3px;pointer-events:none}
.egal b{flex:1;background:linear-gradient(0deg,#1ec8ff,#7ff7ff 70%,#fff);box-shadow:0 0 4px #3ef;border-radius:1px;height:30%;transition:height .12s}
.ecranSprite{position:absolute;left:13.7%;top:18.3%;width:30.8%;height:29%;pointer-events:none;
  background-size:100% 100%;clip-path:polygon(10% 12.6%,73.3% 20%,86.7% 88.4%,21.1% 88.4%);animation:jeuFx 5s ease-in-out infinite}
.ecranSprite::after{content:"";position:absolute;inset:0;mix-blend-mode:screen;
  background:linear-gradient(180deg,transparent,rgba(180,240,255,.4),transparent) 0 -200%/100% 40% no-repeat;animation:balaye2 3s linear infinite}
@keyframes balaye2{from{background-position:0 -60%}to{background-position:0 160%}}
.ecranSprite.flash{filter:brightness(1.9) saturate(1.4)!important}
#musique{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:50;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,140,255,.7);
  background:rgba(20,8,45,.75);color:#ffd6ff;font-size:22px;line-height:42px;text-align:center;cursor:pointer;
  box-shadow:0 0 12px rgba(255,80,230,.55);-webkit-tap-highlight-color:transparent;user-select:none}
#musique.off{opacity:.55;box-shadow:none}
#rudy{position:absolute;left:0;top:0;width:2172px;height:724px;pointer-events:none}
.chip{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;padding:7px 14px;border-radius:999px;background:rgba(20,8,45,.6);border:1px solid rgba(255,140,255,.45);font:700 14px system-ui,sans-serif;letter-spacing:.04em;color:#ffe6ff;text-shadow:0 0 8px #ff4fd8;pointer-events:none}
#joy{position:fixed;left:4.5vmin;bottom:5vmin;width:30vmin;height:30vmin;border-radius:50%;z-index:40;touch-action:none;
 background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.10),rgba(0,0,0,.34));border:2px solid rgba(255,226,122,.45);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#stick{position:absolute;left:50%;top:50%;width:13vmin;height:13vmin;margin:-6.5vmin 0 0 -6.5vmin;border-radius:50%;
 background:radial-gradient(circle at 42% 36%,#fbf0c6,#c9a33c 60%,#7d6118);box-shadow:0 4px 12px rgba(0,0,0,.6)}
#zoneJoy{position:fixed;left:0;bottom:0;width:44vw;height:62vh;z-index:39;touch-action:none}
#actions{position:fixed;right:4.5vmin;bottom:6vmin;display:flex;flex-direction:column;gap:2.6vmin;z-index:40}
.btn{min-width:26vmin;padding:2.4vmin 3vmin;border-radius:3vmin;text-align:center;font:900 clamp(13px,3.1vmin,26px)/1 Arial,sans-serif;letter-spacing:2px;color:#ffe27a;
 background:linear-gradient(rgba(12,12,14,.9),rgba(30,30,34,.9));border:2px solid rgba(255,226,122,.95);box-shadow:0 5px 16px rgba(0,0,0,.55);user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.94)} .btn.off{opacity:.32}
.ombre{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,0));pointer-events:none}
</style>
</head>
<body>
<div id="musique" title="Musique">♪</div>
<div class="chip">Salle d'arcade</div>
<div id="zoneJoy"></div><div id="joy"><div id="stick"></div></div>
<div id="actions"><div class="btn" id="btnSortir" style="display:none">SORTIR</div></div>
<div id="vue"><div id="cadre"><div id="scene">
  <div id="deco"></div>
  <div class="ombre" style="left:822px;top:600px;width:150px;height:26px"></div>
  <canvas id="rudy" width="2172" height="724"></canvas>
  <div class="perso miroir" id="mec3" style="left:1684.7px;top:295.5px;width:190px;height:213px;z-index:508"></div>
  <div class="perso miroir" id="mec1" style="left:1822.3px;top:258.5px;width:248px;height:279px;z-index:537"></div>
  <div class="perso" id="femme" style="left:754px;top:324.6px;width:296px;height:315px;z-index:640"></div>
  <div class="perso" id="mec2" style="left:1.4px;top:271.8px;width:239.4px;height:269px;z-index:541"></div>
</div></div></div>
<script>
const D={"g": [["/assets/shinato/m/arcade_joueur1_0.webp", "/assets/shinato/m/arcade_joueur1_1.webp", "/assets/shinato/m/arcade_joueur1_2.webp", "/assets/shinato/m/arcade_joueur1_3.webp"], ["/assets/shinato/m/arcade_joueur2_0.webp", "/assets/shinato/m/arcade_joueur2_1.webp", "/assets/shinato/m/arcade_joueur2_2.webp", "/assets/shinato/m/arcade_joueur2_3.webp"], ["/assets/shinato/m/arcade_joueur3_0.webp", "/assets/shinato/m/arcade_joueur3_1.webp", "/assets/shinato/m/arcade_joueur3_2.webp", "/assets/shinato/m/arcade_joueur3_3.webp"]], "f": ["/assets/shinato/m/arcade_femme_0.webp", "/assets/shinato/m/arcade_femme_1.webp", "/assets/shinato/m/arcade_femme_2.webp", "/assets/shinato/m/arcade_femme_3.webp", "/assets/shinato/m/arcade_femme_4.webp", "/assets/shinato/m/arcade_femme_5.webp", "/assets/shinato/m/arcade_femme_6.webp", "/assets/shinato/m/arcade_femme_7.webp"]};
function monte(id,srcs){
  const el=document.getElementById(id);
  const imgs=srcs.map((s,i)=>{const im=new Image();im.src=s;im.alt='';if(i===0)im.className='on';el.appendChild(im);return im;});
  let cur=0;
  return n=>{if(n===cur)return;imgs[cur].className='';imgs[n].className='on';cur=n;};
}
// Les trois joueurs : 0 = attend, 1 = tape les boutons, 2 = se penche, 3 = content
function joueur(id,srcs,decal){
  const show=monte(id,srcs);
  function boucle(){
    const r=Math.random();
    if(r<0.07){ // victoire de temps en temps
      show(3); setTimeout(()=>{show(0);setTimeout(boucle,500)},1300+Math.random()*700); return;
    }
    const seq=r<0.55?[1,0,1,0,1,2]:r<0.85?[2,1,2,1,0]:[0,0,1];
    let i=0;
    (function pas(){
      if(i>=seq.length){setTimeout(boucle,150+Math.random()*400);return;}
      show(seq[i++]); setTimeout(pas,170+Math.random()*230);
    })();
  }
  setTimeout(boucle,decal);
}
joueur('mec1',D.g[0],0);
joueur('mec2',D.g[1],600);
joueur('mec3',D.g[2],1100);
// La femme : elle range le carton accroupie, puis se lève de temps en temps
(function(){
  const show=monte('femme',D.f);
  const range=[[0,700],[1,650],[2,700],[3,650],[1,600],[0,700]];
  const debout=[[4,500],[5,450],[4,450],[5,450],[6,1200],[7,1400]];
  let tour=0;
  function joue(seq,fin){let i=0;(function p(){if(i>=seq.length){fin();return;}const[f,t]=seq[i++];show(f);setTimeout(p,t+Math.random()*150);})();}
  function boucle(){
    tour++;
    if(tour%3===0) joue(debout,boucle); else joue(range,boucle);
  }
  setTimeout(boucle,300);
})();

// ================= Néons du plafond =================
(function(){
  const N={"rose": "/assets/shinato/m/arcade_neon_rose.webp", "bleu": "/assets/shinato/m/arcade_neon_bleu.webp", "violet": "/assets/shinato/m/arcade_neon_violet.webp", "bande": "/assets/shinato/m/arcade_neon_bande.webp"}, deco=document.getElementById('deco');
  function couche(src,x,y,w,h,cls,extra){const d=document.createElement('div');d.className='neon '+cls;
    d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-image:url(${src});`+(extra||'');deco.appendChild(d);return d;}
  couche(N.bande,0,0,2172,240,'lum','animation-duration:4.5s');
  couche(N.bande,0,0,2172,240,'chenille');
  const anneaux=[['rose',375,70,842,170,'0s','3.8s'],['bleu',896,112,1276,187,'-1.2s','3.2s'],['violet',1444,70,1906,170,'-2.4s','4.4s']];
  const eteints=[];
  anneaux.forEach(([k,x0,y0,x1,y1,dec,dur],i)=>{
    couche(N[k],x0,y0,x1-x0,y1-y0,'lum',`animation-delay:${dec};animation-duration:${dur}`);
    couche(N[k],x0,y0,x1-x0,y1-y0,'tour',`animation-duration:${3+i}s;animation-direction:${i%2?'reverse':'normal'}`);
    eteints.push(couche(N[k],x0,y0,x1-x0,y1-y0,'eteint'));
  });
  // de temps en temps un anneau grésille
  (function gresille(){
    const e=eteints[Math.floor(Math.random()*eteints.length)];
    e.classList.remove('clic');void e.offsetWidth;e.classList.add('clic');
    setTimeout(gresille,5000+Math.random()*7000);
  })();
})();
// ================= Écrans des bornes =================
(function(){
  const deco=document.getElementById('deco');
  const coul=['#ff4fd8','#4ff3ff','#ffe14f','#7dff6a','#ff7a3d','#b36bff'];
  function ecran(type,x,y,w,h){
    const d=document.createElement('div');d.className='ecran '+type;
    d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-position:${-x}px ${-y}px;animation-delay:${-Math.random()*5}s`;
    deco.appendChild(d);return d;
  }
  function flash(el){(function f(){setTimeout(()=>{el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),90+Math.random()*80);f();},1500+Math.random()*4000);})();}
  // bornes de jeu de combat / tir
  [[157,342,48,56],[244,347,54,53],[329,352,44,48],[401,357,40,42],[1904,342,52,56],[2110,338,58,60]].forEach(([x,y,w,h])=>{
    const e=ecran('jeu',x,y,w,h); flash(e);
    for(let i=0;i<2;i++){const b=document.createElement('span');b.className='blip';b.style.setProperty('--c',coul[Math.floor(Math.random()*coul.length)]);e.appendChild(b);
      (function bouge(){b.style.left=(10+Math.random()*80)+'%';b.style.top=(15+Math.random()*75)+'%';
        if(Math.random()<.25){const k=document.createElement('span');k.className='boum';k.style.left=b.style.left;k.style.top=b.style.top;e.appendChild(k);setTimeout(()=>k.remove(),500);}
        setTimeout(bouge,300+Math.random()*350);})();}
  });
  // bornes de course : la route défile
  [[543,337,112,44],[707,337,112,44]].forEach(([x,y,w,h])=>{
    const e=ecran('course',x,y,w,h);
    e.insertAdjacentHTML('beforeend','<div class="vitesse"></div><div class="route"><i></i><i></i><i></i></div>');
  });
  // bornes de danse : rayons, battement et notes qui tombent
  [[1395,315,108,85],[1577,315,104,85]].forEach(([x,y,w,h],j)=>{
    const e=ecran('danse',x,y,w,h);e.insertAdjacentHTML('beforeend','<div class="rayons"></div>');
    (function note(){const n=document.createElement('span');n.className='note';n.style.left=[24,41,59,76][Math.floor(Math.random()*4)]+'%';
      e.appendChild(n);setTimeout(()=>n.remove(),1500);setTimeout(note,180+Math.random()*320);})();
  });
  // égaliseurs au-dessus des bornes de danse
  [[1398,272,102,27],[1579,272,100,27]].forEach(([x,y,w,h])=>{
    const g=document.createElement('div');g.className='egal';g.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    const barres=[];for(let i=0;i<14;i++){const b=document.createElement('b');g.appendChild(b);barres.push(b);}
    deco.appendChild(g);
    setInterval(()=>barres.forEach((b,i)=>{const base=.35+.4*Math.sin(Date.now()/260+i*.7);b.style.height=Math.max(12,Math.min(100,(base+Math.random()*.35)*100))+'%';}),130);
  });
  // écrans des bornes où jouent les trois mecs
  ['mec1','mec2','mec3'].forEach(id=>{
    const p=document.getElementById(id);const e=document.createElement('div');e.className='ecranSprite';
    e.style.backgroundImage='url('+"/assets/shinato/m/arcade_ecran.webp"+')';e.style.animationDelay=(-Math.random()*4)+'s';p.appendChild(e);flash(e);
  });
})();

// ================= Musique douce style aventure (composition originale) =================
(function(){
  const bouton=document.getElementById('musique');
  let ctx=null,maitre=null,coupe=false,prochain=0,pas=0,minuteur=null;
  const TEMPO=88, NOIRE=60/TEMPO;
  const f=m=>440*Math.pow(2,(m-69)/12);
  // accords : basse + notes
  const AC={C:[48,60,64,67,72],DC:[48,62,66,69,74],Em:[40,59,64,67,71],Am:[45,57,60,64,69],F:[41,57,60,65,69],G:[43,59,62,67,71],Dm:[38,57,60,62,65]};
  const grille=['C','DC','Em','Am','F','G','Am','G','F','G','Em','Am','Dm','G','C','G'];
  const R=null;
  const melodie=[
    [[76,1],[79,.5],[81,.5],[79,1],[76,1]],[[78,1.5],[76,.5],[74,2]],[[79,1],[71,.5],[74,.5],[76,2]],[[72,1],[76,1],[69,2]],
    [[69,.5],[72,.5],[77,1],[76,.5],[77,.5],[81,1]],[[79,1.5],[77,.5],[74,2]],[[76,1],[72,.5],[74,.5],[76,1],[81,1]],[[79,3],[R,1]],
    [[84,1.5],[81,.5],[77,1],[81,1]],[[83,1.5],[79,.5],[74,2]],[[76,.5],[79,.5],[83,1],[81,.5],[79,.5],[76,1]],[[81,3],[R,1]],
    [[77,1],[76,.5],[74,.5],[72,1],[74,1]],[[71,1],[74,1],[79,2]],[[76,1],[74,.5],[72,.5],[79,1],[76,1]],[[74,2],[R,2]]
  ];
  const motif=[0,1,2,3,4,3,2,1];
  function reverb(){
    const len=ctx.sampleRate*2.6,b=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
    const cv=ctx.createConvolver();cv.buffer=b;return cv;
  }
  let sortie,rev;
  function init(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    maitre=ctx.createGain();maitre.gain.value=coupe?0:.55;maitre.connect(ctx.destination);
    const filtre=ctx.createBiquadFilter();filtre.type='lowpass';filtre.frequency.value=5200;filtre.connect(maitre);
    sortie=ctx.createGain();sortie.connect(filtre);
    rev=reverb();const rg=ctx.createGain();rg.gain.value=.32;sortie.connect(rev);rev.connect(rg);rg.connect(filtre);
  }
  function note(type,freq,t,dur,vol,att,rel,vib){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
    if(vib){const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=5.2;lg.gain.setValueAtTime(0,t);

  document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(!coupe)ctx.resume();});
})();
