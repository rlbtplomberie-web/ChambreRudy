<title>RUDY STYLE &middot; LA PLAGE DE GISÈLE</title>
<style>
:root{--night:#120d33;--ink:#f3eefc;--glass:rgba(22,16,58,.55);--edge:rgba(210,195,255,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--night:#120d33}}
:root[data-theme="dark"]{--night:#120d33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);font-family:"Nunito",system-ui,sans-serif;color:var(--ink)}
#view{position:fixed;inset:0;overflow:hidden}
#scene{position:absolute;left:0;top:0;width:1983px;height:793px;transform-origin:0 0;background:#120d33 center/100% 100% no-repeat}
.shimmer{position:absolute;left:1150px;top:300px;width:130px;height:120px;pointer-events:none;
 background:radial-gradient(ellipse at 50% 30%,rgba(255,250,230,.55),rgba(255,250,230,0) 70%);mix-blend-mode:screen;filter:blur(6px);animation:shim 3.8s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:.25;transform:scaleX(.8)}50%{opacity:.7;transform:scaleX(1.1)}}
.lamp{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,rgba(255,200,110,.9),rgba(255,170,60,0) 70%);mix-blend-mode:screen;animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.55}40%{opacity:.9}70%{opacity:.7}}
#girl{position:absolute;left:430px;top:668px;width:0;height:0;z-index:4}
#rc{position:absolute;left:0;top:0;width:1983px;height:793px;z-index:3;pointer-events:none}
#shadow{position:absolute;left:-120px;top:-22px;width:240px;height:40px;border-radius:50%;
 background:radial-gradient(ellipse,rgba(20,10,50,.55),rgba(20,10,50,0) 70%);transition:width .9s,left .9s}
.pose{position:absolute;bottom:0;left:0;opacity:0;transform:translate(-50%,14px) scale(.96);transform-origin:50% 100%;
 transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.pose.on{opacity:1;transform:translate(-50%,0) scale(1)}
.pose.off{opacity:0;transform:translate(-50%,6px) scale(.98)}
.pose.on.miroir{transform:translate(-50%,0) scale(-1,1)}
.pose.off.miroir{transform:translate(-50%,6px) scale(-.98,.98)}
.pose img{display:block;transform-origin:50% 100%;filter:brightness(.82) saturate(.92)}
.sol img{animation:breath 3.6s ease-in-out infinite}
.debout img{animation:sway 5s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.03)}}
@keyframes sway{0%,100%{transform:rotate(-.9deg) scaleY(1)}50%{transform:rotate(.9deg) scaleY(1.015)}}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(220,210,255,.8);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.foam{position:absolute;left:0;width:1983px;height:14px;top:396px;pointer-events:none;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 40px,rgba(230,240,255,.45) 40px 90px,rgba(255,255,255,0) 90px 160px);
 filter:blur(3px);mix-blend-mode:screen;animation:foam 6s ease-in-out infinite}
@keyframes foam{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(-30px,-10px);opacity:.75}}
#tint{position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(180deg,rgba(40,20,120,0) 40%,rgba(40,20,120,.12));mix-blend-mode:multiply}
#info{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center}
#info button{width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:600 16px/1 inherit;cursor:pointer;backdrop-filter:blur(6px)}
#info button:focus-visible{outline:2px solid #ffd95a;outline-offset:2px}
#status{padding:7px 12px;border-radius:17px;background:var(--glass);border:1px solid var(--edge);font-size:14px;backdrop-filter:blur(6px);display:none}
#info.open #status{display:block}


#titre{position:fixed;top:calc(2vmin + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;text-align:center;pointer-events:none;
 color:#fff;font:900 clamp(14px,3vmin,26px)/1.15 Arial,sans-serif;letter-spacing:3px;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.9);white-space:nowrap}
#titre small{display:block;margin-top:.5vmin;color:#ffe27a;letter-spacing:4px;font:800 clamp(8px,1.6vmin,13px)/1 Arial,sans-serif}
#joy{position:fixed;left:4.5vmin;bottom:calc(5vmin + env(safe-area-inset-bottom,0px));width:30vmin;height:30vmin;border-radius:50%;z-index:20;touch-action:none;
 background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.10),rgba(0,0,0,.34));border:2px solid rgba(255,226,122,.45);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#stick{position:absolute;left:50%;top:50%;width:13vmin;height:13vmin;margin:-6.5vmin 0 0 -6.5vmin;border-radius:50%;
 background:radial-gradient(circle at 42% 36%,#fbf0c6,#c9a33c 60%,#7d6118);box-shadow:0 4px 12px rgba(0,0,0,.6)}
#actions{position:fixed;right:4.5vmin;bottom:calc(6vmin + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2.6vmin;z-index:20}
.btn{min-width:28vmin;padding:3vmin 3.4vmin;border-radius:3vmin;text-align:center;display:none;touch-action:none;user-select:none;-webkit-user-select:none;
 font:900 clamp(13px,3.1vmin,26px)/1 Arial,sans-serif;letter-spacing:2px;color:#ffe27a;
 background:linear-gradient(rgba(12,12,14,.9),rgba(30,30,34,.9));border:2px solid rgba(255,226,122,.7);
 box-shadow:0 5px 16px rgba(0,0,0,.55),0 0 14px rgba(255,214,60,.35)}
.btn:active{transform:scale(.94)}
.choix{border-color:rgba(255,226,122,.95);box-shadow:0 5px 16px rgba(0,0,0,.55),0 0 16px rgba(255,214,60,.55)}
#btnParler{border-color:rgba(255,226,122,.95);box-shadow:0 5px 16px rgba(0,0,0,.55),0 0 16px rgba(255,214,60,.55)}
#bulle{position:fixed;left:0;top:0;z-index:18;display:none;max-width:min(74vw,62vmin);padding:2.2vmin 3.2vmin;border-radius:3.4vmin;
 background:#fffdf4;border:.55vmin solid #1b1330;box-shadow:.8vmin .9vmin 0 rgba(10,6,30,.55);pointer-events:none;
 transform:translate(-50%,-100%) scale(.6);opacity:0;transition:transform .22s cubic-bezier(.3,1.5,.5,1),opacity .15s}
#bulle.on{transform:translate(-50%,-100%) scale(1);opacity:1}
#bulle p{margin:0;color:#1b1330;text-align:center;font:800 clamp(14px,3.6vmin,26px)/1.25 "Comic Sans MS","Comic Neue","Chalkboard SE","Trebuchet MS",Arial,sans-serif}
#queue{position:absolute;bottom:-2.6vmin;width:0;height:0;border-left:1.6vmin solid transparent;border-right:1.6vmin solid transparent;border-top:2.8vmin solid #1b1330;margin-left:-1.6vmin}
#queue::after{content:"";position:absolute;left:-1.05vmin;top:-3.35vmin;border-left:1.05vmin solid transparent;border-right:1.05vmin solid transparent;border-top:2vmin solid #fffdf4}
#jeu{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:100;background:#000;display:none}
body.dialogue #joy{opacity:.3}
*{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}html,body{touch-action:none;overscroll-behavior:none}
</style>

<script>
const A={"bg": "/assets/shinato/m/42162ef09bdd637d.webp", "sit": [{"src": "/assets/shinato/m/e5a6c7dfc9753d52.webp", "w": 373, "h": 216}, {"src": "/assets/shinato/m/5710468cf1e3c9d8.webp", "w": 207, "h": 158}, {"src": "/assets/shinato/m/a25a3acd36120a37.webp", "w": 318, "h": 265}, {"src": "/assets/shinato/m/1516266c074d08b1.webp", "w": 299, "h": 293}, {"src": "/assets/shinato/m/8a919aa1bb8d6e1c.webp", "w": 264, "h": 309}, {"src": "/assets/shinato/m/3bc007eb137f1944.webp", "w": 197, "h": 278}, {"src": "/assets/shinato/m/1971891eea5d0333.webp", "w": 360, "h": 163}, {"src": "/assets/shinato/m/35ff1bc308fbebc0.webp", "w": 223, "h": 204}, {"src": "/assets/shinato/m/3bed9ed3ea586da0.webp", "w": 224, "h": 307}, {"src": "/assets/shinato/m/59c11a66dcaf7a6e.webp", "w": 176, "h": 278}], "std": [{"src": "/assets/shinato/m/cc89a9866a5ed880.webp", "w": 211, "h": 577}, {"src": "/assets/shinato/m/6d2e2a8185137ab7.webp", "w": 198, "h": 556}, {"src": "/assets/shinato/m/4f94a58bd99003a3.webp", "w": 213, "h": 562}, {"src": "/assets/shinato/m/b7cf93fe428eee80.webp", "w": 205, "h": 559}, {"src": "/assets/shinato/m/7dfa0f4810de2cd8.webp", "w": 203, "h": 569}, {"src": "/assets/shinato/m/1927779e3f3a6fed.webp", "w": 213, "h": 567}, {"src": "/assets/shinato/m/fff7594e04c2c8cf.webp", "w": 208, "h": 561}, {"src": "/assets/shinato/m/de3895cf4726cf98.webp", "w": 186, "h": 548}, {"src": "/assets/shinato/m/51125def9ce42621.webp", "w": 221, "h": 564}, {"src": "/assets/shinato/m/5978a33cd165ffc9.webp", "w": 207, "h": 558}]};
const SCALE=0.5, FOOT={x:430,y:668};
const scene=document.getElementById('scene'), girl=document.getElementById('girl'), shadow=document.getElementById('shadow');


// Animation de l'eau et du vent (WebGL) : chaque pixel est légèrement déplacé selon une carte de mouvement
const FLOW="/assets/shinato/m/9617002fcc5e99f5.png";
(function(){
  const cv=document.getElementById('gl');
  const g=cv.getContext('webgl',{alpha:false,antialias:false});
  if(!g){cv.remove();scene.style.backgroundImage=`url(${A.bg})`;return;}
  const vs=`attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
  const fs=`precision highp float;varying vec2 uv;uniform sampler2D img,flow;uniform float t;uniform vec2 res;
  void main(){
    vec2 p=uv*res; vec3 f=texture2D(flow,uv).rgb; vec2 d=vec2(0.);
    // vent : rafales lentes + frémissement des feuilles
    float gust=.55*sin(t*.55)+.3*sin(t*1.6+1.3)+.25*sin(t*.19+2.);
    float flut=.35*sin(t*3.1+p.y*.045+p.x*.02)+.15*sin(t*5.3+p.x*.07);
    d.x+=f.r*(gust+flut)*7.;
    d.y+=f.r*sin(t*2.3+p.x*.03)*2.;
    // eau : ondulations plus fortes près du rivage
    float dp=clamp((p.y-300.)/120.,0.,1.); float a=mix(.5,3.2,dp);
    d.x+=f.g*a*(sin(p.y*.35-t*1.6)+.5*sin(p.y*.9+t*2.3+p.x*.012));
    d.y+=f.g*a*.6*sin(p.x*.02+t*1.2+p.y*.2);
    // vagues qui montent et redescendent sur le sable
    d.y+=f.b*6.*sin(t*.75);
    vec3 c=texture2D(img,(p-d)/res).rgb;
    float l=dot(c,vec3(.3,.59,.11));
    float sp=f.g*pow(max(0.,sin(p.x*.11+t*2.)*sin(p.y*.6-t*1.5)),8.)*smoothstep(.3,.75,l);
    c+=sp*.4+f.b*max(0.,sin(t*.75))*.05;
    gl_FragColor=vec4(c,1.);
  }`;
  function sh(ty,src){const s=g.createShader(ty);g.shaderSource(s,src);g.compileShader(s);return s;}
  const pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,vs));g.attachShader(pr,sh(g.FRAGMENT_SHADER,fs));g.linkProgram(pr);
  if(!g.getProgramParameter(pr,g.LINK_STATUS)){cv.remove();scene.style.backgroundImage=`url(${A.bg})`;return;}
  g.useProgram(pr);
  const b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
  const loc=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(loc);g.vertexAttribPointer(loc,2,g.FLOAT,false,0,0);
  function tex(unit,im){const tx=g.createTexture();g.activeTexture(g.TEXTURE0+unit);g.bindTexture(g.TEXTURE_2D,tx);
    [g.TEXTURE_WRAP_S,g.TEXTURE_WRAP_T].forEach(k=>g.texParameteri(g.TEXTURE_2D,k,g.CLAMP_TO_EDGE));
    [g.TEXTURE_MIN_FILTER,g.TEXTURE_MAG_FILTER].forEach(k=>g.texParameteri(g.TEXTURE_2D,k,g.LINEAR));
    g.texImage2D(g.TEXTURE_2D,0,g.RGB,g.RGB,g.UNSIGNED_BYTE,im);}
  const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s;});
  Promise.all([load(A.bg),load(FLOW)]).then(([bi,fi])=>{
    tex(0,bi);tex(1,fi);
    g.uniform1i(g.getUniformLocation(pr,'img'),0);g.uniform1i(g.getUniformLocation(pr,'flow'),1);
    g.uniform2f(g.getUniformLocation(pr,'res'),1983,793);
    const ut=g.getUniformLocation(pr,'t');
    (function frame(ms){requestAnimationFrame(frame);if(window.PAUSE_JEU)return;g.uniform1f(ut,ms/1000);g.drawArrays(g.TRIANGLE_STRIP,0,4);})(0);
  });
})();

// Lueurs des lampadaires du ponton
[[78,258],[117,268],[180,268],[238,268],[292,264],[329,262],[372,264],[432,266],[490,266],[1709,150]].forEach(([x,y],i)=>{
  const d=document.createElement('div');d.className='lamp';d.style.left=x+'px';d.style.top=y+'px';d.style.animationDelay=(i*0.37)+'s';
  document.getElementById('lamps').appendChild(d);
});

[[300,40],[520,120],[700,30],[905,90],[1060,160],[1330,40],[1480,110],[1620,30],[1850,90],[1150,70]].forEach(([x,y],i)=>{
  const s=document.createElement('div');s.className='star';s.style.left=x+'px';s.style.top=y+'px';s.style.animationDelay=(i*0.6)+'s';
  document.getElementById('stars').appendChild(s);});
// Création des sprites
function build(list,kind){return list.map((p,i)=>{const d=document.createElement('div');d.className='pose '+kind;
  const im=new Image();im.src=p.src;im.alt='';im.style.width=(p.w*SCALE)+'px';im.style.height=(p.h*SCALE)+'px';
  d.appendChild(im);girl.appendChild(d);return {el:d,w:p.w*SCALE,kind,i};});}
const GROUND=build(A.sit,'sol'), STAND=build(A.std,'debout');

// Cadrage "cover" en gardant Gisèle visible
// caméra : l'image couvre l'écran et suit Rudy de gauche à droite
window.CAM={x:990,y:700,tx:null};
function fit(direct){const vw=innerWidth,vh=innerHeight,k=Math.max(vw/1983,vh/793),W=1983*k,H=793*k;
  const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
  const cx=cl(vw/2-CAM.x*k,vw-W,0), ty=cl(vh*0.62-CAM.y*k,vh-H,0);
  CAM.tx=(direct||CAM.tx===null)?cx:CAM.tx+(cx-CAM.tx)*0.12; CAM.k=k; CAM.ty=ty;
  scene.style.transform=`translate(${CAM.tx}px,${ty}px) scale(${k})`;}
addEventListener('resize',()=>fit(true));fit(true);

// Tirage aléatoire sans répétition : toutes les poses finissent par passer
const bags={sol:[],debout:[]};
function draw(kind,avoid){const src=kind==='sol'?GROUND:STAND;let b=bags[kind];
  if(!b.length){b=bags[kind]=src.slice().sort(()=>Math.random()-.5);if(b[b.length-1]===avoid&&b.length>1)b.unshift(b.pop());}
  return b.pop();}
const rnd=(a,b)=>a+Math.random()*(b-a);

let cur=null, phase=null, phaseEnd=0, nextSwap=0;
function show(p){if(cur){const o=cur.el;o.classList.remove('on');o.classList.add('off');setTimeout(()=>o.classList.remove('off'),900);}p.el.classList.add('on');cur=p;
  const sw=p.kind==='sol'?p.w*0.95:p.w*1.1;shadow.style.width=sw+'px';shadow.style.left=(-sw/2)+'px';}
function startPhase(kind){const now=performance.now();phase=kind;
  // Au sol : au moins 1 minute (60 à 110 s). Debout : 30 s maximum (10 à 30 s).
  phaseEnd=now+(kind==='sol'?rnd(60,110):rnd(10,30))*1000;
  show(draw(kind,cur));nextSwap=now+(kind==='sol'?rnd(6,11):rnd(3,5.5))*1000;}
function tick(){if(window.GISELE_PARLE||window.PAUSE_JEU)return;const now=performance.now();
  if(now>=phaseEnd){startPhase(phase==='sol'?'debout':'sol');}
  else if(now>=nextSwap&&phaseEnd-now>2500){show(draw(phase,cur));nextSwap=now+(phase==='sol'?rnd(6,11):rnd(3,5.5))*1000;}
}
startPhase('sol');setInterval(tick,250);
// quand Rudy lui parle : elle se lève et le regarde (miroir si Rudy est à sa gauche)
window.GISELE={
 regarde(i,miroir){window.GISELE_PARLE=true;const p=STAND[i];STAND.forEach(q=>{if(q!==p)q.el.classList.remove('miroir')});
  if(cur===p){p.el.classList.toggle('miroir',!!miroir);return}p.el.classList.toggle('miroir',!!miroir);show(p);},
 reprend(){window.GISELE_PARLE=false;startPhase('debout');setTimeout(()=>STAND.forEach(q=>{if(q!==cur)q.el.classList.remove('miroir')}),950);}
};

</script>
<script>

const RB={"droite": {"img": ["/assets/shinato/m/ef1f0b8c2cc9473b.webp", "/assets/shinato/m/8f16b04582ccd18f.webp", "/assets/shinato/m/b76af52210dcf554.webp", "/assets/shinato/m/335b72042ef27bbc.webp", "/assets/shinato/m/50c8697489c2c907.webp", "/assets/shinato/m/cbd0a1ad22fab3ba.webp", "/assets/shinato/m/680d616f4c29d575.webp", "/assets/shinato/m/3316119779970e96.webp", "/assets/shinato/m/47efa18c2f9698a9.webp"], "w": 134, "h": 206, "ax": 63.612575574365174, "ay": 203.0}, "gauche": {"img": ["/assets/shinato/m/6f1bf8da705a8911.webp", "/assets/shinato/m/f02a3a5feed4f7c4.webp", "/assets/shinato/m/ede9f664436f25f2.webp", "/assets/shinato/m/51aa1ca8a5dd4922.webp", "/assets/shinato/m/9600fe3909581e0b.webp", "/assets/shinato/m/037ddbda857ff35b.webp", "/assets/shinato/m/946210da6e0395a1.webp", "/assets/shinato/m/ba4398dc080de701.webp", "/assets/shinato/m/70e4515f71136159.webp"], "w": 130, "h": 197, "ax": 63.97493036211699, "ay": 195.0}, "haut": {"img": ["/assets/shinato/m/8a8dcc61508e73cc.webp", "/assets/shinato/m/0625bc5499c17775.webp", "/assets/shinato/m/d130e78bd96cbf58.webp", "/assets/shinato/m/85e77196dae0a364.webp", "/assets/shinato/m/f112a083b3eac8ab.webp", "/assets/shinato/m/fe5eff60eeb2ac4d.webp", "/assets/shinato/m/6be13897791b903d.webp", "/assets/shinato/m/dd80719f53df96e6.webp", "/assets/shinato/m/38e6d2bce0ca6363.webp"], "w": 89, "h": 218, "ax": 44.04040242733951, "ay": 215.0}, "bas": {"img": ["/assets/shinato/m/d67456269af20e2b.webp", "/assets/shinato/m/d227cf6f358b0526.webp", "/assets/shinato/m/0f7f9a1e518986f4.webp", "/assets/shinato/m/0a266f69d86aa01d.webp", "/assets/shinato/m/d513893fbe84847c.webp", "/assets/shinato/m/6f705304ece6820d.webp", "/assets/shinato/m/ff9a36731da1dafd.webp", "/assets/shinato/m/4d7a4f90f39f828c.webp", "/assets/shinato/m/3e7f67122e98fbfb.webp"], "w": 100, "h": 241, "ax": 50.24630667345899, "ay": 238.0}};
for(const k in RB) RB[k].fr=RB[k].img.map(s=>{const i=new Image();i.src=s;return i});
const rc=document.getElementById('rc'), rx=rc.getContext('2d'); rx.setTransform(2,0,0,2,0,0);
const GIS={x:430,y:668};                        // Gisèle, sur le sable à gauche
const SORTIE={x:1850};                          // on repart par le bout droit de la plage (vers les deux petits garçons)
const RUDY={x:990,y:735,dir:'haut',pas:0,bouge:false};
let joyX=0,joyY=0;
function taille(y){return (y-300)*0.82}         // plus grand quand il s'approche (en bas)
// le sable où il peut marcher : pas dans l'eau, pas dans les plantes des coins, pas sur Gisèle
function libre(x,y){
 if(y<455||y>778||x<40||x>1943) return false;
 if(x<330&&y>520) return false;
 if(x>1690&&y>575) return false;
 const dx=(x-GIS.x)/80, dy=(y-GIS.y)/22; if(dx*dx+dy*dy<1) return false;
 return true;
}
function dessine(set,i,x,y,phase){
 const R=RB[set], im=R.fr[i%R.fr.length]; if(!im.complete) return;
 const h=taille(y), k=h/R.h;
 rx.save();
 rx.fillStyle='rgba(15,8,45,.42)';rx.beginPath();rx.ellipse(x,y,h*0.17,h*0.035,0,0,7);rx.fill();
 rx.filter='brightness(.8) saturate(.9)';
 const X=x-R.ax*k, Y=y-R.ay*k;
 if((set==='droite'||set==='gauche')&&phase!=null){
  // comme au bar : les jambes de profil se referment puis s'écartent à chaque enjambée
  const ouv=0.30+0.70*Math.abs(Math.cos(phase*Math.PI));
  const bob=-Math.abs(Math.sin(phase*Math.PI))*h*0.018;
  const hanche=Math.round(R.h*0.50), N=14, bas=R.h-hanche;
  rx.drawImage(im,0,0,R.w,hanche,X,Y+bob,R.w*k,hanche*k);
  for(let n=0;n<N;n++){
   const s0=hanche+bas*n/N, s1=hanche+bas*(n+1)/N, f=(n+0.5)/N, sx=1-(1-ouv)*f;
   rx.drawImage(im,0,s0,R.w,s1-s0+0.6,X+R.ax*k-R.ax*k*sx,Y+s0*k+bob*(1-f),R.w*k*sx,(s1-s0)*k+0.6);
  }
 }else rx.drawImage(im,X,Y,R.w*k,R.h*k);
 rx.restore();
}
function procheSortie(){return RUDY.x>=SORTIE.x}
function fleche(now){
 if(!procheSortie()) return;
 // flèche jaune brillante vers la droite, au-dessus de sa tête (elle se balance vers la sortie)
 const x=Math.min(RUDY.x-45,1983-150)+Math.sin(now*6)*10, y=RUDY.y-taille(RUDY.y)-55;
 rx.save();rx.shadowColor='rgba(255,220,40,1)';rx.shadowBlur=28;rx.fillStyle='#ffe400';rx.strokeStyle='#fff6a8';rx.lineWidth=4;
 rx.beginPath();rx.moveTo(x-40,y-18);rx.lineTo(x,y-18);rx.lineTo(x,y-42);rx.lineTo(x+48,y);rx.lineTo(x,y+42);rx.lineTo(x,y+18);rx.lineTo(x-40,y+18);
 rx.closePath();rx.fill();rx.stroke();rx.restore();
}
let dernier=performance.now()/1000;
/* ---------- parler à Gisèle ---------- */
let DIALOGUE=false;
const bP=document.getElementById('btnParler'), bulle=document.getElementById('bulle'), bTxt=document.getElementById('bulleTxt'),
      queue=document.getElementById('queue'), c1=document.getElementById('ch1'), c2=document.getElementById('ch2');
function procheGisele(){return Math.abs(RUDY.x-GIS.x)<230&&Math.abs(RUDY.y-GIS.y)<85}
function placeBulle(){
 if(bulle.style.display!=='block'||CAM.k==null) return;
 const k=CAM.k, hx=CAM.tx+GIS.x*k, hy=CAM.ty+(GIS.y-292)*k;          // au-dessus de sa tête (elle est debout)
 const w=bulle.offsetWidth, m=10, vw=innerWidth;
 const bx=Math.max(m+w/2,Math.min(vw-m-w/2,hx));
 bulle.style.left=bx+'px'; bulle.style.top=Math.max(bulle.offsetHeight+60,hy-18)+'px';
 queue.style.left=Math.max(22,Math.min(w-22,hx-bx+w/2))+'px';
}
function dit(txt){ bTxt.textContent=txt; bulle.style.display='block'; bulle.classList.remove('on'); void bulle.offsetWidth; placeBulle(); bulle.classList.add('on'); }
function choix(a,fa,b,fb){
 c1.textContent=a; c2.textContent=b; c1.style.display=c2.style.display='block';
 c1.onpick=fa; c2.onpick=fb;
}
function sansChoix(){ c1.style.display=c2.style.display='none'; c1.onpick=c2.onpick=null; }
function finDialogue(){ bulle.classList.remove('on'); setTimeout(()=>{bulle.style.display='none'},200); sansChoix();
 DIALOGUE=false; document.body.classList.remove('dialogue'); window.GISELE.reprend(); }
function parler(){
 if(DIALOGUE||!procheGisele()) return;
 DIALOGUE=true; joyX=joyY=0; document.body.classList.add('dialogue');
 const m=RUDY.x<GIS.x;                                   // Rudy est à sa gauche : elle se tourne vers lui
 window.GISELE.regarde(3,m);
 setTimeout(()=>{
  dit('Tu es venu jouer avec nous ?');
  choix('OUI',lanceJeu,'NON',()=>{
   window.GISELE.regarde(7,m);
   dit('Tu es sûr ? On va se mettre en maillot de bain…');
   choix('BIEN SÛR QUE JE JOUE',lanceJeu,'NON',()=>{
    sansChoix(); window.GISELE.regarde(5,m);
    dit('Dommage… ça sera pour la prochaine fois !');
    setTimeout(finDialogue,3200);
   });
  });
 },650);
}
/* ---------- le jeu de Gisèle, par-dessus la plage ---------- */
function LIEU_OCTETS(n){const x=new XMLHttpRequest();x.open('GET',n,false);x.overrideMimeType('text/plain; charset=x-user-defined');x.send(null);
 const s=x.responseText,u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u}
function lanceJeu(){
 sansChoix(); bulle.classList.remove('on'); bulle.style.display='none';
 let f=document.getElementById('jeu');
 if(!f){f=document.createElement('iframe');f.id='jeu';f.setAttribute('allow','autoplay; fullscreen');document.body.appendChild(f)}
 try{ f.srcdoc=new TextDecoder('utf-8').decode(LIEU_OCTETS('jeux/corde.html')); }catch(e){ dit('Oups, le jeu est introuvable…'); setTimeout(finDialogue,2500); return; }
 f.style.display='block'; window.PAUSE_JEU=true;
 try{ window.parent.postMessage({type:'musique:pause'},'*'); }catch(e){}   // le jeu a sa propre musique
 setTimeout(()=>{try{f.focus()}catch(e){}},300);
}
addEventListener('message',e=>{ if(!e.data||e.data.type!=='corde:quitter'||!window.PAUSE_JEU) return;
 const f=document.getElementById('jeu'); if(f){ f.style.display='none'; f.srcdoc=''; }
 window.PAUSE_JEU=false; dernier=performance.now()/1000;
 try{ window.parent.postMessage({type:'musique:reprise'},'*'); }catch(err){}
 try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(err){}
 // retour sur la plage : elle lui dit un mot, puis reprend sa vie
 window.GISELE.regarde(7,RUDY.x<GIS.x); dit('C’était trop bien ! Reviens quand tu veux.');
 setTimeout(finDialogue,2800);
});
const bS=document.getElementById('btnSortir');
function boucleRudy(){
 requestAnimationFrame(boucleRudy);
 const now=performance.now()/1000, dt=Math.min(0.05,now-dernier); dernier=now;
 if(window.PAUSE_JEU) return;
 const m=DIALOGUE?0:Math.hypot(joyX,joyY);
 if(m>0.18){
  const v=300*Math.min(1,m)*taille(RUDY.y)/300;          // plus lent au loin : même pas, vu de plus loin
  let nx=RUDY.x+joyX/m*v*dt, ny=RUDY.y+joyY/m*v*dt*0.7;
  if(!libre(nx,ny)){ if(libre(nx,RUDY.y)) ny=RUDY.y; else if(libre(RUDY.x,ny)) nx=RUDY.x; else {nx=RUDY.x;ny=RUDY.y} }
  RUDY.pas+=Math.hypot(nx-RUDY.x,ny-RUDY.y)*300/taille(RUDY.y);
  RUDY.x=nx;RUDY.y=ny;
  RUDY.dir=Math.abs(joyX)>Math.abs(joyY)?(joyX>0?'droite':'gauche'):(joyY>0?'bas':'haut');
  RUDY.bouge=true;
 }else{ RUDY.bouge=false; if(DIALOGUE) RUDY.dir=RUDY.x<GIS.x?'droite':'gauche'; }
 rx.clearRect(0,0,1983,793);
 const i=RUDY.bouge?Math.floor(RUDY.pas/(300*0.13)):0, ph=RUDY.bouge?RUDY.pas/(300*0.34):null;
 dessine(RUDY.dir,i,RUDY.x,RUDY.y,ph);
 fleche(now);
 rc.style.zIndex=RUDY.y>GIS.y?5:3;                     // devant Gisèle quand il est plus près de nous
 CAM.x=DIALOGUE?(RUDY.x+GIS.x)/2:RUDY.x; CAM.y=RUDY.y; fit(false);
 bS.style.display=(!DIALOGUE&&procheSortie())?'block':'none';
 bP.style.display=(!DIALOGUE&&procheGisele())?'block':'none';
 placeBulle();
}
requestAnimationFrame(boucleRudy);
// SORTIR : retour à la plage, entre les deux petits garçons (la musique de la rue n'a jamais coupé)
// Les boutons réagissent quand on RELÂCHE le doigt : l'écran suivant n'apparaît plus sous un doigt
// encore posé (c'est ce qui bloquait parfois les boutons et le joystick juste après)
function relache(el,f){let t=0,down=false;
 const fin=e=>{if(e&&e.cancelable)e.preventDefault();if(e)e.stopPropagation();const n=performance.now();if(n-t<450)return;t=n;down=false;f()};
 el.addEventListener('pointerdown',e=>{down=true;e.stopPropagation()});
 el.addEventListener('touchstart',e=>{down=true;if(e.cancelable)e.preventDefault();e.stopPropagation()},{passive:false});
 el.addEventListener('pointerup',e=>{if(down)fin(e)});
 el.addEventListener('touchend',e=>{if(down)fin(e)},{passive:false});
 el.addEventListener('pointercancel',()=>{down=false});
 el.addEventListener('click',fin);}
relache(bS,()=>{joyX=joyY=0;try{window.parent.postMessage({type:'gisele:sortie'},'*')}catch(err){}});
(function(){function appuie(el,f){let t=0;const go=e=>{if(e.cancelable)e.preventDefault();e.stopPropagation();const n=performance.now();if(n-t<400)return;t=n;f()};
 el.addEventListener('pointerdown',go);el.addEventListener('touchstart',go,{passive:false});el.addEventListener('click',go)}
 appuie(bP,parler); relache(c1,()=>c1.onpick&&c1.onpick()); relache(c2,()=>c2.onpick&&c2.onpick());})();
// joystick (dans tous les sens), comme au bar
(function(){const joy=document.getElementById('joy'),st=document.getElementById('stick');let id=null,cx=0,cy=0,R=0;
 function prend(e){const t=e.changedTouches?e.changedTouches[0]:e;const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;R=r.width/2;id=e.changedTouches?t.identifier:'s';bouge(e)}
 function bouge(e){if(id===null)return;const t=e.changedTouches?[...e.changedTouches].find(u=>u.identifier===id):e;if(!t)return;
  const dx=t.clientX-cx,dy=t.clientY-cy,d=Math.min(Math.hypot(dx,dy),R*0.62),a=Math.atan2(dy,dx);
  st.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;joyX=Math.cos(a)*d/(R*0.62);joyY=Math.sin(a)*d/(R*0.62);if(e.cancelable)e.preventDefault()}
 function lache(){id=null;joyX=joyY=0;st.style.transform='translate(0,0)'}
 joy.addEventListener('touchstart',prend,{passive:false});joy.addEventListener('touchmove',bouge,{passive:false});
 joy.addEventListener('touchend',lache);joy.addEventListener('touchcancel',lache);
 joy.addEventListener('mousedown',e=>{prend(e);const mv=ev=>bouge(ev),up=()=>{lache();removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};addEventListener('mousemove',mv);addEventListener('mouseup',up)});
 const K={};addEventListener('keydown',e=>{K[e.key]=1;maj()});addEventListener('keyup',e=>{K[e.key]=0;maj()});
 function maj(){joyX=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0);joyY=(K.ArrowDown?1:0)-(K.ArrowUp?1:0)}
 // zone du stick élargie : toute la partie gauche du bas de l'écran, centre sous le doigt
 const z=document.createElement('div');z.style.cssText='position:fixed;left:0;bottom:0;width:44vw;height:62vh;z-index:19;touch-action:none';document.body.appendChild(z);
 let act=null,ox=0,oy=0;const pos=e=>[...e.changedTouches].find(t=>t.identifier===act);
 z.addEventListener('touchstart',e=>{const t=e.changedTouches[0];act=t.identifier;R=joy.getBoundingClientRect().width/2;ox=t.clientX;oy=t.clientY;if(e.cancelable)e.preventDefault()},{passive:false});
 z.addEventListener('touchmove',e=>{const t=pos(e);if(!t)return;const dx=t.clientX-ox,dy=t.clientY-oy,d=Math.min(Math.hypot(dx,dy),R*0.62),a=Math.atan2(dy,dx);
  st.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;joyX=Math.cos(a)*d/(R*0.62);joyY=Math.sin(a)*d/(R*0.62);if(e.cancelable)e.preventDefault()},{passive:false});
 const fin=e=>{if(pos(e)){act=null;joyX=joyY=0;st.style.transform='translate(0,0)'}};z.addEventListener('touchend',fin);z.addEventListener('touchcancel',fin);
 const r0=()=>{joyX=joyY=0;st.style.transform='translate(0,0)'};
 document.addEventListener('touchend',e=>{if(!e.touches.length)r0()},{capture:true});addEventListener('blur',r0);document.addEventListener('visibilitychange',r0);
 document.addEventListener('contextmenu',e=>e.preventDefault(),{capture:true});
})();
</script>
<script>
/* ---------- l'argent : en haut à droite, dans la chambre et dans toutes les rues ----------
   (il ne s'affiche pas dans les mini-jeux ni dans les émulateurs) */
(function(){
 if(window.__argentPose) return; window.__argentPose=true;
 var css=document.createElement("style");
 css.textContent="#argentHUD{position:fixed;top:max(6px,env(safe-area-inset-top,0px));right:8px;z-index:25;display:flex;align-items:center;gap:5px;"+
  "padding:3px 8px 3px 4px;border-radius:999px;background:rgba(10,10,14,.62);border:1px solid rgba(255,226,122,.55);"+
  "pointer-events:none;font:800 13px/1 Arial,Helvetica,sans-serif;color:#ffe27a;text-shadow:0 1px 2px #000}"+
  "#argentHUD img{width:22px;height:21px;display:block}";
 document.head.appendChild(css);
 var d=document.createElement("div"); d.id="argentHUD";
 d.innerHTML='<img alt="" src="/assets/shinato/m/f4b8c806f85db77a.webp"><span>0 €</span>';
 var txt=d.querySelector("span");
 function pose(){ if(document.body){ document.body.appendChild(d); } else setTimeout(pose,50); }
 pose();
 function lire(){
  try{ if(window.Chambre&&window.Chambre.argent) return parseInt(window.Chambre.argent(),10)||0; }catch(e){}
  try{ var v=localStorage.getItem("rudy_argent"); return v===null?1000:(parseInt(v,10)||0); }catch(e){}
  return 1000;
 }
 function maj(){ var n=lire(); txt.textContent=n.toLocaleString("fr-FR")+" €"; }
 maj(); setInterval(maj,1000);
 window.addEventListener("pageshow",maj);
 document.addEventListener("visibilitychange",function(){ if(!document.hidden) maj(); });

 function toast(txt){
  var t=document.getElementById("argentMsg");
  if(!t){ t=document.createElement("div"); t.id="argentMsg";
   t.style.cssText="position:fixed;top:44px;right:8px;z-index:26;padding:7px 12px;border-radius:12px;background:rgba(10,10,14,.9);"+
    "border:2px solid rgba(255,226,122,.8);color:#ffe27a;font:800 13px Arial,sans-serif;pointer-events:none;opacity:0;transition:opacity .25s";
   document.body.appendChild(t); }
  t.textContent=txt; t.style.opacity="1"; clearTimeout(t.__t); t.__t=setTimeout(function(){ t.style.opacity="0"; },1700);
 }

 /** La vie de Rudy (0 à 100). Elle ne se remplit plus toute seule : il faut l'infirmerie. */
 window.vieLire=function(){ try{ var v=localStorage.getItem("rudy_vie"); var n=v===null?100:parseInt(v,10); return Math.max(0,Math.min(100,isNaN(n)?100:n)); }catch(e){ return 100; } };
 window.vieEcrire=function(n){ try{ localStorage.setItem("rudy_vie",String(Math.max(0,Math.min(100,Math.round(n))))); }catch(e){} };
 window.argentLire=lire;
 window.argentMessage=toast;
 /** Payer un jeu : renvoie false et prévient s'il n'y a pas assez d'argent. */
 window.argentPayer=function(n,quoi){
  if(lire()<n){ toast("Pas assez d'argent ("+n+" €)"); return false; }
  window.argentAjouter(-n); toast("-"+n+" €"+(quoi?" · "+quoi:"")); return true;
 };
 /** Gagner ou perdre à la fin d'un jeu. */
 window.argentGain=function(n){ if(!n) return; window.argentAjouter(n); toast((n>0?"+":"")+n+" €"); };
 // pour plus tard : gagner ou dépenser depuis le jeu
 window.argentAjouter=function(n){
  try{ if(window.Chambre&&window.Chambre.ajouterArgent){ window.Chambre.ajouterArgent(n); maj(); return; } }catch(e){}
  try{ localStorage.setItem("rudy_argent",String(Math.max(0,lire()+n))); }catch(e){}
  maj();
 };
})();
</script>
