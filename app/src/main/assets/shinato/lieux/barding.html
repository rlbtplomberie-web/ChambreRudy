<script>
// Barmaid : durée de chaque pose (ms)
const barSeq=[[0,1100],[1,1300],[2,1500],[3,1300],[4,1100],[5,1700],[6,1600],[7,1500],[8,1300],[9,1200]];
// Fille qui mange : coupe, fourchette, bouchée, savoure, bisou
const eatSeq=[[0,1700],[1,900],[2,1000],[3,1300],[4,1100]];
document.getElementById('b2').classList.add('shake');
function run(prefix,seq){
  let k=0,cur=null;
  const step=()=>{
    const [n,d]=seq[k];
    const el=document.getElementById(prefix+n);
    el.classList.add('on');
    if(cur&&cur!==el) cur.classList.remove('on');
    cur=el; k=(k+1)%seq.length;
    setTimeout(step,d);
  };
  step();
}
run('b',barSeq);
setTimeout(()=>run('e',eatSeq),400);
// la vue suit Rudy (voir plus bas)
/* ================= Rudy dans le lieu : planche du Pixel Bar, 4 directions ================= */
(function(){
const C={"LARG": 2172, "HAUT": 724, "yMin": 590, "yMax": 700, "hMin": 380, "hMax": 440, "xMin": 70, "xMax": 2100, "depart": {"x": 1350, "y": 690, "dir": "haut"}, "sortie": {"x": 1350, "y": 690, "r": 70, "fleche": "bas", "msg": "barding:sortie"}, "tabourets": [190, 466, 714, 960, 1170], "assis": {"y": 398, "h": 268}};
const RB={"droite": {"img": ["/assets/shinato/m/ef1f0b8c2cc9473b.webp", "/assets/shinato/m/8f16b04582ccd18f.webp", "/assets/shinato/m/b76af52210dcf554.webp", "/assets/shinato/m/335b72042ef27bbc.webp", "/assets/shinato/m/50c8697489c2c907.webp", "/assets/shinato/m/cbd0a1ad22fab3ba.webp", "/assets/shinato/m/680d616f4c29d575.webp", "/assets/shinato/m/3316119779970e96.webp", "/assets/shinato/m/47efa18c2f9698a9.webp"], "w": 134, "h": 206, "ax": 63.612575574365174, "ay": 203.0}, "gauche": {"img": ["/assets/shinato/m/6f1bf8da705a8911.webp", "/assets/shinato/m/f02a3a5feed4f7c4.webp", "/assets/shinato/m/ede9f664436f25f2.webp", "/assets/shinato/m/51aa1ca8a5dd4922.webp", "/assets/shinato/m/9600fe3909581e0b.webp", "/assets/shinato/m/037ddbda857ff35b.webp", "/assets/shinato/m/946210da6e0395a1.webp", "/assets/shinato/m/ba4398dc080de701.webp", "/assets/shinato/m/70e4515f71136159.webp"], "w": 130, "h": 197, "ax": 63.97493036211699, "ay": 195.0}, "haut": {"img": ["/assets/shinato/m/8a8dcc61508e73cc.webp", "/assets/shinato/m/0625bc5499c17775.webp", "/assets/shinato/m/d130e78bd96cbf58.webp", "/assets/shinato/m/85e77196dae0a364.webp", "/assets/shinato/m/f112a083b3eac8ab.webp", "/assets/shinato/m/fe5eff60eeb2ac4d.webp", "/assets/shinato/m/6be13897791b903d.webp", "/assets/shinato/m/dd80719f53df96e6.webp", "/assets/shinato/m/38e6d2bce0ca6363.webp"], "w": 89, "h": 218, "ax": 44.04040242733951, "ay": 215.0}, "bas": {"img": ["/assets/shinato/m/d67456269af20e2b.webp", "/assets/shinato/m/d227cf6f358b0526.webp", "/assets/shinato/m/0f7f9a1e518986f4.webp", "/assets/shinato/m/0a266f69d86aa01d.webp", "/assets/shinato/m/d513893fbe84847c.webp", "/assets/shinato/m/6f705304ece6820d.webp", "/assets/shinato/m/ff9a36731da1dafd.webp", "/assets/shinato/m/4d7a4f90f39f828c.webp", "/assets/shinato/m/3e7f67122e98fbfb.webp"], "w": 100, "h": 241, "ax": 50.24630667345899, "ay": 238.0}, "assis": {"img": ["/assets/shinato/m/c2897267725b6fce.webp", "/assets/shinato/m/6c16b182b2297475.webp", "/assets/shinato/m/3806d22560147fe0.webp", "/assets/shinato/m/755e4485bb1d4aa7.webp", "/assets/shinato/m/03dd25cd32a0c056.webp", "/assets/shinato/m/21671642476137e5.webp", "/assets/shinato/m/b3ef0833a4cca78d.webp", "/assets/shinato/m/fcca5a1cab60305a.webp", "/assets/shinato/m/818ec2f65015b80f.webp", "/assets/shinato/m/b8e35166f15e965c.webp", "/assets/shinato/m/d16ab3e5c6706fcf.webp", "/assets/shinato/m/80e9b128b6dfee36.webp", "/assets/shinato/m/ec15122f13294a6c.webp", "/assets/shinato/m/80b6b61289cc8f29.webp", "/assets/shinato/m/e96ec3ea688d7a5f.webp", "/assets/shinato/m/b84c4bcfc3a3401c.webp", "/assets/shinato/m/b6df68a3bbd962e6.webp", "/assets/shinato/m/edfd0fdf96e499eb.webp"], "w": 185, "h": 337, "ax": 87.21307961733494, "ay": 334.0}};
for(const k in RB) RB[k].fr=RB[k].img.map(s=>{const i=new Image();i.src=s;return i});
const w=document.getElementById('wrap');
const toile=document.getElementById('toile'), ctx=toile.getContext('2d');
const RUDY={x:C.depart.x,y:C.depart.y,dir:C.depart.dir,pas:0,bouge:false,etat:'debout',tab:null,t0:0,idx:0};
let jx=0,jy=0, dernier=performance.now()/1000;
const taille=y=>C.hMin+(C.hMax-C.hMin)*Math.max(0,Math.min(1,(y-C.yMin)/(C.yMax-C.yMin)));   // plus grand quand il s'approche
function dessine(set,i,x,y,al,phase,h){
  const R=RB[set], im=R.fr[i%R.fr.length]; if(!im.complete||al<=0) return;
  h=h||taille(y); const k=h/R.h;
  ctx.save(); ctx.globalAlpha=al;
  ctx.fillStyle='rgba(0,0,0,.38)'; ctx.beginPath(); ctx.ellipse(x,y,h*0.17,h*0.035,0,0,7); ctx.fill();
  const X=x-R.ax*k, Y=y-R.ay*k;
  if((set==='droite'||set==='gauche')&&phase!=null){
    const ouv=0.30+0.70*Math.abs(Math.cos(phase*Math.PI)), bob=-Math.abs(Math.sin(phase*Math.PI))*h*0.018;
    const hanche=Math.round(R.h*0.50), N=14, bas=R.h-hanche;
    ctx.drawImage(im,0,0,R.w,hanche,X,Y+bob,R.w*k,hanche*k);
    for(let n=0;n<N;n++){ const s0=hanche+bas*n/N, s1=hanche+bas*(n+1)/N, f=(n+0.5)/N, sx=1-(1-ouv)*f;
      ctx.drawImage(im,0,s0,R.w,s1-s0+0.6,X+R.ax*k-R.ax*k*sx,Y+s0*k+bob*(1-f),R.w*k*sx,(s1-s0)*k+0.6); }
  } else if(phase!=null){ const bob=-Math.abs(Math.sin(phase*Math.PI))*h*0.015; ctx.drawImage(im,X,Y+bob,R.w*k,R.h*k); }
  else ctx.drawImage(im,X,Y,R.w*k,R.h*k);
  ctx.restore();
}
function dessineAssis(i,al,now){
  if(!RB.assis) return; const R=RB.assis, im=R.fr[i%R.fr.length]; if(!im.complete||al<=0) return;
  const k=C.assis.h/R.h, br=1+0.005*Math.sin(now*1.6);
  ctx.save(); ctx.globalAlpha=al; ctx.translate(RUDY.tab,C.assis.y); ctx.scale(1,br);
  ctx.drawImage(im,-R.ax*k,-(R.h*0.63)*k,R.w*k,R.h*k); ctx.restore();
}
/* la flèche jaune de sortie, au même endroit que l'arrivée */
const fl=document.createElement('div'); fl.className='flecheSortie';
fl.innerHTML='<svg viewBox="0 0 100 120" width="100%" height="100%"><path d="M50 4 L94 52 L66 52 L66 116 L34 116 L34 52 L6 52 Z" fill="#ffe400" stroke="#fff7b0" stroke-width="5" stroke-linejoin="round"/></svg>';
toile.parentElement.appendChild(fl);
const bS=document.getElementById('bSortir'), bA=document.getElementById('bAssis'), bL=document.getElementById('bLeve');
const prochTab=()=>C.tabourets?C.tabourets.find(t=>Math.abs(t-RUDY.x)<70&&RUDY.y<C.yMin+45):null;
function prochSortie(){ return RUDY.etat==='debout'&&Math.hypot((RUDY.x-C.sortie.x)/1.6,RUDY.y-C.sortie.y)<C.sortie.r; }
function majUI(){
  const s=prochSortie();
  bS.style.display=s?'block':'none'; fl.style.display=s?'block':'none';
  if(s){ const h=taille(RUDY.y);
    if(C.sortie.fleche==='bas'){ fl.style.left=((RUDY.x+h*0.32)/C.LARG*100)+'%'; fl.style.top=((RUDY.y-h*0.62)/C.HAUT*100)+'%'; fl.style.transform='translate(-50%,0) rotate(180deg)'; }
    else { fl.style.left=(Math.max(C.LARG*0.025,RUDY.x-h*0.30)/C.LARG*100)+'%'; fl.style.top=((RUDY.y-h*0.62)/C.HAUT*100)+'%'; fl.style.transform='translate(-50%,0) rotate(-90deg)'; } }
  if(bA) bA.style.display=(RUDY.etat==='debout'&&prochTab()!=null)?'block':'none';
  if(bL) bL.style.display=RUDY.etat==='assis'?'block':'none';
}
function camera(){ const rx=RUDY.etat==='debout'?RUDY.x:RUDY.tab, sc=toile.parentElement, vw=w.clientWidth;
  const cible=Math.max(0,Math.min(w.scrollWidth-vw,sc.offsetLeft+rx/C.LARG*sc.offsetWidth-vw/2)); w.scrollLeft+=(cible-w.scrollLeft)*0.15; }
function image(now){
  requestAnimationFrame(image);
  const dt=Math.min(0.05,now/1000-dernier); dernier=now/1000; const t=now/1000;
  if(RUDY.etat==='debout'){
    if(jx!==0||jy!==0){
      RUDY.dir=Math.abs(jx)>=Math.abs(jy)?(jx>0?'droite':'gauche'):(jy>0?'bas':'haut');
      const v=taille(RUDY.y)*0.75;
      RUDY.x=Math.max(C.xMin,Math.min(C.xMax,RUDY.x+jx*v*dt)); RUDY.y=Math.max(C.yMin,Math.min(C.yMax,RUDY.y+jy*v*0.55*dt));
      RUDY.pas+=dt*1.8; RUDY.bouge=true;
    } else RUDY.bouge=false;
  }
  ctx.clearRect(0,0,C.LARG,C.HAUT);
  if(RUDY.etat==='debout'){
    if(RUDY.bouge){ const n=RB[RUDY.dir].fr.length; dessine(RUDY.dir,Math.floor(RUDY.pas*n)%n,RUDY.x,RUDY.y,1,RUDY.pas*2); }
    else dessine(RUDY.dir,0,RUDY.x,RUDY.y,1,null);
  } else if(RUDY.etat==='assis'){
    const hold=1.25,F=0.4; let el=t-RUDY.t0;
    if(el>hold+F){ RUDY.idx=(RUDY.idx+1)%RB.assis.fr.length; RUDY.t0=t; el=0; }

(function(){
  const z=document.getElementById('zoneJoy'), joy=document.getElementById('joy'), stick=document.getElementById('stick');
  let actif=null, ox=0, oy=0, R=0;
  const touche=e=>[].slice.call(e.changedTouches).filter(t=>t.identifier===actif)[0];
  function bouge(cx,cy){ const dx=cx-ox, dy=cy-oy, d=Math.min(Math.hypot(dx,dy),R*0.62), a=Math.atan2(dy,dx);
    stick.style.transform='translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px)';
    const m=Math.hypot(dx,dy); if(m<R*0.18){ jx=jy=0; return; } jx=dx/m; jy=dy/m; }
  function lache(){ actif=null; jx=jy=0; stick.style.transform='translate(0,0)'; }
  [z,joy].forEach(el=>{
    el.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; actif=t.identifier; const r=joy.getBoundingClientRect(); R=r.width/2;
      if(el===joy){ ox=r.left+R; oy=r.top+R; } else { ox=t.clientX; oy=t.clientY; } bouge(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
    el.addEventListener('touchmove',e=>{ const t=touche(e); if(t){ bouge(t.clientX,t.clientY); e.preventDefault(); } },{passive:false});
    el.addEventListener('touchend',e=>{ if(touche(e)) lache(); }); el.addEventListener('touchcancel',lache);
    el.addEventListener('mousedown',e=>{ const r=joy.getBoundingClientRect(); R=r.width/2; ox=r.left+R; oy=r.top+R; actif='souris'; bouge(e.clientX,e.clientY);
      const m=ev=>bouge(ev.clientX,ev.clientY), u=()=>{ lache(); removeEventListener('mousemove',m); removeEventListener('mouseup',u); };
      addEventListener('mousemove',m); addEventListener('mouseup',u); });
  });
  const K={}; const majK=()=>{ jx=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0); jy=(K.ArrowDown?1:0)-(K.ArrowUp?1:0); };
  addEventListener('keydown',e=>{ if(e.key.startsWith('Arrow')){ K[e.key]=true; majK(); } });
  addEventListener('keyup',e=>{ if(e.key.startsWith('Arrow')){ K[e.key]=false; majK(); } });
  addEventListener('blur',lache); document.addEventListener('visibilitychange',lache);
})();

/* ================= Le bocal de la fée : REGARDER → 5 façons d'ouvrir → la barmaid prévient → Oui : −100 € et la vidéo ================= */
(function(){
  const BOCAL_X=196, PRIX=100;
  const CHOIX=[
    {nom:'🫙 Ouvrir',               video:'/assets/shinato/m/barding_bocal_1.mp4'},
    {nom:'🤏 Ouvrir délicatement',  video:'/assets/shinato/m/barding_bocal_2.mp4'},
    {nom:'💗 Ouvrir tendrement',    video:'/assets/shinato/m/barding_bocal_3.mp4'},
    {nom:'👌 Ouvrir simplement',    video:'/assets/shinato/m/barding_bocal_4.mp4'},
    {nom:'💪 Ouvrir brusquement',   video:'/assets/shinato/m/barding_bocal_5.mp4', prix:200, hopital:true}   // 200 € et Rudy finit à l'hôpital
  ];
  const bB=document.getElementById('bBocal'), actions=document.getElementById('actions'), bulle=document.getElementById('bulleBar');
  const choix=document.createElement('div'); choix.id='choixBocal'; document.body.appendChild(choix);
  function pont(){ for(const w of [window,parent,top]){ try{ if(w.Chambre&&w.Chambre.argent) return w.Chambre; }catch(e){} } return null; }
  function argent(){ const p=pont(); try{ return p?p.argent():null; }catch(e){ return null; } }
  function payer(n){ const p=pont(); try{ if(p&&p.ajouterArgent) p.ajouterArgent(-n); }catch(e){} }
  // la barmaid parle dans sa bulle manga, au-dessus de sa tête
  // (la bulle se met à gauche de sa tête, la pointe vers elle : elle reste dans l'écran quand Rudy est au bout du comptoir)
  function barmaid(t,ms){ if(!bulle) return; bulle.style.left='12%'; bulle.classList.add('droite'); bulle.textContent=t; bulle.style.display='block';
    clearTimeout(bulle._t4); bulle._t4=setTimeout(()=>{ bulle.style.display='none'; bulle.style.left=''; bulle.classList.remove('droite'); },ms||60000); }
  function appui(el,fn){ let t=0; const go=e=>{ if(e&&e.cancelable) e.preventDefault(); const n=performance.now(); if(n-t<350) return; t=n; fn(); };
    el.addEventListener('touchstart',go,{passive:false}); el.addEventListener('click',go); }
  function bouton(txt,fn,pale){ const b=document.createElement('div'); b.className='btn'; b.textContent=txt; if(pale) b.style.opacity='.75'; choix.appendChild(b); appui(b,fn); }
  let ouvert=false;
  setInterval(()=>{ const R=window.RUDY; if(!R) return;
    bB.style.display=(!ouvert&&R.etat==='debout'&&Math.abs(R.x-BOCAL_X)<150)?'block':'none'; },150);
  function fin(){ ouvert=false; choix.style.display='none'; actions.style.visibility=''; }
  function montre(){ choix.style.display='flex'; actions.style.visibility='hidden'; }
  function confirmer(C){
    choix.innerHTML='';
    barmaid("Tu es sûr que tu veux ouvrir cette bouteille ? Ça peut être très dangereux… 😨");
    bouton('OUI',()=>{ fin();
      if(!C.video){ barmaid("Hmm… pas ce soir, beau gosse 😏",2400); return; }
      const prix=C.prix||PRIX;
      const a=argent(); if(a!==null&&a<prix){ barmaid("Il te faut "+prix+" € pour ça… 😏",2400); return; }
      payer(prix); bulle.style.display='none'; bulle.style.left=''; bulle.classList.remove('droite'); window.joueVideoBar&&window.joueVideoBar(C.video);
      if(C.hopital){                      // blessé : à la fin de la vidéo, direction l'hôpital (la chambre avec l'infirmière)
        const v=document.querySelector('#videoBar video'), vb=document.getElementById('videoBar');
        const va=()=>{ v.removeEventListener('ended',va); v.removeEventListener('error',va); if(vb) vb.style.display='none';
          try{ parent.postMessage({type:'barding:hopital'},'*'); }catch(e){} };
        v.addEventListener('ended',va); v.addEventListener('error',va);
      } });
    bouton('NON',()=>{ fin(); barmaid("Sage décision… 😏",2000); },true);
    montre();
  }
  appui(bB,()=>{
    ouvert=true; choix.innerHTML='';
    CHOIX.forEach(C=>bouton(C.nom,()=>confirmer(C)));
    bouton('Laisser tomber',()=>fin(),true);
    montre();
  });
})();

  function vieEcrire(n){ try{ localStorage.setItem('rudy_vie',String(Math.max(0,Math.min(100,Math.round(n))))); }catch(e){} }
  function dit(t,ms){ if(!bulle) return; bulle.style.left=''; bulle.classList.remove('droite'); bulle.textContent=t; bulle.style.display='block';
    clearTimeout(bulle._t5); bulle._t5=setTimeout(()=>{ bulle.style.display='none'; },ms||60000); }
  function appui(el,fn){ let t=0; const go=e=>{ if(e&&e.cancelable) e.preventDefault(); const n=performance.now(); if(n-t<350) return; t=n; fn(); };
    el.addEventListener('touchstart',go,{passive:false}); el.addEventListener('click',go); }
  function bouton(txt,fn,pale){ const b=document.createElement('div'); b.className='btn'+(/^(OUI|NON|Finalement non)$/.test(txt)?' large':''); b.textContent=txt; if(pale) b.style.opacity='.75'; choix.appendChild(b);
    // un vrai « appui » seulement si le doigt n'a presque pas bougé : sinon c'est qu'on fait défiler la liste
    let x0=0,y0=0,bouge=false,t=0;
    let tDeb=0;
    b.addEventListener('touchstart',e=>{ const p=e.touches[0]; x0=p.clientX; y0=p.clientY; bouge=false; tDeb=performance.now(); },{passive:true});
    b.addEventListener('touchmove',e=>{ const p=e.touches[0]; if(Math.abs(p.clientX-x0)>10||Math.abs(p.clientY-y0)>10) bouge=true; },{passive:true});
    b.addEventListener('touchend',e=>{ if(bouge||performance.now()-tDeb>500){ if(e.cancelable) e.preventDefault(); t=performance.now(); return; } if(e.cancelable) e.preventDefault(); const n=performance.now(); if(n-t<350) return; t=n; fn(); });
    b.addEventListener('click',()=>{ const n=performance.now(); if(n-t<350) return; t=n; fn(); }); }
  let ouvert=false;
  // DISCUTER s'affiche avec PARLER, en face d'elle
  setInterval(()=>{ const R=window.RUDY; if(!R) return;
    const bP=document.getElementById('bParler');
    bD.style.display=(!ouvert&&R.etat==='debout'&&Math.abs(R.x-BARMAID_X)<170&&R.y<645&&bP&&bP.style.display==='block')?'block':'none'; },150);
  function fin(){ ouvert=false; choix.style.display='none'; actions.style.visibility=''; }
  // deux grosses flèches ▲ ▼ au-dessus de la liste : elles font défiler sans jamais lancer de vidéo
  const fl=document.createElement('div'); fl.id='defileReve'; fl.innerHTML='<div data-s="-1">▲</div><div data-s="1">▼</div>'; document.body.appendChild(fl);
  fl.querySelectorAll('div').forEach(d=>appui(d,()=>{ choix.scrollBy({top:(+d.dataset.s)*choix.clientHeight*0.8,behavior:'smooth'}); }));
  fl.style.display='none';
  function montre(){ choix.style.display='flex'; choix.scrollTop=0; actions.style.visibility='hidden'; }
  function rever(R){ fin();
        if(vieLire()<=VIE_PRISE){ dit("Tu n'as plus assez de vie pour rêver… 😶",2600); return; }
        vieEcrire(vieLire()-VIE_PRISE); bulle.style.display='none';
        if(R.hopital){                    // « Toi » : directement sa vidéo, puis Rudy finit à l'hôpital
          window.joueVideoBar&&window.joueVideoBar(R.video);
          const vh=document.querySelector('#videoBar video'), vbh=document.getElementById('videoBar');
          const va=()=>{ vh.removeEventListener('ended',va); vh.removeEventListener('error',va); if(vbh) vbh.style.display='none';
            try{ parent.postMessage({type:'barding:hopital'},'*'); }catch(e){} };
          vh.addEventListener('ended',va); vh.addEventListener('error',va); return; }
        if(!INTRO||R.sansIntro){ window.joueVideoBar&&window.joueVideoBar(R.video);
          const v0=document.querySelector('#videoBar video'), fin0=()=>{ v0.removeEventListener('ended',fin0); setTimeout(()=>dit("J'espère que tu as aimé… Reviens me voir si tu veux retenter 😏",4000),250); };
          v0.addEventListener('ended',fin0); return; }
        // d'abord la vidéo d'entrée dans le rêve, puis la vidéo du rêve choisi
        window.joueVideoBar&&window.joueVideoBar(INTRO);
        const v=document.querySelector('#videoBar video'), vb=document.getElementById('videoBar');
        const ensuite=()=>{ v.removeEventListener('ended',ensuite); setTimeout(()=>{ window.joueVideoBar(R.video); v.addEventListener('ended',apres); },60); };
        // à la fin du rêve, la barmaid dit toujours la même chose
        const apres=()=>{ v.removeEventListener('ended',apres); setTimeout(()=>dit("J'espère que tu as aimé… Reviens me voir si tu veux retenter 😏",4000),250); };
        v.addEventListener('ended',ensuite);   }
  const PAR_PAGE=10;
  function page(n){
    const total=Math.ceil(REVES.length/PAR_PAGE); n=Math.max(0,Math.min(total-1,n));
    choix.innerHTML='';
    REVES.slice(n*PAR_PAGE,(n+1)*PAR_PAGE).forEach(R=>bouton(R.nom,()=>rever(R)));
    // la barre du bas : ◀ liste d'avant · page · liste suivante ▶
    const barre=document.createElement('div'); barre.className='navReve';
    const g=document.createElement('div'); g.className='btn nav'; g.textContent='◀'; if(n===0) g.classList.add('off');
    const m=document.createElement('div'); m.className='pageReve'; m.textContent=(n+1)+' / '+total;
    const d=document.createElement('div'); d.className='btn nav'; d.textContent='▶'; if(n>=total-1) d.classList.add('off');
    barre.appendChild(g); barre.appendChild(m); barre.appendChild(d); choix.appendChild(barre);
    appui(g,()=>{ if(n>0) page(n-1); }); appui(d,()=>{ if(n<total-1) page(n+1); });
    bouton('Finalement non',()=>{ fin(); dit("Tu rates quelque chose… 😏",2200); },true);
    montre();
  }
  appui(bD,()=>{
    ouvert=true; choix.innerHTML='';
    dit("Est-ce que tu veux rêver ? Je peux accomplir tous tes rêves… mais je vais forcément prendre un peu de ta vie 😈");
    bouton('OUI',()=>{
      choix.innerHTML='';
      dit("Alors… de quoi veux-tu rêver ? 😏");
      page(0);
    });
    bouton('NON',()=>{ fin(); dit("Tu rates quelque chose… 😏",2200); },true);
    montre();
  });
})();
</script>
</body></html>
