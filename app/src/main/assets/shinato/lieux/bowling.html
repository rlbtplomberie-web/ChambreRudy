const scene=document.getElementById('scene');
document.getElementById('fond').src=FOND;
const pc=v=>v+'%';
function place(el,x,y,w,h){Object.assign(el.style,{left:pc(x/SW*100),top:pc(y/SH*100),width:pc(w/SW*100),height:pc(h/SH*100)});}

// ---- néons (calques ajoutés en lumière) ----
const neons={};
for(const k of ['plafond','enseigne','comptoir']){
  const im=new Image();im.src=C[k].src;im.className='calque neon';place(im,C[k].x,C[k].y,C[k].w,C[k].h);
  scene.insertBefore(im,document.getElementById('fx'));neons[k]=im;
}

// ---- l'hôtesse derrière le comptoir ----
const hot=document.getElementById('hotesse');
const S=0.40;
place(hot,1995-HOT.cx*S,392-HOT.ligne*S,HOT.w*S,HOT.h*S);
const poses=HOT.f.map((s,i)=>{const im=new Image();im.src=s;im.alt='';if(i===0)im.className='vu';hot.appendChild(im);return im;});
// ordre : pose calme, puis gestes d'accueil, retour au calme
let cur=0,z=1;
const calmes=[0,4], gestes=[1,2,3,5];
function montre(n){if(n===cur)return;const p=poses[cur];poses[n].style.zIndex=++z;poses[n].className='vu';setTimeout(()=>{p.className='';},420);cur=n;}
(function suite(){
  const calme=calmes.includes(cur);
  const n=calme?gestes[(Math.random()*gestes.length)|0]:calmes[(Math.random()*2)|0];
  setTimeout(()=>{montre(n);suite();},calme?2200+Math.random()*2500:1400+Math.random()*1200);
})();

// ---- effets animés ----
const cv=document.getElementById('fx'),g=cv.getContext('2d');
const ECRANS=[[595,147,682,219],[691,147,825,219],[850,147,967,219],[988,147,1153,219],[1173,147,1290,219],[1312,147,1461,219],[1477,147,1594,219]];
const QUILLES=[847,934,1029,1128,1224,1329,1426,1514];
const BOUGIES=[[252,412],[673,425],[2085,412]];
const LAMPES=[[315,84],[1075,84]];
let boule=null,prochaine=2;
function glow(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col.replace('A',a));gr.addColorStop(1,col.replace('A',0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function boucle(ms){
  const t=ms/1000;
  // néons : léger souffle + petits grésillements
  const gr=Math.random()<0.012?0.0:1;
  neons.plafond.style.opacity=(0.22+0.12*Math.sin(t*1.3));
  neons.enseigne.style.opacity=gr*(0.35+0.18*Math.sin(t*2.1)+0.06*Math.sin(t*13));
  neons.comptoir.style.opacity=(0.25+0.15*Math.sin(t*1.7+1));
  g.clearRect(0,0,SW,SH);
  g.globalCompositeOperation='lighter';
  // écrans : reflet qui balaie + pulsation
  ECRANS.forEach(([x0,y0,x1,y1],i)=>{
    const w=x1-x0,h=y1-y0;
    g.fillStyle=`rgba(120,140,255,${0.05+0.05*Math.sin(t*2+i)})`;g.fillRect(x0,y0,w,h);
    const p=((t*0.35+i*0.37)%1.6)-0.3, bx=x0+p*w;
    const lg=g.createLinearGradient(bx-25,0,bx+25,0);
    lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.5,'rgba(255,255,255,0.16)');lg.addColorStop(1,'rgba(255,255,255,0)');
    g.save();g.beginPath();g.rect(x0,y0,w,h);g.clip();g.fillStyle=lg;g.fillRect(bx-25,y0,50,h);g.restore();
  });
  // lampes suspendues et bougies
  LAMPES.forEach(([x,y],i)=>glow(x,y+12,70,'rgba(255,190,110,A)',0.10+0.03*Math.sin(t*1.1+i)));
  BOUGIES.forEach(([x,y],i)=>glow(x,y,18+2*Math.sin(t*9+i*3),'rgba(255,170,70,A)',0.30+0.12*Math.sin(t*11+i)*Math.sin(t*4.3+i)));
  // quilles qui scintillent doucement
  QUILLES.forEach((x,i)=>glow(x,318,30,'rgba(190,200,255,A)',0.06+0.04*Math.sin(t*1.5+i)));
  // une boule lancée de temps en temps
  if(!boule&&t>prochaine){const q=QUILLES[2+((Math.random()*4)|0)];boule={q,t0:t,dur:2.2+Math.random()*0.6,c:['#3b6cff','#ff3b6a','#ffb43b','#b43bff'][(Math.random()*4)|0]};}
  if(boule){
    const k=(t-boule.t0)/boule.dur;
    if(k<1){
      const e=1-Math.pow(1-k,1.4);
      const x0=1150+(boule.q-1150)*1.45, y0=392;
      const x=x0+(boule.q-x0)*e, y=y0+(318-y0)*e, r=7-4*e;
      g.globalCompositeOperation='source-over';
      g.fillStyle=boule.c;g.beginPath();g.arc(x,y-r,r,0,7);g.fill();
      g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(x-r*.35,y-r*1.35,r*.3,0,7);g.fill();
      g.globalCompositeOperation='lighter';glow(x,y-r,r*3,'rgba(150,170,255,A)',0.25);
    }else if(k<1.5){
      const f=(k-1)/0.5;glow(boule.q,315,60,'rgba(255,255,255,A)',0.55*(1-f));glow(boule.q,315,110,'rgba(200,120,255,A)',0.30*(1-f));
    }else{boule=null;prochaine=t+3+Math.random()*4;}
  }
  g.globalCompositeOperation='source-over';
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);

(function(){
const IMG={"marche": ["/assets/shinato/m/f66b7486849bf5b6.webp", "/assets/shinato/m/cc08b27eef23e5a1.webp", "/assets/shinato/m/8d7a4da973184d42.webp", "/assets/shinato/m/c3af9ca2675d2358.webp", "/assets/shinato/m/e69420c5e154a6e8.webp", "/assets/shinato/m/1e7d270f5c81b1d7.webp"], "marchecig": ["/assets/shinato/m/d67e7594cc42e870.webp", "/assets/shinato/m/03ece0389ddde297.webp", "/assets/shinato/m/b151e5b2b7a95417.webp", "/assets/shinato/m/9b0eb765d4393a26.webp", "/assets/shinato/m/d754aefb2c136d92.webp", "/assets/shinato/m/25ffc9231580075c.webp"], "fumer": ["/assets/shinato/m/bedcf36925325251.webp", "/assets/shinato/m/4ebd35da82f3a2e9.webp", "/assets/shinato/m/f7881a04b223dd0e.webp", "/assets/shinato/m/7ffc91a79091a2b6.webp", "/assets/shinato/m/fa8228dd48637425.webp", "/assets/shinato/m/43eb2067b32c9926.webp", "/assets/shinato/m/8108a6212954d8a4.webp", "/assets/shinato/m/af7011fab2bf9118.webp"], "jeter": ["/assets/shinato/m/c641f840c39566aa.webp", "/assets/shinato/m/305939c97e25c315.webp", "/assets/shinato/m/f9d3aa2a9eb1e230.webp", "/assets/shinato/m/30b1d03ab2b1509e.webp", "/assets/shinato/m/787b5557b3a151cc.webp", "/assets/shinato/m/2d3b6b31173af9a5.webp", "/assets/shinato/m/2644b102ac4560ca.webp", "/assets/shinato/m/506c07a78b8481f4.webp", "/assets/shinato/m/ab9a2f2011d3f12f.webp"]};
Object.values(IMG).forEach(l=>l.forEach(u=>{const i=new Image();i.src=u;}));
const vue=document.getElementById('vue');
const PIEDS_Y=716, TAILLE=440;                  // pieds sur le carrelage, hauteur de Rudy (pixels de la scène)
const X0=330, X1=1405;                           // il ne passe pas dans le comptoir de l'accueil
const SORTIE_X=390;                              // la sortie est à gauche
const HF=TAILLE*800/660, WF=HF*560/800;          // la toile fait 560×800 pour 660 de personnage
const rudy=new Image();rudy.id='rudyB';rudy.alt='';
const ombre=document.createElement('div');ombre.id='ombreB';
const fleche=document.createElement('div');fleche.id='flecheB';
fleche.innerHTML='<svg viewBox="0 0 60 80" width="100%"><path d="M18 0h24v42h16L30 80 2 42h16z" fill="#ffd400" stroke="#fff6b0" stroke-width="3" stroke-linejoin="round"/></svg>';
scene.appendChild(ombre);scene.appendChild(rudy);scene.appendChild(fleche);
place(ombre,0,0,TAILLE*0.55,TAILLE*0.09);
Object.assign(fleche.style,{left:pc(SORTIE_X/SW*100),top:pc(205/SH*100)});
let etat='repos',clope=false,sens=1,x=470,f=0,phase=0,parcours=0,dir=0,tPrec=0;
const DUREE={fumer:300,jeter:190,repos:520,reposcig:600}, VITESSE=1.25, PAS=0.17;
function planche(){if(etat==='fumer')return'fumer';if(etat==='jeter')return'jeter';if(etat==='marche')return clope?'marchecig':'marche';return'repos';}
function images(){const p=planche();if(p==='repos')return clope?IMG.fumer.slice(4):[IMG.fumer[0]];return IMG[p];}
function duree(){const p=planche();return p==='repos'?(clope?DUREE.reposcig:DUREE.repos):DUREE[p];}
function pose(src){
  if(rudy.getAttribute('src')!==src)rudy.src=src;
  place(rudy,x-WF/2,PIEDS_Y-HF*771/800,WF,HF);
  rudy.style.transform='scaleX('+sens+')';
  place(ombre,x-TAILLE*0.275,PIEDS_Y-TAILLE*0.045,TAILLE*0.55,TAILLE*0.09);
}
function camera(direct){
  const k=scene.clientWidth/SW, cible=Math.max(0,Math.min(scene.clientWidth-vue.clientWidth,x*k-vue.clientWidth/2));
  vue.scrollLeft=direct?cible:vue.scrollLeft+(cible-vue.scrollLeft)*0.14;
}
const ACCUEIL_X=1250;                             // près du comptoir de l'accueil : PARLER
let occupe=false;
const bP=document.getElementById('btnParlerB'),bF=document.getElementById('btnFumerB'),bJ=document.getElementById('btnJeterB'),bS=document.getElementById('btnSortirB');
function boutons(){const libre=etat==='repos'||etat==='marche';bF.style.display=libre&&!clope?'flex':'none';bJ.style.display=libre&&clope?'flex':'none';
  const pres=x<SORTIE_X+170;bS.style.display=pres?'flex':'none';fleche.style.display=pres?'block':'none';
  bP.style.display=libre&&!occupe&&x>ACCUEIL_X?'flex':'none';}
function boucle(t){
  requestAnimationFrame(boucle);
  if(occupe){tPrec=t;return;}
  if(!tPrec)tPrec=t;const dt=Math.min((t-tPrec)/1000,0.05);tPrec=t;
  const d=clav.l?-1:clav.r?1:dir;
  const libre=etat==='repos'||etat==='marche';
  if(libre){
    if(d!==0){sens=d;if(etat!=='marche'){etat='marche';parcours=0;}const av=x;x=Math.max(X0,Math.min(X1,x+d*VITESSE*TAILLE*dt));parcours+=Math.abs(x-av);}
    else if(etat==='marche'){etat='repos';phase=0;f=0;}
  }else if(etat==='jeter'){x=Math.max(X0,Math.min(X1,x+sens*VITESSE*0.55*TAILLE*dt));}
  let L=images();
  if(etat==='marche'){pose(L[Math.floor(parcours/(PAS*TAILLE))%L.length]);camera(false);boutons();return;}
  phase+=dt*1000/duree();
  if(phase>=1){phase-=1;f++;
    if(f>=L.length){if(etat==='fumer'){clope=true;etat='repos';f=0;}else if(etat==='jeter'){clope=false;etat='repos';f=0;}else f=0;L=images();}}
  pose(L[Math.min(f,L.length-1)]);camera(false);boutons();
}
function appui(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn();});}
appui(bF,()=>{if(etat==='repos'&&!clope){etat='fumer';f=0;phase=0;}});
appui(bJ,()=>{if(etat==='repos'&&clope){etat='jeter';f=0;phase=0;}});
// SORTIR : on sort quand le doigt se relève (le doigt n'est plus posé quand on revient dans la rue)
let sortieArmee=false;
bS.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();sortieArmee=true;});
bS.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();if(!sortieArmee)return;sortieArmee=false;js();for(const k in clav)clav[k]=0;
  setTimeout(()=>{try{window.parent.postMessage({type:'bowling:sortie'},'*');}catch(e){}},60);});
bS.addEventListener('pointercancel',()=>{sortieArmee=false;});
// ===== PARLER à l'hôtesse de l'accueil : vidéo, puis FAIRE UNE PARTIE / DISCUTER =====
function musique(stop){try{const a=window.top.RUDY_AUDIO;if(!a)return;if(stop){musiqueCoupee=!a.paused;a.pause();}else if(musiqueCoupee){musiqueCoupee=false;a.play().catch(()=>{});}}catch(e){}}
let musiqueCoupee=false;
const vidB=document.getElementById('vidB'),vB=vidB.querySelector('video'),choixB=document.getElementById('choixB'),jeuB=document.getElementById('jeuB');
function libereCommandes(){js();for(const k in clav)clav[k]=0;}
function finVideo(){vB.onended=null;vB.pause();vidB.style.display='none';choixB.style.display='flex';}
appui(bP,()=>{if(occupe)return;occupe=true;libereCommandes();bP.style.display='none';bF.style.display='none';bJ.style.display='none';musique(true);
  vB.src='/assets/shinato/m/bowling_hotesse.mp4';vidB.style.display='block';vB.currentTime=0;vB.onended=finVideo;vB.play().catch(finVideo);});
function fermeChoix(){choixB.style.display='none';occupe=false;libereCommandes();musique(false);}
// DISCUTER : la discussion en bulles de manga, puis la vidéo
const bulleB=document.getElementById('bulleB');
const DISCUSSION=[['elle',"J'en étais sûre…"],['rudy',"Tu sais que tu es vraiment canon."],['elle',"C'est gentil de dire ça… on me le dit souvent."],
  ['rudy',"Oui… j'ai du mal à détourner le regard."],['elle',"Qui t'a dit de le détourner ? Viens par ici…"]];
function bulle(qui,txt){
  bulleB.textContent=txt;bulleB.style.display='block';bulleB.style.animation='none';void bulleB.offsetWidth;bulleB.style.animation='';
  const r=(qui==='rudy'?rudy:hot).getBoundingClientRect(), bw=bulleB.offsetWidth, vw=innerWidth;
  const cx=r.left+r.width/2, x=Math.max(bw/2+8,Math.min(vw-bw/2-8,cx));
  bulleB.style.left=x+'px';bulleB.style.top=Math.max(bulleB.offsetHeight+12,r.top+r.height*(qui==='rudy'?.04:.02))+'px';
  bulleB.style.setProperty('--q',Math.max(12,Math.min(88,50+(cx-x)/bw*100))+'%');   // la pointe vise celui qui parle
}
let etape=-1,minuteB=null;
function suiteDiscussion(){
  clearTimeout(minuteB);etape++;
  if(etape>=DISCUSSION.length){bulleB.style.display='none';etape=-1;
    vB.src='/assets/shinato/m/bowling_discuter.mp4';vidB.style.display='block';vB.currentTime=0;
    vB.onended=()=>{vB.onended=null;vB.pause();vidB.style.display='none';fermeChoix();};
    vB.play().catch(()=>{vB.onended&&vB.onended();});return;}
  const [qui,txt]=DISCUSSION[etape];bulle(qui,txt);minuteB=setTimeout(suiteDiscussion,2000);   // chaque bulle dure 2 secondes
}
appui(document.getElementById('chDiscuterB'),()=>{choixB.style.display='none';etape=-1;suiteDiscussion();});
// un appui sur l'écran fait passer à la bulle suivante
addEventListener('pointerdown',()=>{if(etape>=0&&bulleB.style.display==='block')suiteDiscussion();});
appui(document.getElementById('chFermerB'),fermeChoix);
appui(document.getElementById('chPartieB'),()=>{choixB.style.display='none';
  const f=document.createElement('iframe');f.src='/assets/shinato/jeux/bowling-partie.html';f.allow='autoplay; fullscreen';jeuB.appendChild(f);jeuB.style.display='block';});
// QUITTER : on referme le jeu quand le doigt se relève
const qJ=document.getElementById('quitJeuB');let quitArme=false;
qJ.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();quitArme=true;});
qJ.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();if(!quitArme)return;quitArme=false;
  const f=jeuB.querySelector('iframe');if(f){try{f.src='about:blank';}catch(_){}f.remove();}jeuB.style.display='none';fermeChoix();});
qJ.addEventListener('pointercancel',()=>{quitArme=false;});
// joystick (gauche / droite)
const joy=document.getElementById('joyB'),knob=document.getElementById('knobB');let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),R=r.width/2;let dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;const dd=Math.hypot(dx,dy),mm=R*0.62;if(dd>mm){dx*=mm/dd;dy*=mm/dd;}knob.style.transform=`translate(${dx}px,${dy}px)`;dir=Math.abs(dx)>mm*0.25?(dx>0?1:-1):0;}
function js(){jid=null;dir=0;knob.style.transform='';}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;try{joy.setPointerCapture(jid)}catch(_){}jm(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e);});
joy.addEventListener('pointerup',e=>{if(e.pointerId===jid)js();});joy.addEventListener('pointercancel',e=>{if(e.pointerId===jid)js();});
const clav={};const T={ArrowLeft:'l',KeyA:'l',KeyQ:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{if(T[e.code])clav[T[e.code]]=1;});addEventListener('keyup',e=>{if(T[e.code])clav[T[e.code]]=0;});
addEventListener('blur',()=>{js();for(const k in clav)clav[k]=0;});
addEventListener('resize',()=>camera(true));
requestAnimationFrame(()=>{pose(IMG.fumer[0]);camera(true);requestAnimationFrame(boucle);});
})();
</script>
