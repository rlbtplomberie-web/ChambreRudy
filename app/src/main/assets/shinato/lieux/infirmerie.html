<style>

<script>
(function(){

<style>

<script>

(function(){

 for(var k in RB){ RB[k].fr=RB[k].img.map(function(u){ var i=new Image(); i.src=u; return i; }); }
 var stage=document.getElementById("stage"), can=document.getElementById("salle"), ctx=can.getContext("2d");
 var ZONE={x0:520,x1:1360,y0:500,y1:672};               // le sol, devant les box et le comptoir

 var jx=0,jy=0,prec=0;
 function taille(y){ return 265+(y-500)/172*76; }      // un peu plus petit que dans les autres intérieurs

 }
 function dessine(set,i,x,y,phase){
  var S=RB[set],im=S.fr[i%S.fr.length]; if(!im.complete) return;
  var h=taille(y),k=h/S.h,X=x-S.ax*k,Y=y-S.ay*k;
  ctx.save(); ctx.fillStyle="rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(x,y,h*.17,h*.035,0,0,7); ctx.fill();
  if((set==="droite"||set==="gauche")&&phase!=null){
   // de profil, la planche a presque toujours le même pas : on fait marcher les jambes
   var ouv=.30+.70*Math.abs(Math.cos(phase*Math.PI)),bob=-Math.abs(Math.sin(phase*Math.PI))*h*.018;
   var hanche=Math.round(S.h*.5),N=14,bas=S.h-hanche;

   for(var n=0;n<N;n++){ var s0=hanche+bas*n/N,s1=hanche+bas*(n+1)/N,f=(n+.5)/N,sx=1-(1-ouv)*f;
    ctx.drawImage(im,0,s0,S.w,s1-s0+.6,x-S.ax*k*sx,Y+s0*k+bob*(1-f),S.w*k*sx,(s1-s0)*k+.6); }
  } else ctx.drawImage(im,X,Y,S.w*k,S.h*k);
  ctx.restore();
 }
 function fleche(t){
  var h=taille(R.y),x=R.x,y=R.y-h-40+Math.sin(t*6)*10;
  ctx.save(); ctx.shadowColor="rgba(255,220,40,1)"; ctx.shadowBlur=28; ctx.fillStyle="#ffe400"; ctx.strokeStyle="#fff6a8"; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(x-18,y-40); ctx.lineTo(x+18,y-40); ctx.lineTo(x+18,y); ctx.lineTo(x+42,y); ctx.lineTo(x,y+46); ctx.lineTo(x-42,y); ctx.lineTo(x-18,y); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
 }
 var bS=document.getElementById("btnSortir"), bP=document.getElementById("btnParler"),
     bO=document.getElementById("btnOui"), bN=document.getElementById("btnNon");
 var INF={x:300,y:470};                                  // l'infirmière, derrière son comptoir
 var bulle=null, bulleFin=0, question=false, enSoin=false;
 function pres(){ return R.x<680&&R.y<600; }             // devant le comptoir d'accueil
 function dit(txt,duree){ bulle=txt; bulleFin=duree?performance.now()/1000+duree:0; }
 function bulleDessin(){
  if(!bulle) return;
  if(bulleFin&&performance.now()/1000>bulleFin){ bulle=null; return; }
  var lignes=bulle.split("\n"), t=22;
  ctx.save(); ctx.font="800 "+t+"px system-ui,sans-serif";
  var w=0; lignes.forEach(function(l){ w=Math.max(w,ctx.measureText(l).width); });
  w+=t*1.3; var h=lignes.length*t*1.3+t*.8;

  var x=INF.x+120+w/2, y=INF.y-h-60;
  ctx.fillStyle="#fffdf7"; ctx.strokeStyle="#1c2622"; ctx.lineWidth=4;
  ctx.beginPath(); ctx.roundRect(x-w/2,y,w,h,14); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-w/2+6,y+h-16); ctx.lineTo(x-w/2-22,y+h+14); ctx.lineTo(x-w/2+26,y+h-2); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#1c2622"; ctx.textAlign="center"; ctx.textBaseline="top";
  lignes.forEach(function(l,i){ ctx.fillText(l,x,y+t*.4+i*t*1.3); });
  ctx.restore();
 }
 function soigner(note){
  var v=window.vieLire();
  if(note==="bisou"||note==="bien"){ window.vieEcrire(100); dit("Te voilà tout neuf ! 100 %",3.5); }
  else if(note==="rale"){ window.vieEcrire(v+(100-v)/2); dit("À moitié remis…\n"+Math.round(window.vieLire())+" %",3.5); }
  else dit("Tu as trop gigoté.\nJe n'ai rien pu faire.",3.5);
 }
 window.addEventListener("message",function(e){
  if(!e.data) return;
  if(e.data.type==="soin:fin"){ soigner(e.data.note); }
  if(e.data.type==="soin:partir"||e.data.type==="soin:fin"&&false){}
  if(e.data.type==="soin:partir"){ var f=document.getElementById("jeuSoin"); f.style.display="none"; f.srcdoc=""; enSoin=false; }
 });
 function boucle(now){
  requestAnimationFrame(boucle);
  var t=now/1000, dt=prec?Math.min(.05,t-prec):0; prec=t;
  var m=Math.hypot(jx,jy);
  if(m>.18){ var v=250*Math.min(1,m);
   var nx=Math.max(ZONE.x0,Math.min(ZONE.x1,R.x+jx/m*v*dt)), ny=Math.max(ZONE.y0,Math.min(ZONE.y1,R.y+jy/m*v*dt));
   R.pas+=Math.hypot(nx-R.x,ny-R.y); R.x=nx; R.y=ny;
   R.dir=Math.abs(jx)>Math.abs(jy)?(jx>0?"droite":"gauche"):(jy>0?"bas":"haut"); R.bouge=true;
  } else R.bouge=false;
  ctx.clearRect(0,0,1505,688);
  var h=taille(R.y);
  dessine(R.dir,R.bouge?Math.floor(R.pas/(h*.13)):0,R.x,R.y,R.bouge?R.pas/(h*.34):null);
  var ici=sortieIci(); if(ici) fleche(t);
  bulleDessin();
  bS.style.display=ici?"block":"none";
  bP.style.display=(!question&&!enSoin&&pres())?"block":"none";
  bO.style.display=bN.style.display=(question&&!enSoin)?"block":"none";
  camera();
 }
 requestAnimationFrame(boucle);
 // SORTIR : retour devant l'hôpital
 function appui(el,f){ var t0=0; function go(e){ if(e.cancelable)e.preventDefault(); e.stopPropagation(); var n=Date.now(); if(n-t0<400)return; t0=n; f(); }
  el.addEventListener("pointerdown",go); el.addEventListener("touchstart",go,{passive:false}); el.addEventListener("click",go); }
 appui(bS,function(){ jx=jy=0; try{ window.parent.postMessage({type:"infirmerie:sortie"},"*"); }catch(err){} });
 appui(bP,function(){ jx=jy=0; question=true; dit("Voulez-vous que je vous soigne ?\n(10 €)"); });
 appui(bN,function(){ question=false; dit("Comme tu veux.",2); });
 appui(bO,function(){
  question=false;
  if(!window.argentPayer(10,"les soins")) return;        // les soins coûtent 10 €
  dit(null); enSoin=true;
  var f=document.getElementById("jeuSoin");
  f.srcdoc=new TextDecoder("utf-8").decode(LIEU_OCTETS("jeux/soin.html"));
  f.style.display="block"; setTimeout(function(){ try{ f.focus(); }catch(e){} },300);
 });
 addEventListener("message",function(e){ if(e.data&&e.data.type==="infirmerie:entree"){ R.x=DEPART.x; R.y=DEPART.y; R.dir="haut"; jx=jy=0; } });
 // le stick : le rond, ou n'importe où dans la partie gauche du bas (le centre se met sous le doigt)
 var joy=document.getElementById("joy"), st=document.getElementById("stick"), zone=document.getElementById("zoneJoy");
 var actif=null, ox=0, oy=0, rayon=0;
 function pos(e){ for(var i=0;i<e.changedTouches.length;i++) if(e.changedTouches[i].identifier===actif) return e.changedTouches[i]; return null; }
 function bouge(X,Y){ var dx=X-ox,dy=Y-oy,d=Math.min(Math.hypot(dx,dy),rayon*.62),a=Math.atan2(dy,dx);
  st.style.transform="translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px)"; jx=Math.cos(a)*d/(rayon*.62); jy=Math.sin(a)*d/(rayon*.62); }
 function lache(){ actif=null; jx=jy=0; st.style.transform="translate(0,0)"; }
 [joy,zone].forEach(function(el){
  el.addEventListener("touchstart",function(e){ var t=e.changedTouches[0]; actif=t.identifier; var r=joy.getBoundingClientRect(); rayon=r.width/2;
   if(el===joy){ ox=r.left+rayon; oy=r.top+rayon; } else { ox=t.clientX; oy=t.clientY; } bouge(t.clientX,t.clientY); if(e.cancelable)e.preventDefault(); },{passive:false});
  el.addEventListener("touchmove",function(e){ var t=pos(e); if(t){ bouge(t.clientX,t.clientY); if(e.cancelable)e.preventDefault(); } },{passive:false});
  el.addEventListener("touchend",function(e){ if(pos(e)) lache(); }); el.addEventListener("touchcancel",function(e){ if(pos(e)) lache(); });
  el.addEventListener("mousedown",function(e){ var r=joy.getBoundingClientRect(); rayon=r.width/2; ox=el===joy?r.left+rayon:e.clientX; oy=el===joy?r.top+rayon:e.clientY; actif="souris";
   function mv(ev){ bouge(ev.clientX,ev.clientY); } function up(){ lache(); removeEventListener("mousemove",mv); removeEventListener("mouseup",up); }
   addEventListener("mousemove",mv); addEventListener("mouseup",up); });
 });

 var K={}; addEventListener("keydown",function(e){ K[e.key]=1; clav(); }); addEventListener("keyup",function(e){ K[e.key]=0; clav(); });

})();
</script>
<script>
/* ---------- l'argent : en haut à droite, dans la chambre et dans toutes les rues ----------
   (il ne s'affiche pas dans les mini-jeux ni dans les émulateurs) */
(function(){
 if(window.__argentPose) return; window.__argentPose=true;
 var css=document.createElement("style");
 css.textContent="#argentHUD{position:fixed;top:max(6px,env(safe-area-inset-top,0px));right:8px;z-index:25;display:flex;align-items:center;gap:5px;"+
  "padding:3px 8px 3px 4px;border-radius:999px;background:rgba(10,10,14,.62);border:1px solid rgba(255,226,122,.55);"+
  "pointer-events:none;font:800 13px/1 Arial,Helvetica,sans-serif;color:#ffe27a;text-shadow:0 1px 2px #000}"+
  "#argentHUD img{width:22px;height:21px;display:block}";
 document.head.appendChild(css);
 var d=document.createElement("div"); d.id="argentHUD";
 d.innerHTML='<img alt="" src="/assets/shinato/m/f4b8c806f85db77a.webp"><span>0 €</span>';
 var txt=d.querySelector("span");
 function pose(){ if(document.body){ document.body.appendChild(d); } else setTimeout(pose,50); }
 pose();
 function lire(){
  try{ if(window.Chambre&&window.Chambre.argent) return parseInt(window.Chambre.argent(),10)||0; }catch(e){}
  try{ var v=localStorage.getItem("rudy_argent"); return v===null?1000:(parseInt(v,10)||0); }catch(e){}
  return 1000;
 }
 function maj(){ var n=lire(); txt.textContent=n.toLocaleString("fr-FR")+" €"; }
 maj(); setInterval(maj,1000);
 window.addEventListener("pageshow",maj);
 document.addEventListener("visibilitychange",function(){ if(!document.hidden) maj(); });

 function toast(txt){
  var t=document.getElementById("argentMsg");
  if(!t){ t=document.createElement("div"); t.id="argentMsg";
   t.style.cssText="position:fixed;top:44px;right:8px;z-index:26;padding:7px 12px;border-radius:12px;background:rgba(10,10,14,.9);"+
    "border:2px solid rgba(255,226,122,.8);color:#ffe27a;font:800 13px Arial,sans-serif;pointer-events:none;opacity:0;transition:opacity .25s";
   document.body.appendChild(t); }
  t.textContent=txt; t.style.opacity="1"; clearTimeout(t.__t); t.__t=setTimeout(function(){ t.style.opacity="0"; },1700);
 }

 /** La vie de Rudy (0 à 100). Elle ne se remplit plus toute seule : il faut l'infirmerie. */
 window.vieLire=function(){ try{ var v=localStorage.getItem("rudy_vie"); var n=v===null?100:parseInt(v,10); return Math.max(0,Math.min(100,isNaN(n)?100:n)); }catch(e){ return 100; } };
 window.vieEcrire=function(n){ try{ localStorage.setItem("rudy_vie",String(Math.max(0,Math.min(100,Math.round(n))))); }catch(e){} };
 window.argentLire=lire;
 window.argentMessage=toast;
 /** Payer un jeu : renvoie false et prévient s'il n'y a pas assez d'argent. */
 window.argentPayer=function(n,quoi){
  if(lire()<n){ toast("Pas assez d'argent ("+n+" €)"); return false; }
  window.argentAjouter(-n); toast("-"+n+" €"+(quoi?" · "+quoi:"")); return true;
 };
 /** Gagner ou perdre à la fin d'un jeu. */
 window.argentGain=function(n){ if(!n) return; window.argentAjouter(n); toast((n>0?"+":"")+n+" €"); };
 // pour plus tard : gagner ou dépenser depuis le jeu
 window.argentAjouter=function(n){
  try{ if(window.Chambre&&window.Chambre.ajouterArgent){ window.Chambre.ajouterArgent(n); maj(); return; } }catch(e){}
  try{ localStorage.setItem("rudy_argent",String(Math.max(0,lire()+n))); }catch(e){}
  maj();
 };
})();
</script></body></html>
