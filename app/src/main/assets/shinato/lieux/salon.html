<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le salon de thé</title>
<style>
:root{--fond:#120c08;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){--fond:#120c08}
:root[data-theme="dark"]{--fond:#120c08}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--fond);overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#f6e3bd}
body{height:100%}
#vue{position:fixed;inset:0;overflow:hidden;touch-action:none;display:flex;align-items:flex-start}
#vue::-webkit-scrollbar{display:none}
#vue.drag{cursor:grabbing}
#scene{position:relative;flex:none;user-select:none;-webkit-user-select:none}
#scene>img.fond{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.perso{position:absolute;pointer-events:none}
.perso .corps{position:absolute;inset:0;transform-origin:50% 100%;animation:souffle 4s ease-in-out infinite}
.perso .corps.equilibre{animation:equilibre 2.4s ease-in-out infinite}
.perso img{position:absolute;left:0;bottom:0;height:100%;width:auto;opacity:0;filter:sepia(.08) saturate(1.03) brightness(.95)}
.perso img.on{opacity:1}
.clip{position:absolute;overflow:hidden;pointer-events:none}
.devant{position:absolute;pointer-events:none;background-size:100% 100%}
.ombre{position:absolute;left:12%;width:76%;bottom:-1.5%;height:4.5%;border-radius:50%;background:radial-gradient(closest-side,rgba(20,8,4,.6),rgba(20,8,4,0))}
@keyframes souffle{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.008)}}
@keyframes equilibre{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
#aide{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:15px;font-style:italic;background:rgba(20,10,8,.75);padding:8px 16px;border-radius:20px;transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
#aide.cache{opacity:0}
@media (prefers-reduced-motion:reduce){.perso .corps{animation:none!important}}
.wrap{touch-action:none}
#toile{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5}
.flecheSortie{position:absolute;z-index:8;pointer-events:none;display:none;width:3%;aspect-ratio:100/120;transform-origin:50% 50%;
 filter:drop-shadow(0 0 6px rgba(255,225,40,1)) drop-shadow(0 0 16px rgba(255,200,0,.8));animation:clign .7s ease-in-out infinite alternate}
@keyframes clign{from{opacity:1}to{opacity:.55}}
#joy{position:fixed;left:4.5vmin;bottom:5vmin;width:30vmin;height:30vmin;border-radius:50%;z-index:20;touch-action:none;
 background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.10),rgba(0,0,0,.34));border:2px solid rgba(255,226,122,.45);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#stick{position:absolute;left:50%;top:50%;width:13vmin;height:13vmin;margin:-6.5vmin 0 0 -6.5vmin;border-radius:50%;
 background:radial-gradient(circle at 42% 36%,#fbf0c6,#c9a33c 60%,#7d6118);box-shadow:0 4px 12px rgba(0,0,0,.6)}
#zoneJoy{position:fixed;left:0;bottom:0;width:44vw;height:62vh;z-index:19;touch-action:none}
#actions{position:fixed;right:4.5vmin;bottom:6vmin;display:flex;flex-direction:column;gap:2.6vmin;z-index:20}
.btn{display:none;min-width:26vmin;padding:2.4vmin 3vmin;border-radius:3vmin;text-align:center;font:900 clamp(13px,3.1vmin,26px)/1 Arial,sans-serif;letter-spacing:2px;color:#ffe27a;
 background:linear-gradient(rgba(12,12,14,.9),rgba(30,30,34,.9));border:2px solid rgba(255,226,122,.95);box-shadow:0 5px 16px rgba(0,0,0,.55),0 0 14px rgba(255,214,60,.4);user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.94)}
#toile{z-index:500}
.flecheSortie{z-index:900;width:3.6%}

#bulleRosa{position:absolute;z-index:950;left:9.5%;top:23%;width:min(46vw,260px);padding:10px 14px;background:#fff;color:#111;border:3px solid #111;border-radius:22px;
 font:800 clamp(12px,2.6vmin,22px)/1.25 'Comic Sans MS','Chalkboard SE','Marker Felt',Arial,sans-serif;box-shadow:4px 4px 0 rgba(0,0,0,.55);display:none}
#bulleRosa:after{content:'';position:absolute;left:8%;bottom:-20px;border:12px solid transparent;border-top:20px solid #111}
#bulleRosa:before{content:'';position:absolute;left:calc(8% + 3px);bottom:-13px;border:9px solid transparent;border-top:15px solid #fff;z-index:1}
#choixRosa{position:fixed;z-index:40;right:4.5vmin;bottom:6vmin;display:none;flex-direction:column;gap:2vmin;width:min(62vw,440px)}
#choixRosa .btn{display:block;white-space:normal;line-height:1.25;letter-spacing:1px}
#videoRosa{position:fixed;inset:0;z-index:960;background:#000;display:none}
#videoRosa video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

.bulleS{position:absolute;z-index:950;width:min(46vw,260px);padding:10px 14px;background:#fff;color:#111;border:3px solid #111;border-radius:22px;
 font:800 clamp(12px,2.6vmin,22px)/1.25 'Comic Sans MS','Chalkboard SE','Marker Felt',Arial,sans-serif;box-shadow:4px 4px 0 rgba(0,0,0,.55);display:none;transform:translateX(-50%)}
.bulleS:after{content:'';position:absolute;left:50%;margin-left:-12px;bottom:-20px;border:12px solid transparent;border-top:20px solid #111}
.bulleS:before{content:'';position:absolute;left:50%;margin-left:-9px;bottom:-13px;border:9px solid transparent;border-top:15px solid #fff;z-index:1}
.bulleS.rudy{background:#eaf6ff}
.bulleS.rudy:before{border-top-color:#eaf6ff}
#choixBlanche{position:fixed;z-index:40;right:4.5vmin;bottom:6vmin;display:none;flex-direction:column;gap:2vmin;min-width:44vmin}
#choixBlanche .btn{display:block}
#choixChat{position:fixed;z-index:40;right:4.5vmin;bottom:6vmin;display:none;flex-direction:column;gap:2vmin;width:min(62vw,440px)}
#choixChat .btn{display:block;white-space:normal;line-height:1.25;letter-spacing:1px}
#choixCmdB{position:fixed;z-index:40;right:4.5vmin;bottom:6vmin;display:none;flex-direction:column;gap:2vmin;width:min(62vw,440px)}
#choixCmdB .btn{display:block}
#choixBarmaid{position:fixed;z-index:40;right:4.5vmin;bottom:6vmin;display:none;flex-direction:column;gap:2vmin;width:min(62vw,440px)}
#choixBarmaid .btn{display:block;white-space:normal;line-height:1.25;letter-spacing:1px}
</style>
</head>

  }
  toile.style.zIndex=Math.round(RUDY.y)+1; majUI(); camera();
}

function appui(el,fn){ if(!el) return; let t=0; const go=e=>{ if(e&&e.cancelable) e.preventDefault(); const n=performance.now(); if(n-t<350) return; t=n; fn(); };

/* joystick : 4 directions */
(function(){
  const z=document.getElementById('zoneJoy'), joy=document.getElementById('joy'), stick=document.getElementById('stick');
  let actif=null, ox=0, oy=0, R=0;
  const touche=e=>[].slice.call(e.changedTouches).filter(t=>t.identifier===actif)[0];
  function bouge(cx,cy){ const dx=cx-ox, dy=cy-oy, d=Math.min(Math.hypot(dx,dy),R*0.62), a=Math.atan2(dy,dx);
    stick.style.transform='translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px)';
    const m=Math.hypot(dx,dy); if(m<R*0.18){ jx=jy=0; return; } jx=dx/m; jy=dy/m; }
  function lache(){ actif=null; jx=jy=0; stick.style.transform='translate(0,0)'; }
  [z,joy].forEach(el=>{
    el.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; actif=t.identifier; const r=joy.getBoundingClientRect(); R=r.width/2;
      if(el===joy){ ox=r.left+R; oy=r.top+R; } else { ox=t.clientX; oy=t.clientY; } bouge(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
    el.addEventListener('touchmove',e=>{ const t=touche(e); if(t){ bouge(t.clientX,t.clientY); e.preventDefault(); } },{passive:false});
    el.addEventListener('touchend',e=>{ if(touche(e)) lache(); }); el.addEventListener('touchcancel',lache);
    el.addEventListener('mousedown',e=>{ const r=joy.getBoundingClientRect(); R=r.width/2; ox=r.left+R; oy=r.top+R; actif='souris'; bouge(e.clientX,e.clientY);
      const m=ev=>bouge(ev.clientX,ev.clientY), u=()=>{ lache(); removeEventListener('mousemove',m); removeEventListener('mouseup',u); };
      addEventListener('mousemove',m); addEventListener('mouseup',u); });
  });
  const K={}; const majK=()=>{ jx=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0); jy=(K.ArrowDown?1:0)-(K.ArrowUp?1:0); };
  addEventListener('keydown',e=>{ if(e.key.startsWith('Arrow')){ K[e.key]=true; majK(); } });
  addEventListener('keyup',e=>{ if(e.key.startsWith('Arrow')){ K[e.key]=false; majK(); } });
  addEventListener('blur',lache); document.addEventListener('visibilitychange',lache);
})();

window.RUDY=RUDY;
})();
