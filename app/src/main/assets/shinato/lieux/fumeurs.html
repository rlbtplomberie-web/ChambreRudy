<script>
const IM={"decor": "/assets/shinato/m/fumeurs_885f5ef114ab34.webp", "femme": "/assets/shinato/m/fumeurs_824e6d5333df65.webp", "homme": "/assets/shinato/m/fumeurs_000c75f61be2e3.webp", "barman": "/assets/shinato/m/fumeurs_314addcd84685f.webp"};
const TIPS={"femme": [[0.6769, 0.1798], [0.6332, 0.1826], [0.5895, 0.188], [0.6681, 0.1662], [0.6245, 0.1717], [0.7467, 0.1744], [0.8952, 0.3569], [0.8996, 0.3951], [0.9301, 0.4196], [0.9782, 0.3924], [0.6157, 0.1635], [0.5852, 0.1608]], "homme": [[0.7689, 0.2466], [0.67, 0.19], [0.6274, 0.187], [0.71, 0.17], [0.8113, 0.1897], [0.8302, 0.1978], [0.97, 0.38], [0.9811, 0.393], [0.9292, 0.4282], [0.8868, 0.1924], [0.6792, 0.1626], [0.64, 0.16]]};
// tailles d'une case dans chaque planche
const SH={femme:{fw:229,fh:367,cols:3},homme:{fw:212,fh:369,cols:3},barman:{fw:384,fh:421,cols:4}};
// repères dans l'image du décor (1774 x 887)
const DW=1774,DH=887,COUNTER=440;
const img={};let ready=0;
for(const k in IM){const i=new Image();i.onload=()=>ready++;i.src=IM[k];img[k]=i}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr,sc,ox,oy;
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 sc=Math.max(W/DW,H/DH);ox=(W-DW*sc)/2;oy=(H-DH*sc)/2;
}
addEventListener('resize',resize);resize();

/* personnages */
// la fumeuse et le fumeur sont sur deux tabourets éloignés, le barman au centre
const smokers=[
 {k:'femme',x:500,seat:522,h:325,frame:0,t:0,seq:[0,1,2,3,4,4,5,6,7,8,9,9,10,11],dur:[.5,.45,.45,.45,.6,.9,.4,.45,.5,.5,.55,1.4,.45,.45],i:0,emit:0,phase:0},
 {k:'homme',x:1287,seat:522,h:327,frame:0,t:0,seq:[0,1,2,3,4,5,6,7,8,8,9,10,11,11],dur:[.5,.45,.5,.5,.45,.5,.45,.5,.5,1.3,.5,.45,.45,.9],i:5,emit:0,phase:1.3}
];
const barman={x:905,h:205,seq:[0,1,2,3,4,5,6,7],dur:[1.2,1.1,1,1,1.3,1.4,1.1,1.6],i:0,t:0};
smokers.forEach(s=>{s.t=Math.random()*.4});

/* fumée */
let smoke=[];
function puff(x,y,n,big){
 for(let i=0;i<n;i++)smoke.push({x:x+(Math.random()-.5)*(big?14:3),y:y+(Math.random()-.5)*(big?8:2),
  vx:(Math.random()-.5)*(big?26:6)+(big?18:3),vy:-(big?14:20)-Math.random()*(big?14:16),
  r:(big?9:3)+Math.random()*(big?6:2),gr:big?20:9,a:big?.62:.5+Math.random()*.12,life:big?2.6:3.2+Math.random()*1.2,t:0,ph:Math.random()*6,big})
}
// position (dans le décor) du bout de la cigarette pour la case affichée
function spriteRect(s){const m=SH[s.k],k=s.h/m.fh;return{x:s.x-m.fw*k/2,y:s.seat-.63*m.fh*k,w:m.fw*k,h:s.h,k}}
function tipPos(s){const r=spriteRect(s),tp=TIPS[s.k][s.frame];return{x:r.x+tp[0]*r.w,y:r.y+tp[1]*r.h}}
const atMouth=f=>[0,1,2,3,4,10,11].includes(f);

function update(dt,now){
 for(const s of smokers){
  s.t+=dt;
  if(s.t>=s.dur[s.i]){s.t=0;const prev=s.seq[s.i];s.i=(s.i+1)%s.seq.length;
   // il souffle la fumée quand il éloigne la cigarette de sa bouche
   if(atMouth(prev)&&!atMouth(s.seq[s.i])){const r=spriteRect(s);s.exhale={t:0,x:r.x+r.w*.62,y:r.y+r.h*.13}}
  }
  s.frame=s.seq[s.i];
  // filet de fumée continu au bout de la cigarette
  s.emit-=dt;if(s.emit<=0){s.emit=.05+Math.random()*.04;const p=tipPos(s);puff(p.x,p.y,1,false)}
  if(s.exhale){s.exhale.t+=dt;if(s.exhale.t<.9&&Math.random()<.7)puff(s.exhale.x+s.exhale.t*30,s.exhale.y-s.exhale.t*6,1,true);if(s.exhale.t>1)s.exhale=null}
 }
 barman.t+=dt;if(barman.t>=barman.dur[barman.i]){barman.t=0;barman.i=(barman.i+1)%barman.seq.length}
 for(const p of smoke){p.t+=dt;p.x+=(p.vx+Math.sin(now*1.3+p.ph+p.t)*9)*dt;p.y+=p.vy*dt;p.vy*=.995;p.vx*=.99;p.r+=p.gr*dt}
 smoke=smoke.filter(p=>p.t<p.life);
}

/* dessin */
const D=(x,y)=>[ox+x*sc,oy+y*sc];
function drawFrame(name,f,x,y,w,h){const m=SH[name],c=m.cols;ctx.drawImage(img[name],(f%c)*m.fw,(f/c|0)*m.fh,m.fw,m.fh,ox+x*sc,oy+y*sc,w*sc,h*sc)}
function draw(now){
 // décor
 ctx.drawImage(img.decor,ox,oy,DW*sc,DH*sc);
 // barman derrière le comptoir
 const bm=SH.barman,bk=barman.h/bm.fh,bw=bm.fw*bk,bob=Math.sin(now*2.2)*1.6;
 ctx.save();ctx.beginPath();ctx.rect(0,0,W,oy+COUNTER*sc);ctx.clip();
 drawFrame('barman',barman.seq[barman.i],barman.x-bw/2,COUNTER-barman.h+bob+4,bw,barman.h);
 ctx.restore();
 // le comptoir et tout ce qui est devant sont redessinés par-dessus le barman
 ctx.drawImage(img.decor,0,COUNTER,DW,DH-COUNTER,ox,oy+COUNTER*sc,DW*sc,(DH-COUNTER)*sc);
 // fumeurs
 for(const s of smokers){
  const r=spriteRect(s),breath=Math.sin(now*1.6+s.phase)*1.2;
  // ombre sous le tabouret
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();const [ex,ey]=D(s.x,668);ctx.ellipse(ex,ey,62*sc,9*sc,0,0,7);ctx.fill();
  drawFrame(s.k,s.frame,r.x,r.y+breath*.3,r.w,r.h+breath*.3);
  // braise au bout de la cigarette, plus vive quand il tire dessus
  const p=tipPos(s),hot=atMouth(s.frame)?1:.55,fl=.75+.25*Math.sin(now*17+s.phase);
  const [tx,ty]=D(p.x,p.y);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(tx,ty,0,tx,ty,7*sc*hot*fl+2);g.addColorStop(0,`rgba(255,170,60,${.9*hot})`);g.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(tx,ty,7*sc*hot*fl+2,0,7);ctx.fill();ctx.restore();
  ctx.fillStyle=`rgba(255,${120+80*fl|0},40,${.85*hot})`;ctx.beginPath();ctx.arc(tx,ty,Math.max(1,1.6*sc),0,7);ctx.fill();
 }
 dessineRudy();
 // fumée
 for(const p of smoke){
  const k=p.t/p.life,a=p.a*(k<.12?k/.12:1)*(1-k)*(1-k);
  const [x,y]=D(p.x,p.y),r=p.r*sc;
  const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(235,235,240,${a})`);g.addColorStop(.6,`rgba(220,220,228,${a*.55})`);g.addColorStop(1,'rgba(220,220,228,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
 }
 // lumière chaude des lampes qui respire un peu
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(const [lx,ly] of [[207,95],[1568,95]]){const [x,y]=D(lx,ly),a=.07+.02*Math.sin(now*1.7+lx);const g=ctx.createRadialGradient(x,y,0,x,y,330*sc);g.addColorStop(0,`rgba(255,190,110,${a})`);g.addColorStop(1,'rgba(255,190,110,0)');ctx.fillStyle=g;ctx.fillRect(x-330*sc,y-330*sc,660*sc,660*sc)}
 ctx.restore();
}

/* ================= Rudy dans le bar fumeur (planche de Rudy du Pixel Bar) ================= */
const RB={"droite": {"img": ["/assets/shinato/m/ef1f0b8c2cc9473b.webp", "/assets/shinato/m/8f16b04582ccd18f.webp", "/assets/shinato/m/b76af52210dcf554.webp", "/assets/shinato/m/335b72042ef27bbc.webp", "/assets/shinato/m/50c8697489c2c907.webp", "/assets/shinato/m/cbd0a1ad22fab3ba.webp", "/assets/shinato/m/680d616f4c29d575.webp", "/assets/shinato/m/3316119779970e96.webp", "/assets/shinato/m/47efa18c2f9698a9.webp"], "w": 134, "h": 206, "ax": 63.612575574365174, "ay": 203.0}, "gauche": {"img": ["/assets/shinato/m/6f1bf8da705a8911.webp", "/assets/shinato/m/f02a3a5feed4f7c4.webp", "/assets/shinato/m/ede9f664436f25f2.webp", "/assets/shinato/m/51aa1ca8a5dd4922.webp", "/assets/shinato/m/9600fe3909581e0b.webp", "/assets/shinato/m/037ddbda857ff35b.webp", "/assets/shinato/m/946210da6e0395a1.webp", "/assets/shinato/m/ba4398dc080de701.webp", "/assets/shinato/m/70e4515f71136159.webp"], "w": 130, "h": 197, "ax": 63.97493036211699, "ay": 195.0}, "haut": {"img": ["/assets/shinato/m/8a8dcc61508e73cc.webp", "/assets/shinato/m/0625bc5499c17775.webp", "/assets/shinato/m/d130e78bd96cbf58.webp", "/assets/shinato/m/85e77196dae0a364.webp", "/assets/shinato/m/f112a083b3eac8ab.webp", "/assets/shinato/m/fe5eff60eeb2ac4d.webp", "/assets/shinato/m/6be13897791b903d.webp", "/assets/shinato/m/dd80719f53df96e6.webp", "/assets/shinato/m/38e6d2bce0ca6363.webp"], "w": 89, "h": 218, "ax": 44.04040242733951, "ay": 215.0}, "bas": {"img": ["/assets/shinato/m/d67456269af20e2b.webp", "/assets/shinato/m/d227cf6f358b0526.webp", "/assets/shinato/m/0f7f9a1e518986f4.webp", "/assets/shinato/m/0a266f69d86aa01d.webp", "/assets/shinato/m/d513893fbe84847c.webp", "/assets/shinato/m/6f705304ece6820d.webp", "/assets/shinato/m/ff9a36731da1dafd.webp", "/assets/shinato/m/4d7a4f90f39f828c.webp", "/assets/shinato/m/3e7f67122e98fbfb.webp"], "w": 100, "h": 241, "ax": 50.24630667345899, "ay": 238.0}, "assis": {"img": ["/assets/shinato/m/c2897267725b6fce.webp", "/assets/shinato/m/6c16b182b2297475.webp", "/assets/shinato/m/3806d22560147fe0.webp", "/assets/shinato/m/755e4485bb1d4aa7.webp", "/assets/shinato/m/03dd25cd32a0c056.webp", "/assets/shinato/m/21671642476137e5.webp", "/assets/shinato/m/b3ef0833a4cca78d.webp", "/assets/shinato/m/fcca5a1cab60305a.webp", "/assets/shinato/m/818ec2f65015b80f.webp", "/assets/shinato/m/b8e35166f15e965c.webp", "/assets/shinato/m/d16ab3e5c6706fcf.webp", "/assets/shinato/m/80e9b128b6dfee36.webp", "/assets/shinato/m/ec15122f13294a6c.webp", "/assets/shinato/m/80b6b61289cc8f29.webp", "/assets/shinato/m/e96ec3ea688d7a5f.webp", "/assets/shinato/m/b84c4bcfc3a3401c.webp", "/assets/shinato/m/b6df68a3bbd962e6.webp", "/assets/shinato/m/edfd0fdf96e499eb.webp"], "w": 185, "h": 337, "ax": 87.21307961733494, "ay": 334.0}};
for(const k in RB) RB[k].fr=RB[k].img.map(u=>{const i=new Image();i.src=u;return i;});
const FX0=490, FX1=1320, FY0=705, FY1=815;       // le carrelage entre les deux tables
const SORTIE_X=887;
// les tabourets libres (les deux autres sont pris par les fumeurs) : on peut s'y asseoir, comme au Pixel Bar
const LIBRES=[697,893,1093], SIEGE_Y=522;                              // on ressort par devant (vers la rue), au milieu
const R={x:SORTIE_X,y:FY1-14,dir:'haut',pas:0,bouge:false,etat:'debout',chaise:null,t0:0,idx:0};
function tailleR(y){return 360+(y-705)*0.9}
let jx=0,jy=0,occupe=false;
function dessineAssis(i,al){
  const Pq=RB.assis, im=Pq.fr[i%Pq.fr.length]; if(!im.complete||!im.naturalWidth||al<=0) return;
  const now=performance.now()/1000, h=325, k=h/Pq.h, br=1+0.005*Math.sin(now*1.6);
  ctx.save(); ctx.translate(ox,oy); ctx.scale(sc,sc); ctx.globalAlpha=al;
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(R.chaise,668,62,9,0,0,7);ctx.fill();
  ctx.translate(R.chaise,SIEGE_Y); ctx.scale(1,br);
  ctx.drawImage(im,-Pq.ax*k,-(Pq.h*0.63)*k,Pq.w*k,Pq.h*k); ctx.restore();
}
function dessineRudy(){
  const now=performance.now()/1000;
  if(R.etat==='assis'){
    const hold=1.25, F=0.4; let el=now-R.t0;                    // les gestes s'enchaînent en fondu, comme au Pixel Bar
    if(el>hold+F){R.idx=(R.idx+1)%RB.assis.fr.length;R.t0=now;el=0}
    let t=el>hold?(el-hold)/F:0; t=t*t*(3-2*t);
    dessineAssis(R.idx,t<0.5?1:2-2*t); dessineAssis(R.idx+1,t<0.5?2*t:1); return;
  }
  if(R.etat==='sassoit'||R.etat==='seleve'){                     // fondu entre Rudy debout (de dos) et Rudy assis
    const t=Math.min(1,(now-R.t0)/0.5), a=R.etat==='sassoit'?1-t:t;
    const gx=R.x, gy=R.y, gd=R.dir; R.x=R.chaise; R.y=FY0+4; R.dir=R.etat==='sassoit'?'haut':'bas'; R.bouge=false;
    ctx.save(); ctx.globalAlpha=a; dessineDebout(); ctx.restore(); R.x=gx; R.y=gy; R.dir=gd;
    dessineAssis(0,R.etat==='sassoit'?t:1-t);
    if(t>=1){ if(R.etat==='sassoit'){R.etat='assis';R.t0=now;R.idx=0;}
              else {R.etat='debout';R.x=R.chaise;R.y=FY0+4;R.dir='bas';R.chaise=null;} }
    return;
  }
  dessineDebout();
}
function dessineDebout(){
  const set=R.dir, Pq=RB[set], h=tailleR(R.y), k=h/Pq.h;
  const i=R.bouge?Math.floor(R.pas/(h*0.13)):0, ph=R.bouge?R.pas/(h*0.34):null;
  const im=Pq.fr[i%Pq.fr.length]; if(!im.complete||!im.naturalWidth) return;
  ctx.save(); ctx.translate(ox,oy); ctx.scale(sc,sc);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(R.x,R.y,h*0.17,h*0.035,0,0,7);ctx.fill();
  const X=R.x-Pq.ax*k, Y=R.y-Pq.ay*k;
  if((set==='droite'||set==='gauche')&&ph!=null){
    const ouv=0.30+0.70*Math.abs(Math.cos(ph*Math.PI)), bob=-Math.abs(Math.sin(ph*Math.PI))*h*0.018;
    const hanche=Math.round(Pq.h*0.50), N=14, bas=Pq.h-hanche;
    ctx.drawImage(im,0,0,Pq.w,hanche,X,Y+bob,Pq.w*k,hanche*k);
    for(let n=0;n<N;n++){ const s0=hanche+bas*n/N, s1=hanche+bas*(n+1)/N, f=(n+0.5)/N, sx=1-(1-ouv)*f;
      ctx.drawImage(im,0,s0,Pq.w,s1-s0+0.6,X+Pq.ax*k-Pq.ax*k*sx,Y+s0*k+bob*(1-f),Pq.w*k*sx,(s1-s0)*k+0.6); }
  } else ctx.drawImage(im,X,Y,Pq.w*k,Pq.h*k);
  ctx.restore();
}
const bS=document.getElementById('sortirF'), flF=document.getElementById('flecheF');
function avanceRudy(dt){
  let ax=jx,ay=jy; if(clav.l)ax=-1; if(clav.r)ax=1; if(clav.u)ay=-1; if(clav.d)ay=1; if(occupe||R.etat!=='debout'){ax=ay=0;}
  const m=Math.hypot(ax,ay);
  if(m>0.2){
    const v=260*Math.min(1,m), nx=Math.max(FX0,Math.min(FX1,R.x+ax/m*v*dt)), ny=Math.max(FY0,Math.min(FY1,R.y+ay/m*v*dt*0.45));
    R.pas+=Math.hypot(nx-R.x,ny-R.y); R.x=nx; R.y=ny; R.bouge=true;
    R.dir=Math.abs(ax)>=Math.abs(ay)*0.8?(ax>0?'droite':'gauche'):(ay>0?'bas':'haut');
  } else R.bouge=false;
  const pres=R.etat==='debout'&&R.y>FY1-8&&Math.abs(R.x-SORTIE_X)<200&&!occupe; bS.style.display=pres?'flex':'none'; flF.style.display=pres?'block':'none';
  majAssis();
  if(pres){ const fw=Math.max(30,34*sc*2.4), fh=fw*46/34; Object.assign(flF.style,{left:(ox+R.x*sc)+'px',top:Math.min(innerHeight-fh-6,oy+(R.y+8)*sc)+'px',width:fw+'px',height:fh+'px'}); }
}
const bA=document.getElementById('assisF'), bL=document.getElementById('leverF');
let chaiseVue=null;
function chaiseProche(){
  if(R.etat!=='debout'||occupe||R.y>(chaiseVue!==null?765:745)){chaiseVue=null;return null}
  const lim=chaiseVue!==null?85:60; let best=null;
  for(const c of LIBRES){const d=Math.abs(c-R.x); if(d<lim&&(best===null||d<Math.abs(best-R.x)))best=c}
  chaiseVue=best; return best;
}
function majAssis(){ bA.style.display=chaiseProche()!==null?'flex':'none'; bL.style.display=R.etat==='assis'&&!occupe?'flex':'none'; bPF.style.display=devantBarman()?'flex':'none'; }
function appuiF(el,fn){let t=0;el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const n=performance.now();if(n-t<400)return;t=n;fn();});}
appuiF(bA,()=>{ const c=chaiseProche(); if(c===null)return; js(); for(const k in clav)clav[k]=0; R.bouge=false; R.chaise=c; R.etat='sassoit'; R.t0=performance.now()/1000; chaiseVue=null; majAssis(); });
appuiF(bL,()=>{ if(R.etat!=='assis')return; R.etat='seleve'; R.t0=performance.now()/1000; majAssis(); });
// ===== PARLER au barman : sa vidéo, puis PARTICIPER AU CONCOURS (le jeu Kingspeed) ou PAS POUR LE MOMENT =====
let enJeu=false;
const bPF=document.getElementById('parlerF'), bulleF=document.getElementById('bulleF'), choixF=document.getElementById('choixF');
const vboxF=document.getElementById('vidF'), vidF=vboxF.querySelector('video'), jeuF=document.getElementById('jeuF');
const BARMAN_X=905;
function devantBarman(){ return R.etat==='debout'&&!occupe&&R.y<760&&Math.abs(R.x-BARMAN_X)<120; }
function libereF(){ occupe=false; js(); for(const k in clav)clav[k]=0; }
function bulleBarman(txt){
  bulleF.textContent=txt; bulleF.style.display='block'; bulleF.style.animation='none'; void bulleF.offsetWidth; bulleF.style.animation='';
  const bw=bulleF.offsetWidth, cx=ox+BARMAN_X*sc, x=Math.max(bw/2+8,Math.min(innerWidth-bw/2-8,cx));
  bulleF.style.left=x+'px'; bulleF.style.top=Math.max(bulleF.offsetHeight+12,oy+250*sc)+'px';
}
appuiF(bPF,()=>{ if(!devantBarman())return; occupe=true; js(); for(const k in clav)clav[k]=0; R.bouge=false; R.dir='haut'; bPF.style.display='none';
  musique.pause();
  vidF.src='/assets/shinato/m/fumeurs_barman.mp4'; vboxF.style.display='block'; vidF.currentTime=0;
  let fait=false;
  const fin=()=>{ if(fait)return; fait=true; vidF.onended=null; vidF.onerror=null; vidF.pause(); vboxF.style.display='none'; choixF.style.display='flex'; };
  vidF.onended=fin; vidF.onerror=fin; const q=vidF.play(); if(q&&q.catch) q.catch(fin); });
appuiF(document.getElementById('chPasMaintenant'),()=>{ choixF.style.display='none'; lanceMusiqueForce();
  bulleBarman("OK, pas de souci ! Ce sera pour la prochaine fois.");
  setTimeout(()=>{ bulleF.style.display='none'; libereF(); },2000); });
appuiF(document.getElementById('chConcours'),()=>{ choixF.style.display='none';
  const f=document.createElement('iframe'); f.setAttribute('allow','autoplay; fullscreen'); f.src='/assets/shinato/jeux/kingspeed.html';
  jeuF.appendChild(f); jeuF.style.display='block'; enJeu=true; setTimeout(()=>{try{f.focus();}catch(e){}},300); });
// ✕ : on quitte le concours quand le doigt se relève, on revient dans le bar devant le barman
(function(){ const q=document.getElementById('quitJeuF'); let a=false;
  q.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();a=true;});
  q.addEventListener('pointercancel',()=>{a=false;});
  q.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();if(!a)return;a=false;
    const f=jeuF.querySelector('iframe'); if(f){ try{f.src='about:blank';}catch(_){} f.remove(); }
    jeuF.style.display='none'; enJeu=false; last=performance.now(); lanceMusiqueForce(); libereF(); try{window.focus();}catch(_){} });
})();
// la musique : la même que dans le bar Le Baril, elle démarre dès l'entrée
const musique=new Audio('/assets/shinato/m/baril_612d49cfb0e3fc.mp3'); musique.loop=true; musique.volume=0.22;
function lanceMusiqueForce(){ const q=musique.play(); if(q&&q.catch) q.catch(()=>{}); }
function lanceMusique(){ if(occupe||!musique.paused)return; const q=musique.play(); if(q&&q.catch) q.catch(()=>{}); }
lanceMusique(); addEventListener('pointerdown',lanceMusique);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) musique.pause(); else if(!enJeu) lanceMusique(); });
// SORTIR : on sort quand le doigt se relève, la musique du bar s'arrête
let arme=false;
bS.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();arme=true;});
bS.addEventListener('pointercancel',()=>{arme=false;});
bS.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();if(!arme)return;arme=false;occupe=true;js();for(const k in clav)clav[k]=0;
  try{musique.pause();}catch(_){}
  setTimeout(()=>{try{window.parent.postMessage({type:'fumeurs:sortie'},'*');}catch(_){}},60);});
// joystick + clavier
const joy=document.getElementById('joyF'),knob=document.getElementById('knobF');let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),Rr=r.width/2;let dx=e.clientX-r.left-Rr,dy=e.clientY-r.top-Rr;const dd=Math.hypot(dx,dy),mm=Rr*0.62;if(dd>mm){dx*=mm/dd;dy*=mm/dd;}knob.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/mm;jy=dy/mm;}
function js(){jid=null;jx=jy=0;knob.style.transform='';}
joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();jid=e.pointerId;try{joy.setPointerCapture(jid)}catch(_){}jm(e);lanceMusique();});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e);});
joy.addEventListener('pointerup',e=>{if(e.pointerId===jid)js();});joy.addEventListener('pointercancel',e=>{if(e.pointerId===jid)js();});
const clav={};const T={ArrowLeft:'l',KeyA:'l',KeyQ:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',KeyZ:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{if(T[e.code])clav[T[e.code]]=1;});addEventListener('keyup',e=>{if(T[e.code])clav[T[e.code]]=0;});
addEventListener('blur',()=>{js();for(const k in clav)clav[k]=0;});
let last=performance.now();
function loop(t){const now=t/1000,dt=Math.min(.05,(t-last)/1000);last=t;
 if(enJeu){ if(cv.style.visibility!=='hidden') cv.style.visibility='hidden'; }   // le concours est lancé : le bar est caché et en pause
 else { if(cv.style.visibility) cv.style.visibility=''; if(ready>=4){avanceRudy(dt);update(dt,now);draw(now)} }
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// plein écran au toucher (téléphone)
if(window.parent===window)addEventListener('pointerdown',()=>{try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(e){}},{once:true});
