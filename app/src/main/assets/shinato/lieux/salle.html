const treeCv=document.createElement('canvas');treeCv.width=TW;treeCv.height=TH;const tc=treeCv.getContext('2d');
let treeReady=false,bgData=null,treeImg=null,tIdx=null,tAmp=null,tX=null,tY=null;
function initTrees(){
  try{
    const a=document.createElement('canvas');a.width=2048;a.height=768;const ac=a.getContext('2d');
    ac.drawImage(bg,0,0);bgData=ac.getImageData(0,0,2048,768).data;
    const m=document.createElement('canvas');m.width=TW;m.height=TH;const mc=m.getContext('2d');
    mc.drawImage(maskT,0,0);const md=mc.getImageData(0,0,TW,TH).data;
    treeImg=tc.createImageData(TW,TH);const d=treeImg.data;
    const idx=[],amp=[],xs=[],ys=[];
    for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){
      const i=(y*TW+x)*4,al=md[i+3]||md[i];
      if(al>3){const X=x+TX0,Y=y+TY0;
        const top=X<1060?300:(X<1700?334:304);
        const f=Math.min(1,Math.max(0,(396-Y)/(396-top)));
        idx.push(i);amp.push(Math.pow(f,1.15));xs.push(X);ys.push(Y);d[i+3]=al;}
    }
    tIdx=Int32Array.from(idx);tAmp=Float32Array.from(amp);tX=Int16Array.from(xs);tY=Int16Array.from(ys);
    treeReady=true;
  }catch(e){treeReady=false;}
}
function drawTrees(t){
  if(!treeReady){if(bg.complete&&maskT.complete&&bg.naturalWidth)initTrees();if(!treeReady)return;}
  const d=treeImg.data,s=bgData,n=tIdx.length;
  const gust=.55+.45*Math.sin(t*.31)*Math.sin(t*.17+1.3);
  for(let k=0;k<n;k++){
    const X=tX[k],Y=tY[k];
    const w=Math.sin(t*1.05+X*.011)*.65+Math.sin(t*2.2+X*.043+Y*.07)*.35;
    const dx=tAmp[k]*(1.5*gust*w+.35);
    const sx=X-dx,x0=sx|0,fr=sx-x0,j=(Y*2048+x0)*4,i=tIdx[k];
    d[i]=s[j]+(s[j+4]-s[j])*fr;d[i+1]=s[j+1]+(s[j+5]-s[j+1])*fr;d[i+2]=s[j+2]+(s[j+6]-s[j+2])*fr;
  }
  tc.putImageData(treeImg,0,0);
  c.drawImage(treeCv,TX0,TY0-OY);
}
const lights=A.lights.map(([x,y,w,h,col,dk])=>{
  const t=R(); return {x,y:y-OY,w,h,col,dk,type:t<.62?0:(t<.9?1:2),ph:R()*9,f:.3+R()*.7,off:R()<.15,next:2+R()*25,lvl:0};
});
const beacons=[[719,206],[777,222],[1124,210],[1424,212],[1612,232],[1773,244],[480,232],[343,236],[1323,246]].map(([x,y])=>({x,y:y-OY,ph:R()*6}));
const clouds=[];for(let i=0;i<6;i++)clouds.push({x:R()*2300-150,y:12+R()*80,w:220+R()*320,h:18+R()*26,v:3+R()*5,a:.05+R()*.06});
const cars=[];
function newCar(init){const right=R()<.55;return {x:init?880+R()*780:(right?860:1660),y:(right?331.5:333.5)-OY,v:(right?1:-1)*(22+R()*26),right,len:2+R()*2};}
for(let i=0;i<16;i++)cars.push(newCar(true));
const spark=[];
let plane=null,nextPlane=4,shoot=null,nextShoot=9;
let last=performance.now()/1000;

function frame(ms){
  const t=ms/1000,dt=Math.min(.05,t-last);last=t;

  /* --- coach : poses + respiration --- */
  if(t>until){
    let step;
    if(forced&&forced.length) step=forced.shift(); else {forced=null;step=SEQ[si];si=(si+1)%SEQ.length;}
    pose(step[0]); until=t+step[1];
  }
  const br=Math.sin(t*2*Math.PI/4.2), sway=Math.sin(t*2*Math.PI/9.5);
  const tr='translateY('+(-br*.8).toFixed(2)+'px) rotate('+(sway*.35).toFixed(3)+'deg) scale('+(1-br*.0025).toFixed(4)+','+(1+br*.0065).toFixed(4)+')';
  coach.style.transform=tr;
  refl.style.transform='scaleY(-1) '+tr;
  $('shadow').style.transform='scaleX('+(1+sway*.03).toFixed(3)+')';

  /* --- fenêtres --- */
  if(maskV.complete&&maskW.complete&&bg.complete){
    c.globalCompositeOperation='source-over';
    c.clearRect(0,0,2048,270);

    // nuages fins qui dérivent
    for(const k of clouds){
      k.x+=k.v*dt; if(k.x>2200){k.x=-k.w-50;k.y=12+R()*80;}
      const g=c.createRadialGradient(k.x+k.w/2,k.y,0,k.x+k.w/2,k.y,k.w/2);
      g.addColorStop(0,'rgba(150,165,215,'+k.a+')');g.addColorStop(1,'rgba(150,165,215,0)');
      c.save();c.translate(0,k.y);c.scale(1,k.h/k.w*2);c.translate(0,-k.y);
      c.fillStyle=g;c.fillRect(k.x,k.y-k.w/2,k.w,k.w);c.restore();
    }
    // étoiles qui scintillent
    for(const s of stars){
      const a=Math.pow(Math.max(0,Math.sin(t*s.f+s.ph)),3)*.9+.08;
      c.fillStyle='rgba(235,240,255,'+a.toFixed(3)+')';
      c.beginPath();c.arc(s.x,s.y,s.s*.75,0,7);c.fill();
      if(s.big&&a>.6){c.strokeStyle='rgba(220,230,255,'+((a-.6)*1.3).toFixed(3)+')';c.lineWidth=.6;
        c.beginPath();c.moveTo(s.x-4,s.y);c.lineTo(s.x+4,s.y);c.moveTo(s.x,s.y-4);c.lineTo(s.x,s.y+4);c.stroke();}
    }
    // étoile filante
    if(!shoot&&t>nextShoot){shoot={x:500+R()*1300,y:10+R()*50,vx:(R()<.5?-1:1)*(380+R()*200),vy:120+R()*80,life:0};}
    if(shoot){shoot.life+=dt;shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;
      const a=Math.max(0,1-shoot.life/.9);
      const g=c.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*.12,shoot.y-shoot.vy*.12);
      g.addColorStop(0,'rgba(255,255,255,'+a+')');g.addColorStop(1,'rgba(255,255,255,0)');
      c.strokeStyle=g;c.lineWidth=1.4;c.beginPath();c.moveTo(shoot.x,shoot.y);c.lineTo(shoot.x-shoot.vx*.12,shoot.y-shoot.vy*.12);c.stroke();
      if(shoot.life>.9){shoot=null;nextShoot=t+12+R()*18;}}
    // avion qui traverse avec ses feux
    if(!plane&&t>nextPlane){const d=R()<.5?1:-1;plane={x:d>0?280:1990,y:30+R()*55,d,v:28+R()*10};}
    if(plane){plane.x+=plane.d*plane.v*dt;plane.y-=dt*1.2;
      const blink=(t*1.1)%1<.12, strobe=(t*1.1+.5)%1<.06;
      c.fillStyle='rgba(255,240,210,.85)';c.beginPath();c.arc(plane.x,plane.y,1.1,0,7);c.fill();
      if(blink){c.fillStyle='rgba(255,60,50,.95)';c.beginPath();c.arc(plane.x-plane.d*3,plane.y+1,1.6,0,7);c.fill();}
      if(strobe){c.fillStyle='rgba(255,255,255,1)';c.beginPath();c.arc(plane.x+plane.d*3,plane.y,2,0,7);c.fill();}
      if(plane.x<240||plane.x>2010){plane=null;nextPlane=t+18+R()*20;}}

    // fenêtres des immeubles : certaines s'allument / s'éteignent, télés qui clignotent
    for(const L of lights){
      if(L.type===1&&t>L.next){L.off=!L.off;L.next=t+(L.off?4+R()*16:6+R()*30);}
      const target=L.off?1:0; L.lvl+=(target-L.lvl)*Math.min(1,dt*2.2);
      if(L.lvl>.02){c.fillStyle='rgba('+L.dk[0]+','+L.dk[1]+','+L.dk[2]+','+(L.lvl*.92).toFixed(3)+')';c.fillRect(L.x-.5,L.y-.5,L.w+1,L.h+1);}
      let glow=0;
      if(L.type===0) glow=.18+.12*Math.sin(t*L.f+L.ph);
      else if(L.type===2){glow=.25+.35*Math.abs(Math.sin(t*7.3+L.ph)*Math.sin(t*2.1+L.ph*2));}
      glow*=(1-L.lvl);
      if(glow>.02){c.globalCompositeOperation='lighter';
        const col=L.type===2?[120,170,255]:L.col;
        c.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+glow.toFixed(3)+')';c.fillRect(L.x-1,L.y-1,L.w+2,L.h+2);
        c.globalCompositeOperation='source-over';}
    }
    // balises rouges en haut des tours
    c.globalCompositeOperation='lighter';
    for(const b of beacons){const a=Math.pow(Math.max(0,Math.sin(t*2.2+b.ph)),6);
      if(a>.02){const g=c.createRadialGradient(b.x,b.y,0,b.x,b.y,6);g.addColorStop(0,'rgba(255,40,30,'+a+')');g.addColorStop(1,'rgba(255,40,30,0)');
        c.fillStyle=g;c.fillRect(b.x-6,b.y-6,12,12);}}
    // voitures sur la route au bord du lac
    for(let i=0;i<cars.length;i++){const k=cars[i];k.x+=k.v*dt;
      if(k.x>1670||k.x<850){cars[i]=newCar(false);continue;}
      const col=k.right?'255,235,190':'255,60,40';
      c.fillStyle='rgba('+col+',.9)';c.fillRect(k.x,k.y,k.len,1.2);
      c.fillStyle='rgba('+col+',.25)';c.fillRect(k.x-(k.right?6:-k.len),k.y-.4,6,2);}
    c.globalCompositeOperation='source-over';

    // lac : vaguelettes et reflets
    wc.globalCompositeOperation='source-over';wc.clearRect(0,0,2048,270);
    for(let y=332;y<=360;y++){
      const dx=Math.sin(t*1.7+y*1.15)*1.5+Math.sin(t*.8-y*.45)*1.1;
      wc.drawImage(bg,880,y,770,1,880+dx,y-OY,770,1);
    }
    if(R()<.5)spark.push({x:900+R()*740,y:336+R()*20-OY,life:0,d:.6+R()*.9});
    wc.globalCompositeOperation='lighter';
    for(let i=spark.length-1;i>=0;i--){const s=spark[i];s.life+=dt;const a=Math.sin(Math.PI*s.life/s.d)*.45;
      if(s.life>s.d){spark.splice(i,1);continue;}
      wc.fillStyle='rgba(255,220,160,'+a.toFixed(3)+')';wc.fillRect(s.x-2,s.y,4,1);}
    wc.globalCompositeOperation='destination-in';wc.drawImage(maskW,0,0);
    c.drawImage(water,0,0);

    // arbres qui bougent au vent
    c.globalCompositeOperation='source-over';drawTrees(t);

    // ne rien dessiner sur les machines / murs : on ne garde que la vue
    c.globalCompositeOperation='destination-in';c.drawImage(maskV,0,0);
    c.globalCompositeOperation='source-over';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script>
/* ================= Rudy dans la salle (la planche du fumeur : marcher, fumer, jeter) ================= */
(function(){
const IMG=(function(){ for(const w of [window.parent,window.top]){ try{ if(w&&w.RUDY_IMAGES) return w.RUDY_IMAGES; }catch(e){} } return null; })()||{"marche":["/assets/shinato/m/f66b7486849bf5b6.webp","/assets/shinato/m/cc08b27eef23e5a1.webp","/assets/shinato/m/8d7a4da973184d42.webp","/assets/shinato/m/c3af9ca2675d2358.webp","/assets/shinato/m/e69420c5e154a6e8.webp","/assets/shinato/m/1e7d270f5c81b1d7.webp"],"marchecig":["/assets/shinato/m/d67e7594cc42e870.webp","/assets/shinato/m/03ece0389ddde297.webp","/assets/shinato/m/b151e5b2b7a95417.webp","/assets/shinato/m/9b0eb765d4393a26.webp","/assets/shinato/m/d754aefb2c136d92.webp","/assets/shinato/m/25ffc9231580075c.webp"],"fumer":["/assets/shinato/m/bedcf36925325251.webp","/assets/shinato/m/4ebd35da82f3a2e9.webp","/assets/shinato/m/f7881a04b223dd0e.webp","/assets/shinato/m/7ffc91a79091a2b6.webp","/assets/shinato/m/fa8228dd48637425.webp","/assets/shinato/m/43eb2067b32c9926.webp","/assets/shinato/m/8108a6212954d8a4.webp","/assets/shinato/m/af7011fab2bf9118.webp"],"jeter":["/assets/shinato/m/c641f840c39566aa.webp","/assets/shinato/m/305939c97e25c315.webp","/assets/shinato/m/f9d3aa2a9eb1e230.webp","/assets/shinato/m/30b1d03ab2b1509e.webp","/assets/shinato/m/787b5557b3a151cc.webp","/assets/shinato/m/2d3b6b31173af9a5.webp","/assets/shinato/m/2644b102ac4560ca.webp","/assets/shinato/m/506c07a78b8481f4.webp","/assets/shinato/m/ab9a2f2011d3f12f.webp"]};
Object.keys(IMG).forEach(k=>IMG[k].forEach(src=>{ const i=new Image(); i.src=src; }));
const XMIN=70, XMAX=1760, YMIN=560, YMAX=740;       // le sol de la salle (le coach est tout à droite)
const SORTIE=150;                                   // tout à gauche : SORTIR
const rudy=$('rudyS'), ombre=$('ombreS'), fl=$('flecheS'), bS=$('sortirS'), bF=$('fumerS'), bJ=$('jeterS'), sc=$('scroller');
let etat='repos', clope=false, sens=1, x=110, y=700, f=0, phase=0, dir=0, dirY=0, tPrec=0, parcours=0, fini=false;
const DUREE={fumer:300,jeter:190,repos:520,reposcig:600}, VITESSE=1.25, PAS_M=0.17;
const hR=()=>(300+(y-YMIN)*(389-300)/(718-YMIN))*0.82;   // le coach est un peu plus grand que Rudy
function planche(){ if(etat==='fumer'||etat==='jeter') return etat; if(etat==='marche') return clope?'marchecig':'marche'; return 'repos'; }
function images(){ const p=planche(); if(p==='repos') return clope?IMG.fumer.slice(4):[IMG.fumer[0]]; return IMG[p]; }
function duree(){ const p=planche(); if(p==='repos') return clope?DUREE.reposcig:DUREE.repos; return DUREE[p]; }
function pose(src){
  if(src&&rudy.getAttribute('src')!==src) rudy.src=src;
  const h=hR(), hi=h*800/660, bas=y+h*30/660;
  rudy.style.height=hi+'px'; rudy.style.top=(bas-hi)+'px'; rudy.style.left=x+'px';
  rudy.style.transform='translateX(-50%) scaleX('+sens+')';
  ombre.style.left=x+'px'; ombre.style.top=y+'px'; ombre.style.width=(h*0.55)+'px'; ombre.style.height=(h*0.10)+'px';
}
function majB(){ bF.classList.toggle('off',clope||etat==='fumer'||etat==='jeter'); bJ.classList.toggle('off',!clope||etat==='fumer'||etat==='jeter'); }
function fume(){ if(clope||etat==='fumer'||etat==='jeter') return; etat='fumer'; f=0; phase=0; dir=dirY=0; majB(); }
function jette(){ if(!clope||etat==='fumer'||etat==='jeter') return; etat='jeter'; f=0; phase=0; dir=dirY=0; majB(); }
// en téléphone portrait, l'image glisse : on garde Rudy au milieu de l'écran
function cadre(){ if(!sc.classList.contains('pan')) return; const k=$('stage').getBoundingClientRect().width/2048;
  const cible=Math.max(0,Math.min(sc.scrollWidth-sc.clientWidth,x*k-sc.clientWidth/2)); sc.scrollLeft+= (cible-sc.scrollLeft)*0.18; }
function boucle(t){
  requestAnimationFrame(boucle);
  if(!tPrec) tPrec=t; const dt=Math.min((t-tPrec)/1000,0.05); tPrec=t; if(fini) return;
  const h=hR(), libre=(etat==='repos'||etat==='marche');
  if(libre){
    if(dir!==0||dirY!==0){
      if(dir!==0) sens=dir>0?1:-1;
      if(etat!=='marche'){ etat='marche'; parcours=0; }
      const ax=x, ay=y;
      x=Math.max(XMIN,Math.min(XMAX,x+dir*VITESSE*h*dt));
      y=Math.max(YMIN,Math.min(YMAX,y+dirY*VITESSE*0.45*h*dt));
      parcours+=Math.hypot(x-ax,(y-ay)*1.6);
    } else if(etat==='marche'){ etat='repos'; phase=0; f=0; }
  } else if(etat==='jeter'){ x=Math.max(XMIN,Math.min(XMAX,x+sens*VITESSE*0.55*h*dt)); }
  let jeu=images();
  if(etat==='marche') pose(jeu[Math.floor(parcours/(PAS_M*h))%jeu.length]);
  else{
    phase+=dt*1000/duree();
    if(phase>=1){ phase-=1; f++;
      if(f>=jeu.length){ if(etat==='fumer'){ clope=true; etat='repos'; f=0; majB(); } else if(etat==='jeter'){ clope=false; etat='repos'; f=0; majB(); } else f=0; jeu=images(); } }
    pose(jeu[Math.min(f,jeu.length-1)]);
  }
  // tout à gauche : la flèche jaune vers la gauche et SORTIR
  const ici=x<=SORTIE;
  fl.style.display=ici?'block':'none'; bS.style.display=ici?'block':'none';
  if(ici){ fl.style.left=(x-10)+'px'; fl.style.top=(y-h*1.12)+'px'; }
  cadre();
}
requestAnimationFrame(boucle); pose(IMG.fumer[0]); majB();
setTimeout(()=>{ if(sc.classList.contains('pan')) sc.scrollLeft=0; },50);   // on arrive tout à gauche
function appui(el,fn){ let t0=0; el.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); const n=Date.now(); if(n-t0<350) return; t0=n; fn(); }); }
appui(bF,fume); appui(bJ,jette);
// SORTIR : on ressort quand le doigt se relève, en face de la salle à Chaliaville
let arme=false;
bS.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); arme=true; });
bS.addEventListener('pointercancel',()=>{ arme=false; });
bS.addEventListener('pointerup',e=>{ e.preventDefault(); if(!arme) return; arme=false; fini=true; dir=dirY=0;
  try{ parent.postMessage({type:'salle:sortie'},'*'); }catch(err){} });
// joystick : toutes les directions
const joy=$('joyS'), knob=$('knobS'); let jid=null;
function jm(e){ const r=joy.getBoundingClientRect(), R=r.width/2; let dx=e.clientX-r.left-R, dy=e.clientY-r.top-R; const d=Math.hypot(dx,dy), mm=R*0.62; if(d>mm){ dx*=mm/d; dy*=mm/d; }
  knob.style.transform='translate('+dx+'px,'+dy+'px)'; const m=Math.hypot(dx,dy); if(m<mm*0.18){ dir=dirY=0; return; } dir=dx/m; dirY=dy/m; if(Math.abs(dir)<0.2) dir=0; if(Math.abs(dirY)<0.2) dirY=0; }
function js(){ jid=null; dir=dirY=0; knob.style.transform=''; }
joy.addEventListener('pointerdown',e=>{ e.preventDefault(); jid=e.pointerId; try{ joy.setPointerCapture(jid); }catch(_){} jm(e); });
joy.addEventListener('pointermove',e=>{ if(e.pointerId===jid) jm(e); });
['pointerup','pointercancel','lostpointercapture'].forEach(n=>joy.addEventListener(n,e=>{ if(e.pointerId===jid) js(); }));
addEventListener('pointerdown',e=>{ if(e.isPrimary&&jid!==null&&e.pointerId!==jid) js(); },true);
addEventListener('blur',js);
const K={}; const mk=()=>{ dir=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0); dirY=(K.ArrowDown?1:0)-(K.ArrowUp?1:0); };
addEventListener('keydown',e=>{ if(e.key.startsWith('Arrow')){ K[e.key]=true; mk(); } else if(e.key==='f'||e.key==='F') fume(); else if(e.key==='j'||e.key==='J') jette(); });
addEventListener('keyup',e=>{ if(e.key.startsWith('Arrow')){ K[e.key]=false; mk(); } });
})();
