let joyX=0,joyY=0,dernier=performance.now()/1000;
function taille(y){return 300+(y-545)*0.55}
function camera(){const minX=W-SW*S,minY=H-SH*S;
 OX=Math.max(minX,Math.min(0,W/2-RUDY.x*S));OY=Math.max(minY,Math.min(0,H*0.58-RUDY.y*S))}
function dessine(set,i,x,y,phase){
 const R=RB[set],im=R.fr[i%R.fr.length];if(!im.complete)return;
 const h=taille(y),k=h/R.h,X=x-R.ax*k,Y=y-R.ay*k;
 ctx.save();ctx.filter='brightness(0.9) sepia(0.12)';
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y,h*0.17,h*0.035,0,0,7);ctx.fill();
 if((set==='droite'||set==='gauche')&&phase!=null){
  // de profil, la planche a presque toujours le même pas : on fait marcher les jambes
  const ouv=0.30+0.70*Math.abs(Math.cos(phase*Math.PI)),bob=-Math.abs(Math.sin(phase*Math.PI))*h*0.018;
  const hanche=Math.round(R.h*0.50),N=14,bas=R.h-hanche;
  ctx.drawImage(im,0,0,R.w,hanche,X,Y+bob,R.w*k,hanche*k);
  for(let n=0;n<N;n++){const s0=hanche+bas*n/N,s1=hanche+bas*(n+1)/N,f=(n+0.5)/N,sx=1-(1-ouv)*f;
   ctx.drawImage(im,0,s0,R.w,s1-s0+0.6,x-R.ax*k*sx,Y+s0*k+bob*(1-f),R.w*k*sx,(s1-s0)*k+0.6)}
 }else ctx.drawImage(im,X,Y,R.w*k,R.h*k);
 ctx.restore();
}
function rudy(t){
 const dt=Math.min(0.05,t-dernier);dernier=t;
 const m=Math.hypot(joyX,joyY);
 if(m>0.18){const v=260*Math.min(1,m);
  const nx=Math.max(ZONE.x0,Math.min(ZONE.x1,RUDY.x+joyX/m*v*dt)),ny=Math.max(ZONE.y0,Math.min(ZONE.y1,RUDY.y+joyY/m*v*dt));
  RUDY.pas+=Math.hypot(nx-RUDY.x,ny-RUDY.y);RUDY.x=nx;RUDY.y=ny;
  RUDY.dir=Math.abs(joyX)>Math.abs(joyY)?(joyX>0?'droite':'gauche'):(joyY>0?'bas':'haut');RUDY.bouge=true}
 else RUDY.bouge=false;
 const h=taille(RUDY.y);
 dessine(RUDY.dir,RUDY.bouge?Math.floor(RUDY.pas/(h*0.13)):0,RUDY.x,RUDY.y,RUDY.bouge?RUDY.pas/(h*0.34):null);
 bS.style.display=prochesortie()?'block':'none';
 bJ.style.display=devantChef()?'block':'none';
}
// devant le cuisinier (au comptoir) : bouton JOUER -> Le Glouton ; RETOUR (en haut à gauche) ramène ici

function fleche(t){

 const h=taille(RUDY.y),x=RUDY.x-50+Math.sin(t*6)*10,y=RUDY.y-h-45;

 ctx.beginPath();ctx.moveTo(x-40,y-18);ctx.lineTo(x,y-18);ctx.lineTo(x,y-42);ctx.lineTo(x+48,y);ctx.lineTo(x,y+42);ctx.lineTo(x,y+18);ctx.lineTo(x-40,y+18);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}

}});

  try{window.parent.postMessage({type:'dragon:sortie'},'*')}catch(err){}};

(function(){const joy=document.getElementById('joy'),st=document.getElementById('stick');let id=null,cx=0,cy=0,R=0;
 function prend(e){const t=e.changedTouches?e.changedTouches[0]:e;const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;R=r.width/2;id=e.changedTouches?t.identifier:'s';bouge(e)}
 function bouge(e){if(id===null)return;const t=e.changedTouches?[...e.changedTouches].find(u=>u.identifier===id):e;if(!t)return;
  let dx=t.clientX-cx,dy=t.clientY-cy;const d=Math.min(Math.hypot(dx,dy),R*0.62),a=Math.atan2(dy,dx);
  st.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;joyX=Math.cos(a)*d/(R*0.62);joyY=Math.sin(a)*d/(R*0.62);e.preventDefault()}
 function lache(){id=null;joyX=joyY=0;st.style.transform='translate(0,0)'}
 joy.addEventListener('touchstart',prend,{passive:false});joy.addEventListener('touchmove',bouge,{passive:false});
 joy.addEventListener('touchend',lache);joy.addEventListener('touchcancel',lache);
 joy.addEventListener('mousedown',e=>{prend(e);const mv=ev=>bouge(ev),up=()=>{lache();removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};addEventListener('mousemove',mv);addEventListener('mouseup',up)});
 const K={};addEventListener('keydown',e=>{K[e.key]=1;maj()});addEventListener('keyup',e=>{K[e.key]=0;maj()});
 function maj(){joyX=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0);joyY=(K.ArrowDown?1:0)-(K.ArrowUp?1:0)}
})();

<script>
/* ---------- zone du stick élargie (partie gauche du bas de l'écran), centre sous le doigt ---------- */
(function(){
 var joy=document.getElementById("joy"), st=document.getElementById("stick"); if(!joy) return;
 var z=document.createElement("div"); z.id="zoneJoy";
 z.style.cssText="position:fixed;left:0;bottom:0;width:44vw;height:62vh;z-index:19;touch-action:none";
 document.body.appendChild(z);
 var actif=null, ox=0, oy=0, R=0;
 function pos(e){ return [].slice.call(e.changedTouches).filter(function(t){return t.identifier===actif})[0]; }
 z.addEventListener("touchstart",function(e){ var t=e.changedTouches[0]; actif=t.identifier; R=joy.getBoundingClientRect().width/2;
  ox=t.clientX; oy=t.clientY; if(e.cancelable) e.preventDefault(); },{passive:false});
 z.addEventListener("touchmove",function(e){ var t=pos(e); if(!t) return;
  var dx=t.clientX-ox, dy=t.clientY-oy, d=Math.min(Math.hypot(dx,dy),R*0.62), a=Math.atan2(dy,dx);
  st.style.transform="translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px)";
  joyX=Math.cos(a)*d/(R*0.62); joyY=Math.sin(a)*d/(R*0.62); if(e.cancelable) e.preventDefault(); },{passive:false});
 function fin(e){ if(pos(e)){ actif=null; joyX=0; joyY=0; st.style.transform="translate(0,0)"; } }
 z.addEventListener("touchend",fin); z.addEventListener("touchcancel",fin);
})();
</script>
<script>
/* ---------- l'argent : en haut à droite, dans la chambre et dans toutes les rues ----------
   (il ne s'affiche pas dans les mini-jeux ni dans les émulateurs) */
(function(){
 if(window.__argentPose) return; window.__argentPose=true;
 var css=document.createElement("style");
 css.textContent="#argentHUD{position:fixed;top:max(6px,env(safe-area-inset-top,0px));right:8px;z-index:25;display:flex;align-items:center;gap:5px;"+
  "padding:3px 8px 3px 4px;border-radius:999px;background:rgba(10,10,14,.62);border:1px solid rgba(255,226,122,.55);"+
  "pointer-events:none;font:800 13px/1 Arial,Helvetica,sans-serif;color:#ffe27a;text-shadow:0 1px 2px #000}"+
  "#argentHUD img{width:22px;height:21px;display:block}";
 document.head.appendChild(css);
 var d=document.createElement("div"); d.id="argentHUD";
 d.innerHTML='<img alt="" src="/assets/shinato/m/f4b8c806f85db77a.webp"><span>0 €</span>';
 var txt=d.querySelector("span");
 function pose(){ if(document.body){ document.body.appendChild(d); } else setTimeout(pose,50); }
 pose();
 function lire(){
  try{ if(window.Chambre&&window.Chambre.argent) return parseInt(window.Chambre.argent(),10)||0; }catch(e){}
  try{ var v=localStorage.getItem("rudy_argent"); return v===null?1000:(parseInt(v,10)||0); }catch(e){}
  return 1000;
 }
 function maj(){ var n=lire(); txt.textContent=n.toLocaleString("fr-FR")+" €"; }
 maj(); setInterval(maj,1000);
 window.addEventListener("pageshow",maj);
 document.addEventListener("visibilitychange",function(){ if(!document.hidden) maj(); });

 function toast(txt){
  var t=document.getElementById("argentMsg");
  if(!t){ t=document.createElement("div"); t.id="argentMsg";
   t.style.cssText="position:fixed;top:44px;right:8px;z-index:26;padding:7px 12px;border-radius:12px;background:rgba(10,10,14,.9);"+
    "border:2px solid rgba(255,226,122,.8);color:#ffe27a;font:800 13px Arial,sans-serif;pointer-events:none;opacity:0;transition:opacity .25s";
   document.body.appendChild(t); }
  t.textContent=txt; t.style.opacity="1"; clearTimeout(t.__t); t.__t=setTimeout(function(){ t.style.opacity="0"; },1700);
 }

 /** La vie de Rudy (0 à 100). Elle ne se remplit plus toute seule : il faut l'infirmerie. */
 window.vieLire=function(){ try{ var v=localStorage.getItem("rudy_vie"); var n=v===null?100:parseInt(v,10); return Math.max(0,Math.min(100,isNaN(n)?100:n)); }catch(e){ return 100; } };
 window.vieEcrire=function(n){ try{ localStorage.setItem("rudy_vie",String(Math.max(0,Math.min(100,Math.round(n))))); }catch(e){} };
 window.argentLire=lire;
 window.argentMessage=toast;
 /** Payer un jeu : renvoie false et prévient s'il n'y a pas assez d'argent. */
 window.argentPayer=function(n,quoi){
  if(lire()<n){ toast("Pas assez d'argent ("+n+" €)"); return false; }
  window.argentAjouter(-n); toast("-"+n+" €"+(quoi?" · "+quoi:"")); return true;
 };
 /** Gagner ou perdre à la fin d'un jeu. */
 window.argentGain=function(n){ if(!n) return; window.argentAjouter(n); toast((n>0?"+":"")+n+" €"); };
 // pour plus tard : gagner ou dépenser depuis le jeu
 window.argentAjouter=function(n){
  try{ if(window.Chambre&&window.Chambre.ajouterArgent){ window.Chambre.ajouterArgent(n); maj(); return; } }catch(e){}
  try{ localStorage.setItem("rudy_argent",String(Math.max(0,lire()+n))); }catch(e){}
  maj();
 };
})();
