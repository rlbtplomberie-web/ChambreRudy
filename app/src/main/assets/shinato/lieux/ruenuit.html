    if(src) videoHotel(src,vb=>{ vb.remove(); hopital(); }); else hopital(); }
});
/* ================= La zombie cachée derrière le supermarché : REGARDER → 3 choix → vidéo → l'hôpital ================= */
(function(){
  const ZOMBIE_X=1175;
  const CHOIX=[                          // les 3 vidéos sont réparties au hasard ; elle ne parle pas
    {nom:'❓ Voir ce qui se passe',   video:'/assets/shinato/m/rue_zombie_voir.mp4'},
    {nom:'🔍 Regarder de plus près',  video:'/assets/shinato/m/rue_zombie_pres.mp4'},
    {nom:'💬 Essayer de lui parler',  video:'/assets/shinato/m/rue_zombie_parler.mp4'}
  ];
  const act=document.getElementById('actions'), bR=document.getElementById('regarderZ');
  const choix=document.createElement('div'); choix.id='choixZombie'; document.body.appendChild(choix);
  const vb=document.createElement('div'); vb.id='videoZombie'; vb.style.cssText='position:fixed;inset:0;z-index:60;background:#000;display:none';
  vb.innerHTML='<video playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></video>';
  document.body.appendChild(vb); const vid=vb.querySelector('video');
  function app(el,fn){ let t=0; const go=e=>{ if(e&&e.cancelable) e.preventDefault(); const n=performance.now(); if(n-t<350) return; t=n; fn(); };
    el.addEventListener('touchstart',go,{passive:false}); el.addEventListener('click',go); }
  let occupe=false;
  setInterval(()=>{ bR.style.display=(!occupe&&!dedans&&Math.abs(x-ZOMBIE_X)<110)?'block':'none'; },150);
  // à la fin de la vidéo : Rudy est blessé → la chambre d'hôpital avec l'infirmière
  function hopital(){ try{ vid.pause(); }catch(e){} vb.style.display='none'; occupe=false; x=300; sens=1;
    try{ parent.postMessage({type:'ruenuit:hopital'},'*'); }catch(e){} }
  vid.addEventListener('ended',hopital); vid.addEventListener('error',hopital);
  function fin(){ choix.style.display='none'; act.style.visibility=''; }
  app(bR,()=>{
    occupe=true; dir=0; choix.innerHTML='';
    CHOIX.forEach(C=>{ const b=document.createElement('div'); b.className='btn'; b.textContent=C.nom; choix.appendChild(b);
      app(b,()=>{ fin(); vid.src=C.video; vb.style.display='block'; const q=vid.play(); if(q&&q.catch) q.catch(()=>{}); }); });
    const non=document.createElement('div'); non.className='btn'; non.textContent='Laisser tomber'; non.style.opacity='.75'; choix.appendChild(non);
    app(non,()=>{ fin(); occupe=false; });
    choix.style.display='flex'; act.style.visibility='hidden';
  });
})();
