<!doctype html>
<html lang="fr">
<head><script>window.vieLire=function(){try{var v=localStorage.getItem("rudy_vie");var n=v===null?100:parseInt(v,10);return Math.max(0,Math.min(100,isNaN(n)?100:n))}catch(e){return 100}};window.vieEcrire=function(n){try{localStorage.setItem("rudy_vie",String(Math.max(0,Math.min(100,Math.round(n)))))}catch(e){}};</script>
<meta charset="utf-8"><meta name="color-scheme" content="dark only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chambre d'hôpital</title>
<style>
:root{--bg:#05070d;--panel:rgba(14,19,36,.96);--line:#2c3860;--text:#e6ebf7;--dim:#8d97b5;--accent:#9fb4ff;--pink:#f3a6bd;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070d;--text:#e6ebf7}}
:root[data-theme="dark"]{--bg:#05070d;--text:#e6ebf7}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
canvas{display:block;width:min(100%,calc((100dvh - 230px) * 16 / 9));aspect-ratio:16/9;border-radius:6px}
.box{width:min(100%,calc((100dvh - 230px) * 16 / 9));min-width:min(100%,560px);min-height:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative}
.who{font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--pink)}
.who.rudy{color:var(--accent)}
.text{font-size:clamp(17px,2.2vw,21px);line-height:1.45;min-height:3em}
.next{position:absolute;right:16px;bottom:10px;color:var(--dim);font-size:14px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choices button{font:inherit;font-size:clamp(16px,2vw,18px);flex:1 1 220px;padding:12px 14px;border-radius:8px;border:1px solid var(--accent);
  background:rgba(159,180,255,.08);color:var(--text);cursor:pointer;text-align:left}
.choices button:hover{background:rgba(159,180,255,.18)}
.choices button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.end{display:flex;gap:10px;flex-wrap:wrap}
.end button{font:inherit;font-weight:700;font-size:17px;padding:11px 22px;border-radius:8px;border:0;background:var(--accent);color:#0b1020;cursor:pointer}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.next{animation:none}}
@media (orientation:landscape) and (max-height:520px){
  body{flex-direction:row;align-items:stretch;padding:6px}
  canvas{width:auto;height:calc(100dvh - 12px);max-width:66vw;align-self:center}
  .box{width:auto;flex:1;min-width:0;min-height:0}
}
</style>

<body>
<canvas id="c" width="1536" height="864" aria-label="Rudy dans sa chambre d'hôpital, l'infirmière à son chevet"></canvas>
<div class="box" id="box" role="dialog" aria-live="polite">
  <div class="who" id="who">Infirmière</div>
  <div class="text" id="text"></div>
  <div class="choices hidden" id="choices"></div>
  <div class="end hidden" id="end"><button id="again">Recommencer</button></div>
  <div class="next hidden" id="next">Toucher pour continuer ▾</div>
</div>
<script type="application/json" id="data">{"room": "/assets/shinato/m/842e3e7e4a02e425.webp", "fg": "/assets/shinato/m/c37a1ce7c761dc08.webp", "fgPos": [470, 423], "S": 0.8, "poses": [{"src": "/assets/shinato/m/b4921bd98e7ca855.webp", "x": 566.4, "y": 120.0}, {"src": "/assets/shinato/m/f813e7d64ac63f45.webp", "x": 538.4, "y": 147.0}, {"src": "/assets/shinato/m/ce1ad728fd8ffc8c.webp", "x": 334.6, "y": 130.0}, {"src": "/assets/shinato/m/1d1125cbd3e29157.webp", "x": 567.6, "y": 121.2}, {"src": "/assets/shinato/m/ff5b085e079d4e7c.webp", "x": 566.4, "y": 156.8}, {"src": "/assets/shinato/m/3128263a17a8b6da.webp", "x": 591.8, "y": 116.2}]}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent),cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* poses : 0 dossier, 1 penchée contente, 2 main sur le visage, 3 doigt levé, 4 rire yeux fermés, 5 dossier yeux fermés */
const N='Infirmière',R='Rudy';
const SCRIPT={
  q1:{pose:0,who:N,text:"Comment ça vous est arrivé ?",choices:[["Je me suis battu.","fight"],["Je suis tombé sur vous.","fell"]]},
  fight:{pose:3,who:N,text:"Vous vous êtes battu ? Il faut être plus prudent…",next:"q2a"},
  q2a:{pose:0,who:N,text:"Et comment vous sentez-vous ?",choices:[["Je vais mieux.","better"],["J'ai encore mal.","pain"]]},
  fell:{pose:4,who:N,text:"Hi hi… C'est mignon.",next:"q2b"},
  q2b:{pose:3,who:N,text:"Mais sérieusement, comment vous sentez-vous ?",choices:[["Je vais mieux.","better"],["J'ai encore mal.","pain"]]},
  pain:{pose:2,who:N,text:"Ça va aller… Je suis là.",choices:[["C'est vous qui me rendez fort.","end1"],["Merci.","end1"]]},
  better:{pose:1,who:N,text:"Ah, vous êtes fort !",choices:[["C'est vous qui me rendez fort.","end1"],["Merci.","end1"]]},
  end1:{pose:5,who:N,text:"Je pense que vous êtes guéri. Vous pouvez sortir…",next:"end2"},
  end2:{pose:0,who:N,text:"Mais faites attention à vous. Ce n'est pas que je ne veux pas vous revoir… c'est pour que vous fassiez attention à vous.",end:true}
};
let room,fg,poses=[],cur=0,prev=-1,fadeT=1,t0=performance.now();
let node=null,shown=0,full='',typing=false,pending=null;
function setPose(i){if(i===cur)return;prev=cur;cur=i;fadeT=0}
function show(id){node=SCRIPT[id];pending=null;setPose(node.pose);say(node.who,node.text)}
function say(who,text){$('who').textContent=who;$('who').className='who'+(who===R?' rudy':'');full=text;shown=0;typing=true;
  $('text').textContent='';['choices','end','next'].forEach(i=>$(i).classList.add('hidden'))}
function finishTyping(){typing=false;$('text').textContent=full;
  if(pending){$('next').classList.remove('hidden');return}
  if(node.choices){const c=$('choices');c.innerHTML='';node.choices.forEach(([label,to])=>{const b=document.createElement('button');b.textContent=label;
      b.onclick=e=>{e.stopPropagation();pending=to;say(R,label)};c.appendChild(b)});c.classList.remove('hidden');c.firstChild.focus()}
  else if(node.end){$('end').classList.remove('hidden');$('again').focus()}
  else $('next').classList.remove('hidden')}
function advance(){if(typing){finishTyping();return}
  if(pending){show(pending);return}
  if(node&&node.next)show(node.next)}
$('box').addEventListener('click',advance);cv.addEventListener('click',advance);
$('again').onclick=e=>{e.stopPropagation();show('q1')};
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;e.preventDefault();advance()}});
function drawPose(i,alpha,t){const p=D.poses[i],im=poses[i],w=im.width*D.S,h=im.height*D.S;
  const br=reduce?0:Math.sin(t*1.7+i)*.006;ctx.globalAlpha=alpha;ctx.drawImage(im,p.x,p.y-h*br,w,h*(1+br));ctx.globalAlpha=1}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
  if(fadeT<1)fadeT=Math.min(1,fadeT+dt/.4);
  if(typing){shown+=dt*38;const n=Math.floor(shown);$('text').textContent=full.slice(0,n);if(n>=full.length)finishTyping()}
  ctx.drawImage(room,0,0);
  if(prev>=0&&fadeT<1)drawPose(prev,1-fadeT,t);
  drawPose(cur,fadeT<1&&prev>=0?fadeT:1,t);
  ctx.drawImage(fg,D.fgPos[0],D.fgPos[1]);
  requestAnimationFrame(frame)}
Promise.all([load(D.room),load(D.fg),...D.poses.map(p=>load(p.src))]).then(([r,f,...ps])=>{room=r;fg=f;poses=ps;show('q1');requestAnimationFrame(frame)});
})();
</script>
<style>#sortieHop{font:inherit;font-weight:700;font-size:17px;padding:11px 22px;border-radius:8px;border:1px solid #9fb4ff;background:#9fb4ff;color:#05070d;cursor:pointer;touch-action:none}</style>
<script>
/* ---- fin de la scène : retour devant l'hôpital de Vaviel ---- */
(function(){
 document.addEventListener("contextmenu",function(e){e.preventDefault()},{capture:true});
 function part(){try{window.parent.postMessage({type:"hopital:fin"},"*")}catch(e){}}
 var fin=document.getElementById("end"); if(!fin) return;
 var a=document.getElementById("again"); if(a) a.style.display="none";          // pas de « Recommencer » : on sort de l'hôpital
 var b=document.createElement("button"); b.id="sortieHop"; b.textContent="Sortir de l'hôpital"; fin.appendChild(b);
 var t=0; function go(e){ if(e.cancelable)e.preventDefault(); e.stopPropagation(); var n=Date.now(); if(n-t<500)return; t=n; part(); }
 b.addEventListener("pointerdown",go); b.addEventListener("touchstart",go,{passive:false}); b.addEventListener("click",go);
 var vu=false; new MutationObserver(function(){ if(!fin.classList.contains("hidden")&&!vu){ vu=true; setTimeout(part,3000); } }).observe(fin,{attributes:true,attributeFilter:["class"]});
})();
</script>
<script>
/* ---------- l'argent : en haut à droite, dans la chambre et dans toutes les rues ----------
   (il ne s'affiche pas dans les mini-jeux ni dans les émulateurs) */
(function(){
 if(window.__argentPose) return; window.__argentPose=true;
 var css=document.createElement("style");
 css.textContent="#argentHUD{position:fixed;top:max(6px,env(safe-area-inset-top,0px));right:8px;z-index:25;display:flex;align-items:center;gap:5px;"+
  "padding:3px 8px 3px 4px;border-radius:999px;background:rgba(10,10,14,.62);border:1px solid rgba(255,226,122,.55);"+
  "pointer-events:none;font:800 13px/1 Arial,Helvetica,sans-serif;color:#ffe27a;text-shadow:0 1px 2px #000}"+
  "#argentHUD img{width:22px;height:21px;display:block}";
 document.head.appendChild(css);
 var d=document.createElement("div"); d.id="argentHUD";
 d.innerHTML='<img alt="" src="/assets/shinato/m/f4b8c806f85db77a.webp"><span>0 €</span>';
 var txt=d.querySelector("span");
 function pose(){ if(document.body){ document.body.appendChild(d); } else setTimeout(pose,50); }
 pose();
 function lire(){
  try{ if(window.Chambre&&window.Chambre.argent) return parseInt(window.Chambre.argent(),10)||0; }catch(e){}
  try{ var v=localStorage.getItem("rudy_argent"); return v===null?1000:(parseInt(v,10)||0); }catch(e){}
  return 1000;
 }
 function maj(){ var n=lire(); txt.textContent=n.toLocaleString("fr-FR")+" €"; }
 maj(); setInterval(maj,1000);
 window.addEventListener("pageshow",maj);
 document.addEventListener("visibilitychange",function(){ if(!document.hidden) maj(); });

 function toast(txt){
  var t=document.getElementById("argentMsg");
  if(!t){ t=document.createElement("div"); t.id="argentMsg";
   t.style.cssText="position:fixed;top:44px;right:8px;z-index:26;padding:7px 12px;border-radius:12px;background:rgba(10,10,14,.9);"+
    "border:2px solid rgba(255,226,122,.8);color:#ffe27a;font:800 13px Arial,sans-serif;pointer-events:none;opacity:0;transition:opacity .25s";
   document.body.appendChild(t); }
  t.textContent=txt; t.style.opacity="1"; clearTimeout(t.__t); t.__t=setTimeout(function(){ t.style.opacity="0"; },1700);
 }

 /** La vie de Rudy (0 à 100). Elle ne se remplit plus toute seule : il faut l'infirmerie. */
 window.vieLire=function(){ try{ var v=localStorage.getItem("rudy_vie"); var n=v===null?100:parseInt(v,10); return Math.max(0,Math.min(100,isNaN(n)?100:n)); }catch(e){ return 100; } };
 window.vieEcrire=function(n){ try{ localStorage.setItem("rudy_vie",String(Math.max(0,Math.min(100,Math.round(n))))); }catch(e){} };
 window.argentLire=lire;
 window.argentMessage=toast;
 /** Payer un jeu : renvoie false et prévient s'il n'y a pas assez d'argent. */
 window.argentPayer=function(n,quoi){
  if(lire()<n){ toast("Pas assez d'argent ("+n+" €)"); return false; }
  window.argentAjouter(-n); toast("-"+n+" €"+(quoi?" · "+quoi:"")); return true;
 };
 /** Gagner ou perdre à la fin d'un jeu. */
 window.argentGain=function(n){ if(!n) return; window.argentAjouter(n); toast((n>0?"+":"")+n+" €"); };
 // pour plus tard : gagner ou dépenser depuis le jeu
 window.argentAjouter=function(n){
  try{ if(window.Chambre&&window.Chambre.ajouterArgent){ window.Chambre.ajouterArgent(n); maj(); return; } }catch(e){}
  try{ localStorage.setItem("rudy_argent",String(Math.max(0,lire()+n))); }catch(e){}
  maj();
 };
})();
</script></body>
