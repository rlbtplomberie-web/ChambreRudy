const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const load=s=>{const i=new Image();i.src=s;return i};
const BG=load(A.bg), SW=1912, SH=823;
// les quatre tabourets bien en face du bar (on laisse libre celui tout à gauche) : point d'assise
const SIEGES=[{x:764,y:449,r:1},{x:938,y:454,r:0},{x:1116,y:459,r:3},{x:1295,y:464,r:2}];
const CLIENTS=SIEGES.map((s,i)=>({...s,fr:A.p[s.r].map(f=>({...f,img:load(f.src)})),
  k:0.93+(s.x-764)/531*0.05, idx:0, next:0, t0:performance.now()/1000-Math.random()*1.5, hold:1.4+Math.random()}));
const FONDU=0.45;
/* ---------- le barman : derrière le comptoir, en face des tabourets vides à droite ---------- */
const BM=A.bm.map(f=>({...f,img:load(f.src)}));
const COMPTOIR=379;                 // bord arrière du comptoir : tout ce qui est plus bas passe derrière
const TETE=256, ECH=0.84;            // hauteur de sa tête, taille
const ZONE_G=1465, ZONE_D=1570;     // il reste dans ce coin (avant la caisse)
const GESTES={
  repos:[[0,2.2]],
  verre:[[5,1.2],[6,1.1],[7,1.2],[8,1.1],[6,1.1]],
  torchon:[[9,1.6],[14,1.4]],
  cocktail:[[10,0.9],[11,0.45],[10,0.45],[11,0.45],[13,1.3],[16,1.2],[15,1.2],[18,1.4]],
  bouteille:[[12,1.5],[13,1.3],[20,1.4]],
  servir:[[18,1.3],[17,1.6],[0,1]],
  etagere:[[3,0.9],[4,1.6],[2,0.9]],
  citron:[[14,1.3],[22,1.5],[18,1.2]]
};
const TIRAGE=['repos','verre','verre','torchon','cocktail','cocktail','bouteille','servir','etagere','citron'];
const barman={x:1510,dx:0,seq:null,pas:0,t0:0,cur:0,prev:0,fondu:1,marche:null};
function nouveauGeste(now){
  if(Math.random()<0.28){                              // il se déplace un peu le long du comptoir
    let cible=ZONE_G+Math.random()*(ZONE_D-ZONE_G); if(Math.abs(cible-barman.x)<40) cible=barman.x<(ZONE_G+ZONE_D)/2?ZONE_D:ZONE_G;
    barman.marche={de:barman.x,a:cible,t0:now,d:Math.abs(cible-barman.x)/55};
    barman.seq=[[1,barman.marche.d]]; barman.dx=cible>barman.x?1:-1;
  }else{ barman.seq=GESTES[TIRAGE[Math.floor(Math.random()*TIRAGE.length)]]; barman.dx=0; }
  barman.pas=0; barman.t0=now; change(barman.seq[0][0],now);
}
function change(i,now){ if(i===barman.cur) return; barman.prev=barman.cur; barman.cur=i; barman.tf=now; }
function unBarman(f,al,miroir,bob){
  if(!f||!f.img.complete||al<=0) return;
  const k=ECH*f.k;
  ctx.save();ctx.globalAlpha=al;ctx.translate(barman.x,TETE+bob);ctx.scale(miroir?-k:k,k);
  ctx.filter='brightness(.8) saturate(.92) sepia(.14)';
  ctx.drawImage(f.img,-f.ax,-f.ay,f.w,f.h);ctx.restore();
}
function dessineBarman(now){
  if(window.DIALOGUE&&!barman.marche&&barman.cur!==0){barman.seq=[[0,999]];barman.pas=0;barman.t0=now;change(0,now)}
  if(!barman.seq) nouveauGeste(now);
  const [idx,d]=barman.seq[barman.pas];
  if(barman.marche){
    const m=barman.marche,p=Math.min(1,(now-m.t0)/m.d),e=p*p*(3-2*p); barman.x=m.de+(m.a-m.de)*e;
    if(p>=1){ barman.marche=null; barman.seq=null; change(0,now); }
  }else if(now-barman.t0>d){
    barman.pas++; barman.t0=now;
    if(barman.pas>=barman.seq.length){ barman.seq=null; change(0,now); return dessineBarman(now); }
    change(barman.seq[barman.pas][0],now);
  }
  const bob=barman.marche?-Math.abs(Math.sin((now-barman.marche.t0)*7))*3:0;
  const mi=barman.dx<0;                                // de profil : il regarde là où il va
  let t=Math.min(1,(now-(barman.tf||0))/0.3); t=t*t*(3-2*t);
  unBarman(BM[barman.prev],1-t,false,0); unBarman(BM[barman.cur],t<1?Math.min(1,t*1.6):1,barman.cur===1&&mi,bob);

  if(BG.complete) ctx.drawImage(BG,1360,COMPTOIR,420,SH-COMPTOIR,1360,COMPTOIR,420,SH-COMPTOIR);
}
// chacun choisit son geste suivant au hasard (le repos revient plus souvent)
function suivant(c){let n;do{n=Math.random()<0.35?0:Math.floor(Math.random()*c.fr.length)}while(n===c.idx);return n}

let W,H,S,OX,OY;
let CAMX=null;

addEventListener('resize',resize);resize();
function dessine(c,f,al,now){
  if(!f.img.complete||al<=0)return;
  const k=c.k, br=1+0.006*Math.sin(now*1.7+c.x);          // respiration
  ctx.save();ctx.globalAlpha=al;ctx.translate(c.x,c.y);ctx.scale(k,k*br);
  ctx.filter='brightness(.84) saturate(.95) sepia(.12)';     // dans la lumière chaude du bar
  ctx.drawImage(f.img,-f.ax,-f.ay,f.w,f.h);ctx.restore();

// petites lumières qui vivent : bougies, lampes, néon
const BOUGIES=[[238,698,60],[1498,752,70],[1682,752,70]];
const LAMPES=[[860,145,120],[1121,145,120],[1386,145,120],[1658,145,120]];
window.PAUSE_BAR=false;let barEnAttente=false;
function frame(){
  if(window.PAUSE_BAR){barEnAttente=true;return}
  const now=performance.now()/1000;
  ctx.fillStyle='#0a0604';ctx.fillRect(0,0,W,H);
  if(typeof RUDY!=='undefined'){const rx=RUDY.chaise?RUDY.chaise.x:RUDY.x, cible=Math.max(W-SW*S,Math.min(0,W/2-rx*S));
    CAMX=CAMX===null?cible:CAMX+(cible-CAMX)*0.12;OX=CAMX;const cy=window.DIALOGUE?Math.min(RUDY.y,430):(RUDY.chaise?RUDY.chaise.pied:RUDY.y), oy=Math.max(H-SH*S,Math.min(0,H*0.6-cy*S));
    OY=window.DIALOGUE||window.CAM_DOUX>0?OY+(oy-OY)*0.12:oy; if(!window.DIALOGUE&&window.CAM_DOUX>0)window.CAM_DOUX--;}
  ctx.save();ctx.translate(OX,OY);ctx.scale(S,S);
  if(BG.complete)ctx.drawImage(BG,0,0);
  dessineBarman(now);
  for(const c of CLIENTS){
    let el=now-c.t0;
    if(el>c.hold+FONDU){c.idx=c.next;c.next=suivant(c);c.t0=now;c.hold=1.2+Math.random()*1.8;el=0}
    let t=el>c.hold?(el-c.hold)/FONDU:0;t=t*t*(3-2*t);
    // fondu sans creux : la pose suivante apparaît, puis l'ancienne s'efface
    dessine(c,c.fr[c.idx],t<0.5?1:2-2*t,now);dessine(c,c.fr[c.next],t<0.5?2*t:1,now);
  }
  if(typeof dessineRudy==='function') dessineRudy(now);
  ctx.globalCompositeOperation='lighter';
  for(const [x,y,r] of BOUGIES){const fl=0.55+0.25*Math.sin(now*9+x)+0.15*Math.sin(now*23+y);
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,170,70,${0.26*fl})`);g.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  for(const [x,y,r] of LAMPES){const fl=0.9+0.1*Math.sin(now*1.3+x);
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,190,110,${0.16*fl})`);g.addColorStop(1,'rgba(255,150,60,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  const ne=0.75+0.25*Math.sin(now*2.2)+(Math.random()<0.01?-0.4:0);
  const g=ctx.createRadialGradient(757,170,0,757,170,150);g.addColorStop(0,`rgba(255,60,230,${0.15*ne})`);g.addColorStop(1,'rgba(255,60,230,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(757,170,150,0,7);ctx.fill();
  ctx.globalCompositeOperation='source-over';ctx.restore();
  if(window.placeBulle)window.placeBulle();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

60147fe0.webp", "/assets/shinato/m/755e4485bb1d4aa7.webp", "/assets/shinato/m/03dd25cd32a0c056.webp", "/assets/shinato/m/21671642476137e5.webp", "/assets/shinato/m/b3ef0833a4cca78d.webp", "/assets/shinato/m/fcca5a1cab60305a.webp", "/assets/shinato/m/818ec2f65015b80f.webp", "/assets/shinato/m/b8e35166f15e965c.webp", "/assets/shinato/m/d16ab3e5c6706fcf.webp", "/assets/shinato/m/80e9b128b6dfee36.webp", "/assets/shinato/m/ec15122f13294a6c.webp", "/assets/shinato/m/80b6b61289cc8f29.webp", "/assets/shinato/m/e96ec3ea688d7a5f.webp", "/assets/shinato/m/b84c4bcfc3a3401c.webp", "/assets/shinato/m/b6df68a3bbd962e6.webp", "/assets/shinato/m/edfd0fdf96e499eb.webp"], "w": 185, "h": 337, "ax": 87.21307961733494, "ay": 334.0}};
for(const k in RB) RB[k].fr=RB[k].img.map(load);
// le sol où il peut marcher : le passage devant les tabourets, l'allée du milieu, le coin devant le rideau
const ZONES=[{x0:70,x1:1885,y0:602,y1:642},{x0:655,x1:1150,y0:602,y1:812},{x0:175,x1:640,y0:545,y1:642}];
function libre(x,y){return ZONES.some(z=>x>=z.x0&&x<=z.x1&&y>=z.y0&&y<=z.y1)}
// les tabourets libres : les deux à droite, celui près du rideau, celui de la petite table
const LIBRES=[{x:1480,haut:437,pied:600},{x:1660,haut:442,pied:605},{x:607,haut:401,pied:530},{x:120,haut:442,pied:565}];
const SORTIE_X=1835;
const RUDY={x:1770,y:622,dir:'gauche',pas:0,etat:'debout',chaise:null,t0:0,idx:0,bouge:false};
let joyX=0,joyY=0;
function taille(y){return 300+(y-600)*0.55}                 // plus grand quand il s'approche (en bas)
function prof(y){return 1+(y-600)*0.002}                    // les tabourets du fond sont un peu plus petits
function dessineDebout(set,i,x,y,al,phase){
 const R=RB[set],im=R.fr[i%R.fr.length]; if(!im.complete||al<=0) return;
 const h=taille(y),k=h/R.h;
 ctx.save();ctx.globalAlpha=al;
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y,h*0.17,h*0.035,0,0,7);ctx.fill();
 ctx.filter='brightness(.86) saturate(.95) sepia(.1)';
 const X=x-R.ax*k,Y=y-R.ay*k;
 if((set==='droite'||set==='gauche')&&phase!=null){
  // comme au Pixel Bar : les jambes de profil se referment puis s'écartent à chaque enjambée
  const ouv=0.30+0.70*Math.abs(Math.cos(phase*Math.PI)), bob=-Math.abs(Math.sin(phase*Math.PI))*h*0.018;
  const hanche=Math.round(R.h*0.50),N=14,bas=R.h-hanche;
  ctx.drawImage(im,0,0,R.w,hanche,X,Y+bob,R.w*k,hanche*k);
  for(let n=0;n<N;n++){const s0=hanche+bas*n/N,s1=hanche+bas*(n+1)/N,f=(n+0.5)/N,sx=1-(1-ouv)*f;
   ctx.drawImage(im,0,s0,R.w,s1-s0+0.6,X+R.ax*k-R.ax*k*sx,Y+s0*k+bob*(1-f),R.w*k*sx,(s1-s0)*k+0.6)}
 }else ctx.drawImage(im,X,Y,R.w*k,R.h*k);
 ctx.restore();
}
function dessineAssis(i,al,now){
 const R=RB.assis,im=R.fr[i%R.fr.length],c=RUDY.chaise; if(!im.complete||al<=0||!c) return;
 const h=255*prof(c.pied),k=h/R.h,br=1+0.005*Math.sin(now*1.6);
 ctx.save();ctx.globalAlpha=al;ctx.translate(c.x,c.haut+14);ctx.scale(1,br);
 ctx.filter='brightness(.86) saturate(.95) sepia(.1)';
 ctx.drawImage(im,-R.ax*k,-(R.h*0.63)*k,R.w*k,R.h*k);ctx.restore();
}
let dernier=performance.now()/1000;
function avance(now){
 const dt=Math.min(0.05,now-dernier);dernier=now;
 if(RUDY.etat!=='debout'||window.DIALOGUE){RUDY.bouge=false;return}
 const m=Math.hypot(joyX,joyY);
 if(m>0.18){
  const v=280*Math.min(1,m);
  let nx=RUDY.x+joyX/m*v*dt, ny=RUDY.y+joyY/m*v*dt*0.7;
  if(!libre(nx,ny)){ if(libre(nx,RUDY.y)) ny=RUDY.y; else if(libre(RUDY.x,ny)) nx=RUDY.x; else {nx=RUDY.x;ny=RUDY.y} }
  RUDY.pas+=Math.hypot(nx-RUDY.x,ny-RUDY.y);RUDY.x=nx;RUDY.y=ny;
  RUDY.dir=Math.abs(joyX)>Math.abs(joyY)?(joyX>0?'droite':'gauche'):(joyY>0?'bas':'haut');RUDY.bouge=true;
 }else RUDY.bouge=false;
}
function chaiseProche(){
 if(RUDY.etat!=='debout') return null;
 let best=null;
 for(const c of LIBRES){const dx=Math.abs(c.x-RUDY.x),dy=RUDY.y-c.pied;
  if(dx<80&&dy>-8&&dy<75&&(!best||dx<Math.abs(best.x-RUDY.x))) best=c;}
 return best;
}
function procheSortie(){return RUDY.etat==='debout'&&RUDY.x>=SORTIE_X}
function fleche(now){
 if(!procheSortie()) return;
 // flèche jaune brillante vers la droite, au-dessus de sa tête
 const x=RUDY.x-10+Math.sin(now*6)*10, y=RUDY.y-taille(RUDY.y)-60;
 ctx.save();ctx.shadowColor='rgba(255,220,40,1)';ctx.shadowBlur=28;ctx.fillStyle='#ffe400';ctx.strokeStyle='#fff6a8';ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(x-40,y-18);ctx.lineTo(x,y-18);ctx.lineTo(x,y-42);ctx.lineTo(x+48,y);ctx.lineTo(x,y+42);ctx.lineTo(x,y+18);ctx.lineTo(x-40,y+18);
 ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
// dessiné après le décor, les clients et le barman : Rudy est toujours devant eux
function dessineRudy(now){
 avance(now);
 if(RUDY.etat==='debout'){
  const h=taille(RUDY.y);
  dessineDebout(RUDY.dir,RUDY.bouge?Math.floor(RUDY.pas/(h*0.13)):0,RUDY.x,RUDY.y,1,RUDY.bouge?RUDY.pas/(h*0.34):null);
 }else if(RUDY.etat==='assis'){
  const hold=1.25,F=0.4;let el=now-RUDY.t0;
  if(el>hold+F){RUDY.idx=(RUDY.idx+1)%RB.assis.fr.length;RUDY.t0=now;el=0}
  let t=el>hold?(el-hold)/F:0;t=t*t*(3-2*t);
  dessineAssis(RUDY.idx,t<0.5?1:2-2*t,now);dessineAssis(RUDY.idx+1,t<0.5?2*t:1,now);
 }else{
  // il s'assoit / se lève : fondu entre Rudy debout (de dos) et Rudy assis
  const t=Math.min(1,(now-RUDY.t0)/0.5),a=RUDY.etat==='sassoit'?1-t:t, c=RUDY.chaise, y=c.pied+22;
  dessineDebout(RUDY.etat==='sassoit'?'haut':'bas',0,c.x,y,a);dessineAssis(0,1-a,now);
  if(t>=1){ if(RUDY.etat==='sassoit'){RUDY.etat='assis';RUDY.t0=now;RUDY.idx=0}
   else{RUDY.etat='debout';RUDY.x=c.x;RUDY.y=Math.max(y,605);RUDY.dir='bas';RUDY.chaise=null;
    if(!libre(RUDY.x,RUDY.y)){RUDY.y=622}} }
 }
 fleche(now);
 majBoutons();
}
const bA=document.getElementById('btnAssis'),bL=document.getElementById('btnLever'),bS=document.getElementById('btnSortir');
function majBoutons(){
 if(window.DIALOGUE){bA.style.display=bL.style.display=bS.style.display='none';if(window.bP)window.bP.style.display='none';return}
 if(window.bP)window.bP.style.display=(window.barmanProche&&window.barmanProche())?'block':'none';
 bA.style.display=chaiseProche()?'block':'none';
 bL.style.display=RUDY.etat==='assis'?'block':'none';
 bS.style.display=procheSortie()?'block':'none';
}
function appuie(el,f){let t=0;const go=e=>{if(e.cancelable)e.preventDefault();e.stopPropagation();const n=performance.now();if(n-t<400)return;t=n;f()};
 el.addEventListener('pointerdown',go);el.addEventListener('touchstart',go,{passive:false});el.addEventListener('click',go)}
appuie(bA,()=>{const c=chaiseProche();if(!c)return;joyX=joyY=0;RUDY.chaise=c;RUDY.etat='sassoit';RUDY.t0=performance.now()/1000});
appuie(bL,()=>{if(RUDY.etat!=='assis')return;RUDY.etat='seleve';RUDY.t0=performance.now()/1000});
// SORTIR : retour dans la ville délabrée, devant le Relais
appuie(bS,()=>{joyX=joyY=0;try{window.parent.postMessage({type:'relais:sortie'},'*')}catch(e){}});
addEventListener('message',e=>{if(e.data&&e.data.type==='relais:entree'){
 Object.assign(RUDY,{x:1770,y:622,dir:'gauche',pas:0,etat:'debout',chaise:null,bouge:false});joyX=joyY=0}});
// joystick (dans tous les sens) + zone élargie à gauche de l'écran
(function(){const joy=document.getElementById('joy'),st=document.getElementById('stick');let id=null,cx=0,cy=0,R=0;
 function prend(e){const t=e.changedTouches?e.changedTouches[0]:e;const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;R=r.width/2;id=e.changedTouches?t.identifier:'s';bouge(e)}
 function bouge(e){if(id===null)return;const t=e.changedTouches?[...e.changedTouches].find(u=>u.identifier===id):e;if(!t)return;
  const dx=t.clientX-cx,dy=t.clientY-cy,d=Math.min(Math.hypot(dx,dy),R*0.62),a=Math.atan2(dy,dx);
  st.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;joyX=Math.cos(a)*d/(R*0.62);joyY=Math.sin(a)*d/(R*0.62);if(e.cancelable)e.preventDefault()}
 function lache(){id=null;joyX=joyY=0;st.style.transform='translate(0,0)'}
 joy.addEventListener('touchstart',prend,{passive:false});joy.addEventListener('touchmove',bouge,{passive:false});
 joy.addEventListener('touchend',lache);joy.addEventListener('touchcancel',lache);
 joy.addEventListener('mousedown',e=>{prend(e);const mv=ev=>bouge(ev),up=()=>{lache();removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};addEventListener('mousemove',mv);addEventListener('mouseup',up)});
 const K={};addEventListener('keydown',e=>{K[e.key]=1;maj()});addEventListener('keyup',e=>{K[e.key]=0;maj()});
 function maj(){joyX=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0);joyY=(K.ArrowDown?1:0)-(K.ArrowUp?1:0)}
 const z=document.createElement('div');z.style.cssText='position:fixed;left:0;bottom:0;width:44vw;height:62vh;z-index:19;touch-action:none';document.body.appendChild(z);
 let act=null,ox=0,oy=0;const pos=e=>[...e.changedTouches].find(t=>t.identifier===act);
 z.addEventListener('touchstart',e=>{const t=e.changedTouches[0];act=t.identifier;R=joy.getBoundingClientRect().width/2;ox=t.clientX;oy=t.clientY;if(e.cancelable)e.preventDefault()},{passive:false});
 z.addEventListener('touchmove',e=>{const t=pos(e);if(!t)return;const dx=t.clientX-ox,dy=t.clientY-oy,d=Math.min(Math.hypot(dx,dy),R*0.62),a=Math.atan2(dy,dx);
  st.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;joyX=Math.cos(a)*d/(R*0.62);joyY=Math.sin(a)*d/(R*0.62);if(e.cancelable)e.preventDefault()},{passive:false});
 const fin=e=>{if(pos(e)){act=null;joyX=joyY=0;st.style.transform='translate(0,0)'}};z.addEventListener('touchend',fin);z.addEventListener('touchcancel',fin);
 const r0=()=>{joyX=joyY=0;st.style.transform='translate(0,0)'};
 document.addEventListener('touchend',e=>{if(!e.touches.length)r0()},{capture:true});addEventListener('blur',r0);document.addEventListener('visibilitychange',r0);
 document.addEventListener('contextmenu',e=>e.preventDefault(),{capture:true});
})();
</script>
<script>
/* ================= le barman du Relais : « Tu veux participer au concours d'ivresse ? » =================
   OUI -> le jeu « Dernier debout » ; NON -> on reste dans le bar */
(function(){
 window.DIALOGUE=false; window.CAM_DOUX=0;
 const bulle=document.getElementById('bulle'), corps=bulle.querySelector('.corps'),
       txt=document.getElementById('bulleTxt'), rep=document.getElementById('bulleRep');
 window.bP=document.getElementById('btnParler');
 let vu=false;
 // devant le comptoir, près du barman (il reste dans son coin, entre 1465 et 1570)
 window.barmanProche=function(){
  const ok=RUDY.etat==='debout'&&RUDY.y<660&&Math.abs(RUDY.x-barman.x)<(vu?210:170);
  vu=ok; return ok;
 };
 // la bulle au-dessus de sa tête ; s'il n'y a pas la place (petit écran), à côté de sa tête
 window.placeBulle=function(){
  if(!window.DIALOGUE) return;
  const hx=OX+barman.x*S, hy=OY+(TETE-40)*S;
  const bw=corps.offsetWidth, bh=corps.offsetHeight, m=8, q=Math.min(W,H)*0.05;
  if(hy-bh-q>=m){
   bulle.classList.remove('cote');
   let left=Math.max(m,Math.min(W-bw-m,hx-bw*0.42));
   bulle.style.left=left+'px'; bulle.style.top=(hy-bh-q)+'px';
   bulle.style.setProperty('--queue',Math.max(28,Math.min(bw-40,hx-left))+'px');
  }else{
   bulle.classList.add('cote');
   const cy=OY+(TETE+20)*S;
   let left=Math.max(m,hx-40*S-bw-q), top=Math.max(m,Math.min(H-bh-m,cy-bh*0.45));
   bulle.style.left=left+'px'; bulle.style.top=top+'px';
   bulle.style.setProperty('--queue',Math.max(20,Math.min(bh-30,cy-top))+'px');
  }
 };
 let ac=null;
 function pop(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const t=ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(980,t+0.09);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.25); }catch(e){} }
 let tape=0;
 let finTape=null;
 function ecrit(s,fin){ clearInterval(tape); txt.textContent=''; const t0=performance.now(); finTape=()=>{ clearInterval(tape); txt.textContent=s; finTape=null; if(fin) fin(); };
  tape=setInterval(()=>{ const i=Math.floor((performance.now()-t0)/28); txt.textContent=s.slice(0,i); if(i>=s.length&&finTape) finTape(); },30); }
 corps.addEventListener('pointerdown',e=>{ if(finTape&&e.target===txt) finTape(); });   // un appui sur le texte l'affiche en entier
 function ouvre(){
  if(window.DIALOGUE||!window.barmanProche()) return;
  window.DIALOGUE=true; window.CAM_DOUX=40; joyX=joyY=0; RUDY.bouge=false; RUDY.dir='haut'; majBoutons();
  rep.hidden=true; bulle.classList.remove('pop'); void bulle.offsetWidth; bulle.classList.add('on','pop'); pop();
  ecrit("Tu veux participer au concours d'ivresse ?",()=>{ rep.hidden=false; });
 }
 function ferme(){ clearInterval(tape); bulle.classList.remove('on','pop'); window.DIALOGUE=false; window.CAM_DOUX=40; majBoutons(); }
 appuie(window.bP,ouvre);
 appuie(document.getElementById('non'),()=>{ if(rep.hidden) return; rep.hidden=true;
  ecrit("Comme tu veux. Le comptoir reste ouvert !",()=>setTimeout(ferme,1300)); });
 appuie(document.getElementById('oui'),()=>{ if(rep.hidden) return; rep.hidden=true;
  ecrit("Ha ha ! Que le meilleur reste debout !",()=>setTimeout(()=>{ ferme(); lance(); },700)); });

 // la musique de la ville est dans la page principale (deux cadres au-dessus)
 function musique(on){ try{ window.top.postMessage({type:on?'musique:reprise':'musique:pause'},'*'); }catch(e){} }
 function lance(){
  joyX=joyY=0;
  let f=document.getElementById('jeuDD');
  if(!f){ f=document.createElement('iframe'); f.id='jeuDD'; f.setAttribute('allow','autoplay; fullscreen'); document.body.appendChild(f); }
  f.src='/assets/shinato/jeux/dernierdebout.html'; f.style.display='block';
  window.PAUSE_BAR=true; musique(false);
  setTimeout(()=>{ try{ f.focus(); }catch(e){} },300);
 }
 // « Retour au bar » dans le jeu : Rudy revient debout devant le barman
 addEventListener('message',e=>{ if(!(e.data&&e.data.type==='dernierDebout:arret')) return;
  const f=document.getElementById('jeuDD'); if(f){ f.style.display='none'; f.src='about:blank'; }
  window.PAUSE_BAR=false; if(barEnAttente){ barEnAttente=false; dernier=performance.now()/1000; requestAnimationFrame(frame); }
  musique(true);
  Object.assign(RUDY,{x:barman.x,y:622,dir:'haut',etat:'debout',chaise:null,bouge:false}); CAMX=null;
  joyX=joyY=0; majBoutons();
 });
})();
</script>
<script>

   (il ne s'affiche pas dans les mini-jeux ni dans les émulateurs) */
(function(){
 if(window.__argentPose) return; window.__argentPose=true;
 var css=document.createElement("style");
 css.textContent="#argentHUD{position:fixed;top:max(6px,env(safe-area-inset-top,0px));right:8px;z-index:25;display:flex;align-items:center;gap:5px;"+
  "padding:3px 8px 3px 4px;border-radius:999px;background:rgba(10,10,14,.62);border:1px solid rgba(255,226,122,.55);"+
  "pointer-events:none;font:800 13px/1 Arial,Helvetica,sans-serif;color:#ffe27a;text-shadow:0 1px 2px #000}"+
  "#argentHUD img{width:22px;height:21px;display:block}";
 document.head.appendChild(css);
 var d=document.createElement("div"); d.id="argentHUD";
 d.innerHTML='<img alt="" src="/assets/shinato/m/f4b8c806f85db77a.webp"><span>0 €</span>';
 var txt=d.querySelector("span");
 function pose(){ if(document.body){ document.body.appendChild(d); } else setTimeout(pose,50); }
 pose();
 function lire(){
  try{ if(window.Chambre&&window.Chambre.argent) return parseInt(window.Chambre.argent(),10)||0; }catch(e){}
  try{ var v=localStorage.getItem("rudy_argent"); return v===null?1000:(parseInt(v,10)||0); }catch(e){}
  return 1000;
 }
 function maj(){ var n=lire(); txt.textContent=n.toLocaleString("fr-FR")+" €"; }
 maj(); setInterval(maj,1000);
 window.addEventListener("pageshow",maj);
 document.addEventListener("visibilitychange",function(){ if(!document.hidden) maj(); });

 function toast(txt){
  var t=document.getElementById("argentMsg");
  if(!t){ t=document.createElement("div"); t.id="argentMsg";
   t.style.cssText="position:fixed;top:44px;right:8px;z-index:26;padding:7px 12px;border-radius:12px;background:rgba(10,10,14,.9);"+
    "border:2px solid rgba(255,226,122,.8);color:#ffe27a;font:800 13px Arial,sans-serif;pointer-events:none;opacity:0;transition:opacity .25s";
   document.body.appendChild(t); }
  t.textContent=txt; t.style.opacity="1"; clearTimeout(t.__t); t.__t=setTimeout(function(){ t.style.opacity="0"; },1700);
 }

 /** La vie de Rudy (0 à 100). Elle ne se remplit plus toute seule : il faut l'infirmerie. */
 window.vieLire=function(){ try{ var v=localStorage.getItem("rudy_vie"); var n=v===null?100:parseInt(v,10); return Math.max(0,Math.min(100,isNaN(n)?100:n)); }catch(e){ return 100; } };
 window.vieEcrire=function(n){ try{ localStorage.setItem("rudy_vie",String(Math.max(0,Math.min(100,Math.round(n))))); }catch(e){} };
 window.argentLire=lire;
 window.argentMessage=toast;
 /** Payer un jeu : renvoie false et prévient s'il n'y a pas assez d'argent. */
 window.argentPayer=function(n,quoi){
  if(lire()<n){ toast("Pas assez d'argent ("+n+" €)"); return false; }
  window.argentAjouter(-n); toast("-"+n+" €"+(quoi?" · "+quoi:"")); return true;
 };
 /** Gagner ou perdre à la fin d'un jeu. */
 window.argentGain=function(n){ if(!n) return; window.argentAjouter(n); toast((n>0?"+":"")+n+" €"); };
 // pour plus tard : gagner ou dépenser depuis le jeu
 window.argentAjouter=function(n){
  try{ if(window.Chambre&&window.Chambre.ajouterArgent){ window.Chambre.ajouterArgent(n); maj(); return; } }catch(e){}
  try{ localStorage.setItem("rudy_argent",String(Math.max(0,lire()+n))); }catch(e){}
  maj();
 };
})();
</script>
