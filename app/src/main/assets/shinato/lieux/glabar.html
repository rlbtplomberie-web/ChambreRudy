<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlaBar Givré</title>
<style>
  :root{--bg:url(/assets/shinato/m/glabar_fond.webp)}
  html,body{margin:0;height:100%;background:#0b1424;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:absolute;left:0;top:0;width:2172px;height:724px;transform-origin:0 0;
         background:var(--bg) 0 0/2172px 724px no-repeat}
  /* le comptoir repasse devant le barman */
  #front{position:absolute;left:640px;top:404px;width:800px;height:240px;
         background:var(--bg) -640px -404px/2172px 724px no-repeat;pointer-events:none}
  #barman{position:absolute;left:0;top:0;width:142px;height:130px;transform-origin:50% 100%;will-change:transform}
  .pose{position:absolute;inset:0;background:url(/assets/shinato/m/glabar_barman.webp) 0 0/1136px 130px no-repeat;
        opacity:0;transition:opacity .16s linear}
  .pose.on{opacity:1}
  #femme{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;pointer-events:none}
  #femmeGL{display:block;width:100%;height:100%}
  #neige{position:absolute;left:0;top:0;width:2172px;height:724px;pointer-events:none}
  #feu,#braises{position:absolute;pointer-events:none}
  #lueur{position:absolute;left:1645px;top:150px;width:640px;height:600px;pointer-events:none;mix-blend-mode:screen;
         background:radial-gradient(closest-side,rgba(255,140,50,.30),rgba(255,120,40,.12) 55%,rgba(255,110,30,0) 100%)}
  #sonHint{position:fixed;left:10px;bottom:10px;z-index:9;color:#fff;font:14px sans-serif;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:14px;pointer-events:none}
  #rudy{position:absolute;left:0;top:0;width:2172px;height:724px;pointer-events:none}
  #sonHint{display:none!important}
.chip{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;padding:7px 14px;border-radius:999px;background:rgba(40,22,10,.6);border:1px solid rgba(255,210,140,.45);font:700 14px system-ui,sans-serif;letter-spacing:.04em;color:#fff3dc;text-shadow:0 0 8px #ffb347;pointer-events:none}
#joy{position:fixed;left:4.5vmin;bottom:5vmin;width:30vmin;height:30vmin;border-radius:50%;z-index:40;touch-action:none;
 background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.10),rgba(0,0,0,.34));border:2px solid rgba(255,226,122,.45);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#stick{position:absolute;left:50%;top:50%;width:13vmin;height:13vmin;margin:-6.5vmin 0 0 -6.5vmin;border-radius:50%;
 background:radial-gradient(circle at 42% 36%,#fbf0c6,#c9a33c 60%,#7d6118);box-shadow:0 4px 12px rgba(0,0,0,.6)}
#zoneJoy{position:fixed;left:0;bottom:0;width:44vw;height:62vh;z-index:39;touch-action:none}
#actions{position:fixed;right:4.5vmin;bottom:6vmin;display:flex;flex-direction:column;gap:2.6vmin;z-index:40}
.btn{min-width:26vmin;padding:2.4vmin 3vmin;border-radius:3vmin;text-align:center;font:900 clamp(13px,3.1vmin,26px)/1 Arial,sans-serif;letter-spacing:2px;color:#ffe27a;
 background:linear-gradient(rgba(12,12,14,.9),rgba(30,30,34,.9));border:2px solid rgba(255,226,122,.95);box-shadow:0 5px 16px rgba(0,0,0,.55);user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.94)} .btn.off{opacity:.32}
  #fx,#ombre{position:absolute;left:0;top:0;width:2172px;height:724px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="neige" width="2172" height="724"></canvas>
  <canvas id="feu"></canvas>
  <canvas id="braises"></canvas>
  <div id="barman"><div class="pose" id="pA"></div><div class="pose" id="pB"></div></div>
  <div id="front"></div>
  <canvas id="ombre" width="2172" height="724"></canvas>
  <canvas id="rudy" width="2172" height="724"></canvas>
  <div id="femme"><canvas id="femmeGL"></canvas></div>
  <canvas id="fx" width="2172" height="724"></canvas>
  <div id="lueur"></div>
</div></div>
<div class="chip">GlaBar Givré</div>
<div id="zoneJoy"></div><div id="joy"><div id="stick"></div></div>
<div id="actions"><div class="btn" id="btnSortir" style="display:none">SORTIR</div></div>
<div id="sonHint">🔊 Touchez l'écran pour le son</div>
<script>
// ===================== SONS (synthétisés, aucun fichier) =====================
window.SFX=(function(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return {step(){},sweep(){},barman(){},stopBarman(){}};
  const ctx=new AC();
  const master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
  // petite réverbération de pièce en bois
  const rev=ctx.createConvolver(); {
    const len=ctx.sampleRate*0.9, b=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
    rev.buffer=b;
  }
  const revG=ctx.createGain(); revG.gain.value=0.16; rev.connect(revG); revG.connect(master);
  // bruit blanc partagé
  const NB=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  {const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const R=(a,b)=>a+Math.random()*(b-a);
  function out(x,vol){ // sortie placée à gauche/droite selon la position dans la salle
    const g=ctx.createGain(); g.gain.value=vol;
    let node=g;
    if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=Math.max(-.8,Math.min(.8,(x/2172)*1.6-.8));g.connect(p);node=p;}
    node.connect(master); node.connect(rev);
    return g;
  }
  function noise(t,dur){const s=ctx.createBufferSource();s.buffer=NB;s.loop=true;s.start(t,Math.random()*1.5);s.stop(t+dur+.05);return s;}
  function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}

  // ---------- pas de bottes sur le parquet ----------
  function knock(t,o,vol,pitch){
    // choc sourd du talon
    const n=noise(t,.12), f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=650*pitch; f.Q.value=1.2;
    const g=ctx.createGain(); env(g,t,.003,vol,.09); n.connect(f); f.connect(g); g.connect(o);
    // résonance du plancher
    const s=ctx.createOscillator(); s.type='sine'; s.frequency.setValueAtTime(115*pitch,t); s.frequency.exponentialRampToValueAtTime(70*pitch,t+.08);
    const g2=ctx.createGain(); env(g2,t,.002,vol*.9,.1); s.connect(g2); g2.connect(o); s.start(t); s.stop(t+.15);
    // petit claquement du bois
    const n2=noise(t,.03), f2=ctx.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=2200*pitch; f2.Q.value=2;
    const g3=ctx.createGain(); env(g3,t,.001,vol*.25,.025); n2.connect(f2); f2.connect(g3); g3.connect(o);
  }
  function step(x){
    if(ctx.state!=='running')return;
    const t=ctx.currentTime+.005, o=out(x,1), p=R(.9,1.1), v=R(.45,.6);
    knock(t,o,v,p);                 // talon
    knock(t+R(.05,.07),o,v*.45,p*1.15); // puis la semelle
  }
  // ---------- coup de balai ----------
  // texture d'un balai en paille : plein de petits grattements de brins (granuleux), pas un souffle
  const CB=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  {const d=CB.getChannelData(0),sr=ctx.sampleRate;let lp=0;
   for(let i=0;i<d.length;i++){
     let v=(Math.random()*2-1)*0.18;                       // frottement de fond très doux
     if(Math.random()<520/sr){ v+=(Math.random()*2-1)*R(.6,1.4); } // brin qui accroche le parquet
     lp+= (v-lp)*0.35; d[i]=lp;                            // adoucit les aigus
   }}
  function sweep(x,strength,len){
    if(ctx.state!=='running')return;
    const t=ctx.currentTime+.005, d=len||R(.28,.36), o=out(x,1);
    const s=ctx.createBufferSource(); s.buffer=CB; s.start(t,Math.random()*1.4); s.stop(t+d+.05);
    s.playbackRate.value=R(.92,1.08);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.7;
    bp.frequency.setValueAtTime(R(1300,1700),t); bp.frequency.linearRampToValueAtTime(R(1000,1300),t+d);
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200;
    const g=ctx.createGain(); const v=.16*strength;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+d*.25);
    g.gain.linearRampToValueAtTime(v*.8,t+d*.7); g.gain.linearRampToValueAtTime(0.0001,t+d);
    s.connect(bp); bp.connect(lp); lp.connect(g); g.connect(o);
  }

  // ---------- vaisselle du barman ----------
  let bx=1050; const BV=.55;           // le barman est plus loin : un peu moins fort
  const live=[];                       // sons longs en cours (verser, shaker...)
  function clink(t,o,vol,base){        // verre qui tinte
    base=base||R(2100,2700);
    [[1,1],[2.43,.55],[3.9,.3],[5.6,.15]].forEach(([m,a])=>{
      const s=ctx.createOscillator(); s.type='sine'; s.frequency.value=base*m*R(.995,1.005);
      const g=ctx.createGain(); env(g,t,.002,vol*a,R(.25,.5)/Math.sqrt(m)); s.connect(g); g.connect(o); s.start(t); s.stop(t+.7);
    });
  }
  function thunk(t,o,vol){             // verre/bouteille posé sur le comptoir en bois
    const n=noise(t,.08), f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    const g=ctx.createGain(); env(g,t,.002,vol,.06); n.connect(f); f.connect(g); g.connect(o);
    clink(t+.004,o,vol*.25,R(1500,1900));
  }
  function pour(t,o,dur,vol,lo,hi,fizz){ // liquide qui coule et remplit le verre
    const n=noise(t,dur), f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=4;
    f.frequency.setValueAtTime(lo,t); f.frequency.linearRampToValueAtTime(hi,t+dur);
    const lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=R(7,11); lg.gain.value=lo*.35;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start(t); lfo.stop(t+dur+.1);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.12);
    g.gain.setValueAtTime(vol,t+dur-.25); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    n.connect(f); f.connect(g); g.connect(o);
    if(fizz){ // mousse de la bière
      const n2=noise(t,dur+.6), f2=ctx.createBiquadFilter(); f2.type='highpass'; f2.frequency.value=5000;
      const g2=ctx.createGain(); g2.gain.setValueAtTime(0.0001,t); g2.gain.exponentialRampToValueAtTime(vol*.35,t+.4);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+dur+.6); n2.connect(f2); f2.connect(g2); g2.connect(o);
    }
  }
  function rattle(t,o,vol){            // glaçons qui cognent dans le shaker
    const n=noise(t,.05), f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=R(2500,4200); f.Q.value=3;
    const g=ctx.createGain(); env(g,t,.002,vol,.035); n.connect(f); f.connect(g); g.connect(o);
    const s=ctx.createOscillator(); s.type='triangle'; s.frequency.value=R(3200,4800);
    const g2=ctx.createGain(); env(g2,t,.001,vol*.15,.05); s.connect(g2); g2.connect(o); s.start(t); s.stop(t+.08);
  }
  function rub(t,o,vol,d){             // chiffon qui frotte le verre
    const n=noise(t,d), f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=R(1200,1800); f.Q.value=1.2;
    const g=ctx.createGain(); env(g,t,.06,vol,d*.8); n.connect(f); f.connect(g); g.connect(o);
    if(Math.random()<.35){ // petit couinement du verre
      const s=ctx.createOscillator(); s.type='sine'; s.frequency.setValueAtTime(R(1700,2300),t+.05);
      s.frequency.linearRampToValueAtTime(R(2400,3000),t+.2);
      const g2=ctx.createGain(); env(g2,t+.05,.02,vol*.12,.15); s.connect(g2); g2.connect(o); s.start(t+.05); s.stop(t+.3);
    }
  }
  function stopBarman(){ while(live.length){clearTimeout(live.pop());} }
  function later(ms,fn){ live.push(setTimeout(fn,ms)); }
  function barman(pose,dur,x){
    if(x!==undefined)bx=x;
    stopBarman();
    if(ctx.state!=='running')return;
    const t=ctx.currentTime+.01, o=out(bx,BV);
    switch(pose){
      case 0: thunk(t+.15,o,.35); break;                               // pose la bouteille et le verre
      case 1: clink(t+.05,o,.12,R(2600,3000)); pour(t+.35,o,Math.min(2.2,dur-.6),.28,500,1300,false); break; // verse le whisky
      case 2: { // shaker
        const n=Math.floor((dur-.3)*8.3);
        for(let i=0;i<n;i++) rattle(t+.1+i/8.3+R(-.01,.01),o,R(.25,.38));
        later((dur-.15)*1000,()=>{ if(ctx.state==='running') thunk(ctx.currentTime,out(bx,BV),.3); });
        break; }
      case 3: { // remue : glaçons qui tintent
        let k=.15; while(k<dur-.2){ clink(t+k,o,R(.06,.12),R(2800,4200)); k+=R(.18,.45); } break; }
      case 4: { // essuie un verre
        let k=.1; while(k<dur-.3){ rub(t+k,o,.16,R(.35,.55)); k+=R(.55,.8); } break; }
      case 5: // tireuse à bière
        thunk(t+.05,o,.25);
        pour(t+.4,o,Math.min(2.8,dur-.7),.26,1400,2300,true);
        break;
      case 7: thunk(t+.2,o,.4); clink(t+.24,o,.08); break;              // sert le cocktail
      case 6: clink(t+.05,o,.05,R(1800,2100)); break;                   // prend le plateau
    }
  }


  // ---------- musique de taverne (composition originale, ambiance aventure) ----------
  const mus=ctx.createGain(); mus.gain.value=0.0001; mus.connect(master);
  const musRev=ctx.createGain(); musRev.gain.value=0.5; mus.connect(musRev); musRev.connect(rev);
  const hz=m=>440*Math.pow(2,(m-69)/12);
  const BEAT=60/84, BAR=BEAT*3;
  const CH={D:[50,54,57],G:[55,59,62],A:[57,61,64],Bm:[59,62,66],Em:[52,55,59],Fm:[54,57,61]};
  const BASS={D:38,G:43,A:45,Bm:47,Em:40,Fm:42};
  // grille : 16 mesures (une ou deux harmonies par mesure)
  const SONG=[['D'],['G'],['A'],['D'],['Bm'],['G'],['Em','A'],['D'],
              ['G'],['D'],['Em'],['A'],['Fm'],['Bm'],['G','A'],['D']];
  const MEL=[[[78,2],[76,.5],[74,.5]],[[71,1],[74,1],[79,1]],[[76,2],[73,1]],[[74,3]],
             [[78,1.5],[81,.5],[83,1]],[[81,1],[79,1],[78,1]],[[79,1],[76,1],[73,1]],[[74,2],[0,1]],
             [[83,2],[81,1]],[[78,1.5],[76,.5],[78,1]],[[79,2],[76,1]],[[73,2],[69,1]],
             [[73,1],[76,1],[81,1]],[[78,2],[74,1]],[[76,1],[79,1],[73,1]],[[74,3]]];
  function pluck(t,m,v){ // luth / harpe
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type='triangle';o2.type='sawtooth';o.frequency.value=hz(m);o2.frequency.value=hz(m)*1.003;
    const g2=ctx.createGain();g2.gain.value=.25;
    f.type='lowpass';f.Q.value=1;f.frequency.setValueAtTime(3200,t);f.frequency.exponentialRampToValueAtTime(600,t+.5);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
    o.connect(f);o2.connect(g2);g2.connect(f);f.connect(g);g.connect(mus);
    o.start(t);o2.start(t);o.stop(t+1.5);o2.stop(t+1.5);
  }
  function bass(t,m,d){
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    o.type='sine';o2.type='triangle';o.frequency.value=hz(m);o2.frequency.value=hz(m);
    f.type='lowpass';f.frequency.value=500;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.32,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);o2.connect(f);f.connect(g);g.connect(mus);o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);
  }
  function pad(t,notes,d){ // accordéon doux en fond
    notes.forEach(m=>{[0,1].forEach(k=>{
      const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
      o.type='sawtooth';o.frequency.value=hz(m+12)*(k?1.004:.996);
      f.type='lowpass';f.frequency.value=900;
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.018,t+.4);g.gain.setValueAtTime(.018,t+d-.3);g.gain.linearRampToValueAtTime(0.0001,t+d);
      o.connect(f);f.connect(g);g.connect(mus);o.start(t);o.stop(t+d+.05);
    });});
  }
  function ocarina(t,m,d,v){ // flûte / ocarina chaleureuse
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),vib=ctx.createOscillator(),vg=ctx.createGain();
    o.type='sine';o2.type='sine';o.frequency.value=hz(m);o2.frequency.value=hz(m)*2;
    const h=ctx.createGain();h.gain.value=.12;
    vib.frequency.value=5.2;vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(hz(m)*.006,t+Math.min(.5,d*.6));
    vib.connect(vg);vg.connect(o.frequency);vg.connect(o2.frequency);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.07);
    g.gain.setValueAtTime(v*.85,t+Math.max(.1,d-.12));g.gain.linearRampToValueAtTime(0.0001,t+d+.08);
    o.connect(g);o2.connect(h);h.connect(g);g.connect(mus);
    // petit souffle
    const n=noise(t,.12),nf=ctx.createBiquadFilter(),ng=ctx.createGain();nf.type='bandpass';nf.frequency.value=hz(m)*2;nf.Q.value=2;
    env(ng,t,.02,v*.25,.1);n.connect(nf);nf.connect(ng);ng.connect(mus);
    [o,o2,vib].forEach(x=>{x.start(t);x.stop(t+d+.15);});
  }
  let musT=0,musBar=0,musOn=false,pass=0;
  function scheduleBar(t,i){
    const ch=SONG[i];
    // basse + accord
    if(ch.length===1){ bass(t,BASS[ch[0]],BAR*.95); pad(t,CH[ch[0]],BAR); }
    else { bass(t,BASS[ch[0]],BEAT*2); bass(t+BEAT*2,BASS[ch[1]],BEAT); pad(t,CH[ch[0]],BEAT*2); pad(t+BEAT*2,CH[ch[1]],BEAT); }
    // arpège de luth en croches
    for(let e=1;e<6;e++){
      const c=CH[ch.length===2&&e>=4?ch[1]:ch[0]];
      const pat=[0,c[0]+12,c[1]+12,c[2]+12,c[1]+12,c[0]+24];
      pluck(t+e*BEAT/2+(Math.random()-.5)*.012,pat[e],e===3?.09:.07);
    }
    // mélodie (au 2e passage, la première moitié est jouée plus bas et plus douce)
    let k=0; const low=(pass%2===1&&i<8);
    MEL[i].forEach(([m,b])=>{ if(m) ocarina(t+k*BEAT,m-(low?12:0),b*BEAT*.95,low?.07:.1); k+=b; });
  }
  function musTick(){
    if(ctx.state!=='running')return;
    if(!musOn){ musOn=true; musT=ctx.currentTime+.2; mus.gain.setValueAtTime(0.0001,ctx.currentTime); mus.gain.exponentialRampToValueAtTime(.55,ctx.currentTime+3); }
    while(musT<ctx.currentTime+.6){
      scheduleBar(musT,musBar); musT+=BAR; musBar++;
      if(musBar>=SONG.length){musBar=0;pass++;}
    }
  }
  setInterval(musTick,120);
  // ---------- autorisation du son (les navigateurs l'exigent) ----------
  const hint=document.getElementById('sonHint');
  function unlock(){ ctx.resume().then(()=>{ if(hint)hint.style.display='none'; }); }
  ['pointerdown','touchstart','keydown','click'].forEach(e=>addEventListener(e,unlock,{passive:true}));
  ctx.resume().catch(()=>{});
  setTimeout(()=>{ if(ctx.state==='running'&&hint)hint.style.display='none'; },300);

  return {step,sweep,barman,stopBarman,ctx};
})();

</script>
<script>
(function(){
  // ---- mise à l'échelle de la scène (toujours entière, centrée) ----
  const stage=document.getElementById('stage');
  function fit(){
    const W=innerWidth,H=innerHeight,s=Math.min(W/2172,H/724);
    if(window.GB_CAMERA) return window.GB_CAMERA();
    stage.style.transform='translate('+((W-2172*s)/2)+'px,'+((H-724*s)/2)+'px) scale('+s+')';
  }
  addEventListener('resize',fit);fit();
  window.GB_FIT=fit;

  // ---- poses de la planche ----
  // 0 bouteille | 1 verse le whisky | 2 shaker | 3 remue | 4 essuie un verre
  // 5 tireuse à bière | 6 plateau vide (marche) | 7 présente le cocktail
  const FW=142,FH=130,BOTTOM=412;        // bas du sprite = dessus du comptoir
  const XMIN=890,XMAX=1210;               // entre le vase et les cristaux
  const bm=document.getElementById('barman');
  const L=[document.getElementById('pA'),document.getElementById('pB')];
  let cur=0,pose=-1;
  function setPose(p){
    if(p===pose)return; pose=p;
    const next=L[1-cur];
    next.style.backgroundPosition=(-p*FW)+'px 0';
    next.classList.add('on'); L[cur].classList.remove('on'); cur=1-cur;
  }

  // ---- programme du barman ----
  const R=(a,b)=>a+Math.random()*(b-a);
  const SEQ=[
    [[0,2.2],[1,3.2],[3,3],[7,2.6]],   // whisky : montre, verse, remue, sert
    [[4,5]],                           // essuie un verre
    [[5,3.6],[7,2.4]],                 // tire une bière, la sert
    [[2,3],[7,2.6]],                   // shaker puis cocktail
    [[0,2.4],[4,3]]
  ];
  let x=1050,queue=[],state='act',t0=0,dur=0,walk=null,lastSeq=-1;
  function plan(){
    if(state!=='walk' && Math.random()<0.6 && queue.length===0 && lastSeq!==-2){
      let tx; do{tx=R(XMIN,XMAX);}while(Math.abs(tx-x)<90);
      lastSeq=-2;
      queue.push({walk:tx});
      return;
    }
    let s; do{s=Math.floor(Math.random()*SEQ.length);}while(s===lastSeq);
    lastSeq=s;
    SEQ[s].forEach(([p,d])=>queue.push({pose:p,d:d*R(.85,1.2)}));
  }
  function nextStep(now){
    if(!queue.length)plan();
    const q=queue.shift();
    if(q.walk!==undefined){
      setPose(6); SFX.barman(6,1,x);
      const dist=Math.abs(q.walk-x);
      walk={from:x,to:q.walk,start:now+350,dur:dist/62*1000,phase:0};
      state='walk'; t0=now; dur=350+walk.dur+450;
    }else{
      setPose(q.pose); state='act'; t0=now; dur=q.d*1000; SFX.barman(q.pose,q.d,x);
    }
  }

  // ---- boucle d'animation ----
  let prev=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-prev)/1000); prev=now;
    const t=now/1000;
    if(now-t0>=dur) nextStep(now);

    let dy=0,rot=0,sx=1,sy=1,dx=0;
    // respiration douce
    sy+=Math.sin(t*1.6)*0.006;

    if(state==='walk' && walk){
      // enfoncé un peu derrière le comptoir pendant la marche (le bas ne se voit jamais)
      const el=(now-t0)/1000, rem=(t0+dur-now)/1000;
      dy+=9*Math.min(1,el/.3,Math.max(0,rem)/.3);
      const k=(now-walk.start)/walk.dur;
      if(k>0 && k<1){
        const dir=Math.sign(walk.to-walk.from);
        // vitesse : démarrage et arrêt progressifs + petite poussée à chaque pas
        const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
        const steps=walk.dur/1000*1.9;           // ~1,9 pas par seconde
        const ph=k*steps*Math.PI;                // un demi-tour = un pas
        const surge=Math.sin(ph*2)*4*Math.sin(Math.PI*k);
        x=walk.from+(walk.to-walk.from)*e+dir*surge;
        const amp=Math.min(1,Math.sin(Math.PI*k)*2.2); // pas plus amples en plein élan
        // haut du pas / pied posé : le corps monte et redescend à chaque pas
        dy+=-Math.abs(Math.sin(ph))*7*amp;
        // tassement à l'impact du pied
        const hit=Math.pow(1-Math.abs(Math.sin(ph)),6);
        sy-=hit*0.018*amp; sx+=hit*0.01*amp;
        // balancier gauche / droite des épaules + inclinaison vers l'avant
        rot=Math.sin(ph)*1.8*amp + dir*1.2*amp;
        dx=Math.sin(ph)*2.5*amp;
      }else if(k>=1){ x=walk.to; }
    }else{
      const a=(now-t0)/1000;
      switch(pose){
        case 2: // secoue le shaker
          dy=Math.sin(a*26)*2.2; rot=Math.sin(a*26+1)*1.3; dx=Math.sin(a*13)*1.5; break;
        case 1: // verse : léger penché
          rot=-1.2*Math.min(1,a*2)+Math.sin(a*2)*0.3; break;
        case 3: // remue
          dx=Math.sin(a*7)*1.2; rot=Math.sin(a*7)*0.5; break;
        case 4: // essuie
          rot=Math.sin(a*5.5)*0.9; dx=Math.sin(a*5.5)*1.4; break;
        case 5: // tire la bière
          rot=0.8*Math.min(1,a*2)+Math.sin(a*1.5)*0.3; break;
        case 7: case 0: // présente : petit hochement
          dy=-Math.max(0,Math.sin(a*3.2))*2*(a<1.2?1:0); break;
      }
    }
    const left=x-FW/2+dx, top=BOTTOM-FH+dy;
    bm.style.transform='translate('+left.toFixed(2)+'px,'+top.toFixed(2)+'px) rotate('+rot.toFixed(3)+'deg) scale('+sx.toFixed(4)+','+sy.toFixed(4)+')';
    requestAnimationFrame(frame);
  }
  nextStep(performance.now());
  requestAnimationFrame(frame);
})();
</script>

const WDATA={"CW":354,"CH":350,"cols":6,"order":["A0","A1","A2","A3","A4","A5","B0","B1","B2","B3","B4","B5","C0","C1","C2","C3","C4","C5","D0","D1","D2","D3","D4","D5","D6","D7","D8","D9","D10","D11"],"f":[{"b":[180.7,108.2,30.7,30.7],"m":[146.0,80.0]},{"b":[171.6,111.0,30.5,30.5],"m":[150.0,80.0]},{"b":[172.6,110.1,30.8,30.8],"m":[131.0,80.0]},{"b":[177.4,109.0,30.5,30.5],"m":[153.0,80.0]},{"b":[177.1,109.0,30.5,30.5],"m":[144.0,80.0]},{"b":[172.6,109.8,30.5,30.5],"m":[140.0,80.0]},{"b":[186.0,104.9,51.0,33.0],"m":[178.2,72.0]},{"b":[172.0,104.6,51.0,33.0],"m":[178.5,72.0]},{"b":[171.0,103.4,51.0,33.0],"m":[177.7,72.0]},{"b":[180.0,103.3,51.0,33.0],"m":[178.2,72.0]},{"b":[192.0,105.1,51.0,33.0],"m":[177.6,72.0]},{"b":[180.0,103.4,51.0,33.0],"m":[177.7,72.0]},{"b":[178.3,107.6,51.0,31.0],"m":[178.2,72.0]},{"b":[172.0,106.3,51.2,31.0],"m":[169.7,72.0]},{"b":[159.2,107.1,51.0,31.0],"m":[153.9,72.0]},{"b":[191.8,105.6,51.3,31.0],"m":[187.5,72.0]},{"b":[173.1,106.0,51.3,31.0],"m":[169.5,72.0]},{"b":[175.4,107.0,51.3,31.0],"m":[174.9,72.0]},{"b":[160.0,133.0,30.0,30.0],"m":[133.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[128.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[134.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[127.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[134.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[127.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[128.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[128.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[128.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[128.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[128.0,80.0]},{"b":[160.0,133.0,30.0,30.0],"m":[133.0,80.0]}],"bristle":{"C":[115,175,243,237,177,150],"D":40}};
// ===================== LA FEMME AU BALAI =====================
(function(){
  const D=WDATA, CW=D.CW, CH=D.CH, COLS=D.cols;
  const S=0.86;                 // taille dans la scène
  const FEET=662;               // ligne des pieds sur le parquet
  const XMIN=190, XMAX=1985;
  const idx={}; D.order.forEach((n,i)=>idx[n]=i);
  const F=(g,i)=>idx[g+i];

  const stage=document.getElementById('stage');
  const box=document.getElementById('femme');
  const cv=document.getElementById('femmeGL');
  const fx=document.getElementById('fx'), g2=fx.getContext('2d');
  const sh0=document.getElementById('ombre').getContext('2d');
  box.style.width=CW+'px'; box.style.height=CH+'px';
  cv.width=CW; cv.height=CH;

  // ---------- WebGL : dessin de la pose + mouvement de la poitrine ----------
  const gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true});
  const vs=`attribute vec2 p;varying vec2 v;void main(){v=p;gl_Position=vec4(p*2.0-1.0,0.,1.);v.y=1.0-p.y;}`;
  const fs=`precision mediump float;varying vec2 v;
  uniform sampler2D t;uniform vec2 aS,cell;uniform vec2 o1,o2;uniform float mixv;
  uniform vec4 b1,b2;uniform vec2 d;
  vec2 warp(vec2 px,vec4 b){vec2 q=(px-b.xy)/b.zw;float r=dot(q,q);
    float w=r<1.0?(1.0-r)*(1.0-r):0.0;return px-d*w;}
  vec4 smp(vec2 o,vec2 px){vec2 uv=(o+px)/aS;
    if(px.x<0.0||px.y<0.0||px.x>cell.x||px.y>cell.y)return vec4(0.);return texture2D(t,uv);}
  void main(){vec2 px=v*cell;
    vec4 c1=smp(o1,warp(px,b1));vec4 c2=smp(o2,warp(px,b2));
    gl_FragColor=mix(c1,c2,mixv);}`;
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(pr,n);
  const uAS=U('aS'),uCell=U('cell'),uO1=U('o1'),uO2=U('o2'),uMix=U('mixv'),uB1=U('b1'),uB2=U('b2'),uD=U('d');
  let ready=false;
  const img=new Image();
  img.onload=()=>{
    const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.uniform2f(uAS,img.width,img.height);gl.uniform2f(uCell,CW,CH);
    ready=true;
  };
  img.src=WATLAS;
  const off=n=>[(n%COLS)*CW,Math.floor(n/COLS)*CH];

  // ---------- état ----------
  let x=620, dir=-1;            // dir -1 = regarde à gauche (sens des planches de profil)
  let cur=F('C',0), prevF=cur, fadeT=1, fadeDur=0.0001;
  // ressort de la poitrine (en pixels de la planche)
  let bx=0,by=0,vx=0,vy=0,restY=0;
  const kick=(ix,iy)=>{vx+=ix;vy+=iy;};
  function show(n,fade){
    if(n===cur)return;
    prevF=cur;cur=n;fadeT=0;fadeDur=fade||0.0001;
  }

  // ---------- particules : poussière et fumée ----------
  const parts=[];
  function toScene(px,py){ // point de la planche -> scène
    const lx=dir<0?px:CW-px;
    return [x+(lx-CW/2)*S, FEET-(CH-4-py)*S];
  }
  function dust(px,py,n,push){
    const [sx,sy]=toScene(px,py);
    for(let i=0;i<n;i++)parts.push({k:'d',x:sx+(Math.random()-.5)*14,y:sy-Math.random()*3,
      vx:(push*(dir<0?1:-1)+(Math.random()-.5)*30),vy:-Math.random()*22-4,life:0,max:.6+Math.random()*.6,r:1+Math.random()*1.8});
  }
  function smoke(px,py,n,strength){
    const [sx,sy]=toScene(px,py);
    const fwd=dir<0?-1:1;
    for(let i=0;i<n;i++)parts.push({k:'s',x:sx,y:sy,vx:fwd*(10+Math.random()*16)*strength+(Math.random()-.5)*6,
      vy:-(8+Math.random()*10),life:-i*0.05,max:1.8+Math.random()*1.2,r:2+Math.random()*2});
  }

  // ---------- programme ----------
  const R=(a,b)=>a+Math.random()*(b-a);
  let state=null, st=0, steps=[], si=0, stepT=0, lastAct='';
  // séquences de fume (pose, durée, effet)
  const SMOKE_FRONT=[[2,1],[1,.5],[0,1.6,'puff'],[3,1,'exhale'],[5,.6],[4,1.4,'puff'],[3,1.1,'exhale'],[1,.6],[2,.9]];
  const SMOKE_SIDE =[[2,1],[1,.6],[0,1.6,'puff'],[5,1.1,'exhale'],[3,.7],[4,1.5,'puff'],[1,.9,'exhale'],[2,.9]];

  function choose(){
    // enchaînement : balayer de face -> (fumer de face) -> marcher en balayant -> (fumer de profil)
    if(lastAct==='walk'){
      if(Math.random()<.4) return start('smokeSide');
      return start('sweep');
    }
    if(lastAct==='sweep'){
      if(Math.random()<.3) return start('smokeFront');
      return start('walk');
    }
    if(lastAct==='smokeFront') return start(Math.random()<.5?'sweep':'walk');
    if(lastAct==='smokeSide') return start('sweep');
    return start('sweep');
  }
  function start(s){
    state=s; lastAct=s; st=0; si=0; stepT=0;
    if(s==='sweep'){ steps=null; state_dur=R(4,8); si=0; show(F('C',0),.12); }
    if(s==='smokeFront'){ steps=SMOKE_FRONT; show(F('B',steps[0][0]),.2); }
    if(s==='smokeSide'){ steps=SMOKE_SIDE; show(F('A',steps[0][0]),.2); }
    if(s==='walk'){
      // trajet varié : elle continue souvent dans le même sens, va parfois jusqu'au bout de la salle
      let sens = Math.random()<.7 ? lastDir : -lastDir;
      if(x-XMIN<250) sens=1; if(XMAX-x<250) sens=-1;   // collée à un bord : elle repart de l'autre côté
      const r=Math.random(); let tx;
      if(r<.35)      tx = sens>0 ? R(XMAX-60,XMAX) : R(XMIN,XMIN+60);     // jusqu'au bout
      else if(r<.75) tx = x+sens*R(380,800);                              // longue distance
      else           tx = x+sens*R(180,340);                              // petit bout
      tx=Math.max(XMIN,Math.min(XMAX,tx));
      if(Math.abs(tx-x)<150) tx = sens>0 ? XMAX : XMIN;
      lastDir=sens;
      walkTo=tx; dir=Math.sign(tx-x)||-1; si=0; show(F('D',0),.0001);
    }
  }
  let state_dur=0, walkTo=0, lastDir=-1;

  const SWEEP_DT=.15, WALK_DT=.26;
  const WALK_SPEED=0.88*106*S/WALK_DT; // vitesse calée sur la longueur des pas des dessins

  function update(dt,t){
    st+=dt; stepT+=dt;
    if(state==='sweep'){
      if(stepT>=SWEEP_DT){
        stepT-=SWEEP_DT;
        const old=si; si=(si+1)%6;
        show(F('C',si),.05);
        const bo=D.bristle.C[old], bn=D.bristle.C[si], mv=bn-bo;
        // la poitrine suit le mouvement du corps avec du retard
        kick(-mv*1.1, 26+Math.abs(mv)*0.35);
        if(Math.abs(mv)>20) dust(bn,CH-6,3,mv*0.9);
        if(si===1||si===4) SFX.sweep(x,1,SWEEP_DT*2.6);
      }
      if(st>state_dur && si===0) choose();
    }
    else if(state==='walk'){
      if(stepT>=WALK_DT){
        stepT-=WALK_DT; si=(si+1)%12; show(F('D',si),.0001);
        // impact du pied : 1 image sur 2 (grand pas)
        if(si%2===0){ kick(-12,58); dust(D.bristle.D,CH-8,4,-26); SFX.step(x); }
        else { kick(-6,-14); if(si%4===1) SFX.sweep(x,.7,WALK_DT*1.6); }
      }
      const step=WALK_SPEED*dt*dir;
      x+=step;
      if((dir>0&&x>=walkTo)||(dir<0&&x<=walkTo)){ x=walkTo; choose(); }
      // petite fumée de la cigarette au coin de la bouche
      if(Math.random()<dt*1.2){ const m=D.f[cur].m; smoke(m[0]-6,m[1],1,.3); }
    }
    else if(state==='smokeFront'||state==='smokeSide'){
      const g=state==='smokeFront'?'B':'A';
      const s=steps[si];
      if(stepT>=s[1]){
        stepT=0; si++;
        if(si>=steps.length){ choose(); return; }
        const ns=steps[si];
        show(F(g,ns[0]),.22);
        kick(0,14);                       // le bras bouge, la poitrine suit un peu
        if(ns[2]==='exhale'){ const m=D.f[F(g,ns[0])].m; smoke(m[0],m[1],7,1); restY=0; kick(0,10); }
      }
      // inspiration : la poitrine se soulève pendant la bouffée
      const now=steps[si];
      restY = now[2]==='puff' ? -3.2*Math.min(1,stepT/0.9) : restY*0.96;
    }
  }

  // ---------- boucle ----------
  let prev=performance.now();
  start('sweep');
  function frame(now){
    const dt=Math.min(.05,(now-prev)/1000); prev=now; const t=now/1000;
    update(dt,t);
    // ressort amorti (ballottement réaliste)
    const K=170, C=7.5;
    const breath=Math.sin(t*1.7)*0.7;
    vx+=(-K*bx - C*vx)*dt; vy+=(-K*(by-(restY+breath)) - C*vy)*dt;
    bx+=vx*dt; by+=vy*dt;
    bx=Math.max(-7,Math.min(7,bx)); by=Math.max(-8,Math.min(8,by));
    fadeT=Math.min(1,fadeT+dt/fadeDur);

    // placement et sens
    const lft=x-CW/2*S+(dir<0?0:CW*S);
    box.style.transform='translate('+lft.toFixed(2)+'px,'+(FEET-(CH-4)*S).toFixed(2)+'px) scale('+(dir<0?S:-S)+','+S+')';
    if(ready){
      const a=off(prevF), b=off(cur);
      gl.viewport(0,0,CW,CH);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(uO1,a[0],a[1]);gl.uniform2f(uO2,b[0],b[1]);gl.uniform1f(uMix,fadeT);
      const p=D.f[prevF].b,q=D.f[cur].b;
      gl.uniform4f(uB1,p[0],p[1],p[2],p[3]);gl.uniform4f(uB2,q[0],q[1],q[2],q[3]);
      gl.uniform2f(uD,bx,by);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }

    // ombre au sol + particules
    g2.clearRect(0,0,2172,724);
    sh0.clearRect(0,0,2172,724);
    const grd=sh0.createRadialGradient(x,FEET-2,4,x,FEET-2,80);
    grd.addColorStop(0,'rgba(0,0,0,.35)');grd.addColorStop(1,'rgba(0,0,0,0)');
    sh0.fillStyle=grd;sh0.save();sh0.translate(x,FEET-2);sh0.scale(1,.16);sh0.translate(-x,-(FEET-2));
    sh0.beginPath();sh0.arc(x,FEET-2,80,0,7);sh0.fill();sh0.restore();
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i]; p.life+=dt;
      if(p.life<0)continue;
      if(p.life>p.max){parts.splice(i,1);continue;}
      const k=p.life/p.max;
      if(p.k==='d'){ p.vy+=60*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.96;
        if(p.y>FEET){p.y=FEET;p.vy*=-.2;}
        g2.fillStyle='rgba(150,120,85,'+(0.75*(1-k))+')';
        g2.beginPath();g2.arc(p.x,p.y,p.r,0,7);g2.fill();
      }else{
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.985; p.vy*=.99; p.x+=Math.sin(t*2+i)*0.15;
        const r=p.r+k*14;
        g2.fillStyle='rgba(225,230,240,'+(0.32*(1-k))+')';
        g2.beginPath();g2.arc(p.x,p.y,r,0,7);g2.fill();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
// ===================== NEIGE ET VENT DERRIÈRE LES FENÊTRES =====================
(function(){
  const cv=document.getElementById('neige'), g=cv.getContext('2d');
  const mask=new Image(); let ok=false;
  // le masque (gris) est converti en transparence
  mask.onload=()=>{

  const gusts=[];

  function frame(now){
    const dt=Math.min(.05,(now-prev)/1000);prev=now;const t=now/1000;

    g.clearRect(0,0,2172,724);

    if(Math.random()<dt*(wind>80?3:.6)){

(function(){
  const X0=1896,Y0=360,W=140,H=114;   // zone des flammes (le bas = les bûches, il ne bouge pas)
  const cv=document.getElementById('feu'); cv.width=W*2; cv.height=H*2;
  cv.style.left=X0+'px'; cv.style.top=Y0+'px'; cv.style.width=W+'px'; cv.style.height=H+'px';
  const gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true});
  const glow=document.getElementById('lueur');
  const sp=document.getElementById('braises'), g2=sp.getContext('2d');
  if(!gl) return;
  const vs=`attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x,1.0-p.y);gl_Position=vec4(p*2.0-1.0,0.,1.);}`;
  const fs=`precision mediump float;varying vec2 v;uniform sampler2D tex;uniform float t,fl;uniform vec2 sz;
  void main(){
    vec2 px=v*sz; float yn=v.y; float xn=v.x;
    float wx=smoothstep(0.0,0.22,xn)*smoothstep(1.0,0.78,xn);
    float wy=smoothstep(0.0,0.14,yn)*pow(1.0-yn,1.25);   // le haut des flammes bouge, la base reste
    float a=wx*wy;
    // courants d'air chaud qui montent
    float dx= 5.5*sin(px.y*0.115+t*7.3+px.x*0.045)+3.0*sin(px.y*0.24-t*11.7+px.x*0.11)+1.5*sin(px.y*0.5+t*17.0);
    float dy= 7.0*sin(px.x*0.075+t*5.3)+3.5*sin(px.x*0.19-t*9.1)+2.0*sin(px.x*0.37+t*13.0)-3.0*fl;
    vec2 s=(px+vec2(dx,dy)*a)/sz;
    s=clamp(s,vec2(0.002),vec2(0.998));
    vec4 c=texture2D(tex,s);
    // les flammes (pixels chauds) vacillent en lumière
    float hot=smoothstep(0.55,0.95,c.r)*smoothstep(0.25,0.75,c.r-c.b);
    c.rgb*=1.0+hot*(0.10+0.16*fl+0.07*sin(t*23.0+px.y*0.2));
    gl_FragColor=vec4(c.rgb,1.0);
  }`;
  function sh(ty,src){const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const uT=gl.getUniformLocation(pr,'t'),uF=gl.getUniformLocation(pr,'fl');
  gl.uniform2f(gl.getUniformLocation(pr,'sz'),W,H);
  let ready=false;
  const src=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().replace(/^url\(["']?/,'').replace(/["']?\)$/,'');
  const img=new Image();
  img.onload=()=>{
    // découpe de la zone du feu dans le décor (2x pour la netteté)
    const c=document.createElement('canvas');c.width=W*2;c.height=H*2;
    c.getContext('2d').drawImage(img,X0,Y0,W,H,0,0,W*2,H*2);
    const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    ready=true;
  };
  img.src=src;

  // braises qui s'envolent
  const SX=1900,SY=368,SW=130,SH=112; sp.style.left=SX+'px';sp.style.top=SY+'px';sp.width=SW;sp.height=SH;
  const em=[];
  let fl=0,flT=0,prev=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-prev)/1000);prev=now;const t=now/1000;
    // vacillement irrégulier (bruit lissé)
    flT=(Math.random()<dt*6)?Math.random():flT; fl+=(flT-fl)*Math.min(1,dt*9);
    if(ready){gl.viewport(0,0,W*2,H*2);gl.uniform1f(uT,t);gl.uniform1f(uF,fl);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
    glow.style.opacity=(0.62+fl*0.32+Math.sin(t*17)*0.04).toFixed(3);
    if(Math.random()<dt*7) em.push({x:R(28,102),y:SH-14-R(0,25),vx:R(-10,10),vy:-R(25,55),life:0,max:R(.6,1.4),r:R(.8,1.7)});
    g2.clearRect(0,0,SW,SH);g2.globalCompositeOperation='lighter';
    for(let i=em.length-1;i>=0;i--){const e=em[i];e.life+=dt;if(e.life>e.max){em.splice(i,1);continue;}
      e.vx+=Math.sin(t*6+i)*20*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;const k=e.life/e.max;
      g2.fillStyle='rgba(255,'+Math.round(190-k*120)+',60,'+(1-k)*(0.6+0.4*Math.random())+')';
      g2.beginPath();g2.arc(e.x,e.y,e.r*(1-k*.5),0,7);g2.fill();}
    g2.globalCompositeOperation='source-over';
    requestAnimationFrame(frame);
  }
  function R(a,b){return a+Math.random()*(b-a);}
  requestAnimationFrame(frame);
})();
</script>
