<script>
/* ---------- la rue se met en pause quand on est dans la moto, à la plage, au bar ou au restaurant ---------- */
(function(){
 var raf=window.requestAnimationFrame.bind(window), attente=[];
 window.PAUSE_RUE=false;
 window.requestAnimationFrame=function(cb){ if(window.PAUSE_RUE){ attente.push(cb); return 0; } return raf(cb); };
 // minuteries : pendant la pause, ce qui devait se déclencher attend la reprise
 var st=window.setTimeout.bind(window), si=window.setInterval.bind(window);
 window.minuterieLibre=st;                       // pour le passage d'un lieu à l'autre (jamais mis en pause)
 window.setTimeout=function(cb,ms){ var a=[].slice.call(arguments,2);
  return st(function(){ if(window.PAUSE_RUE){ attente.push(function(){ cb.apply(null,a); }); } else cb.apply(null,a); },ms); };
 window.setInterval=function(cb,ms){ var a=[].slice.call(arguments,2);
  return si(function(){ if(!window.PAUSE_RUE) cb.apply(null,a); },ms); };
 window.pauseRue=function(){
  if(window.PAUSE_RUE) return; window.PAUSE_RUE=true;
  var v=document.getElementById("vue"); if(v) v.style.visibility="hidden";   // plus aucun dessin ni animation de la rue
 };
 window.repriseRue=function(){
  if(!window.PAUSE_RUE) return; window.PAUSE_RUE=false;
  var v=document.getElementById("vue"); if(v) v.style.visibility="";
  var a=attente; attente=[]; a.forEach(function(cb){ if(cb.length) raf(cb); else st(cb,0); });
 };
 // libère la mémoire des lieux chargés (bar, restaurant) avant un gros trajet
 window.libereLieux=function(){
  ["bar","resto"].forEach(function(id){ var f=document.getElementById(id);
   if(f){ f.style.display="none"; f.removeAttribute("data-charge"); f.srcdoc=""; } });
 };
})();
</script>

 var PIED_X=38.02;          // position du pied dans l'image, en % de sa largeur

 var boite=document.createElement("div");

 }
 var A=calque(), B=calque();
 B.style.position="absolute"; B.style.left="0"; B.style.top="0"; B.style.opacity="0";
 respire.appendChild(A); respire.appendChild(B);
 monde.appendChild(boite);

 var devant=B, derriere=A, actuelle=-1;   // A garde la pose, B sert au fondu
 function montre(n){               // n = numéro de la pose sur la planche (1 à 18)
  if(n===actuelle) return;
  actuelle=n;
  if(derriere.getAttribute("src")===null){ derriere.src=T[n-1]; return; }
  devant.src=T[n-1];

 }

  [[14,1800]],                              // rigole
  [[15,1600]],                              // fait tomber la cendre

 function prochain(){
  if(!file.length){
   // 2 à 3 cycles à fumer sans rien faire, puis un geste au hasard
   var n=2+Math.floor(Math.random()*2);

/* ---------- vent : pétales et poussière ---------- */
(function(){
 var scene=document.getElementById("vue");
 var grains=[];
 function cree(classe,type,n){
  for(var i=0;i<n;i++){
   var e=document.createElement("div");
   e.className=classe; scene.appendChild(e);
   var p={el:e,type:type}; relance(p); grains.push(p);
  }
 }
 function relance(p){
  var h=scene.clientHeight, w=scene.clientWidth;
  if(p.type==="petale"){
   p.x=-40+Math.random()*(w+80);
   p.y=h*(0.10+Math.random()*0.28);
   p.vx=-(h*0.05)-Math.random()*h*0.05;
   p.vy=h*0.025+Math.random()*h*0.03;
   p.taille=h*(0.008+Math.random()*0.007);
   p.duree=5+Math.random()*4;
  }else{
   p.x=w+Math.random()*w*0.4;
   p.y=h*(0.80+Math.random()*0.14);
   p.vx=-(h*0.28)-Math.random()*h*0.25;
   p.vy=-h*0.012*Math.random();
   p.taille=h*(0.003+Math.random()*0.004);
   p.duree=1.6+Math.random()*1.8;
  }
  p.vie=0;
  p.el.style.width=p.taille+"px";
  p.el.style.height=(p.type==="petale"?p.taille*0.72:p.taille)+"px";
 }
 cree("petale","petale",8);
 cree("poussiere","poussiere",10);

 var hScene=scene.clientHeight; window.addEventListener("resize",function(){ hScene=scene.clientHeight; });
 var t0=0;
 function anime(t){
  requestAnimationFrame(anime);
  if(!t0) t0=t;
  var dt=Math.min((t-t0)/1000,0.05); t0=t;
  var h=hScene;
  for(var i=0;i<grains.length;i++){
   var p=grains[i];
   p.vie+=dt;
   if(p.vie>p.duree || p.x<-60 || p.y>h*1.03){ relance(p); continue; }
   p.x+=p.vx*dt;
   p.y+=p.vy*dt + (p.type==="petale" ? Math.sin(p.vie*3)*h*0.05*dt : 0);
   var o=Math.min(1,p.vie*2)*Math.max(0,1-p.vie/p.duree);
   p.el.style.transform="translate3d("+p.x+"px,"+p.y+"px,0) rotate("+(p.vie*(p.type==="petale"?160:50))+"deg)";
   p.el.style.opacity=o*(p.type==="petale"?0.9:0.5);
  }
 }
 requestAnimationFrame(anime);
})();

<script>

(function(){

 },120);

 function partEnMoto(dest){

  // la musique de la rue continue pendant la moto (elle ne s'arrête jamais)
  window.libereLieux(); window.pauseRue();
  var octets=LIEU_OCTETS("lieux/moto.html");

  var cadre=document.getElementById("moto");

 }

   cv.srcdoc=hv;

  if(e.data && (e.data.type==="delabree:destination"||e.data.type==="vaviel:destination") && (e.data.dest==="shinato"||e.data.dest==="plage"||e.data.dest==="delabree"||e.data.dest==="vaviel")){
   // depuis le bout gauche de la ville délabrée : la moto, vers Shinato (bout droit de la ville) ou vers la plage (bout gauche)

   var cmv=document.getElementById("moto"); if(!cmv) return;
   var omv=LIEU_OCTETS("lieux/moto.html");

   window.minuterieLibre(function(){ try{ cmv.focus(); }catch(err){} },300);
   return;
  }
  if(e.data && e.data.type==="plage:destination" && (e.data.dest==="shinato"||e.data.dest==="delabree"||e.data.dest==="vaviel")){
   // depuis la plage : on reprend la moto (vers Shinato, la ville, ou vers la ville délabrée)
   window.DESTINATION_MOTO=e.data.dest==="shinato"?"ville":e.data.dest;

 var ici=null, parti=false;
 setInterval(function(){
  if(typeof x==="undefined"||!largeurMonde||window.PAUSE_RUE){ ici=null; fl.style.display="none"; btn.style.display="none"; return; }
  var d=x/largeurMonde*7078; ici=null;
  for(var i=0;i<JEUX.length;i++) if(d>=JEUX[i].de&&d<=JEUX[i].a){ ici=JEUX[i]; break; }
  fl.style.display=ici?"block":"none"; btn.style.display=ici?"block":"none";
  if(ici){ var hp=hauteurScene*TAILLE; fl.style.left=x+"px"; fl.style.top=(hauteurScene*SOL-hp*1.25)+"px"; }
 },80);
 window.appuiSur(btn,function(){
  if(!ici) return; dir=0;
  if(window.Chambre&&window.Chambre.jouer){
   parti=true;
   try{ if(window.RUDY_AUDIO) window.RUDY_AUDIO.pause(); }catch(e){}   // le jeu a sa propre musique
   window.Chambre.jouer(ici.nom);
  }else{ toast.textContent="Ce jeu se lance depuis l'appli"; toast.style.display="block"; setTimeout(function(){ toast.style.display="none"; },1800); }
 });
 // retour du jeu : la rue reprend, sa musique aussi
 document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&parti){ parti=false; try{ if(window.RUDY_AUDIO){ var p=window.RUDY_AUDIO.play(); if(p&&p.catch)p.catch(function(){}); } }catch(e){} }
 });
})();

/* ---------- garde-fous de la promenade : le stick et les boutons ne restent jamais bloqués ---------- */
(function(){
 function relache(){ dir=0; var s=document.getElementById("stick"); if(s) s.style.transform="translate(0,0)"; }
 // la rue ne reste jamais en pause si aucun autre lieu n'est ouvert
 window.minuterieLibre(function veille(){
  try{
   if(window.PAUSE_RUE){
    var ouvert=["bar","resto","moto"].some(function(id){ var f=document.getElementById(id); return f&&getComputedStyle(f).display!=="none"; });
    if(!ouvert){ window.repriseRue(); relache(); }
   }
  }catch(e){}
  window.minuterieLibre(veille,1000);
 },1000);
 // retour dans l'appli (appel, notification, jeu fini) : on repart propre
 document.addEventListener("visibilitychange",function(){ if(!document.hidden) relache(); });
 window.addEventListener("pageshow",relache);
})();
</script>
<style>

#rentrer .carte{min-width:62vmin;padding:5vmin 6vmin;border-radius:3vmin;text-align:center;background:linear-gradient(rgba(14,14,18,.96),rgba(30,30,36,.96));border:2px solid rgba(255,226,122,.6);box-shadow:0 10px 40px rgba(0,0,0,.7)}
#rentrer h2{margin:0 0 4vmin;color:#fff;font:900 clamp(16px,4.2vmin,34px)/1.2 Arial,sans-serif;letter-spacing:2px;text-shadow:0 3px 0 #000}

<div id="rentrer"><div class="carte"><h2>VOULEZ-VOUS RENTRER&nbsp;?</h2><div class="ch"><div class="choix" id="rentrerOui">OUI</div><div class="choix" id="rentrerNon">NON</div></div></div></div>
<script>
/* ---------- tout à gauche de la rue de Shinato : rentrer dans la chambre ---------- */
(function(){
 var boite=document.getElementById("rentrer"), ouvert=false, arme=false;
 function montre(){ ouvert=true; arme=false; dir=0; boite.style.display="flex"; }
 function cache(){ ouvert=false; boite.style.display="none"; }
 window.appuiSur(document.getElementById("rentrerNon"),cache);                     // NON : on reste à Shinato
 window.appuiSur(document.getElementById("rentrerOui"),function(){                  // OUI : retour au bureau
  cache(); try{ if(window.Chambre&&window.Chambre.rentrer) window.Chambre.rentrer(); }catch(e){}
 });
 window.minuterieLibre(function veille(){
  try{
   if(typeof x!=="undefined"&&largeurMonde&&!window.PAUSE_RUE){
    var hp=hauteurScene*TAILLE, bout=hp*0.5;
    if(!ouvert&&arme&&x<=bout+2) montre();
    if(x>bout+hp*0.6) arme=true;                 // il faut s'être un peu éloigné du bord pour que la question revienne
   }
  }catch(e){}
  window.minuterieLibre(veille,120);
 },500);
})();
</script>
<script>
/* ---------- l'argent : en haut à droite, dans la chambre et dans toutes les rues ----------
   (il ne s'affiche pas dans les mini-jeux ni dans les émulateurs) */
(function(){
 if(window.__argentPose) return; window.__argentPose=true;
 var css=document.createElement("style");
 css.textContent="#argentHUD{position:fixed;top:max(6px,env(safe-area-inset-top,0px));right:8px;z-index:25;display:flex;align-items:center;gap:5px;"+
  "padding:3px 8px 3px 4px;border-radius:999px;background:rgba(10,10,14,.62);border:1px solid rgba(255,226,122,.55);"+
  "pointer-events:none;font:800 13px/1 Arial,Helvetica,sans-serif;color:#ffe27a;text-shadow:0 1px 2px #000}"+
  "#argentHUD img{width:22px;height:21px;display:block}";
 document.head.appendChild(css);
 var d=document.createElement("div"); d.id="argentHUD";
 d.innerHTML='<img alt="" src="/assets/shinato/m/f4b8c806f85db77a.webp"><span>0 €</span>';
 var txt=d.querySelector("span");
 function pose(){ if(document.body){ document.body.appendChild(d); } else setTimeout(pose,50); }
 pose();
 function lire(){
  try{ if(window.Chambre&&window.Chambre.argent) return parseInt(window.Chambre.argent(),10)||0; }catch(e){}
  try{ var v=localStorage.getItem("rudy_argent"); return v===null?1000:(parseInt(v,10)||0); }catch(e){}
  return 1000;
 }
 function maj(){ var n=lire(); txt.textContent=n.toLocaleString("fr-FR")+" €"; }
 maj(); setInterval(maj,1000);
 window.addEventListener("pageshow",maj);
 document.addEventListener("visibilitychange",function(){ if(!document.hidden) maj(); });

 function toast(txt){
  var t=document.getElementById("argentMsg");
  if(!t){ t=document.createElement("div"); t.id="argentMsg";
   t.style.cssText="position:fixed;top:44px;right:8px;z-index:26;padding:7px 12px;border-radius:12px;background:rgba(10,10,14,.9);"+
    "border:2px solid rgba(255,226,122,.8);color:#ffe27a;font:800 13px Arial,sans-serif;pointer-events:none;opacity:0;transition:opacity .25s";
   document.body.appendChild(t); }
  t.textContent=txt; t.style.opacity="1"; clearTimeout(t.__t); t.__t=setTimeout(function(){ t.style.opacity="0"; },1700);
 }

 /** La vie de Rudy (0 à 100). Elle ne se remplit plus toute seule : il faut l'infirmerie. */
 window.vieLire=function(){ try{ var v=localStorage.getItem("rudy_vie"); var n=v===null?100:parseInt(v,10); return Math.max(0,Math.min(100,isNaN(n)?100:n)); }catch(e){ return 100; } };
 window.vieEcrire=function(n){ try{ localStorage.setItem("rudy_vie",String(Math.max(0,Math.min(100,Math.round(n))))); }catch(e){} };
 window.argentLire=lire;
 window.argentMessage=toast;
 /** Payer un jeu : renvoie false et prévient s'il n'y a pas assez d'argent. */
 window.argentPayer=function(n,quoi){
  if(lire()<n){ toast("Pas assez d'argent ("+n+" €)"); return false; }
  window.argentAjouter(-n); toast("-"+n+" €"+(quoi?" · "+quoi:"")); return true;
 };
 /** Gagner ou perdre à la fin d'un jeu. */
 window.argentGain=function(n){ if(!n) return; window.argentAjouter(n); toast((n>0?"+":"")+n+" €"); };
 // pour plus tard : gagner ou dépenser depuis le jeu
 window.argentAjouter=function(n){
  try{ if(window.Chambre&&window.Chambre.ajouterArgent){ window.Chambre.ajouterArgent(n); maj(); return; } }catch(e){}
  try{ localStorage.setItem("rudy_argent",String(Math.max(0,lire()+n))); }catch(e){}
  maj();
 };
})();
</script></body>
