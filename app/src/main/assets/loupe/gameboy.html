  #scene{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(80% 66% at 50% 56%, rgba(0,0,0,0) 50%, rgba(8,5,18,.46) 100%)}
  #aide{position:fixed;left:0;right:0;bottom:calc(1.2rem + env(safe-area-inset-bottom));
    text-align:center;font-size:.82rem;color:#d9cbae;text-shadow:0 1px 8px rgba(0,0,0,.9);
    transition:opacity .6s;pointer-events:none}

    display:flex;gap:.15rem;padding:.22rem;border-radius:999px;

    background:none;color:#cdbfa4;cursor:pointer}
  #alim button[aria-pressed=true]{background:#e8dcc2;color:#221a2c}

    font-size:.75rem;color:#cdbfa4;text-shadow:0 1px 8px rgba(0,0,0,.9);font-variant-numeric:tabular-nums}
</style>
</head>

/* grain du plastique : le même sur toutes les faces */
function bruit(t, oct){
  const c = document.createElement("canvas"); c.width = c.height = t;
  const g = c.getContext("2d");
  g.fillStyle = "#808080"; g.fillRect(0,0,t,t);
  for(let o=0;o<oct;o++){
    const n = 8 << o, p = document.createElement("canvas"); p.width = p.height = n;
    const pg = p.getContext("2d"), im = pg.createImageData(n,n);
    for(let i=0;i<n*n;i++){ const v = 128 + (Math.random()-.5)*250;
      im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v; im.data[i*4+3]=255; }
    pg.putImageData(im,0,0);
    g.globalAlpha = .5/(o+1); g.globalCompositeOperation = "overlay";
    g.drawImage(p,0,0,t,t);
  }
  g.globalAlpha=1; g.globalCompositeOperation="source-over"; return c;
}
function versNormale(src, force){
  const t = src.width, s = src.getContext("2d").getImageData(0,0,t,t).data;
  const c = document.createElement("canvas"); c.width=c.height=t;
  const g = c.getContext("2d"), out = g.createImageData(t,t);
  const h=(x,y)=>s[(((y+t)%t)*t+((x+t)%t))*4]/255;
  for(let y=0;y<t;y++) for(let x=0;x<t;x++){
    const dx=(h(x+1,y)-h(x-1,y))*force, dy=(h(x,y+1)-h(x,y-1))*force, l=Math.hypot(dx,dy,1), i=(y*t+x)*4;
    out.data[i]=((-dx/l)*.5+.5)*255; out.data[i+1]=((-dy/l)*.5+.5)*255;
    out.data[i+2]=((1/l)*.5+.5)*255; out.data[i+3]=255;
  }
  g.putImageData(out,0,0); return c;
}
function rep(canvas, r){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(r,r); t.anisotropy = ANISO;
  return t;
}
const grain = bruit(256,4);
const NORM = rep(versNormale(grain, 1.9), 14);
const RUGO = rep(grain, 14);

function studio(){

  f.addColorStop(0,"#ffffff"); f.addColorStop(.42,"#d2cdc0");
  f.addColorStop(.56,"#6f685c"); f.addColorStop(1,"#231e19");
  g.fillStyle=f; g.fillRect(0,0,1024,512);
  g.filter="blur(24px)"; g.fillStyle="#ffffff";
  g.fillRect(95,45,300,190); g.fillRect(650,75,200,140);
  g.filter="blur(58px)"; g.fillStyle="#f6ead6"; g.fillRect(390,0,250,110);
  g.filter="none";
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding;
  // la piece elle-meme teinte les reflets : sans ca la console reste grise dans un decor chaud
  const piece = new Image();
  piece.onload = () => {
    g.globalAlpha = .62; g.drawImage(piece, 0, 40, 1024, 430); g.globalAlpha = 1;
    g.filter = "blur(22px)"; g.fillStyle = "#ffe6bd";
    g.fillRect(120, 30, 250, 150); g.fillRect(660, 55, 180, 120);
    g.filter = "none";
    t.needsUpdate = true;
  };
  piece.src = FOND;
  return t;
}

function rectArrondi(w,h,tl,tr,br,bl){
  const s=new THREE.Shape(), x=-w/2, y=-h/2;
  s.moveTo(x+tl,y+h);
  s.lineTo(x+w-tr,y+h); s.quadraticCurveTo(x+w,y+h,x+w,y+h-tr);
  s.lineTo(x+w,y+br);   s.quadraticCurveTo(x+w,y,x+w-br,y);
  s.lineTo(x+bl,y);     s.quadraticCurveTo(x,y,x,y+bl);
  s.lineTo(x,y+h-tl);   s.quadraticCurveTo(x,y+h,x+tl,y+h);
  return s;
}
function extruder(shape,prof,biseau,seg){
  const g = new THREE.ExtrudeGeometry(shape,{depth:prof-biseau*2,bevelEnabled:true,
    bevelThickness:biseau,bevelSize:biseau,bevelOffset:0,bevelSegments:6,curveSegments:seg||34});
  g.translate(0,0,-prof/2+biseau); g.computeVertexNormals(); return g;
}

/* la tranche est une bande qui epouse le contour : sur les coins arrondis,
   un plan rectangulaire depassait dans le vide */
function tranche(){
  const d = CONF.DEC;
  const forme = rectArrondi(L + d*2, H + d*2, .046+d, .046+d, .238+d, .046+d);
  const pts = forme.getPoints(72);
  while(pts.length > 1 && pts[0].distanceTo(pts[pts.length-1]) < 1e-7) pts.pop();
  const n = pts.length;

  let total = 0; const lng = new Array(n), acc = new Array(n);
  for(let i=0;i<n;i++){ acc[i]=total; lng[i]=pts[i].distanceTo(pts[(i+1)%n]); total+=lng[i]; }

  /* on demarre au milieu de l'arrondi haut-gauche, la ou l'atlas commence */
  const viseeL = total * CONF.U0;
  let i0 = 0, ecart = Infinity;
  for(let i=0;i<n;i++){ const e = Math.abs(acc[i]-viseeL); if(e<ecart){ ecart=e; i0=i; } }

  const zf = P/2 + .0022, zb = -P/2 - .0022;
  const pos=[], nor=[], uv=[], idx=[];
  let cum = 0;
  for(let k=0;k<=n;k++){
    const i = (i0+k)%n, j = (i0+k+1)%n;
    const tx = pts[j].x-pts[i].x, ty = pts[j].y-pts[i].y;
    const lg = Math.hypot(tx,ty) || 1e-6;
    const nx = -ty/lg, ny = tx/lg;
    const u = cum/total;
    pos.push(pts[i].x,pts[i].y,zf,  pts[i].x,pts[i].y,zb);
    nor.push(nx,ny,0,               nx,ny,0);
    uv.push(u,0,                    u,1);
    if(k<n){ const a=k*2; idx.push(a,a+1,a+2,  a+1,a+3,a+2); }
    cum += lng[i];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("normal",   new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute("uv",       new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);

  const t = img(TEX.tranche);
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    map:t, roughness:.62, metalness:.03, envMap:ENV, envMapIntensity:.45,
    side:THREE.DoubleSide
  }));
  m.castShadow = m.receiveShadow = true;
  return m;
}
machine.add(tranche());

function dessus(src, w, h){
  const m = new THREE.MeshStandardMaterial({map:img(src), alphaTest:.5,
    roughness:.42, metalness:.05, envMap:ENV, envMapIntensity:.75});
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h), m);
}

/* A et B : cylindre photographié sur le dessus */
function rond(c){
  const g = new THREE.Group();
  const cyl = new THREE.Mesh(
    new THREE.CylinderGeometry(c.r*.985, c.r*.93, .030, 52),
    new THREE.MeshStandardMaterial({color:0x7e2247, roughness:.4, metalness:.06,
      envMap:ENV, envMapIntensity:.8, normalMap:NORM, roughnessMap:RUGO})
  );
  cyl.rotation.x = Math.PI/2; cyl.position.z = -.001;
  g.add(cyl);
  const t = dessus(c.tex, c.r*2, c.r*2); t.position.z = .0155; g.add(t);
  g.position.set(c.x, c.y, AV + .0165);
  return g;
}
poser("A", rond({x:CONF.A.x, y:CONF.A.y, r:CONF.A.r, tex:TEX.A}));
poser("B", rond({x:CONF.B.x, y:CONF.B.y, r:CONF.B.r, tex:TEX.B}));

/* croix : volume extrudé + dessus photographié */
const cw = CONF.croix.w, ch = CONF.croix.h, br = cw*.185;
const formeCroix = (()=>{ const s=new THREE.Shape();
  s.moveTo(-br,-ch/2); s.lineTo(-br,-br); s.lineTo(-cw/2,-br); s.lineTo(-cw/2,br);
  s.lineTo(-br,br); s.lineTo(-br,ch/2); s.lineTo(br,ch/2); s.lineTo(br,br);
  s.lineTo(cw/2,br); s.lineTo(cw/2,-br); s.lineTo(br,-br); s.lineTo(br,-ch/2);
  s.closePath(); return s; })();
const croix = new THREE.Group();
const volCroix = new THREE.Mesh(extruder(formeCroix,.030,.008,6),
  new THREE.MeshStandardMaterial({color:0x26262c, roughness:.5, metalness:.05,
    envMap:ENV, envMapIntensity:.7, normalMap:NORM, roughnessMap:RUGO}));
volCroix.scale.set(.955,.955,1);
croix.add(volCroix);
const dessusCroix = dessus(TEX.croix, cw, ch); dessusCroix.position.z = .0155; croix.add(dessusCroix);
croix.position.set(CONF.croix.x, CONF.croix.y, AV + .0165);
poser("croix", croix, .011);

/* Select / Start : pastilles grises inclinées */
function pastille(c){
  const m = new THREE.Mesh(
    extruder(rectArrondi(c.w*.94, c.h*.9, c.h*.45,c.h*.45,c.h*.45,c.h*.45), .020, .007, 20),
    new THREE.MeshStandardMaterial({color:0x8e8880, roughness:.45, metalness:.05,
      envMap:ENV, envMapIntensity:.8, normalMap:NORM, roughnessMap:RUGO})
  );
  m.position.set(c.x, c.y, AV + .012);
  m.rotation.z = .414;
  return m;
}
poser("SELECT", pastille(CONF.select), .008);
poser("START",  pastille(CONF.start),  .008);

/* ---------- écran : le coureur ---------- */
const VERT = ["#9bbc0f","#8bac0f","#306230","#0f380f"];
let allume = true, tAllum = 0, fondu = 0;
const jeu = {y:0,vy:0,sol:108,course:0,sens:1,vitesse:0,decor:0,points:0,saut:false};
const appuye = {gauche:false,droite:false,a:false,b:false};

function coureur(g,x,y,phase,sens,air){
  g.save(); g.translate(x,y); g.scale(sens,1);
  g.strokeStyle=VERT[3]; g.fillStyle=VERT[3]; g.lineWidth=3;
  const ph=phase*Math.PI*2;
  const cD=air?.9:Math.sin(ph)*.95, cG=air?-.5:Math.sin(ph+Math.PI)*.95;
  const gD=air?-1.3:-(.7+.7*Math.sin(ph-2.3)), gG=air?-.4:-(.7+.7*Math.sin(ph+Math.PI-2.3));
  const bD=air?-1.4:Math.sin(ph+Math.PI)*.8, bG=air?-.9:Math.sin(ph)*.8;
  const rb=air?0:Math.abs(Math.sin(ph))*-1.6;
  function membre(ox,oy,a1,a2,l1,l2){
    const x1=ox+Math.sin(a1)*l1,y1=oy+Math.cos(a1)*l1;
    const x2=x1+Math.sin(a1+a2)*l2,y2=y1+Math.cos(a1+a2)*l2;
    g.beginPath(); g.moveTo(ox,oy); g.lineTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  }
  membre(0,-6+rb,cG,gG,7,7); membre(0,-6+rb,cD,gD,7,7);
  g.lineWidth=5; g.beginPath(); g.moveTo(0,-6+rb); g.lineTo(1,-18+rb); g.stroke(); g.lineWidth=3;
  membre(1,-17+rb,bG+.4,-1.5,5,5); membre(1,-17+rb,bD+.4,-1.5,5,5);
  g.beginPath(); g.arc(2,-23+rb,4.4,0,7); g.fill(); g.restore();
}
function finition(){
  const g=ex, W=LCD_W*ZOOM, Hh=LCD_H*ZOOM;
  g.setTransform(1,0,0,1,0,0);
  g.globalAlpha=.085; g.fillStyle="#0f380f";
  for(let y=0;y<LCD_H;y++) g.fillRect(0,y*ZOOM+ZOOM-1,W,1);
  for(let x=0;x<LCD_W;x++) g.fillRect(x*ZOOM+ZOOM-1,0,1,Hh);
  g.globalAlpha=1;
  const v=g.createRadialGradient(W*.5,Hh*.45,Hh*.25,W*.5,Hh*.5,Hh*.85);
  v.addColorStop(0,"rgba(15,56,15,0)"); v.addColorStop(1,"rgba(15,56,15,.28)");
  g.fillStyle=v; g.fillRect(0,0,W,Hh);
  const b=g.createLinearGradient(0,0,W,Hh*.4);
  b.addColorStop(0,"rgba(255,255,255,.09)"); b.addColorStop(.35,"rgba(255,255,255,0)");
  g.fillStyle=b; g.fillRect(0,0,W,Hh);
  texEcran.needsUpdate = true;
}
function dessineEcran(dt){
  const g=ex;
  g.setTransform(1,0,0,1,0,0); g.imageSmoothingEnabled=false;
  g.save(); g.scale(ZOOM,ZOOM);
  g.fillStyle=VERT[0]; g.fillRect(0,0,LCD_W,LCD_H);
  if(!allume){
    fondu=Math.min(1,fondu+dt*3.2);
    const h=(1-fondu)*LCD_H;
    g.fillStyle=VERT[2]; g.fillRect(0,0,LCD_W,LCD_H);
    g.fillStyle=VERT[0]; g.fillRect(0,(LCD_H-h)/2,LCD_W,Math.max(0,h));
    g.restore(); finition(); return;
  }
  fondu=0; tAllum+=dt;
  if(tAllum<1.6){
    const p=Math.min(1,tAllum/.9), y=-20+92*(1-Math.pow(1-p,3));
    g.fillStyle=VERT[3]; g.textAlign="center";
    g.font="bold 15px 'Courier New', monospace"; g.fillText("GAME BOY",LCD_W/2,y);
    if(tAllum>1.1){ g.font="9px 'Courier New', monospace"; g.fillStyle=VERT[2]; g.fillText("prêt",LCD_W/2,y+20); }
    g.restore(); finition(); return;
  }
  const cible=(appuye.droite?1:0)-(appuye.gauche?1:0);
  jeu.vitesse+=(cible*58-jeu.vitesse)*Math.min(1,dt*7);
  if(Math.abs(jeu.vitesse)>1) jeu.sens=jeu.vitesse>0?1:-1;
  jeu.decor+=jeu.vitesse*dt; jeu.points+=Math.abs(jeu.vitesse)*dt*.14;
  if(appuye.a && !jeu.saut && jeu.y===0){ jeu.vy=-118; jeu.saut=true; }
  jeu.vy+=360*dt; jeu.y=Math.min(0,jeu.y+jeu.vy*dt);
  if(jeu.y===0){ jeu.vy=0; jeu.saut=false; }
  jeu.course+=Math.abs(jeu.vitesse)*dt*.024;
  const d=jeu.decor;
  g.fillStyle=VERT[1];
  for(let i=-1;i<6;i++){ const bx=((i*64-d*.25)%384+384)%384-64;
    g.beginPath(); g.moveTo(bx,108); g.lineTo(bx+26,66); g.lineTo(bx+52,108); g.closePath(); g.fill(); }
  g.fillStyle=VERT[2];
  for(let i=-1;i<9;i++){ const bx=((i*40-d*.62)%360+360)%360-40;
    g.fillRect(bx,96,14,12); g.fillRect(bx+4,90,6,6); }
  g.fillStyle=VERT[3]; g.fillRect(0,108,LCD_W,2);
  g.fillStyle=VERT[2];
  for(let i=0;i<24;i++){ const bx=((i*14-d)%336+336)%336-14; g.fillRect(bx,112,7,2); }
  coureur(g,62,jeu.sol+jeu.y,jeu.course,jeu.sens,jeu.y<-2);
  g.fillStyle=VERT[3]; g.font="8px 'Courier New', monospace"; g.textAlign="left";
  g.fillText("m "+Math.floor(jeu.points).toString().padStart(4,"0"),5,12);
  g.restore(); finition();
  document.getElementById("score").textContent = Math.floor(jeu.points)+" m";
}

/* ---------- entrées ---------- */
function presse(n,e){ const t=touches[n]; if(t) t.appui=e?1:0; }
const clavier={ArrowLeft:["croix","gauche"],ArrowRight:["croix","droite"],
  ArrowUp:["croix",null],ArrowDown:["croix",null],
  KeyX:["A","a"],KeyA:["A","a"],Space:["A","a"],KeyZ:["B","b"],KeyB:["B","b"],
  Enter:["START",null],ShiftRight:["SELECT",null],ShiftLeft:["SELECT",null]};
addEventListener("keydown",e=>{const m=clavier[e.code]; if(!m)return;
  e.preventDefault(); presse(m[0],true); if(m[1])appuye[m[1]]=true; cacheAide();});
addEventListener("keyup",e=>{const m=clavier[e.code]; if(!m)return;
  presse(m[0],false); if(m[1])appuye[m[1]]=false;});

const rayon=new THREE.Raycaster(), pointeur=new THREE.Vector2();
function toucheSous(ev){
  const r=renderer.domElement.getBoundingClientRect();
  pointeur.x=((ev.clientX-r.left)/r.width)*2-1;
  pointeur.y=-((ev.clientY-r.top)/r.height)*2+1;
  rayon.setFromCamera(pointeur,camera);
  const h=rayon.intersectObjects(Object.values(touches).map(t=>t.mesh),true);
  if(!h.length) return null;
  let o=h[0].object; while(o && !o.userData.nom) o=o.parent;
  return o?o.userData.nom:null;
}
function actionner(n,etat,ev){
  if(!n) return;
  presse(n,etat);
  if(n==="croix"){
    if(etat&&ev){ const r=renderer.domElement.getBoundingClientRect();
      appuye.droite = ev.clientX > r.left+r.width/2; appuye.gauche=!appuye.droite; }
    else { appuye.gauche=appuye.droite=false; }
  }
  if(n==="A") appuye.a=etat;
  if(n==="B") appuye.b=etat;
}
let glisse=null, pressee=null;
let rotX=-.13, rotY=-.30, vX=0, vY=0, dist=4.3, distCible=4.3;
let visee=null;   // vue demandee par un bouton, annulee des qu'on touche l'objet
const VUES = {
  face:   [0, 0],
  dos:    [0, Math.PI],
  gauche: [0, Math.PI/2],
  droite: [0, -Math.PI/2],
  dessus: [Math.PI/2, 0],
  dessous:[-Math.PI/2, 0]
};
function allerVue(n){
  const v = VUES[n]; if(!v) return;
  // on prend le chemin le plus court en lacet
  let cible = v[1];
  while(cible - rotY >  Math.PI) cible -= Math.PI*2;
  while(cible - rotY < -Math.PI) cible += Math.PI*2;
  visee = [v[0], cible]; vX = vY = 0;
  cacheAide();
}
const dom=renderer.domElement;
dom.addEventListener("pointerdown",e=>{
  cacheAide(); dom.setPointerCapture(e.pointerId);
  const n=toucheSous(e);
  if(n){ pressee=n; actionner(n,true,e); return; }
  glisse={x:e.clientX,y:e.clientY}; visee=null;
});
dom.addEventListener("pointermove",e=>{ if(!glisse)return;
  vY+=(e.clientX-glisse.x)*.0050; vX+=(e.clientY-glisse.y)*.0040;
  glisse={x:e.clientX,y:e.clientY}; });
function relache(){ if(pressee){ actionner(pressee,false); pressee=null; } glisse=null; }
dom.addEventListener("pointerup",relache); dom.addEventListener("pointercancel",relache);
dom.addEventListener("wheel",e=>{e.preventDefault();
  distCible=Math.max(2.4,Math.min(7.5,distCible+e.deltaY*.0022));},{passive:false});
let ecart0=null;
dom.addEventListener("touchmove",e=>{ if(e.touches.length!==2)return;
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(ecart0) distCible=Math.max(2.4,Math.min(7.5,distCible*(ecart0/d)));
  ecart0=d; },{passive:true});
dom.addEventListener("touchend",()=>ecart0=null);
function cacheAide(){ document.getElementById("aide").classList.add("parti"); }

const bOn=document.getElementById("btnOn"), bOff=document.getElementById("btnOff");
function alimentation(e){
  allume=e; if(e){ tAllum=0; jeu.points=0; jeu.decor=0; }
  bOn.setAttribute("aria-pressed",e); bOff.setAttribute("aria-pressed",!e);
  lueur.intensity = e?.5:0;
  if(!e) document.getElementById("score").textContent="";
}
document.querySelectorAll("#vues button").forEach(b =>
  b.addEventListener("click", () => allerVue(b.dataset.v)));
bOn.onclick=()=>alimentation(true); bOff.onclick=()=>alimentation(false);
alimentation(true);

/* ---------- boucle ---------- */
function dimensionner(){
  const w=hote.clientWidth, h=hote.clientHeight;
  renderer.setSize(w,h); camera.aspect=w/h;
  camera.fov = w<620?38:30; camera.updateProjectionMatrix();
}
addEventListener("resize",dimensionner); dimensionner();

let dernier=performance.now();
function boucle(t){
  const dt=Math.min(.05,(t-dernier)/1000); dernier=t;
  if(visee){
    rotX += (visee[0]-rotX)*.10; rotY += (visee[1]-rotY)*.10;
    if(Math.abs(visee[0]-rotX) < .002 && Math.abs(visee[1]-rotY) < .002) visee = null;
  } else {
    rotY+=vY; rotX+=vX; vY*=.915; vX*=.915;
  }
  rotX=Math.max(-1.62,Math.min(1.62,rotX));
  pivot.rotation.y=rotY; pivot.rotation.x=rotX;
  machine.position.y=Math.sin(t/1500)*.009;
  dist+=(distCible-dist)*.08;
  camera.position.set(0,.05,dist); camera.lookAt(0,-.10,0);
  for(const k in touches){
    const b=touches[k], vise=b.z0-b.appui*b.course;
    b.mesh.position.z+=(vise-b.mesh.position.z)*.35;
  }
  dessineEcran(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
</script>
