<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La chambre de Rudy</title>
<style>
 html,body{margin:0;height:100%;background:#100b1e;color:#ffeec2;
   font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
 .b{text-align:center;padding:24px;max-width:340px}
 h1{font-size:22px;margin-bottom:10px}
 p{font-size:14px;color:#c9b8f0;line-height:1.5;margin:0 0 18px}
 button{display:block;width:100%;margin:8px 0;padding:13px;border-radius:12px;font-size:15px;
   font-weight:700;color:#2a1c06;background:#f2c14e;border:0}
 .s{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.25)}
 small{display:block;margin-top:14px;color:#8d80b5;font-size:12px}
</style></head><body>
<div class="b">
  <h1>La chambre de Rudy</h1>
  <p>Page d'essai des emulateurs. Le decor complet la remplacera des qu'il sera decoupe en fichiers.</p>
  <button onclick="ouvrir('snes')">Emulateur Super Nintendo</button>
  <button onclick="ouvrir('nes')">Emulateur NES</button>
  <button class="s" onclick="dossier('snes')">Dossier des ROMs SNES</button>
  <button class="s" onclick="dossier('nes')">Dossier des ROMs NES</button>
  <small id="etat">&mdash;</small>
</div>
<script>
const dedans = (typeof Android !== 'undefined');
document.getElementById('etat').textContent = dedans ? "application detectee" : "hors application";
function ouvrir(c){ dedans ? Android.ouvrirConsole(c) : alert("Disponible dans l'application."); }
function dossier(c){ dedans ? Android.choisirDossier(c) : alert("Disponible dans l'application."); }
window.onRoms = d => document.getElementById('etat').textContent =
  d.jeux.length + " jeu(x) trouve(s) pour " + d.console;
</script></body></html>
