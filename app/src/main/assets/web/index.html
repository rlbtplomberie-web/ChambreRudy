<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La chambre de Rudy</title>
<style>
 html,body{margin:0;min-height:100%;background:#100b1e;color:#ffeec2;font-family:system-ui,sans-serif}
 .b{max-width:380px;margin:0 auto;padding:24px 18px;text-align:center}
 h1{font-size:22px;margin-bottom:6px}
 p{font-size:13px;color:#c9b8f0;line-height:1.5;margin:0 0 14px}
 h2{font-size:13px;color:#8d80b5;text-align:left;margin:18px 0 6px}
 button{display:block;width:100%;margin:6px 0;padding:12px;border-radius:12px;font-size:15px;
   font-weight:700;color:#2a1c06;background:#f2c14e;border:0}
 .s{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.25);font-size:13.5px}
 .d{background:#2b6cb0;color:#fff}
 table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
 td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.10);text-align:left;color:#d8ccf5}
 td.e{text-align:right;white-space:nowrap}
 .ok{color:#7ede9a} .ko{color:#ff8a8a}
 small{display:block;margin-top:14px;color:#8d80b5;font-size:12px}
</style></head><body>
<div class="b">
  <h1>La chambre de Rudy</h1>
  <p>Page d'essai des emulateurs. Le decor complet la remplacera.</p>

  <button class="d" onclick="verifier()">Diagnostic des onze consoles</button>
  <div id="table"></div>

  <h2>Lancer une console</h2>
  <button onclick="ouvrir('nes')">NES</button>
  <button onclick="ouvrir('snes')">Super Nintendo</button>
  <button onclick="ouvrir('gb')">Game Boy / Color</button>
  <button onclick="ouvrir('gba')">Game Boy Advance</button>
  <button onclick="ouvrir('md')">Mega Drive</button>
  <button onclick="ouvrir('ps1')">PlayStation</button>
  <button onclick="ouvrir('dc')">Dreamcast</button>
  <button onclick="ouvrir('ds')">Nintendo DS</button>
  <button onclick="ouvrir('psp')">PSP</button>
  <button onclick="ouvrir('3ds')">Nintendo 3DS</button>
  <button onclick="ouvrir('gc')">GameCube / Wii</button>
  <h2>Choisir un dossier de ROMs</h2>
  <button class="s" onclick="dossier('nes')">Dossier NES</button>
  <button class="s" onclick="dossier('snes')">Dossier Super Nintendo</button>
  <button class="s" onclick="dossier('gb')">Dossier Game Boy / Color</button>
  <button class="s" onclick="dossier('gba')">Dossier Game Boy Advance</button>
  <button class="s" onclick="dossier('md')">Dossier Mega Drive</button>
  <button class="s" onclick="dossier('ps1')">Dossier PlayStation</button>
  <button class="s" onclick="dossier('dc')">Dossier Dreamcast</button>
  <button class="s" onclick="dossier('ds')">Dossier Nintendo DS</button>
  <button class="s" onclick="dossier('psp')">Dossier PSP</button>
  <button class="s" onclick="dossier('3ds')">Dossier Nintendo 3DS</button>
  <button class="s" onclick="dossier('gc')">Dossier GameCube / Wii</button>
  <small id="etat">&mdash;</small>
</div>
<script>
const dedans = (typeof Android !== 'undefined');
document.getElementById('etat').textContent = dedans ? "application detectee" : "hors application";
function ouvrir(c){ dedans ? Android.ouvrirConsole(c) : alert("Disponible dans l'application."); }
function dossier(c){ dedans ? Android.choisirDossier(c) : alert("Disponible dans l'application."); }
function verifier(){
  if(!dedans){ alert("Disponible dans l'application."); return; }
  const l = JSON.parse(Android.diagnostic());
  let h = '<table>';
  for(const c of l){
    h += '<tr><td>' + c.nom + '<br><span style="opacity:.65">' + c.coeur + '</span></td>' +
         '<td class="e ' + (c.ok ? 'ok' : 'ko') + '">' + (c.ok ? 'coeur present' : 'coeur absent') + '<br>' +
         '<span style="opacity:.8">' + (c.dossier ? c.jeux + ' jeu(x)' : 'aucun dossier') + '</span></td></tr>';
  }
  document.getElementById('table').innerHTML = h + '</table>';
}
window.onRoms = d => {
  document.getElementById('etat').textContent = d.jeux.length + " jeu(x) trouve(s) pour " + d.console;
  verifier();
};
</script></body></html>
