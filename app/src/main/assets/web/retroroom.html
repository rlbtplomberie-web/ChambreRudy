<style>
  @font-face{font-family:'RRPinceau';src:url(/assets/web/accueil/rr_6d0bcddcb32c.ttf) format('truetype');font-display:block}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#030915;touch-action:manipulation}
  body{user-select:none;-webkit-user-select:none;font-family:'RRPinceau',sans-serif}
  #fx{position:fixed;left:0;top:0;display:block}

  #menu{position:absolute;left:0;top:0;width:700px;height:650px;transform-origin:0 0}
  #titre{position:absolute;left:18px;top:0;width:664px;height:196px;pointer-events:none}

  .parchemin{
    position:absolute;cursor:pointer;width:410px;height:121px;left:145px;
    background-size:100% 100%;background-repeat:no-repeat;transform-origin:center center;
    transition:filter .18s, transform .18s, opacity .2s;
  }
  .parchemin .eclat{position:absolute;left:8%;right:8%;top:14%;bottom:14%;overflow:hidden;pointer-events:none}
  .parchemin .eclat::after{
    content:"";position:absolute;top:-20%;bottom:-20%;width:30%;left:-40%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);
  }
  .parchemin.actif{filter:brightness(1.12) drop-shadow(0 0 10px rgba(255,214,90,.75)) drop-shadow(0 0 22px rgba(90,170,255,.45));transform:scale(1.04)}
  .parchemin.actif .eclat::after{animation:eclat 1.1s ease-out}
  .parchemin.presse{transform:scale(.97);filter:brightness(1.35) drop-shadow(0 0 18px rgba(255,230,140,.95))}
  .parchemin.vide{opacity:.6}
  .parchemin.vide.actif{opacity:.8}
  .parchemin.secoue{animation:secoue .35s}
  @keyframes secoue{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  @keyframes eclat{from{left:-40%}to{left:120%}}

  .parchemin.cache{transform:scaleX(.04);opacity:0;pointer-events:none}
  .parchemin.enroule{animation:enroule .38s ease-in forwards}
  .parchemin.deroule{animation:deroule .5s cubic-bezier(.2,.9,.25,1.15) both}
  @keyframes enroule{0%{transform:scaleX(1);opacity:1}80%{transform:scaleX(.06);opacity:1}100%{transform:scaleX(.04);opacity:0}}
  @keyframes deroule{0%{transform:scaleX(.04);opacity:0}15%{opacity:1}100%{transform:scaleX(1);opacity:1}}

  /* Lettrage pinceau (même style que RetroRoom) */
  svg.pinceau{position:absolute;overflow:visible;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
  .parchemin svg.pinceau{left:70px;top:16px;width:270px;height:90px}

  .ligneBas{
    position:absolute;left:150px;top:604px;width:400px;height:46px;
    opacity:0;pointer-events:none;transition:opacity .3s, transform .15s;
  }
  .ligneBas.visible{opacity:1;pointer-events:auto}
  .ligneBas svg.pinceau{left:0;top:0;width:400px;height:46px}
  .bouton{cursor:pointer;transition:transform .15s, filter .15s}
  .bouton.actif{transform:scale(1.1);filter:brightness(1.25) drop-shadow(0 0 8px rgba(255,214,90,.8))}
  #confirmation{display:flex;justify-content:center;gap:40px;left:60px;width:580px}
  #confirmation .q{position:relative;width:330px;height:46px}
  #confirmation .b{position:relative;width:80px;height:46px}
  #confirmation svg.pinceau{width:100%;height:100%}

  #message{position:absolute;left:100px;top:604px;width:500px;height:46px;opacity:0;transition:opacity .3s;pointer-events:none}
  #message.visible{opacity:1}
  #message svg.pinceau{left:0;top:0;width:500px;height:46px}

  #voile{
    position:fixed;inset:0;background:rgba(0,0,0,.92);opacity:0;pointer-events:none;
    transition:opacity .7s;display:flex;align-items:center;justify-content:center;
  }
  #voile.visible{opacity:1;pointer-events:auto}
  #voileBloc{position:relative;flex:none;width:600px;height:300px;transform-origin:center}
  #voileBloc svg.pinceau{left:0;width:600px}
  #voile.visible svg.btnVoile{pointer-events:auto;cursor:pointer}


  /* Panneau de pierre (sauvegarde chargée) */
  #panneauCouche{
    position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;
    transition:opacity .35s;display:flex;align-items:center;justify-content:center;
  }
  #panneauCouche.visible{opacity:1;pointer-events:auto}
  #panneauBloc{position:relative;flex:none;width:429px;height:820px;transform-origin:center}
  #panneauNom{position:absolute;left:-40px;top:0;width:509px;height:70px}
  #panneauNom svg.pinceau{left:0;top:0;width:509px;height:70px}
  #panneauImg{
    position:absolute;left:0;top:76px;width:429px;height:676px;cursor:pointer;display:block;
    filter:drop-shadow(0 0 14px rgba(255,200,90,.35));
    transition:transform .2s, filter .2s;
  }
  #panneauCouche.visible #panneauImg{animation:apparition .45s cubic-bezier(.2,.9,.25,1.15)}
  @keyframes apparition{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
  #panneauImg.presse{transform:scale(.97);filter:brightness(1.3) drop-shadow(0 0 22px rgba(255,214,90,.9))}
  .tresor{position:absolute;transform:translate(-50%,-50%);pointer-events:none;display:none;
    filter:drop-shadow(0 0 10px rgba(255,210,90,.55));animation:tresorBrille 2.6s ease-in-out infinite alternate}
  .tresor.on{display:block}
  .tresor.plaque{object-fit:fill;border-radius:3px}
  @keyframes tresorBrille{from{filter:drop-shadow(0 0 6px rgba(255,210,90,.35)) brightness(1)}to{filter:drop-shadow(0 0 14px rgba(255,220,120,.75)) brightness(1.12)}}
  #panneauRetour{position:absolute;left:64px;top:764px;width:300px;height:50px}
  #panneauRetour svg.pinceau{left:0;top:0;width:300px;height:50px}
</style>
</head>
<body>

<!-- Filtre « pinceau sec » utilisé par tous les textes -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="pinceauSec" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.75" numOctaves="2" seed="4" result="bruit"/>
      <feDisplacementMap in="SourceGraphic" in2="bruit" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="degBleuJaune" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a6bff"/>
      <stop offset=".33" stop-color="#2fb0ff"/>
      <stop offset=".5" stop-color="#5ed49b"/>
      <stop offset=".63" stop-color="#ffd420"/>
      <stop offset="1" stop-color="#ffa800"/>
    </linearGradient>
    <linearGradient id="degReflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>

<script>
/* ================== Sons et petite musique (tout est synthétisé, aucun fichier) ================== */
var RRSon=(function(){
  var ac=null,master,busMusique,busEffets,echo,echoRetour,lancee=false;
  var muet=false;try{localStorage.removeItem('retroroom_muet');}catch(e){}

  function init(){
    if(ac)return true;
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
    ac=new C();
    master=ac.createGain();master.gain.value=muet?0:1;master.connect(ac.destination);
    busMusique=ac.createGain();busMusique.gain.value=0.16;busMusique.connect(master);
    busEffets=ac.createGain();busEffets.gain.value=0.45;busEffets.connect(master);
    // petit écho pour l'ambiance « aventure »
    echo=ac.createDelay(1);echo.delayTime.value=0.31;
    echoRetour=ac.createGain();echoRetour.gain.value=0.32;
    var echoSortie=ac.createGain();echoSortie.gain.value=0.35;
    echo.connect(echoRetour);echoRetour.connect(echo);echo.connect(echoSortie);echoSortie.connect(master);
    return true;
  }
  function f(m){return 440*Math.pow(2,(m-69)/12);}

  // Une note : type d'onde, hauteur MIDI, début, durée, volume, destination
  function note(type,m,t,dur,vol,dest,opts){
    opts=opts||{};
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f(m),t);
    if(opts.glisse)o.frequency.exponentialRampToValueAtTime(f(m+opts.glisse),t+dur);
    var att=opts.att||0.008,rel=opts.rel||Math.min(0.25,dur*0.6);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+att);
    g.gain.setValueAtTime(vol,t+Math.max(att,dur-rel));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    var sortie=g;
    if(opts.filtre){var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=opts.filtre;g.connect(lp);sortie=lp;}
    o.connect(g);sortie.connect(dest);
    if(opts.echo)sortie.connect(echo);
    o.start(t);o.stop(t+dur+0.05);
  }
  function souffle(t,dur,vol,de,a){
    var n=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    var s=ac.createBufferSource();s.buffer=buf;
    var bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;
    bp.frequency.setValueAtTime(de,t);bp.frequency.exponentialRampToValueAtTime(a,t+dur);
    var g=ac.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+dur*0.3);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(bp);bp.connect(g);g.connect(busEffets);s.start(t);s.stop(t+dur);
  }

  /* ---------- Bruitages ---------- */
  var effets={
    tic:function(t){note('triangle',88,t,0.06,0.25,busEffets);},
    clic:function(t){
      note('triangle',84,t,0.09,0.4,busEffets,{echo:true});
      note('triangle',91,t+0.07,0.16,0.35,busEffets,{echo:true});
    },
    parchemin:function(t){souffle(t,0.32,0.5,500,2200);},
    retour:function(t){
      note('triangle',86,t,0.08,0.3,busEffets);
      note('triangle',79,t+0.07,0.14,0.3,busEffets);
    },
    question:function(t){
      note('square',76,t,0.09,0.12,busEffets,{filtre:2500});
      note('square',81,t+0.1,0.16,0.12,busEffets,{filtre:2500});
    },
    erreur:function(t){
      note('square',55,t,0.12,0.14,busEffets,{filtre:1200});
      note('square',50,t+0.13,0.22,0.14,busEffets,{filtre:1200});
    },
    panneau:function(t){ // scintillement magique qui monte
      [72,76,79,84,88,91,96].forEach(function(m,i){note('triangle',m,t+i*0.06,0.35,0.22,busEffets,{echo:true});});
      note('sine',60,t,0.9,0.18,busEffets,{att:0.05,rel:0.6});
    },
    lancement:function(t){ // petite fanfare
      var mel=[[67,0.12],[72,0.12],[76,0.12],[79,0.4]];var d=t;
      mel.forEach(function(n){note('square',n[0],d,n[1]+0.05,0.13,busEffets,{filtre:3200,echo:true});note('triangle',n[0]-12,d,n[1]+0.05,0.25,busEffets);d+=n[1];});
      [84,88,91].forEach(function(m,i){note('triangle',m,d+i*0.05,0.5,0.15,busEffets,{echo:true});});
    }
  };

  /* ---------- Musique de fond (mélodie originale, ambiance aventure) ---------- */
  var TEMPO=96,croche=60/TEMPO/2;
  // mélodie : [note MIDI ou null, durée en croches] — 8 mesures
  var melodie=[
    [74,2],[69,2],[74,1],[76,1],[77,2],
    [79,3],[77,1],[76,2],[74,2],
    [76,2],[72,2],[76,1],[77,1],[79,2],
    [76,6],[null,2],
    [74,2],[77,2],[81,3],[79,1],
    [77,2],[74,2],[70,2],[74,2],
    [72,1],[74,1],[76,2],[79,2],[76,2],
    [78,6],[null,2]
  ];
  // accords (Rém, Sib, Do, Lam, Rém, Sib, Do, Ré)
  var accords=[[62,65,69],[58,62,65],[60,64,67],[57,60,64],[62,65,69],[58,62,65],[60,64,67],[62,66,69]];
  var motifArpege=[0,1,2,3,2,1,2,3];
  var evenements=[];(function(){
    var pos=0;
    melodie.forEach(function(n){if(n[0]!==null)evenements.push({pos:pos,m:n[0],d:n[1]});pos+=n[1];});
  })();
  var LONGUEUR=64; // croches par tour
  var debut=0,prochain=0,tour=0,minuteur=null;

  function planifier(){
    var horizon=ac.currentTime+0.25;
    while(debut+prochain*croche<horizon){
      var t=debut+prochain*croche,pas=prochain%LONGUEUR,mesure=Math.floor(pas/8),acc=accords[mesure];
      // arpège doux
      var idx=motifArpege[pas%8],m=idx===3?acc[0]+12:acc[idx];
      note('triangle',m,t,croche*1.6,0.22,busMusique,{rel:croche*1.2});
      // basse sur les temps 1 et 3
      if(pas%4===0)note('triangle',acc[0]-24,t,croche*3.6,0.5,busMusique,{rel:croche*2});
      // mélodie (au 2e tour une octave plus bas, plus calme)
      for(var i=0;i<evenements.length;i++){
        if(evenements[i].pos===pas){
          var e=evenements[i],h=(tour%2===1)?e.m-12:e.m;
          note('square',h,t,e.d*croche*0.95,0.11,busMusique,{filtre:1800,att:0.02,rel:Math.min(0.3,e.d*croche*0.5),echo:true});
        }
      }
      prochain++;if(prochain%LONGUEUR===0)tour++;
    }
  }

  function demarrer(){
    if(!init())return;
    if(ac.state==='suspended')ac.resume();
    if(lancee)return;lancee=true;
    debut=ac.currentTime+0.15;prochain=0;
    minuteur=setInterval(planifier,60);planifier();
  }
  function jouer(nom){
    if(!init()||!effets[nom])return;
    if(ac.state==='suspended')ac.resume();
    effets[nom](ac.currentTime+0.01);
  }
  function basculerMuet(){
    muet=!muet;try{localStorage.setItem('retroroom_muet',muet?'1':'0');}catch(e){}
    if(ac){master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(muet?0:1,ac.currentTime,0.05);}
    return muet;
  }
  // l'appli mise en arrière-plan : on coupe le son
  document.addEventListener('visibilitychange',function(){
    if(!ac)return;if(document.hidden)ac.suspend();else ac.resume();
  });
  function couper(){ if(!ac) return; try{ master.gain.setTargetAtTime(0,ac.currentTime,0.25); setTimeout(function(){ try{ clearInterval(minuteur); ac.close(); }catch(e){} },1200); }catch(e){} }
  return {demarrer:demarrer,jouer:jouer,basculerMuet:basculerMuet,couper:couper,estMuet:function(){return muet;}};
})();
</script>

<script>
(function(){
  /* ================== Lettrage pinceau ================== */
  var NS='http://www.w3.org/2000/svg';
  // Crée un texte au style du titre (dégradé bleu → jaune, contour sombre, bords de pinceau)
  function texte(svg,str,x,y,taille,opts){
    opts=opts||{};
    var g=document.createElementNS(NS,'g');
    g.setAttribute('filter','url(#pinceauSec)');
    g.setAttribute('transform','translate('+x+' '+y+') skewX(-9)');
    var calques=[
      {fill:'#0a1430',stroke:'#0a1430',sw:taille*0.17},
      {fill:'url(#degBleuJaune)'},
      {fill:'url(#degReflet)'}
    ];
    var els=[];
    calques.forEach(function(c){
      var t=document.createElementNS(NS,'text');
      t.textContent=str;
      t.setAttribute('x',0);t.setAttribute('y',0);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-family','RRPinceau, sans-serif');
      t.setAttribute('font-size',taille);
      t.setAttribute('fill',c.fill);
      if(c.stroke){t.setAttribute('stroke',c.stroke);t.setAttribute('stroke-width',c.sw);t.setAttribute('stroke-linejoin','round');}
      g.appendChild(t);els.push(t);
    });
    if(opts.max){g._max=opts.max;g._els=els;}
    svg.appendChild(g);
    return g;
  }
  function nouveauSvg(parent,w,h){
    var s=document.createElementNS(NS,'svg');
    s.setAttribute('class','pinceau');s.setAttribute('viewBox','0 0 '+w+' '+h);
    parent.appendChild(s);return s;
  }
  function vider(el){while(el.firstChild)el.removeChild(el.firstChild);}
  // Resserre un texte trop long pour qu'il tienne dans son cadre
  function ajusterLongueurs(racine){
    (racine||document).querySelectorAll('svg.pinceau g').forEach(function(g){
      if(!g._max)return;
      g._els.forEach(function(t){t.removeAttribute('textLength');t.removeAttribute('lengthAdjust');});
      var l=0;try{l=g._els[1].getComputedTextLength();}catch(e){}
      if(l>g._max)g._els.forEach(function(t){t.setAttribute('textLength',g._max);t.setAttribute('lengthAdjust','spacingAndGlyphs');});
    });
  }

  /* ================== Sauvegardes ================== */
  var CLE='retroroom_sauvegardes';
  function lireSauvegardes(){try{return JSON.parse(localStorage.getItem(CLE))||{};}catch(e){return memoire;}}
  var memoire={};
  function ecrireSauvegardes(o){memoire=o;try{localStorage.setItem(CLE,JSON.stringify(o));}catch(e){}}
  function dateCourte(ms){
    var d=new Date(ms);function p(n){return(n<10?'0':'')+n;}
    return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+'H'+p(d.getMinutes());
  }

  /* ================== Les parties du jeu (la vraie progression de Rudy) ==================
     Tout ce que le jeu retient (pages web + l'argent) est rangé dans l'emplacement choisi.

  var PONT=window.Accueil||null, ACTIF='rr_actif';

  function argentLire(){ try{ if(PONT&&PONT.argent) return PONT.argent(); }catch(e){} try{ var v=localStorage.getItem('rudy_argent'); return v===null?5000:(parseInt(v,10)||0); }catch(e){} return 5000; }
  function argentEcrire(n){ try{ if(PONT&&PONT.ecrireArgent){ PONT.ecrireArgent(n); return; } }catch(e){} }
  function photo(){ var o={ls:{},argent:argentLire()}; clesDuJeu().forEach(function(k){ try{ o.ls[k]=localStorage.getItem(k); }catch(e){} }); return o; }
  function ranger(n){ var t=JSON.stringify(photo()); try{ if(PONT&&PONT.ecrirePartie){ if(PONT.ecrirePartie(String(n),t)) return; } }catch(e){} try{ localStorage.setItem('rr_partie_'+n,t); }catch(e){} }
  function sortir(n){ var t=''; try{ if(PONT&&PONT.lirePartie) t=PONT.lirePartie(String(n))||''; }catch(e){} if(!t){ try{ t=localStorage.getItem('rr_partie_'+n)||''; }catch(e){} } try{ return t?JSON.parse(t):null; }catch(e){ return null; } }
  function jeter(n){ try{ if(PONT&&PONT.effacerPartie) PONT.effacerPartie(String(n)); }catch(e){} try{ localStorage.removeItem('rr_partie_'+n); }catch(e){} }
  function viderLeJeu(){ clesDuJeu().forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} }); }
  function remettre(o){ viderLeJeu(); if(!o) return; var ls=o.ls||{}; for(var k in ls){ try{ localStorage.setItem(k,ls[k]); }catch(e){} } if(typeof o.argent==='number') argentEcrire(o.argent); }
  function actif(){ try{ return localStorage.getItem(ACTIF)||''; }catch(e){ return ''; } }
  // passer sur l'emplacement n : « neuve » = nouvelle partie à zéro, sinon on reprend ce qu'il contient
  function allerSur(n,neuve){

    if(a&&a!==n&&lireSauvegardes()[a]) ranger(a);          // la partie en cours est mise de côté dans son emplacement
    if(neuve){ viderLeJeu(); argentEcrire(5000); ranger(n); }
    else if(a!==n){ remettre(sortir(n)); }
    try{ localStorage.setItem(ACTIF,n); }catch(e){}
  }
  // la toute première fois : la progression déjà faite est gardée dans la partie 1
  (function(){ var sv=lireSauvegardes(); if(Object.keys(sv).length||actif()) return;
    if(!clesDuJeu().length) return;
    var maint=Date.now(); sv['1']={creee:maint,maj:maint,donnees:{}}; ecrireSauvegardes(sv); ranger('1');
    try{ localStorage.setItem(ACTIF,'1'); }catch(e){} })();

  /* ================== Écran : remplissage plein écran ================== */
  var cv=document.getElementById('fx'),ctx=cv.getContext('2d');
  var menu=document.getElementById('menu');
  var W=0,H=0,DPR=1,HY=0;          // HY = ligne d'horizon à l'écran
  var kCiel=1,cielX=0,kMer=1,merX=0; // mise à l'échelle des deux morceaux de l'image
  var SRC_HOR=708,SRC_MER=1024-SRC_HOR;

  function ajuster(){
    W=window.innerWidth;H=window.innerHeight;
    DPR=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
    cv.style.width=W+'px';cv.style.height=H+'px';
    var portrait=H>=W;
    HY=Math.round(H*(portrait?0.70:0.75));
    // ciel : remplit tout le haut, calé sur l'horizon
    kCiel=Math.max(W/1024,HY/SRC_HOR);cielX=(W-1024*kCiel)/2;
    // mer : remplit tout le bas, calée sur l'horizon
    kMer=Math.max(W/1024,(H-HY)/SRC_MER);merX=(W-1024*kMer)/2;
    // menu (titre + parchemins) centré dans le ciel
    var s=portrait?Math.min(W*0.96/700,HY*0.88/650):Math.min(W*0.9/700,HY*0.94/650);
    var gauche=(W-700*s)/2;
    var haut=Math.max(4,(HY-650*s)*(portrait?0.42:0.5));
    menu.style.transform='translate('+gauche+'px,'+haut+'px) scale('+s+')';
    var pb=document.getElementById('panneauBloc');
    pb.style.transform='scale('+Math.min(W*0.94/429,H*0.96/820)+')';
    var vb=document.getElementById('voileBloc');
    vb.style.transform='scale('+Math.min(W*0.92/600,H*0.8/300)+')';
  }

  /* ================== La mer qui bouge + la lueur ================== */
  var img=new Image();img.src='/assets/web/accueil/rr_d70fad98d8b4.jpg';

  (function(){
    var c=stries.getContext('2d');
    for(var i=0;i<1600;i++){
      var y=Math.pow(Math.random(),1.3)*SRC_MER,d=y/SRC_MER;
      var len=6+Math.random()*(18+d*70),ep=0.6+d*2.4,x=Math.random()*2048;
      c.fillStyle='rgba(255,255,255,'+(0.25+Math.random()*0.75)+')';
      c.fillRect(x,y,len,ep);if(x+len>2048)c.fillRect(x-2048,y,len,ep);
    }
  })();
  var lueur=document.createElement('canvas');lueur.width=1024;lueur.height=SRC_MER;

  function nouvelleEtincelle(){
    var d=Math.random(),larg=60+d*260;
    return {x:512+(Math.random()-.5)*larg*2,y:4+Math.pow(d,1.2)*(SRC_MER-10),vie:0,duree:0.25+Math.random()*0.6,taille:1+d*3.5};
  }
  var etincelles=[];for(var i=0;i<40;i++){var e=nouvelleEtincelle();e.vie=Math.random()*e.duree;etincelles.push(e);}
  var etoiles=[];for(var j=0;j<34;j++)etoiles.push({x:Math.random(),y:0.02+Math.random()*0.9,p:Math.random()*6.28,v:1+Math.random()*2.5,t:0.6+Math.random()*1.4});

  var temps=0,dernier=performance.now(),prochaineLueur=1.5,lueurDebut=-10,lueurDuree=1,lueurForte=false;
  function declencherLueur(forte){lueurDebut=temps;lueurDuree=forte?0.75:0.9+Math.random()*0.5;lueurForte=!!forte;prochaineLueur=temps+3.5+Math.random()*3.5;}

  function boucle(maint){
    var dt=Math.min(0.05,(maint-dernier)/1000);dernier=maint;temps+=dt;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#030915';ctx.fillRect(0,0,W,H);
    if(img.complete&&img.naturalWidth){
      // Ciel
      ctx.drawImage(img,0,0,1024,SRC_HOR,cielX,HY-SRC_HOR*kCiel,1024*kCiel,SRC_HOR*kCiel);
      // Mer ondulante, ligne par ligne
      var hMer=H-HY,srcL=W/kMer,srcX=-merX/kMer;
      for(var y=0;y<hMer;y++){
        var d=y/hMer;
        var amp=(0.3+d*d*5.5+d*1.2)*kMer;
        var sy=y/kMer;
        var off=amp*(Math.sin(sy*0.32/(0.25+d)-temps*2.1)*0.65+Math.sin(sy*0.11+temps*1.25+1.3)*0.35);
        var sv=SRC_HOR+sy+Math.sin(sy*0.5/(0.3+d)+temps*1.7)*(0.4+d*2.2);
        if(sv<SRC_HOR)sv=SRC_HOR;if(sv>1023)sv=1023;
        ctx.drawImage(img,srcX,sv,srcL,1/kMer,-12+off,HY+y,W+24,1.2);
      }
    }
    dessinerTitre();
    // Étoiles (repère écran)
    ctx.setTransform(DPR,0,0,DPR,0,0);
    for(var m=0;m<etoiles.length;m++){
      var s=etoiles[m],a=Math.max(0,Math.sin(temps*s.v+s.p));a=a*a*a;if(a<0.02)continue;
      var sx=s.x*W,syy=s.y*(HY-20);
      ctx.fillStyle='rgba(230,240,255,'+a+')';
      ctx.fillRect(sx-s.t,syy-0.5,s.t*2,1);ctx.fillRect(sx-0.5,syy-s.t,1,s.t*2);
    }
    ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(boucle);
  }
  /* Titre : seules les lettres brillent */
  var titreImg=new Image();titreImg.src='/assets/web/accueil/rr_0716ba31e304.png';
  var tcv=document.getElementById('titre'),tctx=tcv.getContext('2d');
  function dessinerTitre(){
    tctx.setTransform(1,0,0,1,0,0);
    tctx.globalCompositeOperation='source-over';
    tctx.clearRect(0,0,tcv.width,tcv.height);
    if(!(titreImg.complete&&titreImg.naturalWidth))return;
    tctx.drawImage(titreImg,0,0,tcv.width,tcv.height);
    var cycle=6,dur=1.0,t=(temps-1.2)%cycle;
    if(t<0||t>dur)return;
    var p=t/dur,x=-300+p*(tcv.width+600);
    // la lumière ne se pose que là où il y a des lettres
    tctx.globalCompositeOperation='source-atop';
    tctx.translate(x,0);tctx.transform(1,0,-0.35,1,0,0);
    var g=tctx.createLinearGradient(-130,0,130,0);
    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,'rgba(255,255,255,0.85)');g.addColorStop(1,'rgba(255,255,255,0)');
    tctx.fillStyle=g;tctx.fillRect(-130,-50,260,tcv.height+100);
  }

  function elementsActifs(){

  function surligner(i){

  function attendre(ms){return new Promise(function(r){setTimeout(r,ms);});}

  async function basculer(vers){
    if(occupe)return;occupe=true;

    var entrants=vers==='emplacements'?emplacements:principaux;
    sortants.forEach(function(el){el.classList.remove('actif','presse');});

    setTimeout(function(){RRSon.jouer('parchemin');},60);
    for(var i=0;i<sortants.length;i++){sortants[i].classList.remove('deroule');sortants[i].classList.add('enroule');await attendre(70);}

    sortants.forEach(function(el){el.classList.remove('enroule');el.classList.add('cache');});
    if(vers==='emplacements')dessinerEmplacements();
    RRSon.jouer('parchemin');

  /* ---- Lancement : c'est ici que le jeu démarrera ---- */
  // une vidéo plein écran, puis la chambre (on ne reste jamais bloqué : fin, erreur ou image figée)
  function videoPuisChambre(src){
    var vb=document.createElement('div'); vb.style.cssText='position:fixed;inset:0;z-index:9999;background:#000';
    vb.innerHTML='<video playsinline webkit-playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000"></video>';
    document.body.appendChild(vb); var v=vb.querySelector('video'), fait=false, last=-1, fige=0, wd=0;
    function fin(){ if(fait) return; fait=true; clearInterval(wd); try{ v.pause(); }catch(e){} try{ if(window.Accueil) Accueil.fin(); }catch(e){} }
    v.addEventListener('ended',fin); v.addEventListener('error',fin);
    vb.addEventListener('pointerdown',function(){ if(v.paused&&!fait){ var q=v.play(); if(q&&q.catch) q.catch(function(){}); } });
    wd=setInterval(function(){ if(fait) return; if(v.duration&&v.currentTime>=v.duration-0.15){ fin(); return; }
      if(v.currentTime!==last){ last=v.currentTime; fige=0; } else if(++fige>=8) fin(); },500);
    v.src=src; var q=v.play(); if(q&&q.catch) q.catch(function(){ v.muted=true; var q2=v.play(); if(q2&&q2.catch) q2.catch(function(){}); });
  }

  async function activer(el){
    if(occupe||!el)return;
    var action=el.getAttribute('data-action');

    if(el.classList.contains('parchemin')){el.classList.add('presse');await attendre(140);el.classList.remove('presse');}

  /* ---- Panneau de pierre : s'ouvre sur une sauvegarde chargée ---- */

  document.getElementById('panneauRetour').addEventListener('click',quitterPanneau);
  panneauCouche.addEventListener('click',function(ev){if(ev.target===panneauCouche)quitterPanneau();});

  document.addEventListener('keydown',function(ev){
    if(panneauCouche.classList.contains('visible')){
      if(ev.key==='Enter'||ev.key===' '){validerPanneau();ev.preventDefault();}
      else if(ev.key==='Escape'||ev.key==='Backspace'){quitterPanneau();ev.preventDefault();}
      return;
    }
    if(voile.classList.contains('visible')){if(['Escape','Enter','Backspace',' '].indexOf(ev.key)>=0){fermerVoile();ev.preventDefault();}return;}
    if(occupe)return;
    var l=elementsActifs();
    if(ev.key==='ArrowDown'||ev.key==='ArrowRight'){RRSon.jouer('tic');surligner(index+1);ev.preventDefault();}
    else if(ev.key==='ArrowUp'||ev.key==='ArrowLeft'){RRSon.jouer('tic');surligner(index-1);ev.preventDefault();}
    else if(ev.key==='Enter'||ev.key===' '){activer(l[index]);ev.preventDefault();}
    else if(ev.key==='Escape'||ev.key==='Backspace'){
      if(enConfirmation){fermerConfirmation();surligner(0);}
      else if(ecran==='emplacements')basculer('principal');
      ev.preventDefault();
    }
  });

  // Bouton retour d'Android (dans une appli ou un navigateur)
  try{history.pushState({rr:1},'');window.addEventListener('popstate',function(){
    history.pushState({rr:1},'');
    if(panneauCouche.classList.contains('visible'))quitterPanneau();
    else if(voile.classList.contains('visible'))fermerVoile();
    else if(enConfirmation){fermerConfirmation();surligner(0);}
    else if(ecran==='emplacements'&&!occupe)basculer('principal');
  });}catch(e){}

  document.addEventListener('keydown',function(){RRSon.demarrer();},true);
  // la musique démarre dès l'ouverture quand l'appareil l'autorise,
  // sinon au tout premier contact avec l'écran (règle imposée par les téléphones)
  RRSon.demarrer();
  ['touchstart','pointerdown','mousedown','click'].forEach(function(t){
    document.addEventListener(t,function(){RRSon.demarrer();},{capture:true,passive:true});
  });

  try{ if(window.Accueil&&Accueil.menu) Accueil.menu(true); }catch(e){}
  surligner(0);
  if(document.fonts&&document.fonts.load){document.fonts.load('40px RRPinceau').then(function(){ajusterLongueurs();});}
})();
</script>
<script src="/assets/web/passer.js"></script>
