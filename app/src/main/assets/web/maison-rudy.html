<!DOCTYPE html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Maison de Rudy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Plein écran : le décor remplit tout, la manette et le bouton flottent par-dessus */
:root{
  --nuit:#0b0d1f; --encre:#f5f1e6; --or:#ffd23a; --or-fonce:#c98a00;
  --verre:rgba(12,14,34,.55); --bord:rgba(255,255,255,.22);
  --f-titre:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{background:var(--nuit);color:var(--encre);margin:0;overflow:hidden;
  font-family:var(--f-titre);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#jeu{position:fixed;inset:0;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
#piece{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));
  padding:4px 14px;border-radius:999px;background:var(--verre);border:1px solid var(--bord);
  font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(4px);}
#fondu{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;}
#fondu.on{opacity:1;}

/* Joystick */
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:132px;height:132px;border-radius:50%;touch-action:none;
  background:radial-gradient(circle,rgba(255,255,255,.08) 0 55%,rgba(12,14,34,.55) 56%);
  border:2px solid var(--bord);box-shadow:inset 0 0 18px rgba(0,0,0,.45);}
#bouton-joy{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffff 0,#d9dbe8 30%,#7d8098 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.5);pointer-events:none;}
#joy.on{border-color:var(--or);}

/* Le jeu se joue à l'horizontale */
#tourne{position:fixed;inset:0;z-index:20;background:var(--nuit);display:none;place-items:center;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#tourne svg{width:90px;height:90px;animation:pivote 1.8s ease-in-out infinite;}
#tourne p{font-weight:800;font-size:22px;margin:18px 0 0;}
@keyframes pivote{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#tourne{display:grid;}}

/* Bouton de passage */
#action{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));
  font:800 22px/1 var(--f-titre);letter-spacing:.04em;color:#2b1a00;border:none;cursor:pointer;
  padding:16px 26px;border-radius:16px;background:linear-gradient(#ffe377,var(--or));
  box-shadow:0 0 0 3px var(--or-fonce),0 0 24px 6px rgba(255,210,58,.65);animation:luit 1.1s ease-in-out infinite;}
#action:focus-visible{outline:3px solid #fff;outline-offset:4px;}
@keyframes luit{50%{box-shadow:0 0 0 3px var(--or-fonce),0 0 38px 12px rgba(255,210,58,.9);transform:scale(1.04);}}

/* Flèche jaune vers le bas */
#fleche{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:64px;height:72px;margin-left:-32px;
  pointer-events:none;animation:saute .8s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,210,58,.95)) drop-shadow(0 0 22px rgba(255,190,0,.8));}
@keyframes saute{50%{transform:translateY(12px);}}
@media (prefers-reduced-motion:reduce){#action,#fleche{animation:none;}}
</style>

<div id="jeu"><canvas id="c"></canvas></div>
<svg id="fleche" viewBox="0 0 64 72" hidden aria-hidden="true">
  <path d="M20 2h24v32h16L32 70 4 34h16z" fill="#ffd23a" stroke="#fff6c2" stroke-width="3" stroke-linejoin="round"/>
</svg>
<button id="action" hidden>Couloir</button>
<div id="joy" aria-label="Joystick"><div id="bouton-joy"></div></div>
<div id="tourne"><div>
  <svg viewBox="0 0 90 90" aria-hidden="true"><rect x="27" y="8" width="36" height="74" rx="7" fill="none" stroke="#ffd23a" stroke-width="5"/><circle cx="45" cy="73" r="3.5" fill="#ffd23a"/></svg>
  <p>Tourne ton téléphone<br>pour jouer</p></div></div>
<div id="fondu"></div>

<script>
const ASSETS = {"bg": {"chambre": "/assets/shinato/m/img_2bd001a1df0c.jpg", "couloir": "/assets/shinato/m/img_a5e6f26ecb3a.jpg", "salon": "/assets/shinato/m/img_881b17c0bec1.jpg", "cuisine": "/assets/shinato/m/img_77617c765e38.jpg"}, "spr": {"side": ["/assets/shinato/m/img_074cb07e01c0.png", "/assets/shinato/m/img_fa9f7b4e08ba.png", "/assets/shinato/m/img_20cf3f0cbc06.png", "/assets/shinato/m/img_8902d75953b5.png", "/assets/shinato/m/img_e9f89cbabfac.png", "/assets/shinato/m/img_6534156dc1d0.png"], "front": ["/assets/shinato/m/img_0d7d83e96c30.png", "/assets/shinato/m/img_27845b6ba7e0.png", "/assets/shinato/m/img_b57290c4c692.png", "/assets/shinato/m/img_79060fb3fda8.png", "/assets/shinato/m/img_3e46284d4e6a.png", "/assets/shinato/m/img_a95a9a7c0079.png"], "back": ["/assets/shinato/m/img_ddb151af86ef.png", "/assets/shinato/m/img_30673957efc5.png", "/assets/shinato/m/img_380ea55ef559.png", "/assets/shinato/m/img_87d495cca632.png", "/assets/shinato/m/img_8c8541a845bf.png", "/assets/shinato/m/img_933f00a40835.png"]}, "ancre": {"side": [0.4846, 0.4556, 0.3307, 0.4784, 0.5062, 0.4483]}};

function lerp(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t));}

/* ---- Les pièces : zones où l'on marche, taille du perso selon la profondeur, sorties ---- */
const PIECES = {
  chambre:{nom:"Chambre",
    vmin:()=>.70, vmax:.975, umin:()=>.06, umax:()=>.94,
    taille:v=>lerp(.42,.57,(v-.70)/.275),
    sorties:[{test:(u,v)=>v>.925, vers:"couloir", label:"Couloir", fleche:true},
      // la baie vitrée (tout à droite) : on sort à Shinato, comme depuis le bureau
      {test:(u,v)=>u>.82&&v<.90, faire:allerShinato, label:"Aller à Shinato", repere:{u:.88,v:.30}},
      // le lit (à gauche) : le jeu DreamtoSleep, comme depuis le bureau
      {test:(u,v)=>u<.27&&v<.83, faire:dormir, label:"Dormir", repere:{u:.17,v:.40}},
      // le bureau (au fond, au milieu) : on se rassoit, retour en face du bureau
      {test:(u,v)=>u>.36&&u<.72&&v<.78, faire:sAsseoir, label:"S'asseoir", repere:{u:.55,v:.38}}],
    depart:{couloir:{u:.5,v:.86,dir:"back"}}, debut:{u:.5,v:.80,dir:"front"}},
  couloir:{nom:"Couloir",
    vmin:()=>.655, vmax:.975,
    umin:v=>lerp(.40,.13,(v-.655)/.32), umax:v=>lerp(.60,.87,(v-.655)/.32),
    taille:v=>lerp(.34,.72,(v-.655)/.32),
    sorties:[
      {test:(u,v)=>u<.27&&v>.76, vers:"salon",   label:"Salon",   repere:{u:.17,v:.20}},
      {test:(u,v)=>u>.73&&v>.76, vers:"cuisine", label:"Cuisine", repere:{u:.83,v:.20}},
      {test:(u,v)=>v<.70,        vers:"chambre", label:"Chambre", repere:{u:.50,v:.27}}],
    depart:{chambre:{u:.5,v:.72,dir:"front"}, salon:{u:.30,v:.88,dir:"side",flip:true}, cuisine:{u:.70,v:.88,dir:"side",flip:false}}},
  salon:{nom:"Salon",
    vmin:()=>.73, vmax:.975, umin:()=>.03, umax:()=>.97,
    taille:v=>lerp(.74,.90,(v-.73)/.245),
    sorties:[{test:(u,v)=>v>.93, vers:"couloir", label:"Couloir", fleche:true}],
    depart:{couloir:{u:.45,v:.85,dir:"back"}}},
  cuisine:{nom:"Cuisine",
    vmin:u=>u<.52?.875:.80, vmax:.975,
    umin:v=>v<.875?.52:.03, umax:()=>.97,
    taille:v=>lerp(.58,.70,(v-.80)/.175),
    sorties:[{test:(u,v)=>v>.945, vers:"couloir", label:"Couloir", fleche:true},
      // devant le plan de travail : la pizzeria (50 € par pizza réussie)
      {test:(u,v)=>u<.50&&v<.93, faire:fairePizzas, label:"Faire des pizzas", repere:{u:.30,v:.50}}],
    depart:{couloir:{u:.62,v:.90,dir:"back"}}},
};

/* ---- Chargement des images ---- */
function charge(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});}
const IMG={bg:{},spr:{}}, REF={};

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const elAction=document.getElementById('action'),
      elFleche=document.getElementById('fleche'), elFondu=document.getElementById('fondu');

const joueur={u:.5,v:.8,dir:"front",flip:false,frame:0,pas:0,dist:0,t:0,bouge:false};
let piece="chambre", sortieActive=null, enTransition=false;
const touches={haut:false,bas:false,gauche:false,droite:false};

function taille(){const d=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',taille);

function entrer(nom,depuis){
  piece=nom; const P=PIECES[nom];
  const p=(depuis&&P.depart[depuis])||P.debut||{u:.5,v:.85,dir:"front"};
  joueur.u=p.u;joueur.v=p.v;joueur.dir=p.dir;joueur.flip=!!p.flip;joueur.pas=0;joueur.dist=0;joueur.frame=REPOS[p.dir];
  majSortie(true);
}

function changer(vers){
  if(enTransition)return; enTransition=true;
  const de=piece; elFondu.classList.add('on'); sonPorte();
  setTimeout(()=>{entrer(vers,de);elFondu.classList.remove('on');setTimeout(()=>enTransition=false,250);},260);
}
function agir(s){ if(!s)return; if(s.faire){ s.faire(); return; } changer(s.vers); }
elAction.addEventListener('click',()=>agir(sortieActive));
// dans l'appli : Shinato et DreamtoSleep s'ouvrent comme depuis le bureau
function allerShinato(){ try{ if(window.Android&&Android.allerShinato){ Android.allerShinato(); return; } }catch(e){} location.href='/assets/shinato/index.html'; }
function sAsseoir(){ try{ if(window.Android&&Android.sAsseoir){ Android.sAsseoir(); return; } }catch(e){} history.back(); }
function fairePizzas(){ try{ if(window.Android&&Android.fairePizzas){ Android.fairePizzas(); return; } }catch(e){} location.href='/assets/web/jeux/pizzeria-rudy.html'; }
function dormir(){ try{ if(window.Android&&Android.dormir){ Android.dormir(); return; } }catch(e){} location.href='/assets/web/jeux/dreamtosleep.html'; }

function majSortie(force){
  const P=PIECES[piece]; const s=P.sorties.find(s=>s.test(joueur.u,joueur.v))||null;
  if(s!==sortieActive||force){
    sortieActive=s;
    elAction.hidden=!s; if(s)elAction.textContent=s.label;
    elFleche.toggleAttribute('hidden',!(s&&s.fleche));
  }
}

/* ---- Contrôles : clavier + manette tactile ---- */
const MAP={ArrowUp:"haut",KeyW:"haut",KeyZ:"haut",ArrowDown:"bas",KeyS:"bas",
  ArrowLeft:"gauche",KeyA:"gauche",KeyQ:"gauche",ArrowRight:"droite",KeyD:"droite"};
addEventListener('keydown',e=>{
  if(MAP[e.code]){touches[MAP[e.code]]=true;e.preventDefault();}
  if((e.code==="Enter"||e.code==="Space")&&sortieActive){e.preventDefault();agir(sortieActive);}
});
addEventListener('keyup',e=>{if(MAP[e.code])touches[MAP[e.code]]=false;});
addEventListener('blur',()=>{for(const k in touches)touches[k]=false;});
const joy={x:0,y:0,id:null};
const elJoy=document.getElementById('joy'), elBj=document.getElementById('bouton-joy');
function joyMaj(e){
  const r=elJoy.getBoundingClientRect(), R=r.width/2;
  let x=(e.clientX-r.left-R)/R, y=(e.clientY-r.top-R)/R; const n=Math.hypot(x,y);
  if(n>1){x/=n;y/=n;}
  joy.x=x;joy.y=y; elBj.style.transform=`translate(${x*R*0.62}px,${y*R*0.62}px)`;
}
function joyStop(){joy.id=null;joy.x=joy.y=0;elBj.style.transform='';elJoy.classList.remove('on');}
elJoy.addEventListener('pointerdown',e=>{e.preventDefault();demarreSon();joy.id=e.pointerId;elJoy.classList.add('on');
  try{elJoy.setPointerCapture(e.pointerId);}catch(_){} joyMaj(e);});
elJoy.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)joyMaj(e);});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>elJoy.addEventListener(t,e=>{if(e.pointerId===joy.id)joyStop();}));
elJoy.addEventListener('contextmenu',e=>e.preventDefault());

/* ---- Sons (synthétisés) : porte, pas ---- */
let AC=null, SORTIE=null, ECHO=null;
function demarreSon(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();prepareMix();}
    if(AC.state==='suspended')AC.resume();
  }catch(_){}
  try{ if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{}); }catch(_){}
}
addEventListener('pointerdown',demarreSon);addEventListener('keydown',demarreSon);
function prepareMix(){
  // sortie générale + petite réverbération de pièce (murs, plafond)
  SORTIE=AC.createGain();SORTIE.gain.value=.9;SORTIE.connect(AC.destination);
  const conv=AC.createConvolver(),L=Math.floor(AC.sampleRate*.55),ir=AC.createBuffer(2,L,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let k=0;k<L;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/L,3.2)*(k<AC.sampleRate*.008?0:1);}
  conv.buffer=ir;ECHO=AC.createGain();ECHO.gain.value=.22;ECHO.connect(conv).connect(SORTIE);
}
function vers(node){node.connect(SORTIE);node.connect(ECHO);}
function bruit(dur){const b=AC.createBuffer(1,Math.max(1,Math.floor(AC.sampleRate*dur)),AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;return s;}
function filtre(type,f,q){const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b;}
function env(t,a,dec,att){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(a,t+(att||.002));
  g.gain.exponentialRampToValueAtTime(0.0001,t+(att||.002)+dec);return g;}

// clic métallique : quelques résonances inharmoniques très courtes + transitoire
function clicMetal(t,vol){
  [[1870,.10],[2790,.07],[4130,.05],[6020,.035]].forEach(([f,d])=>{
    const o=AC.createOscillator();o.frequency.value=f*(0.97+Math.random()*.06);const g=env(t,vol*.16,d);
    o.connect(g);vers(g);o.start(t);o.stop(t+d+.02);});
  const n=bruit(.03),hp=filtre('highpass',3200),g=env(t,vol*.35,.018);n.connect(hp).connect(g);vers(g);n.start(t);
}
// poignée abaissée puis pêne qui se libère
function sonPoignee(t){clicMetal(t,.8);clicMetal(t+.11,1);
  const n=bruit(.12),bp=filtre('bandpass',1400,2),g=env(t+.01,.05,.1,.03);n.connect(bp).connect(g);vers(g);n.start(t);}
// grincement des gonds : frottement « collé-glissé » = train d'impulsions filtré par les résonances du bois
function sonGrince(t,dur){
  const sr=AC.sampleRate,L=Math.floor(sr*dur),b=AC.createBuffer(1,L,sr),d=b.getChannelData(0);
  let pos=0;
  while(pos<L){
    const x=pos/L, rate=38+60*Math.sin(Math.PI*x)+ (x>.55?25*Math.sin((x-.55)*22):0); // le grincement monte puis vacille
    const amp=Math.sin(Math.PI*Math.min(1,x*1.15))*(0.7+Math.random()*.3);
    for(let k=0;k<sr*.004&&pos+k<L;k++)d[pos+k]+=amp*(Math.random()*2-1)*Math.exp(-k/(sr*.0009));
    pos+=Math.floor(sr/(rate*(0.93+Math.random()*.14)));
  }
  const src=AC.createBufferSource();src.buffer=b;
  const g=AC.createGain();g.gain.value=.55;
  [[540,14,1],[1180,16,.75],[2350,18,.4],[3600,20,.18]].forEach(([f,q,a])=>{
    const bp=filtre('bandpass',f,q),ga=AC.createGain();ga.gain.value=a;src.connect(bp).connect(ga).connect(g);});
  vers(g);src.start(t);
  // souffle d'air du battant
  const n=bruit(dur),lp=filtre('lowpass',380),ga=AC.createGain();
  ga.gain.setValueAtTime(0.0001,t);ga.gain.linearRampToValueAtTime(.06,t+dur*.4);ga.gain.linearRampToValueAtTime(0.0001,t+dur);
  n.connect(lp).connect(ga);vers(ga);n.start(t);
}
// porte en bois qui se referme : coup sourd du battant, corps du bois, puis le pêne
function sonClaque(t){
  const o=AC.createOscillator();o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(52,t+.25);
  const g=env(t,.7,.32);o.connect(g);vers(g);o.start(t);o.stop(t+.4);
  const n=bruit(.3),lp=filtre('lowpass',260),g2=env(t,.9,.16);n.connect(lp).connect(g2);vers(g2);n.start(t);
  const n2=bruit(.2),bp=filtre('bandpass',420,3.5),g3=env(t,.5,.12);n2.connect(bp).connect(g3);vers(g3);n2.start(t);
  const n3=bruit(.1),bp2=filtre('bandpass',1250,5),g4=env(t+.004,.18,.07);n3.connect(bp2).connect(g4);vers(g4);n3.start(t);
  clicMetal(t+.03,.9);
}
function sonPorte(){
  if(!AC||!SORTIE)return;
  try{const t=AC.currentTime+.02;sonPoignee(t);sonGrince(t+.2,.85);sonClaque(t+1.12);}catch(_){}
}
// pas : talon puis pointe, sur parquet (ou sur le tapis du couloir, plus feutré)
function sonPas(){
  if(!AC||!SORTIE)return;
  try{
    const t=AC.currentTime+.005, tapis=piece==='couloir', v=.8+Math.random()*.4, p=.9+Math.random()*.2;
    const lp=tapis?520:950;
    const n=bruit(.09),f=filtre('lowpass',lp*p),f2=filtre('peaking',170*p,1.2);f2.gain.value=8;
    const g=env(t,(tapis?.30:.42)*v,tapis?.07:.06);n.connect(f).connect(f2).connect(g);vers(g);n.start(t);
    const o=AC.createOscillator();o.frequency.setValueAtTime(115*p,t);o.frequency.exponentialRampToValueAtTime(60,t+.07);
    const go=env(t,(tapis?.12:.22)*v,.08);o.connect(go);vers(go);o.start(t);o.stop(t+.12);
    const n2=bruit(.05),f3=filtre('bandpass',tapis?900:1900,1.5),g3=env(t+.055,(tapis?.05:.12)*v,.035);
    n2.connect(f3).connect(g3);vers(g3);n2.start(t+.05);
  }catch(_){}
}

/* ---- Cycles de marche ----
   profil : la planche a 5 images jambes écartées et 1 jambes croisées (n°2) ;
   on alterne écartées / croisées pour que les jambes se relaient vraiment */
const CYCLE={side:[0,2,3,2,5,2], front:[0,1,2,3,4,5], back:[0,1,2,3,4,5]};
const PAS={side:[0,2,4], front:[0,3], back:[0,3]};     // images où le pied touche le sol
const REPOS={side:2, front:0, back:0};
function avance(){
  joueur.pas=(joueur.pas+1)%CYCLE[joueur.dir].length;
  if(PAS[joueur.dir].includes(joueur.pas))sonPas();
}

/* ---- Boucle ---- */
let dernier=0;
function maj(dt){
  if(enTransition){joueur.bouge=false;return;}
  const P=PIECES[piece], bg=IMG.bg[piece], ratio=bg.width/bg.height;
  let dx=(touches.droite?1:0)-(touches.gauche?1:0), dy=(touches.bas?1:0)-(touches.haut?1:0);
  let force=dx||dy?1:0;
  if(Math.hypot(joy.x,joy.y)>0.2){dx=joy.x;dy=joy.y;force=Math.min(1,(Math.hypot(dx,dy)-0.2)/0.6+0.35);}
  joueur.bouge=!!force;
  if(joueur.bouge){
    const h=P.taille(joueur.v);
    const n=Math.hypot(dx,dy);
    const lateral=Math.abs(dx)>=Math.abs(dy)&&dx;
    const vit=h*(lateral?0.80:0.55);   // en hauteurs d'image / seconde
    const u0=joueur.u, v0=joueur.v;
    let nu=joueur.u+dx/n*vit*force*dt/ratio;
    let nv=joueur.v+dy/n*vit*force*0.55*dt;
    nv=Math.max(P.vmin(nu),Math.min(P.vmax,nv));
    nu=Math.max(P.umin(nv),Math.min(P.umax(nv),nu));
    nv=Math.max(P.vmin(nu),Math.min(P.vmax,nv));
    joueur.u=nu;joueur.v=nv;
    const dir=lateral?"side":(dy<0?"back":"front");
    if(dir!==joueur.dir){joueur.dir=dir;joueur.pas=0;joueur.dist=0;joueur.t=0;}
    if(lateral)joueur.flip=dx>0;
    if(dir==="side"){
      // de profil : l'image change selon la distance réellement parcourue (les pieds ne glissent plus)
      joueur.dist+=Math.abs(nu-u0)*ratio;
      if(joueur.dist>=h*0.17){joueur.dist=0;avance();}
    }else{
      joueur.t+=dt*(0.5+force*0.5);
      if(joueur.t>0.12){joueur.t=0;avance();}
    }
    joueur.frame=CYCLE[dir][joueur.pas];
  } else {joueur.pas=0;joueur.dist=0;joueur.t=0;joueur.frame=REPOS[joueur.dir];}
  majSortie(false);
}

function dessine(temps){
  const W=innerWidth,H=innerHeight, bg=IMG.bg[piece], P=PIECES[piece];
  // le décor couvre tout l'écran (jeu à l'horizontale)
  const s=Math.max(W/bg.width,H/bg.height), iw=bg.width*s, ih=bg.height*s;
  const px=joueur.u*iw, py=joueur.v*ih;
  const cx=iw>W?Math.max(0,Math.min(iw-W,px-W/2)):(iw-W)/2;
  const cy=ih>H?Math.max(0,Math.min(ih-H,py-H*0.62)):(ih-H)/2;
  ctx.fillStyle="#0b0d1f";ctx.fillRect(0,0,W,H);
  ctx.drawImage(bg,-cx,-cy,iw,ih);

  // repère lumineux au-dessus de la porte visée
  if(sortieActive&&sortieActive.repere){
    const rx=sortieActive.repere.u*iw-cx, ry=sortieActive.repere.v*ih-cy+Math.sin(temps/180)*7;
    ctx.save();ctx.shadowColor="rgba(255,200,0,.95)";ctx.shadowBlur=18;ctx.fillStyle="#ffd23a";
    ctx.strokeStyle="#fff6c2";ctx.lineWidth=2;const a=ih*0.035;
    ctx.beginPath();ctx.moveTo(rx-a*.45,ry-a*1.2);ctx.lineTo(rx+a*.45,ry-a*1.2);ctx.lineTo(rx+a*.45,ry-a*.4);
    ctx.lineTo(rx+a,ry-a*.4);ctx.lineTo(rx,ry+a*.6);ctx.lineTo(rx-a,ry-a*.4);ctx.lineTo(rx-a*.45,ry-a*.4);ctx.closePath();
    ctx.fill();ctx.stroke();ctx.restore();
  }

  // personnage
  const fr=IMG.spr[joueur.dir][joueur.frame], hCible=P.taille(joueur.v)*ih;
  const h=hCible*fr.height/REF[joueur.dir], w=fr.width*h/fr.height;
  const fx=px-cx, fy=py-cy;
  ctx.fillStyle="rgba(0,0,0,.32)";ctx.beginPath();
  ctx.ellipse(fx,fy-h*0.01,hCible*(joueur.dir==="side"?0.20:0.14),hCible*0.025,0,0,Math.PI*2);ctx.fill();
  // de profil, on cale l'image sur la tête : le corps ne tremble plus d'une image à l'autre
  const ax=joueur.dir==="side"?ASSETS.ancre.side[joueur.frame]*w:w/2;
  ctx.save();ctx.translate(fx,fy);if(joueur.dir==="side"&&joueur.flip)ctx.scale(-1,1);
  ctx.drawImage(fr,-ax,-h,w,h);ctx.restore();
}

function boucle(t){
  const dt=Math.min(0.05,(t-dernier)/1000||0);dernier=t;
  maj(dt);dessine(t);requestAnimationFrame(boucle);
}

(async()=>{
  taille();
  for(const k in ASSETS.bg)IMG.bg[k]=await charge(ASSETS.bg[k]);
  for(const d in ASSETS.spr){IMG.spr[d]=await Promise.all(ASSETS.spr[d].map(charge));
    REF[d]=Math.max(...IMG.spr[d].map(i=>i.height));}
  entrer("chambre");
  requestAnimationFrame(boucle);
})();
</script>
