<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statue</title>
<style>
:root{--fond:#07060a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fond:#07060a}}
:root[data-theme="dark"]{--fond:#07060a}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fond);overflow:hidden;touch-action:manipulation;font-family:Georgia,"Times New Roman",serif}
.ecran{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.cadre{position:relative;width:min(100vw,calc(100vh*941/1672));aspect-ratio:941/1672;container-type:inline-size}
.cadre>img.fond{position:absolute;inset:0;width:100%;height:100%;display:block}
/* les losanges : les diamants des boss vaincus */
.gem{position:absolute;width:18.6%;transform:translate(-50%,-50%);display:none;filter:drop-shadow(0 0 2.4cqw rgba(255,210,90,.55));animation:brille 2.6s ease-in-out infinite alternate}
.gem.on{display:block}
.plaqueG{position:absolute;object-fit:fill;border-radius:.4cqw;transform:translate(-50%,-50%);display:none;filter:drop-shadow(0 0 1.6cqw rgba(255,210,90,.45));animation:brille 2.6s ease-in-out infinite alternate}
.plaqueG.on{display:block}
@keyframes brille{from{filter:drop-shadow(0 0 1.2cqw rgba(255,210,90,.35))}to{filter:drop-shadow(0 0 3.2cqw rgba(255,220,120,.85))}}
/* les nombres */
.val{position:absolute;display:flex;align-items:baseline;justify-content:center;font-weight:700;letter-spacing:.02em;white-space:nowrap;line-height:1;padding-top:.9cqw;
 color:#f3c868;text-shadow:0 -.15cqw 0 #fff1b8,0 .3cqw .3cqw #000,0 0 1.6cqw rgba(255,190,70,.45)}
.val small{font-size:.62em;opacity:.9;margin-left:.15em}
.zone{position:absolute;cursor:pointer;border-radius:1.4cqw}
.zone:active{background:rgba(255,215,120,.12)}
#perso,#jeuxZone{box-shadow:0 0 0 .35cqw rgba(255,214,110,.0);animation:appel 2.2s ease-in-out infinite}
@keyframes appel{0%,100%{box-shadow:0 0 0 .3cqw rgba(255,214,110,0)}50%{box-shadow:0 0 1.6cqw .3cqw rgba(255,214,110,.45)}}
/* les pages des personnages */
#pages{display:none;background:var(--fond)}
#pages.on{display:flex}
#pages .cadre{aspect-ratio:auto;height:auto}
#pages img.page{width:100%;display:block}
.nav{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:14px;z-index:5;pointer-events:none}
.nav button,.retour{pointer-events:auto;border:2px solid rgba(255,214,110,.85);background:rgba(10,8,6,.82);color:#ffd96e;font:700 16px Georgia,serif;border-radius:999px;padding:9px 16px;box-shadow:0 0 12px rgba(255,190,60,.35)}
.nav span{pointer-events:none;color:#ffd96e;font:700 15px Georgia,serif;text-shadow:0 2px 4px #000;min-width:64px;text-align:center}
.retour{position:fixed;z-index:6;top:calc(10px + env(safe-area-inset-top,0px));left:10px}
#apercu{position:fixed;z-index:7;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border:1px solid rgba(255,214,110,.4);background:rgba(0,0,0,.55);color:rgba(255,217,110,.75);font:600 11px system-ui,sans-serif;border-radius:999px;padding:6px 10px}
#pages.on ~ #apercu{display:none}
@font-face{font-family:"Statue";src:url(statue/99a7a8320c.ttf) format("truetype");font-weight:700}
#jeux,#score{display:none;background:var(--fond)}
#jeux.on,#score.on{display:flex}
.titre{position:absolute;left:30%;width:40%;top:6.6%;height:4.4%;display:flex;align-items:center;justify-content:center;text-align:center;
 font:700 5.6cqw/1 "Statue",Georgia,serif;letter-spacing:.04em;white-space:nowrap;
 background:linear-gradient(#fff0b0,#f1c25a 45%,#b8761e 60%,#e7b14b);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 .3cqw .25cqw #000) drop-shadow(0 0 1.2cqw rgba(255,150,40,.45))}
.titre.long{font-size:4.2cqw}.titre.tlong{font-size:3.4cqw}
.liste{position:absolute;left:13.2%;width:73.6%;top:18.2%;height:73.6%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.4cqw 1cqw 3cqw;scrollbar-width:none}
.liste::-webkit-scrollbar{display:none}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
.jeu{position:relative;border-radius:1.2cqw;padding:2.4cqw 1.6cqw 2cqw;text-align:center;cursor:pointer;
 background:radial-gradient(120% 140% at 50% 0%,#2b2218,#120e0a 70%);
 border:.45cqw solid #c99a3c;box-shadow:inset 0 0 0 .35cqw #1a120a,inset 0 0 0 .6cqw rgba(255,214,120,.55),0 .5cqw 1.4cqw rgba(0,0,0,.7)}
.jeu:active{transform:scale(.97);filter:brightness(1.25)}
.jeu .n{font:700 3.9cqw/1.1 "Statue",Georgia,serif;letter-spacing:.03em;
 background:linear-gradient(#fff2bd,#f0c25b 50%,#b77520);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .2cqw .15cqw #000)}
.jeu .r{margin-top:1.2cqw;font:700 2.7cqw/1 "Statue",Georgia,serif;color:#cfb27a;letter-spacing:.02em}
.jeu .r b{color:#8fe08a;font-weight:700}.jeu .r i{font-style:normal;color:#ff8a7a}
.jeu.vide .r{color:#7d6a4c}
.tab{width:100%;border-collapse:separate;border-spacing:0 1.2cqw;font-family:"Statue",Georgia,serif}
.tab th{font:700 2.8cqw/1 "Statue",Georgia,serif;color:#d9b56a;letter-spacing:.05em;padding:0 1cqw 1cqw;text-align:center}
.tab th:first-child{text-align:left}
.tab td{padding:2cqw 1.4cqw;text-align:center;font:700 4.4cqw/1 "Statue",Georgia,serif;color:#f3d68f;
 background:linear-gradient(#251c13,#140f0a);border-top:.3cqw solid #b98a33;border-bottom:.3cqw solid #6e4f1c}
.tab td:first-child{text-align:left;border-left:.3cqw solid #b98a33;border-radius:1cqw 0 0 1cqw;font-size:3.9cqw;color:#fbe3a3}
.tab td:last-child{border-right:.3cqw solid #b98a33;border-radius:0 1cqw 1cqw 0}
.tab td.v{color:#8fe08a}.tab td.d{color:#ff8a7a}.tab td.nu{color:#d7c9a8}
.tab tr.jamais td{opacity:.45}
.tab tr.total td{background:linear-gradient(#3a2a14,#1d140a);border-color:#e0b04e}
.note{margin:2.6cqw 1cqw 0;text-align:center;font:700 2.7cqw/1.35 "Statue",Georgia,serif;color:#a88d5e}
#fiche{display:none;background:var(--fond)}#fiche.on{display:flex}
/* ASTUCES : ce qu'il faut faire pour débloquer chaque donjon */
#astuce{display:none;background:var(--fond)}#astuce.on{display:flex}
#bAstuce{position:fixed;z-index:6;top:calc(10px + env(safe-area-inset-top,0px));right:10px;border:2px solid rgba(255,214,110,.85);background:rgba(10,8,6,.82);color:#ffd96e;font:700 16px Georgia,serif;border-radius:999px;padding:9px 16px;box-shadow:0 0 12px rgba(255,190,60,.45);animation:appel 2.2s ease-in-out infinite}
#astuce .liste{top:17%;height:76%}
.don{position:relative;margin-bottom:3cqw;border-radius:1.4cqw;padding:2.6cqw 2.4cqw 2.2cqw;background:radial-gradient(120% 140% at 50% 0%,#2b2218,#120e0a 70%);
 border:.45cqw solid #c99a3c;box-shadow:inset 0 0 0 .35cqw #1a120a,inset 0 0 0 .6cqw rgba(255,214,120,.45),0 .5cqw 1.4cqw rgba(0,0,0,.7)}
.don.fini{border-color:#6fbf5f;box-shadow:inset 0 0 0 .35cqw #0f1a0c,inset 0 0 0 .6cqw rgba(140,230,120,.4),0 .5cqw 1.4cqw rgba(0,0,0,.7)}
.don .t{display:flex;align-items:center;gap:2cqw;font:700 4.3cqw/1.1 "Statue",Georgia,serif;background:linear-gradient(#fff2bd,#f0c25b 50%,#b77520);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .2cqw .15cqw #000)}
.don .t img{width:7cqw;height:7cqw;object-fit:contain;-webkit-text-fill-color:initial}
.don .t img.pl{width:16cqw;height:4.4cqw;object-fit:fill;border-radius:.4cqw}
.don .etat{margin:1cqw 0 1.6cqw;font:700 3cqw/1 "Statue",Georgia,serif;color:#cfb27a}
.don.fini .etat{color:#8fe08a}
.don ol{margin:0;padding:0;list-style:none}
.don li{position:relative;padding:1.1cqw 0 1.1cqw 5.4cqw;font:700 3.3cqw/1.35 "Statue",Georgia,serif;color:#e9d6a8;border-top:.2cqw solid rgba(201,154,60,.25)}
.don li::before{content:"•";position:absolute;left:1.4cqw;top:1cqw;color:#a88d5e}
.don li.ok{color:#8fbf86;text-decoration:line-through;text-decoration-color:rgba(143,191,134,.55)}
.don li.ok::before{content:"✓";color:#8fe08a}
.don li.suite{color:#fff3c4}
.don li.suite::before{content:"➜";color:#ffd96e}
.don .att{margin-top:1.2cqw;font:700 2.8cqw/1.35 "Statue",Georgia,serif;color:#ff9a7a}
.fzone{position:absolute;left:13.6%;width:72.8%;top:19.2%;height:72%;display:flex;flex-direction:column;align-items:center;gap:3.2cqw}
.gcadre{position:relative;width:100%;padding:1.6cqw;border-radius:1.8cqw;
 background:linear-gradient(135deg,#ffe9a8,#c58b2c 22%,#7a4f15 45%,#f3cf74 60%,#8b5a17 82%,#ffe3a0);
 box-shadow:0 0 0 .5cqw #1a1209,0 0 0 .9cqw #a77a2b,0 1.5cqw 4cqw rgba(0,0,0,.8),0 0 5cqw rgba(255,180,60,.25)}
.gcadre img{display:block;width:100%;max-height:44cqh;object-fit:cover;border-radius:1cqw;box-shadow:inset 0 0 0 .4cqw #000;background:#000}
.gcadre::before,.gcadre::after{content:"";position:absolute;width:5cqw;height:5cqw;border:.6cqw solid #fff0b8;transform:rotate(45deg);background:#1a1209;z-index:2}
.gcadre::before{left:-2.2cqw;top:-2.2cqw}.gcadre::after{right:-2.2cqw;top:-2.2cqw}
.plaque{margin:1.6cqw auto 0;width:78%;text-align:center;padding:1.8cqw 1cqw 1.4cqw;border-radius:1cqw;background:linear-gradient(#1e1610,#0c0906);
 box-shadow:inset 0 0 0 .35cqw #d9a94a,inset 0 0 0 .7cqw #1a1209;
 font:700 6.4cqw/1 "Statue",Georgia,serif;letter-spacing:.05em;text-transform:uppercase}
.plaque span{background:linear-gradient(#fff2bd,#f0c25b 50%,#b77520);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .25cqw .2cqw #000)}
.gcadre.rouge{background:linear-gradient(135deg,#ffb3a0,#b3241b 22%,#4d0a08 45%,#e4523e 60%,#5e0d0a 82%,#ffc0b0);box-shadow:0 0 0 .5cqw #1a0505,0 0 0 .9cqw #c0392b,0 1.5cqw 4cqw rgba(0,0,0,.8),0 0 6cqw rgba(255,40,30,.35)}
.gcadre.rouge .plaque{box-shadow:inset 0 0 0 .35cqw #e2513f,inset 0 0 0 .7cqw #1a0505}
.gcadre.rouge::before,.gcadre.rouge::after{border-color:#ffb3a0;background:#2a0606}
.bulle{position:relative;width:100%;padding:3.6cqw 3.4cqw 3cqw;border-radius:2cqw;background:linear-gradient(#211913,#100c08);
 border:.45cqw solid #c99a3c;box-shadow:inset 0 0 0 .35cqw #1a120a,inset 0 0 0 .6cqw rgba(255,214,120,.4),0 1cqw 3cqw rgba(0,0,0,.7);
 font:700 4.1cqw/1.42 "Statue",Georgia,serif;color:#f6e3b4;text-shadow:0 .2cqw .2cqw #000}
.bulle::before{content:"";position:absolute;left:50%;top:-2.6cqw;margin-left:-2.2cqw;border:2.2cqw solid transparent;border-bottom-color:#c99a3c;border-top:0}
.bulle .qui{position:absolute;left:3cqw;top:-3.2cqw;padding:.9cqw 2.6cqw;border-radius:99px;background:linear-gradient(#3b5a2c,#1f3517);border:.35cqw solid #d6b25a;
 font:700 3.2cqw/1 "Statue",Georgia,serif;color:#ffe9a6;letter-spacing:.08em;text-transform:uppercase}
.bulle.court{text-align:center;font-size:4.4cqw}
.fzone{overflow-y:auto;scrollbar-width:none;padding:2.4cqw 1.4cqw 4cqw}.fzone::-webkit-scrollbar{display:none}
.bulle.long{font-size:3.6cqw;line-height:1.38}
.fzone.long .gcadre img{max-height:46cqw}.fzone.long{gap:2.6cqw}
.fzone.long .gcadre img{max-height:38cqw}.plaque.pl{font-size:4.8cqw}
</style>
</head>

<script>
/* ---------- Statue : l'appli du téléphone qui montre où en est Rudy ----------
   (prototype en HTML : les nombres viennent de la partie quand la page tourne dans l'appli) */
const PAGES=["statue/890d180b34.webp","statue/a3dd3c0457.webp","statue/e030d6cd4d.webp","statue/2a8ce3a127.webp","statue/0c7a0a26c7.webp","statue/bcb4d4aff7.webp","statue/7e7350bfa4.webp","statue/d3c3cbf6f9.webp","statue/0b360bb486.webp","statue/817e5ba814.webp","statue/19e73a0771.webp"];
const NB_PERSOS=87;          // tous les personnages des pages (sans l'emblème)
const NB_CONTACTS=11;      // les filles qu'on peut avoir dans le téléphone
const NB_VIDEOS=633;          // toutes les vidéos du jeu (Déverrouillage)
let APERCU=false;
const $=id=>document.getElementById(id);
function lit(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function argent(){
 for(const w of [window,window.parent,window.top]){ try{ if(w&&w.Chambre&&w.Chambre.argent) return parseInt(w.Chambre.argent(),10)||0; }catch(e){} }
 const v=lit('rudy_argent'); return v===null?5000:(parseInt(v,10)||0);
}
function contacts(){ try{ return Object.keys(JSON.parse(lit('rudy_contacts')||'{}')||{}).length; }catch(e){ return 0; } }
function videos(){ const vu=new Set();   // les vidéos déjà vues / débloquées dans la partie
 for(const k of ['rudy_vues','rudy_videos']){ try{ (JSON.parse(lit(k)||'[]')||[]).forEach(o=>{ const v=(o&&o.src)||o; if(v) vu.add(String(v)); }); }catch(e){} }
 return Math.min(vu.size,NB_VIDEOS); }   // les vidéos vues dans la partie
function deux(n){ return n<10?'0'+n:String(n); }
function euros(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function maj(){
 const A=APERCU;
 $('vArgent').innerHTML=euros(A?1120:argent())+'<small>€</small>';
 $('vContacts').innerHTML=deux(A?8:contacts())+'<small>/'+NB_CONTACTS+'</small>';
 $('vVideos').innerHTML=(A?37:videos())+'<small>/'+NB_VIDEOS+'</small>';
 $('vPerso').textContent=NB_PERSOS;
 $('gemAstra').classList.toggle('on',A||lit('mitsuda_usine_gagnee')==='1');      // Astra vaincue (l'usine)
 $('gemVampa').classList.toggle('on',A||lit('rembourg_chateau_gagne')==='1');    // la Reine des vampires vaincue (le château)
 $('gemFarah').classList.toggle('on',A||lit('foret_gagnee')==='1');
 $('gemHotel').classList.toggle('on',A||lit('hotel_palace_gagne')==='1');
 $('gemPontlades').classList.toggle('on',A||lit('pontlades_gagne')==='1');
 $('gemChasseur').classList.toggle('on',A||lit('chasseur_gagne')==='1');
 $('plaqueCourage').classList.toggle('on',A||lit('grotte_gagnee')==='1');
 $('plaqueEquilibre').classList.toggle('on',A||lit('plaquette_gagnee')==='1');   // La Plaquette Dorée gagnée (la boss de la salle du temple) : la plaque « Équilibre » (3e rectangle, à droite)   // la grotte du diamant cuivré réussie (RÉSISTER) : la plaque « Courage » (rectangle du milieu)
 $('plaqueGuerriere').classList.toggle('on',A||lit('impasse_combat_gagne')==='1');   // le combat de l'impasse gagné : la plaque « Guerrière » (1er rectangle)   // la géante de « Chasseur de nuit » vaincue   // la boss du Grand Terrain (Pont-l'Ades) vaincue          // la boss de l'Hôtel Palace vaincue              // Farah la Rousse vaincue (la forêt)
}
maj(); setInterval(maj,1500); addEventListener('storage',maj);

let ip=0;
function page(i){ ip=(i+PAGES.length)%PAGES.length; $('pimg').src=PAGES[ip]; $('pNum').textContent=(ip+1)+' / '+PAGES.length; }

let AC=null;
function son(){ try{
 AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
 const t=AC.currentTime, o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain();
 o.type='triangle'; o.frequency.setValueAtTime(1500,t); o.frequency.exponentialRampToValueAtTime(700,t+0.07);
 o2.type='sine'; o2.frequency.setValueAtTime(2900,t);
 g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
 o.connect(g); o2.connect(g); g.connect(AC.destination); o.start(t); o2.start(t); o.stop(t+0.12); o2.stop(t+0.05);
}catch(e){} }
function tap(el,f){ el.addEventListener('click',e=>{ e.stopPropagation(); son(); f(); }); }

function scores(){
 let s={}; try{ s=JSON.parse(lit('rudy_scores')||'{}')||{}; }catch(e){}
 for(const w of [window,window.parent,window.top]){ try{ if(w&&w.Chambre&&w.Chambre.scores){ const n=JSON.parse(w.Chambre.scores()||'{}');
   for(const j in n){ s[j]=s[j]||{}; for(const a in n[j]){ const x=s[j][a]||{v:0,d:0,n:0}, y=n[j][a]; s[j][a]={v:(x.v||0)+(y.v||0),d:(x.d||0)+(y.d||0),n:(x.n||0)+(y.n||0)}; } } break; } }catch(e){} }
 if(APERCU){ // des scores d'exemple, seulement pour voir à quoi ça ressemble
  s={}; let k=7; const r=()=>{ k=(k*9301+49297)%233280; return k/233280; };
  JEUX.forEach((J,i)=>{ if(i%5===4) return; s[J.id]={}; J.adv.forEach(a=>{ if(r()<.3) return; s[J.id][a]={v:Math.floor(r()*6),d:Math.floor(r()*5),n:J.nul?Math.floor(r()*2):0}; }); });
 }
 return s;
}
function bilan(t){ let v=0,d=0,n=0; for(const a in (t||{})){ v+=t[a].v||0; d+=t[a].d||0; n+=t[a].n||0; } return {v,d,n}; }
function titre(el,txt){ el.textContent=txt; el.className='titre'+(txt.length>15?' tlong':txt.length>10?' long':''); }
function ecran(id){ ['statue','pages','jeux','score'].forEach(e=>{ const el=$(e); if(e==='statue') el.style.display=(e===id?'flex':'none'); else el.classList.toggle('on',e===id); }); if($('apercu')) $('apercu').style.display=(id==='statue'?'':'none'); }
function listeJeux(){
 const S=scores(); let h='<div class="grille">';
 JEUX.forEach((J,i)=>{ const b=bilan(S[J.id]); const joue=b.v+b.d+b.n>0;
  h+='<div class="jeu'+(joue?'':' vide')+'" data-i="'+i+'"><div class="n">'+J.nom+'</div><div class="r">'+
   (joue?'<b>'+b.v+'</b> gagné'+(b.v>1?'s':'')+' · <i>'+b.d+'</i> perdu'+(b.d>1?'s':'')+(J.nul&&b.n?' · '+b.n+' nul'+(b.n>1?'s':''):''):'Pas encore joué')+'</div></div>'; });
 $('jListe').innerHTML=h+'</div>';
}
function ouvreJeu(i){
 const J=JEUX[i], S=(scores()[J.id])||{}; titre($('sTitre'),J.nom);
 let h='<table class="tab"><tr><th>Contre</th><th>Gagné</th><th>Perdu</th>'+(J.nul?'<th>Nul</th>':'')+'</tr>';
 const noms=J.adv.slice(); for(const a in S) if(!noms.includes(a)) noms.push(a);
 noms.forEach(a=>{ const x=S[a]||{v:0,d:0,n:0}; const jamais=!((x.v||0)+(x.d||0)+(x.n||0));
  h+='<tr'+(jamais?' class="jamais"':'')+'><td>'+a+'</td><td class="v">'+(x.v||0)+'</td><td class="d">'+(x.d||0)+'</td>'+(J.nul?'<td class="nu">'+(x.n||0)+'</td>':'')+'</tr>'; });
 const b=bilan(S);
 if(noms.length>1) h+='<tr class="total"><td>Total</td><td class="v">'+b.v+'</td><td class="d">'+b.d+'</td>'+(J.nul?'<td class="nu">'+b.n+'</td>':'')+'</tr>';
 h+='</table>';
 if(!(b.v+b.d+b.n)) h+='<div class="note">Aucune partie jouée pour l\'instant.</div>';
 $('sListe').innerHTML=h; $('sListe').scrollTop=0; ecran('score');
}
