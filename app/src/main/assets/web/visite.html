<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Visite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verre:rgba(16,13,44,.94);      /* fond du téléphone, bleu nuit de la chambre */
  --trait:rgba(170,160,255,.22);
  --texte:#f2efff;
  --doux:#a9a3d6;
  --elle:#2b2766;                 /* bulles de la fille */
  --rudy:#3b6cf0;                 /* réponses de Rudy */
  --vert:#2fcf62; --rouge:#ff4b43;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texte);touch-action:manipulation}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* la chambre : même proportion que ta capture, centrée */
/* calque transparent : la chambre est dessinée par l'appli, juste en dessous */
#scene{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:none}
#sophie{position:absolute;transform:translateX(-50%);height:57.7%;left:63%;bottom:10.9%;display:none;
  filter:drop-shadow(0 14px 10px rgba(0,0,20,.45));user-select:none;-webkit-user-drag:none;transition:opacity .25s}
#sophie.arrive{animation:arrive .9s ease-out}
@keyframes arrive{from{opacity:0;transform:translateX(-50%) translateY(3%)}to{opacity:1;transform:translateX(-50%)}}
.lit{position:absolute;left:50%;bottom:24.5%;transform:translateX(-50%);display:none;opacity:0;transition:opacity .6s ease;filter:drop-shadow(0 10px 8px rgba(0,0,20,.4));user-select:none;-webkit-user-drag:none;z-index:1}
#voile{position:absolute;inset:0;background:#05040f;opacity:0;pointer-events:none;transition:opacity .45s;z-index:8}
#voile.on{opacity:1}
#bulle{position:absolute;display:none;max-width:52%;padding:7px 12px 9px;border-radius:14px 14px 14px 4px;background:rgba(255,255,255,.96);color:#1c1740;font-weight:700;font-size:clamp(12px,3.4vw,15px);line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:3}
#bulle .qui{display:block;font-size:.78em;font-weight:800;color:#c2317a;margin-bottom:1px}
/* cœur d'amitié */
#coeur{position:absolute;left:50%;top:5.2%;transform:translateX(-50%);height:3.6%;display:none;align-items:center;gap:6px;padding:0 12px;border-radius:999px;background:rgba(12,8,24,.85);border:1.5px solid rgba(255,120,170,.55);font-weight:800;font-size:clamp(11px,3vw,14px);white-space:nowrap}
#coeur i{font-style:normal;color:#ff5c8f}
.flotte{position:absolute;font-weight:800;font-size:clamp(14px,4vw,20px);pointer-events:none;animation:flotte 1.4s ease-out forwards;text-shadow:0 2px 4px rgba(0,0,0,.6);z-index:4}
.flotte.plus{color:#ff7aa8}.flotte.moins{color:#9aa4c8}
@keyframes flotte{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
/* menu quand on la touche, et la discussion */
#menu,#discu{position:absolute;left:4%;right:4%;bottom:3%;display:none;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:rgba(14,11,40,.93);border:1px solid var(--trait);z-index:5}
#menu .titre,#discu .titre{font-weight:800;font-size:15px;margin:0 2px 2px}
#discu .question{background:#fff;color:#1c1740;border-radius:14px 14px 14px 4px;padding:8px 12px 10px;font-weight:700;font-size:15px;line-height:1.35}
#discu .question .qui{display:block;font-size:12px;font-weight:800;color:#c2317a}
.opt{border:1.5px solid rgba(120,150,255,.55);background:rgba(59,108,240,.16);color:var(--texte);border-radius:14px;padding:11px 12px;font:700 15px Nunito,sans-serif;text-align:left;cursor:pointer}
.opt.doux{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.cz{font-size:12px;color:#ff7aa8;font-weight:800}
#coeur .sep{opacity:.5}
.opt.argOui{border-color:#2fcf62;background:rgba(47,207,98,.16)}
.opt.argNon{border-color:#ff4b43;background:rgba(255,75,67,.14)}
.pluie{position:absolute;z-index:4;pointer-events:none;opacity:0;animation:pluie 2.4s ease-out forwards;text-shadow:0 0 8px rgba(255,90,150,.8)}
@keyframes pluie{0%{opacity:0;transform:translateY(10px) scale(.4)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-120px) scale(.9) rotate(20deg)}}
/* bouton Téléphone : posé exactement sur celui de la capture */
#btnTel{position:absolute;left:2%;top:.8%;width:26.4%;height:3.6%;border-radius:999px;border:1.5px solid rgba(255,225,160,.55);
  background:rgba(12,8,24,.9);color:#ffeec2;font:800 clamp(11px,3vw,15px)/1 Nunito,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
#btnTel:focus-visible,.contact:focus-visible,.choix:focus-visible{outline:2px solid #ffd76a;outline-offset:2px}
/* réglage de la place de Sophie */
#btnReglage{position:absolute;right:2%;top:.8%;height:3.6%;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(12,8,24,.7);color:#fff;font-size:clamp(12px,3.4vw,16px);cursor:pointer;display:none}
#btnSimu{position:absolute;right:13%;top:.8%;height:3.6%;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(12,8,24,.7);color:#fff;font-size:clamp(12px,3.4vw,16px);cursor:pointer;z-index:6}
#simu{position:absolute;right:3%;top:5.5%;width:min(80%,300px);display:none;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:rgba(12,8,30,.95);border:1px solid var(--trait);font-size:13px;z-index:7}
#simu label{display:flex;justify-content:space-between;align-items:center;gap:8px}
#simu select{flex:1;max-width:60%;padding:6px;border-radius:8px;background:#221d52;color:#fff;border:1px solid var(--trait);font:600 13px Nunito,sans-serif}
#simu button{border:0;border-radius:10px;padding:9px;background:#3b6cf0;color:#fff;font:800 13px Nunito,sans-serif}
#reglage{position:absolute;left:3%;right:3%;bottom:2%;display:none;padding:10px 12px;border-radius:14px;background:rgba(12,8,30,.9);border:1px solid var(--trait);font-size:13px}
#reglage label{display:flex;align-items:center;gap:10px}
#reglage input{flex:1}
#reglage .ligne{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
#reglage button{border:0;border-radius:10px;padding:7px 10px;background:#2f2a70;color:#fff;font:700 12px Nunito,sans-serif}

/* ---------- le téléphone ---------- */
#tel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,2,12,.55);z-index:10}
#tel.ouvert{display:flex}
.coque{position:relative;width:min(88vw,370px);height:min(82vh,720px);border-radius:38px;padding:12px;background:#07061a;border:2px solid #2a2750;
  box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.05)}
.ecran{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:var(--verre);display:flex;flex-direction:column}
.barre{display:flex;justify-content:space-between;padding:10px 18px 4px;font-size:12px;font-weight:700;color:var(--doux)}
.vue{position:absolute;inset:26px 0 0;display:none;flex-direction:column}
.vue.on{display:flex}
h2{margin:6px 18px 10px;font-size:26px;font-weight:800;letter-spacing:-.3px}
.liste{overflow:auto;padding:0 10px 14px}
.contact{width:100%;display:flex;align-items:center;gap:12px;padding:9px 8px;border:0;border-radius:14px;background:none;color:var(--texte);font:700 16px Nunito,sans-serif;text-align:left;cursor:pointer}
.contact:active{background:rgba(255,255,255,.06)}
.contact small{display:block;font-weight:500;font-size:12px;color:var(--doux)}
.contact .appel{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--vert);display:grid;place-items:center;font-size:16px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;background:#3a3480;background-size:cover;background-position:center}
.fermer{position:absolute;right:14px;top:6px;border:0;background:none;color:var(--doux);font:800 14px Nunito,sans-serif;padding:6px;cursor:pointer}

/* appel en cours */
#vAppel{align-items:center}
#vAppel .grand{width:92px;height:92px;margin-top:18px;font-size:34px;box-shadow:0 0 0 6px rgba(255,255,255,.05)}
#nomAppel{font-size:24px;font-weight:800;margin-top:10px}
#etat{font-size:13px;color:var(--doux);margin-top:2px;min-height:18px}
#fil{flex:1;width:100%;overflow:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
.b{max-width:82%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.35;animation:bulle .22s ease-out}
.b.elle{align-self:flex-start;background:var(--elle);border-bottom-left-radius:6px}
.b.rudy{align-self:flex-end;background:var(--rudy);border-bottom-right-radius:6px}
@keyframes bulle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ecrit{align-self:flex-start;color:var(--doux);font-size:13px;padding:2px 6px}
#choix{width:100%;padding:8px 14px 10px;display:flex;flex-direction:column;gap:7px}
.choix{border:1.5px solid rgba(120,150,255,.55);background:rgba(59,108,240,.14);color:var(--texte);border-radius:14px;padding:11px 12px;font:700 15px Nunito,sans-serif;cursor:pointer}
.choix.oui{border-color:var(--vert);background:rgba(47,207,98,.16)}
.choix.non{border-color:var(--rouge);background:rgba(255,75,67,.14)}
#raccrocher{width:58px;height:58px;border-radius:50%;border:0;background:var(--rouge);color:#fff;font-size:24px;margin:4px 0 16px;cursor:pointer;transform:rotate(135deg)}
#resto{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;z-index:35;background:#000;transition:opacity .45s}
#homerun{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;z-index:35;background:#070d24;transition:opacity .45s}
#sortie{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;z-index:30;background:#000;transition:opacity .45s}
#resto{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;z-index:35;background:#000;transition:opacity .45s}
#telV{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;z-index:40;background:#000}
#telFermer{position:fixed;z-index:41;display:none;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));padding:8px 14px;border-radius:18px;border:1.5px solid rgba(255,225,160,.6);background:rgba(12,8,24,.85);color:#ffeec2;font:800 13px Nunito,system-ui,sans-serif}
.fl{position:absolute;top:44%;width:40px;height:64px;border:0;border-radius:14px;background:rgba(10,8,30,.45);color:#fff;font:700 34px/1 system-ui,sans-serif;display:grid;place-items:center;z-index:6;cursor:pointer}
#flG{left:6px}#flD{right:6px}
#toast{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:rgba(10,8,28,.92);border:1px solid var(--trait);font-weight:700;font-size:14px;display:none;z-index:20;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#btnReglage,#btnSimu,#btnTel,.fl,#telV,#telFermer,#tel{display:none!important}
#sophie,.lit{visibility:hidden}
</style>
</head>
<body>
<div id="scene">
  <img id="sophie" alt="Sophie">
  <img id="lit1" class="lit" alt=""><img id="lit2" class="lit" alt="">
  <div id="voile"></div>
  <button class="fl" id="flG" aria-label="Regarder à gauche">‹</button><button class="fl" id="flD" aria-label="Regarder à droite">›</button>
  <div id="bulle"></div>
  <div id="coeur" aria-live="polite"><i>♥</i><span id="coeurTxt"></span><span class="sep">·</span>💶 <span id="argentTxt"></span></div>
  <div id="menu"></div>
  <div id="discu"></div>
  <button id="btnTel" aria-label="Ouvrir le téléphone">📱 Téléphone</button>
  <button id="btnSimu" aria-label="Simuler un match">🎮</button>
  <div id="simu"><b>Test : simuler un match récent</b>
    <label>Jeu <select id="smJeu"></select></label>
    <label>Contre <select id="smFille"></select></label>
    <label>Gagnant <select id="smGagne"><option value="fille">Elle a gagné</option><option value="rudy">Rudy a gagné</option></select></label>
    <button id="smOk">Noter le match</button></div>
  <button id="btnReglage" aria-label="Régler la place de Sophie">⚙</button>
  <div id="reglage">
    <b>Place de Sophie</b> — fais-la glisser avec le doigt.
    <label>Taille <input id="taille" type="range" min="35" max="80" step="0.5"></label>
    <div class="ligne"><span id="valeurs"></span><span><button id="reset">Remettre</button> <button id="finReglage">Terminé</button></span></div>
  </div>
</div>

<div id="tel" role="dialog" aria-label="Téléphone">
  <div class="coque"><div class="ecran">
    <div class="barre"><span id="heure">22:14</span><span>5G ▮▮▮ 82 %</span></div>
    <section class="vue on" id="vContacts">
      <button class="fermer" id="fermerTel">Fermer</button>
      <h2>Appels</h2>
      <div class="liste" id="liste"></div>
    </section>
    <section class="vue" id="vAppel">
      <div class="av grand" id="avAppel"></div>
      <div id="nomAppel"></div>
      <div id="etat">Appel…</div>
      <div id="fil"></div>
      <div id="choix"></div>
      <button id="raccrocher" aria-label="Raccrocher">✆</button>
    </section>
  </div></div>
</div>
<div id="toast"></div>
<div id="nuitV" style="position:fixed;inset:0;z-index:60;display:none;background:#000"><video id="nuitVid" playsinline style="width:100%;height:100%;object-fit:contain;background:#000"></video><button id="nuitFermer" style="position:fixed;z-index:61;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));padding:9px 15px;border-radius:999px;border:1.5px solid rgba(255,255,255,.6);background:rgba(0,0,0,.65);color:#fff;font:800 14px system-ui,sans-serif">✕ Fermer</button></div>
<iframe id="sortie" title="Balade sur le boulevard" allow="autoplay"></iframe>
<iframe id="resto" title="Dîner au RestoChic" allow="autoplay"></iframe>
<iframe id="homerun" title="Home Run" allow="autoplay"></iframe>
<iframe id="telV" title="Téléphone" allow="autoplay; camera; microphone"></iframe>
<button id="telFermer">✕ Fermer</button>

let mode='debout', litCle=null, litCouche=0, litIdle=null, litJeton=0;
const L1=$('lit1'), L2=$('lit2');
function cible(){ return mode==='lit'?(litCouche?L2:L1):img; }
function placeLit(el,cle){
  const d=LIT[ici].d.find(x=>x[0]===cle); const h=d[2]/600*34;          // 34 % de la hauteur pour la pose la plus haute
  el.style.height=h+'%'; el.style.width='auto';

function montreLit(cle){
  if(!LIT[ici]||cle===litCle) return; litCle=cle;
  const neuf=litCouche?L1:L2, vieux=litCouche?L2:L1; litCouche=1-litCouche;
  const jeton=++litJeton; neuf.src=LIT[ici].src[cle]; placeLit(neuf,cle);

  // on attend que la nouvelle pose soit dessinée : l'ancienne reste visible en attendant (pas de trou)
  if(neuf.decode) neuf.decode().then(bascule,bascule); else if(neuf.complete) bascule(); else neuf.onload=bascule;

function poseLit(n){

  if(!parle){   // pas de planche « parle / fâchée / bisou » (Ameline) : ses poses « elle parle » (t1-t4) et ses poses assises
    const cause=Object.keys(src).filter(k=>k[0]==='t'&&k!==litCle);
    const uneCause=()=>cause.length?cause[Math.floor(Math.random()*cause.length)]:(src.r7?'r7':reposAuHasard());
    if(n===4||n===5){ montreLit(src.r8?'r8':reposAuHasard()); return; }
    if(n===9||n===10||n===3||n===8){ montreLit(uneCause()); return; }
    if(n===7||n===1){ montreLit(src.r5?'r5':reposAuHasard()); return; }

  if(n===8||n===7||n===1){ montreLit(reposAuHasard()); return; }

function marqueVu(r){ const l=lireResultats(); l.forEach(x=>{ if(x.t===r.t&&x.fille===r.fille&&x.jeu===r.jeu) x.vu=true; }); try{ localStorage.setItem('rudy_resultats',JSON.stringify(l)); }catch(e){} }
function taquine(){
  const r=resultatRecent(ici); if(!r) return; marqueVu(r);
  const id=ici, elleAGagne=r.gagne==='fille';
  occupee=true; contact(); tait();
  const phrase=elleAGagne?MOQUE[id][r.jeu]:REVANCHE[id].replace('{jeu}',JEUX[r.jeu]);
  const bien=elleAGagne?["Haha, t'étais trop forte, j'avoue !","Ok, ok… je me suis fait avoir. Bien joué !","J'ai perdu, mais c'était trop drôle."]:["T'as super bien joué aussi, c'était serré.","T'inquiète, tu m'auras la prochaine fois.","Je me moque pas, t'étais forte."];
  const mal=elleAGagne?["T'as triché, c'est tout.","Arrête avec ça, ça m'énerve.","C'est un jeu nul de toute façon."]:["Avoue, je t'ai écrasée !","T'es trop nulle, c'était facile.","Tu devrais même plus rejouer contre moi."];
  const d=$('discu'); d.innerHTML='';
  const bq=document.createElement('div'); bq.className='question'; bq.innerHTML=`<span class="qui">${PERSO[id].nom}</span>`; bq.appendChild(document.createTextNode(phrase)); d.appendChild(bq);
  pose(elleAGagne?10:4);
  const bon=[bien[Math.floor(Math.random()*3)],true], mauvais=[mal[Math.floor(Math.random()*3)],false];
  (Math.random()<.5?[bon,mauvais]:[mauvais,bon]).forEach(([t,ok])=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=t;
    b.addEventListener('click',()=>{ d.style.display='none'; contact();
      if(ok){ humeur(8,3000); dit(elleAGagne?RIRE[id]:"C'est gentil… T'es un vrai gentleman, toi.",3000); gagne(id,4); }
      else{ humeur(5,3000); dit(elleAGagne?VEXE[id]:"Frimeur… Tu vas voir à la revanche.",3000); gagne(id,-6); }
      setTimeout(()=>{ occupee=false; },3000);
    });
    d.appendChild(b);
  });
  d.style.display='flex';
}
// pour le test : simuler un match (dans le vrai jeu, ce sont les mini-jeux qui notent le résultat)
function simuleMatch(){
  const l=lireResultats(); l.push({jeu:$('smJeu').value,fille:$('smFille').value,gagne:$('smGagne').value,t:Date.now()});
  try{ localStorage.setItem('rudy_resultats',JSON.stringify(l.slice(-30))); }catch(e){}
  $('simu').style.display='none'; toast('Match noté : '+PERSO[$('smFille').value].nom+' s\'en souviendra quand elle viendra.');
}
$('btnSimu').addEventListener('click',()=>{ const p=$('simu'); p.style.display=p.style.display==='flex'?'none':'flex'; });
$('smOk').addEventListener('click',simuleMatch);
(()=>{ const f=$('smFille'); ORDRE.forEach(id=>{ const o=document.createElement('option'); o.value=id; o.textContent=PERSO[id].nom; f.appendChild(o); });
  const j=$('smJeu'); Object.keys(JEUX).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=JEUX[k].replace(/^(au |à )/,''); j.appendChild(o); }); })();

/* ---------- Karine demande de l'argent (jamais plus de 100 €) ---------- */
let ARGENT=500; try{ const v=localStorage.getItem('test_argent'); if(v!=null) ARGENT=+v; }catch(e){}
let derniereDemande=0;
const DEMANDES=[
 ["Rudy… y'a une manette en édition limitée qui vient de sortir. Tu me l'offres ?",79],
 ["J'ai vu un jeu trop bien en promo… tu me le payes ?",45],
 ["Mes bottes sont usées… Une nouvelle paire, tu m'aides un peu ?",95],
 ["Il y a un skin exclusif dans mon jeu… s'il te plaît, s'il te plaît ?",20],
 ["Le tournoi de Kart Fury, c'est ce week-end… tu m'offres l'inscription ?",60],
 ["J'ai trouvé un sweat comme le tien… on serait assortis. Tu me l'achètes ?",55],
 ["Un casque gamer avec des oreilles de chat… trop mignon. Tu me le prends ?",89],
 ["Je meurs de faim… tu me paies des sushis ?",35]
];
const MERCI=[
 "Aaah, t'es le meilleur ! Viens là que je te fasse un énorme câlin…",
 "Mmh… un homme généreux, j'adore ça. Tu mérites un bisou… ou deux… ou dix.",
 "Tu sais comment faire fondre une fille, toi… Reste près de moi ce soir.",
 "T'es trop chou… Je crois que je vais plus te lâcher de la soirée 😘",
 "Rudy… tu me rends dingue quand tu fais ça. Approche un peu…"
];
function majArgent(){ $('argentTxt').textContent=ARGENT+' €'; try{ localStorage.setItem('test_argent',ARGENT); }catch(e){} }
function pluieDeCoeurs(){
  const sc=$('scene'), ir=cible().getBoundingClientRect(), sr=sc.getBoundingClientRect();
  const cx=ir.left-sr.left+ir.width/2, top=ir.top-sr.top+ir.height*.06;
  for(let i=0;i<18;i++){
    const c=document.createElement('div'); c.className='pluie'; c.textContent=['❤','💖','💕','💗'][i%4];
    c.style.left=(cx+(Math.random()-.5)*ir.width*.9)+'px'; c.style.top=(top+Math.random()*ir.height*.15)+'px';
    c.style.fontSize=(16+Math.random()*18)+'px'; c.style.animationDelay=(Math.random()*1.2)+'s';
    sc.appendChild(c); setTimeout(()=>c.remove(),3600);
  }
}
function demandeArgent(){
  derniereDemande=Date.now(); occupee=true; contact(); tait();
  const [texte,prix]=DEMANDES[Math.floor(Math.random()*DEMANDES.length)];
  const d=$('discu'); d.innerHTML='';
  const bq=document.createElement('div'); bq.className='question'; bq.innerHTML='<span class="qui">Karine</span>';
  bq.appendChild(document.createTextNode(texte+' Ça coûte '+prix+' €.')); d.appendChild(bq);
  const info=document.createElement('div'); info.className='cz'; info.textContent='Ton porte-monnaie : '+ARGENT+' €'; d.appendChild(info);
  pose(7);
  [['Oui, je te l’offre ('+prix+' €)','oui'],['Non','non']].forEach(([t,k])=>{
    const b=document.createElement('button'); b.className='opt '+(k==='oui'?'argOui':'argNon'); b.textContent=t;
    b.addEventListener('click',()=>{ d.style.display='none'; contact();
      if(k==='oui'&&ARGENT>=prix){
        ARGENT-=prix; majArgent(); gagne('karine',8); pose(3); pluieDeCoeurs();
        dit(MERCI[Math.floor(Math.random()*MERCI.length)],4200);
        setTimeout(()=>{ if(ici==='karine'){ humeur(7,2600); } occupee=false; },4200);
      }else{
        const t2=k==='oui'?"Tu n'as même pas "+prix+" € ? ":"";
        humeur(5,3600); dit(t2+"J'ai rien à faire avec quelqu'un comme toi qui ne peut même pas m'assumer !",3600); gagne('karine',-12);
        setTimeout(()=>depart(),3700);
      }
    });
    d.appendChild(b);
  });
  d.style.display='flex';
}

/* ---------- réglage : la déplacer au doigt ---------- */
let reglage=false, glisse=null;
$('btnReglage').addEventListener('click',()=>{ reglage=!reglage; $('reglage').style.display=reglage?'block':'none'; });
$('finReglage').addEventListener('click',()=>{ reglage=false; $('reglage').style.display='none'; });
$('reset').addEventListener('click',()=>{ place=Object.assign({},DEF); sauve(); appliquePlace(); });
$('taille').addEventListener('input',e=>{ place.h=+e.target.value; sauve(); appliquePlace(); });
function sauve(){ try{ localStorage.setItem('test_sophie_place',JSON.stringify(place)); }catch(e){} }
img.addEventListener('pointerdown',e=>{ if(!reglage) return; e.preventDefault(); img.setPointerCapture(e.pointerId);
  const sc=$('scene').getBoundingClientRect(); glisse={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:place.x,b:place.b,w:sc.width,h:sc.height}; });
img.addEventListener('pointermove',e=>{ if(!glisse||e.pointerId!==glisse.id) return;
  place.x=Math.max(0,Math.min(100,glisse.x+(e.clientX-glisse.sx)/glisse.w*100));
  place.b=Math.max(0,Math.min(60,glisse.b-(e.clientY-glisse.sy)/glisse.h*100)); appliquePlace(); });
['pointerup','pointercancel'].forEach(t=>img.addEventListener(t,()=>{ if(glisse){ glisse=null; sauve(); } }));
majCoeurs();

/* ====================================================================
   VISITE (dans l'appli) : la fille est chez Rudy.
   On reste dans la chambre (bureau, baie vitrée, lit). Pour sortir, on lui parle (« Sortir avec… » -> boulevard).
   Pour retourner seul dans la ville, il faut d'abord lui dire de partir.
   ==================================================================== */
function estFachee(id){ try{ const f=JSON.parse(localStorage.getItem('rudy_fache')||'{}'); return !!f[id]&&Date.now()-f[id]<30*60*1000; }catch(e){ return false; } }
(function(){
const DANS_APPLI=typeof Android!=='undefined';
const R='/assets/web/visite/';
// ---------- le cœur est celui du téléphone (Contacts) ----------
function lireS(){ try{ return JSON.parse(localStorage.getItem('rudyphone')||'{}')||{}; }catch(e){ return {}; } }
ORDRE.forEach(id=>{ const S=lireS(); COEUR[id]=(S.love&&S.love[id])||0; });
const gagneAvant=gagne;
gagne=function(id,n){
  const S=lireS(); COEUR[id]=(S.love&&S.love[id])||0;       // la valeur à jour (le téléphone a pu la changer)
  gagneAvant(id,n);
  const S2=lireS(); S2.love=S2.love||{}; S2.love[id]=COEUR[id];
  try{ localStorage.setItem('rudyphone',JSON.stringify(S2)); }catch(e){}
  if(n<=-8){ try{ const f=JSON.parse(localStorage.getItem('rudy_fache')||'{}'); f[id]=Date.now(); localStorage.setItem('rudy_fache',JSON.stringify(f)); }catch(e){} }
};
majCoeurs();
// ---------- l'argent : le vrai porte-monnaie de Rudy ----------
let argentConnu=null;
if(DANS_APPLI&&Android.argent){ try{ ARGENT=Android.argent(); argentConnu=ARGENT; }catch(e){} }
const majArgentAvant=majArgent;
majArgent=function(){
  if(DANS_APPLI&&Android.argent&&Android.ajouterArgent){
    try{ if(argentConnu!==null&&ARGENT!==argentConnu) Android.ajouterArgent(ARGENT-argentConnu); ARGENT=Android.argent(); argentConnu=ARGENT; }catch(e){}
  }
  majArgentAvant();
};
// ---------- la fille dans la VRAIE chambre ----------
// L'appli dessine la chambre (bureau, baie vitrée, lit) et nous dit où est chaque mur à l'écran.
let CAM={vue:-1,l:0,t:0,w:1,h:1};
const DEBOUT={fx:.60,fy:.925,hf:.56};     // debout sur le tapis, devant la baie vitrée
const SUR_LIT={fx:.42,fy:.76,hf:.30};     // sur le lit
window.camera=function(v,l,t,w,h){ CAM={vue:v,l:l,t:t,w:w,h:h}; placeTout(); };
function filleVisible(){ return !!ici&&((mode==='debout'&&CAM.vue===1)||(mode==='lit'&&CAM.vue===2)); }
appliquePlace=function(){
  if(!ici) return; const H=innerHeight, hr=(HR[ici]&&HR[ici][poseCourante-1])||1;
  img.style.left=(CAM.l+DEBOUT.fx*CAM.w)+'px'; img.style.bottom=(H-(CAM.t+DEBOUT.fy*CAM.h))+'px';
  img.style.height=(DEBOUT.hf*CAM.h*hr)+'px';
  img.style.visibility=(mode==='debout'&&CAM.vue===1)?'visible':'hidden';
};
placeLit=function(el,cle){
  const d=LIT[ici]&&LIT[ici].d.find(x=>x[0]===cle); if(!d) return; el.dataset.cle=cle; const H=innerHeight;
  el.style.left=(CAM.l+SUR_LIT.fx*CAM.w)+'px'; el.style.bottom=(H-(CAM.t+SUR_LIT.fy*CAM.h))+'px';
  el.style.height=(d[2]/600*SUR_LIT.hf*CAM.h)+'px'; el.style.width='auto';
};
function placeTout(){
  if(!ici) return;
  appliquePlace();
  [L1,L2].forEach(el=>{ if(el.dataset.cle) placeLit(el,el.dataset.cle); el.style.visibility=(mode==='lit'&&CAM.vue===2)?'visible':'hidden'; });
  $('coeur').style.display='flex';
}
addEventListener('resize',placeTout);
function regarder(mur,fx){ try{ if(DANS_APPLI&&Android.regarder) Android.regarder(mur,fx); }catch(e){} }
// ---------- les zones qu'on peut toucher : le reste passe à la chambre (bureau, consoles, tiroirs…) ----------
let zonesTxt='', zonesT=0;
function rectDe(el){ if(!el) return null; const cs=getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden'||+cs.opacity<0.05) return null;
  const r=el.getBoundingClientRect(); if(r.width<2||r.height<2) return null; return [r.left,r.top,r.right,r.bottom].map(Math.round); }
setInterval(()=>{
  const z=[]; const plein=['sortie','resto','nuitV','homerun'].some(i=>$(i).style.display==='block');
  if(plein) z.push([0,0,innerWidth,innerHeight]);
  else [img,(mode==='lit'?(litCouche?L2:L1):null),$('menu'),$('discu')].forEach(e=>{ const r=rectDe(e); if(r) z.push(r); });
  const t=JSON.stringify(z); if(t!==zonesTxt||Date.now()-zonesT>1000){ zonesTxt=t; zonesT=Date.now(); try{ if(DANS_APPLI&&Android.zones) Android.zones(t); }catch(e){} }   // redit chaque seconde : l'appli sait que la page est vivante
},150);
// ---------- quand l'appli est en pause (un jeu, un émulateur) : elle attend sans compter le temps ----------
window.enPause=function(p){ window.PAUSE=!!p; if(!p){ try{ contact(); }catch(e){} } };
// ---------- elle arrive : la chambre se tourne vers la baie vitrée ; elle s'assoit : vers le lit ----------
let attenteArrivee=0;
const arriveeAvant=arrivee; arrivee=function(id){ attenteArrivee=Date.now(); arriveeAvant(id); regarder(1,DEBOUT.fx); try{ localStorage.setItem('rudy_visite_ici',id); }catch(e){} setTimeout(placeTout,950); };
const asseoirAvant=asseoir; asseoir=function(){ asseoirAvant(); let n=0; const t=setInterval(()=>{ if(mode==='lit'){ clearInterval(t); regarder(2,SUR_LIT.fx); placeTout(); } else if(++n>40) clearInterval(t); },100); };
const quitteLitAvant=quitteLit; quitteLit=function(a,b){ quitteLitAvant(a,b); if(!b) setTimeout(()=>{ regarder(1,DEBOUT.fx); placeTout(); },460); };
// ---------- sa bulle : si on ne la voit pas (on regarde ailleurs), elle parle quand même, en haut de l'écran ----------
const ditAvant=dit;
dit=function(t,ms){ ditAvant(t,ms); if(!filleVisible()){ const b=$('bulle'); b.style.left=Math.max(6,(innerWidth-b.offsetWidth)/2)+'px'; b.style.top=(innerHeight*.11)+'px'; } };
// ---------- quand elle part : Rudy se retrouve seul, la chambre redevient normale ----------
function finVisite(){ try{ localStorage.removeItem('rudy_visite_ici'); }catch(e){} if(DANS_APPLI&&Android.finVisite) Android.finVisite(); else toast('Elle est partie.'); }
const departAvant=depart;
depart=function(apres){ departAvant(apres); const t0=Date.now(); const verif=()=>{ if(ici) return; const attend=apres||Date.now()-attenteArrivee<4500; if(attend&&Date.now()-t0<12000){ setTimeout(verif,700); return; } finVisite(); }; setTimeout(verif,2600); };
// ---------- sortir en ville : impossible tant qu'elle est là ----------
window.retourDemande=function(){
  if(!ici){ finVisite(); return; }
  if(enBalade) return;
  dit(["Tu comptes partir en me laissant là ?","Hé ! Je suis encore là, moi !","Tu vas où comme ça ?"][Math.floor(Math.random()*3)],2600);
  toast(`Pour sortir, parle à ${PERSO[ici].nom} : « Sortir avec elle » ou « Laisser rentrer chez elle ».`,3200);
};
// ---------- une autre fille a dit « oui » au téléphone pendant qu'une est là ----------
window.nouvelleVisite=function(id){
  if(id===ici) return;
  if(enBalade){ const r=()=>{ if(enBalade) setTimeout(r,800); else window.nouvelleVisite(id); }; setTimeout(r,800); return; }
  if(!PERSO[id]){ toast("Elle ne peut pas venir pour l'instant."); return; }
  if(ici&&mode==='lit') quitteLit(null,true);
  if(ici){ humeur(10,2600); dit("Tu appelles qui, là ?",2400); }
  setTimeout(()=>arrivee(id),ici?2500:200);
};
// ---------- les balades et le resto viennent des fichiers de l'appli ----------
let baseBalade=null, baseResto=null;
fetch(R+'boulevard.html').then(r=>r.text()).then(t=>{ baseBalade=t; }).catch(()=>{});
const partirAvant=partirEnBalade;
partirEnBalade=function(id){
  if(baseBalade===null){ toast('Un instant…'); setTimeout(()=>partirEnBalade(id),600); return; }
  BALADE_BASE=baseBalade; partirAvant(id);
  try{ if(DANS_APPLI&&Android.radio) Android.radio(false); }catch(e){}     // la radio de la chambre se tait : le boulevard a sa musique
};
/* (la radio revient à la fin de la vidéo du retour, pas avant) */
window.chargeResto=function(){ return baseResto?Promise.resolve(baseResto):fetch(R+'resto.html').then(r=>r.text()).then(t=>(baseResto=t)); };
// ---------- ce qui ne sert qu'au test ----------
['btnSimu','btnReglage'].forEach(i=>{ const e=$(i); if(e) e.style.display='none'; });
// ---------- elle arrive ----------
const q=new URLSearchParams(location.search).get('fille');
if(q&&PERSO[q]) setTimeout(()=>arrivee(q),300); else setTimeout(finVisite,300);
})();

</script>
