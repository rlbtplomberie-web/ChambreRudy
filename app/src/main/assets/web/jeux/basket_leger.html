.wind{transform-origin:center;will-change:transform;animation:sway 3.2s ease-in-out infinite alternate}
.z1,.z3,.z5,.z8,.z10{animation-duration:3.8s;animation-delay:-1.1s}
.z2,.z6,.z9,.z11{animation-duration:4.4s;animation-delay:-2s}
@keyframes sway{
0%{transform:translate(-1px,0) rotate(-.18deg) scale(1.002)}
50%{transform:translate(2px,-1px) rotate(.16deg) scale(1.004)}
100%{transform:translate(-1px,1px) rotate(-.10deg) scale(1.002)}
}
/* Feuilles proches de la caméra */
.leaf{position:absolute;z-index:5;width:12px;height:7px;border-radius:100% 0 100% 0;background:#7b6b2c;opacity:0;
filter:blur(.25px);animation:fly linear infinite;pointer-events:none}
.leaf.big{width:18px;height:10px;filter:blur(.8px)}
@keyframes fly{
0%{transform:translate(-12vw,-8vh) rotate(0deg);opacity:0}
10%{opacity:.75}
55%{transform:translate(48vw,38vh) rotate(420deg);opacity:.85}
100%{transform:translate(112vw,76vh) rotate(900deg);opacity:0}
}
.l1{left:-8%;top:8%;animation-duration:8s}
.l2{left:-12%;top:25%;animation-duration:10s;animation-delay:-4s}
.l3{left:-10%;top:50%;animation-duration:9s;animation-delay:-6s}
.l4{left:-15%;top:5%;animation-duration:12s;animation-delay:-8s}
.l5{left:-8%;top:62%;animation-duration:11s;animation-delay:-2s}
/* très léger scintillement des lampes, sans déplacer les poteaux */
.glow{position:absolute;left:5.7%;top:6.2%;width:11%;height:19%;border-radius:50%;
background:radial-gradient(ellipse,#ffd89030,transparent 68%);animation:glow 2.8s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{from{opacity:.55;transform:scale(.98)}to{opacity:.9;transform:scale(1.04)}}
</style>
<style>
#gamePlayer{
 position:absolute; z-index:20; left:29%; bottom:7%;
 width:28%; height:78%; pointer-events:none;
}
#gamePlayer canvas{width:100%;height:100%;display:block;object-fit:contain}
#shotBall{
 position:absolute; z-index:22; border-radius:50%; display:none; pointer-events:none;
 background:radial-gradient(circle at 34% 27%,#ffbd62 0 6%,#f28a24 22%,#c8580d 65%,#7a2d05 100%);
 box-shadow:inset -7px -8px 10px rgba(60,20,0,.7),inset 4px 4px 7px rgba(255,210,120,.7),0 2px 5px #000;
}
#shotBall:before,#shotBall:after{content:"";position:absolute;inset:0;border-radius:50%}
#shotBall:before{background:linear-gradient(90deg,transparent 47%,#2c1608 48% 52%,transparent 53%),linear-gradient(0deg,transparent 47%,#2c1608 48% 52%,transparent 53%)}
#shotBall:after{border-left:2px solid #2c1608;border-right:2px solid #2c1608;transform:rotate(38deg) scaleX(.55)}
#shootBtn{
 position:absolute;z-index:40;right:4%;bottom:6%;width:104px;height:104px;border-radius:50%;
 border:4px solid #ffffffcc;background:#b51f28;color:#fff;font:900 22px Arial,sans-serif;
 box-shadow:0 5px 15px #0009,inset 0 0 0 4px #6d0d14;touch-action:manipulation
}
#shootBtn:active{transform:scale(.92)}
</style>

<style>
/* Panier réaliste intégré au décor : cercle orange + filet blanc en cordage */
#basketNet{
 position:absolute;z-index:16;
 right:8.7%;top:30.5%;
 width:8.5%;height:15%;
 pointer-events:none;
 transform-origin:50% 0%;
 /* ombre douce seulement, pour épouser le décor nocturne */
 filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.48));
}
#basketNet .rim{
 position:absolute;left:1%;top:0;width:98%;height:11%;
 box-sizing:border-box;
 border:3.2px solid #e65b13;
 border-radius:50%;
 background:rgba(122,40,6,.10);
 box-shadow:
   inset 0 1px 0 rgba(255,185,105,.68),
   inset 0 -1.5px 0 rgba(86,22,0,.65),
   0 1.5px 1.5px rgba(0,0,0,.55);
}
#basketNet .rim:before{
 content:"";position:absolute;right:-8%;top:34%;
 width:12%;height:32%;border-radius:2px;
 background:linear-gradient(180deg,#e56a20,#a63b0c);
 box-shadow:0 1px 1px rgba(0,0,0,.55);
}
#basketNet .mesh{
 position:absolute;left:10%;top:7%;width:80%;height:90%;
 clip-path:polygon(2% 0,98% 0,82% 27%,72% 100%,28% 100%,18% 27%);
 transform-origin:50% 0%;
 /* mailles blanches plus fines et serrées */
 background:
  repeating-linear-gradient(66deg,
    transparent 0 6.2px,
    rgba(255,255,255,.98) 6.3px 7.45px,
    rgba(185,190,195,.50) 7.55px 7.9px,
    transparent 8px 13.2px),
  repeating-linear-gradient(-66deg,
    transparent 0 6.2px,
    rgba(255,255,255,.98) 6.3px 7.45px,
    rgba(185,190,195,.50) 7.55px 7.9px,
    transparent 8px 13.2px);
 filter:drop-shadow(.45px .7px .35px rgba(0,0,0,.65));
}
#basketNet .mesh:before{
 content:"";position:absolute;left:1%;right:1%;top:0;height:9%;
 border-top:1.7px solid rgba(255,255,255,.98);
 border-radius:50%;
 box-shadow:0 1px .4px rgba(0,0,0,.35);
}
#basketNet .mesh:after{
 content:"";position:absolute;left:25%;right:25%;bottom:0;height:5%;
 border-bottom:1.6px solid rgba(255,255,255,.96);
 border-radius:50%;
}
#basketNet.swish .mesh{animation:netSwish .62s ease-out}
@keyframes netSwish{
 0%{transform:translateY(0) scaleX(1)}
 18%{transform:translateY(8%) scaleX(.68) skewX(7deg)}
 38%{transform:translateY(18%) scaleX(1.18) skewX(-8deg)}
 58%{transform:translateY(7%) scaleX(.82) skewX(5deg)}
 78%{transform:translateY(2%) scaleX(1.08) skewX(-3deg)}
 100%{transform:translateY(0) scaleX(1)}
}
#flightBall{
 position:absolute; z-index:25; display:none; border-radius:50%; width:3.2%; aspect-ratio:1;
 background:radial-gradient(circle at 34% 27%,#ffbd62 0 6%,#f28a24 22%,#c8580d 65%,#7a2d05 100%);
 box-shadow:inset -3px -4px 5px #3b1208aa,0 2px 4px #0009;
 pointer-events:none;
}
</style>

<style>

}

let audioCtx=null;
function audio(){
 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended') audioCtx.resume();
 return audioCtx;
}
function basketBounce(){
 const a=audio(), t=a.currentTime;
 const osc=a.createOscillator(), gain=a.createGain();
 osc.type='sine'; osc.frequency.setValueAtTime(115,t); osc.frequency.exponentialRampToValueAtTime(48,t+.10);
 gain.gain.setValueAtTime(.0001,t); gain.gain.exponentialRampToValueAtTime(.75,t+.006);
 gain.gain.exponentialRampToValueAtTime(.0001,t+.13);
 osc.connect(gain).connect(a.destination); osc.start(t); osc.stop(t+.14);
 const n=a.createBufferSource(), ng=a.createGain(), f=a.createBiquadFilter();
 const b=a.createBuffer(1,a.sampleRate*.055,a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
 n.buffer=b; f.type='lowpass'; f.frequency.value=900;
 ng.gain.setValueAtTime(.32,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.055);
 n.connect(f).connect(ng).connect(a.destination); n.start(t);
}
function sneakerSqueak(delay=0, pitch=1750, duration=.12, volume=.34){
 const a=audio(),t=a.currentTime+delay;
 const n=a.createBufferSource(),g=a.createGain(),bp=a.createBiquadFilter();
 const len=Math.floor(a.sampleRate*duration);
 const b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<len;i++){
   const e=Math.sin(Math.PI*i/len);
   d[i]=(Math.random()*2-1)*e;
 }
 n.buffer=b;
 bp.type='bandpass'; bp.Q.value=7;
 bp.frequency.setValueAtTime(pitch,t);
 bp.frequency.exponentialRampToValueAtTime(Math.max(650,pitch*.48),t+duration);
 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(volume,t+.012);
 g.gain.exponentialRampToValueAtTime(.0001,t+duration);
 n.connect(bp).connect(g).connect(a.destination);
 n.start(t); n.stop(t+duration+.02);
}
function basketShot(){
 // Crissements de semelles : appui puis poussée au départ du tir.
 sneakerSqueak(0,1900,.11,.30);
 sneakerSqueak(.075,1450,.15,.38);
}

function drawTransparent(src){
 const im=new Image();
 im.onload=()=>{
   const tmp=document.createElement('canvas');
   tmp.width=im.naturalWidth; tmp.height=im.naturalHeight;
   const tc=tmp.getContext('2d',{willReadFrequently:true});
   tc.drawImage(im,0,0);
   const id=tc.getImageData(0,0,tmp.width,tmp.height),d=id.data;
   const W=tmp.width,H=tmp.height;
 const bg=new Uint8Array(W*H);
 const q=new Int32Array(W*H);
 let head=0,tail=0;
 function blackBg(n){
   const i=n*4,r=d[i],g=d[i+1],b=d[i+2];
   const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
   return mx<=18 && (mx-mn)<=10;
 }
 function add(n){
   if(n<0||n>=W*H||bg[n]||!blackBg(n))return;
   bg[n]=1;q[tail++]=n;
 }
 for(let x=0;x<W;x++){add(x);add((H-1)*W+x)}
 for(let y=0;y<H;y++){add(y*W);add(y*W+W-1)}
 while(head<tail){
   const n=q[head++],x=n%W,y=(n/W)|0;
   if(x>0)add(n-1);if(x<W-1)add(n+1);
   if(y>0)add(n-W);if(y<H-1)add(n+W);
 }
 for(let n=0;n<W*H;n++){
   // Seulement le fond extérieur est transparent.
   // Absolument tout le personnage, tête aux pieds, est opaque.
   d[n*4+3]=bg[n]?0:255;
 }
   tc.putImageData(id,0,0);

   ctx.clearRect(0,0,CW,CH);
   // Même échelle logique pour le dribble et le tir.
   // Aucun étirement : on conserve le rapport largeur/hauteur de chaque image.
   // Une seule hauteur de personnage pour TOUTES les images.
   // Ainsi le passage dribble -> tir ne change plus sa taille.
   const targetH=CH*.94;
   const scale=targetH/tmp.height;
   const w=tmp.width*scale,h=targetH;
   const x=(CW-w)/2;
   const y=CH-h-8;
   ctx.drawImage(tmp,x,y,w,h);
 };
 im.src=src;
}
function showBall(frame){
 if(frame<4){
   const q=shotBall[frame];
   ball.style.display='block';
   ball.style.left=q.x+'%'; ball.style.top=q.y+'%';
   ball.style.width=q.size+'%'; ball.style.aspectRatio='1';
   ball.style.transform='translate(-50%,-50%)';
 }else ball.style.display='none';
}
function dribble(){
 if(mode!=='dribble')return;
 ball.style.display='none';
 const frameIndex=dseq[di];
 drawTransparent(dribbleFrames[frameIndex]);
 if(frameIndex===3) basketBounce();
 di++;
 if(di>=dseq.length){
   di=0;
   drawTransparent(dribbleFrames[7]);
   timer=setTimeout(()=>{if(mode==='dribble'){drawTransparent(dribbleFrames[0]);timer=setTimeout(dribble,85)}},2000);
 } else timer=setTimeout(dribble,85);
}
function shoot(){
 if(window.gameCanShoot && !window.gameCanShoot()) return;
 if(window.gameBeginShot) window.gameBeginShot();
 audio();
 clearTimeout(timer); mode='shoot'; locked=true; btn.disabled=true; si=0;
 basketShot();
 function next(){
   drawTransparent(shootFrames[si]); showBall(si);
   si++;
   if(si<shootFrames.length){timer=setTimeout(next,120)}
   else{
     ball.style.display='none';
     timer=setTimeout(()=>{
       mode='dribble';locked=false;btn.disabled=false;di=0;dribble();
     },350);
   }
 }
 next();
}
/* Tir contrôlé par la jauge d'appui ajoutée plus bas. */
dribble();
</script>

<script id="positionThenShootGame">
(function(){
 const btn=document.getElementById('shootBtn'),fit=document.getElementById('fit');
 const wrap=document.getElementById('powerWrap'),needle=document.getElementById('powerNeedle');
 const label=document.getElementById('powerLabel');
 const tryN=document.getElementById('tryN'),scoreN=document.getElementById('scoreN');
 const msg=document.getElementById('gameMessage'),panel=document.getElementById('endPanel');
 const title=document.getElementById('endTitle'),text=document.getElementById('endText');
 const replay=document.getElementById('replayBtn');
 let attempts=0,score=0,finished=false,aiming=false,raf=0;
 let pos=0,dir=1,last=0,shotType='green';

 btn.textContent='POSITION';

 function update(){tryN.textContent=attempts;scoreN.textContent=score}
 function flash(t){msg.textContent=t;msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),950)}
 function finish(){
   finished=true;btn.disabled=true;
   title.textContent=score>=7?'GAGNÉ ! 🏀':'PERDU';
   text.textContent=score>=7?`Tu as marqué ${score} paniers en ${attempts} lancers.`:
   `Tu as marqué ${score} paniers. Il fallait en marquer 7 sur 10.`;
   if(score<7){panel.style.display='none';setTimeout(()=>playDefeatInPlayerPlace(),650);}
 }
 function tick(now){
   if(!aiming)return;
   if(!last)last=now;
   const dt=Math.min(40,now-last);last=now;
   pos+=dir*(dt/1200)*100;
   if(pos>=100){pos=100;dir=-1}
   if(pos<=0){pos=0;dir=1}
   needle.style.left=pos+'%';
   raf=requestAnimationFrame(tick);
 }

 const gaugeConfigs=[
  {g:50,gs:8,o:9,lr:15},   // 1 centre
  {g:25,gs:8,o:9,lr:15},   // 2 gauche
  {g:90,gs:7,o:8,lr:14},   // 3 extrême droite
  {g:50,gs:4,o:7,lr:13},   // 4 centre, vert plus petit
  {g:70,gs:9,o:7,lr:13},   // 5 droite, vert plus large
  {g:10,gs:6,o:8,lr:14},   // 6 extrême gauche
  {g:38,gs:5,o:6,lr:12},   // 7 gauche, difficile
  {g:62,gs:7,o:10,lr:12},  // 8 droite
  {g:80,gs:4,o:6,lr:11},   // 9 droite, très petit
  {g:50,gs:3,o:5,lr:10}    // 10 centre, minuscule
 ];
 let activeGauge=gaugeConfigs[0];

 function setGaugeForShot(index){
   activeGauge=gaugeConfigs[Math.max(0,Math.min(gaugeConfigs.length-1,index))];
   const q=activeGauge,b=document.getElementById('powerBar');
   const a=Math.max(0,q.g-q.gs/2),z=Math.min(100,q.g+q.gs/2);
   const o1=Math.max(0,a-q.o),o2=Math.min(100,z+q.o);
   const r1=Math.max(0,o1-q.lr),r2=Math.min(100,o2+q.lr);
   b.style.background=`linear-gradient(90deg,
    #760000 0%,#760000 ${r1}%,
    #e13b2d ${r1}%,#e13b2d ${o1}%,
    #ef8a16 ${o1}%,#ef8a16 ${a}%,
    #27b84a ${a}%,#27b84a ${z}%,
    #ef8a16 ${z}%,#ef8a16 ${o2}%,
    #e13b2d ${o2}%,#e13b2d ${r2}%,
    #760000 ${r2}%,#760000 100%)`;
 }

 function classify(p){
   const q=activeGauge,d=Math.abs(p-q.g);
   if(d<=q.gs/2)return 'green';
   if(d<=q.gs/2+q.o)return 'orange';
   if(d<=q.gs/2+q.o+q.lr)return 'lightred';
   return 'darkred';
 }
 function startAim(){
   if(finished||locked||attempts>=10)return;
   setGaugeForShot(attempts);
   aiming=true;pos=0;dir=1;last=0;
   wrap.style.display='block';needle.style.left='0%';
   label.textContent='APPUIE SUR TIR';
   btn.textContent='TIR';
   raf=requestAnimationFrame(tick);
 }
 function fire(){
   if(!aiming||finished||locked)return;
   aiming=false;cancelAnimationFrame(raf);
   shotType=classify(pos);attempts++;
   if(shotType==='green'||shotType==='orange'){
   score++;
   if(score===7){
     setTimeout(()=>playVictoryInPlayerPlace(),1050);
   }
 }
   update();
   btn.textContent='POSITION';
   setTimeout(()=>wrap.style.display='none',260);
   shoot();
   setTimeout(()=>{
     flash(shotType==='green'?'PARFAIT — PANIER !':
           shotType==='orange'?'CERCEAU — PANIER !':
           shotType==='lightred'?'CERCEAU — RATÉ !':'TROP COURT !');
     if(attempts>=10)setTimeout(finish,650);
   },950);
 }
 btn.addEventListener('click',e=>{
   e.preventDefault();
   if(!aiming)startAim(); else fire();
 });

 function startPoint(){
   let s={x:44,y:35};
   try{Object.assign(s,JSON.parse(localStorage.getItem('basketBallStartV1'))||{})}catch(_){}
   return s;
 }
 function targetPoint(){
   const fr=fit.getBoundingClientRect(),nr=document.getElementById('basketNet').getBoundingClientRect();
   return {x:((nr.left+nr.width*.5)-fr.left)/fr.width*100,y:((nr.top+nr.height*.08)-fr.top)/fr.height*100};
 }
 function flyTo(tx,ty,after,arcH=24,dur=760){
   const b=document.getElementById('flightBall'),s=startPoint(),st=performance.now();b.style.display='block';
   function f(now){
     const p=Math.min(1,(now-st)/dur);
     b.style.left=(s.x+(tx-s.x)*p)+'%';
     b.style.top=(s.y+(ty-s.y)*p-arcH*4*p*(1-p))+'%';
     b.style.transform='translate(-50%,-50%)';
     if(p<1)requestAnimationFrame(f);else after&&after(b,tx,ty);
   }requestAnimationFrame(f);
 }
 function fallAway(b,x,y,dx){
   const st=performance.now();
   function f(now){
     const p=Math.min(1,(now-st)/430);
     b.style.left=(x+dx*9*p)+'%';b.style.top=(y+25*p+10*p*p)+'%';
     if(p<1)requestAnimationFrame(f);else b.style.display='none';
   }requestAnimationFrame(f);
 }
 function swishDrop(b,x,y){
   const net=document.getElementById('basketNet');
   net.classList.remove('swish');void net.offsetWidth;net.classList.add('swish');
   const st=performance.now();
   function f(now){
     const p=Math.min(1,(now-st)/300);
     b.style.top=(y+11*p)+'%';b.style.transform=`translate(-50%,-50%) scale(${1-.18*p})`;
     if(p<1)requestAnimationFrame(f);else setTimeout(()=>b.style.display='none',70);
   }requestAnimationFrame(f);
 }

 function rimSound(){
   const a=audio(),t=a.currentTime;

   // Impact court et sec d'un ballon sur un cercle de basket :
   // mélange d'un "clang" métallique bref + choc mat du ballon.
   const metal=a.createOscillator(),mg=a.createGain(),band=a.createBiquadFilter();
   metal.type='sine';
   metal.frequency.setValueAtTime(285,t);
   metal.frequency.exponentialRampToValueAtTime(205,t+.075);
   band.type='bandpass';band.frequency.value=1050;band.Q.value=2.1;
   mg.gain.setValueAtTime(.0001,t);
   mg.gain.exponentialRampToValueAtTime(.24,t+.003);
   mg.gain.exponentialRampToValueAtTime(.035,t+.045);
   mg.gain.exponentialRampToValueAtTime(.0001,t+.14);
   metal.connect(band).connect(mg).connect(a.destination);
   metal.start(t);metal.stop(t+.15);

   // Résonance très courte du cercle, sans effet "barre de fer".
   const ring=a.createOscillator(),rg=a.createGain();
   ring.type='sine';ring.frequency.setValueAtTime(690,t);
   ring.frequency.exponentialRampToValueAtTime(570,t+.09);
   rg.gain.setValueAtTime(.11,t);
   rg.gain.exponentialRampToValueAtTime(.0001,t+.11);
   ring.connect(rg).connect(a.destination);ring.start(t);ring.stop(t+.12);

   // Choc caoutchouc du ballon.
   const len=Math.floor(a.sampleRate*.075),buf=a.createBuffer(1,len,a.sampleRate);
   const d=buf.getChannelData(0);
   for(let i=0;i<len;i++){
     const p=i/len;
     d[i]=(Math.random()*2-1)*Math.pow(1-p,3);
   }
   const n=a.createBufferSource(),lp=a.createBiquadFilter(),ng=a.createGain();
   n.buffer=buf;lp.type='lowpass';lp.frequency.value=520;
   ng.gain.setValueAtTime(.18,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.075);
   n.connect(lp).connect(ng).connect(a.destination);n.start(t);
 }
 function netSound(){
   const a=audio(),t=a.currentTime,len=Math.floor(a.sampleRate*.20);
   const b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
   for(let i=0;i<len;i++){const p=i/len;d[i]=(Math.random()*2-1)*(1-p)*.42}
   const n=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();
   n.buffer=b;bp.type='bandpass';bp.frequency.value=2200;bp.Q.value=.8;
   g.gain.setValueAtTime(.20,t);g.gain.exponentialRampToValueAtTime(.0001,t+.20);
   n.connect(bp).connect(g).connect(a.destination);n.start(t);
 }
 window.launchMeterShot=function(){
   const t=targetPoint(),side=pos<50?-1:1;
   if(shotType==='green'){
     // Green: clean swish, no rim sound.
     flyTo(t.x,t.y,(b,x,y)=>{netSound();swishDrop(b,x,y)},25,780);
   }else if(shotType==='orange'){
     // Orange: rim contact, small rebound toward player, then rolls/drops in.
     flyTo(t.x+side*1.15,t.y,(b,x,y)=>{
       rimSound();
       const st=performance.now();
       function bounce(now){
         const p=Math.min(1,(now-st)/220);
         // first comes slightly back toward the shooter, then returns over the hoop
         const back=Math.sin(Math.PI*p)*3.0;
         b.style.left=(x-side*1.15*p-back)+'%';
         b.style.top=(y-3.0*Math.sin(Math.PI*p)+1.0*p)+'%';
         if(p<1)requestAnimationFrame(bounce);
         else{netSound();swishDrop(b,t.x,t.y+1)}
       }requestAnimationFrame(bounce);
     },24,780);
   }else if(shotType==='lightred'){
     // Light red: hits rim, visibly rebounds back toward the shooter and falls out.
     flyTo(t.x+side*1.3,t.y,(b,x,y)=>{
       rimSound();
       const st=performance.now();
       function rebound(now){
         const p=Math.min(1,(now-st)/520);
         // strong backward motion: toward the player (left), plus outward side error
         b.style.left=(x-13*p+side*3*p)+'%';
         b.style.top=(y-7*Math.sin(Math.PI*p)+19*p+8*p*p)+'%';
         b.style.transform=`translate(-50%,-50%) rotate(${side*240*p}deg)`;
         if(p<1)requestAnimationFrame(rebound);else b.style.display='none';
       }requestAnimationFrame(rebound);
     },23,760);
   }else{
     // Dark red: too short, never reaches rim, so no rim/net sound.
     flyTo(t.x+side*17,t.y+10,(b,x,y)=>fallAway(b,x,y,side*.35),17,650);
   }
 };
 replay.addEventListener('click',()=>{
   attempts=0;score=0;finished=false;aiming=false;pos=0;dir=1;setGaugeForShot(0);update();
   panel.style.display='none';btn.disabled=false;btn.textContent='POSITION';wrap.style.display='none';
   flash('Appuie sur POSITION pour lancer la jauge');
 });
 setGaugeForShot(0);update();setTimeout(()=>flash('Appuie sur POSITION pour lancer la jauge'),300);
})();

 const normal=document.getElementById('gamePlayer');
 const v=document.getElementById('victoryPlayer');
 const fit=document.getElementById('fit');
 const fr=fit.getBoundingClientRect(), pr=normal.getBoundingClientRect();
 v.style.left=((pr.left-fr.left)/fr.width*100)+'%';
 v.style.top=((pr.top-fr.top)/fr.height*100)+'%';
 v.style.width=(pr.width/fr.width*100)+'%';
 v.style.height=(pr.height/fr.height*100)+'%';
 v.style.transform='scale(.88)';
 v.style.transformOrigin='center bottom';
 v.style.display='block';
 document.body.classList.add('victory-mode');
 let i=0;v.src=victoryFrames[0];
 function next(){
   if(i<victoryFrames.length-1){
     i++;v.src=victoryFrames[i];setTimeout(next,125);
   }
 }
 setTimeout(next,125);
}

function playDefeatInPlayerPlace(){
 const normal=document.getElementById('gamePlayer'),v=document.getElementById('defeatPlayer');
 const fit=document.getElementById('fit'),fr=fit.getBoundingClientRect(),pr=normal.getBoundingClientRect();
 v.style.left=((pr.left-fr.left)/fr.width*100)+'%';
 v.style.top=((pr.top-fr.top)/fr.height*100)+'%';
 v.style.width=(pr.width/fr.width*100)+'%';
 v.style.height=(pr.height/fr.height*100)+'%';
 v.style.display='block';document.body.classList.add('defeat-mode');
 let i=0;v.src=defeatFrames[0];
 function next(){if(i<defeatFrames.length-1){i++;v.src=defeatFrames[i];setTimeout(next,170)}}
 setTimeout(next,170);
}
</script>

<script id="nativeLandscapeLock">
(function(){
 async function lockLandscape(){
   try{
     if(document.documentElement.requestFullscreen && !document.fullscreenElement){
       await document.documentElement.requestFullscreen();
     }
   }catch(e){}
   try{
     if(screen.orientation && screen.orientation.lock){
       await screen.orientation.lock('landscape');
     }
   }catch(e){}
 }
 // Android exige souvent une interaction utilisateur pour le verrouillage.
 document.addEventListener('click',lockLandscape,{once:true});
 document.addEventListener('touchend',lockLandscape,{once:true});
})();
</script>

<script id="startScreenLogic">
(function(){
 const s=document.getElementById('startScreen'),b=document.getElementById('startGameBtn');
 if(!s||!b)return;
 b.addEventListener('click',async()=>{
   try{
     if(document.documentElement.requestFullscreen&&!document.fullscreenElement)
       await document.documentElement.requestFullscreen();
   }catch(e){}
   try{
     if(screen.orientation&&screen.orientation.lock)
       await screen.orientation.lock('landscape');
   }catch(e){}
   s.style.display='none';
 });
})();
</script>
