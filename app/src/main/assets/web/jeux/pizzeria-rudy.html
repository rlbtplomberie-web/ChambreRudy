<!DOCTYPE html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizzeria Rudy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
/* Une seule scène au format de la cuisine (portrait), centrée ; tout l'affichage du jeu est posé dessus.
   Univers : tomate, basilic, crème, croûte dorée — un seul thème assumé (jeu). */
:root{
  --fond:#1d120c; --creme:#fff3dc; --tomate:#d8452b; --tomate-f:#a72d18;
  --basilic:#3f8a4a; --croute:#e9b25f; --encre:#2b1a10; --ombre:rgba(20,10,4,.55);
  --f-titre:"Lilita One","Arial Black",system-ui,sans-serif;
  --f-texte:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{margin:0;background:var(--fond);color:var(--creme);font-family:var(--f-texte);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));}
#cadre{position:fixed;inset:0;display:grid;place-items:center;}
#scene{position:relative;overflow:hidden;--u:4px;font-size:calc(var(--u)*4);}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

/* ---- Haut : consigne + ticket ---- */
#haut{position:absolute;left:0;right:0;top:0;padding:calc(var(--u)*3);display:flex;gap:calc(var(--u)*2);align-items:flex-start;pointer-events:none;}
#consigne{flex:1;min-width:0;background:var(--ombre);border-radius:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*3);
  backdrop-filter:blur(3px);border:1px solid rgba(255,243,220,.18);}
#consigne b{display:block;font-family:var(--f-titre);font-weight:400;font-size:1.25em;letter-spacing:.02em;color:var(--croute);}
#consigne span{font-size:.92em;line-height:1.25;}
#ticket{width:32%;background:var(--creme);color:var(--encre);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.8);
  font-size:.78em;line-height:1.3;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.4);transform:rotate(2deg);
  background-image:repeating-linear-gradient(transparent 0 1.25em,rgba(216,69,43,.12) 1.25em calc(1.25em + 1px));}
#ticket .t{font-family:var(--f-titre);font-size:1.15em;color:var(--tomate-f);}
#ticket ul{margin:.3em 0 0;padding:0;list-style:none;}
#ticket li.fait{text-decoration:line-through;opacity:.5;}

/* ---- Bas : jauge + boutons, posés sur l'îlot ---- */
#bas{position:absolute;left:0;right:0;bottom:0;padding:calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*5);display:flex;flex-direction:column;gap:calc(var(--u)*3);align-items:stretch;}
#jauge{position:relative;height:calc(var(--u)*6);border-radius:999px;background:rgba(30,16,8,.75);border:2px solid rgba(255,243,220,.5);overflow:hidden;}
#jauge .zone{position:absolute;top:0;bottom:0;background:linear-gradient(#7fd06f,var(--basilic));opacity:.9;}
#jauge .rempli{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#ffcf6e,var(--croute));}
#jauge .curseur{position:absolute;top:-10%;bottom:-10%;width:calc(var(--u)*1.4);margin-left:calc(var(--u)*-.7);background:#fff;border-radius:4px;box-shadow:0 0 8px #fff;}
#jauge .texte{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:.9em;text-shadow:0 1px 3px #000;}
#boutons{display:flex;gap:calc(var(--u)*3);}
.btn{all:unset;box-sizing:border-box;flex:1;text-align:center;cursor:pointer;touch-action:manipulation;
  font-family:var(--f-titre);font-size:1.35em;letter-spacing:.02em;padding:calc(var(--u)*3.4) calc(var(--u)*2);border-radius:calc(var(--u)*3.5);
  color:#fff;background:linear-gradient(#ef6a4d,var(--tomate));box-shadow:0 calc(var(--u)*1.1) 0 var(--tomate-f),0 calc(var(--u)*1.6) calc(var(--u)*2) rgba(0,0,0,.45);
  text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .06s;}
.btn.vert{background:linear-gradient(#5fb36a,var(--basilic));box-shadow:0 calc(var(--u)*1.1) 0 #285c30,0 calc(var(--u)*1.6) calc(var(--u)*2) rgba(0,0,0,.45);}
.btn.on,.btn:active{transform:translateY(calc(var(--u)*.9));box-shadow:0 calc(var(--u)*.2) 0 var(--tomate-f);}
.btn.vert.on,.btn.vert:active{box-shadow:0 calc(var(--u)*.2) 0 #285c30;}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px;}

/* ---- Messages qui sautent ---- */
#bulle{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--f-titre);font-size:2.2em;color:#fff;
  text-shadow:0 3px 0 var(--tomate-f),0 0 18px rgba(0,0,0,.6);pointer-events:none;opacity:0;}
#bulle.go{animation:bulle 1.1s ease-out forwards;}
@keyframes bulle{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.12)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20%)}}

/* ---- Panneaux (titre, commande, four, résultat, fin) ---- */
.panneau{position:absolute;inset:0;display:grid;place-items:center;padding:calc(var(--u)*5);background:rgba(20,10,4,.55);backdrop-filter:blur(2px);}
.carte{width:100%;max-width:100%;box-sizing:border-box;background:var(--creme);color:var(--encre);border-radius:calc(var(--u)*4);
  padding:calc(var(--u)*5);display:flex;flex-direction:column;gap:calc(var(--u)*3);text-align:center;box-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.5);}
.carte h1,.carte h2{margin:0;font-family:var(--f-titre);font-weight:400;color:var(--tomate);text-wrap:balance;line-height:1.05;}
.carte h1{font-size:2.6em;}
.carte h2{font-size:1.8em;}
.carte p{margin:0;line-height:1.35;}
.carte .petit{font-size:.85em;opacity:.75;}
.carte .btn{flex:none;}
.liste{display:flex;flex-direction:column;gap:calc(var(--u)*1.2);text-align:left;}
.ligne{display:flex;justify-content:space-between;gap:1em;border-bottom:1px dashed rgba(43,26,16,.25);padding-bottom:.25em;font-variant-numeric:tabular-nums;}
.etoiles{font-size:2.4em;letter-spacing:.1em;color:var(--croute);text-shadow:0 2px 0 #a8651c;}
.etoiles .vide{color:rgba(43,26,16,.18);text-shadow:none;}
.drapeau{height:calc(var(--u)*1.6);border-radius:4px;background:linear-gradient(90deg,var(--basilic) 0 33%,#fff 33% 66%,var(--tomate) 66%);}
canvas.pizza{position:static;width:62%;height:auto;aspect-ratio:1;margin:0 auto;}

/* Four */
#four .carte{background:#2b211c;color:var(--creme);}
#four h2{color:var(--croute);}
.bouche{position:relative;margin:0 auto;width:86%;aspect-ratio:1.25;border-radius:50% 50% 8% 8%/62% 62% 8% 8%;
  background:radial-gradient(ellipse at 50% 85%,#ffb347 0,#e0641c 30%,#5a1d08 70%,#1a0904 100%);
  border:calc(var(--u)*2.2) solid #8c5a3c;box-shadow:inset 0 0 calc(var(--u)*6) #000,0 0 0 calc(var(--u)*1) #5b3622;overflow:hidden;display:grid;place-items:end center;}
.bouche canvas{position:static;width:64%;height:auto;aspect-ratio:1;margin-bottom:6%;transform:perspective(400px) rotateX(50deg);}
.flammes{position:absolute;inset:auto 0 0 0;height:30%;background:radial-gradient(ellipse at 20% 100%,rgba(255,210,90,.8),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(255,150,40,.8),transparent 60%);
  animation:flamme .35s ease-in-out infinite alternate;mix-blend-mode:screen;}
@keyframes flamme{to{opacity:.55;transform:scaleY(1.15)}}
#four #jauge4{background:rgba(0,0,0,.5);}
@media (prefers-reduced-motion:reduce){#bulle.go{animation-duration:.01s}.flammes{animation:none}}
#gain50{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:60;pointer-events:none;opacity:0;
  font:900 34px "Lilita One","Arial Black",sans-serif;color:#ffe27a;text-shadow:0 3px 0 #6b3a00,0 0 16px rgba(255,200,60,.8)}
#gain50.go{animation:g50 1.8s ease-out}
@keyframes g50{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#quitterPz{position:fixed;z-index:60;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));
  padding:8px 14px;border-radius:999px;border:2px solid rgba(255,226,122,.8);background:rgba(0,0,0,.6);color:#ffe27a;font:900 14px Arial,sans-serif}
</style>

<div id="gain50">+50 €</div>
<button id="quitterPz" onclick="try{if(window.Android&&Android.retourChambre){Android.retourChambre();}else{history.back();}}catch(e){history.back();}">✕ Quitter</button>
<div id="cadre"><div id="scene">
  <canvas id="c"></canvas>
  <div id="haut" hidden>
    <div id="consigne"><b id="c-titre">Pétrir</b><span id="c-texte"></span></div>
    <div id="ticket"></div>
  </div>
  <div id="bas" hidden>
    <div id="jauge"><div class="zone"></div><div class="rempli"></div><div class="curseur"></div><div class="texte"></div></div>
    <div id="boutons"><button class="btn" id="b1">Action</button><button class="btn vert" id="b2" hidden>Valider</button></div>
  </div>
  <div id="bulle"></div>

  <div class="panneau" id="titre">
    <div class="carte">
      <div class="drapeau"></div>
      <h1>Pizzeria Rudy</h1>
      <p>5 commandes t'attendent. Pétris, lance la pâte, garnis exactement comme demandé et sors la pizza du four au bon moment.</p>
      <p class="petit" id="record"></p>
      <button class="btn" id="b-jouer">Ouvrir la pizzeria</button>
    </div>
  </div>

  <div class="panneau" id="commande" hidden>
    <div class="carte">
      <p class="petit" id="cmd-num">Commande 1 / 5</p>
      <h2 id="cmd-nom">La Margherita</h2>
      <div class="liste" id="cmd-liste"></div>
      <button class="btn" id="b-go">C'est parti !</button>
    </div>
  </div>

  <div class="panneau" id="four" hidden>
    <div class="carte">
      <h2>Au four !</h2>
      <p>Sors la pizza quand la jauge est dans le vert : croûte dorée, fromage gratiné.</p>
      <div class="bouche"><canvas id="pz-four" width="360" height="360"></canvas><div class="flammes"></div></div>
      <div id="jauge4" class="jauge4" style="position:relative;height:calc(var(--u)*6);border-radius:999px;border:2px solid rgba(255,243,220,.5);overflow:hidden">
        <div class="zone" style="position:absolute;top:0;bottom:0;background:linear-gradient(#7fd06f,#3f8a4a)"></div>
        <div class="rempli" style="position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffe08a,#e9b25f,#8a4b1a,#2a1408)"></div>
      </div>
      <button class="btn" id="b-sortir">Sortir la pizza</button>
    </div>
  </div>

  <div class="panneau" id="resultat" hidden>
    <div class="carte">
      <h2 id="r-titre">Bravo !</h2>
      <canvas class="pizza" id="pz-res" width="360" height="360"></canvas>
      <div class="etoiles" id="r-etoiles"></div>
      <p id="r-avis"></p>
      <div class="liste" id="r-liste"></div>
      <button class="btn" id="b-suite">Commande suivante</button>
    </div>
  </div>

  <div class="panneau" id="fin" hidden>
    <div class="carte">
      <div class="drapeau"></div>
      <h2>Fin de la journée</h2>
      <div class="liste" id="f-liste"></div>
      <p id="f-record"></p>
      <button class="btn" id="b-rejouer">Nouvelle journée</button>
    </div>
  </div>
</div></div>

<script>
const ASSETS = {"bg": "/assets/shinato/m/img_1501ecf7bce0.jpg", "bgW": 1080, "bgH": 1945, "spr": {"petrir": [{"src": "/assets/shinato/m/img_100f57f5f432.webp", "fx": 100.5, "fy": 482, "w": 205, "h": 483}, {"src": "/assets/shinato/m/img_cc137a5ba70a.webp", "fx": 94.5, "fy": 479, "w": 190, "h": 480}, {"src": "/assets/shinato/m/img_4b135f307d7a.webp", "fx": 93.5, "fy": 458, "w": 188, "h": 459}, {"src": "/assets/shinato/m/img_fc4e29c55f9a.webp", "fx": 105.0, "fy": 477, "w": 213, "h": 478}, {"src": "/assets/shinato/m/img_ff25dd3a2367.webp", "fx": 103.5, "fy": 476, "w": 209, "h": 477}, {"src": "/assets/shinato/m/img_ca46d07756bd.webp", "fx": 95.5, "fy": 478, "w": 196, "h": 479}], "lancer": [{"src": "/assets/shinato/m/img_76134f2b0f9b.webp", "fx": 101.0, "fy": 477, "w": 200, "h": 478}, {"src": "/assets/shinato/m/img_c654cae3a4c3.webp", "fx": 126.5, "fy": 475, "w": 243, "h": 476}, {"src": "/assets/shinato/m/img_ea41831633c7.webp", "fx": 100.5, "fy": 474, "w": 202, "h": 475}, {"src": "/assets/shinato/m/img_9a5a8ee01454.webp", "fx": 109.5, "fy": 486, "w": 221, "h": 487}, {"src": "/assets/shinato/m/img_9d048128d580.webp", "fx": 101.0, "fy": 485, "w": 203, "h": 486}, {"src": "/assets/shinato/m/img_fa20d82b6204.webp", "fx": 104.0, "fy": 482, "w": 210, "h": 483}], "sauce": [{"src": "/assets/shinato/m/img_ee27483883da.webp", "fx": 117.0, "fy": 478, "w": 220, "h": 479}, {"src": "/assets/shinato/m/img_7368248e2a4f.webp", "fx": 124.0, "fy": 477, "w": 227, "h": 478}, {"src": "/assets/shinato/m/img_5c1d85d8a711.webp", "fx": 121.0, "fy": 477, "w": 224, "h": 478}, {"src": "/assets/shinato/m/img_87e0a73fb294.webp", "fx": 122.0, "fy": 482, "w": 226, "h": 483}, {"src": "/assets/shinato/m/img_70eb05f55121.webp", "fx": 113.0, "fy": 482, "w": 217, "h": 483}, {"src": "/assets/shinato/m/img_186d732ea921.webp", "fx": 115.5, "fy": 482, "w": 220, "h": 483}], "olives": [{"src": "/assets/shinato/m/img_fdf158eb0673.webp", "fx": 189.5, "fy": 467, "w": 291, "h": 468}, {"src": "/assets/shinato/m/img_6c96ebc73f1b.webp", "fx": 170.0, "fy": 396, "w": 274, "h": 397}, {"src": "/assets/shinato/m/img_3ef9b0847cd3.webp", "fx": 164.5, "fy": 474, "w": 269, "h": 475}, {"src": "/assets/shinato/m/img_9d59c7eddc8e.webp", "fx": 181.0, "fy": 482, "w": 291, "h": 483}, {"src": "/assets/shinato/m/img_12505098d891.webp", "fx": 167.5, "fy": 482, "w": 276, "h": 483}, {"src": "/assets/shinato/m/img_9913acd1870d.webp", "fx": 184.0, "fy": 482, "w": 291, "h": 483}], "chorizo": [{"src": "/assets/shinato/m/img_9c9dea53facd.webp", "fx": 181.5, "fy": 473, "w": 356, "h": 474}, {"src": "/assets/shinato/m/img_373115ff994c.webp", "fx": 170.0, "fy": 473, "w": 334, "h": 474}, {"src": "/assets/shinato/m/img_105a0d9f3502.webp", "fx": 170.5, "fy": 474, "w": 340, "h": 475}, {"src": "/assets/shinato/m/img_da2778651b6a.webp", "fx": 179.5, "fy": 485, "w": 365, "h": 486}, {"src": "/assets/shinato/m/img_085f05f2583a.webp", "fx": 179.0, "fy": 485, "w": 366, "h": 486}, {"src": "/assets/shinato/m/img_b532126c262c.webp", "fx": 197.5, "fy": 485, "w": 380, "h": 486}], "mozza": [{"src": "/assets/shinato/m/img_66b41db2e734.webp", "fx": 182.5, "fy": 474, "w": 405, "h": 475}, {"src": "/assets/shinato/m/img_e03829a85901.webp", "fx": 164.5, "fy": 474, "w": 427, "h": 475}, {"src": "/assets/shinato/m/img_a7d83f792ee5.webp", "fx": 167.5, "fy": 474, "w": 411, "h": 475}, {"src": "/assets/shinato/m/img_9885ce238fd4.webp", "fx": 177.0, "fy": 486, "w": 436, "h": 487}, {"src": "/assets/shinato/m/img_679c9d3691a7.webp", "fx": 173.5, "fy": 486, "w": 437, "h": 487}, {"src": "/assets/shinato/m/img_7e1713fbba72.webp", "fx": 181.5, "fy": 486, "w": 440, "h": 487}]}};

/* ================= Réglages ================= */
const SOL_Y = 1560;        // pieds de Rudy (derrière l'îlot), en pixels du décor
const RUDY_X = 540;        // centre des pieds
const ECHELLE = 2.08;      // taille de Rudy par rapport aux planches
const DESSUS_ILOT = 1060;  // à partir d'ici, l'îlot passe devant Rudy

const RECETTES = [
  {id:"marg",  nom:"La Margherita", prix:9,  garni:[]},
  {id:"oliv",  nom:"La Provençale", prix:11, garni:["olives"]},
  {id:"piq",   nom:"La Piquante",   prix:13, garni:["olives","chorizo"]},
  {id:"rudy",  nom:"La Rudy",       prix:15, garni:["olives","chorizo","mozza"]},
];
const GARNI = {
  olives: {mot:"olive", mots:"olives", btn:"+1 olive", min:5,max:8},
  chorizo:{mot:"tranche de chorizo", mots:"tranches de chorizo", btn:"+1 chorizo", min:4,max:7},
  mozza:  {mot:"boule de mozzarella", mots:"boules de mozzarella", btn:"+1 mozza", min:3,max:6},
};
const NB_COMMANDES = 5;

/* ================= Scène ================= */
const scene=document.getElementById('scene'), cv=document.getElementById('c'), ctx=cv.getContext('2d');
let SW=0,SH=0,K=1;
function mise(){
  const W=innerWidth,H=innerHeight,r=ASSETS.bgW/ASSETS.bgH;
  if(W/H>r){SH=H;SW=H*r;}else{SW=W;SH=W/r;}
  scene.style.width=SW+'px';scene.style.height=SH+'px';scene.style.setProperty('--u',(SW/100)+'px');
  const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(SW*d);cv.height=Math.round(SH*d);
  ctx.setTransform(d,0,0,d,0,0);K=SW/ASSETS.bgW;
}
addEventListener('resize',mise);

const IMG={bg:null,spr:{}};
function charge(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(i);i.src=src;});}

const rudy={planche:"petrir",image:0};
function dessine(){
  if(!IMG.bg)return;
  ctx.clearRect(0,0,SW,SH);
  ctx.drawImage(IMG.bg,0,0,SW,SH);
  const f=ASSETS.spr[rudy.planche][rudy.image], im=IMG.spr[rudy.planche][rudy.image];
  const e=ECHELLE*K;
  const dx={chorizo:-20,mozza:-55}[rudy.planche]||0; // les bols de droite restent dans l'écran
  ctx.drawImage(im,(RUDY_X+dx-f.fx*ECHELLE)*K,(SOL_Y-f.fy*ECHELLE)*K,f.w*e,f.h*e);
  // l'îlot repasse devant ses jambes
  const sy=DESSUS_ILOT;
  ctx.drawImage(IMG.bg,0,sy,ASSETS.bgW,ASSETS.bgH-sy,0,sy*K,SW,(ASSETS.bgH-sy)*K);
}

/* ================= Sons (synthétisés) ================= */
let AC=null,OUT=null;
function son(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=.8;OUT.connect(AC.destination);}if(AC.state==='suspended')AC.resume();}catch(_){}}
addEventListener('pointerdown',son,{capture:true});
function bruit(d){const b=AC.createBuffer(1,Math.max(1,AC.sampleRate*d|0),AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;return s;}
function filt(t,f,q){const b=AC.createBiquadFilter();b.type=t;b.frequency.value=f;if(q)b.Q.value=q;return b;}
function env(t,a,d){const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(a,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.004+d);g.connect(OUT);return g;}
function osc(type,f,t,d,a,f2){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);o.connect(env(t,a,d));o.start(t);o.stop(t+d+.05);}
function nz(t,d,a,type,f,q){const n=bruit(d+.05);n.connect(filt(type,f,q)).connect(env(t,a,d));n.start(t);}
const S={
  petrir(){if(!AC)return;const t=AC.currentTime;const p=.85+Math.random()*.3;osc('sine',110*p,t,.12,.5,55);nz(t,.09,.5,'lowpass',500*p);},
  lancer(){if(!AC)return;const t=AC.currentTime;const n=bruit(.6),f=filt('bandpass',400,1.2);f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(1800,t+.25);f.frequency.exponentialRampToValueAtTime(500,t+.55);n.connect(f).connect(env(t,.35,.55));n.start(t);},
  attrape(){if(!AC)return;const t=AC.currentTime;osc('sine',140,t,.1,.4,70);nz(t,.06,.35,'lowpass',700);},
  sauce(){if(!AC)return;const t=AC.currentTime;const p=.8+Math.random()*.4;nz(t,.08,.18,'bandpass',600*p,3);osc('sine',220*p,t,.05,.05,160*p);},
  fromage(){if(!AC)return;const t=AC.currentTime;for(let i=0;i<5;i++)nz(t+i*.018+Math.random()*.01,.025,.12,'highpass',3500+Math.random()*2000);},
  plop(){if(!AC)return;const t=AC.currentTime;const p=.9+Math.random()*.25;osc('sine',620*p,t,.09,.35,190*p);nz(t,.03,.15,'lowpass',1200);},
  ding(){if(!AC)return;const t=AC.currentTime;osc('sine',1318,t,1.2,.25);osc('sine',2637,t,.6,.08);osc('sine',1975,t+.002,.9,.06);},
  caisse(){if(!AC)return;const t=AC.currentTime;nz(t,.04,.3,'highpass',2500);osc('sine',1568,t+.06,.5,.18);osc('sine',2093,t+.16,.7,.2);},
  bravo(){if(!AC)return;const t=AC.currentTime;[523,659,784,1046].forEach((f,i)=>osc('triangle',f,t+i*.09,.25,.18));},
  rate(){if(!AC)return;const t=AC.currentTime;[392,330,262].forEach((f,i)=>osc('triangle',f,t+i*.12,.25,.16));},

let crepite=null;
function fourSon(on){
  if(!AC)return;
  if(on&&!crepite){
    const g=AC.createGain();g.gain.value=.0;g.connect(OUT);g.gain.linearRampToValueAtTime(.12,AC.currentTime+.4);
    const n=bruit(2);n.loop=true;n.connect(filt('lowpass',260)).connect(g);n.start();
    const id=setInterval(()=>{if(Math.random()<.6)nz(AC.currentTime,.012,.08+Math.random()*.1,'highpass',2000+Math.random()*3000);},70);
    crepite={g,n,id};
  }else if(!on&&crepite){clearInterval(crepite.id);crepite.g.gain.linearRampToValueAtTime(0,AC.currentTime+.2);const n=crepite.n;setTimeout(()=>{try{n.stop()}catch(_){}} ,300);crepite=null;}
}

let maintien=false;
function anim(seq,dt,fin){ // joue une suite d'images de la planche courante
  let i=0;const pas=()=>{if(i<seq.length){rudy.image=seq[i++];setTimeout(pas,dt);}else if(fin)fin();};pas();
}
function noteTemps(t,ok){return Math.max(30,Math.min(100,Math.round(100-(t-ok)*18)));}

const ETAPES={
  petrir(){
    rudy.planche="petrir";rudy.image=0;
    consigne("Pétrir la pâte","Tape vite sur Pétrir pour travailler la pâte avant la fin du temps.");
    boutons("Pétrir");
    const besoin=16, limite=7; let n=0,t=0,fini=false;
    jauge({rempli:0,texte:`${limite} s`});
    return {
      tap(){if(fini)return;n++;rudy.image=n%6;S.petrir();
        if(n>=besoin){fini=true;const note=noteTemps(t,3.6);cmd.notes.pate=[note];bulle(note>=85?"Pâte parfaite !":"Pâte prête");setTimeout(suivante,700);}},
      maj(dt){if(fini)return;t+=dt;jauge({rempli:n/besoin,texte:`${Math.max(0,limite-t).toFixed(1)} s`});
        if(t>=limite){fini=true;cmd.notes.pate=[Math.round(25+45*n/besoin)];bulle("Pâte un peu molle…");S.rate();setTimeout(suivante,800);}}
    };
  },
  lancer(){
    rudy.planche="lancer";rudy.image=0;
    consigne("Lancer la pâte","Tape quand le curseur blanc est dans le vert pour faire tourner la pâte en l'air. 2 lancers.");
    boutons("Lancer !");
    let essai=0,phase="pret",t=0,zone=null,cur=0,v=1.25,notes=[];
    const prepare=()=>{phase="pret";rudy.image=0;setTimeout(()=>{rudy.image=1;phase="vise";t=Math.random()*3;const c=.22+Math.random()*.56;zone=[c-.08,c+.08];},350);};
    prepare(); jauge({curseur:0});
    return {
      tap(){if(phase!=="vise")return;phase="vol";
        const c=(zone[0]+zone[1])/2,d=Math.abs(cur-c);
        const note=d<=.08?100:d<=.16?65:30;notes.push(note);S.lancer();
        anim([2,3,4],230,()=>{S.attrape();rudy.image=5;bulle(note===100?"Parfait !":note>=65?"Pas mal":"Ouh là, rattrapée de justesse");
          essai++;setTimeout(()=>{if(essai<2){prepare();}else{cmd.notes.pate.push(...notes);suivante();}},800);});},
      maj(dt){if(phase!=="vise"){jauge({zone,curseur:cur});return;}t+=dt;cur=.5-.5*Math.cos(t*Math.PI*v);jauge({zone,curseur:cur,texte:`Lancer ${essai+1} / 2`});}
    };
  },
  sauce(){
    rudy.planche="sauce";rudy.image=0;
    consigne("La sauce tomate","Garde le doigt appuyé sur Étaler. Lâche quand la jauge est dans le vert, sinon ça déborde !");
    boutons("Étaler (maintenir)");
    let q=0,fini=false,tSon=0;const zone=[.76,.92];jauge({zone,rempli:0});
    const finir=()=>{if(fini)return;fini=true;
      let note;if(q>=zone[0]&&q<=zone[1])note=100;else if(q<zone[0])note=Math.max(20,Math.round(100-(zone[0]-q)*260));else note=Math.max(15,Math.round(100-(q-zone[1])*400));
      cmd.notes.sauce=[note];bulle(note===100?"Juste ce qu'il faut !":q>zone[1]?"Trop de sauce !":"Pas assez de sauce…");
      (note>=85?S.bravo:S.rate)();setTimeout(suivante,900);};
    return {
      appui(){},lache(){if(q>0.03)finir();},
      maj(dt){if(fini||!maintien)return;q+=dt*.34;tSon+=dt;if(tSon>.14){tSon=0;S.sauce();}
        rudy.image=q<.33?0:q<.66?1:2;jauge({zone,rempli:q,texte:q>1?"Ça déborde !":""});if(q>=1.08)finir();}
    };
  },
  fromage(){
    rudy.planche="sauce";rudy.image=3;
    consigne("Le fromage","Tape sur Parsemer pour répartir le fromage : 10 pincées, vite !");
    boutons("Parsemer");
    const besoin=10,limite=6;let n=0,t=0,fini=false;jauge({rempli:0});
    return {
      tap(){if(fini)return;n++;S.fromage();rudy.image=3+Math.min(2,Math.floor(n/besoin*3));
        if(n>=besoin){fini=true;const note=noteTemps(t,2.8);cmd.notes.fromage=[note];bulle(note>=85?"Bien fromagée !":"C'est bon");setTimeout(suivante,700);}},
      maj(dt){if(fini)return;t+=dt;jauge({rempli:n/besoin,texte:`${n} / ${besoin}`});
        if(t>=limite){fini=true;cmd.notes.fromage=[Math.round(25+45*n/besoin)];bulle("Il manque du fromage…");S.rate();setTimeout(suivante,800);}}
    };
  },
  olives(){return garniture("olives",{repos:0,prend:[1],poses:[2,3,4],fin:5});},
  chorizo(){return garniture("chorizo",{repos:0,prend:[0,1],poses:[2,3,4],fin:5});},
  mozza(){return garniture("mozza",{repos:0,prend:[0],poses:[1,2,3,4],fin:5});},
  four(){
    UI.haut.hidden=true;UI.bas.hidden=true;panneau('four');
    let x=0,fini=false,dinge=false;const zone=[.6,.76];
    const z=$('jauge4').querySelector('.zone'),rp=$('jauge4').querySelector('.rempli');
    z.style.left=zone[0]*100+'%';z.style.width=(zone[1]-zone[0])*100+'%';
    fourSon(true);
    const sortir=()=>{if(fini)return;fini=true;fourSon(false);
      let note;if(x>=zone[0]&&x<=zone[1])note=100;else if(x<zone[0])note=Math.max(10,Math.round(100-(zone[0]-x)*260));else note=Math.max(0,Math.round(100-(x-zone[1])*420));

      maj(dt){if(fini)return;x+=dt/7.5;rp.style.width=Math.min(1,x)*100+'%';

};
function garniture(g,fr){
  rudy.planche=g;rudy.image=fr.repos;
  const G=GARNI[g],cible=cmd.q[g];let n=0,fini=false,occupe=false;
  consigne({olives:'Les olives',chorizo:'Le chorizo',mozza:'La mozzarella'}[g],`La commande demande exactement ${cible} ${G.mots}. Ajoute-les une par une, puis valide.`);
  boutons(G.btn,"Valider");
  const maj=()=>jauge({rempli:n/cible,texte:`${n} / ${cible}`});maj();
  return {
    tap(){if(fini||occupe)return;occupe=true;n++;maj();
      const pose=fr.poses[Math.min(fr.poses.length-1,Math.floor((n-1)/cible*fr.poses.length))];
      anim([...fr.prend,pose],110,()=>{occupe=false;});setTimeout(S.plop,120);},
    valider(){if(fini)return;fini=true;cmd.mis[g]=n;rudy.image=fr.fin;
      const d=Math.abs(n-cible),note=d===0?100:Math.max(0,100-35*d);cmd.notes[g]=[note];
      bulle(d===0?"Pile ce qu'il faut !":n>cible?`${n-cible} de trop…`:`Il en manque ${cible-n}…`);(d===0?S.bravo:S.rate)();setTimeout(suivante,900);}
  };
}

/* ================= Résultats ================= */
function moyenne(a){return a.reduce((s,x)=>s+x,0)/a.length;}
function resultat(){
  etape=null;
  const parts=[["Pâte",moyenne(cmd.notes.pate)],["Sauce",cmd.notes.sauce[0]],["Fromage",cmd.notes.fromage[0]],
    ...cmd.recette.garni.map(g=>[`${GARNI[g].mots[0].toUpperCase()+GARNI[g].mots.slice(1)} (${cmd.mis[g]}/${cmd.q[g]})`,cmd.notes[g][0]]),["Cuisson",cmd.notes.four[0]]];
  let note=moyenne(parts.map(p=>p[1]));
  if(cmd.notes.four[0]===0)note=Math.min(note,20);
  note=Math.round(note);
  const et=note>=85?3:note>=60?2:note>=35?1:0;
  const paye=Math.round(cmd.recette.prix*(note>=35?(.5+.5*note/100):0)*10)/10;
  const pourboire=et===3?3:et===2?1:0;
  partie.total+=paye+pourboire;partie.notes.push(note);
  $('r-titre').textContent=["Le client repart fâché","Bof…","Bonne pizza !","Pizza de chef !"][et];
  $('r-etoiles').innerHTML=[0,1,2].map(i=>`<span class="${i<et?'':'vide'}">★</span>`).join('');
  $('r-avis').textContent=avis(note);
  $('r-liste').innerHTML=parts.map(([n,v])=>`<div class="ligne"><span>${n}</span><span>${Math.round(v)} / 100</span></div>`).join('')+
    `<div class="ligne"><b>Payé</b><b>${paye.toFixed(2).replace('.',',')} €${pourboire?` + ${pourboire} € de pourboire`:''}</b></div>`;
  $('b-suite').textContent=partie.n+1<NB_COMMANDES?"Commande suivante":"Fermer la pizzeria";
  dessinePizza($('pz-res'),cmd,cmd.cuisson);
  panneau('resultat');(et>=2?S.caisse:S.rate)();
  // dans l'appli : chaque pizza réussie (bonne pizza ou pizza de chef) rapporte 50 € à Rudy
  if(et>=2){ gagne50(); }
}
function gagne50(){
  try{ if(window.Android&&Android.ajouterArgent) Android.ajouterArgent(50); }catch(e){}
  const t=document.getElementById('gain50'); t.classList.remove('go'); void t.offsetWidth; t.classList.add('go');
}
function avis(n){
  const c=cmd.cuisson;
  if(cmd.notes.four[0]===0||c>.95)return "« Elle est carbonisée ! Je ne paie pas ça. »";
  if(c<.45)return "« La pâte est encore crue au milieu… »";
  if(n>=85)return "« Exactement ce que j'avais commandé, merci Rudy ! »";
  if(n>=60)return "« Pas mal du tout, je reviendrai. »";
  return "« Ce n'est pas vraiment ce que j'avais demandé… »";
}
function finJournee(){
  let rec=0;try{rec=+localStorage.getItem('pizzeria-rudy-record')||0;}catch(_){}
  const tot=Math.round(partie.total*10)/10,nouv=tot>rec;
  if(nouv){try{localStorage.setItem('pizzeria-rudy-record',tot);}catch(_){}}
  $('f-liste').innerHTML=partie.notes.map((n,i)=>`<div class="ligne"><span>${partie.commandes[i].recette.nom}</span><span>${n} / 100</span></div>`).join('')+
    `<div class="ligne"><b>Recette du jour</b><b>${tot.toFixed(2).replace('.',',')} €</b></div>`;
  $('f-record').textContent=nouv?"Nouveau record !":`Record : ${rec.toFixed(2).replace('.',',')} €`;
  panneau('fin');UI.haut.hidden=true;UI.bas.hidden=true;S.bravo();majRecord();

/* ================= Pizza dessinée (four et résultat) ================= */
function alea(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function melange(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t));}
function teinte(c){return`rgb(${c[0]},${c[1]},${c[2]})`;}
function cuit(x,crue,doree,brulee){return x<.68?melange(crue,doree,Math.max(0,x)/.68):melange(doree,brulee,Math.min(1,(x-.68)/.32));}
function dessinePizza(cv,c,x){
  const g=cv.getContext('2d'),W=cv.width,R=W*.46,cx=W/2,cy=W/2,rnd=alea(c.graine||7);
  g.clearRect(0,0,W,W);
  // pâte / croûte
  const cr=cuit(x,[243,224,184],[222,160,78],[70,40,20]);
  let gr=g.createRadialGradient(cx,cy,R*.7,cx,cy,R);gr.addColorStop(0,teinte(melange(cr,[255,255,255],.1)));gr.addColorStop(.75,teinte(cr));gr.addColorStop(1,teinte(melange(cr,[0,0,0],.25)));
  g.fillStyle=gr;g.beginPath();g.arc(cx,cy,R,0,7);g.fill();
  // sauce
  g.fillStyle=teinte(cuit(x,[214,58,36],[190,48,28],[90,25,12]));g.beginPath();
  for(let a=0;a<=Math.PI*2+.01;a+=.2){const rr=R*(.82+rnd()*.03);g.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}g.fill();
  // fromage
  const fr=cuit(x,[255,247,214],[250,214,120],[120,70,25]);
  for(let i=0;i<70;i++){const a=rnd()*7,r=Math.sqrt(rnd())*R*.76;g.fillStyle=teinte(melange(fr,[255,255,255],rnd()*.15));
    g.beginPath();g.ellipse(cx+Math.cos(a)*r,cy+Math.sin(a)*r,R*(.07+rnd()*.06),R*(.05+rnd()*.04),rnd()*3,0,7);g.fill();}
  if(x>.55){for(let i=0;i<(x-.55)*90;i++){const a=rnd()*7,r=Math.sqrt(rnd())*R*.74;g.fillStyle=`rgba(${x>.85?'60,30,10':'190,120,40'},.55)`;g.beginPath();g.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,R*(.02+rnd()*.03),0,7);g.fill();}}
  // garnitures (le nombre réellement posé)
  const pos=()=>{const a=rnd()*7,r=Math.sqrt(rnd())*R*.66;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  const mis=c.mis||{};
  for(let i=0;i<(mis.chorizo||0);i++){const[p,q]=pos(),rr=R*.13;g.fillStyle=teinte(cuit(x,[196,52,40],[170,40,30],[60,15,8]));g.beginPath();g.arc(p,q,rr,0,7);g.fill();
    g.fillStyle='rgba(255,220,200,.45)';for(let k=0;k<4;k++){g.beginPath();g.arc(p+(rnd()-.5)*rr,q+(rnd()-.5)*rr,rr*.12,0,7);g.fill();}}
  for(let i=0;i<(mis.mozza||0);i++){const[p,q]=pos();g.fillStyle=teinte(cuit(x,[252,252,246],[248,236,200],[140,90,40]));g.beginPath();g.ellipse(p,q,R*.11,R*.095,rnd()*3,0,7);g.fill();}
  for(let i=0;i<(mis.olives||0);i++){const[p,q]=pos();g.fillStyle='#1d1a16';g.beginPath();g.arc(p,q,R*.075,0,7);g.fill();g.fillStyle=teinte(cuit(x,[200,60,40],[180,50,30],[60,20,10]));g.beginPath();g.arc(p,q,R*.03,0,7);g.fill();}
  if(x>.9){g.fillStyle=`rgba(20,10,5,${Math.min(.5,(x-.9)*4)})`;g.beginPath();g.arc(cx,cy,R,0,7);g.fill();}
}

function boucle(t){const dt=Math.min(.05,(t-der)/1000||0);der=t;if(etape&&etape.maj)etape.maj(dt);dessine();requestAnimationFrame(boucle);}
