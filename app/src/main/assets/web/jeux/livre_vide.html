<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dragon Ball Tome 1 — Manga 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#170b05;color:#fff}
#lib{position:fixed;inset:0;perspective:1400px;background:radial-gradient(ellipse at 50% 15%,#9a653c55,transparent 45%),repeating-linear-gradient(90deg,#ffffff08 0 2px,transparent 2px 14px),linear-gradient(#42210f,#6a3c20 12%,#4c2814 88%,#211006)}
#lib:before,#lib:after{content:"";position:absolute;left:0;right:0;height:7%;background:linear-gradient(#8b5631,#35190c);box-shadow:0 12px 24px #000b}
#lib:before{top:5%}#lib:after{bottom:5%;box-shadow:0 -12px 24px #000b}
#shelf{position:absolute;inset:12% 0 12%;display:flex;align-items:center;justify-content:center;
  touch-action:none;perspective:1400px}
/* le rayon : cinq emplacements, celui du milieu de face, les autres de profil */
#rayon{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.livre3d{position:absolute;left:50%;top:50%;width:min(48vw,250px);aspect-ratio:.69;
  transform-style:preserve-3d;cursor:pointer;
  transition:transform .42s cubic-bezier(.22,.8,.3,1), opacity .42s ease;
  will-change:transform,opacity}
#book{position:relative}
.cover{position:absolute;inset:0;background:center/cover no-repeat;border-radius:5px 12px 12px 5px;box-shadow:0 30px 50px #000c,inset -14px 0 18px #0005;border:1px solid #ffffff30}
.cover:before{content:"";position:absolute;left:-12px;top:3px;bottom:3px;width:15px;background:linear-gradient(90deg,#1c0b04,#87471f,#2a1107);transform:rotateY(-60deg);transform-origin:right}
.pageside{position:absolute;right:-12px;top:8px;bottom:8px;width:16px;background:repeating-linear-gradient(#fff9e8 0 2px,#c7bba6 2px 3px);transform:rotateY(70deg);transform-origin:left}
.name{position:absolute;bottom:6%;left:0;right:0;text-align:center;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:800;color:#f3d6a0;text-shadow:0 3px 5px #000}
.hint{position:absolute;bottom:2%;left:5%;right:5%;text-align:center;color:#f0d8ad;font-size:14px}
#reader{display:none;position:fixed;inset:0;z-index:10;touch-action:none;
background:
radial-gradient(ellipse at 50% 12%,#d8a46a30,transparent 42%),
repeating-linear-gradient(90deg,#ffffff08 0 2px,transparent 2px 14px),
linear-gradient(#42210f,#6a3c20 12%,#4c2814 88%,#211006)}
#reader:before,#reader:after{content:"";position:absolute;left:0;right:0;height:7%;
background:linear-gradient(#8b5631,#35190c);box-shadow:0 12px 24px #000b}
#reader:before{top:5%}#reader:after{bottom:5%;box-shadow:0 -12px 24px #000b}
#reader.show{display:block}.bar{position:absolute;z-index:50;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:8px;padding:8px;background:linear-gradient(#000d,transparent)}
button{border:1px solid #ffffff40;background:#111b;color:#fff;border-radius:999px;padding:9px 12px;font-weight:700}.stat{margin-left:auto;background:#0009;border-radius:999px;padding:8px 11px;font-size:12px}
#stage{position:absolute;inset:56px 0 25px;display:flex;align-items:center;justify-content:center;perspective:2400px}
#opened{position:relative;width:min(84vw,760px);height:min(68vh,570px);
filter:drop-shadow(0 32px 34px #000d);transform-style:preserve-3d;
transform:rotateX(5deg) translateY(10px);transition:transform .7s cubic-bezier(.2,.75,.2,1)}
#opened:before{content:"";position:absolute;z-index:-3;left:-2.2%;right:-2.2%;top:-2%;bottom:-2.5%;
border-radius:14px;background:#5a2613;box-shadow:0 8px 0 #2a1008,0 22px 35px #000a}
#opened:after{content:"";position:absolute;z-index:-2;left:1%;right:1%;top:1%;bottom:1%;
border-radius:10px;background:repeating-linear-gradient(0deg,#e9dfc9 0 2px,#c9baa0 2px 3px)}
.pg{position:absolute;top:0;width:50%;height:100%;background:#fff;overflow:hidden;display:flex;
align-items:center;justify-content:center;backface-visibility:hidden;
box-shadow:inset 0 0 18px #6e553422}
.pg.left{left:0;border-radius:10px 1px 1px 10px;box-shadow:inset -22px 0 25px -25px #000}.pg.right{right:0;border-radius:1px 10px 10px 1px;box-shadow:inset 22px 0 25px -25px #000}
.pg img,.face img{width:100%;height:100%;object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}
.pg{background:#f7f2e8}
.pg img{display:block}
.pg.left img{object-position:right center}
.pg.right img{object-position:left center}
.spine{position:absolute;z-index:8;left:50%;top:-1%;bottom:-1%;width:14px;transform:translateX(-50%);
background:radial-gradient(ellipse at center,#fff6 0,#8b6b4c55 28%,#0008 72%);
box-shadow:-10px 0 18px #0005,10px 0 18px #0005;border-radius:50%;pointer-events:none}
#flip{display:none;position:absolute;z-index:20;top:0;right:0;width:50%;height:100%;transform-origin:left;transform-style:preserve-3d}
#flip.back{left:0;right:auto;transform-origin:right}.face{position:absolute;inset:0;background:#fff;backface-visibility:hidden;overflow:hidden}.face.b{transform:rotateY(180deg);filter:brightness(.86)}
#flip.go{display:block;animation:fwd .68s cubic-bezier(.2,.7,.2,1) forwards}#flip.backgo{display:block;left:0;right:auto;transform-origin:right;animation:back .68s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fwd{from{transform:rotateY(0)}50%{filter:drop-shadow(-24px 10px 18px #000a)}to{transform:rotateY(-180deg)}}@keyframes back{from{transform:rotateY(0)}50%{filter:drop-shadow(24px 10px 18px #000a)}to{transform:rotateY(180deg)}}
@media(max-width:700px){#opened{width:min(92vw,690px);height:min(62vh,520px)}#book{width:min(60vw,250px)}}

#frontCover{position:absolute;z-index:35;top:-1.8%;left:50%;width:51.8%;height:103.6%;
transform-origin:left center;transform-style:preserve-3d;border-radius:2px 12px 12px 2px;
background:center/cover no-repeat;box-shadow:0 18px 28px #000b,inset 12px 0 16px #0005;
backface-visibility:hidden;pointer-events:none}
#frontCover:after{content:"";position:absolute;inset:0;transform:translateZ(-2px) rotateY(180deg);
background:linear-gradient(90deg,#d7c6a9,#f3ead9);border-radius:12px 2px 2px 12px}
#reader.opening #frontCover{animation:openCover .9s cubic-bezier(.18,.72,.22,1) forwards}
#reader.opened #frontCover{transform:rotateY(-178deg);opacity:.18}
#reader.opened .pg.left,#reader.opened .pg.right{z-index:5}
@keyframes openCover{0%{transform:rotateY(0)}45%{box-shadow:-18px 18px 30px #000b}100%{transform:rotateY(-178deg)}}

@media (orientation:portrait){
 #opened{width:min(92vw,700px);height:auto;aspect-ratio:1.42/1}
 .pg img,.face img{object-fit:contain}
}
@media (orientation:landscape){
 #opened{width:min(80vw,920px);height:min(76vh,650px)}
}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script></head><body>
<div id="lib"><button id="addOneBtn" style="position:absolute;z-index:20;top:16px;right:190px;border:1px solid #ffffff55;background:#111c;color:#fff;border-radius:999px;padding:11px 15px;font-weight:800">＋ Un livre</button><button id="addPdfBtn" style="position:absolute;z-index:20;top:16px;right:16px;border:1px solid #ffffff55;background:#111c;color:#fff;border-radius:999px;padding:11px 15px;font-weight:800">📁 Dossier des livres</button><input id="addPdfInput" type="file" accept="application/pdf" style="display:none"><div id="shelf">
  <div id="rayon">
    <div class="livre3d" data-place="-2"><div class="pageside"></div><div class="cover"></div></div>
    <div class="livre3d" data-place="-1"><div class="pageside"></div><div class="cover"></div></div>
    <div class="livre3d" data-place="0" id="book"><div class="pageside"></div><div class="cover"></div></div>
    <div class="livre3d" data-place="1"><div class="pageside"></div><div class="cover"></div></div>
    <div class="livre3d" data-place="2"><div class="pageside"></div><div class="cover"></div></div>
  </div>
  <div class="name">Aucun livre</div>
</div><div class="hint">Glisse le livre à gauche/droite • touche-le pour l’ouvrir</div></div>
<div id="reader"><div class="bar"><button id="close">← Armoire</button><button id="prev">‹</button><button id="next">›</button><button id="mode">Sens manga</button><span class="stat" id="stat"></span></div>
<div id="stage"><div id="opened"><div id="frontCover"></div><div class="pg left"><img id="L"></div><div class="pg right"><img id="R"></div><div class="spine"></div><div id="flip"><div class="face"><img id="F"></div><div class="face b"><img id="B"></div></div></div></div></div>
<script>

let pageAudioCtx=null;
function playPageSound(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  pageAudioCtx=pageAudioCtx||new AC();
  if(pageAudioCtx.state==="suspended")pageAudioCtx.resume();
  const c=pageAudioCtx,d=.24,b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<a.length;i++){
    const x=i/a.length;
    const env=Math.sin(Math.PI*Math.min(1,x*1.9))*Math.pow(1-x,1.65);
    a[i]=(Math.random()*2-1)*env*.34;
  }
  const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  src.buffer=b;f.type="bandpass";f.frequency.setValueAtTime(1250,c.currentTime);
  f.frequency.exponentialRampToValueAtTime(620,c.currentTime+d);f.Q.value=.7;
  g.gain.setValueAtTime(.24,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
  src.connect(f).connect(g).connect(c.destination);src.start();src.stop(c.currentTime+d);
 }catch(e){}
}

const PAGES=[];   // bibliotheque vide : les tomes s'ajoutent avec le bouton
const $=s=>document.querySelector(s); let p=0,busy=false,manga=false,sx=0,sy=0,drag=0;
/* Bibliotheque vide : pas de couverture a poser, et surtout pas d'erreur
   qui empecherait le bouton « Ajouter un livre » de fonctionner. */
if(PAGES.length){
  $(".cover").style.backgroundImage=`url("${PAGES[0]}")`;
  $("#frontCover").style.backgroundImage=`url("${PAGES[0]}")`;
}else{
  $(".cover").style.background="linear-gradient(160deg,#2a2030,#151018)";
  $(".name").textContent="Aucun livre";
  const a=document.querySelector(".hint");
  if(a) a.textContent="Touche « ＋ Ajouter un livre » pour déposer un PDF";
}
const pageCache=[];
function preloadAround(n){
  for(let i=Math.max(0,n-4);i<=Math.min(PAGES.length-1,n+7);i++){
    if(!pageCache[i]){
      const im=new Image();
      im.src=PAGES[i];
      pageCache[i]=im;
    }
  }
}
function setImg(id,n){
  if(n>=0&&n<PAGES.length){
    if(!pageCache[n]){const im=new Image();im.src=PAGES[n];pageCache[n]=im;}
    $(id).src=pageCache[n].src;
  } else $(id).removeAttribute("src");
}
function render(){let a=p,b=p+1;if(manga){setImg("#L",b);setImg("#R",a)}else{setImg("#L",a);setImg("#R",b)}$("#stat").textContent=`${p+1}–${Math.min(p+2,PAGES.length)} / ${PAGES.length}`;preloadAround(p)}
function openBook(){
 const r=$("#reader"); r.className="show opening"; render();
 setTimeout(()=>{r.className="show opened"},900);
}
$("#book").onclick = async () => {
  const livre = libraryBooks[currentBook];
  if(!livre) return;
  const nm = document.querySelector(".name");
  if(!livre.pages){
    if(nm) nm.textContent = livre.title + " — ouverture…";
    await ouvrirLivre(currentBook);
  } else refreshCurrentBook();
  if(PAGES.length) openBook();
  else if(nm) nm.textContent = livre.title + " — illisible";
};
$("#close").onclick=()=>{const r=$("#reader");r.className="";} ;
async function flip(next){if(busy)return;let np=next?p+2:p-2;if(np<0||np>=PAGES.length)return;busy=true;let el=$("#flip");el.className="";
let front=next?(manga?p:p+1):(manga?p+1:p);let back=next?(manga?p+2:p+3):(manga?p-2:p-1);setImg("#F",front);setImg("#B",back);void el.offsetWidth;el.className=next?"go":"backgo";
setTimeout(()=>{p=np;render();el.className="";busy=false},680)}
$("#next").onclick=()=>flip(true);$("#prev").onclick=()=>flip(false);$("#mode").onclick=()=>{manga=!manga;$("#mode").textContent=manga?"Sens normal":"Sens manga";render()}
$("#stage").onpointerdown=e=>{sx=e.clientX;sy=e.clientY;$("#stage").setPointerCapture(e.pointerId)}
$("#stage").onpointerup=e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))flip(dx<0);else if(e.clientX<innerWidth*.22)flip(false);else if(e.clientX>innerWidth*.78)flip(true)}
$("#shelf").onpointerdown=e=>{sx=e.clientX;$("#shelf").setPointerCapture(e.pointerId)}
$("#shelf").onpointermove=e=>{ /* le defilement est gere par le rayon */ }
$("#shelf").onpointerup=e=>{ drag=0; }

preloadAround(0);

// --- Ajout local de PDF ---
let libraryBooks=[];

/* ---- la bibliotheque vient du telephone ---- */
function android(){ return (typeof Android !== "undefined" && Android.listerLivres) ? Android : null; }

async function chargerBibliotheque(){
  const A = android();
  if(!A){ return; }
  let liste = [];
  try{ liste = JSON.parse(A.listerLivres() || "[]"); }catch(e){}
  if(!liste.length){
    $(".name").textContent = "Aucun livre";
    const a=document.querySelector(".hint");
    if(a) a.textContent = "Touche « Dossier » pour choisir tes livres";
    libraryBooks = [];
    return;
  }
  libraryBooks = liste.map(l => ({ title:l.titre, id:l.id, pages:null, couverture:null }));
  currentBook = 0;
  placerRayon();
}

/* Les pages sont dessinees par le telephone, une fois pour toutes. */
async function ouvrirLivre(i){
  const A = android(); if(!A) return;
  const livre = libraryBooks[i]; if(!livre) return;
  $(".name").textContent = livre.title + " — préparation…";
  await new Promise(r => setTimeout(r, 30));
  if(!livre.pages){
    try{ livre.pages = JSON.parse(A.pagesDuLivre(livre.id) || "[]"); }catch(e){ livre.pages = []; }
  }
  currentBook = i;
  if(livre.pages.length){
    refreshCurrentBook();
    placerRayon();
    // le telephone continue de preparer les pages suivantes : on les recupere
    let essais = 0;
    const suivre = setInterval(() => {
      essais++;
      try{
        const pretes = JSON.parse(A.pagesPretes(livre.id) || "[]");
        if(pretes.length > livre.pages.length){
          livre.pages = pretes;
          if(currentBook === i){ PAGES.length = 0; pretes.forEach(x => PAGES.push(x)); }
        }
      }catch(e){}
      if(essais > 120) clearInterval(suivre);
    }, 1500);
  }
  else $(".name").textContent = livre.title + " — illisible";
}

/* L'application previent quand le dossier change. */
window.livresChanges = function(){
  const b=$("#addOneBtn"); if(b) b.textContent="＋ Un livre";
  chargerBibliotheque();
};
let currentBook=0;

function refreshCurrentBook(){
  PAGES.length=0;
  libraryBooks[currentBook].pages.forEach(x=>PAGES.push(x));
  p=0;
  pageCache.length=0;
  $(".cover").style.backgroundImage=`url("${PAGES[0]}")`;
  $("#frontCover").style.backgroundImage=`url("${PAGES[0]}")`;
  const nm=document.querySelector(".name");
  if(nm) nm.textContent=libraryBooks[currentBook].title;
  preloadAround(0);
}

$("#addPdfBtn").onclick=(e)=>{
  e.stopPropagation();
  const A = android();
  if(A && A.choisirDossierLivres) A.choisirDossierLivres();
  else alert("Disponible dans l'application.");
};
$("#addOneBtn").onclick=(e)=>{
  e.stopPropagation();
  const A = android();
  if(A && A.ajouterUnLivre){ A.ajouterUnLivre(); $("#addOneBtn").textContent="＋ préparation…"; }
  else alert("Disponible dans l'application.");
};
$("#addPdfInput").onchange=async e=>{
  const file=e.target.files && e.target.files[0];
  if(!file)return;
  if(!window.pdfjsLib){alert("Le lecteur PDF n'a pas pu se charger. Vérifie la connexion Internet puis réessaie.");return}
  try{
    $("#addPdfBtn").textContent="Chargement…";
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const data=await file.arrayBuffer();
    const doc=await pdfjsLib.getDocument({data}).promise;
    const pages=[];
    for(let i=1;i<=doc.numPages;i++){
      const pg=await doc.getPage(i);
      const vp=pg.getViewport({scale:1.15});
      const c=document.createElement("canvas");
      c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      pages.push(c.toDataURL("image/jpeg",0.76));
    }
    const title=file.name.replace(/\.pdf$/i,"");
    libraryBooks.push({title,pages});
    currentBook=libraryBooks.length-1;
    refreshCurrentBook();
    alert("Livre ajouté : "+title+"\nGlisse dans l'armoire pour passer d'un livre à l'autre.");
  }catch(err){
    alert("Impossible d'ajouter ce PDF : "+err.message);
  }finally{
    $("#addPdfBtn").textContent="📁 Dossier des livres";
    e.target.value="";
  }
};

/* ====== l'etagere en volume ====== */
const emplacements = [...document.querySelectorAll(".livre3d")];

function placerRayon(){
  for(const el of emplacements){
    const d = +el.dataset.place;                       // -2 a 2 par rapport au livre courant
    const i = currentBook + d;
    const livre = libraryBooks[i];
    const cov = el.querySelector(".cover");
    if(!livre){ el.style.opacity = 0; el.style.pointerEvents = "none"; continue; }
    el.style.opacity = d === 0 ? 1 : (Math.abs(d) === 1 ? .72 : .34);
    el.style.pointerEvents = d === 0 ? "auto" : "none";
    el.style.zIndex = 10 - Math.abs(d);
    /* de face au centre, tourne et recule sur les cotes */
    const x = d * 42, ry = d * -38, tz = -Math.abs(d) * 160, ech = d === 0 ? 1 : .82;
    el.style.transform =
      `translate(-50%,-50%) translateX(${x}%) translateZ(${tz}px) rotateY(${ry}deg) scale(${ech})`;
    if(livre.couverture) cov.style.backgroundImage = `url("${livre.couverture}")`;
    else { cov.style.background = "linear-gradient(160deg,#2a2030,#151018)"; demanderCouverture(i); }
  }
  const nm = document.querySelector(".name");
  if(nm) nm.textContent = libraryBooks[currentBook] ? libraryBooks[currentBook].title : "Aucun livre";
}

/* La couverture se demande au telephone, une seule page a dessiner. */
function demanderCouverture(i){
  const A = android(); const livre = libraryBooks[i];
  if(!A || !livre || livre.enCours) return;
  livre.enCours = true;
  setTimeout(() => {
    try{
      const u = A.couverture(livre.id);
      if(u){ livre.couverture = u; placerRayon(); }
    }catch(e){}
  }, 40 * Math.abs(i - currentBook));
}

// Dans l'armoire : glissement horizontal pour changer de livre.
let libSwipeX=0;
$("#shelf").addEventListener("pointerdown",e=>{libSwipeX=e.clientX});
$("#shelf").addEventListener("pointerup",e=>{
  const dx=e.clientX-libSwipeX;
  if(Math.abs(dx)>65 && libraryBooks.length>1){
    currentBook = (currentBook + (dx<0?1:-1) + libraryBooks.length) % libraryBooks.length;
    placerRayon();                                   // on fait defiler, sans ouvrir
    refreshCurrentBook();
  }
});

</script><script>setTimeout(chargerBibliotheque, 120);</script>
<script>setTimeout(placerRayon, 200);</script>
