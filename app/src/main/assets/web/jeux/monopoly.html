<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Boulevard</title>
<style>
  :root{
    --feutre:#1c6349;
    --feutre-fonce:#0f3b2c;
    --papier:#f6f1e3;
    --papier-ombre:#e2d9c3;
    --encre:#1d160e;
    --or:#d9b45e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:"Trebuchet MS",Avenir,system-ui,sans-serif;color:var(--encre);
    background:
      radial-gradient(120% 90% at 50% -10%, #2c4a3d, #0b1310 80%);
    display:flex;flex-direction:column;align-items:center;
    padding:8px 8px calc(14px + env(safe-area-inset-bottom));gap:9px;
  }
  .entete{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:640px}
  .marqueHaut{font-family:Georgia,serif;font-size:14px;letter-spacing:.14em;color:var(--or)}
  .entete button{
    font:inherit;font-size:12px;padding:6px 10px;border-radius:4px;cursor:pointer;
    background:#20302a;color:#d9d0ba;border:1px solid #45594f;
  }

  /* ================= plateau ================= */
  .plateau{
    position:relative;
    width:min(calc(100vw - 14px), 96vh, 640px);
    aspect-ratio:1;
    display:grid;
    grid-template-columns:1.52fr repeat(9,1fr) 1.52fr;
    grid-template-rows:1.52fr repeat(9,1fr) 1.52fr;
    background:linear-gradient(155deg,#2a8a66,var(--feutre) 55%,var(--feutre-fonce));
    border:4px solid #0a120f;border-radius:5px;
    box-shadow:0 20px 46px rgba(0,0,0,.65), inset 0 0 60px rgba(0,0,0,.35);
    padding:3px;gap:1px;
    overflow:hidden;
  }
  .case{
    position:relative;background:var(--papier);
    border:1px solid #a89d84;overflow:hidden;cursor:pointer;
  }
  .case .contenu{
    position:absolute;top:50%;left:50%;
    display:flex;flex-direction:column;align-items:center;
    transform-origin:center;
  }
  .case.bas    .contenu{transform:translate(-50%,-50%)}
  .case.gauche .contenu{transform:translate(-50%,-50%) rotate(90deg)}
  .case.haut   .contenu{transform:translate(-50%,-50%) rotate(180deg)}
  .case.droite .contenu{transform:translate(-50%,-50%) rotate(-90deg)}
  .bande{width:100%;height:23%;border-bottom:1px solid rgba(0,0,0,.5);position:relative;flex:none}
  .nom{
    flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:6.6px;font-weight:700;line-height:1.06;padding:2px 1px 0;
    text-transform:uppercase;overflow:hidden;hyphens:auto;word-break:break-word;
  }
  .prix{font-size:6.5px;padding-bottom:2px;opacity:.8;font-variant-numeric:tabular-nums}
  .pictos{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
  .pictos svg{width:56%;height:auto;opacity:.85}
  .case.coin .contenu{transform:translate(-50%,-50%)}
  .case.coin{background:var(--papier-ombre)}
  .case.coin .nom{font-size:7.5px}
  .case.coin svg{width:44%}
  .batis{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6%}
  .batis svg{width:17%;height:auto}
  .batis.hotel svg{width:34%}
  .liseret{position:absolute;inset:auto 0 0 0;height:5px}
  .case.bas .liseret{inset:auto 0 0 0;height:5px}
  .case.haut .liseret{inset:0 0 auto 0;height:5px}
  .case.gauche .liseret{inset:0 auto 0 0;width:5px;height:auto}
  .case.droite .liseret{inset:0 0 0 auto;width:5px;height:auto}
  .case.hypotheque{filter:grayscale(.75) brightness(.9)}
  .case.hypotheque::after{
    content:"HYP.";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:7px;font-weight:800;color:#8c2a20;background:rgba(255,255,255,.35);
  }

  /* ================= centre ================= */
  .centre{
    grid-column:2/11;grid-row:2/11;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    padding:8px;color:#eee6d0;
  }
  .blason{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    transform:rotate(-45deg);pointer-events:none;
  }
  .blason span{
    font-family:Georgia,serif;font-size:min(6.2vw,34px);letter-spacing:.2em;color:var(--or);
    text-shadow:0 3px 6px rgba(0,0,0,.55);opacity:.92;white-space:nowrap;
  }
  .des{display:flex;gap:10px;z-index:2}
  .de{
    width:min(9vw,42px);aspect-ratio:1;background:linear-gradient(150deg,#fffdf6,#ddd4bd);
    border-radius:7px;border:1px solid #8d8471;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:12%;box-shadow:0 4px 8px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.12);
  }
  .de s{width:70%;aspect-ratio:1;background:#1d160e;border-radius:50%;align-self:center;justify-self:center}
  .de.roule{animation:secoue .55s cubic-bezier(.3,1.4,.5,1)}
  @keyframes secoue{
    20%{transform:translateY(-14px) rotate(-25deg) scale(1.1)}
    55%{transform:translateY(6px) rotate(18deg)}
    80%{transform:translateY(-3px) rotate(-6deg)}
  }
  .journal{
    width:min(92%,320px);height:26%;min-height:64px;overflow-y:auto;z-index:2;
    font-size:11px;line-height:1.35;background:rgba(0,0,0,.32);border-radius:5px;padding:6px 8px;
    scrollbar-width:none;backdrop-filter:blur(2px);
  }
  .journal::-webkit-scrollbar{display:none}
  .journal p{margin:0 0 2px}
  .journal .fort{color:var(--or)}

  /* ================= pions ================= */
  .coucheJetons{position:absolute;inset:0;pointer-events:none;z-index:6}
  .jeton{
    position:absolute;left:0;top:0;
    width:var(--taille,30px);height:var(--taille,30px);
    transition:transform .12s ease-out;
    filter:drop-shadow(1px 3px 3px rgba(0,0,0,.55));
  }
  .jeton svg{width:100%;height:100%;display:block}
  .jeton.saute{animation:sautJeton .16s ease-out}
  @keyframes sautJeton{50%{transform:translate(var(--x),calc(var(--y) - 5px)) scale(1.12)}}
  .argentVol{
    position:absolute;font-size:13px;font-weight:800;z-index:9;pointer-events:none;
    text-shadow:0 2px 4px rgba(0,0,0,.6);animation:vole 1.15s ease-out forwards;
  }
  @keyframes vole{
    0%{opacity:0;transform:translate(-50%,0) scale(.8)}
    20%{opacity:1;transform:translate(-50%,-10px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-46px) scale(1)}
  }

  /* carte piochée */
  .carteTiree{
    position:absolute;left:50%;top:50%;z-index:12;width:min(62%,250px);
    background:var(--papier);color:var(--encre);border-radius:7px;padding:14px 15px;
    border:2px solid #1d160e;box-shadow:0 16px 34px rgba(0,0,0,.6);
    text-align:center;pointer-events:none;opacity:0;
    transform:translate(-50%,-50%) rotateY(90deg);
  }
  .carteTiree.montre{animation:carteEntre .45s cubic-bezier(.2,1.4,.4,1) forwards}
  .carteTiree.cache{animation:carteSort .35s ease forwards}
  @keyframes carteEntre{
    from{opacity:0;transform:translate(-50%,-50%) rotateY(90deg) scale(.8)}
    to{opacity:1;transform:translate(-50%,-50%) rotateY(0) scale(1)}
  }
  @keyframes carteSort{to{opacity:0;transform:translate(-50%,-64%) rotateY(-40deg) scale(.9)}}
  .carteTiree h3{margin:0 0 7px;font-family:Georgia,serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .carteTiree p{margin:0;font-size:13px;line-height:1.35}

  /* ================= joueurs et actions ================= */
  .fiches{display:flex;gap:6px;width:100%;max-width:640px;flex-wrap:wrap}
  .fiche{
    flex:1 1 132px;display:flex;align-items:center;gap:7px;
    background:linear-gradient(#f8f4e8,#e7dfca);border-radius:5px;padding:6px 8px;
    border:1px solid #a89d84;border-left:6px solid var(--c);
  }
  .fiche.actif{box-shadow:0 0 0 2px var(--or)}
  .fiche.mort{opacity:.4}
  .fiche .icone{width:26px;height:26px;flex:none}
  .fiche .txt{min-width:0}
  .fiche b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fiche small{font-size:12px;font-variant-numeric:tabular-nums}
  .puces{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap}
  .puces i{width:9px;height:9px;border-radius:2px;display:block;border:1px solid rgba(0,0,0,.35)}
  .actions{display:flex;gap:7px;width:100%;max-width:640px;flex-wrap:wrap;justify-content:center}
  .actions button{
    font:inherit;font-size:14px;font-weight:700;padding:12px 16px;border-radius:6px;cursor:pointer;
    background:linear-gradient(#f8f4e8,#ddd3bc);color:#1d160e;border:1px solid #8a8170;
    box-shadow:0 3px 0 #6d6553;
  }
  .actions button:active{transform:translateY(3px);box-shadow:none}
  .actions button:disabled{opacity:.4;box-shadow:none;cursor:default}
  .actions button.or{background:linear-gradient(#eec86c,#c79c37);border-color:#89681c}

  /* ================= fenêtres ================= */
  .voile{position:fixed;inset:0;background:rgba(6,10,8,.76);z-index:30;display:none;
         align-items:center;justify-content:center;padding:14px}
  .voile.ouvert{display:flex}
  .fenetre{background:var(--papier);border-radius:8px;padding:15px;width:100%;max-width:430px;
           max-height:84vh;overflow-y:auto;box-shadow:0 22px 50px rgba(0,0,0,.65)}
  .fenetre h2{margin:0 0 9px;font-family:Georgia,serif;font-size:18px}
  .fenetre h3{margin:14px 0 4px;font-family:Georgia,serif;font-size:14px}
  .fenetre p{margin:0 0 9px;font-size:13px;line-height:1.45}
  .titreDeProp{border:2px solid #1d160e;border-radius:5px;overflow:hidden;margin-bottom:10px}
  .titreDeProp .chapeau{padding:9px;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .titreDeProp .chapeau b{font-family:Georgia,serif;font-size:15px;letter-spacing:.05em}
  .titreDeProp table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fffdf5}
  .titreDeProp td{padding:3px 9px;border-top:1px solid #e0d6bf}
  .titreDeProp td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .lot{display:flex;align-items:center;gap:7px;padding:6px 0;border-top:1px solid #ddd3bc;font-size:12.5px}
  .lot .pastille{width:13px;height:13px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.4)}
  .lot .nomlot{flex:1;min-width:0}
  .lot button{font:inherit;font-size:11.5px;padding:5px 8px;border-radius:4px;border:1px solid #8a8170;background:#ece4d0;cursor:pointer}
  .lot button:disabled{opacity:.35}
  .rangee{display:flex;gap:7px;margin:10px 0}
  .rangee button{flex:1;font:inherit;font-size:15px;padding:11px 0;border-radius:6px;border:1px solid #8a8170;background:#ece4d0;cursor:pointer}
  .rangee button[aria-pressed="true"]{background:#1d160e;color:var(--papier)}
  .choixJetons{display:flex;gap:7px;justify-content:center;margin:10px 0;flex-wrap:wrap}
  .choixJetons button{width:56px;height:56px;padding:5px;border-radius:8px;border:2px solid #8a8170;background:#ece4d0;cursor:pointer}
  .choixJetons button[aria-pressed="true"]{border-color:#1d160e;background:#fffdf5;box-shadow:0 0 0 2px var(--or)}
  .valider{margin-top:10px;width:100%;font:inherit;font-size:15px;font-weight:700;padding:11px;border-radius:6px;
           background:#1d160e;color:var(--papier);border:0;cursor:pointer}
  .secondaire{margin-top:7px;background:#6b6252}
</style>
</head>
<body>

<div class="entete">
  <span class="marqueHaut">GRAND BOULEVARD</span>
  <div>
    <button id="son" aria-pressed="true">Son ●</button>
    <button id="regles">Règles</button>
    <button id="rejouer">Nouvelle partie</button>
  </div>
</div>

<div class="plateau" id="plateau">
  <div class="centre">
    <div class="blason"><span>GRAND BOULEVARD</span></div>
    <div class="des"><div class="de" id="de1"></div><div class="de" id="de2"></div></div>
    <div class="journal" id="journal"></div>
  </div>
  <div class="coucheJetons" id="coucheJetons"></div>
  <div class="carteTiree" id="carteTiree"></div>
</div>

<div class="fiches" id="fiches"></div>
<div class="actions" id="actions"></div>

<div class="voile" id="voile"><div class="fenetre" id="fenetre"></div></div>

<script>
/* ================= 1. Dessins ================= */
const JETONS = {
  chapeau:{nom:"Chapeau", d:`<path d="M28 62 C28 58 34 56 34 56 L34 30 C34 22 40 16 50 16 C60 16 66 22 66 30 L66 56 C66 56 72 58 72 62 C72 68 62 72 50 72 C38 72 28 68 28 62 Z"/><path d="M34 48 H66" stroke-width="5" stroke="#3d3a33" fill="none"/>`},
  voiture:{nom:"Voiture", d:`<path d="M18 60 L20 48 C21 44 24 42 28 42 L34 32 C36 28 39 26 43 26 H62 C66 26 69 28 70 32 L74 42 C79 43 82 46 82 51 V60 C82 63 80 64 77 64 H23 C20 64 18 63 18 60 Z"/><circle cx="32" cy="65" r="7" fill="#2b2823"/><circle cx="68" cy="65" r="7" fill="#2b2823"/><path d="M40 33 H60 L64 42 H36 Z" fill="#cfe6f2"/>`},
  bateau:{nom:"Bateau", d:`<path d="M14 60 H86 L76 74 H24 Z"/><path d="M48 14 L48 56 M48 20 L74 52 H48" stroke-width="5" stroke="#3d3a33" fill="none"/><path d="M44 24 L20 52 H44 Z"/>`},
  chien:{nom:"Chien", d:`<path d="M22 70 V50 C22 40 30 34 40 34 L46 26 C48 22 52 22 54 26 L58 34 H64 C74 34 80 42 80 52 V70 H70 V58 H58 V70 H48 V56 C40 56 34 52 32 46 V70 Z"/><circle cx="52" cy="40" r="2.6" fill="#2b2823"/>`},
  brouette:{nom:"Brouette", d:`<path d="M20 40 H74 L66 58 H30 Z"/><path d="M30 58 L22 70 M66 58 L78 66" stroke-width="5" stroke="#3d3a33" fill="none"/><circle cx="34" cy="72" r="8" fill="#2b2823"/><path d="M74 40 L86 34" stroke-width="5" stroke="#3d3a33" fill="none"/>`},
  bougeoir:{nom:"Bougeoir", d:`<path d="M46 20 H54 V44 H46 Z"/><path d="M30 44 H70 L64 56 H36 Z"/><path d="M40 56 H60 V70 H40 Z"/><path d="M30 70 H70 V76 H30 Z"/><path d="M50 12 C54 16 54 20 50 20 C46 20 46 16 50 12 Z" fill="#f0c14b"/>`}
};
function dessinJeton(cle, couleur, taille){
  const j = JETONS[cle];
  const u = "g" + cle + Math.floor(Math.random()*10000);
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf7ee"/><stop offset="45%" stop-color="#cfc7b7"/>
      <stop offset="100%" stop-color="#8d8676"/></linearGradient></defs>
    <ellipse cx="50" cy="82" rx="30" ry="9" fill="${couleur}" stroke="#241f18" stroke-width="3"/>
    <ellipse cx="50" cy="79" rx="26" ry="7" fill="#fff" opacity=".18"/>
    <g fill="url(#${u})" stroke="#241f18" stroke-width="3.4" stroke-linejoin="round">${j.d}</g>
  </svg>`;
}
const PICTOS = {
  gare:`<svg viewBox="0 0 100 60"><path d="M20 14 h36 c6 0 10 4 10 10 v6 h10 l6 12 v10 H14 V24 c0-6 3-10 6-10z" fill="#2b2823"/><circle cx="28" cy="50" r="6" fill="#2b2823"/><circle cx="60" cy="50" r="6" fill="#2b2823"/><path d="M26 20 h20 v10 H26z" fill="#f6f1e3"/></svg>`,
  eau:`<svg viewBox="0 0 60 60"><path d="M30 8 C40 24 48 32 48 40 a18 18 0 0 1 -36 0 C12 32 20 24 30 8z" fill="#2f7fb5"/><path d="M24 38 a10 10 0 0 0 8 10" stroke="#dff0fa" stroke-width="3" fill="none"/></svg>`,
  ampoule:`<svg viewBox="0 0 60 60"><path d="M30 6 a17 17 0 0 1 11 30 c-2 2-3 4-3 7 H22 c0-3-1-5-3-7A17 17 0 0 1 30 6z" fill="#e8c33a" stroke="#2b2823" stroke-width="2.5"/><path d="M23 48 h14 M25 54 h10" stroke="#2b2823" stroke-width="3.5" stroke-linecap="round"/></svg>`,
  coffre:`<svg viewBox="0 0 60 60"><path d="M8 26 a22 22 0 0 1 44 0z" fill="#b8873a" stroke="#2b2823" stroke-width="2.5"/><rect x="8" y="26" width="44" height="22" fill="#d5a353" stroke="#2b2823" stroke-width="2.5"/><rect x="26" y="30" width="8" height="12" fill="#2b2823"/></svg>`,
  sort:`<svg viewBox="0 0 60 60"><path d="M30 4 56 30 30 56 4 30z" fill="#e35d4a" stroke="#2b2823" stroke-width="2.5"/><text x="30" y="41" text-anchor="middle" font-size="30" font-family="Georgia,serif" font-weight="bold" fill="#fff">?</text></svg>`,
  taxe:`<svg viewBox="0 0 60 60"><ellipse cx="30" cy="18" rx="20" ry="8" fill="#e0b64a" stroke="#2b2823" stroke-width="2.5"/><path d="M10 18 v12 a20 8 0 0 0 40 0 V18" fill="#cf9f34" stroke="#2b2823" stroke-width="2.5"/><path d="M10 30 v10 a20 8 0 0 0 40 0 V30" fill="#e0b64a" stroke="#2b2823" stroke-width="2.5"/></svg>`,
  depart:`<svg viewBox="0 0 80 60"><path d="M6 30 H54 M54 30 l-14 -12 M54 30 l-14 12" stroke="#c8362c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  prison:`<svg viewBox="0 0 60 60"><rect x="8" y="8" width="44" height="44" rx="3" fill="#dcd2b8" stroke="#2b2823" stroke-width="3"/><path d="M20 12 v40 M30 12 v40 M40 12 v40" stroke="#2b2823" stroke-width="4"/></svg>`,
  parc:`<svg viewBox="0 0 60 60"><path d="M30 6 L54 30 H44 v20 H16 V30 H6z" fill="#2f7a4a" stroke="#2b2823" stroke-width="2.5"/><rect x="26" y="36" width="9" height="14" fill="#7a4a25"/></svg>`,
  allez:`<svg viewBox="0 0 60 60"><rect x="8" y="8" width="44" height="44" rx="3" fill="#dcd2b8" stroke="#2b2823" stroke-width="3"/><path d="M18 30 h20 M38 30 l-8 -8 M38 30 l-8 8" stroke="#c8362c" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`
};
const MAISON = `<svg viewBox="0 0 24 24"><path d="M2 11 12 2 22 11 v11 H2z" fill="#2f7a3e" stroke="#12331b" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
const HOTEL  = `<svg viewBox="0 0 34 24"><path d="M2 9 8 2 14 9 v13 H2z" fill="#b93c2f" stroke="#4b120b" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 12 h18 v10 H14z" fill="#b93c2f" stroke="#4b120b" stroke-width="2.4" stroke-linejoin="round"/></svg>`;

/* ================= 2. Le plateau ================= */
const GROUPES = {
  brun:  {couleur:"#7b4a25", maison:50},
  ciel:  {couleur:"#8fc9e8", maison:50},
  rose:  {couleur:"#d1508f", maison:100},
  orange:{couleur:"#e08b2a", maison:100},
  rouge: {couleur:"#c8352f", maison:150},
  jaune: {couleur:"#e8c92e", maison:150},
  vert:  {couleur:"#2e8b52", maison:200},
  bleu:  {couleur:"#2a4fa8", maison:200}
};
const T = (nom, groupe, prix, loyers) => ({type:"terrain", nom, groupe, prix, loyers, maisons:0, proprio:-1, hypo:false});
const G = nom => ({type:"gare", nom, prix:200, proprio:-1, hypo:false, picto:"gare"});
const S = (nom, picto) => ({type:"service", nom, prix:150, proprio:-1, hypo:false, picto});

const PLATEAU = [
  {type:"depart", nom:"Départ", sous:"Touchez 200 €", picto:"depart"},
  T("Rue des Lilas","brun",60,[2,10,30,90,160,250]),
  {type:"coffre", nom:"Coffre de la ville", picto:"coffre"},
  T("Rue du Fournil","brun",60,[4,20,60,180,320,450]),
  {type:"taxe", nom:"Taxe municipale", montant:200, picto:"taxe"},
  G("Gare de l'Écluse"),
  T("Avenue du Verger","ciel",100,[6,30,90,270,400,550]),
  {type:"sort", nom:"Coup du sort", picto:"sort"},
  T("Avenue des Tilleuls","ciel",100,[6,30,90,270,400,550]),
  T("Avenue du Moulin","ciel",120,[8,40,100,300,450,600]),
  {type:"prison", nom:"Prison", sous:"En visite", picto:"prison"},
  T("Rue des Halles","rose",140,[10,50,150,450,625,750]),
  S("Usine des Eaux","eau"),
  T("Rue du Marché","rose",140,[10,50,150,450,625,750]),
  T("Rue Saint-Gilles","rose",160,[12,60,180,500,700,900]),
  G("Gare du Pont-Neuf"),
  T("Bd des Acacias","orange",180,[14,70,200,550,750,950]),
  {type:"coffre", nom:"Coffre de la ville", picto:"coffre"},
  T("Bd du Beffroi","orange",180,[14,70,200,550,750,950]),
  T("Bd de l'Arsenal","orange",200,[16,80,220,600,800,1000]),
  {type:"parc", nom:"Square public", sous:"Repos", picto:"parc"},
  T("Av. de la Comédie","rouge",220,[18,90,250,700,875,1050]),
  {type:"sort", nom:"Coup du sort", picto:"sort"},
  T("Av. des Thermes","rouge",220,[18,90,250,700,875,1050]),

function apres(ms, f){ minuteurs.push(setTimeout(f, Math.round(ms * RYTHME))); }
function stopper(){ minuteurs.forEach(clearTimeout); minuteurs = []; }
function melanger(a){ const b = a.slice(); for(let i = b.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; }
const sous = n => n.toLocaleString("fr-FR") + " €";

/* ================= 5. Le son ================= */
let ac = null, sonActif = true;
function audio(){
  if(!sonActif || typeof window === "undefined") return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!ac) ac = new AC();
  if(ac.state === "suspended") ac.resume();
  return ac;
}
function souffle(a, t, duree, freq, q, gain, passeBas){
  const n = Math.max(1, Math.floor(a.sampleRate * duree));
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/n, 2.5);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter();
  f.type = passeBas ? "lowpass" : "bandpass";
  f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t);
  return f;
}
function note(a, t, freq, versFreq, duree, gain, forme){
  const o = a.createOscillator(), g = a.createGain();
  o.type = forme || "sine";
  o.frequency.setValueAtTime(freq, t);
  if(versFreq) o.frequency.exponentialRampToValueAtTime(Math.max(30, versFreq), t + duree);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + .012);
  g.gain.exponentialRampToValueAtTime(.0008, t + duree);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + duree + .02);
}
function son(quoi){
  const a = audio(); if(!a) return;
  const t = a.currentTime;
  switch(quoi){
    case "pas":
      souffle(a, t, .035, 1100, 1.6, .16);
      note(a, t, 340, 170, .06, .10, "triangle");
      break;
    case "des":
      [0, .09, .19, .3].forEach((d, k)=>{
        souffle(a, t + d, .05, 520 + k*140, 1.2, .2);
        note(a, t + d, 240 + k*40, 120, .07, .07, "triangle");
      });
      souffle(a, t + .44, .09, 320, .9, .3, true);
      note(a, t + .44, 180, 90, .13, .12, "triangle");
      break;
    case "piece":
      note(a, t, 1180, null, .18, .09, "sine");
      note(a, t + .07, 1560, null, .22, .08, "sine");
      note(a, t + .14, 1980, null, .2, .05, "sine");
      break;
    case "perte":
      note(a, t, 330, 120, .3, .11, "sawtooth");
      break;
    case "carte":{
      const f = souffle(a, t, .3, 1400, .8, .13);
      f.frequency.setValueAtTime(1200, t);
      f.frequency.exponentialRampToValueAtTime(4200, t + .28);
      break;
    }
    case "achat":
      souffle(a, t, .07, 260, .7, .35, true);
      note(a, t, 150, 70, .14, .16, "triangle");
      note(a, t + .1, 880, null, .16, .06, "sine");
      break;
    case "prison":
      souffle(a, t, .12, 2400, 3, .18);
      note(a, t, 220, null, .5, .10, "square");
      note(a, t + .01, 331, null, .45, .07, "square");
      break;
    case "faillite":
      [440, 350, 280, 200].forEach((f, k)=> note(a, t + k*.13, f, f*.85, .28, .10, "triangle"));
      break;
    case "victoire":
      [523, 659, 784, 1046].forEach((f, k)=> note(a, t + k*.11, f, null, .34, .10, "triangle"));
      break;
  }
}

/* ================= 6. Argent et propriétés ================= */
function noter(txt, fort){
  const j = document.getElementById("journal");
  const p = document.createElement("p");
  if(fort) p.className = "fort";
  p.textContent = txt;
  j.appendChild(p);
  while(j.children.length > 60) j.firstChild.remove();
  j.scrollTop = j.scrollHeight;
}
function encaisser(j, n){ j.argent += n; noter(j.nom + " reçoit " + sous(n) + "."); volerArgent(j, "+" + n + " €", true); son("piece"); }
function biens(j){ return PLATEAU.filter(c => c.proprio === j.i); }
function memeGroupe(c){ return PLATEAU.filter(x => x.type === "terrain" && x.groupe === c.groupe); }
function groupeComplet(c){ return c.proprio >= 0 && memeGroupe(c).every(x => x.proprio === c.proprio); }
function loyer(c, lancer){
  if(c.hypo || c.proprio < 0) return 0;
  if(c.type === "gare"){
    const n = PLATEAU.filter(x => x.type === "gare" && x.proprio === c.proprio && !x.hypo).length;
    return [0,25,50,100,200][n];
  }
  if(c.type === "service"){
    const n = PLATEAU.filter(x => x.type === "service" && x.proprio === c.proprio && !x.hypo).length;
    return lancer * (n === 2 ? 10 : 4);
  }
  if(c.maisons > 0) return c.loyers[c.maisons];
  return groupeComplet(c) ? c.loyers[0]*2 : c.loyers[0];
}
function liquider(j, besoin){
  const avecMaisons = () => biens(j).filter(c => c.maisons > 0).sort((a,b) => a.prix - b.prix);
  while(j.argent < besoin){
    const c = avecMaisons()[0];
    if(!c) break;
    c.maisons--;
    j.argent += Math.floor(GROUPES[c.groupe].maison/2);
    noter(j.nom + " revend une maison de " + c.nom + ".");
  }
  for(const c of biens(j).filter(x => !x.hypo && !x.maisons).sort((a,b) => a.prix - b.prix)){
    if(j.argent >= besoin) break;
    c.hypo = true;
    j.argent += Math.floor(c.prix/2);
    noter(j.nom + " hypothèque " + c.nom + " (" + sous(Math.floor(c.prix/2)) + ").");
  }
  return j.argent >= besoin;
}
function payer(j, montant, versQui){
  if(j.argent < montant) liquider(j, montant);
  if(j.argent < montant){ ruiner(j, versQui); return false; }
  j.argent -= montant;
  volerArgent(j, "−" + montant + " €", false);
  son("perte");
  if(versQui){ versQui.argent += montant; volerArgent(versQui, "+" + montant + " €", true); }
  return true;
}
const payerBanque = (j, n) => { noter(j.nom + " paie " + sous(n) + "."); payer(j, n, null); };
function ruiner(j, versQui){
  j.ruine = true;
  const reste = j.argent;
  j.argent = 0;
  for(const c of biens(j)){
    if(versQui){ c.proprio = versQui.i; c.maisons = 0; }
    else { c.proprio = -1; c.maisons = 0; c.hypo = false; }
  }
  if(versQui){ versQui.argent += reste; noter(j.nom + " est ruiné : tout revient à " + versQui.nom + ".", true); }
  else noter(j.nom + " est ruiné : ses biens retournent à la banque.", true);
  son("faillite");
  const el = document.getElementById("jeton" + j.i);
  if(el) el.style.display = "none";
  rendre();
}
function travaux(j, parMaison, parHotel){
  let total = 0;
  for(const c of biens(j)) if(c.maisons === 5) total += parHotel; else total += (c.maisons || 0) * parMaison;
  if(!total){ noter("Rien à réparer chez " + j.nom + "."); return; }
  noter(j.nom + " paie " + sous(total) + " de travaux.");
  payer(j, total, null);
}
function collecte(j, n){
  for(const a of vivants()) if(a !== j) payer(a, n, j);
  noter(j.nom + " encaisse " + sous(n) + " de chaque joueur.");
}
function tournee(j, n){
  for(const a of vivants()) if(a !== j) payer(j, n, a);
  noter(j.nom + " offre " + sous(n) + " à chacun.");
}
function gareSuivante(pos){
  for(let k = 1; k <= 40; k++){ const p = (pos + k) % 40; if(PLATEAU[p].type === "gare") return p; }
  return 5;
}

/* ================= 7. Déplacements ================= */
function aller(j, cible, versLAvant){
  const pas = versLAvant ? (cible - j.pos + 40) % 40 : -((j.pos - cible + 40) % 40);
  avancer(j, pas, ()=> apres(250, ()=> resoudre(j)));
}
function avancer(j, pas, fin){
  const sens = pas >= 0 ? 1 : -1;
  let restants = Math.abs(pas);
  const sauter = ()=>{
    if(!restants){ placerJetons(); return fin(); }
    j.pos = (j.pos + sens + 40) % 40;
    son("pas");
    if(sens > 0 && j.pos === 0){ j.argent += 200; noter(j.nom + " passe par le Départ : +" + sous(200) + "."); volerArgent(j, "+200 €", true); }
    restants--;
    placerJetons(j.i);
    majFiches();
    apres(restants ? 130 : 200, sauter);
  };
  sauter();
}
function enPrison(j){
  j.pos = 10; j.prison = 3; doubles = 0;
  noter(j.nom + " part en prison.", true);
  son("prison");
  placerJetons(); rendre();
  apres(500, finTour);
}
function resoudre(j){
  const c = PLATEAU[j.pos];
  if(c.type === "depart"){ finOuSuite(j); return; }
  if(c.type === "taxe"){ noter(j.nom + " règle " + c.nom + " : " + sous(c.montant) + "."); payer(j, c.montant, null); rendre(); apres(400, ()=> finOuSuite(j)); return; }
  if(c.type === "allez"){ enPrison(j); return; }
  if(c.type === "prison" || c.type === "parc"){ noter(j.nom + " souffle un peu."); finOuSuite(j); return; }
  if(c.type === "sort" || c.type === "coffre"){
    const paquet = c.type === "sort" ? sortPaquet : coffrePaquet;
    const carte = paquet.shift(); paquet.push(carte);
    noter((c.type === "sort" ? "Coup du sort — " : "Coffre — ") + carte.t, true);
    montrerCarte(c.type === "sort" ? "Coup du sort" : "Coffre de la ville", carte.t, c.type);
    const avant = j.pos;
    apres(1700, ()=>{
      carte.f(j);
      rendre();
      if(j.pos === avant && !j.prison) finOuSuite(j);
    });
    return;
  }
  if(c.proprio < 0){
    if(j.ia){ decisionAchatIA(j, c); return; }
    phase = "achat"; rendre(); return;
  }
  if(c.proprio === j.i){ noter(j.nom + " est chez lui."); finOuSuite(j); return; }
  const pro = joueurs[c.proprio];
  if(pro.ruine || c.hypo){ noter(c.nom + " est hypothéqué : rien à payer."); finOuSuite(j); return; }
  const du = loyer(c, des[0] + des[1]);
  noter(j.nom + " doit " + sous(du) + " à " + pro.nom + " pour " + c.nom + ".", true);
  payer(j, du, pro);
  rendre();
  apres(600, ()=> finOuSuite(j));
}
function acheter(j, c){
  j.argent -= c.prix;
  volerArgent(j, "−" + c.prix + " €", false);
  c.proprio = j.i;
  son("achat");
  noter(j.nom + " achète " + c.nom + " pour " + sous(c.prix) + ".", true);
  rendre();
}

/* ================= 8. Le tour ================= */
function lancer(){
  if(phase !== "attente") return;
  const j = joueurs[courant];
  des = [1 + Math.floor(Math.random()*6), 1 + Math.floor(Math.random()*6)];
  phase = "roule";
  son("des");
  afficherDes(true);
  rendre();
  apres(650, ()=>{
    afficherDes(false);
    const total = des[0] + des[1], pareils = des[0] === des[1];
    if(j.prison > 0){
      if(pareils){ j.prison = 0; noter(j.nom + " fait un double et sort de prison.", true); }
      else{
        j.prison--;
        if(j.prison === 0){ noter(j.nom + " paie " + sous(50) + " et sort de prison."); payer(j, 50, null); }
        else{
          noter(j.nom + " reste en prison (" + j.prison + " essai" + (j.prison > 1 ? "s" : "") + ").");
          rendre(); apres(500, finTour); return;
        }
      }
    } else if(pareils){
      doubles++;
      if(doubles === 3){ noter("Trois doubles d'affilée…", true); enPrison(j); return; }
    } else doubles = 0;
    noter(j.nom + " fait " + des[0] + " et " + des[1] + " (" + total + ").");
    avancer(j, total, ()=> apres(250, ()=> resoudre(j)));
  });
}
function finOuSuite(j){
  if(j.ruine){ finTour(); return; }
  if(des[0] === des[1] && !j.prison){
    phase = "attente"; noter(j.nom + " rejoue."); rendre();
    if(j.ia) apres(800, lancer);
    return;
  }
  if(j.ia){ apres(600, ()=>{ gererIA(j); apres(500, finTour); }); return; }
  phase = "fin"; rendre();
}
function finTour(){
  doubles = 0;
  if(vivants().length <= 1){
    const g = vivants()[0];
    phase = "finie";
    noter("Partie terminée. " + (g ? g.nom + " rafle tout." : "Match nul."), true);
    rendre(); fenetreFin(g); return;
  }
  do{ courant = (courant + 1) % joueurs.length; } while(joueurs[courant].ruine);
  tours++;
  phase = "attente";
  rendre();
  if(joueurs[courant].ia) apres(800, tourIA);
}

/* ================= 9. Échanges ================= */
function valeurPour(j, c){
  if(c.type !== "terrain") return Math.round(c.prix * 1.25);
  const g = memeGroupe(c), aMoi = g.filter(x => x.proprio === j.i).length;
  if(aMoi === g.length - 1) return Math.round(c.prix * 3);
  if(aMoi > 0) return Math.round(c.prix * 1.7);
  return Math.round(c.prix * 1.15);
}
function prixDemande(vendeur, c, acheteur){
  const g = c.type === "terrain" ? memeGroupe(c) : [];
  if(c.type === "terrain" && g.filter(x => x.proprio === vendeur.i).length === g.length) return Infinity;
  const donneGroupe = c.type === "terrain" && g.filter(x => x.proprio === acheteur.i).length === g.length - 1;
  let seuil = c.prix * (donneGroupe ? 2.3 : 1.25);
  if(vendeur.argent < 250) seuil *= .75;
  return Math.round(seuil);
}
function transferer(c, vendeur, acheteur, montant){
  acheteur.argent -= montant; vendeur.argent += montant; c.proprio = acheteur.i;
  son("achat");
  noter(acheteur.nom + " rachète " + c.nom + " à " + vendeur.nom + " pour " + sous(montant) + ".", true);
  rendre();
}
function cibleInteressante(j){
  let meilleure = null, meilleurEcart = 0;
  for(const c of PLATEAU){
    if(c.type !== "terrain" || c.proprio < 0 || c.proprio === j.i || c.maisons) continue;
    const v = joueurs[c.proprio];
    if(v.ruine) continue;
    const g = memeGroupe(c);
    if(g.filter(x => x.proprio === j.i).length !== g.length - 1) continue;
    const demande = prixDemande(v, c, j);
    if(demande === Infinity || j.argent - demande < 150) continue;
    const ecart = valeurPour(j, c) - demande;
    if(!meilleure || ecart > meilleurEcart){ meilleure = c; meilleurEcart = ecart; }
  }
  return meilleure;
}
function tenterEchangeIA(j, suite){
  if(Math.random() > .4) return suite();
  const c = cibleInteressante(j);
  if(!c) return suite();
  const vendeur = joueurs[c.proprio];
  const montant = Math.min(Math.round(prixDemande(vendeur, c, j) * 1.08), j.argent - 120);
  if(montant < 10) return suite();
  if(vendeur.ia){
    if(montant >= prixDemande(vendeur, c, j)) transferer(c, vendeur, j, montant);
    else noter(vendeur.nom + " refuse de céder " + c.nom + ".");
    return suite();
  }
  proposerAuJoueur(j, c, montant, suite);
}

/* ================= 10. L'ordinateur ================= */
function tourIA(){
  const j = joueurs[courant];
  if(j.ruine || phase === "finie") return;
  if(j.prison > 0 && j.sorties > 0 && tours < 40){
    j.sorties--; j.prison = 0;
    noter(j.nom + " utilise sa carte de sortie de prison.");
  }
  tenterEchangeIA(j, lancer);
}
function decisionAchatIA(j, c){
  const garde = tours < 20 ? 80 : 220;
  const interessant = memeGroupe(c).some(x => x.proprio === j.i) || c.type !== "terrain" || c.prix <= 200;
  if(j.argent - c.prix >= garde && (interessant || j.argent > 800)) acheter(j, c);
  else noter(j.nom + " laisse " + c.nom + ".");
  apres(600, ()=> finOuSuite(j));
}
function gererIA(j){
  let encore = true;
  while(encore){
    encore = false;
    const candidats = biens(j).filter(c =>
      c.type === "terrain" && groupeComplet(c) && !c.hypo && c.maisons < 5 &&
      !memeGroupe(c).some(x => x.hypo));
    candidats.sort((a,b) => (a.maisons - b.maisons) || (b.prix - a.prix));
    const c = candidats[0];
    if(!c) break;
    const prix = GROUPES[c.groupe].maison;
    if(j.argent - prix < 250) break;
    if(memeGroupe(c).some(x => x.maisons < c.maisons)) break;
    j.argent -= prix; c.maisons++;
    noter(j.nom + " construit sur " + c.nom + ".");
    encore = true;
  }
  for(const c of biens(j)) if(c.hypo && j.argent > Math.ceil(c.prix*0.55) + 400){
    j.argent -= Math.ceil(c.prix*0.55); c.hypo = false;
    noter(j.nom + " lève l'hypothèque sur " + c.nom + ".");
  }
  rendre();
}

/* ================= 11. L'affichage ================= */
const plateauEl = document.getElementById("plateau");
const coucheJetons = document.getElementById("coucheJetons");
let casesEl = [], centres = [];

function cote(i){
  if(i === 0 || i === 10 || i === 20 || i === 30) return "coin";
  if(i < 10) return "bas";
  if(i < 20) return "gauche";
  if(i < 30) return "haut";
  return "droite";
}
function grille(i){
  if(i <= 10) return [11, 11 - i];
  if(i <= 20) return [11 - (i - 10), 1];
  if(i <= 30) return [1, 1 + (i - 20)];
  return [1 + (i - 30), 11];
}
function construirePlateau(){
  PLATEAU.forEach((c, i)=>{
    const [r, col] = grille(i);
    const d = document.createElement("div");
    const face = cote(i);
    d.className = "case " + (face === "coin" ? "coin bas" : face);
    d.style.gridRow = r; d.style.gridColumn = col;
    d.dataset.i = i;
    plateauEl.insertBefore(d, plateauEl.firstChild);
    casesEl[i] = d;
  });
  plateauEl.addEventListener("click", e=>{
    const d = e.target.closest(".case");
    if(d) fenetreCase(+d.dataset.i);
  });
  if(typeof ResizeObserver !== "undefined") new ResizeObserver(mesurer).observe(plateauEl);
}
function mesurer(){
  if(!plateauEl.getBoundingClientRect) return;
  const b = plateauEl.getBoundingClientRect();
  if(!b.width) return;
  centres = [];
  PLATEAU.forEach((c, i)=>{
    const d = casesEl[i], r = d.getBoundingClientRect();
    centres[i] = { x:r.left - b.left + r.width/2, y:r.top - b.top + r.height/2, w:r.width, h:r.height };
    const contenu = d.querySelector(".contenu");
    if(contenu){
      const tourne = cote(i) === "gauche" || cote(i) === "droite";
      contenu.style.width  = (tourne ? r.height : r.width) + "px";
      contenu.style.height = (tourne ? r.width : r.height) + "px";
    }
  });
  const taille = Math.max(20, Math.min(34, centres[1] ? centres[1].w * 1.15 : 26));
  coucheJetons.querySelectorAll(".jeton").forEach(el => el.style.setProperty("--taille", taille + "px"));
  placerJetons();
}
function creerJetons(){
  coucheJetons.innerHTML = "";
  joueurs.forEach(j=>{
    const el = document.createElement("div");
    el.className = "jeton"; el.id = "jeton" + j.i;
    el.innerHTML = dessinJeton(j.jeton, j.couleur);
    coucheJetons.appendChild(el);
  });
  mesurer();
}
function placerJetons(quiSaute){
  if(!centres.length) return;
  const parCase = {};
  joueurs.forEach(j => { if(!j.ruine) (parCase[j.pos] = parCase[j.pos] || []).push(j); });
  joueurs.forEach(j=>{
    const el = document.getElementById("jeton" + j.i);
    if(!el || j.ruine) return;
    const c = centres[j.pos]; if(!c) return;
    const groupe = parCase[j.pos] || [], k = groupe.indexOf(j), n = groupe.length;
    const t = parseFloat(el.style.getPropertyValue("--taille")) || 28;
    const ecart = n > 1 ? Math.min(9, c.w/3) : 0;
    const dx = (k - (n-1)/2) * ecart;
    const dy = n > 2 && k % 2 ? 5 : 0;
    const x = (c.x + dx - t/2) + "px", y = (c.y + dy - t/2 - t*0.12) + "px";
    el.style.setProperty("--x", x); el.style.setProperty("--y", y);
    el.style.transform = `translate(${x}, ${y})`;
    if(quiSaute === j.i){ el.classList.remove("saute"); void el.offsetWidth; el.classList.add("saute"); }
  });
}
function volerArgent(j, txt, positif){
  if(!centres.length || j.ruine) return;
  const c = centres[j.pos]; if(!c) return;
  const d = document.createElement("div");
  d.className = "argentVol";
  d.textContent = txt;
  d.style.color = positif ? "#7bf0b0" : "#ff9a86";
  d.style.left = c.x + "px"; d.style.top = (c.y - 14) + "px";
  coucheJetons.appendChild(d);
  setTimeout(()=> d.remove(), 1200);
}
function montrerCarte(titre, texte, genre){
  const el = document.getElementById("carteTiree");
  el.innerHTML = `<h3>${titre}</h3><p>${texte}</p>`;
  el.style.borderColor = genre === "sort" ? "#c8362c" : "#b8873a";
  son("carte");
  el.classList.remove("montre","cache"); void el.offsetWidth;
  el.classList.add("montre");
  apres(1500, ()=>{ el.classList.remove("montre"); el.classList.add("cache"); });
}
function rendre(){
  PLATEAU.forEach((c, i)=>{
    const d = casesEl[i];
    const g = c.groupe ? GROUPES[c.groupe] : null;
    let dedans = "";
    if(g){
      let batis = "";
      if(c.maisons === 5) batis = `<div class="batis hotel">${HOTEL}</div>`;
      else if(c.maisons > 0) batis = `<div class="batis">${MAISON.repeat(c.maisons)}</div>`;
      dedans = `<div class="bande" style="background:${g.couleur}">${batis}</div>
                <div class="nom">${c.nom}</div><div class="prix">${c.prix} €</div>`;
    } else if(c.picto){
      dedans = `<div class="nom">${c.nom}</div>
                <div class="pictos">${PICTOS[c.picto] || ""}</div>
                <div class="prix">${c.prix ? c.prix + " €" : (c.montant ? "Payez " + c.montant + " €" : (c.sous || ""))}</div>`;
    } else dedans = `<div class="nom">${c.nom}</div>`;
    const lis = c.proprio >= 0 && joueurs[c.proprio]
      ? `<div class="liseret" style="background:${joueurs[c.proprio].couleur}"></div>` : "";
    d.innerHTML = `<div class="contenu">${dedans}</div>${lis}`;
    d.classList.toggle("hypotheque", !!c.hypo);
  });
  mesurer();
  majFiches();
  rendreBoutons();
}
function majFiches(){
  const z = document.getElementById("fiches");
  z.innerHTML = joueurs.map(j=>{
    const mes = biens(j);
    const puces = [...new Set(mes.filter(c => c.groupe).map(c => c.groupe))]
      .map(g => `<i style="background:${GROUPES[g].couleur}"></i>`).join("");
    const autres = mes.filter(c => !c.groupe).length;
    return `<div class="fiche${j.i === courant ? " actif" : ""}${j.ruine ? " mort" : ""}" style="--c:${j.couleur}">
      <div class="icone">${dessinJeton(j.jeton, j.couleur)}</div>
      <div class="txt">
        <b>${j.nom}${j.prison ? " ⛓" : ""}${j.sorties ? " 🎫" : ""}</b>
        <small>${sous(j.argent)}</small>
        <div class="puces">${puces}${autres ? `<i style="background:#6b6252"></i>`.repeat(Math.min(autres,4)) : ""}</div>
      </div></div>`;
  }).join("");
}
function afficherDes(anim){
  const points = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  [1,2].forEach(k=>{
    const el = document.getElementById("de" + k);
    el.innerHTML = Array.from({length:9}, (_, i) => points[des[k-1]].includes(i) ? "<s></s>" : "<span></span>").join("");
    el.classList.remove("roule");
    if(anim){ void el.offsetWidth; el.classList.add("roule"); }
  });
}
function bouton(txt, fn, or, actif){
  const b = document.createElement("button");
  b.textContent = txt;
  if(or) b.className = "or";
  if(actif === false) b.disabled = true;
  b.onclick = fn;
  return b;
}
function rendreBoutons(){
  const z = document.getElementById("actions");
  z.innerHTML = "";
  const j = joueurs[courant];
  if(phase === "finie"){ z.appendChild(bouton("Nouvelle partie", fenetreDebut, true)); return; }
  if(!j) return;
  if(j.ia){ z.appendChild(bouton("Au tour de " + j.nom + "…", ()=>{}, false, false)); return; }
  if(phase === "attente"){
    z.appendChild(bouton(j.prison ? "Tenter un double" : "Lancer les dés", lancer, true));
    if(j.prison && j.sorties)
      z.appendChild(bouton("Carte de sortie", ()=>{ j.sorties--; j.prison = 0; noter("Tu utilises ta carte de sortie."); rendre(); }));
    z.appendChild(bouton("Mes biens", fenetreGestion));
  } else if(phase === "achat"){
    const c = PLATEAU[j.pos];
    z.appendChild(bouton("Acheter (" + sous(c.prix) + ")", ()=>{
      if(j.argent < c.prix){ noter("Pas assez d'argent."); return; }
      acheter(j, c); phase = "jeu"; finOuSuite(j);
    }, true, j.argent >= c.prix));
    z.appendChild(bouton("Laisser", ()=>{ noter("Tu laisses " + c.nom + "."); phase = "jeu"; finOuSuite(j); }));
  } else if(phase === "fin"){
    z.appendChild(bouton("Mes biens", fenetreGestion));
    z.appendChild(bouton("Terminer le tour", ()=>{ phase = "jeu"; finTour(); }, true));
  } else {
    z.appendChild(bouton("…", ()=>{}, false, false));
  }
}

/* ================= 12. Fenêtres ================= */
const voile = document.getElementById("voile"), fenetre = document.getElementById("fenetre");
function ouvrir(html){
  fenetre.innerHTML = html;
  const f = document.createElement("button");
  f.className = "valider"; f.textContent = "Fermer";
  f.onclick = ()=>{ voile.classList.remove("ouvert"); rendre(); };
  fenetre.appendChild(f);
  voile.classList.add("ouvert");
}
function titreDePropriete(c){
  const g = c.groupe ? GROUPES[c.groupe] : null;
  let lignes = "";
  if(c.type === "terrain"){
    lignes = `<tr><td>Loyer</td><td>${sous(c.loyers[0])}</td></tr>
      <tr><td>Avec le groupe</td><td>${sous(c.loyers[0]*2)}</td></tr>
      ${[1,2,3,4].map(n => `<tr><td>${n} maison${n>1?"s":""}</td><td>${sous(c.loyers[n])}</td></tr>`).join("")}
      <tr><td>Hôtel</td><td>${sous(c.loyers[5])}</td></tr>
      <tr><td>Maison / hôtel</td><td>${sous(g.maison)}</td></tr>
      <tr><td>Hypothèque</td><td>${sous(Math.floor(c.prix/2))}</td></tr>`;
  } else if(c.type === "gare"){
    lignes = [1,2,3,4].map(n => `<tr><td>${n} gare${n>1?"s":""}</td><td>${sous([0,25,50,100,200][n])}</td></tr>`).join("") +
      `<tr><td>Hypothèque</td><td>${sous(100)}</td></tr>`;
  } else {
    lignes = `<tr><td>Un service</td><td>4 × le lancer</td></tr><tr><td>Les deux</td><td>10 × le lancer</td></tr>
      <tr><td>Hypothèque</td><td>${sous(75)}</td></tr>`;
  }
  return `<div class="titreDeProp">
    <div class="chapeau" style="background:${g ? g.couleur : "#3c3a35"}"><b>${c.nom}</b><br><span style="font-size:12px">Prix ${sous(c.prix)}</span></div>
    <table>${lignes}</table></div>`;
}
function fenetreCase(i){
  const c = PLATEAU[i];
  if(c.prix === undefined){ ouvrir(`<h2>${c.nom}</h2><p>${c.sous || "Case spéciale."}</p>`); return; }
  ouvrir(titreDePropriete(c) +
    `<p>${c.proprio >= 0 ? "Appartient à " + joueurs[c.proprio].nom : "Encore à vendre."}${c.hypo ? " — hypothéqué." : ""}</p>`);
}
function fenetreGestion(){
  const j = joueurs[courant];
  const mes = biens(j);
  let h = `<h2>Mes biens — ${sous(j.argent)}</h2>`;
  h += mes.length ? mes.map(c=>{
    const g = c.groupe ? GROUPES[c.groupe] : null;
    const peutBatir = c.type === "terrain" && groupeComplet(c) && !c.hypo && c.maisons < 5 &&
      !memeGroupe(c).some(x => x.hypo) && !memeGroupe(c).some(x => x.maisons < c.maisons) && j.argent >= g.maison;
    return `<div class="lot">
      <span class="pastille" style="background:${g ? g.couleur : "#6b6252"}"></span>
      <span class="nomlot">${c.nom}${c.maisons === 5 ? " · hôtel" : c.maisons ? " · " + c.maisons + " maison" + (c.maisons>1?"s":"") : ""}${c.hypo ? " · hyp." : ""}</span>
      ${c.type === "terrain" ? `<button data-act="batir" data-i="${PLATEAU.indexOf(c)}" ${peutBatir ? "" : "disabled"}>+${g.maison} €</button>
      <button data-act="vendre" data-i="${PLATEAU.indexOf(c)}" ${c.maisons ? "" : "disabled"}>−</button>` : ""}
      <button data-act="hypo" data-i="${PLATEAU.indexOf(c)}" ${c.maisons ? "disabled" : ""}>${c.hypo ? "Lever " + Math.ceil(c.prix*0.55) : "Hyp. " + Math.floor(c.prix/2)} €</button>
    </div>`;
  }).join("") : `<p>Tu ne possèdes rien pour l'instant.</p>`;

  const autres = PLATEAU.filter(c => c.proprio >= 0 && c.proprio !== j.i && !c.maisons && !joueurs[c.proprio].ruine);
  if(autres.length){
    h += `<h3>Racheter une rue</h3>` + autres.map(c=>{
      const g = c.groupe ? GROUPES[c.groupe] : null;
      const sug = prixDemande(joueurs[c.proprio], c, j);
      return `<div class="lot">
        <span class="pastille" style="background:${g ? g.couleur : "#6b6252"}"></span>
        <span class="nomlot">${c.nom} · ${joueurs[c.proprio].nom}</span>
        <button data-off="${PLATEAU.indexOf(c)}" data-sug="${isFinite(sug) ? Math.round(sug*1.05) : 0}">Proposer</button>
      </div>`;
    }).join("");
  }
  ouvrir(h);
  fenetre.querySelectorAll("[data-off]").forEach(b => b.onclick = ()=> fenetreOffre(+b.dataset.off, +b.dataset.sug));
  fenetre.querySelectorAll("[data-act]").forEach(b => b.onclick = ()=>{
    const c = PLATEAU[+b.dataset.i], act = b.dataset.act;
    if(act === "batir"){ j.argent -= GROUPES[c.groupe].maison; c.maisons++; noter("Tu construis sur " + c.nom + "."); }
    if(act === "vendre"){ c.maisons--; j.argent += Math.floor(GROUPES[c.groupe].maison/2); noter("Tu revends une maison de " + c.nom + "."); }
    if(act === "hypo"){
      if(c.hypo){
        const cout = Math.ceil(c.prix*0.55);
        if(j.argent < cout){ noter("Pas assez pour lever l'hypothèque."); return; }
        j.argent -= cout; c.hypo = false; noter("Tu lèves l'hypothèque sur " + c.nom + ".");
      } else { c.hypo = true; j.argent += Math.floor(c.prix/2); noter("Tu hypothèques " + c.nom + "."); }
    }
    rendre(); fenetreGestion();
  });
}
function fenetreOffre(i, suggere){
  const c = PLATEAU[i], j = joueurs[courant], vendeur = joueurs[c.proprio];
  let montant = Math.max(20, Math.min(suggere || Math.round(c.prix*1.3), j.argent));
  const dessine = ()=>{
    fenetre.innerHTML = titreDePropriete(c) +
      `<p>Propriétaire : ${vendeur.nom}.</p>
       <p style="font-size:22px;text-align:center;margin:10px 0;font-weight:700">${sous(montant)}</p>`;
    const rang = document.createElement("div");
    rang.className = "rangee";
    [-100,-25,25,100].forEach(d=>{
      const b = document.createElement("button");
      b.textContent = (d > 0 ? "+" : "") + d;
      b.onclick = ()=>{ montant = Math.max(20, Math.min(montant + d, j.argent)); dessine(); };
      rang.appendChild(b);
    });
    fenetre.appendChild(rang);
    const envoi = document.createElement("button");
    envoi.className = "valider"; envoi.textContent = "Proposer " + sous(montant);
    envoi.onclick = ()=>{
      voile.classList.remove("ouvert");
      if(montant >= prixDemande(vendeur, c, j)) transferer(c, vendeur, j, montant);
      else noter(vendeur.nom + " refuse ton offre pour " + c.nom + ".");
      rendre();
    };
    const rien = document.createElement("button");
    rien.className = "valider secondaire"; rien.textContent = "Annuler";
    rien.onclick = ()=>{ voile.classList.remove("ouvert"); };
    fenetre.appendChild(envoi); fenetre.appendChild(rien);
  };
  dessine();
  voile.classList.add("ouvert");
}
function proposerAuJoueur(acheteur, c, montant, suite){
  fenetre.innerHTML = `<h2>Offre de ${acheteur.nom}</h2>` + titreDePropriete(c) +
    `<p>« Je te rachète <b>${c.nom}</b> pour <b>${sous(montant)}</b>. »</p>`;
  const oui = document.createElement("button");
  oui.className = "valider"; oui.textContent = "Accepter " + sous(montant);
  oui.onclick = ()=>{ voile.classList.remove("ouvert"); transferer(c, joueurs[c.proprio], acheteur, montant); suite(); };
  const non = document.createElement("button");
  non.className = "valider secondaire"; non.textContent = "Refuser";
  non.onclick = ()=>{ voile.classList.remove("ouvert"); noter("Tu refuses l'offre de " + acheteur.nom + "."); suite(); };
  fenetre.appendChild(oui); fenetre.appendChild(non);
  voile.classList.add("ouvert");
}
function fenetreFin(g){
  son(g && !g.ia ? "victoire" : "faillite");
  ouvrir(`<h2>${g && !g.ia ? "Tu as gagné !" : "Partie terminée"}</h2>
    <p>${g ? g.nom + " reste seul en piste avec " + sous(g.argent) + " et " + biens(g).length + " biens." : "Tout le monde a coulé."}</p>`);
}
function fenetreDebut(){
  const cles = Object.keys(JETONS);
  const dessine = ()=>{
    fenetre.innerHTML = `<h2>Grand Boulevard</h2>
      <p>Achète des rues, encaisse des loyers, ruine tes adversaires.</p>
      <h3>Combien d'adversaires ?</h3>
      <div class="rangee">${[1,2,3,4,5].map(n =>
        `<button data-n="${n}" aria-pressed="${n === nbAdversaires}">${n}</button>`).join("")}</div>
      <h3>Ton pion</h3>
      <div class="choixJetons">${cles.map(k =>
        `<button data-j="${k}" aria-pressed="${k === jetonChoisi}" title="${JETONS[k].nom}">${dessinJeton(k, COULEURS[0])}</button>`).join("")}</div>`;
    const go = document.createElement("button");
    go.className = "valider"; go.textContent = "Commencer la partie";
    go.onclick = ()=>{ voile.classList.remove("ouvert"); demarrer(); };
    fenetre.appendChild(go);
    fenetre.querySelectorAll("[data-n]").forEach(b => b.onclick = ()=>{ nbAdversaires = +b.dataset.n; dessine(); });
    fenetre.querySelectorAll("[data-j]").forEach(b => b.onclick = ()=>{ jetonChoisi = b.dataset.j; dessine(); });
  };
  dessine();
  voile.classList.add("ouvert");
}
const btnSon = document.getElementById("son");
btnSon.onclick = ()=>{
  sonActif = !sonActif;
  btnSon.textContent = sonActif ? "Son ●" : "Son ○";
  btnSon.setAttribute("aria-pressed", String(sonActif));
  if(sonActif) son("pas");
};
document.getElementById("rejouer").onclick = fenetreDebut;
document.getElementById("regles").onclick = ()=> ouvrir(`<h2>Les règles</h2>
  <p>Tu avances de la somme des deux dés, tu achètes les rues libres où tu tombes et tu encaisses un loyer quand un adversaire s'y arrête.</p>
  <p>Groupe de couleur complet : le loyer double et tu peux bâtir, quatre maisons puis un hôtel, en répartissant également les constructions.</p>
  <p>Un double te fait rejouer, trois d'affilée t'envoient en prison. On en sort par un double, avec une carte, ou en payant 50 € au troisième essai.</p>
  <p>À court d'argent, tes maisons sont revendues à moitié prix et tes rues hypothéquées d'office. Si ça ne suffit toujours pas, c'est la faillite et tes biens passent à ton créancier.</p>
  <p>Comme personne ne réunit une couleur entière par le seul hasard des dés, tu peux racheter des rues aux adversaires depuis « Mes biens », et eux viendront te faire des offres.</p>`);

construirePlateau();
afficherDes(false);
if(typeof window !== "undefined") window.addEventListener("resize", mesurer);
fenetreDebut();
</script>
