<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Atelier de dessin</title>
<style>
  :root{
    --encre:#17140f;
    --bois-clair:#b07a45;
    --bois:#96613a;
    --bois-fonce:#6d4325;
    --papier:#fdfbf3;
    --vert:#1f4b33;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;
    color:var(--encre);
    background:
      repeating-linear-gradient(2deg, rgba(60,30,10,.10) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-1.5deg, rgba(255,225,190,.10) 0 1px, transparent 1px 13px),
      repeating-linear-gradient(180deg, transparent 0 116px, rgba(45,22,6,.55) 116px 119px, rgba(255,215,170,.18) 119px 121px),
      linear-gradient(160deg, var(--bois-clair), var(--bois) 55%, var(--bois-fonce));
  }
  .scene{
    height:100dvh;
    display:flex;flex-direction:column;
    padding:14px 10px calc(8px + env(safe-area-inset-bottom));
    gap:8px;
  }
  .atelier{flex:1;min-height:0;display:flex;align-items:center;gap:6px}

  /* --- Les crayons, à gauche --- */
  .rail{flex:0 0 88px;display:flex;align-items:center;justify-content:center;height:100%}
  .rail svg{width:100%;height:auto;max-height:100%;display:block;filter:drop-shadow(4px 6px 0 rgba(35,17,4,.38))}
  .crayon{cursor:pointer;transition:transform .18s cubic-bezier(.3,1.5,.5,1)}

  /* --- La feuille A4 --- */
  .plan{
    flex:1;min-width:0;height:100%;position:relative;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;touch-action:none;
  }
  .zoom{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;
    transform-origin:50% 50%;
    will-change:transform;
  }
  .feuille{
    position:relative;
    width:100%;height:auto;
    aspect-ratio:210/297;
    max-width:100%;max-height:100%;
    background:var(--papier);
    border:3px solid var(--encre);
    border-radius:2px;
    box-shadow:
      9px 11px 0 rgba(35,17,4,.42),
      inset 0 0 60px rgba(190,170,130,.22);
  }
  .feuille::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(102deg, transparent 46%, rgba(150,130,95,.16) 50%, transparent 54%);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .scotch{
    position:absolute;width:62px;height:22px;
    background:rgba(246,238,205,.85);
    border:2.5px solid var(--encre);
    z-index:3;
  }
  .scotch.g{top:-12px;left:-10px;transform:rotate(-26deg)}
  .scotch.d{top:-12px;right:-10px;transform:rotate(24deg)}

  /* --- Loupe --- */
  .loupe{
    position:absolute;right:6px;bottom:6px;z-index:5;
    display:flex;align-items:stretch;
    background:#fdfbf3;border:3px solid var(--encre);border-radius:3px;
    box-shadow:3px 3px 0 rgba(35,17,4,.5);overflow:hidden;
  }
  .loupe button{border:0;box-shadow:none;border-radius:0;padding:6px 10px;font-size:15px;min-width:34px}
  .loupe button:active{transform:none;background:#eee7d4}
  .loupe button + button{border-left:3px solid var(--encre)}
  #niveau{font-variant-numeric:tabular-nums;font-size:12px;min-width:48px}

  /* --- Barre d'outils --- */
  .barre{
    display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;
    max-width:600px;margin:0 auto;width:100%;
  }
  button{
    font:inherit;font-size:13px;font-weight:600;
    padding:8px 12px;
    background:#fdfbf3;color:var(--encre);
    border:3px solid var(--encre);border-radius:3px;
    box-shadow:3px 3px 0 rgba(35,17,4,.5);
    cursor:pointer;
  }
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(35,17,4,.5)}
  button[aria-pressed="true"]{background:var(--vert);color:#fdfbf3;border-color:var(--encre)}
  button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
  .tailles{display:flex;border:3px solid var(--encre);border-radius:3px;overflow:hidden;box-shadow:3px 3px 0 rgba(35,17,4,.5);background:#fdfbf3}
  .tailles button{border:0;box-shadow:none;border-radius:0;padding:8px 10px;display:grid;place-items:center}
  .tailles button + button{border-left:3px solid var(--encre)}
  .tailles button:active{transform:none}
  .pastille{display:block;border-radius:50%;background:var(--encre)}
  .tailles button[aria-pressed="true"] .pastille{background:#fdfbf3}
  @media (prefers-reduced-motion: reduce){ .crayon{transition:none} }
</style>
</head>
<body>
<div class="scene">
  <div class="atelier">
    <div class="rail"><svg id="kit" viewBox="0 6 118 296" aria-label="Trousse de crayons"></svg></div>

    <div class="plan" id="plan">
      <div class="zoom" id="zoom">
        <div class="feuille">
          <span class="scotch g"></span>
          <span class="scotch d"></span>
          <canvas id="papier"></canvas>
        </div>
      </div>
      <div class="loupe">
        <button id="moins" aria-label="Réduire">−</button>
        <button id="niveau" aria-label="Revenir à la taille normale">100 %</button>
        <button id="plus" aria-label="Agrandir">+</button>
      </div>
    </div>
  </div>

  <div class="barre">
    <button id="gomme" aria-pressed="false">Gomme</button>
    <div class="tailles" role="group" aria-label="Épaisseur du trait">
      <button data-taille="0.6"><span class="pastille" style="width:6px;height:6px"></span></button>
      <button data-taille="1" aria-pressed="true"><span class="pastille" style="width:11px;height:11px"></span></button>
      <button data-taille="1.9"><span class="pastille" style="width:17px;height:17px"></span></button>
    </div>
    <button id="son" aria-pressed="true">Son</button>
    <button id="annuler">Annuler</button>
    <button id="vider">Effacer</button>
    <button id="garder">Enregistrer</button>
  </div>
</div>

<script>
/* ---------- Les crayons de la trousse ---------- */
const OUTILS = [
  { nom:"Crayon gris", corps:"#8d9298", mine:"#4a4a4a", couleur:"#4a4a4a", taille:2.4, alpha:.55, grain:true, son:{f:2800,q:1.1,v:.30} },
  { nom:"Crayon gras", corps:"#2b2b2b", mine:"#111111", couleur:"#141414", taille:10,  alpha:.95, son:{f:900,q:.7,v:.55} },
  { nom:"Rouge",       corps:"#d8352f", mine:"#a71f1a", couleur:"#d8352f", taille:5, alpha:.9, son:{f:1700,q:.9,v:.40} },
  { nom:"Orange",      corps:"#ef8321", mine:"#c05f0c", couleur:"#ef8321", taille:5, alpha:.9, son:{f:1700,q:.9,v:.40} },
  { nom:"Jaune",       corps:"#f2c531", mine:"#c69a14", couleur:"#f2c531", taille:5, alpha:.9, son:{f:1800,q:.9,v:.40} },
  { nom:"Vert",        corps:"#2f9e5b", mine:"#1c6c3c", couleur:"#2f9e5b", taille:5, alpha:.9, son:{f:1600,q:.9,v:.40} },
  { nom:"Bleu",        corps:"#2f6fd0", mine:"#1c4a95", couleur:"#2f6fd0", taille:5, alpha:.9, son:{f:1600,q:.9,v:.40} },
  { nom:"Violet",      corps:"#7b4fd6", mine:"#54329b", couleur:"#7b4fd6", taille:5, alpha:.9, son:{f:1500,q:.9,v:.40} }
];
const SON_GOMME = { f:480, q:.6, v:.65 };

const N = "stroke='#17140f' stroke-width='3' stroke-linejoin='round'";
function basePos(j){
  const y = 46 + j*32, a = (j - (OUTILS.length-1)/2) * 3;
  return `translate(40 ${y}) rotate(${a})`;
}

let svg = "";
OUTILS.forEach((o,i)=>{
  svg += `<g class="crayon" data-i="${i}" transform="${basePos(i)}">
    <rect x="0" y="-8" width="46" height="16" fill="${o.corps}" ${N}/>
    <rect x="4" y="-4.5" width="38" height="3" fill="#fff" opacity=".3" stroke="none"/>
    <rect x="46" y="-8" width="7" height="16" fill="#e6e2d8" ${N}/>
    <polygon points="53,-8 53,8 71,0" fill="#eccfa6" ${N}/>
    <polygon points="65,-3.5 65,3.5 71,0" fill="${o.mine}" ${N}/>
    <title>${o.nom}</title>
  </g>`;
});
svg += `
  <rect x="6" y="18" width="52" height="272" rx="22" fill="#1f4b33" ${N}/>
  <path d="M24 22 v264" stroke="#0e2b1d" stroke-width="6" fill="none"/>
  <path d="M24 22 v264" stroke="#5c8f70" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
  <rect x="14" y="248" width="22" height="24" rx="5" fill="#d8d3c4" ${N}/>
  <path d="M14 260 h-11" ${N} fill="none"/>
  <path d="M40 44 q11 46 9 112" stroke="#0e2b1d" stroke-width="4" fill="none" stroke-linecap="round" opacity=".5"/>`;
document.getElementById("kit").innerHTML = svg;

/* ---------- Le bruit du crayon ---------- */
let ac, filtre, vol, sonActif = true;
function audio(){
  if(ac) return ac;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  ac = new AC();
  const n = ac.sampleRate * 2, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for(let i=0;i<n;i++){ const b = Math.random()*2-1; last = (last + b*.7)/1.6; d[i] = last*1.4; }
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  filtre = ac.createBiquadFilter(); filtre.type = "bandpass";
  vol = ac.createGain(); vol.gain.value = 0;
  src.connect(filtre); filtre.connect(vol); vol.connect(ac.destination);
  src.start();
  return ac;
}
function timbre(){
  const s = gomme ? SON_GOMME : outil.son;
  if(!filtre) return;
  filtre.frequency.setTargetAtTime(s.f, ac.currentTime, .01);
  filtre.Q.value = s.q;
}
function frotte(vitesse){ // vitesse en px/évènement
  if(!sonActif || !ac) return;
  const s = gomme ? SON_GOMME : outil.son;
  const niveau = Math.min(1, .12 + vitesse/28) * s.v * .5;
  vol.gain.setTargetAtTime(niveau, ac.currentTime, .03);
  filtre.frequency.setTargetAtTime(s.f * (1 + Math.min(vitesse,40)/90), ac.currentTime, .04);
}
function silence(){ if(ac) vol.gain.setTargetAtTime(0, ac.currentTime, .05); }

/* ---------- Le dessin ---------- */
const cv = document.getElementById("papier");
const ctx = cv.getContext("2d");
let outil = OUTILS[0], iOutil = 0, mult = 1, gomme = false, echelle = 1;
let dessine = false, pts = [], hist = [];

function dimensionner(){
  const l = cv.clientWidth, h = cv.clientHeight;
  if(!l || !h) return;
  echelle = Math.min(devicePixelRatio || 1, 2) * 1.6;
  const L = Math.round(l*echelle), H = Math.round(h*echelle);
  if(L === cv.width && H === cv.height) return;
  const copie = cv.width ? ctx.getImageData(0,0,cv.width,cv.height) : null;
  cv.width = L; cv.height = H;
  if(copie) ctx.putImageData(copie,0,0);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
}
new ResizeObserver(dimensionner).observe(cv);

function pos(e){
  const r = cv.getBoundingClientRect(), k = cv.width/r.width;
  return { x:(e.clientX-r.left)*k, y:(e.clientY-r.top)*k };
}
function memoriser(){ hist.push(cv.toDataURL()); if(hist.length > 12) hist.shift(); }
function restaurer(){
  const d = hist.pop(); if(!d) return;
  const img = new Image();
  img.onload = ()=>{ ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;
                     ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0); };
  img.src = d;
}
function reglages(){
  if(gomme){
    ctx.globalCompositeOperation = "destination-out";
    ctx.globalAlpha = 1; ctx.lineWidth = 26*mult*echelle;
  }else{
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = outil.alpha; ctx.strokeStyle = outil.couleur;
    ctx.lineWidth = outil.taille*mult*echelle;
  }
}
function segment(a,b,c){
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(b.x,b.y,c.x,c.y); ctx.stroke();
  if(outil.grain && !gomme){
    ctx.globalAlpha = outil.alpha*.5;
    ctx.beginPath();
    ctx.moveTo(a.x+.8,a.y-.8); ctx.quadraticCurveTo(b.x+.8,b.y-.8,c.x+.8,c.y-.8); ctx.stroke();
    ctx.globalAlpha = outil.alpha;
  }
}

/* ---------- Zoom et déplacement ---------- */
const plan = document.getElementById("plan"), zoomEl = document.getElementById("zoom");
const niveau = document.getElementById("niveau");
let z = 1, px = 0, py = 0;
const doigts = new Map();
let pince = null;

function appliquer(){
  const b = plan.getBoundingClientRect();
  const maxX = (z-1)*b.width/2, maxY = (z-1)*b.height/2;
  px = Math.max(-maxX, Math.min(maxX, px));
  py = Math.max(-maxY, Math.min(maxY, py));
  zoomEl.style.transform = `translate(${px}px, ${py}px) scale(${z})`;
  niveau.textContent = Math.round(z*100) + " %";
}
function zoomer(nz){
  nz = Math.max(1, Math.min(6, nz));
  px *= nz/z; py *= nz/z; z = nz;
  appliquer();
}
document.getElementById("plus").addEventListener("click", ()=> zoomer(z*1.4));
document.getElementById("moins").addEventListener("click", ()=> zoomer(z/1.4));
niveau.addEventListener("click", ()=>{ px = py = 0; zoomer(1); });
plan.addEventListener("wheel", e=>{ e.preventDefault(); zoomer(z * (e.deltaY < 0 ? 1.12 : 1/1.12)); }, {passive:false});

/* ---------- Pointeurs ---------- */
cv.addEventListener("pointerdown", e=>{
  doigts.set(e.pointerId, e);
  if(doigts.size >= 2){ finTrait(true); return; }
  cv.setPointerCapture(e.pointerId);
  memoriser(); dessine = true; reglages();
  if(sonActif){ const a = audio(); if(a){ a.resume(); timbre(); frotte(6); } }
  const p = pos(e); pts = [p,p];
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+.1,p.y); ctx.stroke();
});

plan.addEventListener("pointerdown", e=>{ if(e.target !== cv) doigts.set(e.pointerId, e); });

function centre(a,b){ return { x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2 }; }
function ecart(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }

plan.addEventListener("pointermove", e=>{
  if(doigts.has(e.pointerId)) doigts.set(e.pointerId, e);
  if(doigts.size < 2) return;
  const [a,b] = [...doigts.values()];
  const c = centre(a,b), d = ecart(a,b);
  if(!pince){
    const r = zoomEl.getBoundingClientRect();
    pince = { d, z, px, py, c, cx:r.left + r.width/2 - px, cy:r.top + r.height/2 - py };
    return;
  }
  const nz = Math.max(1, Math.min(6, pince.z * d/pince.d));
  const ox = (pince.c.x - pince.cx - pince.px)/pince.z;
  const oy = (pince.c.y - pince.cy - pince.py)/pince.z;
  px = c.x - pince.cx - nz*ox;
  py = c.y - pince.cy - nz*oy;
  z = nz;
  appliquer();
}, {passive:true});

cv.addEventListener("pointermove", e=>{
  if(!dessine || doigts.size >= 2) return;
  const p = pos(e); pts.push(p);
  const n = pts.length;
  const a = { x:(pts[n-3].x+pts[n-2].x)/2, y:(pts[n-3].y+pts[n-2].y)/2 };
  const c = { x:(pts[n-2].x+p.x)/2, y:(pts[n-2].y+p.y)/2 };
  segment(a, pts[n-2], c);
  frotte(Math.hypot(p.x-pts[n-2].x, p.y-pts[n-2].y) / echelle / (z||1) * 2);
});

function finTrait(annuler){
  if(dessine && annuler) restaurer();
  dessine = false; pts = []; silence();
}
["pointerup","pointercancel","pointerleave"].forEach(t=>{
  cv.addEventListener(t, e=>{ doigts.delete(e.pointerId); if(doigts.size < 2) pince = null; finTrait(false); });
  plan.addEventListener(t, e=>{ doigts.delete(e.pointerId); if(doigts.size < 2) pince = null; });
});

/* ---------- Choix des outils ---------- */
const btnGomme = document.getElementById("gomme");
function choisir(i){
  iOutil = i; outil = OUTILS[i]; gomme = false;
  btnGomme.setAttribute("aria-pressed","false");
  document.querySelectorAll(".crayon").forEach((g,j)=>
    g.setAttribute("transform", basePos(j) + (j===i ? " translate(16 0)" : "")));
}
document.querySelectorAll(".crayon").forEach(g=>
  g.addEventListener("click", ()=> choisir(+g.dataset.i)));

btnGomme.addEventListener("click", ()=>{
  gomme = !gomme;
  btnGomme.setAttribute("aria-pressed", String(gomme));
  if(gomme) document.querySelectorAll(".crayon").forEach((g,j)=> g.setAttribute("transform", basePos(j)));
  else choisir(iOutil);
});

document.querySelectorAll("[data-taille]").forEach(b=>
  b.addEventListener("click", ()=>{
    mult = +b.dataset.taille;
    document.querySelectorAll("[data-taille]").forEach(o=> o.setAttribute("aria-pressed", String(o===b)));
  }));

const btnSon = document.getElementById("son");
btnSon.addEventListener("click", ()=>{
  sonActif = !sonActif;
  btnSon.setAttribute("aria-pressed", String(sonActif));
  if(!sonActif) silence(); else audio();
});

document.getElementById("annuler").addEventListener("click", restaurer);
document.getElementById("vider").addEventListener("click", ()=>{
  memoriser(); ctx.clearRect(0,0,cv.width,cv.height);
});
document.getElementById("garder").addEventListener("click", ()=>{
  const t = document.createElement("canvas");
  t.width = cv.width; t.height = cv.height;
  const c = t.getContext("2d");
  c.fillStyle = "#fdfbf3"; c.fillRect(0,0,t.width,t.height);
  c.drawImage(cv,0,0);
  const a = document.createElement("a");
  a.download = "dessin.png"; a.href = t.toDataURL("image/png"); a.click();
});

dimensionner();
choisir(0);
appliquer();
</script>
</body>
</html>
