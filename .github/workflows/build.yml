name: Construire l'APK de la chambre

# Un seul geste : pousser le code, ou deposer ChambreRudy-maj.zip a la racine.
# Le workflow recupere les coeurs libretro deja compiles pour Android, puis
# compile et publie l'APK.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Dolphin compile son moteur C++ en entier : c'est long, et le delai par
    # defaut ne suffirait pas.
    timeout-minutes: 180

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Deballer les mises a jour, s'il y en a
        run: |
          set -e
          archives=$(ls ChambreRudy-maj*.zip 2>/dev/null || true)
          if [ -z "$archives" ]; then
            echo "Aucune archive : on compile le code deja present."
            exit 0
          fi

          echo "Archives trouvees :"; echo "$archives"
          rm -rf /tmp/maj && mkdir -p /tmp/maj
          for a in $archives; do
            echo "  deballage de $a"
            unzip -o -q "$a" -d /tmp/maj || {
              echo "::error::archive illisible : $a (envoi interrompu ? a redeposer)"
              exit 1
            }
          done
          rm -rf /tmp/maj/.github        # le workflow ne se remplace jamais lui-meme

          # Les envois arrivent en plusieurs fois : on n'efface pas le code.
          # On supprime seulement ce qui est nomme dans a_supprimer.txt.
          if [ -f /tmp/maj/a_supprimer.txt ]; then
            while IFS= read -r chemin; do
              [ -n "$chemin" ] || continue
              case "$chemin" in \#*) continue ;; esac
              if [ -e "$chemin" ]; then
                echo "  suppression : $chemin"
                rm -rf "$chemin"
              else
                echo "  deja absent : $chemin"
              fi
            done < /tmp/maj/a_supprimer.txt
            rm -f /tmp/maj/a_supprimer.txt
          fi

          cp -r /tmp/maj/. .
          rm -f ChambreRudy-maj*.zip

          # Ranger les fichiers dans le depot. Un envoi peut arriver pendant
          # que la compilation tourne : dans ce cas le rangement est refuse,
          # on se remet a jour et on reessaie. Et si cela echoue quand meme,
          # ce n'est pas une raison d'arreter : les fichiers sont deja en
          # place pour cette compilation.
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Mise a jour depuis les archives" || echo "Rien de nouveau a ranger."

          # Le rangement peut echouer pour des raisons qui ne nous regardent
          # pas : un envoi arrive en meme temps, ou GitHub lui-meme flanche
          # (« remote: fatal error in commit_refs »). Ce n'est jamais une
          # raison d'arreter : les fichiers sont deja en place pour compiler.
          range=non
          for essai in 1 2 3; do
            if git push 2>/tmp/push.log; then range=oui; break; fi
            echo "  rangement refuse (essai $essai) :"; cat /tmp/push.log
            git pull --rebase --autostash || true
            sleep 5
          done
          if [ "$range" = non ]; then
            echo "::warning::Les fichiers n'ont pas pu etre ranges dans le depot"
            echo "::warning::(panne passagere de GitHub). La compilation continue"
            echo "::warning::avec eux, et l'APK sera bien produit."
          fi
          exit 0

      - name: Installer le NDK que Dolphin reclame
        run: |
          if [ -f SkinGC-corrige.zip ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;29.0.14206865" "cmake;3.22.1" >/dev/null
            echo "NDK 29.0.14206865 et CMake 3.22.1 installes"
          fi

      - name: Preparer l'emulateur GameCube et Wii de Rudy
        run: |
          set -e
          : > rapport_dolphin.txt
          if [ ! -f SkinGC-corrige.zip ]; then
            echo "Dolphin : SkinGC-corrige.zip ABSENT a la racine" >> rapport_dolphin.txt
            echo "pas de SkinGC-corrige.zip : la GameCube et la Wii ne seront pas dans cet APK."
            exit 0
          fi
          echo "Dolphin : archive trouvee" >> rapport_dolphin.txt

          rm -f applications_emulateurs.txt
          echo "habillage GameCube trouve : on prepare Dolphin 2606"
          rm -rf /tmp/skingc dolphinbase
          mkdir -p /tmp/skingc
          unzip -q SkinGC-corrige.zip -d /tmp/skingc
          if [ ! -f /tmp/skingc/patch/apply.py ]; then
            echo "Dolphin : patch/apply.py manque dans l archive" >> rapport_dolphin.txt
            echo "::error::archive SkinGC incorrecte : patch/apply.py manque"; exit 1
          fi

          # Ses gestes, dans son ordre, mot pour mot.
          git clone --branch 2606 --depth 1 --recurse-submodules --shallow-submodules \
            --quiet https://github.com/dolphin-emu/dolphin.git dolphinbase
          find dolphinbase/Externals -path '*/examples/*/gradle/wrapper/gradle-wrapper.jar' -delete
          find dolphinbase/Externals -path '*/android-project/gradle/wrapper/gradle-wrapper.jar' -delete
          test -f dolphinbase/Source/Android/gradle/wrapper/gradle-wrapper.jar

          cp -r /tmp/skingc/skin /tmp/skingc/icons /tmp/skingc/patch dolphinbase/
          echo "Dolphin : depot clone" >> rapport_dolphin.txt
          if ! ( cd dolphinbase && python3 patch/apply.py ) 2> /tmp/apply.err; then
            echo "Dolphin : son apply.py a echoue —" >> rapport_dolphin.txt
            tail -3 /tmp/apply.err | cut -c1-120 >> rapport_dolphin.txt
            echo "::warning::son patch/apply.py ne s'applique pas sur Dolphin 2606."
            rm -rf dolphinbase; exit 0
          fi
          echo "Dolphin : ses pads installes" >> rapport_dolphin.txt
          echo "pads SkinGC installes dans Dolphin"

      - name: Compiler Dolphin a part, avec SON Gradle
        run: |
          set -e
          [ -d dolphinbase/Source/Android ] || exit 0

          # Dolphin garde SA configuration : sa version d'Android Gradle, son
          # catalogue de versions, ses greffons. On ne melange rien avec celle
          # de la Chambre — c'est exactement ce que fait son propre workflow.
          #
          # Seule difference : son module « app » devient une bibliotheque, de
          # sorte qu'il produise un .aar au lieu d'un APK. Cette bibliotheque
          # porte tout : ses classes, ses ressources, ses assets et ses
          # bibliotheques natives. La Chambre n'aura plus qu'a l'embarquer.
          # L'essai a parle : compile tel quel, son projet produit un APK de
          # 33 Mo. Son apply.py et Dolphin 2606 s'entendent donc parfaitement,
          # et le seul defaut etait ma transformation en bibliotheque.
          #
          # On la remet, et l'on dit ce qu'elle a change : si elle ne mord pas
          # sur son fichier, cela se verra au lieu d'echouer en silence.
          python3 outils/dolphin_en_bibliotheque.py dolphinbase/Source/Android \
            | tee -a "$GITHUB_WORKSPACE/rapport_dolphin.txt"
          if grep -qE "com\.android\.library|plugins\.android\.library" \
               dolphinbase/Source/Android/app/build.gradle.kts 2>/dev/null; then
            echo "Dolphin : son module est devenu bibliotheque" \
              >> "$GITHUB_WORKSPACE/rapport_dolphin.txt"
          else
            echo "Dolphin : ATTENTION son module est reste application" \
              >> "$GITHUB_WORKSPACE/rapport_dolphin.txt"
          fi

          cd dolphinbase/Source/Android
          # Une bibliotheque Android se construit avec cette tache exacte.
          # assembleDebug pouvait reussir sans emballer l'AAR et le workflow
          # publiait alors une RetroRom sans les ecrans de Dolphin.
          if ! ./gradlew :app:bundleDebugAar --no-daemon --stacktrace > /tmp/dolphin.log 2>&1; then
            echo "=== CAUSE DOLPHIN (a lire) ==="
            # Le bas de la trace Gradle ne dit rien. La cause est toujours
            # plus haut ; on l'extrait en premier, lisible sur le telephone.
            grep -n -E "^e: |^ERROR:|FAILURE:|What went wrong|Caused by:|Script compilation error|Unresolved reference|Could not|not found" \
              /tmp/dolphin.log | head -30 || true
            echo "=== CONTEXTE DE LA CAUSE ==="
            sed -n "/FAILURE: Build failed/,/BUILD FAILED/p" /tmp/dolphin.log | head -80 || true
            echo "=== FIN DE TRACE ==="
            tail -30 /tmp/dolphin.log
            echo "Dolphin : echec de creation de son AAR" >> "$GITHUB_WORKSPACE/rapport_dolphin.txt"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          aar=$(find dolphinbase/Source/Android/app/build/outputs/aar \
            -name "*-debug.aar" -type f | head -1)
          if [ -z "$aar" ] || [ ! -s "$aar" ]; then
            echo "::error::Dolphin n'a pas produit app-debug.aar. Pas d'APK RetroRom publiee."
            find dolphinbase/Source/Android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p app/libs
          cp "$aar" app/libs/dolphin.aar
          touch .dolphin_complet_integre
          echo "Dolphin compile : $(du -h app/libs/dolphin.aar | cut -f1)"
          echo "Dolphin : bibliotheque produite ($(du -h app/libs/dolphin.aar | cut -f1))" \
            >> rapport_dolphin.txt

      - name: Preparer l'emulateur N64 de Rudy
        run: |
          set -e
          if [ ! -f 64-eMule-Skin64-V7.zip ]; then
            echo "pas de 64-eMule-Skin64-V7.zip : la N64 ne sera pas dans cet APK."
            exit 0
          fi

          # Ce que decrit son README : Mupen64Plus-AE d'origine, a la
          # revision de l'APK N64-Pad-V8 qui fonctionnait. Son build.gradle le
          # confirme — identifiant org.mupen64plusae.v3.alpha, aucune variante.
          echo "habillage N64 trouve : on prepare Mupen64Plus-AE"
          rm -rf m64base
          git clone --filter=blob:none --quiet \
            https://github.com/mupen64plus-ae/mupen64plus-ae.git m64base
          # La revision de son README : « la meme que l'APK N64-Pad-V8
          # fonctionnel ». Son correctif a ete ecrit pour celle-la.
          git -C m64base checkout --quiet 33bf7021549d7873e976884370fbd1a8e7333bc7
          git -C m64base submodule update --init --recursive --depth 1 --quiet || true

          rm -rf paquet-n64 && mkdir -p paquet-n64
          unzip -q 64-eMule-Skin64-V7.zip -d paquet-n64
          marque=$(find paquet-n64 -type f -name SKIN64_EMULE_V7 -print -quit)
          if [ -z "$marque" ]; then echo "::error::habillage N64 incomplet"; exit 1; fi
          cp -a "$(dirname "$marque")"/. m64base/

          # Son catalogue demande lui aussi l'acces aux fichiers au demarrage.
          # Depuis Android 11 l'ecriture externe ne peut plus etre accordee :
          # Rudy voit la fenetre, il autorise, et cela echoue quand meme.
          #
          # Cet outil repond « oui » a ses questions, sans jamais toucher a
          # ses instructions : une expression remplacee par une autre, donc
          # la structure du fichier ne bouge pas. Il refuse d'ecrire si les
          # accolades ne correspondent plus.
          #
          # Rien n'est perdu : la Chambre pose la cartouche dans le dossier
          # externe de l'application, qui n'exige aucune autorisation.
          python3 outils/n64_dire_oui.py m64base


          # il devient un morceau de notre application, et non une application
          gradle_app=m64base/app/build.gradle
          [ -f "$gradle_app" ] || gradle_app=m64base/app/build.gradle.kts
          echo "=== verification : pas deux versions d'un meme ecran ==="
          doublons=$(find app/src/main/java -name '*.kt' -exec basename {} \; | sort | uniq -d)
          if [ -n "$doublons" ]; then
            echo "::warning::fichiers portant le meme nom :"; echo "$doublons"
          fi

          # le fichier racine d'abord : il porte les valeurs partagees
          # (« ext { minSdkVersion = 26 } »), reprises par tous les modules
          if [ -f m64base/build.gradle ]; then
            python3 outils/adapter_n64.py m64base/build.gradle
          fi

          for module in m64base/*/; do
            g="$module/build.gradle"
            [ -f "$g" ] || g="$module/build.gradle.kts"
            [ -f "$g" ] || continue
            mf="$module/src/main/AndroidManifest.xml"
            if [ -f "$mf" ]; then
              python3 outils/adapter_n64.py "$g" "$mf"
            else
              python3 outils/adapter_n64.py "$g"
            fi
          done
          echo "N64 prete a etre compilee avec l'application"

      - name: Recuperer les coeurs d'emulation
        run: |
          set -e
          # console : nom du coeur chez libretro -> nom attendu par l'application
          liste="
          snes9x:libsnes9x
          gambatte:libgambatte
          mgba:libmgba
          genesis_plus_gx:libgenesisplusgx
          pcsx_rearmed:libpcsx
          flycast:libflycast
          melondsds:libmelonds
          dolphin:libdolphin
          ppsspp:libppsspp
          citra:libcitra
          "
          manquants=""
          for abi in arm64-v8a; do
            mkdir -p app/src/main/jniLibs/$abi
            for paire in $liste; do
              coeur="${paire%%:*}"; cible="${paire##*:}"
              url="https://buildbot.libretro.com/nightly/android/latest/$abi/${coeur}_libretro_android.so.zip"
              rm -rf /tmp/c /tmp/c.zip
              if curl -fL --retry 3 -o /tmp/c.zip "$url"; then
                unzip -o -q /tmp/c.zip -d /tmp/c || true
                # on ne suppose pas le nom du fichier : on prend le premier .so trouve
                trouve=$(find /tmp/c -name '*.so' | head -1 || true)
                if [ -n "$trouve" ]; then
                  mv "$trouve" app/src/main/jniLibs/$abi/${cible}.so
                else
                  manquants="$manquants $abi/$cible(archive vide)"
                fi
              else
                manquants="$manquants $abi/$cible(telechargement)"
              fi
            done
            echo "=== coeurs presents pour $abi ==="
            ls -la app/src/main/jniLibs/$abi/
          done
          if [ -n "$manquants" ]; then
            echo "::warning::Coeurs absents de cet APK :$manquants"
          fi

      - name: Monter le moteur PSP
        run: |
          set -e
          if [ -f moteur-psp.zip ]; then
            rm -rf /tmp/psp && mkdir -p /tmp/psp
            unzip -o -q moteur-psp.zip -d /tmp/psp
            src=/tmp/psp/lib/arm64-v8a
            if [ ! -f "$src/libppsspp_jni.so" ]; then
              echo "::error::moteur-psp.zip ne contient pas lib/arm64-v8a/libppsspp_jni.so"
              find /tmp/psp -name "*.so" | head -10
              exit 1
            fi
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp "$src/libppsspp_jni.so" app/src/main/jniLibs/arm64-v8a/
            # on NE copie PAS son libc++_shared.so : la chaine de compilation
            # en fournit deja une, et Android refuse d'en embarquer deux
            rm -f app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          else
            echo "::error::moteur-psp.zip est absent de la racine du depot."
            echo "Sans lui le PSP affichera « The native part of PPSSPP is missing »."
            echo "Depose-le, puis relance la compilation."
            exit 1
          fi

      - name: Verifier ce que l'application embarque
        run: |
          echo "=== bibliotheques natives arm64-v8a ==="
          ls -la app/src/main/jniLibs/arm64-v8a/ || true
          manquants=""
          for f in libsnes9x.so libgambatte.so libmgba.so libgenesisplusgx.so \
                   libpcsx.so libflycast.so libmelonds.so libcitra.so \
                   libdolphin.so libppsspp_jni.so; do
            [ -f "app/src/main/jniLibs/arm64-v8a/$f" ] || manquants="$manquants $f"
          done
          if [ -n "$manquants" ]; then
            echo "::warning::consoles sans moteur dans cet APK :$manquants"
          else
            echo "tous les coeurs sont la"
          fi

          # on ecrit le bilan dans l'application : lisible depuis le telephone
          rapport=app/src/main/assets/chambre/assemblage.txt
          : > "$rapport"
          for f in app/src/main/jniLibs/arm64-v8a/*.so; do
            [ -e "$f" ] || continue
            echo "$(basename "$f") $(( $(stat -c%s "$f") / 1048576 )) Mo" >> "$rapport"
          done
          if [ -d m64base/app ]; then
            echo "Nintendo 64 : Mupen64Plus assemble" >> "$rapport"
          else
            echo "Nintendo 64 : ABSENT (depose 64-eMule-Skin64-V7.zip)" >> "$rapport"
          fi
          if [ -f .dolphin_complet_integre ] && [ -s app/libs/dolphin.aar ]; then
            echo "GameCube / Wii : Dolphin complet integre" >> "$rapport"
          else
            echo "GameCube / Wii : Dolphin complet ABSENT" >> "$rapport"
          fi
          if [ -s applications_emulateurs.txt ]; then
            sort -u applications_emulateurs.txt \
              > app/src/main/assets/chambre/applications_emulateurs.txt
            echo "applications d'emulateurs a reveiller :"
            cat app/src/main/assets/chambre/applications_emulateurs.txt
          fi
          # le compte rendu des autorisations de la N64, mis de cote plus tot :
          # c'est dans ce bilan que Rudy le lit, par l'appui long sur la tele
          if [ -f rapport_n64.txt ]; then
            cat rapport_n64.txt >> "$rapport"
          fi
          if [ -f rapport_dolphin.txt ]; then
            cat rapport_dolphin.txt >> "$rapport"
          fi
          echo "compile le $(date -u '+%d/%m %H:%M') UTC" >> "$rapport"

          echo "=== emulateurs assembles depuis leur projet ==="
          if [ -d m64base/app ]; then
            echo "  Nintendo 64 : Mupen64Plus present"
          else
            echo "::warning::Nintendo 64 ABSENTE : depose 64-eMule-Skin64-V7.zip a la racine du depot"
          fi
          if [ -d dolphinbase/Source/Android ]; then
            echo "  GameCube / Wii : Dolphin present"
          else
            echo "::warning::GameCube / Wii : Dolphin pas encore integre"
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler
        run: |
          set -o pipefail

          compiler() {
            gradle assembleDebug --continue --no-daemon --stacktrace 2>&1 \
              | tee /tmp/compilation.log
          }

          releve() {
            echo "=== erreurs relevees ==="
            {
              grep -E "^e: |^ERROR:|error:" /tmp/compilation.log | head -30 || true
              grep -E "Manifest merger|is also present at|Suggestion:" /tmp/compilation.log | head -12 || true
              grep -E "^> Task .* FAILED" /tmp/compilation.log | head -10 || true
              sed -n "/What went wrong/,/^\* Try/p" /tmp/compilation.log | head -30 || true
            } | sort -u | while read -r ligne; do
              [ -n "$ligne" ] && echo "::error::$ligne"
            done
          }

          if compiler; then
            echo "compilation reussie"
            exit 0
          fi

          releve

          # Deuxieme chance : la N64 est le morceau le plus fragile. Si elle
          # fait tout echouer, on la met de cote et on recompile sans elle.
          # Mieux vaut une application sans N64 que pas d'application du tout.
          if [ -d m64base ]; then
            echo "::warning::La Nintendo 64 fait echouer la compilation :"
            echo "::warning::on la met de cote et on recompile sans elle."
            rm -rf m64base
            sed -i "/Nintendo 64 : Mupen64Plus assemble/d" \
              app/src/main/assets/chambre/assemblage.txt 2>/dev/null || true
            echo "Nintendo 64 : ECARTEE (elle faisait echouer la compilation)" \
              >> app/src/main/assets/chambre/assemblage.txt
            # La vraie raison, gardee dans l'APK : sans elle, impossible de
            # comprendre depuis le telephone pourquoi elle a ete mise de cote.
            {
              echo "--- pourquoi la N64 a ete ecartee ---"
              grep -E "^e: |^ERROR:|error:|Manifest merger|is also present at|Suggestion:|Caused by:" \
                /tmp/compilation.log | grep -v "^$" | head -8 | cut -c1-190
              sed -n "/What went wrong/,/^\* Try/p" /tmp/compilation.log | head -6 | cut -c1-190
            } >> app/src/main/assets/chambre/assemblage.txt 2>/dev/null || true
            if compiler; then
              echo "::warning::APK produit SANS la Nintendo 64."
              exit 0
            fi
            echo "::error::la compilation echoue meme sans la Nintendo 64 :"
            releve
          fi
          exit 1

      - name: Verifier que les emulateurs sont bien dans l'APK
        run: |
          set -e
          manifeste=$(find app/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1)
          if [ -n "$manifeste" ]; then
            echo "=== ecrans presents dans l'APK ==="
            grep -o 'android:name="[a-z0-9.]*\(Activity\|SplashActivity\)"' "$manifeste" | sort -u | head -30
            if [ -d m64base/app ]; then
              if grep -q "mupen64plusae" "$manifeste"; then
                echo "  Nintendo 64 : son ecran est dans l'APK"
              else
                echo "::error::Mupen64Plus a ete prepare mais n'est PAS dans l'APK"
                exit 1
              fi
            fi
            # Cette verification empeche de publier une Chambre qui pretendra
            # lancer Dolphin alors que seul libdolphin.so (l'ancien coeur
            # libretro) a ete embarque. Il faut l'activite du vrai Dolphin,
            # celle qui donne acces a ses menus et aux pads SkinGC.
            if [ -f .dolphin_complet_integre ]; then
              apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
              if [ -z "$apk" ] || ! unzip -p "$apk" classes*.dex 2>/dev/null | \
                    strings | grep -q 'org/dolphinemu/dolphinemu/activities/EmulationActivity'; then
                echo "::error::Dolphin a ete prepare mais son ecran complet manque dans l'APK."
                exit 1
              fi
              echo "  GameCube / Wii : ecran Dolphin complet present dans l'APK"
            fi
          fi

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ChambreRudy-apk
          path: app/build/outputs/apk/debug/*.apk
