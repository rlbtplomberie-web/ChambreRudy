name: Construire l'APK de la chambre

# Un seul geste : pousser le code, ou deposer ChambreRudy-maj.zip a la racine.
# Le workflow recupere les coeurs libretro deja compiles pour Android, puis
# compile et publie l'APK.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Deballer les mises a jour, s'il y en a
        run: |
          set -e
          archives=$(ls ChambreRudy-maj*.zip 2>/dev/null || true)
          if [ -n "$archives" ]; then
            echo "Archives trouvees :"; echo "$archives"
            mkdir -p /tmp/maj
            for a in $archives; do
              echo "  deballage de $a"
              unzip -o -q "$a" -d /tmp/maj
            done
            rm -rf /tmp/maj/.github        # le workflow ne se remplace jamais lui-meme

            # Les envois peuvent arriver en plusieurs fois : on n'efface donc
            # plus tout le code. On supprime seulement ce qui est nomme dans
            # a_supprimer.txt, la liste des fichiers devenus inutiles.
            if [ -f /tmp/maj/a_supprimer.txt ]; then
              while IFS= read -r chemin; do
                [ -n "$chemin" ] || continue
                echo "  suppression : $chemin"
                rm -rf "$chemin"
              done < /tmp/maj/a_supprimer.txt
              rm -f /tmp/maj/a_supprimer.txt
            fi

            cp -r /tmp/maj/. .
            rm -f ChambreRudy-maj*.zip

            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Mise a jour depuis les archives" || echo "Rien de nouveau."
            git push
          else
            echo "Aucune archive : on compile le code deja present."
          fi

      - name: Preparer l'emulateur N64 de Rudy
        run: |
          set -e
          if [ ! -f 64-eMule-Skin64-V7.zip ]; then
            echo "pas de 64-eMule-Skin64-V7.zip : la N64 ne sera pas dans cet APK."
            exit 0
          fi

          echo "habillage N64 trouve : on prepare Mupen64Plus"
          rm -rf m64base
          git clone --filter=blob:none --quiet \
            https://github.com/mupen64plus-ae/mupen64plus-ae.git m64base
          git -C m64base checkout --quiet 33bf7021549d7873e976884370fbd1a8e7333bc7
          git -C m64base submodule update --init --recursive --depth 1 --quiet || true

          rm -rf paquet-n64 && mkdir -p paquet-n64
          unzip -q 64-eMule-Skin64-V7.zip -d paquet-n64
          marque=$(find paquet-n64 -type f -name SKIN64_EMULE_V7 -print -quit)
          if [ -z "$marque" ]; then echo "::error::habillage N64 incomplet"; exit 1; fi
          cp -a "$(dirname "$marque")"/. m64base/

          # il devient un morceau de notre application, et non une application
          gradle_app=m64base/app/build.gradle
          [ -f "$gradle_app" ] || gradle_app=m64base/app/build.gradle.kts
          for module in m64base/*/; do
            g="$module/build.gradle"
            [ -f "$g" ] || g="$module/build.gradle.kts"
            [ -f "$g" ] || continue
            mf="$module/src/main/AndroidManifest.xml"
            if [ -f "$mf" ]; then
              python3 outils/adapter_n64.py "$g" "$mf"
            else
              python3 outils/adapter_n64.py "$g"
            fi
          done
          echo "N64 prete a etre compilee avec l'application"

      - name: Recuperer les coeurs d'emulation
        run: |
          set -e
          # console : nom du coeur chez libretro -> nom attendu par l'application
          liste="
          snes9x:libsnes9x
          gambatte:libgambatte
          mgba:libmgba
          genesis_plus_gx:libgenesisplusgx
          pcsx_rearmed:libpcsx
          flycast:libflycast
          melondsds:libmelonds
          dolphin:libdolphin
          ppsspp:libppsspp
          citra:libcitra
          "
          manquants=""
          for abi in arm64-v8a; do
            mkdir -p app/src/main/jniLibs/$abi
            for paire in $liste; do
              coeur="${paire%%:*}"; cible="${paire##*:}"
              url="https://buildbot.libretro.com/nightly/android/latest/$abi/${coeur}_libretro_android.so.zip"
              rm -rf /tmp/c /tmp/c.zip
              if curl -fL --retry 3 -o /tmp/c.zip "$url"; then
                unzip -o -q /tmp/c.zip -d /tmp/c || true
                # on ne suppose pas le nom du fichier : on prend le premier .so trouve
                trouve=$(find /tmp/c -name '*.so' | head -1 || true)
                if [ -n "$trouve" ]; then
                  mv "$trouve" app/src/main/jniLibs/$abi/${cible}.so
                else
                  manquants="$manquants $abi/$cible(archive vide)"
                fi
              else
                manquants="$manquants $abi/$cible(telechargement)"
              fi
            done
            echo "=== coeurs presents pour $abi ==="
            ls -la app/src/main/jniLibs/$abi/
          done
          if [ -n "$manquants" ]; then
            echo "::warning::Coeurs absents de cet APK :$manquants"
          fi

      - name: Monter le moteur PSP
        run: |
          set -e
          if [ -f moteur-psp.zip ]; then
            rm -rf /tmp/psp && mkdir -p /tmp/psp
            unzip -o -q moteur-psp.zip -d /tmp/psp
            src=/tmp/psp/lib/arm64-v8a
            if [ ! -f "$src/libppsspp_jni.so" ]; then
              echo "::error::moteur-psp.zip ne contient pas lib/arm64-v8a/libppsspp_jni.so"
              find /tmp/psp -name "*.so" | head -10
              exit 1
            fi
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp "$src/libppsspp_jni.so" app/src/main/jniLibs/arm64-v8a/
            # on NE copie PAS son libc++_shared.so : la chaine de compilation
            # en fournit deja une, et Android refuse d'en embarquer deux
            rm -f app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          else
            echo "::error::moteur-psp.zip est absent de la racine du depot."
            echo "Sans lui le PSP affichera « The native part of PPSSPP is missing »."
            echo "Depose-le, puis relance la compilation."
            exit 1
          fi

      - name: Verifier ce que l'application embarque
        run: |
          echo "=== bibliotheques natives arm64-v8a ==="
          ls -la app/src/main/jniLibs/arm64-v8a/ || true
          manquants=""
          for f in libsnes9x.so libgambatte.so libmgba.so libgenesisplusgx.so \
                   libpcsx.so libflycast.so libmelonds.so libcitra.so \
                   libdolphin.so libppsspp_jni.so; do
            [ -f "app/src/main/jniLibs/arm64-v8a/$f" ] || manquants="$manquants $f"
          done
          if [ -n "$manquants" ]; then
            echo "::warning::consoles sans moteur dans cet APK :$manquants"
          else
            echo "tous les coeurs sont la"
          fi

          echo "=== emulateurs assembles depuis leur projet ==="
          if [ -d m64base/app ]; then
            echo "  Nintendo 64 : Mupen64Plus present"
          else
            echo "::warning::Nintendo 64 ABSENTE : depose 64-eMule-Skin64-V7.zip a la racine du depot"
          fi
          if [ -d dolphin/Source/Android ]; then
            echo "  GameCube / Wii : Dolphin present"
          else
            echo "::warning::GameCube / Wii : Dolphin pas encore integre"
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ChambreRudy-apk
          path: app/build/outputs/apk/debug/*.apk
