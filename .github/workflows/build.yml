name: Construire l'APK de la chambre

# Un seul geste : pousser le code, ou deposer ChambreRudy-maj.zip a la racine.
# Le workflow recupere les coeurs libretro deja compiles pour Android, puis
# compile et publie l'APK.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Deballer la mise a jour, s'il y en a une
        run: |
          set -e
          # on accepte n'importe quel nom commencant par ChambreRudy-maj :
          # le telephone ajoute parfois "(1)" quand le fichier existe deja
          archive=$(ls -t ChambreRudy-maj*.zip 2>/dev/null | head -1 || true)
          if [ -n "$archive" ]; then
            echo "Archive trouvee : $archive"
            mkdir -p /tmp/maj
            unzip -o -q "$archive" -d /tmp/maj
            rm -rf /tmp/maj/.github          # le workflow ne se remplace jamais lui-meme

            # on efface l'ancien code avant de poser le neuf :
            # ainsi un fichier supprime chez moi disparait aussi du depot
            rm -rf app/src/main/java app/src/main/assets app/src/main/cpp app/src/main/res

            cp -r /tmp/maj/. .
            rm -f ChambreRudy-maj*.zip       # et on retire les archives du depot

            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Mise a jour depuis $archive" || echo "Rien de nouveau."
            git push
          else
            echo "Aucune archive : on compile le code deja present."
          fi

      - name: Recuperer les coeurs d'emulation
        run: |
          set -e
          # console : nom du coeur chez libretro -> nom attendu par l'application
          liste="
          snes9x:libsnes9x
          gambatte:libgambatte
          mgba:libmgba
          genesis_plus_gx:libgenesis
          pcsx_rearmed:libpcsx
          ppsspp:libppsspp
          flycast:libflycast
          melondsds:libmelonds
          citra:libcitra
          "
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            for paire in $liste; do
              coeur="${paire%%:*}"; cible="${paire##*:}"
              url="https://buildbot.libretro.com/nightly/android/latest/$abi/${coeur}_libretro_android.so.zip"
              if curl -fL --retry 3 -o /tmp/c.zip "$url"; then
                unzip -o -q /tmp/c.zip -d /tmp/c
                # Android n'extrait que les fichiers commencant par lib
                mv /tmp/c/${coeur}_libretro_android.so app/src/main/jniLibs/$abi/${cible}.so
                echo "  $abi : $cible pris"
              else
                echo "  $abi : $coeur indisponible, on continue sans"
              fi
              rm -rf /tmp/c /tmp/c.zip
            done
            ls -la app/src/main/jniLibs/$abi/
          done

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ChambreRudy-apk
          path: app/build/outputs/apk/debug/*.apk
